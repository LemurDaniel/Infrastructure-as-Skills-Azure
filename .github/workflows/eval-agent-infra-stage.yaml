# Reusable: what-if -> approve -> deploy for one stage. Prerequisites: see header of eval-agent-infra.yaml.
name: Eval-Agent Infrastructure stage

on:
  workflow_call:
    inputs:
      stage: { type: string, required: true }
      gated: { type: boolean, required: true }

permissions:
  contents: read

# Queue, never cancel: a deployment cut off halfway is how template and reality part.
concurrency:
  group: eval-agent-infra-${{ inputs.stage }}
  cancel-in-progress: false

env:
  STAGE: ${{ inputs.stage }}

defaults:
  run:
    shell: pwsh
    working-directory: eval-agent/infra

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    permissions: { contents: read, id-token: write }
    outputs:
      changes: ${{ steps.whatif.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse placeholder values
        run: |
          $f = "main.$env:STAGE.bicepparam"
          if (-not (Test-Path $f)) { Write-Output "::error::eval-agent/infra/${f} is missing"; exit 1 }
          # only real parameter lines count; comments, blank lines and 'using' are ignored
          if (Get-Content $f | Where-Object { $_ -match '^param ' } | Select-String -Pattern '00000000-0000-0000-0000-000000000000|OPEN-|ASSUMED:' -Quiet) {
            Write-Output "::error file=eval-agent/infra/${f}::Stage $env:STAGE still holds placeholder values - answer the open items of the spec first."
            exit 1
          }

      - name: Read target from the stage file
        run: |
          $f = "main.$env:STAGE.bicepparam"
          function Get-Param ([string] $name) {
            $m = Select-String -Path $f -Pattern "^param $name *= *'([^']+)'" | Select-Object -First 1
            $m ? $m.Matches[0].Groups[1].Value : ''
          }
          $sub = Get-Param subscriptionId
          $rg = Get-Param resourceGroupName
          if (-not $sub -or -not $rg) { Write-Output "::error file=eval-agent/infra/${f}::subscriptionId / resourceGroupName not found"; exit 1 }
          if ($sub -ne '${{ vars.AZURE_SUBSCRIPTION_ID }}') {
            Write-Output "::error::subscriptionId in ${f} differs from environment variable AZURE_SUBSCRIPTION_ID"; exit 1
          }
          "SUBSCRIPTION_ID=$sub" | Add-Content $env:GITHUB_ENV
          "RESOURCE_GROUP=$rg" | Add-Content $env:GITHUB_ENV

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The images belong to the separate image pipeline: keep what each web app runs now so this
      # deployment never rolls it back. Management plane only; empty on the first deployment.
      # Site names (main.bicep): app-<loc>-<env>-<workload>-<index> is the dashboard, the others carry
      # -drift-, -fuzz-, -tune- before the index. Matched on the whole name: the workload itself may
      # contain any of these words.
      - name: Resolve existing linuxFxVersions
        run: |
          # The resolved parameter file starts as a copy of the stage file.
          $f = "main.$env:STAGE.bicepparam"
          $resolved = "main.$env:STAGE.resolved.bicepparam"
          Copy-Item $f $resolved
          $m = Select-String -Path $f -Pattern "^param workload *= *'([^']+)'" | Select-Object -First 1
          if (-not $m) { Write-Output "::error file=eval-agent/infra/${f}::workload not found"; exit 1 }
          $workload = [regex]::Escape($m.Matches[0].Groups[1].Value)
          $fx = [ordered]@{ Dashboard = ''; Drift = ''; Fuzz = ''; Tune = '' }
          $exists = az group exists --subscription $env:SUBSCRIPTION_ID --name $env:RESOURCE_GROUP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($exists -eq 'true') {
            $sites = az resource list --subscription $env:SUBSCRIPTION_ID --resource-group $env:RESOURCE_GROUP `
              --resource-type Microsoft.Web/sites --query "[].{id: id, name: name}" -o json | ConvertFrom-Json
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            foreach ($site in $sites) {
              $value = az rest --method get `
                --url "https://management.azure.com$($site.id)/config/web?api-version=2024-11-01" `
                --query "properties.linuxFxVersion" -o tsv
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              if ("$value" -notlike 'DOCKER|*') { $value = '' }
              switch -Regex ($site.name) {
                "^app-.*-$workload-drift-\d\d$" { $fx.Drift = $value; break }
                "^app-.*-$workload-fuzz-\d\d$" { $fx.Fuzz = $value; break }
                "^app-.*-$workload-tune-\d\d$" { $fx.Tune = $value; break }
                "^app-.*-$workload-\d\d$" { $fx.Dashboard = $value; break }
                default { Write-Output "::warning::site $($site.name) matches no app of main.bicep - its linuxFxVersion is not kept" }
              }
            }
          }
          $params = $fx.Keys | ForEach-Object { "existing$($_)LinuxFxVersion = '$($fx[$_])'" }
          @('') + @($params | ForEach-Object { "param $_" }) | Add-Content $resolved
          $params

      - name: What-if
        id: whatif
        run: |
          az deployment group what-if --subscription $env:SUBSCRIPTION_ID --resource-group $env:RESOURCE_GROUP `
            --template-file main.bicep --parameters "main.$env:STAGE.resolved.bicepparam" `
            --no-pretty-print > whatif.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $whatif = Get-Content whatif.json -Raw | ConvertFrom-Json
          $changes = @($whatif.changes | Where-Object changeType -notin 'NoChange', 'Ignore')
          "changes=$(($changes.Count -gt 0).ToString().ToLower())" | Add-Content $env:GITHUB_OUTPUT
          $summary = @("### What-if: $env:STAGE", '```') + @($changes | ForEach-Object { "$($_.changeType)`t$($_.resourceId)" }) + '```'
          # A module whose parameters use another module's output cannot be expanded before the
          # deployment: what-if skips it and shows none of its resources.
          $skipped = @($whatif.diagnostics | Where-Object code -eq 'NestedDeploymentShortCircuited' | ForEach-Object { ($_.target -split '/')[-1] })
          if ($skipped) {
            $summary += "**Not predicted (what-if cannot expand these modules, they are deployed anyway):** $($skipped -join ', ')"
          }
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The saved plan: what-if result plus the exact parameter file the deploy will use.
      - uses: actions/upload-artifact@v7
        if: steps.whatif.outputs.changes == 'true'
        with:
          name: plan-${{ inputs.stage }}
          path: |
            eval-agent/infra/whatif.json
            eval-agent/infra/main.${{ inputs.stage }}.resolved.bicepparam
          retention-days: 1

  approve:
    needs: plan
    if: ${{ inputs.gated && needs.plan.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}-approval
    # No checkout here, so the workflow default working directory does not exist.
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - run: Write-Output "Approved for ${{ inputs.stage }}."

  apply:
    needs: [plan, approve]
    # approve is skipped on an ungated stage; !failure() lets that pass and still stops on a rejection
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plan-${{ inputs.stage }}
          path: eval-agent/infra
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The approver read a prediction: what-if is read-only and create redeploys. Same commit,
      # template and (resolved) parameter file as the plan job - nothing else is promised.
      - name: Deploy
        run: |
          $f = "main.$env:STAGE.resolved.bicepparam"
          function Get-Param ([string] $name) {
            $m = Select-String -Path $f -Pattern "^param $name *= *'([^']+)'" | Select-Object -First 1
            $m ? $m.Matches[0].Groups[1].Value : ''
          }
          $sub = Get-Param subscriptionId
          $rg = Get-Param resourceGroupName
          if (-not $sub -or -not $rg) { Write-Output "::error::target not found in ${f}"; exit 1 }
          az deployment group create --name "infra-$env:STAGE-$env:GITHUB_RUN_ID" `
            --subscription $sub --resource-group $rg `
            --template-file main.bicep --parameters $f
