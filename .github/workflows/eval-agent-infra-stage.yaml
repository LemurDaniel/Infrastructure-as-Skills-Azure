# Reusable: what-if -> approve -> deploy for one stage. Prerequisites: see header of eval-agent-infra.yaml.
name: Eval-Agent Infrastructure stage

on:
  workflow_call:
    inputs:
      stage: { type: string, required: true }
      gated: { type: boolean, required: true }

permissions:
  contents: read

# Queue, never cancel: a deployment cut off halfway is how template and reality part.
concurrency:
  group: eval-agent-infra-${{ inputs.stage }}
  cancel-in-progress: false

env:
  STAGE: ${{ inputs.stage }}

defaults:
  run:
    working-directory: eval-agent/infra

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    permissions: { contents: read, id-token: write }
    outputs:
      changes: ${{ steps.whatif.outputs.changes }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse placeholder values
        run: |
          f="main.${STAGE}.bicepparam"
          [ -f "$f" ] || { echo "::error::eval-agent/infra/$f is missing"; exit 1; }
          # only real parameter lines count; comments, blank lines and 'using' are ignored
          if grep -E '^param ' "$f" | grep -Eq '00000000-0000-0000-0000-000000000000|OPEN-'; then
            echo "::error file=eval-agent/infra/$f::Stage ${STAGE} still holds placeholder values - answer the open items of the spec first."
            exit 1
          fi

      - name: Read target from the stage file
        run: |
          f="main.${STAGE}.bicepparam"
          sub=$(sed -nE "s/^param subscriptionId *= *'([^']+)'.*/\1/p" "$f")
          rg=$(sed -nE "s/^param resourceGroupName *= *'([^']+)'.*/\1/p" "$f")
          [ -n "$sub" ] && [ -n "$rg" ] || { echo "::error file=eval-agent/infra/$f::subscriptionId / resourceGroupName not found"; exit 1; }
          if [ "$sub" != "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::subscriptionId in $f differs from environment variable AZURE_SUBSCRIPTION_ID"; exit 1
          fi
          echo "SUBSCRIPTION_ID=$sub" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$rg" >> "$GITHUB_ENV"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The vault is private (data plane unreachable from the runner): management plane only, no
      # 'az keyvault secret list'. A missing resource group / vault counts as an empty list.
      - name: Resolve existingSecretNames
        run: |
          set -euo pipefail
          names=""
          if [ "$(az group exists --subscription "$SUBSCRIPTION_ID" --name "$RESOURCE_GROUP")" = "true" ]; then
            vaults=$(az resource list --subscription "$SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.KeyVault/vaults --query "[].id" -o tsv | tr -d '\r')
            for id in $vaults; do
              names="$names"$'\n'"$(az rest --method get \
                --url "https://management.azure.com${id}/secrets?api-version=2024-11-01" \
                --query "value[].name" -o tsv | tr -d '\r')"
            done
          fi
          list=""
          for n in $(printf '%s\n' "$names" | grep -E '^[A-Za-z0-9-]+$' | sort -u || true); do
            list="${list:+$list, }'$n'"
          done
          cp "main.${STAGE}.bicepparam" "main.${STAGE}.resolved.bicepparam"
          printf '\nparam existingSecretNames = [%s]\n' "$list" >> "main.${STAGE}.resolved.bicepparam"
          echo "existingSecretNames = [$list]"

      # The images belong to the separate image pipeline: keep what each web app runs now so this
      # deployment never rolls it back. Management plane only; empty on the first deployment.
      # The agent app is named app-...-agent-<index>, the dashboard is the other one.
      - name: Resolve existing linuxFxVersions
        run: |
          set -euo pipefail
          dashboard_fx=""
          agent_fx=""
          if [ "$(az group exists --subscription "$SUBSCRIPTION_ID" --name "$RESOURCE_GROUP")" = "true" ]; then
            sites=$(az resource list --subscription "$SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
              --resource-type Microsoft.Web/sites --query "[].[id,name]" -o tsv | tr -d '\r' | tr '\t' ';')
            for site in $sites; do
              id="${site%;*}"
              name="${site#*;}"
              fx=$(az rest --method get \
                --url "https://management.azure.com${id}/config/web?api-version=2024-11-01" \
                --query "properties.linuxFxVersion" -o tsv | tr -d '\r')
              case "$fx" in 'DOCKER|'*) ;; *) fx="" ;; esac
              case "$name" in
                *-agent-*) agent_fx="$fx" ;;
                *) dashboard_fx="$fx" ;;
              esac
            done
          fi
          {
            printf "\nparam existingDashboardLinuxFxVersion = '%s'\n" "$dashboard_fx"
            printf "param existingAgentLinuxFxVersion = '%s'\n" "$agent_fx"
          } >> "main.${STAGE}.resolved.bicepparam"
          echo "existingDashboardLinuxFxVersion = '$dashboard_fx'"
          echo "existingAgentLinuxFxVersion = '$agent_fx'"

      - name: What-if
        id: whatif
        run: |
          az deployment group what-if --subscription "$SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
            --template-file main.bicep --parameters "main.${STAGE}.resolved.bicepparam" \
            --no-pretty-print > whatif.json
          n=$(jq '[.changes[] | select(.changeType != "NoChange" and .changeType != "Ignore")] | length' whatif.json)
          echo "changes=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "### What-if: ${STAGE}"
            echo '```'
            jq -r '.changes[] | select(.changeType != "NoChange" and .changeType != "Ignore") | "\(.changeType)\t\(.resourceId)"' whatif.json
            echo '```'
            # A module whose parameters use another module's output cannot be expanded before the
            # deployment: what-if skips it and shows none of its resources.
            skipped=$(jq -r '[.diagnostics[]? | select(.code == "NestedDeploymentShortCircuited") | .target | split("/") | last] | join(", ")' whatif.json)
            if [ -n "$skipped" ]; then
              echo "**Not predicted (what-if cannot expand these modules, they are deployed anyway):** ${skipped}"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The saved plan: what-if result plus the exact parameter file the deploy will use.
      - uses: actions/upload-artifact@v7
        if: steps.whatif.outputs.changes == 'true'
        with:
          name: plan-${{ inputs.stage }}
          path: |
            eval-agent/infra/whatif.json
            eval-agent/infra/main.${{ inputs.stage }}.resolved.bicepparam
          retention-days: 1

  approve:
    needs: plan
    if: ${{ inputs.gated && needs.plan.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}-approval
    # No checkout here, so the workflow default working directory does not exist.
    defaults:
      run:
        working-directory: .
    steps:
      - run: echo "Approved for ${{ inputs.stage }}."

  apply:
    needs: [plan, approve]
    # approve is skipped on an ungated stage; !failure() lets that pass and still stops on a rejection
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plan-${{ inputs.stage }}
          path: eval-agent/infra
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The approver read a prediction: what-if is read-only and create redeploys. Same commit,
      # template and (resolved) parameter file as the plan job - nothing else is promised.
      - name: Deploy
        run: |
          f="main.${STAGE}.resolved.bicepparam"
          sub=$(sed -nE "s/^param subscriptionId *= *'([^']+)'.*/\1/p" "$f")
          rg=$(sed -nE "s/^param resourceGroupName *= *'([^']+)'.*/\1/p" "$f")
          [ -n "$sub" ] && [ -n "$rg" ] || { echo "::error::target not found in $f"; exit 1; }
          az deployment group create --name "infra-${STAGE}-${GITHUB_RUN_ID}" \
            --subscription "$sub" --resource-group "$rg" \
            --template-file main.bicep --parameters "$f"
