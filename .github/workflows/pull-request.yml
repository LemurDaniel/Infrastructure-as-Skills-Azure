name: Pull request

# A merge to master is a release (release.yml), so a pull request into master must raise
# the version in plugin.json past the last release and pass the checks the release runs.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  version:
    name: Version raised
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version against the last release
        run: python3 .claude/skills/release/scripts/check_version_bump.py --base "origin/${{ github.base_ref }}"

  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    env:
      PLUGIN_DIR: plugins/infrastructure-as-skills-azure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the repository checks
        run: |
          pip install pyyaml
          python3 .claude/skills/git-commit-conventions/scripts/check_repo_consistency.py
          python3 $PLUGIN_DIR/core/iac-authoring/scripts/check_question_set.py
          python3 $PLUGIN_DIR/core/iac-diagram/tests/run_diagram_tests.py
