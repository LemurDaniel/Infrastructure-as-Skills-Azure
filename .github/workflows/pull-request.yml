name: Pull request

# Feature branches go into dev, dev goes into master. A merge to master is a release
# (release.yml), so a pull request into master must come from dev and raise the version in
# plugin.json past the last release; a pull request into dev only runs the checks - dev
# deploys the eval agent, it releases nothing.
on:
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  version:
    name: Version raised
    runs-on: ubuntu-latest
    steps:
      - name: Only dev is released
        if: github.base_ref == 'master' && github.head_ref != 'dev'
        run: |
          echo "::error::a pull request into master comes from dev; open this one against dev (gh pr edit --base dev)"
          exit 1

      - uses: actions/checkout@v4
        if: github.base_ref == 'master'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: github.base_ref == 'master'
        with:
          python-version: "3.12"

      - name: Check the version against the last release
        if: github.base_ref == 'master'
        run: python3 .claude/skills/release/scripts/check_version_bump.py --base "origin/${{ github.base_ref }}"

  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    env:
      PLUGIN_DIR: plugins/infrastructure-as-skills-azure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the repository checks
        run: |
          pip install pyyaml
          python3 .claude/skills/git-commit-conventions/scripts/check_repo_consistency.py
          python3 $PLUGIN_DIR/core/iac-authoring/scripts/check_question_set.py
          python3 $PLUGIN_DIR/core/iac-authoring/tests/run_interview_digest_tests.py
          python3 $PLUGIN_DIR/core/iac-diagram/tests/run_diagram_tests.py
