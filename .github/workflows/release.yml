name: Release

# Every push to master - the merge of a pull request - publishes the version in plugin.json
# as release v<version>; the tag is created here, on the merged commit. pull-request.yml has
# made sure the version is new. A 0.0.x version or a -suffix marks it as a prerelease;
# 0.1.0 and later are stable.
on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLUGIN_DIR: plugins/infrastructure-as-skills-azure
      PLUGIN_NAME: infrastructure-as-skills-azure
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version from the manifest
        id: version
        run: |
          version="$(python3 -c "import json; print(json.load(open('$PLUGIN_DIR/.claude-plugin/plugin.json'))['version'])")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; a merge to master must raise the version in plugin.json"
            exit 1
          fi
          if [[ "$version" == 0.0.* ]] || [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Every pull request records its Sonnet eval run on the eval-history branch (git-commit-
      # conventions, section 5), and the README badge shows the newest one with its version and
      # commit. A release without a run for its version is published anyway, with a warning: the
      # badge then still names an older version, and the run summary says so.
      - name: Check for an eval run on this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git fetch --quiet origin eval-history 2>/dev/null; then
            echo "::warning::no eval-history branch: v$VERSION is released without a recorded eval run"
            exit 0
          fi
          git show FETCH_HEAD:index.json > "$RUNNER_TEMP/eval-index.json"
          python3 - "$RUNNER_TEMP/eval-index.json" <<'EOF'
          import json, os, sys
          version = os.environ['VERSION']
          runs = [r for r in json.load(open(sys.argv[1], encoding='utf-8')).get('runs', []) if r.get('model') == 'sonnet']
          mine = [r for r in runs if r.get('version') == version]
          if mine:
              r = mine[-1]
              full = sum(1 for c in r['cases'] if c.get('passRate') == 1)
              print(f"eval run for v{version}: sonnet at {r.get('commit')}, {full}/{len(r['cases'])} cases at 100%")
          else:
              last = runs[-1] if runs else None
              shown = f"v{last['version']} @ {(last.get('commit') or '')[:7]}" if last else 'nothing'
              print(f"::warning::v{version} is released without a Sonnet eval run on eval-history; "
                    f"the README badge still shows {shown}. Run the suite (git-commit-conventions, section 5).")
          EOF

      - name: Run the repository checks
        run: |
          pip install pyyaml
          python3 .claude/skills/git-commit-conventions/scripts/check_repo_consistency.py
          python3 $PLUGIN_DIR/core/iac-authoring/scripts/check_question_set.py
          python3 $PLUGIN_DIR/core/iac-diagram/tests/run_diagram_tests.py

      - name: Build the ZIP
        run: |
          zip_name="$PLUGIN_NAME-${{ steps.version.outputs.version }}.zip"
          git archive --format=zip --prefix="$PLUGIN_NAME/" -o "$zip_name" "HEAD:$PLUGIN_DIR"
          sha256sum "$zip_name" > "$zip_name.sha256"
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" "$ZIP_NAME" "$ZIP_NAME.sha256" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes $flags
