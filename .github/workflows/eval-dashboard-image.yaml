# Builds the eval dashboard image, pushes it into the private registry and sets it on the web app.
# The image belongs to this pipeline, not to the Bicep template (spec: container_image_owner: image_pipeline);
# the infra pipeline reads the running image before each deployment and keeps it.
#
# PLATFORM PREREQUISITES - same identity and environment as eval-agent-infra.yaml:
#  1. GitHub environment 'production' with AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. The federated
#     credential of the infra pipeline (subject ...:environment:production) already covers this workflow.
#  2. On top of the infra roles, the identity needs AcrPush on the registry (Contributor cannot push). Contributor
#     on the resource group covers the registry network rule and the web app setting.
#
# THE REGISTRY IS PRIVATE (publicNetworkAccess Disabled, spec decision). A hosted runner cannot reach it, so the push
# opens it for the runner's address only and closes it again in a step that always runs. While the window is open
# the registry is reachable from that one address with Azure credentials; if the closing step itself fails the
# registry stays open - the job then fails and says so. The infra pipeline shares the concurrency group, so a
# Bicep deployment never resets the registry halfway through a push.
name: Eval Dashboard image

on:
  push:
    branches: [main, master]
    paths: ["eval-agent/dashboard/**", ".github/workflows/eval-dashboard-image.yaml"]
  pull_request:
    paths: ["eval-agent/dashboard/**", ".github/workflows/eval-dashboard-image.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # No Azure credential: safe for unreviewed pull requests.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval-agent/dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eval-agent/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Image builds
        run: docker build -t eval-dashboard:test .

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, id-token: write }
    # Queue, never cancel; shared with the infra pipeline of the stage.
    concurrency:
      group: eval-agent-infra-production
      cancel-in-progress: false
    env:
      STAGE: production
      IMAGE: eval-dashboard
    steps:
      - uses: actions/checkout@v7

      - name: Read target from the stage file
        working-directory: eval-agent/infra
        run: |
          f="main.${STAGE}.bicepparam"
          sub=$(sed -nE "s/^param subscriptionId *= *'([^']+)'.*/\1/p" "$f")
          rg=$(sed -nE "s/^param resourceGroupName *= *'([^']+)'.*/\1/p" "$f")
          [ -n "$sub" ] && [ -n "$rg" ] || { echo "::error::subscriptionId / resourceGroupName not found in $f"; exit 1; }
          if [ "$sub" != "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::subscriptionId in $f differs from environment variable AZURE_SUBSCRIPTION_ID"; exit 1
          fi
          echo "SUBSCRIPTION_ID=$sub" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$rg" >> "$GITHUB_ENV"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Registry and web app are found in the resource group, as the infra pipeline does; the dashboard is the
      # site whose name carries none of the other apps' suffixes.
      - name: Resolve registry and web app
        run: |
          set -euo pipefail
          registry=$(az acr list --subscription "$SUBSCRIPTION_ID" -g "$RESOURCE_GROUP" --query "[0].name" -o tsv | tr -d '\r')
          app=$(az webapp list --subscription "$SUBSCRIPTION_ID" -g "$RESOURCE_GROUP" \
            --query "[?!contains(name,'-agent-') && !contains(name,'-drift-') && !contains(name,'-fuzz-') && !contains(name,'-tune-')].name | [0]" -o tsv | tr -d '\r')
          [ -n "$registry" ] && [ -n "$app" ] || { echo "::error::registry or dashboard web app not found in $RESOURCE_GROUP (deploy the infrastructure first)"; exit 1; }
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      # The tag is the commit, never 'latest': what runs can always be traced to a commit.
      - name: Open the registry for this runner
        run: |
          set -euo pipefail
          ip=$(curl -fsS https://api.ipify.org)
          echo "RUNNER_IP=$ip" >> "$GITHUB_ENV"
          az acr update --subscription "$SUBSCRIPTION_ID" -n "$REGISTRY" --public-network-enabled true --default-action Deny -o none
          az acr network-rule add --subscription "$SUBSCRIPTION_ID" -n "$REGISTRY" --ip-address "$ip" -o none
          # the rule takes a while to apply
          for i in 1 2 3 4 5 6; do
            az acr login -n "$REGISTRY" && exit 0
            echo "registry not reachable yet ($i/6)"; sleep 20
          done
          echo "::error::registry did not become reachable for ${ip}"; exit 1

      - name: Build and push
        working-directory: eval-agent/dashboard
        run: |
          set -euo pipefail
          server="${REGISTRY}.azurecr.io"
          docker build -t "${server}/${IMAGE}:${TAG}" .
          docker push "${server}/${IMAGE}:${TAG}"

      - name: Close the registry again
        if: always()
        run: |
          set -uo pipefail
          [ -n "${RUNNER_IP:-}" ] && az acr network-rule remove --subscription "$SUBSCRIPTION_ID" -n "$REGISTRY" --ip-address "$RUNNER_IP" -o none
          az acr update --subscription "$SUBSCRIPTION_ID" -n "$REGISTRY" --public-network-enabled false -o none || {
            echo "::error::THE REGISTRY $REGISTRY IS STILL PUBLIC - close it by hand: az acr update -n $REGISTRY --public-network-enabled false"; exit 1; }
          state=$(az acr show --subscription "$SUBSCRIPTION_ID" -n "$REGISTRY" --query publicNetworkAccess -o tsv | tr -d '\r')
          [ "$state" = "Disabled" ] || { echo "::error::registry public access is '$state', expected Disabled"; exit 1; }
          echo "Registry closed ($state)."

      # The app pulls through its private endpoint with its identity (acrUseManagedIdentityCreds is set by Bicep).
      - name: Set the image on the web app
        run: |
          set -euo pipefail
          az webapp config set --subscription "$SUBSCRIPTION_ID" -g "$RESOURCE_GROUP" -n "$APP" \
            --linux-fx-version "DOCKER|${REGISTRY}.azurecr.io/${IMAGE}:${TAG}" -o none
          az webapp restart --subscription "$SUBSCRIPTION_ID" -g "$RESOURCE_GROUP" -n "$APP"
          {
            echo "### Dashboard image"
            echo "\`${REGISTRY}.azurecr.io/${IMAGE}:${TAG}\` -> \`${APP}\`"
          } >> "$GITHUB_STEP_SUMMARY"
