# Monthly: regenerates resources/ai/foundry/models.yaml from the Azure model catalogue of
# the EU regions and opens a pull request when it changed. The interview offers models from
# that file only, so a stale file is a stale interview.
#
# Prerequisites:
#   - the identity of the GitHub environment 'production' (eval-agent-infra.yaml): its
#     variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and its federated
#     credential for the environment subject. The catalogue is read at subscription scope
#     (Microsoft.CognitiveServices/locations/models/read); if a role on the resource group
#     alone does not cover it, Reader on the subscription does. The job only reads;
#   - "Allow GitHub Actions to create and approve pull requests" in the repository settings.
# The pull request goes into dev, like every change; the version is raised when dev is released.
# A pull request opened with GITHUB_TOKEN starts no other workflow: pull-request.yml runs
# once someone pushes to the branch or closes and reopens the pull request.
name: Foundry model catalogue

on:
  schedule:
    - cron: '0 5 1 * *'   # on the 1st of each month, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-models
  cancel-in-progress: false

env:
  REGIONS: westeurope northeurope swedencentral germanywestcentral francecentral italynorth spaincentral polandcentral
  MODELS: plugins/infrastructure-as-skills-azure/resources/ai/foundry/models.yaml
  BRANCH: foundry-models-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: write, pull-requests: write, id-token: write }
    steps:
      - uses: actions/checkout@v7
        with: { ref: dev, fetch-depth: 0 }

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch the catalogue per region
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models"
          for r in $REGIONS; do
            az cognitiveservices model list --location "$r" -o json > "$RUNNER_TEMP/models/$r.json"
          done

      - name: Write models.yaml
        run: |
          pip install pyyaml
          python3 .github/scripts/update_foundry_models.py "$RUNNER_TEMP/models"

      # Only the retrieved date changed: nothing to release.
      - name: Detect a change
        id: diff
        run: |
          if git diff --quiet -I '^retrieved:' -- "$MODELS"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the question sets
        if: steps.diff.outputs.changed == 'true'
        run: python3 plugins/infrastructure-as-skills-azure/core/iac-authoring/scripts/check_question_set.py

      # The pull request stays open until someone merges it; a newer run replaces it.
      - name: Open the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add "$MODELS"
          git commit -m "Refresh the Foundry model catalogue"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base dev --head "$BRANCH" \
              --title "Refresh the Foundry model catalogue" \
              --body "Monthly refresh of \`resources/ai/foundry/models.yaml\` from the model catalogue of the EU regions ($REGIONS)."
          fi
