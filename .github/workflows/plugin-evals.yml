name: Plugin evals

# Runs the eval suite by hand, on a Linux runner: the same suite as the run before a merge
# (git-commit-conventions, section 5), there on Sonnet at low effort by default. There is no
# pull-request trigger - a cheap model on the spec cases did not tell a plugin change from the
# model's own noise, and the full suite is what a merge is judged on. Every run is recorded on
# the eval-history branch, which the eval dashboard reads per plugin version and model.
#
# Report only: a failing case does not fail the run. Needs the repository secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model the agent runs on
        type: choice
        options: [sonnet, haiku, opus]
        default: sonnet
      effort:
        description: Effort level of the agent (CLAUDE_CODE_EFFORT_LEVEL)
        type: choice
        options: [low, medium, high]
        default: low
      trigger:
        description: What the run is recorded as
        type: choice
        options: [manual, release]
        default: manual
      runs:
        description: Runs per case, run in parallel up to 8 (empty = 4 on Sonnet and Opus, 5 on Haiku)
        default: ""
      max_cost_usd:
        description: Hard cost ceiling in USD
        default: "30"
      case:
        description: Case name glob (empty = all)
        default: ""
      tag:
        description: Only cases with this tag (empty = all)
        default: ""

permissions:
  contents: read

jobs:
  eval:
    name: Eval suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLUGIN_DIR: plugins/infrastructure-as-skills-azure
      MODEL: ${{ inputs.model }}
      CLAUDE_CODE_EFFORT_LEVEL: ${{ inputs.effort }}
      RUNS: ${{ inputs.runs || (inputs.model == 'haiku' && '5' || '4') }}
      MAX_COST_USD: ${{ inputs.max_cost_usd }}
      CASE: ${{ inputs.case }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.310

      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # One case per call, so the log says which case runs, how far along the suite is and
        # how long the rest will take (the average of the cases so far); the CLI itself prints
        # only the final table. Each call gets what is left of the cost ceiling. --scaffold: the
        # sync cases stage a repository first, and this is our own suite.
        run: |
          OUT="$RUNNER_TEMP/eval"
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::the repository secret ANTHROPIC_API_KEY is not set"; exit 1; fi
          mkdir -p "$OUT/cases"
          fmt() { printf '%dm%02ds' $(($1 / 60)) $(($1 % 60)); }
          parallel=$((RUNS < 8 ? RUNS : 8))
          cost_of() { python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('costUsd') or 0)" "$1"; }

          cases=()
          while read -r dir; do
            name=$(basename "$dir")
            if [ -n "$CASE" ] && [[ "$name" != $CASE ]]; then continue; fi
            # The tags are in the prompt.md frontmatter: tags: [pr, terraform, ...]
            if [ -n "$TAG" ] && ! grep -qE "^tags:.*[[ ,]${TAG}[],]" "$dir/prompt.md"; then continue; fi
            cases+=("$name")
          done < <(find "$PLUGIN_DIR/evals" -name case.yaml -not -path '*/results/*' -printf '%h\n' | sort)
          total=${#cases[@]}
          [ "$total" -gt 0 ] || { echo "::error::no case matches case '${CASE}' and tag '${TAG}'"; exit 1; }
          echo "$total case(s)${TAG:+ tagged $TAG} on $MODEL, $RUNS run(s) each, ceiling \$$MAX_COST_USD: ${cases[*]}"

          start=$(date +%s)
          spent=0
          partial=()
          for i in "${!cases[@]}"; do
            name=${cases[$i]}
            n=$((i + 1))
            elapsed=$(($(date +%s) - start))
            eta="first case"
            if [ "$i" -gt 0 ]; then eta="about $(fmt $((elapsed / i * (total - i)))) left"; fi
            budget=$(python3 -c "print(round(max(0.0, $MAX_COST_USD - $spent), 2))")
            if python3 -c "import sys; sys.exit(0 if $budget > 0 else 1)"; then :; else
              echo "::warning::cost ceiling \$$MAX_COST_USD reached after $i of $total case(s); the rest is skipped"
              partial=(--partial)
              break
            fi
            echo "::group::[$n/$total] $name - $(fmt "$elapsed") elapsed, $eta, \$$spent spent"
            case_start=$(date +%s)
            set +e
            # --threshold 0: report only. Exit 2 is the cost ceiling - partial results, still recorded.
            claude plugin eval "$PLUGIN_DIR" --case "$name" \
              --model "$MODEL" --runs "$RUNS" -j "$parallel" --ablation none --max-cost-usd "$budget" \
              --allow-tools Write Edit --trust-plugin --scaffold --no-publish --threshold 0 \
              --output-dir "$OUT/cases/$name" --report "$OUT/cases/$name/report.html"
            code=$?
            set -e
            echo "::endgroup::"
            result="$OUT/cases/$name/aggregate-result.json"
            if [ ! -f "$result" ]; then
              echo "::error::[$n/$total] $name produced no result (exit $code)"
              continue
            fi
            spent=$(python3 -c "print(round($spent + $(cost_of "$result"), 2))")
            echo "[$n/$total] $name done in $(fmt $(($(date +%s) - case_start))), exit $code, \$$spent spent so far"
          done

          shopt -s nullglob
          results=("$OUT"/cases/*/aggregate-result.json)
          [ "${#results[@]}" -gt 0 ] || { echo "::error::no case produced a result"; exit 1; }
          python3 .claude/skills/plugin-evals/scripts/merge_eval_results.py "${results[@]}" --out "$OUT/aggregate-result.json" "${partial[@]}"
          echo "suite done in $(fmt $(($(date +%s) - start))), \$$spent"

      - name: Summarise
        if: always()
        run: |
          OUT="$RUNNER_TEMP/eval"
          if [ ! -f "$OUT/aggregate-result.json" ]; then exit 0; fi
          pip install --quiet pyyaml
          {
            echo "### Plugin evals on \`$MODEL\` ($RUNS run(s) per case)"
            echo '```'
            NO_COLOR=1 python3 .claude/skills/plugin-evals/scripts/show_eval_result.py "$OUT/aggregate-result.json" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-result
          path: |
            ${{ runner.temp }}/eval/aggregate-result.json
            ${{ runner.temp }}/eval/cases/*/report.html
          if-no-files-found: ignore
          retention-days: 14

  # Kept apart from the eval job: the job that runs plugin code holds the API key and a read-only
  # token, the one that can push holds no key and runs no plugin code.
  record:
    name: Record in eval-history
    needs: eval
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODEL: ${{ inputs.model }}
      TRIGGER: ${{ inputs.trigger }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: eval-result
          path: ${{ runner.temp }}/eval

      - name: Record and push
        run: |
          HISTORY="$RUNNER_TEMP/history"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another run may push in between: start again from the remote branch and record again
          # (recording is idempotent), never rebase a conflicting index.json.
          for attempt in 1 2 3 4 5; do
            if git fetch --quiet origin eval-history 2>/dev/null; then
              git worktree add --force -B eval-history "$HISTORY" FETCH_HEAD
            else
              git worktree add --force --detach "$HISTORY"
              git -C "$HISTORY" checkout --quiet --orphan eval-history
              git -C "$HISTORY" rm -rf --quiet .
            fi
            python3 .claude/skills/plugin-evals/scripts/record_eval_history.py "$RUNNER_TEMP/eval/aggregate-result.json" \
              --history-dir "$HISTORY" --model "$MODEL" --trigger "$TRIGGER" --commit "$COMMIT"
            git -C "$HISTORY" add -A
            git -C "$HISTORY" commit --quiet -m "Record eval run on $MODEL ($TRIGGER)"
            if git -C "$HISTORY" push --quiet origin eval-history; then exit 0; fi
            git worktree remove --force "$HISTORY"
            sleep $((attempt * 5))
          done
          echo "::error::could not push to eval-history after 5 attempts"
          exit 1
