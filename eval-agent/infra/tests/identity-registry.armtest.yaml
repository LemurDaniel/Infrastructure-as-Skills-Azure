# Tests for the modules identity and registry (spec: user-assigned-identity, container-registry).

# ---- user-assigned-identity ---------------------------------------------------------------------

- decision: user-assigned-identity.identity.purpose
  path: resources.identity.properties.template.resources.identity.tags
  matches: "createObject\\('purpose', 'app-runtime'\\)"

- decision: user-assigned-identity.identity.federated_credentials
  path: resources.identity.properties.template.variables.federatedCredentials
  equals: []

- decision: user-assigned-identity.identity.isolation_scope
  path: resources.identity.properties.template.resources.identity.properties.isolationScope
  equals: None

- decision: user-assigned-identity.identity.role_assignments
  stage: production
  path: parameters.identityRoleAssignments.value
  equals: []

# ---- container-registry -------------------------------------------------------------------------

- decision: container-registry.registry.sku
  path: resources.registry.properties.template.resources.registry.sku.name
  equals: Premium

- decision: container-registry.registry.zone_redundant
  path: resources.registry.properties.template.resources.registry.properties.zoneRedundancy
  equals: Disabled

- decision: container-registry.registry.geo_replicas
  stage: production
  path: parameters.registryGeoReplicas.value
  equals: []

- decision: container-registry.registry.retention_untagged_days
  path: resources.registry.properties.template.resources.registry.properties.policies.retentionPolicy
  matches: '"days": 7, "status": "enabled"'

- decision: container-registry.networking.public_network_access
  path: resources.registry.properties.template.resources.registry.properties.publicNetworkAccess
  equals: Disabled

- decision: container-registry.networking.private_endpoint_subnet
  path: resources.registry.properties.parameters.privateEndpointSubnetId.value
  matches: "reference\\('network'\\)\\.outputs\\.privateEndpointSubnetId"

- decision: container-registry.networking.network_rule_bypass
  path: resources.registry.properties.template.resources.registry.properties.networkRuleBypassOptions
  equals: None

- decision: container-registry.networking.export_policy_enabled
  path: resources.registry.properties.template.resources.registry.properties.policies.exportPolicy.status
  equals: disabled

- decision: container-registry.identity.managed_identity
  path: resources.registry.properties.template.resources.registry.identity
  absent: true

- decision: container-registry.identity.role_assignments
  stage: production
  path: parameters.registryRoleAssignments.value
  equals: []

- decision: container-registry.security.admin_enabled
  path: resources.registry.properties.template.resources.registry.properties.adminUserEnabled
  equals: false

- decision: container-registry.security.anonymous_pull_enabled
  path: resources.registry.properties.template.resources.registry.properties.anonymousPullEnabled
  equals: false

- decision: container-registry.security.key_management
  path: resources.registry.properties.template.resources.registry.properties.encryption
  absent: true

- decision: container-registry.observability.diagnostic_workspace
  path: resources.registry.properties.parameters.diagnosticWorkspaceId.value
  matches: "reference\\('observability'\\)\\.outputs\\.id"

- decision: container-registry.observability.diagnostic_categories
  path: resources.registry.properties.template.resources.diagnostics.properties.logs
  equals:
    - { category: ContainerRegistryRepositoryEvents, enabled: true }
    - { category: ContainerRegistryLoginEvents, enabled: true }

- decision: container-registry.observability.metrics_enabled
  path: resources.registry.properties.template.resources.diagnostics.properties.metrics
  equals:
    - { category: AllMetrics, enabled: true }
