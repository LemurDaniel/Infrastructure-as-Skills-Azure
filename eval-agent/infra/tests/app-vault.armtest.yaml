- decision: app-service__tune.identity.managed_identity
  path: resources.app.properties.template.resources.tune.identity.type
  equals: UserAssigned

- decision: app-service__tune.identity.user_assigned_identity_ids
  path: resources.app.properties.parameters.tuneIdentityId.value
  matches: "reference\\('identityTune'\\)\\.outputs\\.id"

- decision: app-service__tune.security.https_only
  path: resources.app.properties.template.resources.tune.properties.httpsOnly
  equals: true

- decision: app-service__tune.security.min_tls_version
  path: resources.app.properties.template.resources.tune.properties.siteConfig.minTlsVersion
  equals: "1.2"

- decision: app-service__tune.security.ftps_state
  path: resources.app.properties.template.resources.tune.properties.siteConfig.ftpsState
  equals: Disabled

# FTP and SCM are two switches; the decision is asserted on FTP, SCM has its own entry below.
- decision: app-service__tune.security.basic_auth_enabled
  path: resources.app.properties.template.resources.tuneBasicAuthFtp.properties.allow
  equals: false

- deployment: tune_basic_auth_scm_disabled
  path: resources.app.properties.template.resources.tuneBasicAuthScm.properties.allow
  equals: false

- decision: app-service__tune.runtime.runtime_stack
  path: resources.app.properties.template.resources.tune.kind
  equals: app,linux,container

# The running image wins over the bootstrap one: the template keeps existingTuneLinuxFxVersion when set.
- decision: app-service__tune.runtime.container_image_owner
  path: resources.app.properties.template.resources.tune.properties.siteConfig.linuxFxVersion
  matches: 'if\(not\(empty\(parameters\(''existingTuneLinuxFxVersion''\)\)\), parameters\(''existingTuneLinuxFxVersion''\), format\(''DOCKER\|\{0\}/\{1\}'''

- decision: app-service__tune.runtime.always_on
  path: resources.app.properties.template.resources.tune.properties.siteConfig.alwaysOn
  equals: true

- decision: app-service__tune.runtime.health_check_path
  path: resources.app.properties.template.resources.tune.properties.siteConfig.healthCheckPath
  absent: true

- decision: app-service__tune.runtime.http2_enabled
  path: resources.app.properties.template.resources.tune.properties.siteConfig.http20Enabled
  equals: true

- decision: app-service__tune.observability.diagnostic_workspace
  path: resources.app.properties.parameters.diagnosticWorkspaceId.value
  matches: "reference\\('observability'\\)\\.outputs\\.id"

- decision: app-service__tune.observability.diagnostic_categories
  path: resources.app.properties.template.resources.tuneDiagnostics.properties.logs
  equals:
    - { category: AppServiceHTTPLogs, enabled: true }
    - { category: AppServiceAppLogs, enabled: true }
    - { category: AppServiceAuditLogs, enabled: true }
    - { category: AppServiceIPSecAuditLogs, enabled: true }
    - { category: AppServicePlatformLogs, enabled: true }

- decision: app-service__tune.observability.metrics_enabled
  path: resources.app.properties.template.resources.tuneDiagnostics.properties.metrics
  equals:
    - { category: AllMetrics, enabled: true }

# Image pull with the managed identity, no registry credentials.
- deployment: tune_image_pull_with_managed_identity
  path: resources.app.properties.template.resources.tune.properties.siteConfig.acrUseManagedIdentityCreds
  equals: true

- deployment: tune_image_pull_over_vnet
  path: resources.app.properties.template.resources.tune.properties.siteConfig.appSettings[1]
  equals:
    name: WEBSITE_PULL_IMAGE_OVER_VNET
    value: "true"

- deployment: tune_setting_azure_client_id
  path: resources.app.properties.template.resources.tune.properties.siteConfig.appSettings[0]
  matches: '"name": "AZURE_CLIENT_ID", "value": "\[parameters\(''tuneIdentityClientId''\)\]"'

- deployment: tune_setting_foundry_endpoint
  path: resources.app.properties.template.resources.tune.properties.siteConfig.appSettings[2]
  matches: '"name": "FOUNDRY_ENDPOINT", "value": "\[parameters\(''foundryEndpoint''\)\]"'

- deployment: tune_setting_storage_account_name
  path: resources.app.properties.template.resources.tune.properties.siteConfig.appSettings[3]
  matches: '"name": "STORAGE_ACCOUNT_NAME", "value": "\[parameters\(''storageAccountName''\)\]"'

# The watcher's GitHub token is a Key Vault reference to its own secret, resolved with its own identity.
- deployment: tune_github_token_secret_name
  path: resources.app.properties.template.variables.tuneGithubTokenSecretName
  equals: github-tune-token

- deployment: tune_setting_github_token_is_key_vault_reference
  path: resources.app.properties.template.resources.tune.properties.siteConfig.appSettings[4]
  matches: 'KeyVault\(SecretUri=\{0\}secrets/\{1\}/\)'

- deployment: tune_key_vault_reference_identity
  path: resources.app.properties.template.resources.tune.properties.keyVaultReferenceIdentity
  matches: "parameters\\('tuneIdentityId'\\)"

- deployment: tune_setting_schedule
  path: resources.app.properties.template.resources.tune.properties.siteConfig.appSettings[5]
  matches: '"name": "TUNE_SCHEDULE", "value": "\[parameters\(''tuneSchedule''\)\]"'

# The tuner's timer runs every 24 hours (stage file).
- deployment: tune_schedule_is_every_24h
  stage: production
  path: parameters.tuneSchedule.value
  matches: "every-24h"

# The tuner reaches the fuzz agent by its default hostname.
- deployment: tune_setting_fuzz_app_hostname
  path: resources.app.properties.template.resources.tune.properties.siteConfig.appSettings[6]
  matches: 'FUZZ_APP_HOSTNAME'

# ---- key-vault ----------------------------------------------------------------------------------

- decision: key-vault.vault.sku
  path: resources.vault.properties.template.resources.vault.properties.sku.name
  equals: standard

- decision: key-vault.vault.purge_protection
  path: resources.vault.properties.template.resources.vault.properties.enablePurgeProtection
  equals: true

- decision: key-vault.vault.soft_delete_retention_days
  path: resources.vault.properties.template.resources.vault.properties.softDeleteRetentionInDays
  equals: 90

- decision: key-vault.vault.rbac_authorization
  path: resources.vault.properties.template.resources.vault.properties.enableRbacAuthorization
  equals: true

- decision: key-vault.networking.public_network_access
  path: resources.vault.properties.template.resources.vault.properties.publicNetworkAccess
  equals: Disabled

- decision: key-vault.networking.private_endpoint_subnet
  path: resources.vault.properties.parameters.privateEndpointSubnetId.value
  matches: "reference\\('network'\\)\\.outputs\\.privateEndpointSubnetId"

- decision: key-vault.networking.network_acl_bypass
  path: resources.vault.properties.template.resources.vault.properties.networkAcls.bypass
  equals: None

- decision: key-vault.identity.role_assignments
  stage: production
  path: parameters.vaultRoleAssignments.value
  equals: []

- decision: key-vault.security.enabled_for_services
  path: resources.vault.properties.template.resources.vault.properties
  matches: '"enabledForDeployment": false, "enabledForDiskEncryption": false, "enabledForTemplateDeployment": false'

- decision: key-vault.security.secret_placeholders
  path: resources.vault.properties.template.variables.secretPlaceholders
  equals: [entra-client-secret, github-token, github-drift-token, github-tune-token]

# A placeholder is created only while the secret does not exist (the pipeline fills existingSecretNames).
- deployment: secret_placeholder_does_not_overwrite
  path: resources.vault.properties.template.resources.placeholder.condition
  matches: "not\\(contains\\(parameters\\('existingSecretNames'\\)"

- not_testable: key-vault.keys.key_management
  reason: platform_managed renders no key resource and no encryption property, so there is no path to assert; the absence of the vault's keys block is not observable

- decision: key-vault.observability.diagnostic_workspace
  path: resources.vault.properties.parameters.diagnosticWorkspaceId.value
  matches: "reference\\('observability'\\)\\.outputs\\.id"

- decision: key-vault.observability.diagnostic_categories
  path: resources.vault.properties.template.resources.diagnostics.properties.logs
  equals:
    - { category: AuditEvent, enabled: true }
    - { category: AzurePolicyEvaluationDetails, enabled: true }

- decision: key-vault.observability.metrics_enabled
  path: resources.vault.properties.template.resources.diagnostics.properties.metrics
  equals:
    - { category: AllMetrics, enabled: true }

# ---- wiring (main.bicep) ------------------------------------------------------------------------

- wiring: private_dns_zones
  path: variables.privateDnsZoneNames
  equals:
    vault: privatelink.vaultcore.azure.net
    blob: privatelink.blob.core.windows.net
    registry: privatelink.azurecr.io
    cognitiveservices: privatelink.cognitiveservices.azure.com
    openai: privatelink.openai.azure.com
    aiservices: privatelink.services.ai.azure.com
    sites: privatelink.azurewebsites.net

- wiring: role_assignments.acr_pull_dashboard
  path: resources.acrPullDashboardAssignment.properties.roleDefinitionId
  matches: "roleDefinitionIds'\\)\\.AcrPull"

- wiring: role_assignments.acr_pull_agent
  path: resources.acrPullAgentAssignment.properties.roleDefinitionId
  matches: "roleDefinitionIds'\\)\\.AcrPull"

- wiring: role_assignments.storage_blob_data_reader_dashboard
  path: resources.storageBlobReaderDashboardAssignment.properties.roleDefinitionId
  matches: "Storage Blob Data Reader"

- wiring: role_assignments.storage_blob_data_contributor_agent
  path: resources.storageBlobContributorAgentAssignment.properties.roleDefinitionId
  matches: "Storage Blob Data Contributor"

# Role shown as "Foundry User" in the tenant now; the GUID (53ca6127-...) is unchanged, the map key in main.bicep keeps the old name.
- wiring: role_assignments.azure_ai_user_agent
  path: resources.foundryUserAgentAssignment.properties.roleDefinitionId
  matches: "Azure AI User"

- wiring: role_assignments.key_vault_secrets_user_dashboard
  path: resources.keyVaultSecretsDashboardAssignment.properties.roleDefinitionId
  matches: "Key Vault Secrets User"

# The separation itself: the agent, which runs plugin code, gets no role on the vault, and the
# dashboard, which is internet-facing, gets none on the models and cannot write the results.
- wiring: agent_has_no_vault_role
  path: resources.keyVaultSecretsAgentAssignment
  absent: true

- wiring: dashboard_has_no_foundry_role
  path: resources.foundryUserDashboardAssignment
  absent: true

- wiring: dashboard_has_no_blob_write_role
  path: resources.storageBlobContributorDashboardAssignment
  absent: true

# The agent holds no Key Vault reference: no identity to resolve one with.
- deployment: agent_has_no_key_vault_reference_identity
  path: resources.app.properties.template.resources.agent.properties.keyVaultReferenceIdentity
  absent: true

# The apps start only after their roles exist.
- wiring: dashboard_waits_for_roles
  path: resources.app.dependsOn
  contains: acrPullDashboardAssignment

- wiring: agent_waits_for_roles
  path: resources.app.dependsOn
  contains: foundryUserAgentAssignment

# ---- app settings: the targets the apps need (values come from module outputs) -----------------

- deployment: agent_setting_foundry_endpoint
  path: resources.app.properties.template.resources.agent.properties.siteConfig.appSettings[3]
  matches: '"name": "FOUNDRY_ENDPOINT", "value": "\[parameters\(''foundryEndpoint''\)\]"'

- deployment: agent_setting_storage_account_name
  path: resources.app.properties.template.resources.agent.properties.siteConfig.appSettings[4]
  matches: '"name": "STORAGE_ACCOUNT_NAME", "value": "\[parameters\(''storageAccountName''\)\]"'

- deployment: dashboard_setting_storage_account_name
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.appSettings[4]
  matches: '"name": "STORAGE_ACCOUNT_NAME", "value": "\[parameters\(''storageAccountName''\)\]"'

# The dashboard reaches the tuner by its default hostname (the only agent it starts).
- deployment: dashboard_setting_tune_app_hostname
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.appSettings[5]
  matches: 'TUNE_APP_HOSTNAME'

- wiring: app_foundry_endpoint_from_ai_output
  path: resources.app.properties.parameters.foundryEndpoint.value
  matches: 'reference\(''ai''\)\.outputs\.endpoint'

- wiring: app_storage_name_from_storage_output
  path: resources.app.properties.parameters.storageAccountName.value
  matches: 'reference\(''storage''\)\.outputs\.name'

# Image pull of the platform goes through the VNet integration (registry has only a private endpoint).
- deployment: dashboard_image_pull_over_vnet
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.appSettings[3]
  equals:
    name: WEBSITE_PULL_IMAGE_OVER_VNET
    value: "true"

- deployment: agent_image_pull_over_vnet
  path: resources.app.properties.template.resources.agent.properties.siteConfig.appSettings[2]
  equals:
    name: WEBSITE_PULL_IMAGE_OVER_VNET
    value: "true"

# ---- wiring of the drift watcher (main.bicep) ---------------------------------------------------

- wiring: role_assignments.acr_pull_drift
  path: resources.acrPullDriftAssignment.properties.roleDefinitionId
  matches: "roleDefinitionIds'\\)\\.AcrPull"

- wiring: role_assignments.storage_blob_data_contributor_drift
  path: resources.storageBlobContributorDriftAssignment.properties.roleDefinitionId
  matches: "Storage Blob Data Contributor"

- wiring: role_assignments.key_vault_secrets_user_drift
  path: resources.keyVaultSecretsDriftAssignment.properties.roleDefinitionId
  matches: "Key Vault Secrets User"

- wiring: role_assignments.azure_ai_user_drift
  path: resources.foundryUserDriftAssignment.properties.roleDefinitionId
  matches: "Azure AI User"

# The watcher is read-only towards Azure beyond its data roles: no further assignment exists for it.
- wiring: drift_has_no_reader_role
  path: resources.readerDriftAssignment
  absent: true

- wiring: drift_waits_for_roles
  path: resources.app.dependsOn
  contains: acrPullDriftAssignment

- wiring: drift_waits_for_vault_role
  path: resources.app.dependsOn
  contains: keyVaultSecretsDriftAssignment

- wiring: app_drift_identity_from_identity_output
  path: resources.app.properties.parameters.driftIdentityClientId.value
  matches: "reference\\('identityDrift'\\)\\.outputs\\.clientId"

# ---- wiring of the fuzz agent (main.bicep) ------------------------------------------------------

- wiring: role_assignments.acr_pull_fuzz
  path: resources.acrPullFuzzAssignment.properties.roleDefinitionId
  matches: "roleDefinitionIds'\\)\\.AcrPull"

- wiring: role_assignments.storage_blob_data_contributor_fuzz
  path: resources.storageBlobContributorFuzzAssignment.properties.roleDefinitionId
  matches: "Storage Blob Data Contributor"

# The fuzz agent reads no secret and calls no model: no vault and no Foundry role exists for it.
- wiring: fuzz_has_no_vault_role
  path: resources.keyVaultSecretsFuzzAssignment
  absent: true

- wiring: fuzz_has_no_foundry_role
  path: resources.foundryUserFuzzAssignment
  absent: true

- wiring: fuzz_waits_for_roles
  path: resources.app.dependsOn
  contains: acrPullFuzzAssignment

- wiring: app_fuzz_identity_from_identity_output
  path: resources.app.properties.parameters.fuzzIdentityClientId.value
  matches: "reference\\('identityFuzz'\\)\\.outputs\\.clientId"

# ---- wiring of the tuner (main.bicep) -----------------------------------------------------------

- wiring: role_assignments.acr_pull_tune
  path: resources.acrPullTuneAssignment.properties.roleDefinitionId
  matches: "roleDefinitionIds'\\)\\.AcrPull"

- wiring: role_assignments.storage_blob_data_reader_tune
  path: resources.storageBlobReaderTuneAssignment.properties.roleDefinitionId
  matches: "Storage Blob Data Reader"

- wiring: role_assignments.key_vault_secrets_user_tune
  path: resources.keyVaultSecretsTuneAssignment.properties.roleDefinitionId
  matches: "Key Vault Secrets User"

- wiring: role_assignments.azure_ai_user_tune
  path: resources.foundryUserTuneAssignment.properties.roleDefinitionId
  matches: "Azure AI User"

# The tuner only reads the storage account; it writes to a branch through the GitHub token.
- wiring: tune_has_no_blob_contributor_role
  path: resources.storageBlobContributorTuneAssignment
  absent: true

- wiring: tune_waits_for_roles
  path: resources.app.dependsOn
  contains: acrPullTuneAssignment

- wiring: tune_waits_for_vault_role
  path: resources.app.dependsOn
  contains: keyVaultSecretsTuneAssignment

- wiring: app_tune_identity_from_identity_output
  path: resources.app.properties.parameters.tuneIdentityClientId.value
  matches: "reference\\('identityTune'\\)\\.outputs\\.clientId"
