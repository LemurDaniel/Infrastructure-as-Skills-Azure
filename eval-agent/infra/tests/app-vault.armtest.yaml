    value: "true"

- deployment: drift_setting_azure_client_id
  path: resources.app.properties.template.resources.drift.properties.siteConfig.appSettings[0]
  matches: '"name": "AZURE_CLIENT_ID", "value": "\[parameters\(''driftIdentityClientId''\)\]"'

- deployment: drift_setting_foundry_endpoint
  path: resources.app.properties.template.resources.drift.properties.siteConfig.appSettings[2]
  matches: '"name": "FOUNDRY_ENDPOINT", "value": "\[parameters\(''foundryEndpoint''\)\]"'

- deployment: drift_setting_storage_account_name
  path: resources.app.properties.template.resources.drift.properties.siteConfig.appSettings[3]
  matches: '"name": "STORAGE_ACCOUNT_NAME", "value": "\[parameters\(''storageAccountName''\)\]"'

# The watcher's GitHub token is a Key Vault reference to its own secret, resolved with its own identity.
- deployment: drift_github_token_secret_name
  path: resources.app.properties.template.variables.driftGithubTokenSecretName
  equals: github-drift-token

- deployment: drift_setting_github_token_is_key_vault_reference
  path: resources.app.properties.template.resources.drift.properties.siteConfig.appSettings[4]
  matches: 'KeyVault\(SecretUri=\{0\}secrets/\{1\}/\)'

- deployment: drift_key_vault_reference_identity
  path: resources.app.properties.template.resources.drift.properties.keyVaultReferenceIdentity
  matches: "parameters\\('driftIdentityId'\\)"

# The allowlist is an app setting only; nothing in the network enforces it (spec open: application.drift_internet_allowlist).
- deployment: drift_allowed_hosts_list
  path: resources.app.properties.template.variables.driftAllowedHosts
  equals: [github.com, api.github.com, raw.githubusercontent.com, mcr.microsoft.com, azure.github.io]

- deployment: drift_setting_allowed_hosts
  path: resources.app.properties.template.resources.drift.properties.siteConfig.appSettings[5]
  matches: 'AVM_ALLOWED_HOSTS.*join\(variables\(''driftAllowedHosts''\)'

- deployment: drift_setting_schedule
  path: resources.app.properties.template.resources.drift.properties.siteConfig.appSettings[6]
  matches: '"name": "DRIFT_SCHEDULE", "value": "\[parameters\(''driftSchedule''\)\]"'

# The rhythm the customer named: weekly. The stage file carries the keyword, no invented cron.
- deployment: drift_schedule_is_weekly
  stage: production
  path: parameters.driftSchedule.value
  matches: "weekly"

