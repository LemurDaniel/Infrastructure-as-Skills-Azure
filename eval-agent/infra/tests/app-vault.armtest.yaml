# Tests for the modules app and vault (spec: app-service, key-vault) and the wiring in main.bicep.

# ---- app-service__dashboard --------------------------------------------------------------------------------

- decision: app-service__dashboard.hosting.os_type
  path: resources.app.properties.template.resources.plan.kind
  equals: linux

- decision: app-service__dashboard.hosting.sku
  path: resources.app.properties.template.resources.plan.sku.name
  equals: B2

- decision: app-service__dashboard.hosting.zone_redundant
  path: resources.app.properties.template.resources.plan.properties.zoneRedundant
  equals: false

- decision: app-service__dashboard.hosting.instance_count
  path: resources.app.properties.template.resources.plan.sku.capacity
  equals: 1

- decision: app-service__dashboard.networking.public_network_access
  path: resources.app.properties.template.resources.dashboard.properties.publicNetworkAccess
  equals: Enabled

- decision: app-service__dashboard.networking.vnet_integration
  path: resources.app.properties.template.resources.dashboard.properties.virtualNetworkSubnetId
  matches: "parameters\\('integrationSubnetId'\\)"

- decision: app-service__dashboard.networking.integration_subnet
  path: resources.app.properties.parameters.integrationSubnetId.value
  matches: "reference\\('network'\\)\\.outputs\\.integrationSubnetId"

- decision: app-service__dashboard.networking.vnet_route_all
  path: resources.app.properties.template.resources.dashboard.properties.outboundVnetRouting.allTraffic
  equals: false

- decision: app-service__dashboard.identity.managed_identity
  path: resources.app.properties.template.resources.dashboard.identity.type
  equals: UserAssigned

- decision: app-service__dashboard.identity.user_assigned_identity_ids
  path: resources.app.properties.parameters.dashboardIdentityId.value
  matches: "reference\\('identityDashboard'\\)\\.outputs\\.id"

# Hand-rendered: no question set. Sign-in required, anonymous requests go to the login.
- decision: app-service__dashboard.identity.entra_sign_in
  path: resources.app.properties.template.resources.dashboardAuthSettings.properties.globalValidation
  equals:
    requireAuthentication: true
    unauthenticatedClientAction: RedirectToLoginPage
    redirectToProvider: azureactivedirectory

# The client secret is a Key Vault reference in the app settings, never a value.
- decision: app-service__dashboard.identity.entra_client_secret
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.appSettings[0].value
  matches: "@Microsoft\\.KeyVault\\(SecretUri=\\{0\\}secrets/\\{1\\}/\\)"

# The GitHub token is a Key Vault reference too, in the dashboard only.
- deployment: dashboard_github_token_secret_name
  path: resources.app.properties.template.variables.githubTokenSecretName
  equals: github-token

- decision: app-service__dashboard.security.https_only
  path: resources.app.properties.template.resources.dashboard.properties.httpsOnly
  equals: true

- decision: app-service__dashboard.security.min_tls_version
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.minTlsVersion
  equals: "1.2"

- decision: app-service__dashboard.security.ftps_state
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.ftpsState
  equals: Disabled

# FTP and SCM are two switches; the decision is asserted on FTP, SCM has its own entry below.
- decision: app-service__dashboard.security.basic_auth_enabled
  path: resources.app.properties.template.resources.dashboardBasicAuthFtp.properties.allow
  equals: false

- deployment: dashboard_basic_auth_scm_disabled
  path: resources.app.properties.template.resources.dashboardBasicAuthScm.properties.allow
  equals: false

- decision: app-service__dashboard.runtime.runtime_stack
  path: resources.app.properties.template.resources.dashboard.kind
  equals: app,linux,container

# The running image wins over the bootstrap one: the template keeps existingDashboardLinuxFxVersion when set.
- decision: app-service__dashboard.runtime.container_image_owner
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.linuxFxVersion
  matches: 'if\(not\(empty\(parameters\(''existingDashboardLinuxFxVersion''\)\)\), parameters\(''existingDashboardLinuxFxVersion''\), format\(''DOCKER\|\{0\}/\{1\}'''

- decision: app-service__dashboard.runtime.always_on
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.alwaysOn
  equals: true

- decision: app-service__dashboard.runtime.health_check_path
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.healthCheckPath
  absent: true

- decision: app-service__dashboard.runtime.http2_enabled
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.http20Enabled
  equals: true

- decision: app-service__dashboard.observability.diagnostic_workspace
  path: resources.app.properties.parameters.diagnosticWorkspaceId.value
  matches: "reference\\('observability'\\)\\.outputs\\.id"

- decision: app-service__dashboard.observability.diagnostic_categories
  path: resources.app.properties.template.resources.dashboardDiagnostics.properties.logs
  equals:
    - { category: AppServiceHTTPLogs, enabled: true }
    - { category: AppServiceAppLogs, enabled: true }
    - { category: AppServiceAuditLogs, enabled: true }
    - { category: AppServiceIPSecAuditLogs, enabled: true }
    - { category: AppServicePlatformLogs, enabled: true }

- decision: app-service__dashboard.observability.metrics_enabled
  path: resources.app.properties.template.resources.dashboardDiagnostics.properties.metrics
  equals:
    - { category: AllMetrics, enabled: true }

# Image pull with the managed identity, no registry credentials.
- deployment: dashboard_image_pull_with_managed_identity
  path: resources.app.properties.template.resources.dashboard.properties.siteConfig.acrUseManagedIdentityCreds
  equals: true

