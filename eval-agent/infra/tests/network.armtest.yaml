# Tests for the modules network and observability (spec: virtual-network,
# network-security-group__endpoints, network-security-group__apps, log-analytics-workspace).
# Run: run_arm_tests.py infra-spec.yaml --template main.bicep
# The module bodies are nested deployments: resources.<module>.properties.template.resources.<symbol>.

# ---- virtual-network ----------------------------------------------------------------------------

- decision: virtual-network.addressing.address_space
  stage: production
  path: parameters.addressSpace.value
  equals: 10.100.0.0/24

- decision: virtual-network.addressing.subnets
  stage: production
  path: parameters.subnets.value
  equals:
    - { name: pe, prefix: 10.100.0.0/27 }
    - { name: app-integration, prefix: 10.100.0.64/26 }

- decision: virtual-network.addressing.private_endpoint_subnet_prefix
  stage: production
  path: parameters.privateEndpointSubnetPrefix.value
  equals: 10.100.0.0/27

- decision: virtual-network.addressing.dns_servers
  path: resources.network.properties.template.variables.dnsServers
  equals: []

- decision: virtual-network.subnet_policy.private_endpoint_network_policies
  path: resources.network.properties.template.variables.privateEndpointNetworkPolicies
  equals: Enabled

- decision: virtual-network.subnet_policy.service_endpoints
  path: resources.network.properties.template.variables.serviceEndpoints
  equals: []

- decision: virtual-network.subnet_policy.subnet_delegations
  path: resources.network.properties.template.variables.subnetDelegations
  equals:
    - { subnet: app-integration, service: Microsoft.Web/serverFarms }

- decision: virtual-network.security.ddos_protection
  path: resources.network.properties.template.resources.virtualNetwork.properties.enableDdosProtection
  equals: false

- decision: virtual-network.observability.diagnostic_workspace
  path: resources.virtualNetworkDiagnostics.properties.workspaceId
  matches: "reference\\('observability'\\)\\.outputs\\.id"

- not_testable: virtual-network.observability.flow_logs_enabled
  reason: false renders no flow log resource (a Network Watcher child, platform-owned); the absence of a resource has no path to assert

# wiring: the subnet name every private endpoint is placed in (resources.*.networking.private_endpoint_subnet)
- wiring: private_endpoint_subnet_name
  path: variables.privateEndpointSubnetName
  equals: pe

# ---- network-security-group__endpoints ----------------------------------------------------------

# The association is made on the subnet: the subnet named pe takes this group's id.
# The pattern spans exactly one key and its value, so a swapped mapping fails it.
- decision: network-security-group__endpoints.networking.subnets
  path: resources.network.properties.template.variables.subnetSecurityGroupIds
  matches: "parameters\\('privateEndpointSubnetName'\\)\\)\\]\"\\s*:\\s*\"\\[resourceId\\('Microsoft\\.Network/networkSecurityGroups', parameters\\('endpointsSecurityGroupName'\\)\\)\\]\""

- decision: network-security-group__endpoints.rules.subnet_purpose
  path: resources.network.properties.template.variables.endpointsBaselineRules
  equals:
    - name: allow-vnet-https-inbound
      properties:
        priority: 100
        direction: Inbound
        access: Allow
        protocol: Tcp
        sourceAddressPrefix: VirtualNetwork
        sourcePortRange: "*"
        destinationAddressPrefix: "[parameters('privateEndpointSubnetPrefix')]"
        destinationPortRange: "443"

- decision: network-security-group__endpoints.rules.default_inbound
  path: resources.network.properties.template.variables.endpointsDefaultInboundRules
  equals:
    - name: deny-all-inbound
      properties:
        priority: 4096
        direction: Inbound
        access: Deny
        protocol: "*"
        sourceAddressPrefix: "*"
        sourcePortRange: "*"
        destinationAddressPrefix: "*"
        destinationPortRange: "*"

- decision: network-security-group__endpoints.rules.default_outbound
  path: resources.network.properties.template.variables.endpointsDefaultOutboundRules
  equals:
    - name: deny-internet-outbound
      properties:
        priority: 4096
        direction: Outbound
        access: Deny
        protocol: "*"
        sourceAddressPrefix: "*"
        sourcePortRange: "*"
        destinationAddressPrefix: Internet
        destinationPortRange: "*"

- decision: network-security-group__endpoints.rules.rules
  path: resources.network.properties.template.variables.endpointsCustomRules
  equals: []

- decision: network-security-group__endpoints.observability.diagnostic_workspace
  path: resources.endpointsSecurityGroupDiagnostics.properties.workspaceId
  matches: "reference\\('observability'\\)\\.outputs\\.id"

- decision: network-security-group__endpoints.observability.diagnostic_categories
  path: resources.endpointsSecurityGroupDiagnostics.properties.logs
  equals:
    - { category: NetworkSecurityGroupEvent, enabled: true }
    - { category: NetworkSecurityGroupRuleCounter, enabled: true }

# ---- network-security-group__apps ---------------------------------------------------------------

# The association is made on the subnet: the subnet named app-integration takes this group's id.
# The pattern spans exactly one key and its value, so a swapped mapping fails it.
- decision: network-security-group__apps.networking.subnets
  path: resources.network.properties.template.variables.subnetSecurityGroupIds
  matches: "parameters\\('integrationSubnetName'\\)\\)\\]\"\\s*:\\s*\"\\[resourceId\\('Microsoft\\.Network/networkSecurityGroups', parameters\\('appsSecurityGroupName'\\)\\)\\]\""

# app_integration: no baseline rule, outbound stays with the Azure default rules.
- decision: network-security-group__apps.rules.subnet_purpose
  path: resources.network.properties.template.variables.appsBaselineRules
  equals: []

- decision: network-security-group__apps.rules.default_inbound
  path: resources.network.properties.template.variables.appsDefaultInboundRules
  equals:
    - name: deny-all-inbound
      properties:
        priority: 4096
        direction: Inbound
        access: Deny
        protocol: "*"
        sourceAddressPrefix: "*"
        sourcePortRange: "*"
        destinationAddressPrefix: "*"
        destinationPortRange: "*"

# azure_default renders no rule.
- decision: network-security-group__apps.rules.default_outbound
  path: resources.network.properties.template.variables.appsDefaultOutboundRules
  equals: []

- decision: network-security-group__apps.rules.rules
  path: resources.network.properties.template.variables.appsCustomRules
  equals: []

- decision: network-security-group__apps.observability.diagnostic_workspace
  path: resources.appsSecurityGroupDiagnostics.properties.workspaceId
  matches: "reference\\('observability'\\)\\.outputs\\.id"

- decision: network-security-group__apps.observability.diagnostic_categories
  path: resources.appsSecurityGroupDiagnostics.properties.logs
  equals:
    - { category: NetworkSecurityGroupEvent, enabled: true }
    - { category: NetworkSecurityGroupRuleCounter, enabled: true }

# wiring: every subnet the network creates takes a group's id (no subnet left unassociated).
- wiring: subnet_network_security_group
  path: resources.network.properties.template.variables.copy[0].input.properties.networkSecurityGroup.id
  matches: "variables\\('subnetSecurityGroupIds'\\)\\[parameters\\('subnets'\\)\\[copyIndex\\('subnetDefinitions'\\)\\]\\.name\\]"

# wiring: each group's securityRules is the concat() of all four rule lists, so a list dropped
# from it fails here even though its own variable still holds.
- wiring: endpoints_security_rules
  path: resources.network.properties.template.resources.endpointsSecurityGroup.properties.securityRules
  equals: "[concat(variables('endpointsBaselineRules'), variables('endpointsCustomRules'), variables('endpointsDefaultInboundRules'), variables('endpointsDefaultOutboundRules'))]"

- wiring: apps_security_rules
  path: resources.network.properties.template.resources.appsSecurityGroup.properties.securityRules
  equals: "[concat(variables('appsBaselineRules'), variables('appsCustomRules'), variables('appsDefaultInboundRules'), variables('appsDefaultOutboundRules'))]"

# wiring: each diagnostic setting is scoped to its own group, never to the other one.
- wiring: endpoints_diagnostics_scope
  path: resources.endpointsSecurityGroupDiagnostics.scope
  equals: "[resourceId('Microsoft.Network/networkSecurityGroups', variables('endpointsSecurityGroupName'))]"

- wiring: apps_diagnostics_scope
  path: resources.appsSecurityGroupDiagnostics.scope
  equals: "[resourceId('Microsoft.Network/networkSecurityGroups', variables('appsSecurityGroupName'))]"

# ---- log-analytics-workspace --------------------------------------------------------------------

- decision: log-analytics-workspace.cost.retention_days
  path: resources.observability.properties.template.resources.workspace.properties.retentionInDays
  equals: 30

- decision: log-analytics-workspace.cost.daily_quota_gb
  path: resources.observability.properties.template.resources.workspace.properties.workspaceCapping.dailyQuotaGb
  equals: -1

- decision: log-analytics-workspace.cost.sku
  path: resources.observability.properties.template.resources.workspace.properties.sku.name
  equals: PerGB2018

# Ingestion and query are two switches; both are matched in the one decision.
- decision: log-analytics-workspace.access.public_network_access
  path: resources.observability.properties.template.resources.workspace.properties
  matches: '"publicNetworkAccessForIngestion": "Enabled".*"publicNetworkAccessForQuery": "Enabled"'

- decision: log-analytics-workspace.access.local_auth
  path: resources.observability.properties.template.resources.workspace.properties.features.disableLocalAuth
  equals: true

- decision: log-analytics-workspace.access.rbac_only_access
  path: resources.observability.properties.template.resources.workspace.properties.features.enableLogAccessUsingOnlyResourcePermissions
  equals: false

- not_testable: log-analytics-workspace.data_protection.immediate_purge_protection
  reason: the 14-day soft delete is Azure's behaviour and a forceDelete query parameter at deletion time, not a template property

- not_testable: log-analytics-workspace.data_protection.archive_to_storage
  reason: false renders no data export rule; the absence of a resource has no path to assert
