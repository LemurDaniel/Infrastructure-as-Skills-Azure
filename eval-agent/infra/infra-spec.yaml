schema_version: 1

spec:
  id: claude-plugin-eval-agent
  target: bicep
  generated_by: infrastructure-as-skills-azure
  plugin_version: 0.5.1
  skill: iac-authoring
  skill_version: 0.1.0
  at: 2026-10-24T12:00:00Z

context:
  environments: [production]
  language: de

# location, workload, subscription_id and resource_group_name are parameterized: input
# parameters the stage file supplies, never asked and never baked into the spec.
deployment:
  # --- context ---
  stage_isolation:
    value: subscription
    source: default
  non_production_savings:
    value: enabled
    source: default
  naming_convention:
    value: default
    source: default

  # --- delivery ---
  deploy_mechanism:
    value: github
    source: asked
  pipeline_auth:
    value: workload_identity
    source: default
  pipeline_approvals:
    value: production
    source: default
  deployer_roles:
    value:
    - role: Role Based Access Control Administrator
      scope: resource_group
      for: [wiring.role_assignments]
    - role: Key Vault Secrets Officer
      scope: key-vault
      for: [resources.key-vault.security.secret_placeholders]
    source:
      forced_by: [wiring.role_assignments, resources.key-vault.security.secret_placeholders]

  # --- requirements ---
  network_requirements:
    value: free
    source: asked
  outage_impact:
    value: tolerable
    source: asked
  data_loss_tolerance:
    value: reproducible
    source: asked
  data_access_pattern:
    value: active
    source: asked
  backup_isolation:
    value: operational
    source: asked
  data_residency:
    value: data_zone
    source: asked

  # --- modules ---
  module_source:
    value: authored
    source: asked

  # --- posture ---
  landing_zone:
    value: standalone
    source:
      forced_by: deployment.network_requirements
  network_exposure:
    value: private_with_exceptions
    source: asked
  local_auth:
    value: disabled
    source: default

  # --- compliance ---
  mandates:
    value: []
    source: asked
  key_protection:
    value: software
    source: default
  key_management:
    value: platform_managed
    source: default

  # --- network ---
  network_ownership:
    value: create
    source:
      forced_by: deployment.landing_zone
  address_space:
    value:
      production: 10.100.0.0/24
    source: asked
  private_endpoint_subnet_prefix:
    value:
      production: 10.100.0.0/27
    source:
      forced_by: deployment.network_requirements

  # --- dns ---
  private_dns_ownership:
    value: deployment
    source:
      forced_by: deployment.landing_zone

  # --- observability ---
  observability_ownership:
    value: create
    source:
      forced_by: deployment.landing_zone
  diagnostics_destination:
    value:
      resource: log-analytics-workspace
    source:
      forced_by: deployment.observability_ownership
  log_retention_days:
    value: 30
    source: asked
  daily_quota_gb:
    value: -1
    source: default

composition:
  granularity: per-concern
  source: default
  modules:
  - id: network
    contains: [virtual-network]
    implementation: authored
    source: deployment
    outputs: [id, integration_subnet_id, private_endpoint_subnet_id]
  - id: observability
    contains: [log-analytics-workspace]
    implementation: authored
    source: deployment
    outputs: [id]
  - id: identity-dashboard
    contains: [user-assigned-identity__dashboard]
    implementation: authored
    source: deployment
    outputs: [id, principal_id, client_id]
  - id: identity-drift
    contains: [user-assigned-identity__drift]
    implementation: authored
    source: deployment
    outputs: [id, principal_id, client_id]
  - id: identity-fuzz
    contains: [user-assigned-identity__fuzz]
    implementation: authored
    source: deployment
    outputs: [id, principal_id, client_id]
  - id: identity-tune
    contains: [user-assigned-identity__tune]
    implementation: authored
    source: deployment
    outputs: [id, principal_id, client_id]
  - id: registry
    contains: [container-registry]
    implementation: authored
    source: deployment
    needs: [network, observability]
    outputs: [id, login_server]
  - id: ai
    contains: [foundry]
    implementation: authored
    source: deployment
    needs: [network, observability]
    outputs: [id, endpoint]
  - id: storage
    contains: [storage-account, blob-container]
    implementation: authored
    source: deployment
    needs: [network, observability]
    outputs: [id, name]
  - id: vault
    contains: [key-vault]
    implementation: authored
    source: deployment
    needs: [network, observability]
    outputs: [id, vault_uri]
  - id: app
    # Four sites on one plan (the question set renders one site per plan; the shared plan is
    # rendered by hand, see resources.app-service__drift.hosting).
    contains: [app-service__dashboard, app-service__drift, app-service__fuzz, app-service__tune]
    implementation: authored
    source: deployment
    needs:
    - network
    - observability
    - identity-dashboard
    - identity-drift
    - identity-fuzz
    - identity-tune
    - registry
    - vault
    - ai
    - storage
    outputs: [id, default_hostname]

resources:
  virtual-network:
    meta:
      purpose:
        value: Privates Netz
        source: stated
    addressing:
      address_space:
        value:
          production: 10.100.0.0/24
        source: deployment
      subnets:
        value:
          production:
          - name: pe
            prefix: 10.100.0.0/27
          - name: app-integration
            prefix: 10.100.0.64/26
        source: default
      private_endpoint_subnet_prefix:
        value:
          production: 10.100.0.0/27
        source: deployment
      dns_servers:
        value: []
        source: default
    subnet_policy:
      private_endpoint_network_policies:
        value: Enabled
        source: default
      service_endpoints:
        value: []
        source: default
      subnet_delegations:
        value:
        - subnet: app-integration
          service: Microsoft.Web/serverFarms
        source:
          forced_by: resources.app-service__dashboard.networking.vnet_integration
    security:
      ddos_protection:
        value: false
        source: default
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      flow_logs_enabled:
        value: false
        source: default

  log-analytics-workspace:
    meta:
      purpose:
        value: Logs aller Teile
        source: stated
    cost:
      retention_days:
        value: 30
        source: deployment
      daily_quota_gb:
        value: -1
        source: deployment
      sku:
        value: PerGB2018
        source: default
    access:
      public_network_access:
        value: enabled
        source: default
      local_auth:
        value: false
        source: deployment
      rbac_only_access:
        value: true
        source: default
    data_protection:
      immediate_purge_protection:
        value: true
        source: default
      archive_to_storage:
        value: false
        source: default

  # One identity per app: the dashboard (internet-facing, holds the sign-in secret) shares no
  # role with the apps that run plugin code or hold a GitHub token.
  user-assigned-identity__dashboard:
    meta:
      purpose:
        value: Zugriff des Dashboards ohne Schlüssel
        source: stated
    identity:
      purpose:
        value: app-runtime
        source: default
      # AcrPull and the data roles must exist before the container first starts, which a
      # system-assigned identity of the app cannot have.
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  # The drift watcher reaches the AVM sources on the internet, so it gets its own identity: it
  # shares no role with the fuzz agent (which runs plugin code) or the dashboard (which holds the
  # sign-in secret).
  user-assigned-identity__drift:
    meta:
      purpose:
        value: Zugriff des Drift-Watchers ohne Schlüssel
        source: stated
    identity:
      purpose:
        value: app-runtime
        source: default
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  # The fuzz agent runs plugin code and calls no model: it gets its own identity with the image
  # and data roles only, so it shares nothing with the drift watcher, the tuner or the dashboard.
  user-assigned-identity__fuzz:
    meta:
      purpose:
        value: Zugriff des Fuzz-Agents ohne Schlüssel
        source: stated
    identity:
      purpose:
        value: app-runtime
        source: default
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  # The tuner reads the fuzz report, lets the Foundry model draft a layout change and pushes it to
  # the tuning branch: it holds the one GitHub token for that and shares no role with the other apps.
  user-assigned-identity__tune:
    meta:
      purpose:
        value: Zugriff des Tuners ohne Schlüssel
        source: stated
    identity:
      purpose:
        value: app-runtime
        source: default
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  container-registry:
    meta:
      purpose:
        value: Images aller vier Apps
        source: stated
    registry:
      sku:
        value: Premium
        source:
          forced_by: deployment.network_exposure
      zone_redundant:
        value: false
        source:
          derived_from: deployment.outage_impact
      geo_replicas:
        value:
          production: []
        source: default
      retention_untagged_days:
        value: 7
        source: default
    networking:
      public_network_access:
        value: disabled
        source: deployment
      private_endpoint_subnet:
        value:
          resource: virtual-network
          part: pe
        source: deployment
      network_rule_bypass:
        value: None
        source: default
      export_policy_enabled:
        value: false
        source: default
      # The image pipeline opens the registry for the runner's address only (public access enabled,
      # default action Deny, one IP rule), pushes, and closes it again in a step that always runs
      # and verifies public access is Disabled. The steady state stays private; no agent pool, no
      # self-hosted runner. The pipeline's identity needs AcrPush on the registry.
      image_push_path:
        value: pipeline_opens_registry
        source: stated
    identity:
      managed_identity:
        value: none
        source: default
      role_assignments:
        value:
          production: []
        source: default
    security:
      admin_enabled:
        value: false
        source: deployment
      anonymous_pull_enabled:
        value: false
        source: default
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [ContainerRegistryRepositoryEvents, ContainerRegistryLoginEvents]
        source: default
      metrics_enabled:
        value: true
        source: default

  foundry:
    meta:
      purpose:
        value: Sprachmodelle für Drift-Watcher und Tuner
        source: stated
    account:
      kind:
        value: AIServices
        source: default
      sku_name:
        value: S0
        source: default
      project_management:
        value: true
        source: default
      projects:
        value: [eval]
        source:
          overridden: 'Departs from the default []: Foundry evaluations are scoped to a project.'
    models:
      deployment_sku:
        value: DataZoneStandard
        source:
          derived_from: deployment.data_residency
      deployment_capacity:
        value: 10
        source: default
      version_upgrade_option:
        value: OnceCurrentVersionExpired
        source: default
      content_filter:
        value: Microsoft.DefaultV2
        source: default
    networking:
      public_network_access:
        value: disabled
        source: deployment
      private_endpoint_subnet:
        value:
          resource: virtual-network
          part: pe
        source: deployment
      restrict_outbound:
        value: true
        source: default
    identity:
      managed_identity:
        value: none
        source: default
      role_assignments:
        value:
          production: []
        source: default
    security:
      local_authentication_disabled:
        value: true
        source: deployment
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [Audit, RequestResponse, AzureOpenAIRequestUsage]
        source: default
      metrics_enabled:
        value: true
        source: default

  storage-account:
    meta:
      purpose:
        value: Drift-, Fuzz- und Tuner-Berichte
        source: stated
    networking:
      public_network_access:
        value: disabled
        source: deployment
      private_endpoint_subnet:
        value:
          resource: virtual-network
          part: pe
        source: deployment
      private_endpoint_subresources:
        value: [blob]
        source: default
      allow_azure_services_bypass:
        value: true
        source: default
    identity:
      managed_identity:
        value: none
        source: default
      role_assignments:
        value:
          production: []
        source: default
    security:
      shared_access_key_enabled:
        value: false
        source: deployment
      min_tls_version:
        value: TLS1_2
        source: default
      https_traffic_only:
        value: true
        source: default
      allow_blob_public_access:
        value: false
        source: default
      infrastructure_encryption_enabled:
        value: true
        source: default
      key_management:
        value: platform_managed
        source: deployment
      sftp_enabled:
        value: false
        source: default
    data_protection:
      replication:
        value: LRS
        source:
          derived_from: deployment.outage_impact
      access_tier:
        value: Hot
        source:
          derived_from: deployment.data_access_pattern
      blob_soft_delete_days:
        value: 0
        source:
          derived_from: deployment.data_loss_tolerance
      container_soft_delete_days:
        value: 0
        source:
          derived_from: deployment.data_loss_tolerance
      versioning_enabled:
        value: false
        source:
          derived_from: deployment.data_loss_tolerance
      change_feed_enabled:
        value: false
        source: default
      point_in_time_restore_days:
        value: 0
        source: default
      immutability:
        value: none
        source: default
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [audit]
        source: default
      metrics_enabled:
        value: true
        source: default

  # The dashboard only shows: the eval history per plugin version and model from the eval-history
  # branch of the public repository (read without a token), and the drift, fuzz and tuner reports
  # from the storage account. It starts no run and files no ticket. It is the internet-facing part,
  # so it is the one with the sign-in, and it writes nothing.
  app-service__dashboard:
    meta:
      purpose:
        value: 'Dashboard: zeigt Eval-Verlauf und Berichte an'
        source: stated
    hosting:
      os_type:
        value: Linux
        source: default
      sku:
        value: B2
        source:
          overridden: 'The subscription has no App Service quota in germanywestcentral (SubscriptionIsOverQuotaForSku for
            P1v3 and B1), so the stack runs in westeurope on B2. B2 is Basic: VNet integration, always on and the container
            run; no slots, no autoscale, no zone redundancy.'
      zone_redundant:
        value: false
        source:
          derived_from: deployment.outage_impact
      instance_count:
        value: 1
        source:
          derived_from: deployment.outage_impact
    networking:
      public_network_access:
        value: enabled
        source:
          overridden: 'The dashboard is the one internet-facing part (customer: reachable from the internet, sign-in with
            company accounts). Departs from the private baseline, which would map to disabled.'
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value:
          resource: virtual-network
          part: app-integration
        source:
          forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source:
          overridden: The dashboard reads the eval history from github.com and api.github.com. With all traffic routed into
            the VNet there is no outbound path without a NAT gateway; private endpoint addresses are RFC 1918 and still go
            through the VNet.
    identity:
      managed_identity:
        value: user_assigned
        source:
          overridden: 'Departs from system_assigned: AcrPull and the data roles must exist before the container first starts,
            which a system-assigned identity cannot have.'
      user_assigned_identity_ids:
        value:
        - resource: user-assigned-identity__dashboard
        source:
          forced_by: resources.app-service__dashboard.identity.managed_identity
      entra_sign_in:
        # authsettingsV2: sign-in required, redirect to login. The registration exists already;
        # its client id and the tenant id are stage-file parameters.
        value: existing_app_registration
        source: stated
      entra_client_secret:
        # The sign-in uses the registration's client secret, held in the vault and read through
        # a Key Vault reference in the app settings; never a value in the template.
        value: key_vault_reference
        source: stated
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: '1.2'
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      container_image_owner:
        value: image_pipeline
        source:
          overridden: A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only
            on the first deployment and keeps the running one afterwards.
      always_on:
        value: true
        source: default
      health_check_path:
        value: ''
        source: default
      http2_enabled:
        value: true
        source: default
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value:
        - AppServiceHTTPLogs
        - AppServiceAppLogs
        - AppServiceAuditLogs
        - AppServiceIPSecAuditLogs
        - AppServicePlatformLogs
        source: default
      metrics_enabled:
        value: true
        source: default

  # The drift watcher compares the AVM versions pinned in the plugin with the current ones (MCR
  # tag list, module repo tags, module READMEs), lets the Foundry model diff the inputs and opens
  # a pull request that bumps the pin. It runs on a timer inside the app. It is not reachable from
  # outside; its only write targets are the report in the storage account and the pull request.
  # Azure is read-only to it: no role beyond the data roles in wiring.role_assignments.
  app-service__drift:
    meta:
      purpose:
        value: 'Drift-Watcher: prüft AVM-Versionen, öffnet Pull Requests'
        source: stated
    hosting:
      # The plan is shared with the dashboard: one B2 plan, four sites. The question set renders one
      # site per plan, so the plan is rendered once (from the dashboard's values) and the sites of
      # drift, fuzz and tune are rendered by hand; the hosting decisions follow the dashboard.
      os_type:
        value: Linux
        source:
          forced_by: resources.app-service__dashboard.hosting.os_type
      sku:
        value: B2
        source:
          forced_by: resources.app-service__dashboard.hosting.sku
      zone_redundant:
        value: false
        source:
          forced_by: resources.app-service__dashboard.hosting.zone_redundant
      instance_count:
        value: 1
        source:
          forced_by: resources.app-service__dashboard.hosting.instance_count
    networking:
      public_network_access:
        value: disabled
        source:
          overridden: 'Nothing calls the drift watcher: it runs on its own timer, and the dashboard only reads its reports
            from the storage account.'
      private_endpoint_subnet:
        value:
          resource: virtual-network
          part: pe
        source: deployment
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value:
          resource: virtual-network
          part: app-integration
        source:
          forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source:
          overridden: The watcher reads the AVM sources on the internet (github.com, api.github.com, raw.githubusercontent.com,
            mcr.microsoft.com, azure.github.io). With all traffic routed into the VNet there is no outbound path without a
            NAT gateway; private endpoint addresses are RFC 1918 and still go through the VNet.
    identity:
      managed_identity:
        value: user_assigned
        source:
          overridden: 'Departs from system_assigned: AcrPull and the data roles must exist before the container first starts,
            which a system-assigned identity cannot have.'
      user_assigned_identity_ids:
        value:
        - resource: user-assigned-identity__drift
        source:
          forced_by: resources.app-service__drift.identity.managed_identity
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: '1.2'
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      container_image_owner:
        value: image_pipeline
        source:
          overridden: A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only
            on the first deployment and keeps the running one afterwards.
      always_on:
        value: true
        source: default
      # The schedule is a timer inside the app, so the site must not idle out.
      health_check_path:
        value: ''
        source: default
      http2_enabled:
        value: true
        source: default
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value:
        - AppServiceHTTPLogs
        - AppServiceAppLogs
        - AppServiceAuditLogs
        - AppServiceIPSecAuditLogs
        - AppServicePlatformLogs
        source: default
      metrics_enabled:
        value: true
        source: default

  # The fuzz agent draws random valid specs with the plugin's diagram script from the tuning branch
  # and scores the layout (run_fuzz.py: Python and PyYAML only). It has no schedule of its own: it
  # runs after every tuner run, which starts it and asks first whether it is still running. It
  # is not reachable from outside, calls no model and holds no
  # secret: it reads the branch (a public repository) and writes the report and the worst cases to
  # the storage account; its only roles are the image and the data role in wiring.role_assignments.
  app-service__fuzz:
    meta:
      purpose:
        value: 'Fuzz-Agent: zeichnet Zufalls-Specs vom Branch, bewertet das Layout'
        source: stated
    hosting:
      os_type:
        value: Linux
        source:
          forced_by: resources.app-service__dashboard.hosting.os_type
      sku:
        value: B2
        source:
          forced_by: resources.app-service__dashboard.hosting.sku
      zone_redundant:
        value: false
        source:
          forced_by: resources.app-service__dashboard.hosting.zone_redundant
      instance_count:
        value: 1
        source:
          forced_by: resources.app-service__dashboard.hosting.instance_count
    networking:
      public_network_access:
        value: disabled
        source:
          overridden: 'Nothing outside the VNet calls the fuzz agent: the tuner starts a run from inside the VNet, through
            its private endpoint; the dashboard only reads its reports.'
      private_endpoint_subnet:
        value:
          resource: virtual-network
          part: pe
        source: deployment
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value:
          resource: virtual-network
          part: app-integration
        source:
          forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source:
          overridden: The fuzz agent reads the plugin source from the tuning branch on github.com. With all traffic routed
            into the VNet there is no outbound path without a NAT gateway; private endpoint addresses are RFC 1918 and still
            go through the VNet.
    identity:
      managed_identity:
        value: user_assigned
        source:
          overridden: 'Departs from system_assigned: AcrPull and the data roles must exist before the container first starts,
            which a system-assigned identity cannot have.'
      user_assigned_identity_ids:
        value:
        - resource: user-assigned-identity__fuzz
        source:
          forced_by: resources.app-service__fuzz.identity.managed_identity
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: '1.2'
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      container_image_owner:
        value: image_pipeline
        source:
          overridden: A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only
            on the first deployment and keeps the running one afterwards.
      always_on:
        value: true
        source: default
      # A run takes minutes and is started from outside, so the site must not idle out.
      health_check_path:
        value: ''
        source: default
      http2_enabled:
        value: true
        source: default
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value:
        - AppServiceHTTPLogs
        - AppServiceAppLogs
        - AppServiceAuditLogs
        - AppServiceIPSecAuditLogs
        - AppServicePlatformLogs
        source: default
      metrics_enabled:
        value: true
        source: default

  # The tuner improves the diagram layout on a branch of its own. On its timer it first asks the fuzz
  # agent whether a run is still going and does nothing if so. Otherwise it reads the newest fuzz
  # report from the storage account, lets the Foundry model draft a change to new_diagram.py,
  # re-runs the fuzzer and the tests on it and pushes the change to the tuning branch only when the
  # score drops and the tests pass, then starts the fuzz agent and waits for its next timer. It
  # changes new_diagram.py and adds fixtures (timer: every 24 hours); it never touches the fuzzer, its metrics, an existing
  # test or master, and never merges: the owner merges the branch when they want. It is not
  # reachable from outside. Azure is read-only to it: no role beyond the data roles in
  # wiring.role_assignments.
  app-service__tune:
    meta:
      purpose:
        value: 'Tuner: verbessert das Layout auf einem Branch, stößt den Fuzz an'
        source: stated
    hosting:
      os_type:
        value: Linux
        source:
          forced_by: resources.app-service__dashboard.hosting.os_type
      sku:
        value: B2
        source:
          forced_by: resources.app-service__dashboard.hosting.sku
      zone_redundant:
        value: false
        source:
          forced_by: resources.app-service__dashboard.hosting.zone_redundant
      instance_count:
        value: 1
        source:
          forced_by: resources.app-service__dashboard.hosting.instance_count
    networking:
      public_network_access:
        value: disabled
        source:
          overridden: 'Nothing calls the tuner: it runs on its own timer, and the dashboard only reads its runs from the storage
            account.'
      private_endpoint_subnet:
        value:
          resource: virtual-network
          part: pe
        source: deployment
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value:
          resource: virtual-network
          part: app-integration
        source:
          forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source:
          overridden: The tuner reads the plugin source and pushes to the tuning branch on github.com and api.github.com.
            With all traffic routed into the VNet there is no outbound path without a NAT gateway; private endpoint addresses
            are RFC 1918 and still go through the VNet.
    identity:
      managed_identity:
        value: user_assigned
        source:
          overridden: 'Departs from system_assigned: AcrPull and the data roles must exist before the container first starts,
            which a system-assigned identity cannot have.'
      user_assigned_identity_ids:
        value:
        - resource: user-assigned-identity__tune
        source:
          forced_by: resources.app-service__tune.identity.managed_identity
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: '1.2'
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      container_image_owner:
        value: image_pipeline
        source:
          overridden: A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only
            on the first deployment and keeps the running one afterwards.
      always_on:
        value: true
        source: default
      # The schedule is a timer inside the app, so the site must not idle out.
      health_check_path:
        value: ''
        source: default
      http2_enabled:
        value: true
        source: default
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value:
        - AppServiceHTTPLogs
        - AppServiceAppLogs
        - AppServiceAuditLogs
        - AppServiceIPSecAuditLogs
        - AppServicePlatformLogs
        source: default
      metrics_enabled:
        value: true
        source: default

  blob-container:
    placement:
      storage_account:
        value:
          resource: storage-account
        source: deployment
    containers:
      # One container for everything the apps share: the drift reports, the fuzz reports
      # (fuzz/<id>/report.json) and the tuner's runs (tune/<id>/run.json). The eval runs are not
      # here: they live on the eval-history branch of the repository. The dashboard reads the
      # prefixes, the apps write them; the roles on the account (data reader for the dashboard, data
      # contributor for the writers) already separate the two sides.
      container_names:
        value: [results]
        source: stated
      public_access:
        value: None
        source: default
      immutable_storage:
        value: false
        source:
          derived_from: deployment.backup_isolation
      encryption_scope_locked:
        value: false
        source: default
    identity:
      role_assignments:
        value:
          production: []
        source: default

  key-vault:
    meta:
      purpose:
        value: Anmelde-Secret des Dashboards, GitHub-Token von Drift-Watcher und Tuner
        source: stated
    vault:
      sku:
        value: standard
        source: default
      purge_protection:
        value: true
        source: default
      soft_delete_retention_days:
        value: 90
        source: default
      rbac_authorization:
        value: true
        source: deployment
    networking:
      public_network_access:
        value: disabled
        source: deployment
      private_endpoint_subnet:
        value:
          resource: virtual-network
          part: pe
        source: deployment
      network_acl_bypass:
        value: None
        source: default
    identity:
      role_assignments:
        value:
          production: []
        source: default
    security:
      enabled_for_services:
        value: []
        source: default
      secret_placeholders:
        value: [entra-client-secret, github-drift-token, github-tune-token]
        source:
          overridden: 'Departs from the default []: the dashboard reads the sign-in''s client secret, the drift watcher its
            own GitHub token (contents and pull requests write on this repository only) and the tuner its own (contents write
            on this repository; a branch rule keeps it off master), all through Key Vault references that must exist before
            the first start. The fuzz agent reads none of them; the dashboard holds no GitHub token, the eval history is public.'
    keys:
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [AuditEvent, AzurePolicyEvaluationDetails]
        source: default
      metrics_enabled:
        value: true
        source: default

