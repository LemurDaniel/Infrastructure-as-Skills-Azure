open:
  - key: resources.foundry.models.model_deployments
    environments: [production]
    question: "Welche Modelle werden gebraucht (Agent und Bewertung)? Claude-Modelle sind in Foundry womöglich nur weltweit verarbeitet verfügbar, das widerspräche 'nur EU'."
    owner: "Workload-Owner"
    blocks: apply
  - key: application.drift_internet_allowlist
    environments: [production]
    question: "Der Drift-Watcher darf nur an die AVM-Quellen (github.com, api.github.com, raw.githubusercontent.com, mcr.microsoft.com, azure.github.io). App Service filtert den Ausgang nicht; die Liste gilt nur im Code. Reicht das, oder soll der Ausgang im Netz erzwungen werden (Firewall oder NAT-Gateway mit Regeln, deutlich mehr Betrieb und Kosten)?"
    owner: "Workload-Owner"
    blocks: apply
  - key: application.drift_github_token
    environments: [production]
    question: "Der Drift-Watcher prüft wöchentlich. Wer legt das GitHub-Token 'github-drift-token' (nur dieses Repo, Contents + Pull requests schreiben) im Tresor ab?"
    owner: "Workload-Owner"
    blocks: apply
  - key: application.fuzz_schedule
    environments: [production]
    question: "Der Fuzz-Agent läuft auf Klick und nach Zeitplan. Wie oft soll der Zeitplan laufen (z. B. wöchentlich), und wie viele Zufalls-Specs pro Lauf?"
    owner: "Workload-Owner"
    blocks: apply
  - key: application.tune_github_token
    environments: [production]
    question: "Der Tuner öffnet Pull Requests mit Layout-Verbesserungen. Wer legt das GitHub-Token 'github-tune-token' (nur dieses Repo, Contents + Pull requests schreiben, kein Merge-Recht) im Tresor ab?"
    owner: "Workload-Owner"
    blocks: apply
  - key: application.tune_schedule
    environments: [production]
    question: "Der Tuner prüft per Timer, ob der Fuzz-Score schlechter geworden ist, und öffnet dann einen Pull Request. Wie oft soll er prüfen (z. B. täglich), ab welchem Score-Anstieg gegenüber der Baseline soll er starten, und wie viele offene Pull Requests des Tuners dürfen gleichzeitig bestehen (z. B. einer)?"
    owner: "Workload-Owner"
    blocks: apply
  - key: application.plugin_source
    environments: [production]
    question: "Woher holen der Agent, der Fuzz-Agent und der Tuner das Claude-Plugin (Git-Repo, Speicher, oder im Image)?"
    owner: "Workload-Owner"
    blocks: apply
  - key: application.ticket_trigger
    environments: [production]
    question: "Wann legt das Dashboard ein Ticket an: automatisch nach jedem Lauf mit fehlgeschlagenen Evals (vermutlich, noch nicht entschieden) oder erst auf Klick? Wer legt das GitHub-Token (issues:write, nur dieses Repo) im Tresor als 'github-token' ab?"
    owner: "Workload-Owner"
    blocks: apply
  - key: resources.app-service__dashboard.identity.entra_sign_in
    question: "Die Anmeldung nutzt eure bestehende App-Registrierung samt Client Secret. Wer erzeugt das Secret und trägt es im Tresor ein (der Tresor ist nur aus dem Netz erreichbar), und wer trägt nach dem ersten Ausrollen die Weiterleitungsadresse der App ein (https://<App-Adresse>/.auth/login/aad/callback)?"
    owner: "Identitäts-Team"
    blocks: apply
  - key: resources.container-registry.networking.image_push_path
    question: "Die Registry ist nur privat erreichbar. Wie kommt das Image hinein (Pipeline-Runner im Netz oder ein Build in der Registry)?"
    owner: "Workload-Owner"
    blocks: apply
