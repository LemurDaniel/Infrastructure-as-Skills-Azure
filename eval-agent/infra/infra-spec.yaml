schema_version: 1

spec:
  id: claude-plugin-eval-agent
  target: bicep
  generated_by: infrastructure-as-skills-azure
  skill: iac-authoring
  skill_version: 0.1.0
  at: 2026-10-24T12:00:00Z

context:
  environments: [production]
  language: de
  # location, workload, subscription_id and resource_group_name are parameterized: input
  # parameters the stage file supplies, never asked and never baked into the spec.

deployment:
  deploy_mechanism:
    value: github
    source: asked
  pipeline_auth:
    value: workload_identity
    source: default
  pipeline_approvals:
    value: production
    source: default

  module_source:
    value: authored
    source: asked
  naming_convention:
    value: default
    source: default

  stage_isolation:
    value: subscription
    source: default
  non_production_savings:
    value: enabled
    source: default

  # requirements (the customer's answers)
  network_requirements:
    value: free
    source: asked
  outage_impact:
    value: tolerable
    source: asked
  data_loss_tolerance:
    value: reproducible
    source: asked
  data_access_pattern:
    value: active
    source: asked
  backup_isolation:
    value: operational
    source: asked
  data_residency:
    value: data_zone
    source: asked

  # posture
  landing_zone:
    value: standalone
    source: forced
    forced_by: deployment.network_requirements
  network_exposure:
    value: private_with_exceptions
    source: asked
  local_auth:
    value: disabled
    source: default
  mandates:
    value: []
    source: asked
  key_protection:
    value: software
    source: default
  key_management:
    value: platform_managed
    source: default

  # network
  network_ownership:
    value: create
    source: forced
    forced_by: deployment.landing_zone
  address_space:
    value:
      production: 10.100.0.0/24
    source: asked
  private_endpoint_subnet_prefix:
    value:
      production: 10.100.0.0/27
    source: forced
    forced_by: deployment.network_requirements

  # dns
  private_dns_ownership:
    value: deployment
    source: forced
    forced_by: deployment.landing_zone

  # observability
  observability_ownership:
    value: create
    source: forced
    forced_by: deployment.landing_zone
  diagnostics_destination:
    value: log-analytics-workspace
    source: forced
    forced_by: deployment.observability_ownership
  log_retention_days:
    value: 30
    source: asked
  daily_quota_gb:
    value: -1
    source: default

composition:
  granularity: per-concern
  source: default
  modules:
    - id: network
      contains: [virtual-network]
      implementation: authored
      source: deployment
      outputs: [id, integration_subnet_id, private_endpoint_subnet_id]
    - id: observability
      contains: [log-analytics-workspace]
      implementation: authored
      source: deployment
      outputs: [id]
    - id: identity-dashboard
      contains: [user-assigned-identity__dashboard]
      implementation: authored
      source: deployment
      outputs: [id, principal_id, client_id]
    - id: identity-agent
      contains: [user-assigned-identity__agent]
      implementation: authored
      source: deployment
      outputs: [id, principal_id, client_id]
    - id: identity-drift
      contains: [user-assigned-identity__drift]
      implementation: authored
      source: deployment
      outputs: [id, principal_id, client_id]
    - id: identity-fuzz
      contains: [user-assigned-identity__fuzz]
      implementation: authored
      source: deployment
      outputs: [id, principal_id, client_id]
    - id: identity-tune
      contains: [user-assigned-identity__tune]
      implementation: authored
      source: deployment
      outputs: [id, principal_id, client_id]
    - id: registry
      contains: [container-registry]
      implementation: authored
      source: deployment
      needs: [network, observability]
      outputs: [id, login_server]
    - id: ai
      contains: [foundry]
      implementation: authored
      source: deployment
      needs: [network, observability]
      outputs: [id, endpoint]
    - id: storage
      contains: [storage-account]
      implementation: authored
      source: deployment
      needs: [network, observability]
      outputs: [id, name]
    - id: vault
      contains: [key-vault]
      implementation: authored
      source: deployment
      needs: [network, observability]
      outputs: [id, vault_uri]
    - id: app
      # Five sites on one plan (the question set renders one site per plan; the shared plan is
      # rendered by hand, see resources.app-service__agent.hosting).
      contains: [app-service__dashboard, app-service__agent, app-service__drift, app-service__fuzz, app-service__tune]
      implementation: authored
      source: deployment
      needs: [network, observability, identity-dashboard, identity-agent, identity-drift, identity-fuzz, identity-tune, registry, vault, ai, storage]
      outputs: [id, default_hostname]

resources:

  virtual-network:
    addressing:
      address_space:
        value:
          production: 10.100.0.0/24
        source: deployment
      subnets:
        value:
          production:
            - { name: pe, prefix: 10.100.0.0/27 }
            - { name: app-integration, prefix: 10.100.0.64/26 }
        source: default
      private_endpoint_subnet_prefix:
        value:
          production: 10.100.0.0/27
        source: deployment
      dns_servers:
        value: []
        source: default
    subnet_policy:
      private_endpoint_network_policies:
        value: Enabled
        source: default
      service_endpoints:
        value: []
        source: default
      subnet_delegations:
        value:
          - { subnet: app-integration, service: Microsoft.Web/serverFarms }
        source: forced
        forced_by: resources.app-service__dashboard.networking.vnet_integration
    security:
      ddos_protection:
        value: false
        source: default
      subnets_expecting_nsg:
        value:
          production: []
        source: default
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      flow_logs_enabled:
        value: false
        source: default

  log-analytics-workspace:
    cost:
      retention_days:
        value: 30
        source: deployment
      daily_quota_gb:
        value: -1
        source: deployment
      sku:
        value: PerGB2018
        source: default
    access:
      public_network_access:
        value: enabled
        source: default
      local_auth:
        value: false
        source: deployment
      rbac_only_access:
        value: true
        source: default
    data_protection:
      immediate_purge_protection:
        value: true
        source: default
      archive_to_storage:
        value: false
        source: default

  # One identity per app: the dashboard (internet-facing, holds the sign-in secret and the GitHub
  # token) and the agent (runs plugin code, holds no secret) share no role.
  user-assigned-identity__dashboard:
    identity:
      purpose:
        value: app-runtime
        source: default
        # AcrPull and the data roles must exist before the container first starts, which a
        # system-assigned identity of the app cannot have.
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  user-assigned-identity__agent:
    identity:
      purpose:
        value: app-runtime
        source: default
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  # The drift watcher reaches the AVM sources on the internet, so it gets its own identity: it
  # shares no role with the agent (which runs plugin code) or the dashboard (which holds the
  # sign-in secret).
  user-assigned-identity__drift:
    identity:
      purpose:
        value: app-runtime
        source: default
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  # The fuzz agent runs plugin code and calls no model: it gets its own identity with the image
  # and data roles only, so it shares nothing with the agent, the drift watcher or the dashboard.
  user-assigned-identity__fuzz:
    identity:
      purpose:
        value: app-runtime
        source: default
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  # The tuner reads the fuzz report, lets the Foundry model draft a layout change and opens a pull
  # request: it holds the one GitHub token for that and shares no role with the other apps.
  user-assigned-identity__tune:
    identity:
      purpose:
        value: app-runtime
        source: default
      federated_credentials:
        value: []
        source: default
      isolation_scope:
        value: None
        source: default
      role_assignments:
        value:
          production: []
        source: default

  container-registry:
    registry:
      sku:
        value: Premium
        source: forced
        forced_by: deployment.network_exposure
      zone_redundant:
        value: false
        source: requirement
        derived_from: deployment.outage_impact
      geo_replicas:
        value:
          production: []
        source: default
      retention_untagged_days:
        value: 7
        source: default
    networking:
      public_network_access:
        value: disabled
        source: deployment
      private_endpoint_subnet:
        value: pe
        source: deployment
      network_rule_bypass:
        value: None
        source: default
      export_policy_enabled:
        value: false
        source: default
    identity:
      managed_identity:
        value: none
        source: default
      role_assignments:
        value:
          production: []
        source: default
    security:
      admin_enabled:
        value: false
        source: deployment
      anonymous_pull_enabled:
        value: false
        source: default
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [ContainerRegistryRepositoryEvents, ContainerRegistryLoginEvents]
        source: default
      metrics_enabled:
        value: true
        source: default

  foundry:
    account:
      kind:
        value: AIServices
        source: default
      sku_name:
        value: S0
        source: default
      project_management:
        value: true
        source: default
      projects:
        value: [eval]
        source: overridden
        reason: "Departs from the default []: Foundry evaluations are scoped to a project."
    models:
      deployment_sku:
        value: DataZoneStandard
        source: requirement
        derived_from: deployment.data_residency
      deployment_capacity:
        value: 10
        source: default
      version_upgrade_option:
        value: OnceCurrentVersionExpired
        source: default
      content_filter:
        value: Microsoft.DefaultV2
        source: default
    networking:
      public_network_access:
        value: disabled
        source: deployment
      private_endpoint_subnet:
        value: pe
        source: deployment
      restrict_outbound:
        value: true
        source: default
    identity:
      managed_identity:
        value: system_assigned
        source: default
      role_assignments:
        value:
          production: []
        source: default
    security:
      local_authentication_disabled:
        value: true
        source: deployment
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [Audit, RequestResponse, AzureOpenAIRequestUsage]
        source: default
      metrics_enabled:
        value: true
        source: default

  storage-account:
    networking:
      public_network_access:
        value: disabled
        source: deployment
      private_endpoint_subnet:
        value: pe
        source: deployment
      private_endpoint_subresources:
        value: [blob]
        source: default
      allow_azure_services_bypass:
        value: true
        source: default
    identity:
      managed_identity:
        value: system_assigned
        source: default
      role_assignments:
        value:
          production: []
        source: default
    security:
      shared_access_key_enabled:
        value: false
        source: deployment
      min_tls_version:
        value: TLS1_2
        source: default
      https_traffic_only:
        value: true
        source: default
      allow_blob_public_access:
        value: false
        source: default
      infrastructure_encryption_enabled:
        value: true
        source: default
      key_management:
        value: platform_managed
        source: deployment
      sftp_enabled:
        value: false
        source: default
    data_protection:
      replication:
        value: LRS
        source: requirement
        derived_from: deployment.outage_impact
      access_tier:
        value: Hot
        source: requirement
        derived_from: deployment.data_access_pattern
      blob_soft_delete_days:
        value: 0
        source: requirement
        derived_from: deployment.data_loss_tolerance
      container_soft_delete_days:
        value: 0
        source: requirement
        derived_from: deployment.data_loss_tolerance
      versioning_enabled:
        value: false
        source: requirement
        derived_from: deployment.data_loss_tolerance
      change_feed_enabled:
        value: false
        source: default
      point_in_time_restore_days:
        value: 0
        source: default
      immutability:
        value: none
        source: default
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [audit]
        source: default
      metrics_enabled:
        value: true
        source: default

  # The dashboard shows the eval results and files the tickets after a failed run. It is the
  # internet-facing part, so it is the one with the sign-in and the GitHub token, and it only reads
  # the results.
  app-service__dashboard:
    hosting:
      os_type:
        value: Linux
        source: default
      sku:
        value: B2
        source: overridden
        reason: "The subscription has no App Service quota in germanywestcentral (SubscriptionIsOverQuotaForSku for P1v3 and B1), so the stack runs in westeurope on B2. B2 is Basic: VNet integration, always on and the container run; no slots, no autoscale, no zone redundancy."
      zone_redundant:
        value: false
        source: requirement
        derived_from: deployment.outage_impact
      instance_count:
        value: 1
        source: requirement
        derived_from: deployment.outage_impact
    networking:
      public_network_access:
        value: enabled
        source: overridden
        reason: "The dashboard is the one internet-facing part (customer: reachable from the internet, sign-in with company accounts). Departs from the private baseline, which would map to disabled."
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value: app-integration
        source: forced
        forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source: overridden
        reason: "The agent needs the internet (plugin source, package installs). With all traffic routed into the VNet there is no outbound path without a NAT gateway; private endpoint addresses are RFC 1918 and still go through the VNet."
    identity:
      managed_identity:
        value: user_assigned
        source: overridden
        reason: "Departs from system_assigned: AcrPull and the data roles must exist before the container first starts, which a system-assigned identity cannot have."
      user_assigned_identity_ids:
        value:
          production: [user-assigned-identity__dashboard]
        source: forced
        forced_by: resources.app-service__dashboard.identity.managed_identity
      entra_sign_in:
        # No question set covers App Service authentication; this decision is rendered by hand
        # (authsettingsV2: sign-in required, redirect to login). The registration exists already;
        # its client id and the tenant id are stage-file parameters.
        value: existing_app_registration
        source: stated
      entra_client_secret:
        # The sign-in uses the registration's client secret, held in the vault and read through
        # a Key Vault reference in the app settings; never a value in the template.
        value: key_vault_reference
        source: stated
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: "1.2"
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      always_on:
        value: true
        source: default
      health_check_path:
        value: ""
        source: default
      http2_enabled:
        value: true
        source: default
      container_image_owner:
        value: image_pipeline
        source: overridden
        reason: "A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only on the first deployment and keeps the running one afterwards."
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [AppServiceHTTPLogs, AppServiceAppLogs, AppServiceAuditLogs, AppServiceIPSecAuditLogs, AppServicePlatformLogs]
        source: default
      metrics_enabled:
        value: true
        source: default

  # The agent runs the evals (plugin code, model calls) and writes the results. It is not
  # reachable from outside and holds no secret: neither the sign-in secret nor the GitHub token.
  app-service__agent:
    hosting:
      # The plan is shared with the dashboard: one B2 plan, two sites. The question set renders one
      # site per plan, so the plan is rendered once (from the dashboard's values) and the site of
      # the agent is rendered by hand; both decisions below follow the dashboard.
      os_type:
        value: Linux
        source: forced
        forced_by: resources.app-service__dashboard.hosting.os_type
      sku:
        value: B2
        source: forced
        forced_by: resources.app-service__dashboard.hosting.sku
      zone_redundant:
        value: false
        source: forced
        forced_by: resources.app-service__dashboard.hosting.zone_redundant
      instance_count:
        value: 1
        source: forced
        forced_by: resources.app-service__dashboard.hosting.instance_count
    networking:
      public_network_access:
        value: disabled
        source: overridden
        reason: "Nothing outside the VNet calls the agent: the dashboard starts a run from inside the VNet, through the agent's private endpoint."
      private_endpoint_subnet:
        value: pe
        source: deployment
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value: app-integration
        source: forced
        forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source: overridden
        reason: "The agent needs the internet (plugin source, package installs). With all traffic routed into the VNet there is no outbound path without a NAT gateway; private endpoint addresses are RFC 1918 and still go through the VNet."
    identity:
      managed_identity:
        value: user_assigned
        source: overridden
        reason: "Departs from system_assigned: AcrPull and the data roles must exist before the container first starts, which a system-assigned identity cannot have."
      user_assigned_identity_ids:
        value:
          production: [user-assigned-identity__agent]
        source: forced
        forced_by: resources.app-service__agent.identity.managed_identity
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: "1.2"
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      always_on:
        value: true
        source: default
      health_check_path:
        value: ""
        source: default
      http2_enabled:
        value: true
        source: default
      container_image_owner:
        value: image_pipeline
        source: overridden
        reason: "A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only on the first deployment and keeps the running one afterwards."
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [AppServiceHTTPLogs, AppServiceAppLogs, AppServiceAuditLogs, AppServiceIPSecAuditLogs, AppServicePlatformLogs]
        source: default
      metrics_enabled:
        value: true
        source: default

  # The drift watcher compares the AVM versions pinned in the plugin with the current ones (MCR
  # tag list, module repo tags, module READMEs), lets the Foundry model diff the inputs and opens
  # a pull request that bumps the pin. It runs on a timer inside the app and on demand from the
  # dashboard. It is not reachable from outside; its only write targets are the report in the
  # storage account and the pull request. Azure is read-only to it: no role beyond the data roles
  # in wiring.role_assignments.
  app-service__drift:
    hosting:
      os_type:
        value: Linux
        source: forced
        forced_by: resources.app-service__dashboard.hosting.os_type
      sku:
        value: B2
        source: forced
        forced_by: resources.app-service__dashboard.hosting.sku
      zone_redundant:
        value: false
        source: forced
        forced_by: resources.app-service__dashboard.hosting.zone_redundant
      instance_count:
        value: 1
        source: forced
        forced_by: resources.app-service__dashboard.hosting.instance_count
    networking:
      public_network_access:
        value: disabled
        source: overridden
        reason: "Nothing outside the VNet calls the drift watcher: the dashboard starts a run from inside the VNet, through its private endpoint."
      private_endpoint_subnet:
        value: pe
        source: deployment
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value: app-integration
        source: forced
        forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source: overridden
        reason: "The watcher reads the AVM sources on the internet (github.com, api.github.com, raw.githubusercontent.com, mcr.microsoft.com, azure.github.io). With all traffic routed into the VNet there is no outbound path without a NAT gateway; private endpoint addresses are RFC 1918 and still go through the VNet."
    identity:
      managed_identity:
        value: user_assigned
        source: overridden
        reason: "Departs from system_assigned: AcrPull and the data roles must exist before the container first starts, which a system-assigned identity cannot have."
      user_assigned_identity_ids:
        value:
          production: [user-assigned-identity__drift]
        source: forced
        forced_by: resources.app-service__drift.identity.managed_identity
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: "1.2"
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      always_on:
        value: true
        source: default
        # The schedule is a timer inside the app, so the site must not idle out.
      health_check_path:
        value: ""
        source: default
      http2_enabled:
        value: true
        source: default
      container_image_owner:
        value: image_pipeline
        source: overridden
        reason: "A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only on the first deployment and keeps the running one afterwards."
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [AppServiceHTTPLogs, AppServiceAppLogs, AppServiceAuditLogs, AppServiceIPSecAuditLogs, AppServicePlatformLogs]
        source: default
      metrics_enabled:
        value: true
        source: default

  # The fuzz agent draws random valid specs with the plugin's diagram script and scores the layout
  # (run_fuzz.py: Python and PyYAML only). It runs on a timer inside the app and on demand from the
  # dashboard. It is not reachable from outside, calls no model and holds no secret: its only write
  # target is the report and the worst cases in the storage account, its only roles are the image
  # and the data role in wiring.role_assignments.
  app-service__fuzz:
    hosting:
      os_type:
        value: Linux
        source: forced
        forced_by: resources.app-service__dashboard.hosting.os_type
      sku:
        value: B2
        source: forced
        forced_by: resources.app-service__dashboard.hosting.sku
      zone_redundant:
        value: false
        source: forced
        forced_by: resources.app-service__dashboard.hosting.zone_redundant
      instance_count:
        value: 1
        source: forced
        forced_by: resources.app-service__dashboard.hosting.instance_count
    networking:
      public_network_access:
        value: disabled
        source: overridden
        reason: "Nothing outside the VNet calls the fuzz agent: the dashboard starts a run from inside the VNet, through its private endpoint."
      private_endpoint_subnet:
        value: pe
        source: deployment
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value: app-integration
        source: forced
        forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source: overridden
        reason: "The fuzz agent needs no outbound internet at run time (the plugin code is in the image), but the site shares the integration subnet and its setting with the other apps; private endpoint addresses are RFC 1918 and go through the VNet either way."
    identity:
      managed_identity:
        value: user_assigned
        source: overridden
        reason: "Departs from system_assigned: AcrPull and the data roles must exist before the container first starts, which a system-assigned identity cannot have."
      user_assigned_identity_ids:
        value:
          production: [user-assigned-identity__fuzz]
        source: forced
        forced_by: resources.app-service__fuzz.identity.managed_identity
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: "1.2"
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      always_on:
        value: true
        source: default
        # The schedule is a timer inside the app, so the site must not idle out.
      health_check_path:
        value: ""
        source: default
      http2_enabled:
        value: true
        source: default
      container_image_owner:
        value: image_pipeline
        source: overridden
        reason: "A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only on the first deployment and keeps the running one afterwards."
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [AppServiceHTTPLogs, AppServiceAppLogs, AppServiceAuditLogs, AppServiceIPSecAuditLogs, AppServicePlatformLogs]
        source: default
      metrics_enabled:
        value: true
        source: default

  # The tuner improves the diagram layout. It reads the fuzz report from the storage account, lets
  # the Foundry model draft a change to new_diagram.py, re-runs the fuzzer and the tests on it and,
  # only when the score drops and the tests pass, opens a pull request. It never merges and never
  # touches a baseline or a case. It runs on a timer inside the app - which reads the newest fuzz
  # report from the storage account and starts only when the score is worse than the baseline by
  # a threshold - and on demand from the dashboard. It is not reachable from outside. Azure is read-only to it: no role beyond the data roles in wiring.role_assignments.
  app-service__tune:
    hosting:
      os_type:
        value: Linux
        source: forced
        forced_by: resources.app-service__dashboard.hosting.os_type
      sku:
        value: B2
        source: forced
        forced_by: resources.app-service__dashboard.hosting.sku
      zone_redundant:
        value: false
        source: forced
        forced_by: resources.app-service__dashboard.hosting.zone_redundant
      instance_count:
        value: 1
        source: forced
        forced_by: resources.app-service__dashboard.hosting.instance_count
    networking:
      public_network_access:
        value: disabled
        source: overridden
        reason: "Nothing outside the VNet calls the tuner: the dashboard starts a run from inside the VNet, through its private endpoint."
      private_endpoint_subnet:
        value: pe
        source: deployment
      vnet_integration:
        value: true
        source: default
      integration_subnet:
        value: app-integration
        source: forced
        forced_by: deployment.network_ownership
      vnet_route_all:
        value: false
        source: overridden
        reason: "The tuner reads the plugin source and opens its pull request on github.com and api.github.com. With all traffic routed into the VNet there is no outbound path without a NAT gateway; private endpoint addresses are RFC 1918 and still go through the VNet."
    identity:
      managed_identity:
        value: user_assigned
        source: overridden
        reason: "Departs from system_assigned: AcrPull and the data roles must exist before the container first starts, which a system-assigned identity cannot have."
      user_assigned_identity_ids:
        value:
          production: [user-assigned-identity__tune]
        source: forced
        forced_by: resources.app-service__tune.identity.managed_identity
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: "1.2"
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated
      always_on:
        value: true
        source: default
        # The schedule is a timer inside the app, so the site must not idle out.
      health_check_path:
        value: ""
        source: default
      http2_enabled:
        value: true
        source: default
      container_image_owner:
        value: image_pipeline
        source: overridden
        reason: "A separate pipeline builds, pushes and updates the image. This template sets the stage-file image only on the first deployment and keeps the running one afterwards."
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [AppServiceHTTPLogs, AppServiceAppLogs, AppServiceAuditLogs, AppServiceIPSecAuditLogs, AppServicePlatformLogs]
        source: default
      metrics_enabled:
        value: true
        source: default

  key-vault:
    vault:
      sku:
        value: standard
        source: default
      purge_protection:
        value: true
        source: default
      soft_delete_retention_days:
        value: 90
        source: default
      rbac_authorization:
        value: true
        source: deployment
    networking:
      public_network_access:
        value: disabled
        source: deployment
      private_endpoint_subnet:
        value: pe
        source: deployment
      network_acl_bypass:
        value: None
        source: default
    identity:
      role_assignments:
        value:
          production: []
        source: default
    security:
      enabled_for_services:
        value: []
        source: default
      secret_placeholders:
        value: [entra-client-secret, github-token, github-drift-token, github-tune-token]
        source: overridden
        reason: "Departs from the default []: the dashboard reads the sign-in's client secret and the GitHub token (issues:write on this repository only) the drift watcher reads its own GitHub token (contents and pull requests write on this repository only) and the tuner reads its own (the same scope, a separate token), all through Key Vault references that must exist before the first start. The agent and the fuzz agent read none of them."
    keys:
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [AuditEvent, AzurePolicyEvaluationDetails]
        source: default
      metrics_enabled:
        value: true
        source: default

