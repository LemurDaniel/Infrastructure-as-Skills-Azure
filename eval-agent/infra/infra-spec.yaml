open:
- key: resources.foundry.models.model_deployments
  environments: [production]
  question: Welche Modelle werden gebraucht (Drift-Watcher und Tuner)? Claude-Modelle sind in Foundry womöglich nur weltweit
    verarbeitet verfügbar, das widerspräche 'nur EU'.
  owner: Workload-Owner
  blocks: apply
- key: application.drift_internet_allowlist
  environments: [production]
  question: Der Drift-Watcher darf nur an die AVM-Quellen (github.com, api.github.com, raw.githubusercontent.com, mcr.microsoft.com,
    azure.github.io). App Service filtert den Ausgang nicht; die Liste gilt nur im Code. Reicht das, oder soll der Ausgang
    im Netz erzwungen werden (Firewall oder NAT-Gateway mit Regeln, deutlich mehr Betrieb und Kosten)?
  owner: Workload-Owner
  blocks: apply
- key: application.drift_github_token
  environments: [production]
  question: Der Drift-Watcher prüft wöchentlich. Wer legt das GitHub-Token 'github-drift-token' (nur dieses Repo, Contents
    + Pull requests schreiben) im Tresor ab?
  owner: Workload-Owner
  blocks: apply
- key: application.tune_github_token
  environments: [production]
  question: Der Tuner schreibt Verbesserungen auf einen eigenen Branch (z. B. tune/layout). Wer legt das GitHub-Token 'github-tune-token'
    (nur dieses Repo, Contents schreiben) im Tresor ab, und wer richtet die Branch-Regel ein, die master für das Token sperrt?
  owner: Workload-Owner
  blocks: apply
- key: application.tune_commit_limit
  environments: [production]
  question: 'Der Tuner läuft alle 24 Stunden: läuft der Fuzz-Agent gerade, tut er nichts; sonst verbessert er, schreibt auf
    den Branch, stößt den Fuzz an und wartet auf den nächsten Lauf. Wie viele Verbesserungen darf er pro Lauf höchstens committen
    (z. B. eine)?'
  owner: Workload-Owner
  blocks: apply
- key: resources.app-service__dashboard.identity.entra_sign_in
  question: Die Anmeldung nutzt eure bestehende App-Registrierung samt Client Secret. Wer erzeugt das Secret und trägt es
    im Tresor ein (der Tresor ist nur aus dem Netz erreichbar), und wer trägt nach dem ersten Ausrollen die Weiterleitungsadresse
    der App ein (https://<App-Adresse>/.auth/login/aad/callback) und aktiviert an der Registrierung unter Authentifizierung
    die ID-Token (Implicit- und Hybrid-Flows)? Ohne sie scheitert die Anmeldung mit AADSTS700054.
  owner: Identitäts-Team
  blocks: apply
