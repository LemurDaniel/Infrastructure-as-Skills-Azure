schema_version: 1

resource: Microsoft.Authorization/policyAssignments
title: Azure Policy assignment

naming:
  terraform: "Azure::Microsoft.Authorization/policyAssignments"
  bicep: "Microsoft.Authorization/policyAssignments"
  # An assignment's name is its own identifier: 24 characters at most at management group
  # scope, 64 at subscription and resource group scope, and it is what the compliance view
  # and an exemption refer to. The render builds it from the abbreviation and the decision's
  # key (`pol-allowed-locations`), never from the region or stage: one assignment covers a
  # scope, not a stage resource.
  abbreviation: "pol"

boundaries:
  - "**Scope, not resource group.** An assignment is written on a management group, a subscription or a resource group, and applies to everything below that scope - the workload's resources and everyone else's. There is no resource group to place it in; the scope is the decision (`scope_kind`)."
  - "Does not build the platform's policy baseline. In a landing zone the platform assigns the ALZ policies at the management groups (allowed locations, deny public network access, deploy diagnostic settings, the private DNS records) and the workload works within them (guardrails, section 0). `policy_ownership: platform` renders nothing; an assignment the workload needs is an `open:` entry for the platform team."
  - "Does not render the hierarchy the assignments hang on. Management groups are the `management-group` set; the complete ALZ policy set with its hierarchy is the `avm-ptn-alz` / `avm/ptn/alz/empty` pattern and is never rendered here."
  - "Does not author the rule of a custom definition. A custom policy definition or initiative is **content** (`policies/<name>.rule.json`, `.parameters.json`) written by the governance team and changing at its own pace; this set records that it exists, where it lives and what it is assigned to, and renders the definition resource around the file."
  - "Does not create the identity a `deployIfNotExists` or `modify` assignment runs as. A user-assigned identity is the `user-assigned-identity` set's; this set references it and records which roles it needs on the scope - the role assignment itself is wiring."
  - "Does not create remediation tasks (`Microsoft.PolicyInsights/remediations`). Existing resources stay non-compliant until a remediation runs; the `avm/ptn/policy-insights/remediation` pattern does it in Bicep, and a remediation is an operation, not a lasting resource."
  - "Does not render Defender for Cloud's own standards, regulatory-compliance assignments or Microsoft Purview policies. Defender is its own set; the rest has none."
  - "Has no diagnostic settings: an assignment is a control-plane object without resource logs. Compliance state and policy events are read from the subscription's activity log and Policy Insights, which the platform's activity-log export carries."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          A subscription-scoped assignment is written once per stage, because the stages are
          separate subscriptions (guardrails, *Stages*), and the policy is the same in every
          stage - a development stage that may create resources outside the allowed regions
          is where the data ends up in the wrong country. A management-group-scoped assignment
          is written once and covers every subscription below the group; the stages do not
          multiply it.
        renders: the stage file the subscription comes from; one deployment per stage at subscription scope, one in all at management group scope

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "The assignment's identity lives in the Azure region {value}."
          de: "Die Identität der Zuweisung liegt in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          An assignment has no region of its own - it takes one only when it carries a managed
          identity, which is a regional object; Azure refuses an identity without a location
          and ignores the location without an identity. The deployment's region is written on
          every call so a later switch to `deployIfNotExists` does not fail on a missing value.
        renders: location (only read with an identity)

      - id: subscription_id
        ask: Which subscription?
        type: ref
        ref: subscription
        plain:
          en: "Assigned in the subscription {value}."
          de: "Zugewiesen in der Subscription {value}."
        required: true
        from_context: true
        per_environment: true
        why: >
          The scope of a subscription- or resource-group-scoped assignment, and the
          subscription the deployment runs in. A stage file supplies it; an assignment on the
          wrong subscription denies somebody else's deployments from the next minute on.
        renders: subscription_id (scope `/subscriptions/<id>`) / subscriptionId

      - id: policy_ownership
        ask: Who assigns policies in this subscription?
        type: enum
        resolved_by: platform
        plain:
          en: "Policies are assigned by {value}."
          de: "Richtlinien werden zugewiesen von {value}."
        plain_values:
          platform: { en: "the platform team at the management groups - this deployment assigns none of its own", de: "dem Plattform-Team an den Management-Gruppen, dieses Ausrollen weist keine eigenen zu" }
          deployment: { en: "this deployment", de: "diesem Ausrollen" }
        values: [platform, deployment]
        default: platform
        why: >
          In an application landing zone the platform's policies arrive by inheritance from the
          management groups: allowed locations, the denies, the `deployIfNotExists` baseline
          (guardrails, section 0). An assignment the workload writes on top of them is at best
          a duplicate and at worst a contradiction - two `Allowed locations` assignments
          intersect, and a workload assignment that is looser than the platform's changes
          nothing while one that is stricter breaks the platform's own remediation. So
          `platform` renders nothing, and a control the workload needs that is not inherited is
          an `open:` entry owned by the platform team. `deployment` is for a subscription
          nothing governs, or for a platform run that is building the governance itself.
        forced_when: >
          landing_zone: standalone forces `deployment`: no management group assigns anything,
          so the baseline the guardrails assume (allowed locations, no public network access)
          exists only if the generated code assigns it (recorded as forced with `landing_zone`
          as forced_by)
        renders: whether the questions below render at all

      - id: scope_kind
        ask: How wide should the policy apply?
        type: enum
        plain:
          en: "The policy applies to {value}."
          de: "Die Richtlinie gilt für {value}."
        plain_values:
          management_group: { en: "every subscription below a management group", de: "jede Subscription unterhalb einer Management-Gruppe" }
          subscription: { en: "the whole subscription", de: "die gesamte Subscription" }
          resource_group: { en: "one resource group", de: "eine einzelne Ressourcengruppe" }
        values: [management_group, subscription, resource_group]
        default: subscription
        confirm_in: [production]
        why: >
          The scope is the blast radius. `subscription` is the default for a deployment that
          owns its subscription: the stage's subscription, nothing above it, written from that
          stage's file. `management_group` belongs to a platform run - it reaches subscriptions
          the deployment has never seen - and needs the group name from the platform and a
          deployment at that scope. `resource_group` is for a control on one group only (a
          sandbox group that may use more regions), and it is the one scope an assignment at
          the subscription cannot undo: an exemption does that. The scope cannot change after
          creation; a different scope is a new assignment.
        renders: >
          terraform: azurerm_subscription_policy_assignment / azurerm_management_group_policy_assignment /
          azurerm_resource_group_policy_assignment (the module takes `scope` as an id);
          bicep: subscriptionId / managementGroupId / resourceGroupName on the pattern module

      - id: management_group
        ask: Which management group?
        type: ref
        ref: management_group
        resolved_by: platform
        plain:
          en: "Assigned at the management group {value}."
          de: "Zugewiesen an der Management-Gruppe {value}."
        required: true
        per_environment: true
        depends_on: { question: scope_kind, equals: management_group }
        why: >
          The group's id (the name, not the display name - the display name is free text and
          not part of the resource id). It comes from the platform's hierarchy; a workload
          never names one it did not get from there. The deploying identity needs rights at
          that group (`Resource Policy Contributor`), which the handover lists.
        renders: management_group_id (`/providers/Microsoft.Management/managementGroups/<id>`) / managementGroupId

  # --------------------------------------------------------------- definition
  - id: definition
    title: What is assigned
    questions:
      - id: definition_source
        ask: Is a built-in policy assigned, or a definition of your own?
        type: enum
        plain:
          en: "The assigned rule is {value}."
          de: "Die zugewiesene Regel ist {value}."
        plain_values:
          builtin: { en: "one of Microsoft's built-in policies", de: "eine der eingebauten Richtlinien von Microsoft" }
          custom_definition: { en: "a single rule written by your governance team", de: "eine einzelne, von eurem Governance-Team geschriebene Regel" }
          custom_initiative: { en: "a set of rules put together by your governance team", de: "ein von eurem Governance-Team zusammengestelltes Regelwerk" }
        values: [builtin, custom_definition, custom_initiative]
        default: builtin
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          A built-in definition is maintained by Microsoft, versioned, and referenced by a
          GUID that is the same in every tenant - nothing to author, nothing to keep current.
          A custom definition exists where no built-in covers the rule (a naming convention, a
          tag value, a provider the organisation forbids), and it is a resource of its own that
          has to live **at or above the assignment's scope**: a definition at a subscription
          cannot be assigned at a management group. A custom initiative bundles definitions,
          built-in or custom, so one assignment with one identity carries them; a workload
          rarely needs one. Custom content is written to `policies/` by the governance team
          and the render wraps it in the definition resource.
        renders: >
          builtin: policy_definition_id = `/providers/Microsoft.Authorization/policyDefinitions/<guid>`;
          custom_definition: azurerm_policy_definition / Microsoft.Authorization/policyDefinitions around
          `policies/<name>.rule.json`; custom_initiative: azurerm_policy_set_definition /
          Microsoft.Authorization/policySetDefinitions

      - id: custom_definition_file
        ask: Which file holds the rule?
        type: string
        plain:
          en: "The rule is kept in the file {value}."
          de: "Die Regel liegt in der Datei {value}."
        required: true
        depends_on: { question: definition_source, not_equals: builtin }
        why: >
          The rule (`policyRule`) and its parameters are JSON the governance team writes and
          reviews, not something a render invents: a wrong `if` condition denies every
          deployment in the scope. The path is relative to the root (`policies/<name>.rule.json`
          with `policies/<name>.parameters.json` beside it; an initiative lists its member
          definitions in `policies/<name>.set.json`). The file is read at plan time
          (`file()` / `loadJsonContent()`), so the definition changes when the file does, and
          a missing file is an `open:` entry owned by the engineer, not a placeholder rule.
        renders: policy_rule = file(...) + parameters = file(...) / properties.policyRule = loadJsonContent(...)

      - id: definition_version
        ask: Which version of the built-in definition should the assignment follow?
        type: string
        plain:
          en: "The assignment follows version {value} of the built-in rule (empty: always the newest)."
          de: "Die Zuweisung folgt Version {value} der eingebauten Regel (leer: immer die neueste)."
        default: ""
        depends_on: { question: definition_source, equals: builtin }
        why: >
          Built-in definitions are versioned and an unpinned assignment moves with them: a new
          major version can add a parameter or change an effect, and the next compliance scan
          flags resources that were compliant yesterday. Empty follows the newest, which is
          what the platform's ALZ assignments do and what keeps a workload aligned with them;
          `1.*` pins a major and is the choice for a `Deny` whose change would stop deployments.
          Only the pattern module in Bicep carries it; the Terraform module and the authored
          resources do not, and the handover says so.
        renders: definitionVersion (bicep pattern module); not carried by the Terraform module or the azurerm resources

  # -------------------------------------------------------------- assignments
  - id: assignments
    title: Assignments
    questions:
      - id: assignments
        ask: Which policies should be assigned, with which parameters?
        type: list
        plain:
          en: "These policies are assigned: {value} (empty: only the baseline below)."
          de: "Diese Richtlinien werden zugewiesen: {value} (leer: nur die Grundausstattung unten)."
        default: []
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          One entry per assignment: a key (the assignment's name), the display name, the
          definition (a built-in GUID or the custom file), its parameter values, and - where
          they depart from the set-wide answers below - the enforcement mode, not-scopes and
          non-compliance message. The list is the governance team's content, not an engineer's
          guess: a `Deny` with the wrong parameter stops every deployment in the scope. Each
          entry renders as its own assignment resource with the entry's key as the name, so a
          removed entry removes exactly that assignment. Empty is normal for a workload: the
          baseline below carries what the guardrails imply.
        renders: one azurerm_*_policy_assignment / module call per entry; parameters as `{ <name> = { value = ... } }`

      - id: baseline_assignments
        ask: Which of the baseline controls should this deployment assign itself?
        type: list
        plain:
          en: "The deployment assigns these baseline controls itself: {value} (empty: none, the platform's apply)."
          de: "Das Ausrollen weist diese Grundregeln selbst zu: {value} (leer: keine, die der Plattform gelten)."
        plain_values:
          allowed_locations: { en: "resources may only be created in the regions the data residency allows", de: "Ressourcen dürfen nur in den Regionen entstehen, die die Datenresidenz erlaubt" }
          deny_public_network_access: { en: "resources may not be reachable from the internet", de: "Ressourcen dürfen nicht aus dem Internet erreichbar sein" }
          require_tags: { en: "every resource carries the agreed tags", de: "jede Ressource trägt die vereinbarten Tags" }
        values: [allowed_locations, deny_public_network_access, require_tags]
        default: []
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          The three controls the guardrails already assume: the region constraint behind
          `data_residency`, the posture behind `network_exposure: private`, and the tag set in
          `context.tags`. In a landing zone the platform assigns all three at the management
          groups, which is why the default is empty - a second `Allowed locations` on the
          subscription intersects with the platform's and the narrower one wins silently. A
          `standalone` deployment has nobody assigning them, and then the list is proposed in
          full: without `allowed_locations` the residency decision is a wish, without the
          deny a later hand-made resource is public, without the tag requirement the cost
          view has holes. Each entry renders as one built-in assignment with its parameters
          taken from the questions below; `deny_public_network_access` is a set of built-ins,
          one per resource type the spec contains, with effect `Deny`.
        renders: >
          allowed_locations: built-in `Allowed locations` (e56962a6-4747-49cd-b67b-bf8b01975c4c) with
          listOfAllowedLocations; deny_public_network_access: the per-type built-ins (`Storage accounts
          should disable public network access`, `Azure Key Vault should disable public network access`,
          ...) with effect Deny; require_tags: `Require a tag on resources` (871b6d14-10aa-478d-b590-94f262ecfa99),
          one assignment per tag name

      - id: allowed_locations_scope
        ask: Which regions may resources be created in?
        type: enum
        plain:
          en: "Resources may be created {value}."
          de: "Ressourcen dürfen {value} entstehen."
        plain_values:
          country: { en: "only in the regions of the deployment region's country", de: "nur in den Regionen des Landes der gewählten Region" }
          data_zone: { en: "only in the regions of the deployment region's economic area, such as the EU", de: "nur in den Regionen des Wirtschaftsraums der gewählten Region, etwa der EU" }
          none: { en: "in any region", de: "in jeder Region" }
        values: [country, data_zone, none]
        derived_from:
          question: data_residency
          map: { country: country, data_zone: data_zone, unrestricted: none }
        depends_on: { question: baseline_assignments, contains: allowed_locations }
        why: >
          The residency answer, turned into the region list the built-in `Allowed locations`
          takes. `country` lists the regions of the deployment region's country (Germany West
          Central and Germany North for a German deployment); `data_zone` lists the EU regions
          (or the US ones) as Azure defines its data zones; `none` lists nothing and the
          control is not assigned at all. The list is computed from the `location` parameter at
          render time and written out as the assignment's parameter, so a reviewer sees the
          regions and not a rule. `global` is always added: a global resource (Front Door,
          Traffic Manager, a DNS zone) has that as its location and is otherwise denied.
        renders: parameters.listOfAllowedLocations on the `Allowed locations` assignment

      - id: allowed_locations
        ask: Which regions exactly, if not the ones derived from the residency answer?
        type: list
        plain:
          en: "The allowed regions are {value} (empty: the regions of the residency answer)."
          de: "Erlaubt sind die Regionen {value} (leer: die Regionen der Residenz-Antwort)."
        default: []
        depends_on: { question: baseline_assignments, contains: allowed_locations }
        why: >
          The override for an organisation whose list is not a country or a data zone - two
          named regions out of the EU, say. Empty takes the derived list. A stated list is
          written verbatim and `global` is still added, for the same reason as above. The
          deployment's own `location` has to be in the list, and the render refuses a list
          that would deny the deployment itself.
        renders: parameters.listOfAllowedLocations (replaces the derived list)

      - id: required_tags
        ask: Which tags must every resource carry?
        type: list
        plain:
          en: "Every resource must carry the tags {value}."
          de: "Jede Ressource muss die Tags {value} tragen."
        default: []
        depends_on: { question: baseline_assignments, contains: require_tags }
        why: >
          Empty takes the tag names of `context.tags`, because a tag the deployment sets on
          everything is the one it can also require without denying itself. A stated list is
          for a mandate that names tags the deployment does not set (a cost center the
          platform stamps). Each tag renders as its own assignment of `Require a tag on
          resources` - the built-in takes one tag name - and the effect is `Deny`: a resource
          created without the tag by hand or by another pipeline is refused, which is the point;
          `Audit` would only list it. An `Inherit a tag from the resource group` is not added:
          it needs an identity and a remediation.
        renders: one `Require a tag on resources` assignment per tag, parameters.tagName

      - id: enforcement_mode
        ask: Should the policies be enforced, or only evaluated first?
        type: enum
        plain:
          en: "The policies are {value}."
          de: "Die Richtlinien werden {value}."
        plain_values:
          Default: { en: "enforced: a deployment that breaks one fails", de: "durchgesetzt: ein Ausrollen, das eine verletzt, schlägt fehl" }
          DoNotEnforce: { en: "evaluated only: breaches are listed in the compliance view and nothing is stopped", de: "nur ausgewertet: Verstöße erscheinen in der Compliance-Ansicht, gestoppt wird nichts" }
        values: [Default, DoNotEnforce]
        default: Default
        confirm_in: [production]
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          `Default` is what a policy is for; `DoNotEnforce` is the rehearsal mode - the
          assignment exists, the compliance view fills, no deployment fails - and it is the
          right first step for an assignment on a scope that already holds resources, because a
          `Deny` written over a running system stops its next deployment. It is a per-assignment
          property and an entry in `assignments` can depart; this answer is the default for all
          of them. Switching from `DoNotEnforce` to `Default` is an in-place update. The
          Terraform `azurerm` resources spell it as a bool `enforce`; the module and Bicep take
          the enum.
        renders: "enforce (module: the enum; azurerm resources: bool) / enforcementMode"

      - id: not_scopes
        ask: Which scopes below the assignment should be left out?
        type: list
        plain:
          en: "Left out of the policies: {value} (empty: nothing)."
          de: "Von den Richtlinien ausgenommen: {value} (leer: nichts)."
        default: []
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          Resource ids below the scope (a resource group, a subscription under the group) the
          assignment does not evaluate at all. Empty is the right answer in nearly every case:
          a not-scope hides the resources from the compliance view, and the exemption below
          does the same visibly, with a reason and an expiry. Not-scopes exist for the
          platform's own carve-outs (the connectivity group under a deny on public IPs) and are
          written when the platform says so.
        renders: not_scopes / notScopes

      - id: non_compliance_message
        ask: What should a person read when their deployment is refused?
        type: string
        plain:
          en: "A refused deployment shows the message: {value} (empty: the policy's own text)."
          de: "Ein abgelehntes Ausrollen zeigt die Meldung: {value} (leer: der Text der Richtlinie)."
        default: ""
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          The one line the person sees in the error of a denied deployment. Empty shows the
          definition's own description, which names the rule and not the way out; a message
          that says who to ask and where the exemption process is saves the ticket. Per
          assignment, overridable in the entry; for an initiative a message per member
          definition is possible (`policy_definition_reference_id`) and is content of the
          `assignments` entry.
        renders: non_compliance_messages[].message / nonComplianceMessages[].message

      - id: resource_selectors
        ask: Should the policies apply to a part of the scope only, by region or resource type?
        type: list
        plain:
          en: "The policies are narrowed to: {value} (empty: everything in the scope)."
          de: "Die Richtlinien werden eingegrenzt auf: {value} (leer: alles im Bereich)."
        default: []
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          Resource selectors are the safe-deployment knob: a new `Deny` rolled out to one
          region or one resource type first, then widened. Each entry is a name with selectors
          of kind `resourceLocation`, `resourceType` or `resourceWithoutLocation` and `in` /
          `not_in` lists. Empty applies the assignment to the whole scope, which is the end
          state; a selector left in place is a hole in the control. Content of the governance
          team, recorded here so the render carries it, never invented.
        renders: resource_selectors / resourceSelectors

      - id: overrides
        ask: Should the effect of a policy be changed without editing its definition?
        type: list
        plain:
          en: "Effects changed on assignment: {value} (empty: as defined)."
          de: "Beim Zuweisen geänderte Effekte: {value} (leer: wie definiert)."
        default: []
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          An override sets the effect of one or more member definitions of an initiative
          (`Audit` instead of `Deny` for one reference id) without a copy of the definition.
          It is how a built-in initiative is taken with one rule softened. Empty keeps the
          definitions' effects; an override is a documented departure with the reference id in
          it, so a reviewer finds which rule was weakened.
        renders: overrides / overrides

      - id: exemptions
        ask: Which resources are exempt from the policies, and until when?
        type: list
        plain:
          en: "Exempt from the policies: {value} (empty: nothing)."
          de: "Von den Richtlinien befreit: {value} (leer: nichts)."
        default: []
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          An exemption is the visible way out: a resource or resource group, the assignment it
          is exempt from, a category (`Waiver`: accepted; `Mitigated`: handled elsewhere), a
          display name that says why, and an expiry. It stays in the compliance view as exempt,
          where a not-scope disappears. Each entry renders as its own exemption resource beside
          the assignment. Empty is the normal answer at creation; exemptions arrive with the
          first denied deployment and are content of the governance team.
        renders: exemptions[] (module) / azurerm_*_policy_exemption / the avm/ptn/authorization/policy-exemption module

      - id: exemption_expiry_required
        ask: Must every exemption have an end date?
        type: bool
        plain:
          en: "Exemptions {value}."
          de: "Ausnahmen {value}."
        plain_values:
          true: { en: "must have an end date and lapse by themselves", de: "müssen ein Ablaufdatum haben und laufen von selbst aus" }
          false: { en: "may be open-ended", de: "dürfen unbefristet sein" }
        default: true
        depends_on: { question: policy_ownership, equals: deployment }
        why: >
          An exemption without an expiry is a permanent hole that outlives the reason for it,
          and nobody revisits it. With this answer the render refuses an entry in `exemptions`
          without `expires_on`, and the handover lists the dates. `false` is for a `Mitigated`
          exemption whose control lives elsewhere for good, and it is a departure named in the
          spec.
        renders: a check on exemptions[].expires_on before the render; nothing in the template

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity
    questions:
      - id: identity
        ask: Does the policy need an identity to change or deploy resources?
        type: enum
        plain:
          en: "The policy {value}."
          de: "Die Richtlinie {value}."
        plain_values:
          none: { en: "only checks or refuses and needs no identity", de: "prüft oder lehnt nur ab und braucht keine Identität" }
          user_assigned: { en: "deploys or changes resources, running as a shared identity you manage", de: "legt Ressourcen an oder ändert sie und läuft dabei unter einer gemeinsamen, von euch verwalteten Identität" }
          system_assigned: { en: "deploys or changes resources, running as an identity of its own", de: "legt Ressourcen an oder ändert sie und läuft dabei unter einer eigenen Identität" }
        values: [none, user_assigned, system_assigned]
        default: none
        depends_on: { question: policy_ownership, equals: deployment }
        forced_when: >
          A definition with effect deployIfNotExists or modify removes `none`: the assignment
          is refused without an identity. The baseline entries are Deny policies and keep `none`
        why: >
          `Audit` and `Deny` evaluate and need nothing; `deployIfNotExists` and `modify` act,
          and act as the assignment's identity, which must hold the roles the definition names
          (`roleDefinitionIds`) at the scope. `user_assigned` is preferred: one identity per
          platform or deployment, created by the `user-assigned-identity` set, its roles
          assigned once and kept when an assignment is recreated - a system-assigned identity
          is new on every recreation and its role assignments with it, and the Bicep pattern
          module defaults to `SystemAssigned`, which is why the value is always written. An
          identity makes `location` mandatory.
        renders: identity { type } / identity (`None`, `SystemAssigned`, `UserAssigned`)

      - id: user_assigned_identity
        ask: Which user-assigned identity should the policy run as?
        type: ref
        ref: user_assigned_identity
        plain:
          en: "The policy runs as the identity {value}."
          de: "Die Richtlinie läuft unter der Identität {value}."
        required: true
        per_environment: true
        depends_on: { question: identity, equals: user_assigned }
        why: >
          The resource id of the identity, from the identity module's output in the same root
          or from the platform. It must exist before the assignment and hold its roles before
          the first remediation; the identity set and the role assignment come first in the
          order.
        renders: identity.userAssignedIdentities = { <id> = {} } (module) / identity_ids / userAssignedIdentityId

      - id: identity_role_definitions
        ask: Which roles does the identity need on the scope?
        type: list
        plain:
          en: "The policy's identity holds the roles {value} on the scope."
          de: "Die Identität der Richtlinie hält die Rollen {value} auf dem Bereich."
        default: []
        depends_on: { question: identity, not_equals: none }
        why: >
          The definition names them (`policyRule.then.details.roleDefinitionIds`) and they are
          copied here so the render can assign them: a `deployIfNotExists` whose identity lacks
          the role deploys nothing and reports the failure only in the remediation task.
          Built-in names (`Contributor`, `Monitoring Contributor`, `Log Analytics
          Contributor`), the narrowest the definition accepts, never `Owner`. Assigned at the
          assignment's scope - the Terraform module and the Bicep pattern module do it from
          this list, the authored render adds an `azurerm_role_assignment` beside the
          assignment. Empty with an identity is refused.
        renders: role_assignments (module) / roleDefinitionIds (bicep pattern module) / azurerm_role_assignment on the scope
