schema_version: 1

resource: Microsoft.Management/managementGroups
title: Azure management group

naming:
  terraform: "Azure::Microsoft.Management/managementGroups"
  bicep: "Microsoft.Management/managementGroups"
  # The group id is the resource name, is immutable and is tenant-unique; the render builds it
  # from the abbreviation and the stated id segment (`mg-payments`), without region or stage: a
  # hierarchy is one per tenant and has no stage.
  abbreviation: "mg"

boundaries:
  - "**Tenant scope.** A management group sits under the tenant root group or another group; there is no subscription, resource group or region. The render deploys at management group scope (Bicep `targetScope = 'managementGroup'` on the parent, the `azurerm` provider's tenant-level resource) and needs `Management Group Contributor` on the parent."
  - "Does not build the hierarchy. The ALZ hierarchy (platform, landing zones, corp, online, sandbox, decommissioned) with its policies and role assignments is the `avm-ptn-alz` (Terraform) / `avm/ptn/alz/empty` (Bicep) pattern, owned by the platform team; this set is one group hung under an existing one - a workload's or a team's - and `management_group_ownership: platform` renders nothing."
  - "Does not create the subscriptions it moves in (`subscription` set) and does not assign policies at the group (`policy` set). Both reference the group's id."
  - "Does not render the role assignments' principals. A group or a service principal comes from the identity team; the assignment at the group is listed here and rendered through the `role-assignment` set's interface."
  - "Does not render Azure Policy inheritance settings, management group diagnostic settings (the activity log of a group has a setting of its own, owned by the platform) or hierarchy settings (`Microsoft.Management/managementGroups/settings`: the default group for new subscriptions, authorisation requirement) - the last two are tenant-wide and the platform's."
  - "Has no diagnostic settings of the resource kind: a group's activity log export is the platform's, and `check_question_set.py` therefore sees no observability group here."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          A management group is one per tenant: the stages of a workload live in subscriptions
          below it and do not multiply the group. The deployment runs once, from the single
          stage file of the platform run; a stack with several stages lists them so the
          subscriptions below are known, and only the production stage file carries the
          hierarchy.
        renders: the stage file the parent and the subscriptions come from; one deployment, not one per stage

      - id: management_group_ownership
        ask: Who creates management groups in this tenant?
        type: enum
        resolved_by: platform
        plain:
          en: "Management groups are created by {value}."
          de: "Management-Gruppen werden angelegt von {value}."
        plain_values:
          platform: { en: "the platform team as part of the landing zone hierarchy - this deployment creates none", de: "dem Plattform-Team als Teil der Landing-Zone-Hierarchie, dieses Ausrollen legt keine an" }
          deployment: { en: "this deployment", de: "diesem Ausrollen" }
        values: [platform, deployment]
        default: platform
        why: >
          The hierarchy is the platform's backbone: policy and RBAC inherit along it, and the
          ALZ pattern that builds it reconciles the groups on every run - a group a workload
          creates beside it is either moved by the next platform run or breaks its assumptions
          about what sits under *landing zones*. So `platform` renders nothing and a group the
          workload needs is an `open:` entry owned by the platform team. `deployment` is for a
          platform run that owns the hierarchy, or a tenant without one.
        forced_when: >
          landing_zone: standalone forces `deployment`: there is no hierarchy and no platform
          team, and a group under the tenant root is where the deployment's own policy
          assignments and role assignments hang (recorded as forced with `landing_zone` as
          forced_by)
        renders: whether the questions below render at all

      - id: parent
        ask: Under which management group should it sit?
        type: ref
        ref: management_group
        resolved_by: platform
        plain:
          en: "Placed under the management group {value}."
          de: "Hängt unter der Management-Gruppe {value}."
        required: true
        per_environment: true
        depends_on: { question: management_group_ownership, equals: deployment }
        why: >
          The parent's id (the name in the resource id, not its display name). It decides
          what the new group inherits - every policy and role assignment of the parent and its
          ancestors - and it comes from the platform's hierarchy: a team group goes under
          *landing zones* or *corp*, never under *platform*, and the tenant root group is the
          parent only in a tenant with no hierarchy. The parent can be changed later (a move),
          but a move changes the inherited policies on every subscription below at once.
        renders: parent_management_group_id (`/providers/Microsoft.Management/managementGroups/<id>`) / parentId (the id alone)

  # -------------------------------------------------------------------- group
  - id: group
    title: The group
    questions:
      - id: group_id
        ask: What should the group's id be?
        type: string
        plain:
          en: "The group's id is {value}."
          de: "Die Gruppe hat die ID {value}."
        required: true
        depends_on: { question: management_group_ownership, equals: deployment }
        why: >
          The id is the resource name and is **immutable and tenant-unique**: letters, digits,
          hyphens, underscores, periods and parentheses, up to 90 characters, and it cannot
          start with a period or end with one. It appears in every policy and role
          assignment scope below it, which is why a short, stable id (`mg-payments`) beats a
          descriptive one - the display name is for reading. Required because nothing can
          guess it, and an `open:` entry owned by the platform team until given.
        renders: name

      - id: display_name
        ask: What should people see as the group's name?
        type: string
        plain:
          en: "Shown as \"{value}\" (empty: the id)."
          de: "Angezeigt als „{value}“ (leer: die ID)."
        default: ""
        depends_on: { question: management_group_ownership, equals: deployment }
        why: >
          Free text, changeable, shown in the portal's hierarchy view. Empty falls back to the
          id in both targets (the Bicep module does it, the `azurerm` resource does it), which
          is fine for a short id and unreadable for a generated one.
        renders: display_name / displayName

      - id: subscriptions
        ask: Which subscriptions should be moved into the group?
        type: list
        plain:
          en: "These subscriptions are moved into the group: {value} (empty: none)."
          de: "Diese Subscriptions werden in die Gruppe verschoben: {value} (leer: keine)."
        default: []
        depends_on: { question: management_group_ownership, equals: deployment }
        why: >
          Subscription ids. Moving a subscription under the group changes the policies and
          role assignments it inherits from the next evaluation on, and a subscription is under
          exactly one group - a move out of its old group is implicit. Empty is normal when the
          `subscription` set vends subscriptions straight into the group (`management_group`
          there). A subscription listed here and in a vending call is two writers; the
          association is written in one place. The deploying identity needs rights on the
          subscription as well as the group (`Management Group Contributor` on both, or `Owner`
          on the subscription).
        renders: azurerm_management_group_subscription_association per id / the avm/ptn/mgmt-groups/subscription-placement module, Microsoft.Management/managementGroups/subscriptions

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Access
    questions:
      - id: role_assignments
        ask: Who should have which role on everything below the group?
        type: list
        plain:
          en: "Access at the group: {value} (empty: inherited only)."
          de: "Zugriff an der Gruppe: {value} (leer: nur geerbt)."
        default: []
        depends_on: { question: management_group_ownership, equals: deployment }
        why: >
          An assignment at the group reaches every subscription and resource below it, now and
          later, which is why the list is empty by default and every entry is a departure that
          names the principal: `Reader` for a platform or audit group is the common one,
          `Contributor` or `Owner` at a group is a finding unless the group is the team's own
          and the principal its deployment identity. Each entry is a principal (a group or a
          service principal, never a person), a built-in role by name, and a description;
          rendered through the `role-assignment` set at the group's id.
        renders: azurerm_role_assignment at the group's id / Microsoft.Authorization/roleAssignments with the group as scope
