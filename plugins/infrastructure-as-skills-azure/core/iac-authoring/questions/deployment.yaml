      - id: resource_group_mode_observability
        ask: Does the monitoring resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when observability is in resource_groups_created, otherwise `existing`;
