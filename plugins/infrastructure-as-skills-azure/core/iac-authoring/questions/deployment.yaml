        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: observability }
        why: >
          See resource_group_mode_main. A central monitoring group usually
          belongs to the platform, which collects the logs of many workloads in
          it - a workload that creates it owns a workspace nobody else feeds.
        renders: >
          existing: variable resource_group_name_observability per stage; create:
          the AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_security
