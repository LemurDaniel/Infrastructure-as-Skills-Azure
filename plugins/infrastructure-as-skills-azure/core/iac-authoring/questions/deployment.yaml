          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: security }
        why: See resource_group_mode_main; keys and secrets groups are often fenced by their own RBAC, which is a reason to expect it from outside.
        renders: >
          existing: variable resource_group_name_security per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_foundation
        ask: Does the foundation resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when foundation is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The foundation resource group {value}."
          de: "Die Ressourcengruppe für das Fundament {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: foundation }
        why: See resource_group_mode_main; the network and monitoring in it are often handed out by a platform team.
        renders: >
          existing: variable resource_group_name_foundation per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_state
        ask: Does the state resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when state is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The state resource group {value}."
          de: "Die Ressourcengruppe für den Zustand {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: state }
        why: See resource_group_mode_main; the group holding the data is the one whose deletion is the most expensive mistake, so it is the strongest case for existing.
        renders: >
          existing: variable resource_group_name_state per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_runtime
        ask: Does the runtime resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when runtime is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The runtime resource group {value}."
          de: "Die Ressourcengruppe für die Laufzeit {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: runtime }
        why: See resource_group_mode_main; the runtime group is the one a workload most often owns, since nothing in it outlives a rebuild, but creating it still costs Contributor on the subscription.
        renders: >
          existing: variable resource_group_name_runtime per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_protected
        ask: Does the protected resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when protected is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The protected resource group {value}."
          de: "Die Ressourcengruppe für Geschütztes {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: protected }
        why: See resource_group_mode_main; the group holding data and secrets is the strongest case for existing - its administrator rights are set by whoever hands it out.
        renders: >
          existing: variable resource_group_name_protected per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_standard
        ask: Does the standard resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when standard is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The standard resource group {value}."
          de: "Die Ressourcengruppe für den Rest {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: standard }
        why: See resource_group_mode_main; nothing in it holds data, so it is the group a workload most often owns, but creating it still costs Contributor on the subscription.
        renders: >
          existing: variable resource_group_name_standard per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_shared
        ask: Does the shared resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when shared is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The shared resource group {value}."
          de: "Die Ressourcengruppe für das Gemeinsame {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: shared }
        why: See resource_group_mode_main; the network and monitoring every part uses are often handed out by a platform team.
        renders: >
          existing: variable resource_group_name_shared per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_part
        ask: Does the part resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when part is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The part resource group {value}."
          de: "Die Ressourcengruppe eines Teils {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_scheme, equals: component }
        why: See resource_group_mode_main. One entry here stands for the per-part keys (resource_group_mode_chat), because a design's parts are not known before it.
        renders: >
          existing: variable resource_group_name_part per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_lock
        ask: Should created resource groups be protected against deletion?
        type: enum
        plain:
          en: "Created resource groups {value}."
          de: "Angelegte Ressourcengruppen {value}."
        plain_values:
          production: { en: "carry a delete lock in production", de: "tragen in der Produktion eine Löschsperre" }
          all_stages: { en: "carry a delete lock in every stage", de: "tragen in jeder Stufe eine Löschsperre" }
          none: { en: "carry no lock", de: "tragen keine Sperre" }
        values: [production, all_stages, none]
        default: production
        why: >
          A group created by the render is deleted by a careless destroy or a
          portal click with everything in it. A CanNotDelete lock in production
          is the cheap guard; in the other stages it only gets in the way of
          teardown, which is why it is production only. Not asked: it applies
          only to groups in mode `create` and never to a group that exists.
          The lock blocks a destroy too - removing it is a deliberate step.
        renders: >
          a lock (CanNotDelete) on each created group in the stages named, as the
          AVM resource group module's lock input

      - id: resource_lock
        ask: Should resources that hold data or state be protected against deletion?
        type: enum
        plain:
          en: "Resources that hold data {value}."
          de: "Ressourcen, die Daten halten, {value}."
        plain_values:
          production: { en: "carry a delete lock in production", de: "tragen in der Produktion eine Löschsperre" }
          all_stages: { en: "carry a delete lock in every stage", de: "tragen in jeder Stufe eine Löschsperre" }
          none: { en: "carry no lock", de: "tragen keine Sperre" }
        values: [production, all_stages, none]
        default: production
        resolved_by: interview
        topic: platform
        why: >
          A `CanNotDelete` lock on the resources whose loss cannot be undone from the
          spec - storage accounts, Cosmos DB accounts, key vaults, backup and recovery
          vaults, Log Analytics workspaces, messaging namespaces, container registries and
          search services - stops a careless destroy or a portal click. Compute, identities,
          network resources and network security groups carry none: they are recreated from
          the spec, and a lock on a virtual network also blocks changing its subnets. In the
          other stages a lock only gets in the way of teardown, which is why the default is
          production. The lock blocks `terraform destroy` and removing the resource from the
          spec: removing it is a deliberate step, and the handover says so. It is the
          resource's own lock; the resource group's is `resource_group_lock`.
        renders: >
          lock = { kind = "CanNotDelete" } (terraform, every AVM module) / lock: { kind:
          'CanNotDelete' } (bicep) on the listed kinds, in the stages named; a lock on the
          resource group does not replace it

  # ---------------------------------------------------------------- delivery
  # How the rendered code reaches Azure. Asked right after the stages because the
  # pipeline is built from them: one deployment job per stage, one state and one
  # parameter file per stage. The pipeline is a render output beside Terraform or
  # Bicep, not an add-on - core/iac-rendering/references/pipelines.md.
  - id: delivery
    title: Delivery
    questions:
      - id: deploy_mechanism
        ask: Where does the code live, and what should deploy it - Azure DevOps, GitHub, GitLab, or by hand from a workstation?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "The system is deployed {value}."
          de: "Das System wird {value} ausgerollt."
        plain_values:
          azure_devops: { en: "by an Azure DevOps pipeline", de: "durch eine Azure-DevOps-Pipeline" }
          github: { en: "by GitHub Actions", de: "durch GitHub Actions" }
          gitlab: { en: "by a GitLab CI pipeline", de: "durch eine GitLab-CI-Pipeline" }
          local: { en: "by hand from a workstation, without a pipeline", de: "von Hand von einem Arbeitsplatz, ohne Pipeline" }
        values: [azure_devops, github, gitlab, local]
        required: true
        why: >
          No default exists: the answer is a fact about the customer's tooling,
          and a guessed pipeline is a file in the wrong directory for the wrong
          system. Often it is not asked at all - a repository that holds
          .github/workflows, azure-pipelines.yml or .gitlab-ci.yml answers it
          (source: carried), and a request that names the system answers it
          (source: stated). `local` is a complete answer, not a gap: it renders
          a script with the commands, no pipeline, and the rest of the delivery
          group is skipped. One answer per deployment; a repository that wants
          two systems states both and the render takes the first, since two
          pipelines applying the same state is the failure this avoids.
        renders: >
          the pipeline files for the system (core/iac-rendering/references/pipelines.<system>.md):
          .github/workflows, azure-pipelines.yml, .gitlab-ci.yml, or deploy.ps1 / deploy.sh

      - id: pipeline_auth
        ask: How does the pipeline sign in to Azure?
        type: enum
        resolved_by: derived
        plain:
          en: "The pipeline signs in to Azure {value}."
          de: "Die Pipeline meldet sich {value} bei Azure an."
        plain_values:
          workload_identity: { en: "with a short-lived token issued per run, no password stored anywhere", de: "mit einem kurzlebigen Token pro Lauf, ohne irgendwo gespeichertes Passwort" }
          client_secret: { en: "with a stored password that has to be rotated", de: "mit einem gespeicherten Passwort, das rotiert werden muss" }
        values: [workload_identity, client_secret]
        default: workload_identity
        depends_on: { question: deploy_mechanism, not_equals: local }
        why: >
          Workload identity federation: the pipeline's run presents a token its
          platform signs, Entra ID trusts that issuer for one subject (repository
          and stage), and nothing secret exists to leak, expire or rotate. A
          client secret is the legacy shape - it works everywhere and is the
          credential most often found in a repository's history. `client_secret`
          is the platform team's statement that federation is not available to
          them (a self-hosted GitLab without a reachable issuer, say), and it
          carries the rotation as an open item. The identity itself, its
          federated credentials and its roles are the platform's, created once;
          the render names what it expects, it never creates it.
        renders: >
          github: id-token write permission and azure/login with client id,
          tenant and subscription; azure_devops: a service connection of type
          workload identity federation; gitlab: id_tokens and an OIDC login step;
          terraform: ARM_USE_OIDC; never a secret in the template

      - id: pipeline_approvals
        ask: Which stages need a person to approve before anything is changed?
        type: enum
        plain:
          en: "A person approves the change before it is applied: {value}."
          de: "Eine Person gibt die Änderung frei, bevor sie ausgerollt wird: {value}."
        plain_values:
          production: { en: "in live operation only", de: "nur im Echtbetrieb" }
          every_stage: { en: "in every stage", de: "in jeder Stufe" }
          none: { en: "in no stage - changes roll out unattended", de: "in keiner Stufe - Änderungen laufen unbeaufsichtigt durch" }
        values: [production, every_stage, none]
        default: production
        depends_on: { question: deploy_mechanism, not_equals: local }
        why: >
          The plan is read by a person once, before production, because a plan
          that succeeds can still replace a database. Earlier stages apply on
          their own: they are where a wrong change is cheap, and a gate on every
          stage trains approvers to click through. `every_stage` is for a team
          that treats test as shared with others; `none` is for a sandbox or a
          pipeline that only ever runs on a throwaway stage. This is a security
          decision and carries no non_production_default - the gate is the same
          rule in every stage that has one. The gate is enforced by the
          platform (a GitHub environment's required reviewers, an Azure DevOps
          environment check, a GitLab protected environment), so the render
          names the configuration it expects and the stage's job points at it.
        renders: >
          the environment each apply job runs in, and the approval check the
          platform must hold on it; no job applies a plan another run produced

      - id: deployer_roles
        ask: Which roles does the identity that deploys need beyond its baseline?
        type: list
        resolved_by: derived
        plain:
          en: "Besides changing the resources themselves, whoever deploys needs: {value}."
          de: "Wer ausrollt, braucht neben dem Recht, die Ressourcen zu ändern: {value}."
        default: []
        forced_when: >
          Derived from the spec, never asked; each entry is `{ role, scope, for }`, `for`
          naming the decisions that need it. Any `resource_group_mode_<role>: create` adds
          `Contributor` on `subscription` (a group is created at subscription scope). A
          non-empty `role_assignments` on any resource, or `wiring.role_assignments`, adds
          `Role Based Access Control Administrator` on `resource_group`, conditioned to the
          roles the spec assigns. A key vault with non-empty `secret_placeholders` adds
          `Key Vault Secrets Officer` on that vault's resource key. Recorded as `forced`
          with `forced_by` listing the decisions.
        why: >
          The deploying identity's baseline is `Contributor` on the groups it deploys into,
          and that is control plane only. Three things in a spec need more, and each fails
          in the middle of the first apply rather than at plan: writing a secret is data
          plane (RBAC vaults give the creator no access), assigning a role needs
          `Microsoft.Authorization/roleAssignments/write`, which `Contributor` lacks, and a
          resource group is created one scope above the groups. `Role Based Access Control
          Administrator` with a condition on the assigned roles is the narrow grant;
          `Owner` or `User Access Administrator` would let the pipeline grant itself
          anything. The identity and its grants are the platform's, created once; the spec
          records what they must be so the hand-over can name them.
        renders: >
          the pipeline header's hand-over list and the reply (pipelines.md, "What the
          render hands over"); nothing in the Terraform or Bicep

  # ---------------------------------------------------------------- application
  # What the workload's own code is written in, and therefore what hosts it. Asked before any
  # compute set is chosen: the service follows from the answer, never the other way round.
  - id: application
    title: Application
    questions:
      - id: app_runtime
        ask: In which technology is the application written - .NET, Node.js, Python, Java, PHP, or delivered as a container?
        type: enum
        resolved_by: interview
        topic: application
        plain:
          en: "The application is written in {value}."
          de: "Die Anwendung ist geschrieben in {value}."
        plain_values:
          dotnet: { en: ".NET", de: ".NET" }
          node: { en: "Node.js", de: "Node.js" }
          python: { en: "Python", de: "Python" }
          container: { en: "a container image that carries its own runtime", de: "einem Container-Image, das seine Laufzeit selbst mitbringt" }
          java: { en: "Java", de: "Java" }
          php: { en: "PHP", de: "PHP" }
        values: [dotnet, node, python, container, java, php]
        required: true
        why: >
          Asked whenever the design holds an application of the workload's own - a chat app,
          a web front end, an API -, and before a compute set is chosen, because the service
          follows from it: code (.NET, Node.js, Python, Java, PHP) runs on App Service, the
          event-driven parts (an import on upload, a schedule) on a Function App in the same
          language; a container runs on App Service for containers, or on Container Apps when
          several containers run together (app_containers). Choosing the service first and
          asking the stack afterwards is how a .NET team ends up with a container platform it
          did not ask for. The values are ordered by how common they are: the interview shows
          the first four and Java and PHP come through "Other". Nothing can default it - a
          wrong stack deploys cleanly and fails at the first request; nobody answering makes it
          an open entry owned by the workload owner, blocking apply.
        renders: >
          which compute set is routed to (app-service, function-app, container-apps) and their
          runtime_stack

      - id: app_containers
        ask: Is it one container, or several that run together - a front end beside a worker, scheduled jobs?
        type: enum
        resolved_by: interview
        topic: application
        plain:
          en: "The application runs as {value}."
          de: "Die Anwendung läuft als {value}."
        plain_values:
          single: { en: "one container", de: "ein Container" }
          several: { en: "several containers that run together", de: "mehrere Container, die zusammen laufen" }
        values: [single, several]
        default: single
        depends_on: { question: app_runtime, equals: container }
        why: >
          One container is a web app with an image: App Service for containers carries it with
          the same plan, network integration and slots as code. Several containers that call each
          other, scale apart or run as jobs are what Container Apps is for - an environment, one
          app per container, jobs beside them. Container Apps is never chosen without this answer
          or the customer naming it.
        renders: app-service (single) or container-apps (several)

  # ---------------------------------------------------------------- requirements
  # What the customer can say about the system without knowing Azure. Each answer
  # derives technical decisions in the resource sets: a resource question carrying
  # `derived_from: <id>` maps the answer through its own table and records the value
  # with `source: requirement`. The default answer derives the guardrail default, so an
  # unanswered requirement changes nothing - it only lets the customer change things.
  - id: requirements
    title: Requirements
    questions:
      - id: network_requirements
        ask: May the network be chosen freely - this deployment picks its address ranges, no connection to your company network, no VPN - or are there network requirements, either address ranges your network team assigns, or a connection to the company network over a hub, VPN or ExpressRoute?
        type: enum
        values: [free, assigned_ranges, corporate]
        default: free
        resolved_by: interview
        topic: network
        plain:
          en: The network {value}.
          de: Das Netz {value}.
        plain_values:
          free:
            en: is chosen freely by this deployment, with no connection to your company network and no VPN
            de: wird von diesem Ausrollen frei gewählt, ohne Verbindung zum Firmennetz und ohne VPN
          assigned_ranges:
            en: stands on its own, but its address ranges are assigned by your network team
            de: steht für sich, seine Adressbereiche weist aber euer Netzwerk-Team zu
          corporate:
            en: is connected to your company network over the company platform's hub
            de: ist über den Hub der Firmenplattform mit dem Firmennetz verbunden
        confirm_in: [production]
        why: >
          The one question behind the landing-zone archetype, the network's ownership and its
          addressing, and the customer is the only one who can answer it: whether the network
          may be chosen freely or follows requirements - ranges from an IPAM, a connection to
          the company network, a hub, a VPN - is a fact about the organisation, not an
          engineering choice. An engineer who guesses picks a range that collides at the first
          peering, builds a standalone network for a workload meant to be a spoke, or asks for
          a hub nobody has. `free` is the default and matches landing_zone's `standalone`: the
          deployment brings its own network and picks its ranges. `assigned_ranges` keeps the
          network standalone but makes the address space and the subnet prefixes open entries
          owned by the network team until they are given. `corporate` says a platform exists:
          the network is a spoke peered to the hub (landing_zone: corp) and reached from the
          company network; the hub, the peering and the shared DNS are open entries owned by
          the platform team unless the request names them, never guessed.
          Asked first in the group because it decides the posture before any resource does. The
          first install test (2026-10-24) answered "Netz egal, wir brauchen kein VPN" and had no
          question to put that answer in.
        renders: >
          pre-answers landing_zone (free, assigned_ranges: standalone; corporate: corp) and
          through it network_ownership; assigned_ranges and corporate make
          address_space and private_endpoint_subnet_prefix open entries owned by the network
          team unless the request states them. A contradiction with landing_zone_exists or
          central_network is asked, not resolved
      - id: outage_impact
        ask: How bad is it if the system is unavailable for a day?
        type: enum
        values: [tolerable, disruptive, critical]
        default: disruptive
        resolved_by: interview
        topic: resilience
        plain:
          en: "A day's outage would be {value}."
          de: "Ein Tag Ausfall wäre {value}."
        plain_values:
          tolerable: { en: "tolerable", de: "verkraftbar" }
          disruptive: { en: "disruptive", de: "störend" }
          critical: { en: "business-critical", de: "geschäftskritisch" }
        confirm_in: [production]
        why: >
          The one question behind every redundancy decision, and the customer is the
          only one who can answer it. `tolerable` is a system people can do without
          for a day - a sandbox, an internal tool with a manual fallback - and buys
          the cheapest replication. `disruptive` is the normal case: an outage costs
          work and money but not the business, so the data survives the loss of a
          datacenter (zone redundancy) at little extra cost. `critical` is a system
          whose outage stops the business or breaks a legal duty: the data is also
          copied to a second region, which costs roughly double and only pays off
          with a failover plan - say so when it is chosen.
        renders: >
          derived by the resource sets: storage-account.replication (LRS / ZRS / GZRS);
          later resources map it to their own zone-redundancy and SKU decisions

      - id: expected_load
        ask: How many people use the system at the same time, at its busiest?
        type: enum
        values: [small, medium, large]
        default: small
        resolved_by: interview
        topic: application
        plain:
          en: "At its busiest the system is used by {value}."
          de: "Zur Spitzenzeit wird das System genutzt von {value}."
        plain_values:
          small: { en: "a small group at the same time, up to about fifty people", de: "einer kleinen Gruppe gleichzeitig, bis etwa fünfzig Personen" }
          medium: { en: "several hundred people at the same time", de: "einigen hundert Personen gleichzeitig" }
          large: { en: "thousands of people at the same time, with peaks", de: "tausenden Personen gleichzeitig, mit Spitzen" }
        confirm_in: [production]
        why: >
          The one question behind compute sizing, and only the customer knows it. It is a
          starting point, not a capacity plan: every size derived from it can be changed in
          place later, and a wrong low number is a visible, fixable signal while a wrong
          high one is paid for every hour. `small` is the default and derives the
          guardrail sizes, so an unanswered question changes nothing. It sizes the compute
          of web apps and databases; it does not size storage, messaging or search.
        renders: >
          derived by the resource sets: app-service.sku, sql-database.vcores; later
          resources map it to their own size decisions

      - id: data_loss_tolerance
        ask: If data is deleted or overwritten by mistake, how far back must you be able to go?
        type: enum
        values: [reproducible, one_week, one_month, three_months]
        default: one_week
        resolved_by: interview
        topic: resilience
        plain:
          en: "After a mistaken delete you must be able to go back {value}."
          de: "Nach einem versehentlichen Löschen müsst ihr {value} zurückkommen."
        plain_values:
          reproducible: { en: "not at all - the data can be regenerated", de: "gar nicht, die Daten lassen sich neu erzeugen" }
          one_week: { en: "a week", de: "eine Woche" }
          one_month: { en: "a month", de: "einen Monat" }
          three_months: { en: "three months", de: "drei Monate" }
        why: >
          The question behind soft delete, versioning and point-in-time restore,
          asked once in the customer's terms. `reproducible` means the data can be
          regenerated from somewhere else - a cache, an export, a build - so nothing
          is kept after a delete and no storage is spent on it. `one_week` covers the
          usual case: someone notices within days. `one_month` and `three_months` are
          for data where the mistake surfaces at a month-end or quarter-end close,
          and cost the retained versions for that long.
        renders: >
          derived by the resource sets: storage-account.blob_soft_delete_days,
          container_soft_delete_days, versioning_enabled, point_in_time_restore_days

      - id: data_access_pattern
        ask: How is the data used - worked with all the time, read rarely once written, or kept only because something requires it?
        type: enum
        values: [active, occasional, archive]
        default: active
        resolved_by: interview
        topic: data
        plain:
          en: "The data is {value}."
          de: "Die Daten werden {value}."
        plain_values:
          active: { en: "worked with all the time", de: "laufend genutzt" }
          occasional: { en: "read now and then once written", de: "nach dem Schreiben nur gelegentlich gelesen" }
          archive: { en: "kept for a retention duty and almost never read", de: "nur aufbewahrt und fast nie gelesen" }
        why: >
          Storage prices trade storage cost against access cost, and only the
          customer knows which side the data is on. `active` is data an application
          reads and writes continuously. `occasional` is data written once and read
          now and then - exports, backups, logs - where cheaper storage with a small
          per-read charge wins. `archive` is data kept for a retention duty and read
          almost never; it is the cheapest to keep and the most expensive to read
          back, with an early-deletion charge. The default is `active` because
          choosing a cold tier for data that turns out to be read often costs more
          than the other way round.
        renders: >
          derived by the resource sets: storage-account.access_tier (Hot / Cool / Cold)

      - id: backup_isolation
        ask: Must a copy of the data survive if someone destroys it on purpose or with administrator rights - ransomware, a compromised account, a deleted storage account?
        type: enum
        values: [operational, isolated, immutable]
        default: operational
        resolved_by: interview
        topic: resilience
        plain:
          en: "Against deliberate destruction the data is {value}."
          de: "Gegen absichtliche Zerstörung sind die Daten {value}."
        plain_values:
          operational: { en: "protected only inside the system itself - whoever can delete the system can delete the copies", de: "nur innerhalb des Systems selbst geschützt; wer das System löschen kann, kann auch die Kopien löschen" }
          isolated: { en: "also kept in a separate backup store that the system's own administrators cannot delete", de: "zusätzlich in einem getrennten Backup-Speicher, den die Administratoren des Systems nicht löschen können" }
          immutable: { en: "also kept in a separate backup store where nobody can change or delete a copy before it expires", de: "zusätzlich in einem getrennten Backup-Speicher, in dem niemand eine Kopie vor ihrem Ablauf ändern oder löschen kann" }
        confirm_in: [production]
        why: >
          The question `data_loss_tolerance` does not ask. Soft delete, versioning and
          point-in-time restore undo a mistake, but they live inside the resource they
          protect: an administrator who deletes the account, a ransomware run with the
          administrator's token, or a wrong `destroy` takes the copies with the data.
          `operational` accepts that, which is right for data that is reproducible or
          whose loss is a nuisance, and costs nothing extra. `isolated` keeps a backup in
          a separate vault with its own permissions and soft delete - the system's
          operators can restore from it, not empty it - and costs the vault's storage.
          `immutable` locks each copy until its retention expires, against everyone
          including the vault's owners; it is what a ransomware policy or an audit
          mandate asks for, and it cannot be undone - a copy kept too long is paid for
          until it expires. How far back the copies reach is still `data_loss_tolerance`;
          this question decides who can destroy them.
        renders: >
          derived by the resource sets: the Backup vault (`backup-vault`: blobs, disks,
          PostgreSQL, AKS) or the Recovery Services vault (`recovery-services-vault`: VMs,
          Azure Files, SQL in a VM) with its soft delete, immutability and Resource Guard,
          and the container's `immutable_storage`; a deployment answering `isolated` or
          `immutable` is missing a protected resource without one of the vaults, and the
          pattern adds the vault (or references the central one when central_backup is `yes`); cosmos-db meets `isolated` by itself (its backups live
          outside the account) and names `immutable` as a gap

      - id: data_residency
        ask: Where may the data be stored and processed - only in the country of the chosen region, anywhere in the same economic area such as the EU, or anywhere in the world?
        type: enum
        values: [country, data_zone, unrestricted]
        default: data_zone
        resolved_by: interview
        topic: security
        plain:
          en: "The data is stored and processed {value}."
          de: "Die Daten werden {value} gespeichert und verarbeitet."
        plain_values:
          country: { en: "only in the country of the chosen region", de: "nur im Land der gewählten Region" }
          data_zone: { en: "only inside the region's economic area, for example the EU", de: "nur innerhalb des Wirtschaftsraums der Region, zum Beispiel der EU" }
          unrestricted: { en: "anywhere in the world", de: "irgendwo auf der Welt" }
        confirm_in: [production]
        why: >
          The one question behind every decision that puts data somewhere other than
          the chosen region, and the customer is the only one who can answer it: a
          data-protection officer, a works council or a contract says where the data
          may be, and the engineer cannot infer it. Three places move data out of the
          region without anyone choosing to: a geo-redundant copy goes to Azure's
          **paired region**, which is in the same country for most European regions
          (Germany West Central - Germany North, Switzerland North - Switzerland West)
          and in another country for some (Brazil South - South Central US); a
          geo-replica or a backup kept in a second region goes wherever it is pointed;
          and the AI models process a prompt wherever their deployment type allows,
          **anywhere in the world by the portal's default**. `country` forbids all three
          unless the second place is in the same country. `data_zone` is the EU (or the
          US) as Azure defines its data zones and is the default: it is what a GDPR
          reading needs and what the AI deployment default already honours. `unrestricted`
          lifts the constraint and buys the largest model catalogue and quota. The
          constraint is recorded once here; a `mandates` entry naming a residency rule
          is the reason, this is the decision. It also constrains the `location`
          parameter: a stage file naming a region outside the constraint is wrong, and
          the pipeline's guard may check it.
        renders: >
          derived by the resource sets: foundry.deployment_sku (Standard /
          DataZoneStandard / GlobalStandard); constrains storage-account.replication
          (a geo tier only where the paired region satisfies it), cosmos-db.geo_replicas
          and backup_storage_redundancy, container-registry.geo_replicas, and the
          `location` parameter of every stage

      - id: priority
        ask: Where should the money go - keep the running cost as low as it can be, balance cost and protection, or spend more wherever it makes the system safer and harder to take down?
        type: enum
        values: [cost, balanced, protection]
        default: balanced
        resolved_by: interview
        topic: platform
        plain:
          en: "The system is built {value}."
          de: "Das System wird {value} gebaut."
        plain_values:
          cost: { en: "for the lowest running cost the security baseline allows", de: "auf geringste laufende Kosten, soweit die Sicherheitsvorgaben es erlauben" }
          balanced: { en: "balancing cost and protection", de: "mit Ausgewogenheit zwischen Kosten und Schutz" }
          protection: { en: "for protection first: more records, every stage like production", de: "mit Schutz zuerst: mehr Aufzeichnung, jede Stufe wie die Produktion" }
        confirm_in: [production]
        why: >
          The customer decides what an extra euro buys, because only they know what the
          system is worth. It moves **cost and hardening knobs only, never the security
          floor**: shared keys off, TLS, encryption, no public access for a private
          system and the rules of `mandates` hold in all three, and the check that refuses
          a relaxed security default in a non-production stage still applies. `cost` keeps
          the non-production stages cheaper than production and turns on nothing that is
          billed per gigabyte for a record nobody asked for. `balanced` is the guardrail
          baseline: an unanswered priority changes nothing. `protection` builds every
          stage like production and switches on the records an investigation needs
          (storage change feed, network flow logs), which cost money every month. A value
          the customer named - outage impact, data-loss tolerance, retention, a mandate -
          wins over this one: it only decides where nobody said anything.
        renders: >
          forces non_production_savings to disabled on `protection`; derived by the
          resource sets: storage-account.change_feed_enabled,
          virtual-network.flow_logs_enabled

  - id: modules
    title: Modules
    questions:
      - id: module_source
        ask: Should the code be built from the building blocks Microsoft tests and maintains, or from resources written out one by one?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "The code is built from {value}."
          de: "Der Code wird aus {value} gebaut."
        plain_values:
          avm: { en: "Microsoft's verified, tested building blocks (Azure Verified Modules)", de: "Microsofts geprüften, getesteten Bausteinen (Azure Verified Modules)" }
          authored: { en: "resources written out individually", de: "einzeln ausgeschriebenen Ressourcen" }
        values: [avm, authored]
        default: avm
        why: >
          Azure Verified Modules (AVM) are Microsoft's published, tested and
          versioned modules, one per resource type, with the same shape in
          Terraform and Bicep. They already implement what every authored
          render here reinvents and gets wrong first - private endpoints with
          their DNS zone groups, diagnostic settings per sub-resource, role
          assignments, locks, customer-managed keys - so a call to one is the
          default and authored resources are the fallback. One answer per
          deployment: a configuration that mixes module calls and authored
          resources for the same resource type has two conventions to review.
          `authored` is for a repository that already renders its resources
          this way and did not ask to migrate, or for a user who wants the
          resources written out and under their own review.
          A resource whose type has no `Available` module in the AVM index
          renders authored either way, recorded per module with
          `source: forced` - the index is checked at render time, not
          remembered. Asked first, before the description
          and before any resource question: it decides what every later
          decision renders to, and it is the one choice a person can make
          without knowing a resource. `avm` is the recommended answer and
          the default when nobody answers; a repository that already holds
          authored resource blocks makes `authored` the recommended one. Not
          asked when the user stated it ("ohne Module", "mit AVM") or when a
          carried spec has it.
        renders: >
          composition.modules[].implementation for every module (avm | authored);
          terraform: module "<id>" { source = "Azure/avm-res-<ns>-<type>/azurerm" }
          vs. resource blocks; bicep: module from 'br/public:avm/res/<ns>/<type>:<version>'
          vs. resource declarations - see core/iac-rendering/references/avm.md

      - id: naming_source
        ask: How should the resource names be generated - by a ready-made naming tool from the plugin, by Microsoft's naming module, or by a mechanism of your own?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "Resource names are generated by {value}."
          de: "Die Ressourcennamen erzeugt {value}."
        plain_values:
          provider: { en: "the plugin's naming tool, driven by a naming file you can edit", de: "das Naming-Werkzeug des Plugins, gesteuert über eine Namensdatei, die ihr anpassen könnt" }
          module: { en: "Microsoft's ready-made naming module", de: "Microsofts fertiges Naming-Modul" }
          custom: { en: "the mechanism your organisation already uses", de: "der Mechanismus, den eure Organisation schon nutzt" }
        values: [provider, module, custom]
        default: provider
        why: >
          Three ways to get a name out of a convention in Terraform, and none
          is the right one for every repository, so the interview asks and
          marks nothing as recommended. `provider` is the LemurDaniel/naming
          provider: the convention lives in naming.yaml, names resolve at plan
          time, no module blocks. `module` is the Azure/naming/azurerm module:
          Microsoft's CAF abbreviations and per-type limits, output through
          the module's attributes, and no convention file to maintain.
          `custom` is the organisation's own mechanism - locals, an in-house
          module - and the render carries it as the repository has it,
          without inventing a pattern. The default, `provider`, applies only
          when nobody answers; it is what the plugin rendered before the
          question existed. Asked with the product names in brackets, the one
          question where the options are products. One answer per
          deployment, never mixed in one configuration: two mechanisms mean
          two conventions, and most names cannot change after creation. An
          existing naming provider block, naming module call or naming locals
          in the repository is carried and answers the question. Terraform
          only: a Bicep render always assembles its names from vars generated
          from the convention (naming.md), so the question is not asked there.
        renders: >
          terraform: provider = `provider "naming"` and `data "naming_name"`;
          module = `module "naming" { source = "Azure/naming/azurerm" }` and its
          outputs; custom = the repository's own mechanism. Not rendered in
          bicep

      - id: module_telemetry
        ask: May the Azure Verified Modules send their deployment telemetry to Microsoft?
        type: enum
        resolved_by: derived
        plain:
          en: "Usage telemetry to Microsoft is {value}: a count per deployment, none of your data."
          de: "Nutzungstelemetrie an Microsoft ist {value}: eine Zählung pro Ausrollen, keine eurer Daten."
        plain_values:
          enabled: { en: "on", de: "eingeschaltet" }
          disabled: { en: "off", de: "ausgeschaltet" }
        values: [enabled, disabled]
        default: disabled
        depends_on: { question: module_source, equals: avm }
        why: >
          Every AVM module sends one telemetry event per deployment to Microsoft
          unless told not to - module name, version, a deployment correlation
          id, no resource data. The Terraform modules do it through the
          Azure/modtm provider, the Bicep modules through an empty nested
          deployment. Leaving the module default is a decision a reviewer will
          ask about, so it is recorded and rendered explicitly on every module
          call either way. `disabled` is the default and the recommended
          answer: a deployment that reports to a third party should be a
          choice someone made, not one nobody noticed, and many organisations'
          policies forbid it outright. A customer who wants to support the
          modules' maintainers states `enabled` once here and not per resource.
        renders: >
          terraform: enable_telemetry on every AVM module call; bicep:
          enableTelemetry on every AVM module call

  - id: posture
    title: Posture
    questions:
      - id: landing_zone_exists
        ask: Does your organisation have an Azure landing zone - a company platform with a hub network, central logging and shared name resolution that this system is placed into?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "There {value} an Azure landing zone to place the system into."
          de: "Es {value} eine Azure Landing Zone, in die das System gestellt wird."
        plain_values:
          "yes": { en: "is", de: "gibt" }
          "no": { en: "is no", de: "gibt keine" }
        values: ["yes", "no"]
        default: "no"
        confirm_in: [production]
        depends_on: { question: environments, not_equals: [sandbox] }
        why: >
          One plain question instead of a profile file: the customer knows whether the
          company runs a landing zone, and nobody else can say. `no` is the default and
          matches the old `standalone` default - a deployment that presumes a platform the
          customer never heard of ends in an unmet assumption (a hub, shared DNS, a shared
          workspace). `yes` presumes all three central parts at once: the hub network,
          the central workspace and the platform-owned private DNS zones; the concrete
          names behind them (hub, subnet, workspace, zone resource group) are never asked
          here - they are parameters of the stage files or `open:` entries owned by the
          platform team. `no` does not end the question: organisations without a full
          landing zone often still have one central part, so the three questions below
          ask for each.
        renders: >
          yes: landing_zone corp (public exposure or a stated sandbox: online / sandbox),
          network_ownership create (a spoke), private_dns_ownership platform,
          observability_ownership reference; no: the three central_* answers decide

      - id: central_logging
        ask: Is there a central Log Analytics workspace that all workloads log to?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "There {value} a central log workspace."
          de: "Es {value} einen zentralen Log-Arbeitsbereich."
        plain_values:
          "yes": { en: "is", de: "gibt" }
          "no": { en: "is none, so the system brings its own", de: "gibt keinen, das System bringt also einen eigenen mit" }
        values: ["yes", "no"]
        default: "no"
        depends_on: { question: landing_zone_exists, equals: "no" }
        why: >
          A workspace either exists and is referenced, or this deployment creates and pays
          for one. Only the customer knows which. Asked only without a landing zone: with
          one, the central workspace is presumed. Not reached when environments is [sandbox].
        renders: >
          yes: observability_ownership reference, diagnostics_destination an `open:` entry
          owned by the platform team unless the request names it; no:
          observability_ownership create

      - id: central_private_dns
        ask: Is there a central place where the private DNS zones (privatelink.*) are kept for all workloads?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "There {value} a central place for private name zones."
          de: "Es {value} einen zentralen Ort für private Namenszonen."
        plain_values:
          "yes": { en: "is", de: "gibt" }
          "no": { en: "is none, so the system keeps its own zones", de: "gibt keinen, das System hält also eigene Zonen" }
        values: ["yes", "no"]
        default: "no"
        depends_on: { question: landing_zone_exists, equals: "no" }
        why: >
          Two deployments each creating `privatelink.blob.core.windows.net` is a conflict
          that only surfaces at apply time, so whether central zones exist decides who
          creates them. Asked only without a landing zone; not reached when environments is [sandbox].
        renders: >
          yes: private_dns_ownership platform, the zones' location an `open:` entry owned
          by the platform team unless stated; no: private_dns_ownership deployment

      - id: central_network
        ask: Is there a central hub network that this system's network should be connected to?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "There {value} a central hub network."
          de: "Es {value} ein zentrales Hub-Netz."
        plain_values:
          "yes": { en: "is", de: "gibt" }
          "no": { en: "is none, so the system builds a network of its own", de: "gibt keines, das System baut also ein eigenes Netz" }
        values: ["yes", "no"]
        default: "no"
        depends_on: { question: landing_zone_exists, equals: "no" }
        why: >
          A hub decides whether the network is a spoke peered to it or stands alone. It
          overlaps with network_requirements (`corporate`): both say a hub exists, and a
          contradiction between the two is asked, not resolved. Not reached when
          environments is [sandbox].
        renders: >
          yes: network_ownership create as a spoke, the hub and its peering `open:` entries
          owned by the platform team unless stated; no: network_ownership create, standalone

      - id: central_backup
        ask: Is there a central backup store (a backup vault) that all workloads use for their protected copies?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "There {value} a central backup store."
          de: "Es {value} einen zentralen Backup-Speicher."
        plain_values:
          "yes": { en: "is", de: "gibt" }
          "no": { en: "is none, so the system brings its own", de: "gibt keinen, das System bringt also einen eigenen mit" }
        values: ["yes", "no"]
        default: "no"
        depends_on: { question: environments, not_equals: [sandbox] }
        why: >
          Asked together with the other central services and in every run - with a landing
          zone and without - because a landing zone does not presume a central backup store
          the way it presumes a hub, a workspace and DNS zones: backup vaults are often kept
          per workload, and a vault that is assumed but missing fails at the first backup.
          The answer is used only when the customer wants a copy that survives deliberate
          destruction (backup_isolation `isolated` or `immutable`); with `operational` no
          vault is needed and the answer changes nothing, but it is still recorded. A
          central vault is read and used, never created or reconfigured here: this
          deployment adds its own backup instances and policies to it, which is a role on
          the vault the platform team grants. Not reached when environments is [sandbox].
        renders: >
          yes: backup_ownership reference, backup_vault_destination an `open:` entry owned
          by the platform team unless the request names it; no: backup_ownership create,
          the vault `backup-vault` / `recovery-services-vault` is part of this deployment

      - id: landing_zone
        ask: Which kind of landing zone does this workload go into - internal (corp), internet-facing (online) or a sandbox - or none (standalone)?
        type: enum
        plain:
          en: "The system lands in {value}."
          de: "Das System landet in {value}."
        plain_values:
          standalone: { en: "its own environment: there is no shared platform, so it brings its own network, name resolution and logging", de: "einer eigenen Umgebung: es gibt keine gemeinsame Plattform, also bringt es Netz, Namensauflösung und Logging selbst mit" }
          corp: { en: "the internal part of the company platform, connected to the company network", de: "dem internen Teil der Firmenplattform, verbunden mit dem Firmennetz" }
          online: { en: "the internet-facing part of the company platform", de: "dem internetseitigen Teil der Firmenplattform" }
          sandbox: { en: "a sandbox for experiments, never for real operation", de: "einer Sandbox zum Ausprobieren, nie für den Echtbetrieb" }
        values: [standalone, corp, online, sandbox]
        default: standalone
        confirm_in: [production]
        why: >
          `standalone` is the default and listed first: it needs no knowledge of
          landing zones and builds everything the deployment needs itself, while
          `corp` presumes a platform the user may not know exists - recommending
          it would steer people who never heard of a landing zone into an
          unmet assumption (a hub, shared DNS, a shared workspace).
          The workload lands in an application landing zone of the CAF Azure
          landing zone architecture (guardrails.md, section 0), and the archetype
          decides the posture before any single resource does. `corp` is an
          internal workload whose network is a spoke peered to the connectivity
          hub. `online` is internet-facing and not connected to the hub.
          `sandbox` is for experiments - no hub, looser policy, and never
          production. `standalone` means the organisation has no landing zone platform:
          nothing shared exists, so the deployment owns its network (standalone,
          not a spoke), its private DNS zones and records, and its workspace -
          and stays private by default, since a missing platform moves
          ownership, not posture. Asked first because one answer pre-answers
          exposure, network, DNS and workspace ownership; a user who says "nur
          aus dem Firmennetz", "öffentlich erreichbar" or "wir haben keine
          Landing Zone" has usually answered it already.
        forced_when: >
          Not asked: derived from environments, landing_zone_exists and network_exposure.
          `[sandbox]`: sandbox, whatever else is said. landing_zone_exists `yes`: corp when
          network_exposure is private or private_with_exceptions, online when it is public.
          landing_zone_exists `no`: standalone, whatever the central_* answers are - a lone
          central workspace or hub does not make a landing zone, and the label must not
          drag in the archetype's other pre-answers (a spoke, platform DNS) that the
          customer answered "no" to. An explicit answer always beats an archetype's
          pre-answer: each central_* answer sets its own ownership decision directly, and
          the archetype's pre-answers apply only under `yes`. A request that names an
          existing hub network or a shared private-endpoint subnet answers central_network
          as `yes`, one that names a central workspace answers central_logging as `yes`
          (source stated); it answers landing_zone_exists only where it says there is a
          landing zone. network_requirements pre-answers it as well - free and
          assigned_ranges: standalone, corporate: corp; a contradiction between the two is
          asked, not resolved. landing_zone: sandbox refuses environments containing
          production - a production stage in a sandbox is a contradiction to ask about, not
          a value to record
        renders: >
          under `yes`, pre-answers network_ownership (create, as a spoke),
          private_dns_ownership (platform) and observability_ownership (reference);
          under `no` those three follow their central_* answers, and without one default to
          create / deployment / create (guardrails.md, section 0); recorded so a reviewer
          sees which platform rules the deployment was written against

      - id: network_exposure
        ask: Should this infrastructure be reachable from the internet - not at all, only named parts such as the website with everything behind it staying private, or all of it?
        type: enum
        resolved_by: interview
        topic: network
        plain:
          en: "Access is {value}."
          de: "Der Zugang ist {value}."
        plain_values:
          private: { en: "private only - nothing is reachable from the internet", de: "nur privat, nichts ist aus dem Internet erreichbar" }
          private_with_exceptions: { en: "private, with the named parts reachable from the internet behind a firewall; everything behind them stays private", de: "privat; nur die benannten Teile sind hinter einer Firewall aus dem Internet erreichbar, alles dahinter bleibt privat" }
          public: { en: "public - every part, databases included, is reachable from the internet by design", de: "öffentlich: jeder Teil, auch die Datenbanken, ist absichtlich aus dem Internet erreichbar" }
        values: [private, private_with_exceptions, public]
        default: private
        confirm_in: [production]
        why: >
          Asked in every run, whatever the landing zone, and the input of `landing_zone`
          rather than its consequence: with a platform, `private` and
          `private_with_exceptions` place the workload in `corp`, `public` in `online`. A
          system the customer wants reachable from the internet is not forced private by
          the platform answer. The single decision most resource defaults hang off. `private` means every
          resource that supports a private endpoint gets one and has no public
          surface. `private_with_exceptions` is the same baseline with named
          resources allowed a firewalled public endpoint, each recorded as
          `overridden`. `public` is a deliberate posture for a system whose
          consumers genuinely live off-network - it is not the absence of a
          decision, and the portal default being permissive is not a reason. It is also
          rarely what a system with a database wants: a shop's website faces the internet
          and its database does not, which is `private_with_exceptions` with the website
          named in `public_parts`, never `public`.
          One posture for every stage: a system is as exposed in production as
          the customer said it is, and "öffentlich ist okay" said while
          describing the development stage is said about the system, not about
          that stage. A stage departs only on the customer's explicit word for
          that stage ("in prod aber nur intern"), recorded as overridden there -
          never split by the run.
        renders: >
          pre-answers public_network_access in every resource question set, and
          decides whether private endpoints and DNS records are generated at all;
          private_with_exceptions asks public_parts, and only the resources those parts
          map to get a firewalled public endpoint

      - id: public_parts
        ask: Which parts must be reachable from the internet - for example the website, the interface for partners, a download area?
        type: list
        resolved_by: interview
        topic: network
        plain:
          en: "Reachable from the internet: {value}. Everything else stays private."
          de: "Aus dem Internet erreichbar: {value}. Alles andere bleibt privat."
        depends_on: { question: network_exposure, equals: private_with_exceptions }
        required: true
        why: >
          The exceptions of `private_with_exceptions`, named in the customer's words: the
          engineer maps each part to the resource that serves it (the website to its web
          app or front door, the partner interface to the API entry) and records that
          resource's public_network_access as `overridden` with the part as the reason;
          every resource no part maps to keeps the private baseline. An unmapped part is
          an `open:` entry owned by the workload owner, never a public database. Free
          text on purpose, like `mandates`: the parts are the workload's own.
        renders: >
          public_network_access `enabled` on the mapped resources only, protected as
          public_audience says (a front door, or an address allowlist); every other
          resource stays `disabled` behind its private endpoint

      - id: public_audience
        ask: Who may reach these parts from the internet - anyone, or only partners you know?
        type: enum
        resolved_by: interview
        topic: network
        plain:
          en: "The parts reachable from the internet are open to {value}."
          de: "Die aus dem Internet erreichbaren Teile stehen {value} offen."
        plain_values:
          anyone: { en: "anyone on the internet, protected by a filtering layer in front", de: "jedem im Internet, geschützt durch eine Filterschicht davor" }
          known_partners: { en: "only the partners you know, through a list of their addresses", de: "nur den Partnern, die ihr kennt, über eine Liste ihrer Adressen" }
        values: [anyone, known_partners]
        default: anyone
        depends_on: { question: network_exposure, equals: private_with_exceptions }
        why: >
          "Behind a firewall" means two different things, and the customer decides which. A
          website for consumers cannot list its visitors' addresses, so `anyone` puts a Front
          Door with a web application firewall in front of the mapped resources - a resource
          the customer never named and that costs money every month, which is why it is said
          in Phase 4. A partner interface can list its callers, so `known_partners` keeps the
          resource's own firewall with an address allowlist and adds nothing; the addresses
          are an `open:` entry owned by the workload owner, never guessed. One answer for
          every public part: a system with both kinds states the wider one, and a part
          departing from it is a stated exception. `anyone` is the default because an
          allowlist that is wrong locks real users out, while a filtering layer that is
          not needed only costs money.
        renders: >
          anyone: the `front-door` resource (with its web application firewall policy)
          in front of the resources the public parts map to, which then accept traffic from
          it only; known_partners: ip_restrictions / ipSecurityRestrictions or the resource's
          own firewall rules on the mapped resources, the addresses an `open:` entry

      - id: local_auth
        ask: May resources keep key-based or connection-string auth?
        type: enum
        plain:
          en: "Passwords and access keys are {value}; access goes through company accounts, so every action is attributable."
          de: "Passwörter und Zugriffsschlüssel sind {value}; der Zugriff läuft über Firmenkonten, damit jede Aktion zuordenbar ist."
        plain_values:
          disabled: { en: "switched off", de: "abgeschaltet" }
          allowed_where_unavoidable: { en: "allowed only where a consumer cannot do otherwise", de: "nur erlaubt, wo ein Nutzer nicht anders kann" }
        values: [disabled, allowed_where_unavoidable]
        default: disabled
        confirm_in: [production]
        why: >
          Entra ID and RBAC are the baseline; a key bypasses both and is not
          attributable in the audit log. `allowed_where_unavoidable` exists for a
          consumer that genuinely cannot do managed identity, and names which
          resource it applies to rather than relaxing the whole deployment.
        renders: >
          pre-answers shared_access_key_enabled, rbac_authorization, Entra-only
          authentication and the equivalent switch per resource

  - id: compliance
    title: Mandates
    questions:
      - id: mandates
        ask: Are there compliance or internal mandates this deployment has to satisfy?
        type: list
        resolved_by: interview
        topic: security
        plain:
          en: "Rules to comply with: {value}."
          de: "Einzuhaltende Vorgaben: {value}."
        default: []
        offer:
          GDPR: { en: "GDPR - personal data of EU residents", de: "DSGVO - personenbezogene Daten aus der EU" }
          BSI C5: { en: "BSI C5 - the German cloud security catalogue", de: "BSI C5 - Cloud-Anforderungskatalog des BSI" }
          ISO 27001: { en: "ISO 27001 - information security management", de: "ISO 27001 - Informationssicherheits-Management" }
        plain_values:
          GDPR: { en: "GDPR", de: "DSGVO" }
        why: >
          Named here once so the decisions below can cite them, and so a reviewer
          sees why an expensive option was chosen. Free text on purpose - PCI DSS,
          BSI C5, TISAX, "group security baseline 2.1" are all legitimate entries,
          and this plugin is not the place to enumerate regimes. An empty list is a
          valid and common answer; it is not the same as nobody having asked.
        renders: >
          recorded in the spec under deployment.mandates, and cited by every
          decision it forces

      - id: key_protection
        ask: Do keys have to be HSM-protected?
        type: enum
        plain:
          en: "Encryption keys are {value}."
          de: "Verschlüsselungsschlüssel sind {value}."
        plain_values:
          software: { en: "protected in software - the standard, sufficient unless a mandate names hardware", de: "in Software geschützt, der Standard, ausreichend ohne Vorgabe für Hardware" }
          hsm: { en: "protected by hardware security modules, as a mandate requires; that costs the premium vault", de: "durch Hardware-Sicherheitsmodule geschützt, wie eine Vorgabe verlangt; das kostet den Premium-Tresor" }
        values: [software, hsm]
        default: software
        why: >
          The usual mandate with a hard technical consequence. HSM-backed keys are
          not a flag on an existing vault: they require Key Vault **Premium**, or a
          Managed HSM, and the SKU cannot be downgraded afterwards while a software
          key cannot be converted into an HSM key in place. So it is a deployment
          decision taken before the first vault exists, not a per-key one taken
          later. Software protection is the right default where no mandate names
          HSM - the keys are still platform-managed, rotated and encrypted.
        renders: >
          pre-answers Key Vault sku to `premium` and key_type to HSM-backed;
          selects Managed HSM where a mandate requires a single-tenant boundary

      - id: key_management
        ask: Platform-managed keys, or customer-managed?
        type: enum
        plain:
          en: "Encryption keys are {value}."
          de: "Verschlüsselungsschlüssel sind {value}."
        plain_values:
          platform_managed: { en: "managed by Azure - encrypted, rotated, no effort on your side", de: "von Azure verwaltet: verschlüsselt, rotiert, kein Aufwand bei euch" }
          customer_managed: { en: "your own, held in your key vault, so you can revoke them", de: "eure eigenen in eurem Schlüsseltresor, damit ihr sie zurückziehen könnt" }
        values: [platform_managed, customer_managed]
        default: platform_managed
        confirm_in: [production]
        why: >
          Platform-managed is not a compromise - encrypted, rotated, free, no
          operational burden. Customer-managed keys are warranted when a mandate
          names them or when key revocation has to be a capability you actually
          hold, and they pull in a Key Vault with purge protection, an identity with
          wrap/unwrap and a rotation story. Choosing CMK without those is an
          incomplete answer rather than a ready one.
        renders: >
          encryption.key_source and the CMK block on every resource that supports
          it; combined with key_protection: hsm it also forces the vault SKU

  - id: network
    title: Network
    questions:
      - id: network_ownership
        ask: Should this deployment build its own virtual network, reference an existing one, or does it need none?
        type: enum
        resolved_by: derived
        plain:
          en: "The network is {value}."
          de: "Das Netz wird {value}."
        plain_values:
          create: { en: "built by this deployment", de: "von diesem Ausrollen selbst gebaut" }
          reference: { en: "the existing one, used and never changed here", de: "das bestehende, hier genutzt und nie verändert" }
          none: { en: "not needed - everything is reached over public endpoints", de: "nicht gebraucht, alles wird über öffentliche Endpunkte erreicht" }
        values: [create, reference, none]
        default: create
        why: >
          Not a free choice: `private` and `private_with_exceptions` make a network
          mandatory, because private endpoints, service endpoints and anything
          subnet-scoped need one, and the posture is unimplementable without it.
          Under those, `none` is not an available answer. Owning the network is
          preferred - the deployment is then self-contained and reproducible in a
          fresh subscription. A created network is a **spoke**: it is peered to the
          platform hub, and what is shared - above all the private DNS zones - stays
          in the hub subscription (see private_dns_ownership). "Nothing exists yet"
          from the user describes the workload, not the platform around it.
          `reference` is for a platform-owned hub or an
          existing landing zone, and the word is literal: the network is read,
          never managed. `none` exists for a genuinely public deployment whose
          resources are all reached over their public endpoints - no endpoint, no
          subnet, no network. The one thing never to do is create a network and
          reference a foreign one in the same deployment: two sources of truth for
          one address space.
        forced_when: >
          network_exposure in [private, private_with_exceptions] removes `none`;
          network_exposure: public makes `none` the default; landing_zone: corp
          pre-answers `create` (a spoke; central_network: yes says the same without a
          landing zone), landing_zone: standalone pre-answers `create`
          (standalone, no peering), online and sandbox pre-answer `none`. `none` in turn
          forces every resource's public_network_access to `enabled`: without a network
          the deployment's own callers have no fixed address a firewall could list
        renders: >
          terraform: azurerm_virtual_network resource vs. data "azurerm_virtual_network";
          bicep: Microsoft.Network/virtualNetworks resource vs. an `existing` reference

      - id: existing_vnet
        ask: Which existing virtual network should the deployment reference?
        type: ref
        resolved_by: derived
        plain:
          en: "The existing network {value} is used."
          de: "Das bestehende Netz {value} wird genutzt."
        ref: virtual_network
        required: true
        depends_on: { question: network_ownership, equals: reference }
        per_environment: true
        why: >
          Read by name and resource group, never by a hardcoded resource id - an id
          pins a subscription into the template. A pattern skill normally supplies
          this from the platform it knows about.
        renders: data source / existing reference the subnets are resolved from

      - id: address_space
        ask: Which address space should the new virtual network use?
        type: string
        resolved_by: derived
        plain:
          en: "The new network uses the address range {value}."
          de: "Das neue Netz nutzt den Adressbereich {value}."
        required: true
        depends_on: { question: network_ownership, equals: create }
        per_environment: true
        forced_when: >
          network_requirements decides who answers. `free`: the range is chosen with the
          customer in the Phase 3 batch as a sizing choice - four ranges out of a private block
          nobody peers with (10.100.0.0/25, /24, /23, /22), the one that fits the described system
          marked recommended, which is the one recommendation the batch allows because it is
          sizing, not a guess about the organisation. The size is the sum of the subnets, rounded
          up to the next prefix: the private endpoint subnet (/27, /26 above 27 endpoints) plus each
          compute subnet - App Service or Function App integration /26, a Container Apps
          environment with workload profiles /27, consumption-only /23, a gateway or Bastion
          /26. So /25 for one integrated app and its endpoints (/27 + /26 = 96 addresses), /24
          for a second compute subnet, /23 for three or a Container Apps environment beside two,
          /22 for a consumption-only Container Apps environment; each
          stage takes its own block of that size (10.100.0.0, 10.101.0.0, 10.102.0.0), so the
          stages could be peered later without renumbering. `assigned_ranges` and `corporate`:
          an open entry owned by the network team unless the request states the range; never
          guessed, because an overlap is invisible until the first peering and every subnet has
          to be rebuilt to fix it.
        why: >
          Cannot be defaulted: an overlapping CIDR is invisible until the first
          peering and expensive to change afterwards, because every subnet in it has
          to be rebuilt. Where nobody manages addresses (network_requirements: free) the
          customer picks a size the plugin derives from the system; where somebody does,
          ask them.
        renders: azurerm_virtual_network.address_space / properties.addressSpace.addressPrefixes

      - id: private_endpoint_subnet
        ask: Which existing subnet should private endpoints live in?
        type: ref
        resolved_by: derived
        plain:
          en: "Private connections land in the existing subnet {value}."
          de: "Private Anbindungen landen im bestehenden Subnetz {value}."
        ref: subnet
        required: true
        depends_on: { question: network_ownership, equals: reference }
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so no resource
          question set has to ask. Referenced, like the network around it.
        renders: private endpoint subnet_id in every resource that generates one

      - id: private_endpoint_subnet_prefix
        ask: Which prefix should the private endpoint subnet get?
        type: string
        resolved_by: derived
        plain:
          en: "Private connections get their own subnet, {value}."
          de: "Private Anbindungen bekommen ein eigenes Subnetz, {value}."
        required: true
        depends_on: { question: network_ownership, equals: create }
        per_environment: true
        forced_when: >
          network_requirements: free - cut from the chosen address space by the engineer, never
          asked: the first /27 of the range (the first /26 when the system has more than 27
          private endpoints), the compute subnets after it, each on a boundary of its own size
          (in a /25: endpoints 10.100.0.0/27, App Service integration 10.100.0.64/26). assigned_ranges and corporate: an
          open entry owned by the network team together with the address space, unless stated.
        why: >
          With the deployment owning the network there is nothing to reference yet -
          the subnet is generated, so what is needed is its prefix out of the
          address space above, not a pointer to something that does not exist. A
          /27 holds 27 usable addresses and therefore 27 private endpoints, which
          is the number to size against.
        renders: azurerm_subnet.address_prefixes / properties.subnets[].addressPrefix

  - id: dns
    title: DNS
    questions:
      - id: private_dns_ownership
        ask: Who owns the private DNS zones?
        type: enum
        resolved_by: derived
        plain:
          en: "Name resolution for private connections is handled by {value}."
          de: "Die Namensauflösung für private Anbindungen übernimmt {value}."
        plain_values:
          platform: { en: "the company platform", de: "die Firmenplattform" }
          deployment: { en: "this deployment itself", de: "dieses Ausrollen selbst" }
        values: [platform, deployment]
        default: platform
        forced_when: >
          landing_zone: standalone pre-answers `deployment` - there is no platform to
          own the zones, so the deployment creates them and writes their records
          itself; central_private_dns answers it directly (yes: platform, no:
          deployment) and landing_zone_exists: yes presumes `platform`; private_dns_records and private_dns_zone_scope are then not
          reached
        why: >
          Private DNS zones are shared infrastructure: two deployments each creating
          `privatelink.blob.core.windows.net` is a conflict that only surfaces at
          apply time. `platform` references existing zones and creates only the A
          records, which is correct almost everywhere - including for a network
          this deployment creates: that network is a spoke, and the zones live in
          the platform's hub subscription regardless. `deployment` is for an
          isolated environment that genuinely owns its own resolution, and only
          when the user says so; "nothing exists yet" is not that.
        renders: >
          whether privatelink zones are created or referenced; the zone group on
          every private endpoint either way

      - id: private_dns_records
        ask: Does a platform policy create the DNS records for private endpoints, or does this deployment?
        type: enum
        resolved_by: derived
        plain:
          en: "The name entries for private connections are written by {value}."
          de: "Die Namenseinträge für private Anbindungen schreibt {value}."
        plain_values:
          policy: { en: "a platform rule, automatically", de: "eine Plattformregel, automatisch" }
          deployment: { en: "this deployment", de: "dieses Ausrollen" }
        values: [policy, deployment]
        default: policy
        depends_on: { question: private_dns_ownership, equals: platform }
        why: >
          In an Azure landing zone a DeployIfNotExists policy usually attaches
          every new private endpoint to the platform's privatelink zone and
          writes its record. If the generated code attaches a zone group as
          well, two writers own one record: the plan shows drift on every run,
          and the policy re-applies what the code removes. `policy` therefore
          renders no zone group at all and leaves the record to the platform.
          `deployment` is for a platform without that policy, and needs the
          zones' location (private_dns_zone_scope). Only reached when a private
          endpoint exists.
        renders: >
          whether private_dns_zone_group (terraform) / privateDnsZoneGroups
          (bicep) is rendered on every private endpoint

      - id: private_dns_zone_scope
        ask: In which subscription and resource group does the platform keep the private DNS zones?
        type: ref
        resolved_by: derived
        plain:
          en: "The platform keeps the name zones in {value}."
          de: "Die Plattform hält die Namenszonen in {value}."
        ref: resource_group
        required: true
        depends_on: { question: private_dns_records, equals: deployment }
        per_environment: true
        why: >
          Referencing a zone needs its subscription and resource group, and in a
          hub-and-spoke platform that is the hub's, not the workload's - so it is
          never the context's subscription by assumption. One answer per
          platform, recorded as "subscription-id / resource-group" and carried by
          every later run; a pattern skill for a known platform supplies it.
          Not needed when policy writes the records - then the code never
          references a zone.
        renders: >
          terraform: data "azurerm_private_dns_zone" with resource_group_name and a
          provider alias for the hub subscription; bicep: an `existing` zone with
          scope: resourceGroup(subscriptionId, resourceGroupName)

  - id: observability
    title: Observability
    questions:
      - id: observability_ownership
        ask: Should this deployment build its own Log Analytics workspace, or reference an existing one?
        type: enum
        resolved_by: derived
        plain:
          en: "Logs go to {value}."
          de: "Logs gehen in {value}."
        plain_values:
          create: { en: "a workspace this deployment creates and pays for", de: "einen Arbeitsbereich, den dieses Ausrollen anlegt und bezahlt" }
          reference: { en: "the company's central log workspace", de: "den zentralen Log-Arbeitsbereich der Firma" }
        values: [create, reference]
        default: reference
        forced_when: >
          landing_zone: standalone pre-answers `create` - without a platform there is
          no central workspace to reference; central_logging answers it directly
          (yes: reference, no: create) and landing_zone_exists: yes presumes `reference`
        why: >
          The same shape as the network question, and for the same reason: a
          workspace either exists and is read, or it does not and something has to
          create it. `reference` is right almost everywhere - a workspace per
          deployment fragments exactly the correlation an incident needs. `create`
          is for an isolated environment with no platform workspace to point at,
          and makes the workspace this deployment's to own and pay for.
        renders: >
          azurerm_log_analytics_workspace resource vs. data source;
          Microsoft.OperationalInsights/workspaces resource vs. existing reference

      - id: diagnostics_destination
        ask: Which existing Log Analytics workspace should receive diagnostics?
        type: ref
        resolved_by: derived
        plain:
          en: "Logs are collected in {value}."
          de: "Logs werden in {value} gesammelt."
        ref: log_analytics_workspace
        required: true
        depends_on: { question: observability_ownership, equals: reference }
        per_environment: true
        why: >
          Every resource routes diagnostics somewhere, and a resource with no
          setting is invisible exactly when someone needs to see it. Resolved here,
          before the first resource question, because "the workspace does not exist
          yet" is a prerequisite to settle rather than a gap to discover halfway
          through a resource interview. A pattern skill normally supplies it.
          Under `observability_ownership: create` this key still carries the
          destination - the workspace the deployment generates - so a resource
          inheriting it never has to know which way it was resolved.
        renders: the diagnostic setting attached to every resource that supports one

      - id: log_retention_days
        ask: How long should logs be retained?
        type: int
        resolved_by: interview
        topic: data
        plain:
          en: "Logs are kept for {value} days."
          de: "Logs werden {value} Tage aufbewahrt."
        default: 30
        non_production_default: 30
        offer:
          30: { en: "30 days - incident investigation; included in the ingestion price", de: "30 Tage - für die Fehlersuche; im Preis der Aufnahme enthalten" }
          90: { en: "90 days - a quarter, for analysis and traceability", de: "90 Tage - ein Quartal, für Auswertungen und Nachvollziehbarkeit" }
          180: { en: "180 days - half a year, where an audit looks back that far", de: "180 Tage - ein halbes Jahr, wenn eine Prüfung so weit zurückschaut" }
          365: { en: "365 days - a year, where a mandate requires it; charged per GB and month", de: "365 Tage - ein Jahr, wenn eine Vorgabe es verlangt; kostet je GB und Monat" }
        depends_on: { question: observability_ownership, equals: create }
        why: >
          The cost guard, and therefore decided here rather than per workspace: a
          deployment that owns its logging owns its logging bill. 30 days covers
          incident investigation, which is what most logs are for, and it is also
          where the retention line item starts - the first 31 days are included in
          the ingestion price. Longer retention is an audit or regulatory
          requirement rather than an operational one, and it is charged per
          gigabyte per month for as long as it is set. A retention the customer
          states holds in every stage - the savings relax defaults and derived
          values, never a stated one - unless they say which stage they mean;
          unstated, the non-production stages keep 30 days while
          non_production_savings is enabled, since nobody audits a test stage's
          logs.
        renders: azurerm_log_analytics_workspace.retention_in_days / properties.retentionInDays

      - id: daily_quota_gb
        ask: Should ingestion be capped per day?
        type: int
        plain:
          en: "Daily log intake cap: {value} GB (-1: no cap)."
          de: "Tägliche Obergrenze für Logs: {value} GB (-1: keine)."
        default: -1
        confirm_in: [production]
        depends_on: { question: observability_ownership, equals: create }
        why: >
          The second cost screw on the same workspace, so it belongs beside the
          first rather than in the resource set - asking them a level apart is how
          one gets answered and the other forgotten. -1 means no cap. A cap
          protects against a runaway logger emptying a budget, and it does it by
          **dropping logs for the rest of the day** once hit, which is a blind spot
          that arrives exactly when something is misbehaving loudly. In production
          prefer an alert on ingestion volume; in a sandbox the cap is the cheaper
          protection. If a cap is wanted, the number is the answer - "yes" is not.
        renders: azurerm_log_analytics_workspace.daily_quota_gb / properties.workspaceCapping.dailyQuotaGb

  - id: backup
    title: Backup
    questions:
      - id: backup_ownership
        ask: Should this deployment create its own backup vault, or use an existing one?
        type: enum
        resolved_by: derived
        plain:
          en: "Protected copies go to {value}."
          de: "Geschützte Kopien gehen in {value}."
        plain_values:
          create: { en: "a backup store this deployment creates and pays for", de: "einen Backup-Speicher, den dieses Ausrollen anlegt und bezahlt" }
          reference: { en: "the company's central backup store", de: "den zentralen Backup-Speicher der Firma" }
        values: [create, reference]
        default: create
        depends_on: { question: backup_isolation, not_equals: operational }
        forced_when: >
          central_backup answers it directly: yes `reference`, no `create`. Not reached when
          backup_isolation is `operational`
        why: >
          The same shape as the workspace question: a vault either exists and is used, or
          this deployment creates it. `create` is the default because an assumed vault that
          is missing fails at the first backup, and the deployment then owns the vault's
          soft delete, immutability and Resource Guard. `reference` leaves those to the
          platform team: this deployment adds backup instances and policies to the central
          vault and does not manage the vault itself.
        renders: >
          backup-vault / recovery-services-vault resource vs. an existing reference; the
          vault's own settings are rendered only under `create`

      - id: backup_vault_destination
        ask: Which existing backup vault should receive the protected copies?
        type: ref
        resolved_by: derived
        plain:
          en: "Protected copies are kept in {value}."
          de: "Geschützte Kopien werden in {value} aufbewahrt."
        ref: backup_vault
        required: true
        depends_on: { question: backup_ownership, equals: reference }
        per_environment: true
        why: >
          Read by name and resource group, never by a hardcoded resource id, for the same
          reason as the other referenced platform parts. Never asked of the customer: an
          `open:` entry owned by the platform team until the request names it.
        renders: data source / existing reference the backup instances are attached to
