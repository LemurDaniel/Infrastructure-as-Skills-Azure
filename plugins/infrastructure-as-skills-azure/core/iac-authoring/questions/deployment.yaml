schema_version: 1

scope: deployment
title: Deployment-wide decisions

# The decisions that hold for everything in one deployment. Resolved once, before
# any resource question set, and recorded under `deployment:` in the spec. A
# resource question marked `from_deployment` reads its answer from here instead of
# asking again - the posture of a system is one decision, not one per resource.

# `parameterized: true` marks a context value that is never asked and never written
# into the template: the rendered code takes it as an input variable (Terraform
# `variable`, Bicep `param`) with no default. Whoever deploys supplies it. The
# person is often only designing, and an interview that demands a subscription id
# or a region before they have a deployment target overruns them. Never asked is not
# never known: a value the description states is recorded (`source: stated`) and goes
# into the stage file; one it does not state is an `open:` entry and a placeholder in
# the stage file - never a plausible value nobody chose.

boundaries:
  - "Does not create the subscription; expects it from the context."
  - "Creates a resource group only where its mode is `create`; otherwise expects it from the context."
  - "Does not decide a single resource's exceptions - a resource may depart, and then records why."

groups:

  - id: context
    title: Context
    questions:
      - id: environments
        ask: Which stages does the system go through - the full stack of development, test and production, only development and production, a sandbox as one throwaway environment, or other stages you name?
        type: list
        resolved_by: interview
        topic: platform
        plain:
          en: "The system is deployed in these stages: {value}."
          de: "Das System wird in diesen Stufen ausgerollt: {value}."
        plain_values:
          development: { en: "development", de: "Entwicklung" }
          test: { en: "test", de: "Test" }
          qa: { en: "quality assurance", de: "Qualitätssicherung" }
          uat: { en: "acceptance", de: "Abnahme" }
          integration: { en: "integration", de: "Integration" }
          staging: { en: "pre-production", de: "Vorproduktion" }
          preproduction: { en: "pre-production", de: "Vorproduktion" }
          production: { en: "live operation", de: "Echtbetrieb" }
          sandbox: { en: "sandbox, one throwaway environment", de: "Sandbox, eine Wegwerf-Umgebung" }
          demo: { en: "demo", de: "Demo" }
          hotfix: { en: "hotfix", de: "Hotfix" }
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        default: [development, test, production]
        why: >
          The first decision of any run, and the one most often left unsaid: one
          code base is deployed through a stack of stages, and nearly everyone
          starts in development. So the stack development, test, production is
          the default - a default, not an assumption: an instruction not to
          assume anything unstated leaves every default in place, this one
          included. A request that names one stage names that stage of the
          stack: "Produktion" is the production stage, "Staging" joins the
          stack as a fourth stage (development, test, staging, production);
          a named stage never replaces the stack. Only the customer's own words
          shrink it - "nur prod", "nur eine Umgebung", "eine Sandbox zum
          Ausprobieren" - and `[sandbox]` is the other shape: one throwaway
          environment, no stack. The interview offers four choices: the full stack
          (development, test, production), development and production, sandbox, and other
          (the customer names the stages; a named stage joins the stack as described above).
          `[sandbox]` also answers the landing zone: `landing_zone: sandbox`, derived, with
          landing_zone_exists and the central_* questions not asked - a throwaway
          environment is not placed into a company platform. Every stage renders from the same code with its
          own parameter file (environments/<stage>.tfvars, main.<stage>.bicepparam)
          and its own state; a value that differs per stage (per_environment:
          true on its question) is a parameter whose value lives in that file,
          never a literal in the template. Decisions are the same in every stage
          (parity), except what non_production_savings relaxes.
        renders: >
          context.environments; one parameter file and one state per stage; the
          environment code in every name comes from the stage's file

      - id: stage_isolation
        ask: Does each stage (development, test, production) get an Azure subscription of its own, or do all stages share one?
        type: enum
        resolved_by: derived
        forced_when: >
          Never asked; follows deployment_scope (forced_by deployment.deployment_scope):
          subscription -> subscription, resource_group -> resource_group. At resource-group
          level the identities' role scope separates the stages whether they share a
          subscription or not, so the render needs no answer to that.
        plain:
          en: "Each stage lives in {value}."
          de: "Jede Stufe liegt in {value}."
        plain_values:
          subscription: { en: "its own subscription, so the stages cannot touch each other's resources, budgets or permissions", de: "einer eigenen Subscription; die Stufen können sich gegenseitig weder Ressourcen noch Budgets noch Berechtigungen anfassen" }
          resource_group: { en: "resource groups of its own; each stage deploys with an identity of its own that holds roles on its stage's groups only, never on the subscription", de: "eigenen Ressourcengruppen; jede Stufe rollt mit einer eigenen Identität aus, die nur auf den Ressourcengruppen ihrer Stufe Rechte hat, nie auf der Subscription" }
        values: [subscription, resource_group]
        default: subscription
        depends_on: { question: environments, not_equals: [sandbox] }
        why: >
          The boundary between stages is the boundary between a test that goes
          wrong and production. A subscription per stage is the landing-zone
          answer and the default: quotas, budgets, policy assignments, RBAC and
          the blast radius of a bad apply all stop at the subscription, and a
          landing zone platform vends subscriptions for exactly this. One shared
          subscription with a resource group per stage is the lesser form, for an
          organisation that cannot get subscriptions vended - it keeps the
          resources apart and little else, since budgets, quotas and most
          policies are subscription-scoped. Derived from deployment_scope rather
          than asked: at subscription level each stage needs its own subscription,
          at resource-group level the separation is the identities' role scope.
          Either way the subscription and the resource group are per-stage values
          that the stage's parameter file carries; this decision says which of the
          two actually separates the stages, so a reviewer knows what a wrong
          stage file can reach. `resource_group` holds only while no deploying
          identity has a role on the shared subscription: one with Contributor
          there reaches every stage's groups, and the separation is a naming
          convention. So it forces every resource group to `existing` - creating
          one needs a subscription-scope role - and each stage's identity gets its
          roles assigned on that stage's groups only. The person is told both when
          they choose it: the groups are created once beforehand, and the stages'
          deploying identities are separated by resource-group role assignments,
          because a subscription assignment removes the separation.
        renders: >
          terraform: subscription_id per environments/<stage>.tfvars and one state
          per stage; bicep: the deployment scope per stage on the command line;
          both: the resource group name per stage; resource_group: every
          resource_group_mode_<role> forced to existing, and the hand-over scopes each
          stage identity's roles to its own groups

      - id: deployment_scope
        ask: May the infrastructure create its own resource groups, or does it deploy only into resource groups that already exist?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "The infrastructure is deployed {value}."
          de: "Die Infrastruktur wird {value} ausgerollt."
        plain_values:
          resource_group: { en: "into resource groups that exist beforehand, with rights on those groups only", de: "in Ressourcengruppen, die vorab existieren, mit Rechten nur auf diesen Gruppen" }
          subscription: { en: "at subscription level, creating its resource groups itself", de: "auf Subscription-Ebene und legt ihre Ressourcengruppen selbst an" }
        values: [resource_group, subscription]
        default: resource_group
        why: >
          Asked in Phase 0, right after the module choice, because everything below follows
          from it - stage_isolation is derived from it:
          `subscription` lets the render create groups (resource_groups_created is asked),
          deploys a Bicep root with targetScope subscription through `az deployment sub` and
          needs the deploying identity to hold Contributor on the subscription;
          `resource_group` keeps every group `existing`, deploys at resource-group scope through
          `az deployment group` into the main group or the first group of a split, and needs
          rights on the stage's groups only. resource_group is the default because it is the
          narrower grant, and because a group usually carries more than this deployment.
        renders: >
          Bicep targetScope and the pipeline's az deployment group / sub; whether
          resource_groups_created is asked; deployment.deployer_roles

      - id: non_production_savings
        ask: Should the non-production stages run cheaper than production?
        type: enum
        plain:
          en: "Development and test stages {value}."
          de: "Entwicklungs- und Teststufen {value}."
        plain_values:
          enabled: { en: "run cheaper than production: less redundancy, shorter log retention - never less security", de: "laufen günstiger als die Produktion: weniger Redundanz, kürzere Log-Aufbewahrung, nie weniger Sicherheit" }
          disabled: { en: "are built identically to production", de: "werden identisch zur Produktion gebaut" }
        values: [enabled, disabled]
        default: enabled
        forced_when: >
          A stack without a production stage (`[sandbox]`) takes every
          non_production_default in every stage, recorded as forced with `environments`
          as forced_by - there is no production to be the baseline, and a sandbox that
          pays production prices (a P1v3 plan, ZRS) is the finding of the first dry run
          (2026-10-24). The question is then not asked. `priority: protection` forces
          `disabled`, recorded as forced with `priority` as forced_by: every stage like
          production is what that answer means.
        depends_on: { question: environments, not_equals: [sandbox] }
        why: >
          A development stage that keeps three copies of its data in three
          datacenters and ninety days of logs pays production prices for
          nothing. `enabled` lets a question with `non_production_default` take
          that value in every stage but production - replication, log retention -
          and nothing else: security, exposure, identity and data-protection
          decisions carry no such default, and the check refuses one, because a
          development stage that is less secure than production is where the
          breach happens and where the parity the stack exists for breaks. A
          customer who wants the stages identical says so, and that statement
          wins here as everywhere; `disabled` is also the engineer's answer for a
          stage used as a production-like rehearsal.
        renders: >
          per stage: the question's non_production_default in every stage but
          production when enabled, for defaulted and derived values only - a
          stated value holds in every stage; recorded per stage in the spec's
          value map

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "Everything runs in the Azure region {value}."
          de: "Alles läuft in der Azure-Region {value}."
        parameterized: true
        why: >
          Always an input variable of the template and never asked: a region
          demanded during design is a value the user may not have chosen yet.
          Stated in the description, it is recorded and written into every
          stage file; not stated, it is an `open:` entry (workload owner,
          blocks apply) and `OPEN-location` in the stage files - a region the
          run picked would deploy somewhere nobody decided, and data residency
          is judged against it.
          It is still a naming input, so the region abbreviation in every name
          is computed from the variable at plan time, not at render time.
        renders: variable location / param location - and the region abbreviation in every name

      - id: workload
        ask: Which workload is this for? (short name, goes into every resource name)
        type: string
        plain:
          en: "\"{value}\" is the name every part of the system carries."
          de: "„{value}“ ist der Name, den jeder Teil des Systems trägt."
        parameterized: true
        why: >
          Always an input variable of the template, never asked. It is the one
          human-chosen part of a rendered name, and the part someone searching the
          portal recognises - so the variable carries a validation (short, because
          several resource types cap the whole name at 24 characters) instead of
          a value.
        renders: variable workload / param workload - and the name of every resource

      - id: naming_convention
        ask: Should resource names follow the default convention, or does your organisation have its own?
        type: enum
        resolved_by: derived
        plain:
          en: "Resource names follow the {value} naming convention, so they are consistent to find and read."
          de: "Die Namen folgen der Namenskonvention „{value}“, damit sie einheitlich zu finden und zu lesen sind."
        values: [default, custom]
        default: default
        why: >
          The plugin's convention (core/iac-rendering/references/naming.default.yaml:
          CAF abbreviations, AVM region codes, per-type patterns where Azure's
          limits force them) is the convention. A Terraform root gets a full copy
          as naming.yaml beside the spec, because the provider reads it at plan
          time; a Bicep root gets none, its name vars are generated from the
          convention. `custom` means the user stated a departure - a pattern, an
          abbreviation, an environment code - and it is written into naming.yaml
          (for Bicep: a file holding the departures alone), never into a
          template. An existing naming.yaml or naming provider block in the
          repository is carried and never replaced. Not asked
          unless the user raises it: a convention is a deployment-wide decision,
          and most names cannot change after creation, so a run that offered it
          per resource would be offering a way to get two.
        renders: >
          naming.yaml beside infra-spec.yaml; terraform: the naming provider's
          `naming` argument; bicep: the generated location/environment maps and
          name vars

      - id: subscription_id
        ask: Which subscription does this deploy into?
        type: ref
        plain:
          en: "The system is deployed into subscription {value}."
          de: "Das System wird in die Subscription {value} ausgerollt."
        ref: subscription
        parameterized: true
        per_environment: true
        why: >
          Always an input variable of the template, never asked and never
          guessed. The same rendered code deploys into any subscription without
          editing it. A stage the description gives no id for is named by an
          `open:` entry (workload owner, blocks apply), and its stage file
          holds the all-zero GUID.
        renders: variable subscription_id (provider subscription_id) / the deployment's target scope

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "All parts are placed into the existing resource group {value}."
          de: "Alle Teile liegen in der bestehenden Ressourcengruppe {value}."
        ref: resource_group
        parameterized: true
        per_environment: true
        why: >
          Always an input variable of the template, never asked and never
          invented. A group the infrastructure creates (`resource_group_mode_main:
          create`) needs no name from anyone - the render computes it from the
          naming interface. An existing one does: a stage the description gives
          no name for is named by an `open:` entry (workload owner, blocks apply),
          and its stage file holds `OPEN-resource-group`. A
          network that belongs in a platform group is a separate, asked decision
          (network_ownership), not this value. Under resource_group_layout split
          there is no main group and this value is not written: each role's group
          is resource_group_name_<role>.
        renders: variable resource_group_name / param resourceGroupName / scope

  # ------------------------------------------------------- resource groups
  # `context.resource_group_name` above is the `main` group of a single layout: one
  # group per stage. A split has no main group: every role of the scheme a resource
  # belongs to has a group of its own, and each group is either expected to exist or
  # created by the render - the mode is per role, because a platform often owns the
  # network while the workload owns the rest. Which resource belongs to which role is
  # core/iac-rendering/references/resource-groups.md.
  - id: resource_groups
    title: Resource groups
    questions:
      - id: resource_group_layout
        ask: Should each stage's parts live together in one resource group, or be spread over several?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "Each stage's parts live {value}."
          de: "Die Teile einer Stufe liegen {value}."
        plain_values:
          single: { en: "together in one resource group", de: "zusammen in einer Ressourcengruppe" }
          split: { en: "spread over several resource groups", de: "verteilt auf mehrere Ressourcengruppen" }
        values: [single, split]
        default: single
        why: >
          One group per workload and stage is the simplest thing that works, and
          it is the default: the group is the unit of deletion, of RBAC and of
          cost view, and one lifecycle per stage is easy to reason about. A
          split earns its place when parts are owned differently - the network by
          a platform team, the data by a team with stricter access - or live
          differently: data with a delete lock outliving an application rebuilt
          freely. Every added group is one more name, one more role assignment
          scope and one more thing a stage file must supply. A yes-or-no question
          first, and how to split second, because a list of areas cannot be left
          empty in a multiple-choice answer and "none" was answered as "other".
        renders: >
          single: resource_group_split is [] and resource_group_scheme is not asked;
          split: resource_group_scheme decides the groups

      - id: resource_group_scheme
        ask: How should the parts be spread - by who is responsible for them, by how long they live, by how much protection their data needs, or by part of the system?
        type: enum
        resolved_by: interview
        topic: platform
        plain:
          en: "The resource groups are split {value}."
          de: "Die Ressourcengruppen sind {value} aufgeteilt."
        plain_values:
          concern: { en: "by responsibility - network, data, application, monitoring, security", de: "nach Zuständigkeit - Netzwerk, Daten, Anwendung, Überwachung, Sicherheit" }
          lifecycle: { en: "by lifecycle - built once, data that outlives every redeploy, parts replaced freely", de: "nach Lebenszyklus - einmal aufgebaut, Daten, die jedes Neu-Ausrollen überleben, frei ersetzbare Teile" }
          protection: { en: "by protection need - data and secrets in a fenced group, the rest beside it", de: "nach Schutzbedarf - Daten und Geheimnisse in einer abgeschotteten Gruppe, der Rest daneben" }
          component: { en: "by part of the system - one group per part, plus one for what all parts share", de: "nach Systembestandteil - je Teil eine Gruppe, dazu eine für das Gemeinsame" }
        values: [concern, lifecycle, protection, component]
        default: concern
        depends_on: { question: resource_group_layout, equals: split }
        why: >
          Four ways organisations split, each matching how they run things:
          `concern` when teams own areas (a network team, a data team), `lifecycle`
          when what matters is what may be torn down - the state group carries the
          delete lock and the backups, the runtime group is rebuilt freely -,
          `protection` when the administrators of the data are fewer than those of
          the system - the protected group's rights are granted separately -, and
          `component` when parts of the system have their own team or release pace,
          the shared foundation (network, monitoring, identities) in a group of its
          own. The first three are tables; the parts of `component` are the design's,
          named in resource_group_components. One group
          per kind of resource is not offered: it yields a group per type (fourteen
          for a chat app) that nobody owns or deletes as a unit, and cost by kind is a
          tag, not a group.
          The scheme decides the roles; which resource belongs to which role is the
          table in iac-rendering/references/resource-group-roles.yaml, not a
          question per area. The person sees the result in the diagram and moves a
          resource there, recorded as `placement.resource_group` (overridden).
        renders: >
          derives resource_group_split from the scheme's table and the resources
          in the design

      - id: resource_group_components
        ask: Which parts does the system consist of?
        type: list
        plain:
          en: "The system's parts, each with a resource group of its own: {value}."
          de: "Die Teile des Systems, jeder mit einer eigenen Ressourcengruppe: {value}."
        default: []
        depends_on: { question: resource_group_scheme, equals: component }
        forced_when: >
          Never asked; the run names the parts from the description and wiring.purposes - a
          short lowercase name each (chat, ingest, admin) - and places every resource that is
          not shared in one of them with placement.resource_group (forced, forced_by
          wiring.purposes). Recorded as `forced` with `forced_by: wiring.purposes`; the person
          renames, merges or splits parts at the diagram sign-off (`overridden`).
        why: >
          The parts are what the system is built from in the customer's eyes - the chat, the
          document import, the admin portal - and no table can know them. Derived rather than
          asked, because a person describing a chat app names its parts in passing and would
          not name them as a list; the diagram is where they see and correct them. `shared`
          is never a part: it is the group of what every part uses.
        renders: resource_groups.<part> per part, beside resource_groups.shared

      - id: resource_group_split
        ask: Which roles get a resource group of their own?
        type: list
        plain:
          en: "These areas get a resource group of their own: {value}. Everything else shares the main group."
          de: "Diese Bereiche erhalten eine eigene Ressourcengruppe: {value}. Alles andere liegt in der Hauptgruppe."
        plain_values:
          network: { en: "network", de: "Netzwerk" }
          data: { en: "data", de: "Daten" }
          application: { en: "application", de: "Anwendung" }
          observability: { en: "monitoring", de: "Überwachung" }
          security: { en: "security", de: "Sicherheit" }
          foundation: { en: "foundation", de: "Fundament" }
          state: { en: "state", de: "Zustand" }
          runtime: { en: "runtime", de: "Laufzeit" }
          protected: { en: "protected", de: "geschützt" }
          standard: { en: "standard", de: "Standard" }
          shared: { en: "shared", de: "gemeinsam" }
        default: []
        forced_when: >
          Never asked; derived from resource_group_layout and resource_group_scheme.
          single: []. split: every role of the scheme that at least one resource of the
          design belongs to, in the table's order; component: shared and the parts in
          resource_group_components. Recorded as `forced` with `forced_by: deployment.resource_group_scheme`;
          a role the person drops or adds after seeing the diagram is `overridden`.
        why: >
          The list the renderer, the diagram and the checks read: which groups exist
          besides the main group. Derived so that no person has to pick areas from a
          list longer than a multiple-choice question holds; a role with nothing in
          it is not split off, because an empty group is a name and a role scope with
          no purpose.
        renders: >
          resource_groups.<role> per listed role; a resource's group is its role's
          group, or the main group when its role is not split off

      - id: resource_groups_created
        ask: Which of these resource groups do not exist yet, so that the infrastructure should create them - the main group and the areas you gave a group of their own?
        type: list
        resolved_by: interview
        topic: platform
        plain:
          en: "The infrastructure creates these resource groups: {value}. Every other group already exists and is only used."
          de: "Die Infrastruktur legt diese Ressourcengruppen an: {value}. Alle anderen existieren bereits und werden nur verwendet."
        plain_values:
          main: { en: "main group", de: "Hauptgruppe" }
          network: { en: "network", de: "Netzwerk" }
          data: { en: "data", de: "Daten" }
          application: { en: "application", de: "Anwendung" }
          observability: { en: "monitoring", de: "Überwachung" }
          security: { en: "security", de: "Sicherheit" }
          foundation: { en: "foundation", de: "Fundament" }
          state: { en: "state", de: "Zustand" }
          runtime: { en: "runtime", de: "Laufzeit" }
        default: []
        depends_on: { question: deployment_scope, equals: subscription }
        forced_when: >
          stage_isolation resource_group forces [] - creating a group needs a role on the
          shared subscription, which would reach every stage - and it is not asked; the
          person is told the groups are created beforehand.
        why: >
          One question instead of one per group: every role the customer split off used to
          cost its own existing-or-create answer, and a system with five split areas asked
          six near-identical questions. The answer is the list of groups that must be
          created; every group not on it is expected to exist, which is the default
          (`existing`) of the old per-role questions. Only `main` and the roles in
          resource_group_split apply; a listed role that was not split off is ignored.
          Why `existing` is the default, what `create` costs (Contributor on the
          subscription, a destroy that takes the group with it) and why the platform
          often owns the network group are the reasons given on the derived
          resource_group_mode_<role> questions below.
        renders: >
          derives resource_group_mode_<role> for main and every split role: create for a
          listed role, existing otherwise; the spec keeps one mode per role

      - id: resource_group_mode_main
        ask: Does the main resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when main is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The main resource group {value}."
          de: "Die Hauptressourcengruppe {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_layout, not_equals: split }
        why: >
          `existing` is the default because a group usually carries more than
          this deployment: RBAC, policy assignments, locks and the cost view are
          set by whoever hands it out, and a render that creates the group owns
          a lifecycle wider than its resources - a destroy would delete the group
          and with it anything else in it. `create` is right for a workload that
          has its own subscription or a sandbox, where nobody hands groups out.
          It costs a wider deployment right: creating a group needs
          Contributor on the subscription, not on the group, so a Bicep root
          deploys at subscription scope. Decided per group because the platform
          often owns one and the workload the others.
        renders: >
          existing: variable resource_group_name per stage; create: the AVM
          resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_network
        ask: Does the network resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when network is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The network resource group {value}."
          de: "Die Ressourcengruppe für das Netzwerk {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: network }
        why: >
          A network group is the one most often handed out by a platform team
          that also owns the address plan, the hub peering and the DNS zones, so
          `existing` is the default; see resource_group_mode_main for what
          `create` costs. A workload that builds its own network creates its own
          group.
        renders: >
          existing: variable resource_group_name_network per stage; create: the
          AVM resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_data
        ask: Does the data resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when data is in resource_groups_created, otherwise `existing`;
          always `existing` under deployment_scope resource_group (forced_by deployment.deployment_scope)
        plain:
          en: "The data resource group {value}."
          de: "Die Ressourcengruppe für die Daten {value}."
        plain_values:
          existing: { en: "already exists and is only used", de: "existiert bereits und wird nur verwendet" }
          create: { en: "is created together with the system", de: "wird zusammen mit dem System angelegt" }
        values: [existing, create]
        default: existing
        depends_on: { question: resource_group_split, contains: data }
        why: >
          See resource_group_mode_main. A data group is split off to keep its
          lifecycle and its lock apart from the application, which is the reason
          to create it with the system as well: the lock then comes with it.
        renders: >
          existing: variable resource_group_name_data per stage; create: the AVM
          resource group module, named by the naming interface unless a name is stated

      - id: resource_group_mode_application
        ask: Does the application resource group already exist, or should the infrastructure create it?
        type: enum
        resolved_by: derived
        forced_when: >
          Not asked: `create` when application is in resource_groups_created, otherwise `existing`;
