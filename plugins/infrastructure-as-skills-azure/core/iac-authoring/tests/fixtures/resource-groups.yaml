schema_version: 1

# Hand-written fixture for run_spec_tests.py, never a starting spec or a template: a private
# deployment whose resource groups are split - network (existing, handed out by the platform),
# data and observability (created), the rest in the main group (created). The key vault departs
# from its role and sits with the data, grants a role and holds a secret placeholder, so the
# deployer needs all three extra roles. The tests break one rule of it at a time.
spec:
  id: shop-groups
  target: terraform
  at: 2026-10-25T12:00:00Z

context:
  language: en
  environments: [production]
  location: westeurope
  workload: shop
  subscription_id:
    production: 11111111-2222-3333-4444-555555555555
  resource_group_name:
    production: rg-shop-prod-we
  resource_group_name_network:
    production: rg-spoke-shop-prod-we

deployment:
  landing_zone: { value: standalone, source: stated }
  network_exposure: { value: private, source: stated }
  network_ownership: { value: create, source: stated }
  address_space: { value: 10.30.0.0/16, source: asked }
  observability_ownership: { value: create, source: default }
  private_dns_ownership: { value: deployment, source: default }
  local_auth: { value: disabled, source: default }
  resource_group_split: { value: [network, data, observability], source: stated }
  resource_group_mode_main: { value: create, source: stated }
  resource_group_mode_network: { value: existing, source: stated }
  resource_group_mode_data: { value: create, source: stated }
  resource_group_mode_observability: { value: create, source: asked }
  resource_group_lock: { value: production, source: default }
  deployer_roles:
    value:
      - { role: Contributor, scope: subscription, for: [deployment.resource_group_mode_main] }
      - { role: Role Based Access Control Administrator, scope: resource_group, for: [resources.key-vault] }
      - { role: Key Vault Secrets Officer, scope: key-vault, for: [resources.key-vault.security.secret_placeholders] }
    source: forced
    forced_by: [deployment.resource_group_mode_main, resources.key-vault.identity.role_assignments, resources.key-vault.security.secret_placeholders]

wiring:
  access:
    value:
      - { from: users, to: app-service, label: HTTPS 443 }
      - { from: app-service, to: storage-account }
      - { from: app-service, to: key-vault }
    source: stated
  purposes:
    value: { app-service: Shop frontend, storage-account: Product images, key-vault: Secrets }
    source: stated

resources:
  virtual-network:
    addressing:
      address_space: { value: 10.30.0.0/16, source: forced, forced_by: deployment.address_space }
  app-service:
    networking:
      public_network_access: { value: disabled, source: deployment }
  storage-account:
    networking:
      public_network_access: { value: disabled, source: deployment }
  key-vault:
    placement:
      resource_group: { value: data, source: overridden, reason: the vault is kept with the data it protects }
    networking:
      public_network_access: { value: disabled, source: deployment }
    identity:
      role_assignments:
        value:
          production:
            - { principal: app-service, role: Key Vault Secrets User }
        source: stated
    security:
      secret_placeholders: { value: [payment-api-key], source: stated }
  log-analytics-workspace:
    cost:
      retention_days: { value: 30, source: default }
