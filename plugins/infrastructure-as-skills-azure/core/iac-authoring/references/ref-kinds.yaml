# The kinds a question's `accepts: { ref: <kind> }` may name, and what a reference of each
# kind is. question-set-format.md describes the field, spec.md the two value forms:
#
#   { resource: <key>[, part: <name>] }     a resource of this spec (one value, every stage)
#   { existing: <kind>[, id: {<stage>: <id>}] }  one outside it; without an id, an open: entry
#
# A kind that is a whole resource:
#   set       the question set whose resources a `resource:` reference may name; `any` for a
#             reference to any resource; left out when the spec never creates one, so that
#             only `existing:` is possible
#
# A kind that is a part of a resource (a subnet of a network), `part:` then names one:
#   part_of         the question set of the resource the part belongs to
#   listed_in       <group>.<question> of that set, whose list names the parts
#   always_present  parts the resource has without listing them, each { name, when_answered }:
#                   once the question `when_answered` (<group>.<question>) has an answer, the
#                   part `name` exists - unless a listed part carries that answer as its
#                   prefix in the stage, which is then that part
#
# Every kind:
#   existing  what a reference to one outside the spec must be: { type, id }
#     type    the ARM type the id carries (provider namespace and type segments)
#     id      the id's form: arm (a resource id of `type`), arm_any (any resource id, a group,
#             a subscription or a management group), guid (an Entra object or a subscription id)
#
# check_question_set.py fails on a kind missing here, and on a set or question that does not
# exist; check_spec.py reads it for every reference a spec holds.

kinds:
  action_group:               { set: action-group,              existing: { type: Microsoft.Insights/actionGroups, id: arm } }
  app_service:                { set: app-service,               existing: { type: Microsoft.Web/sites, id: arm } }
  application_insights:       { set: application-insights,      existing: { type: Microsoft.Insights/components, id: arm } }
  availability_set:           { set: availability-set,          existing: { type: Microsoft.Compute/availabilitySets, id: arm } }
  backup_policy:              {                                 existing: { type: Microsoft.RecoveryServices/vaults/backupPolicies, id: arm } }
  backup_vault:               { set: backup-vault,              existing: { type: Microsoft.DataProtection/backupVaults, id: arm } }
  container_apps:             { set: container-apps,            existing: { type: Microsoft.App/containerApps, id: arm } }
  container_registry:         { set: container-registry,        existing: { type: Microsoft.ContainerRegistry/registries, id: arm } }
  data_collection_endpoint:   {                                 existing: { type: Microsoft.Insights/dataCollectionEndpoints, id: arm } }
  ddos_protection_plan:       { set: ddos-protection-plan,      existing: { type: Microsoft.Network/ddosProtectionPlans, id: arm } }
  disk_access:                {                                 existing: { type: Microsoft.Compute/diskAccesses, id: arm } }
  disk_encryption_set:        {                                 existing: { type: Microsoft.Compute/diskEncryptionSets, id: arm } }
  entra_group:                {                                 existing: { id: guid } }
  event_grid_topic:           { set: event-grid-topic,          existing: { type: Microsoft.EventGrid/topics, id: arm } }
  event_hub:
    part_of: event-hubs
    listed_in: entities.event_hubs
    existing: { type: Microsoft.EventHub/namespaces/eventhubs, id: arm }
  event_hubs_namespace:       { set: event-hubs,                existing: { type: Microsoft.EventHub/namespaces, id: arm } }
  function_app:               { set: function-app,              existing: { type: Microsoft.Web/sites, id: arm } }
  gallery_image:              {                                 existing: { type: Microsoft.Compute/galleries/images/versions, id: arm } }
  key_vault:                  { set: key-vault,                 existing: { type: Microsoft.KeyVault/vaults, id: arm } }
  key_vault_key:              { set: key-vault-key,             existing: { type: Microsoft.KeyVault/vaults/keys, id: arm } }
  key_vault_secret:           { set: key-vault-secret,          existing: { type: Microsoft.KeyVault/vaults/secrets, id: arm } }
  load_balancer_backend_pool:
    part_of: load-balancer
    listed_in: networking.backend_pools
    existing: { type: Microsoft.Network/loadBalancers/backendAddressPools, id: arm }
  log_analytics_workspace:    { set: log-analytics-workspace,   existing: { type: Microsoft.OperationalInsights/workspaces, id: arm } }
  logic_app:                  { set: logic-app,                 existing: { type: Microsoft.Logic/workflows, id: arm } }
  maintenance_configuration:  { set: maintenance-configuration, existing: { type: Microsoft.Maintenance/maintenanceConfigurations, id: arm } }
  monitor_private_link_scope: {                                 existing: { type: Microsoft.Insights/privateLinkScopes, id: arm } }
  network_security_perimeter: {                                 existing: { type: Microsoft.Network/networkSecurityPerimeters, id: arm } }
  # A principal of this spec is a user-assigned identity; one outside it is an Entra object id.
  principal:                  { set: user-assigned-identity,    existing: { id: guid } }
  private_dns_zone:           { set: private-dns-zone,          existing: { type: Microsoft.Network/privateDnsZones, id: arm } }
  private_link_resource:      { set: any,                       existing: { id: arm_any } }
  public_ip_address:          { set: public-ip-address,         existing: { type: Microsoft.Network/publicIPAddresses, id: arm } }
  public_ip_prefix:           {                                 existing: { type: Microsoft.Network/publicIPPrefixes, id: arm } }
  purview_account:            { set: purview-account,           existing: { type: Microsoft.Purview/accounts, id: arm } }
  recovery_services_vault:    { set: recovery-services-vault,   existing: { type: Microsoft.RecoveryServices/vaults, id: arm } }
  resource:                   { set: any,                       existing: { id: arm_any } }
  resource_group:             {                                 existing: { type: Microsoft.Resources/resourceGroups, id: arm } }
  resource_guard:             {                                 existing: { type: Microsoft.DataProtection/resourceGuards, id: arm } }
  service_bus_namespace:      { set: service-bus,               existing: { type: Microsoft.ServiceBus/namespaces, id: arm } }
  snapshot:                   {                                 existing: { type: Microsoft.Compute/snapshots, id: arm } }
  storage_account:            { set: storage-account,           existing: { type: Microsoft.Storage/storageAccounts, id: arm } }
  subnet:
    part_of: virtual-network
    listed_in: addressing.subnets
    always_present:
      - { name: endpoints, when_answered: addressing.private_endpoint_subnet_prefix }
    existing: { type: Microsoft.Network/virtualNetworks/subnets, id: arm }
  subscription:               {                                 existing: { id: guid } }
  user_assigned_identity:     { set: user-assigned-identity,    existing: { type: Microsoft.ManagedIdentity/userAssignedIdentities, id: arm } }
  virtual_network:            { set: virtual-network,           existing: { type: Microsoft.Network/virtualNetworks, id: arm } }
