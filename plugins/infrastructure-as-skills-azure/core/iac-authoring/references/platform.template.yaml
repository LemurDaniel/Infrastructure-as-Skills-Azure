# platform.yaml - the platform profile. Written once by the platform or DevOps engineer,
# read by every interview on this platform. Keys are the deployment-set questions whose
# `resolved_by` is `platform` (core/iac-authoring/questions/deployment.yaml); delete the keys
# you do not want to fix, keep the rest. Rules: references/platform.md.
schema_version: 1

platform:
  id: my-platform                   # free text - appears in the spec and the handover
  owner: platform team              # free text - who to ask when a value is wrong

# standalone | corp | online | sandbox - the CAF archetype the workload lands in. standalone
# means no landing zone platform exists: the deployment owns its network, DNS and workspace.
landing_zone: standalone

# default | custom - custom means naming.yaml carries the organisation's departures.
naming_convention: default

# enabled | disabled - whether the Azure Verified Modules may send deployment telemetry.
module_telemetry: disabled

# --- network: a corp workload references the hub; standalone creates its own ------------
# create | reference | none
network_ownership: create
# Only with reference: the existing network, by name and resource group - never an id.
# existing_vnet:
#   name: vnet-hub-prod-we
#   resource_group_name: rg-network-prod-we
# Only with reference: the subnet that carries every private endpoint.
# private_endpoint_subnet: snet-privatelink
# Only with create: the ranges the address-management owner assigned to this platform.
# address_space: 10.42.0.0/16
# private_endpoint_subnet_prefix: 10.42.0.0/27

# --- dns -------------------------------------------------------------------------------
# platform | deployment - who owns the privatelink zones. standalone forces deployment.
private_dns_ownership: platform
# policy | deployment - whether a DeployIfNotExists policy writes the endpoint records.
private_dns_records: policy
# Only with private_dns_records: deployment - where the platform keeps the zones.
# private_dns_zone_scope:
#   subscription_id: 00000000-0000-0000-0000-000000000000
#   resource_group_name: rg-dns-prod-we

# --- observability ---------------------------------------------------------------------
# create | reference - standalone forces create.
observability_ownership: reference
# Only with reference: the central workspace, by name and resource group.
# diagnostics_destination:
#   name: log-platform-prod-we
#   resource_group_name: rg-observability-prod-we
