    owner: platform team
    blocks: apply
  - key: resources.sql-server
    question: No question set backs SQL Server; which authentication, tier and failover group does the shop need?
    owner: workload owner
    blocks: apply
  - key: resources.redis-cache
    question: No question set backs Redis; which tier and eviction policy?
    owner: workload owner
