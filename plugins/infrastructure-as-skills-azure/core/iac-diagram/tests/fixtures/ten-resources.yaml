      purpose: { value: Order worker, source: stated }
    networking:
      public_network_access: { value: disabled, source: deployment }
      private_endpoint_subnet: { value: { production: snet-privatelink }, source: deployment }
      integration_subnet: { value: { production: snet-app-integration }, source: stated }
