    value: platform
    source: default
  private_dns_records:
    value: policy
    source: default
  observability_ownership:
    value: reference
    source: stated
  diagnostics_destination:
    value:
      production:
        name: log-platform-prod-gwc
        resource_group_name: rg-observability-prod-gwc
    source: stated
  mandates:
    value: [BSI C5, ISO 27001]
    source: stated
  local_auth:
    value: disabled
    source: default

composition:
  granularity: single
  source: default

wiring:
  access:
    value:
      - { from: users, to: app-service, label: HTTPS 443 }
      - { from: app-service, to: external:entra-id, label: OIDC }
      - { from: app-service, to: storage-account }
      - { from: app-service, to: key-vault }
      - { from: app-service, to: sql-server }
      - { from: app-service, to: redis-cache }
