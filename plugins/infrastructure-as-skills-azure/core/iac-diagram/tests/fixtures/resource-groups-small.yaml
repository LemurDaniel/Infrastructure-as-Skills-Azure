schema_version: 1

# Three services in three groups (data, security, application) beside one compute resource: the
# compact layout, services in a row below the network, a frame per group in the row.
spec:
  id: shop-groups-small
  target: terraform
  at: 2026-10-25T12:00:00Z

context:
  language: de
  environments: [production]
  location: westeurope
  workload: shop

deployment:
  landing_zone: { value: standalone, source: stated }
  network_exposure: { value: private, source: stated }
  network_ownership: { value: create, source: stated }
  address_space: { value: 10.30.0.0/16, source: asked }
  observability_ownership: { value: create, source: default }
  private_dns_ownership: { value: deployment, source: default }
  local_auth: { value: disabled, source: default }
  resource_group_layout: { value: split, source: stated }
  resource_groups_created: { value: [security, observability, application], source: stated }   # data exists

wiring:
  access:
    value:
      - { from: app-service, to: storage-account }
      - { from: app-service, to: key-vault }
      - { from: app-service, to: container-registry }
    source: stated

resources:
  app-service:
    networking:
      public_network_access: { value: disabled, source: deployment }
  storage-account:
    networking:
      public_network_access: { value: disabled, source: deployment }
  key-vault:
    networking:
      public_network_access: { value: disabled, source: deployment }
  container-registry:
    networking:
      public_network_access: { value: disabled, source: deployment }
  log-analytics-workspace:
    cost:
      retention_days: { value: 30, source: default }
