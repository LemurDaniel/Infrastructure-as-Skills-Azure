schema_version: 1

# A private deployment whose resource groups are split: network (existing, handed out by the
# platform), data, application, observability and security (created); there is no main group.
# The key vault departs from its role and sits with the data. Five services in two groups, so the
# services stand in the side layout, a frame per group; the support zone has two groups as well.
spec:
  id: shop-groups
  target: terraform
  at: 2026-10-25T12:00:00Z

context:
  language: en
  environments: [production]
  location: westeurope
  workload: shop
  subscription_id:
    production: 11111111-2222-3333-4444-555555555555
  resource_group_name_network:
    production: rg-spoke-shop-prod-we

deployment:
  landing_zone: { value: standalone, source: stated }
  network_exposure: { value: private, source: stated }
  network_ownership: { value: create, source: stated }
  address_space: { value: 10.30.0.0/16, source: asked }
  observability_ownership: { value: create, source: default }
  private_dns_ownership: { value: deployment, source: default }
  local_auth: { value: disabled, source: default }
  resource_group_layout: { value: split, source: stated }
  resource_groups_created: { value: [application, security, data, observability], source: stated }   # network exists
  resource_group_lock: { value: production, source: default }

wiring:
  access:
    value:
      - { from: users, to: app-service, label: HTTPS 443 }
      - { from: app-service, to: storage-account }
      - { from: app-service, to: key-vault }
      - { from: app-service, to: cosmos-db }
      - { from: app-service, to: container-registry }
      - { from: app-service, to: search-service }
    source: stated

resources:
  virtual-network:
    addressing:
      address_space: { value: 10.30.0.0/16, source: { forced_by: deployment.address_space } }
  app-service:
    meta:
      purpose: { value: Shop frontend, source: stated }
    networking:
      public_network_access: { value: disabled, source: deployment }
  storage-account:
    meta:
      purpose: { value: Product images, source: stated }
    networking:
      public_network_access: { value: disabled, source: deployment }
  key-vault:
    meta:
      purpose: { value: Secrets, source: stated }
    placement:
      resource_group: { value: data, source: { overridden: the vault is kept with the data it protects } }
    networking:
      public_network_access: { value: disabled, source: deployment }
  log-analytics-workspace:
    cost:
      retention_days: { value: 30, source: default }
  cosmos-db:
    meta:
      purpose: { value: Orders, source: stated }
    networking:
      public_network_access: { value: disabled, source: deployment }
  container-registry:
    meta:
      purpose: { value: Images, source: stated }
    networking:
      public_network_access: { value: disabled, source: deployment }
  search-service:
    meta:
      purpose: { value: Product search, source: stated }
    networking:
      public_network_access: { value: disabled, source: deployment }
  network-security-group:
    networking:
      subnet: { value: snet-app, source: default }
  user-assigned-identity:
    identity:
      purpose: { value: the app's identity, source: default }
