schema_version: 1

# A public deployment without a network: no virtual network, no endpoints, an internet actor
# with orange lines, and one target that is private by its own decision (blue line).
spec:
  id: shop-public
  target: terraform
  at: 2026-10-18T12:00:00Z

context:
  language: en
  environments: [production]
  location: westeurope
  workload: shop
  subscription_id:
    production: 11111111-2222-3333-4444-555555555555
  resource_group_name:
    production: rg-shop-prod-we

deployment:
  landing_zone: { value: online, source: stated }
  network_exposure: { value: public, source: stated }
  network_ownership: { value: none, source: stated }
  observability_ownership: { value: create, source: forced, forced_by: deployment.landing_zone }
  private_dns_ownership: { value: deployment, source: default }
  local_auth: { value: disabled, source: default }

wiring:
  access:
    value:
      - { from: app-service, to: storage-account }
      - { from: app-service, to: key-vault }
      - { from: app-service, to: redis-cache }   # not a resource here: must not become an actor
    source: stated
  purposes:
    value: { app-service: Shop frontend, storage-account: Product images, key-vault: Secrets }
    source: stated

resources:
  app-service:
    networking:
      public_network_access: { value: enabled_with_firewall, source: deployment }
  storage-account:
    networking:
      public_network_access: { value: enabled_with_firewall, source: deployment }
  key-vault:
    networking:
      public_network_access: { value: disabled, source: overridden, reason: the vault is only called by the app }
  log-analytics-workspace:
    cost:
      retention_days: { value: 30, source: default }
