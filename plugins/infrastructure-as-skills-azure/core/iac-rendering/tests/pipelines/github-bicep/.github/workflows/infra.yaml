# Rendered from infra-spec.yaml. Platform prerequisites: see pipelines.github.md.
name: Infrastructure

on:
  pull_request:
    paths: ["**.tf", "**.tfvars", "**.bicep", "**.bicepparam", ".github/workflows/infra*.yaml"]
  push:
    branches: [master]
    paths: ["**.tf", "**.tfvars", "**.bicep", "**.bicepparam", ".github/workflows/infra*.yaml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: az bicep build --file main.bicep --stdout > $null
      - run: az bicep lint --file main.bicep
      - name: Parameter files compile against the template
        run: |
          foreach ($f in Get-ChildItem main.*.bicepparam) {
            az bicep build-params --file $f.Name --stdout > $null
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Decision tests against the compiled template
        run: |
          if (-not (Get-Command bicep -ErrorAction SilentlyContinue)) {
            az bicep install
            $env:PATH = "$HOME/.azure/bin" + [IO.Path]::PathSeparator + $env:PATH
          }
          python -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/run_arm_tests.py infra-spec.yaml --template main.bicep --tests tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  development:
    needs: validate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/infra-stage.yaml
    permissions:
      contents: read
      id-token: write
    with:
      stage: development
      gated: false

  test:
    needs: development
    uses: ./.github/workflows/infra-stage.yaml
    permissions: { contents: read, id-token: write }
    with: { stage: test, gated: false }

  production:
    needs: test
    uses: ./.github/workflows/infra-stage.yaml
    permissions: { contents: read, id-token: write }
    with: { stage: production, gated: true }   # pipeline_approvals: production
