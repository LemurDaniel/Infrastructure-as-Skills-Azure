# Which resource group role a kind of resource belongs to when deployment.resource_group_split
# names that role. A role not split off is part of `main`. One table, read by the diagram
# (iac-diagram/scripts/new_diagram.py) and the decision document
# (iac-authoring/scripts/export_decisions.py); the prose is resource-groups.md. A resource departs
# with `placement.resource_group` in the spec, never here.
roles: [main, network, data, application, observability, security]
kinds:
  network: [virtual-network, network-security-group, application-gateway, front-door, public-dns-zone, ddos-protection-plan]
  data: [storage-account, cosmos-db, sql-server, redis-cache, backup-vault, recovery-services-vault, sql-managed-instance, data-factory, purview-account]
  application: [app-service, function-app, container-apps, container-registry, foundry, search-service, service-bus, event-hubs, event-grid-topic, api-management, traffic-manager, event-grid-namespace, event-grid-system-topic, relay-namespace, logic-app, communication-services, ai-services, machine-learning-workspace, bot-service]
  observability: [log-analytics-workspace, application-insights, action-group, alert-rule, data-collection-rule, network-watcher]
  security: [key-vault, user-assigned-identity]
