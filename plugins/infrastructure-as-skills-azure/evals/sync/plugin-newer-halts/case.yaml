schema_version: "1.1"
name: plugin-newer-halts

context:
  scaffold_script: scaffold.sh

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: iac-authoring

  - name: spec-untouched
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'public_network_access:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?enabled\b'

  - name: version-not-lowered
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'plugin_version:\s*\W?99\.0\.0'

  # The version gate halts before anything is written: not a file the scaffold left, not a new
  # one. A changed file shows in the regexes only when its content changed; a call does not hide.
  - name: nothing-written
    type: tool_used
    tool: Write
    min: 0
    max: 0
    weight: 3

  - name: nothing-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    weight: 3

  - name: no-claude-md-written
    type: file_exists
    path: CLAUDE.md
    exists: false
    weight: 2

  - name: no-code
    type: file_exists
    path: '**/*.tf'
    exists: false
    weight: 2

  - name: asks-for-update
    type: llm
    weight: 3
    focus: last_message
    criteria: |
      PASS if the message says the plugin is older than the version that wrote the spec (or
      that the spec comes from a newer plugin) and asks the person to update the plugin,
      or offers to update it. Language and formatting do not matter.
      FAIL if it reports the change as made, or carries on without mentioning the plugin
      version.
