    source: default

  # --- network ---
  network_ownership:
    value: none
    source: stated

  # --- observability ---
  observability_ownership:
    value: none
    source: default

composition:
  granularity: single
  source: stated

resources:
  key-vault:
    meta:
      purpose:
        value: Platzhalter-Secrets der Anwendung
        source: stated
    networking:
      public_network_access:
        value: enabled
        source: stated
    security:
      # The real values are entered by hand later; a redeployment must not overwrite them.
      secret_placeholders:
