schema_version: "1.1"
name: bicep-rerender-keeps-names

# The deployed root - spec, main.bicep, parameter file - is a file set under workspace/, copied into
# the run's working directory by scaffold.sh. Its Key Vault name is the pattern before <LOCATION>
# entered it; a re-render that follows the current default renames a deployed, global vault.
context:
  scaffold_script: scaffold.sh

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  # The point of the case: the deployed name stays, in its old shape and without the location.
  # The suffix var may be renamed or inlined; the order before it may not.
  - name: key-vault-name-kept
    type: regex
    weight: 3
    target: { source: file, path: infra/main.bicep }
    pattern: '''kv-\$\{env\}-\$\{workload\}-\$\{'

  - name: key-vault-not-renamed-to-the-default
    type: regex
    weight: 3
    target: { source: file, path: infra/main.bicep }
    pattern: '''kv-\$\{loc'
    match: not_contains

  # The storage name already follows the current default and must not move either.
  - name: storage-name-kept
    type: regex
    weight: 2
    target: { source: file, path: infra/main.bicep }
    pattern: 'toLower\(''st\$\{loc\}\$\{env\}\$\{workload\}\$\{idx\}''\)'

  # The pin: the root predates the copy, so the run writes naming.yaml (the scaffold has none) -
  # a full copy, with the Key Vault pattern the root actually names, not today's default.
  - name: naming-yaml-written
    type: file_exists
    path: infra/naming.yaml
    weight: 2

  - name: naming-yaml-pins-the-old-key-vault-pattern
    type: regex
    weight: 3
    target: { source: file, path: infra/naming.yaml }
    pattern: 'Microsoft\.KeyVault/vaults"?:\s*(?:#[^\n]*\s*)*default:\s*["'']?<TYPE>-<ENVIRONMENT>-<NAME>-<UNIQUE_ID_4>["'']?\s*$'
    flags: m

  - name: naming-yaml-is-a-full-copy
    type: regex
    weight: 2
    target: { source: file, path: infra/naming.yaml }
    pattern: '(?=[\s\S]*^\s*abbreviations:)(?=[\s\S]*^\s*mappings:)(?=[\s\S]*Microsoft\.CognitiveServices/accounts::)'
    flags: m

  # Pinning an older default is not a customer departure: the convention stays `default`.
  - name: spec-naming-convention-not-custom
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'naming_convention:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?custom\b'
    match: not_contains

  # The change asked for, in both places.
  - name: spec-blob-soft-delete-14
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'blob_soft_delete_days:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?14\b'

  - name: bicep-blob-soft-delete-14
    type: regex
    weight: 2
    target: { source: file, path: infra/main.bicep }
    pattern: 'deleteRetentionPolicy:\s*\{[^}]*days:\s*14\b'
