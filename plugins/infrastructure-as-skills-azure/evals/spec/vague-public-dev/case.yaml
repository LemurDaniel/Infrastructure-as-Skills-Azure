schema_version: "1.1"
name: vague-public-dev

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  - name: exposure-public
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_exposure:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?public\b'

  - name: no-network
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?none\b'

  # "dev" names the development stage of the default stack, not a single environment.
  - name: stages-default-stack
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'environments:\s*\[(?=[^\]]*\bdevelopment\b)(?=[^\]]*\bproduction\b)[^\]]*\]'

  # Nothing names a platform, so the deployment is standalone and creates the workspace
  # the logs go to - "Logs nach Log Analytics" is not a reference to an existing one.
  - name: standalone-landing-zone
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'landing_zone:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?standalone\b'

  - name: workspace-created
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'observability_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?create\b'

  # Subscription, resource group and region are parameterized context: never asked, and
  # what the request does not state is an open entry - never a plausible value. The
  # no-invented graders below catch a value; these catch a spec that left them silent.
  - name: open-location
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^open:[\s\S]*key:\s*context\.location\b'
    flags: m

  - name: open-subscription
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^open:[\s\S]*key:\s*context\.subscription_id\b'
    flags: m

  - name: open-resource-group
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^open:[\s\S]*key:\s*context\.resource_group_name\b'
    flags: m

  - name: no-invented-location
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s+location:\s*\w'
    flags: m
    match: not_contains

  # With shared keys off nobody can use the account until a role is assigned: open.
  - name: open-role-assignments
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^open:[\s\S]*role_assignments'
    flags: m

  - name: no-invented-subscription
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    match: not_contains

  - name: no-invented-resource-group
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'value:\W{0,3}rg-'
    match: not_contains

  - name: no-vnet-resource
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}virtual-network:'
    flags: m
    match: not_contains

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.tf'
    exists: false

  # Short output, concrete conditions - the one place a judge earns its cost.
  - name: says-what-is-missing
    type: llm
    focus: last_message
    criteria: |
      PASS if the final message tells the user that the spec cannot be deployed yet
      (or "not applyable", "blockiert apply", "offene Punkte", or equivalent) AND names
      at least one thing still needed from them (who gets access / role assignments,
      the tag set, or the allowed addresses). FAIL if it presents the spec as ready to
      deploy, or if it states a concrete subscription id or resource group name as
      chosen. Language and formatting do not matter; it is fine for the message to say
      that the region, subscription and resource group are parameters supplied at
      deploy time.
