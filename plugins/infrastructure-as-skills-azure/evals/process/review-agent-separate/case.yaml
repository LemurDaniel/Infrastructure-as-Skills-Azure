schema_version: "1.1"
name: review-agent-separate

# The sandbox cannot draw, so the picture is not checked; what a run shows is who is started:
# a review agent of its own, not a review the main session or a fix agent does for itself.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  - name: review-agent-started
    type: tool_used
    tool: Agent
    weight: 3
    input_match: '(?i)review'

  - name: no-code-before-signoff
    type: file_exists
    path: '**/*.tf'
    exists: false
    weight: 2

  - name: review-is-its-own-call
    type: llm
    weight: 3
    focus: trace
    criteria: |
      PASS if the main session started a review agent in an Agent call of its own, separate
      from whoever drew or edited the diagram, and the review brief names the diagram and the spec.
      FAIL if no Agent call is dedicated to the review, or if a brief only tells an agent to
      "use a review subagent" or to review its own picture.
