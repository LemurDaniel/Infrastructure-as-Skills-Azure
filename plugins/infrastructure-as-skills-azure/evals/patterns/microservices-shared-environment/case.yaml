schema_version: "1.1"
name: microservices-shared-environment

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  # The request describes the system, so the pattern is chosen and recorded.
  - name: pattern-recorded
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^pattern:\s*\n\s+id:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?container-microservices\b'
    flags: m

  # What the pattern answered says so.
  - name: source-pattern
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'source:\s*pattern\b'

  - name: first-service
    type: regex
    weight: 1
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^  container-apps__api:'
    flags: m

  - name: second-service
    type: regex
    weight: 1
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^  container-apps__worker:'
    flags: m

  # One environment for both: the second service joins the first one's.

  - name: shared-environment
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'hosting_environment:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?shared\b'
    flags: m

  - name: shares-with-the-first
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'shared_environment_with:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?(?:#[^\n]*\s*)*(?:\{\s*)?resource:\s*\W?container-apps__api\b'
    flags: m

  # second_service: background_worker - it has no entry at all.

  - name: worker-without-ingress
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^  container-apps__worker:[\s\S]*?\n    ingress:\s*\n\s+ingress:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?none\b'
    flags: m

  # An identity each, and each pulls its image with it.

  - name: pull-role-first
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?user-assigned-identity__api\W?\s*\n\s+to:\s*\W?container-registry\W?\s*\n\s+role:\s*\W?AcrPull\b'
    flags: m

  - name: pull-role-second
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?user-assigned-identity__worker\W?\s*\n\s+to:\s*\W?container-registry\W?\s*\n\s+role:\s*\W?AcrPull\b'
    flags: m

  - name: no-call-into-the-worker
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?container-apps__api\W?\s*\n\s+to:\s*\W?container-apps__worker\b'
    flags: m
    match: not_contains

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.tf'
    exists: false

  - name: no-bicep-before-confirmation
    type: file_exists
    path: '**/*.bicep'
    exists: false
