schema_version: "1.1"
name: webapp-departure-wins

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  # The request describes the system, so the pattern is chosen and recorded.
  - name: pattern-recorded
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^pattern:\s*\n\s+id:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?private-webapp\b'
    flags: m

  # What the pattern answered says so.
  - name: source-pattern
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'source:\s*pattern\b'

  - name: database-is-postgresql
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^  postgresql-flexible-server:'
    flags: m

  - name: no-second-database
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^  sql-database:'
    flags: m
    match: not_contains

  - name: file-storage
    type: regex
    weight: 1
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^  storage-account:'
    flags: m

  # The customer said the application only reads the files: their word wins over the
  # pattern's Contributor role, and the changed list no longer carries the pattern's name.
  # Only a `role:` value counts - the departure's reason may name the role it replaces.

  - name: reader-role
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?app-service__web\W?\s*[,\n]\s*to:\s*\W?storage-account\W?\s*[,\n]\s*role:\s*\W?Storage Blob Data Reader\b'
    flags: m

  - name: no-contributor-role
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^[^#\n]*\brole:\s*\W?Storage Blob Data Contributor\b'
    flags: m
    match: not_contains

  - name: roles-not-sourced-pattern
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^  role_assignments:\s*\n(?:    .*\n)*?    source:\s*pattern\b'
    flags: m
    match: not_contains

  # No company sign-in was asked for: no vault, no secret.

  - name: no-vault
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^  key-vault:'
    flags: m
    match: not_contains

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.tf'
    exists: false

  - name: no-bicep-before-confirmation
    type: file_exists
    path: '**/*.bicep'
    exists: false
