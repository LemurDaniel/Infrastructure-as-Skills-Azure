schema_version: "1.1"
name: language-de-request

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  - name: language-is-de
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'language:\s*(?:#[^\n]*\s*)*[''"]?de\b'

  # The customer-facing text of the spec (wiring labels, purposes, open items) follows the
  # customer's language; keys, values and `why` stay English.
  - name: german-customer-text
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    flags: i
    pattern: '\b(zugriff|liest|schreibt|ruft|speicher|anwendung|benutzer|nachricht|mitarbeiter|dokumente|antworten)\b'

  - name: final-message-german
    type: llm
    weight: 3
    focus: last_message
    criteria: |
      The user wrote in German. PASS if the final message is written in German. FAIL if
      it, or any question or option text in it, is written in English instead. Product
      names, resource types and code identifiers do not count; formatting does not matter.
