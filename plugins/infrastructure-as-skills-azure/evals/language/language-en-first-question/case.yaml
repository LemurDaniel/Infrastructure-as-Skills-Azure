schema_version: "1.1"
name: language-en-first-question

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  # Headless, the interview's first message is prose and not an AskUserQuestion call, so the
  # grader reads the final message: the target question must be there, in English.
  - name: target-question-asked
    type: llm
    weight: 3
    focus: last_message
    criteria: |
      PASS if the final message asks the user whether the infrastructure is written in
      Terraform or Bicep (or says that it was already decided). FAIL if it never raises
      the choice. Language and formatting do not matter.

  # German function words and umlauts in the final message: deterministic, free, and a failure
  # names the word. Checked on 194 kept messages: every German one hit, every English one clean -
  # including the three the llm judge below had failed. The judge stays as a second opinion.
  - name: no-german-words
    type: regex
    weight: 5
    target: last_message
    flags: i
    pattern: '\b(?:und|oder|nicht|bitte|welche[rsmn]?|soll(?:en|te)?|werden|wird|ihr|eure?[rsmn]?|euch|Sie|wir|ist|sind|mit|für|über|keine?[nrms]?)\b|[äöüß]'
    match: not_contains

  - name: no-german-question
    type: llm
    weight: 2
    focus: last_message
    criteria: |
      The user wrote in English. PASS if nothing the final message says, asks or lists is
      German - questions, option labels, descriptions, headings. FAIL only if any of it is
      German (for example "In welcher Sprache", "Geprüfte Bausteine", "Herstellerunabhängig",
      "Passt das so") or a mix of both. A message that asks no question at all passes if it
      is entirely English. Product names and code identifiers do not count; formatting does
      not matter.
