# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
schema_version: 1
resource: Microsoft.Sql/managedInstances

modules:
  terraform: [Azure/avm-res-sql-managedinstance/azurerm]
  bicep: [avm/res/sql/managed-instance]

# The Azure resources besides `resource` the render creates for this set; an import adopts
# them by id (adopt.parts). Format: core/iac-rendering/references/render-map.md.
import_parts: [Microsoft.Network/privateEndpoints]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the instance
  placement.location:
    terraform_avm: { attribute: location, passthrough: true }
    terraform: { attribute: location, passthrough: true }
    bicep_avm: { attribute: location, passthrough: true }
    bicep: { attribute: location, passthrough: true }
    import: {path: location, passthrough: true}
  placement.resource_group_name:
    terraform_avm: { attribute: resource_group_name, note: azurerm-based module - the root cannot be on azurerm 5.x }
    terraform: { attribute: resource_group_name }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }
    import: {todo: 'bicep renders it as a gap: the deployment''s resource group scope; no property'}

  # ----------------------------------------------------------------- instance
  instance.service_tier:
    terraform_avm:
      attribute: sku_name
      values: { GeneralPurpose: GP_, BusinessCritical: BC_ }
      part_of: instance.hardware_family
      note: the prefix of one string that carries tier and hardware (GP_Gen5)
    terraform:
      attribute: sku_name
      values: { GeneralPurpose: GP_, BusinessCritical: BC_ }
      part_of: instance.hardware_family
      note: the prefix of sku_name
    bicep_avm:
      attribute: skuName
      values: { GeneralPurpose: GP_, BusinessCritical: BC_ }
      part_of: instance.hardware_family
      also:
        GeneralPurpose: "skuTier: 'GeneralPurpose'"
        BusinessCritical: "skuTier: 'BusinessCritical'"
      note: three parameters (skuTier, skuName, hardwareFamily); module defaults GeneralPurpose / GP_Gen5 / Gen5 - written anyway
    bicep:
      attribute: sku.name
      values: { GeneralPurpose: GP_, BusinessCritical: BC_ }
      part_of: instance.hardware_family
      also:
        GeneralPurpose: "sku.tier: 'GeneralPurpose'"
        BusinessCritical: "sku.tier: 'BusinessCritical'"
    import: {todo: a piece of instance.hardware_family; read back with it}
  instance.hardware_family:
    terraform_avm:
      attribute: sku_name
      values: { standard_series: Gen5, premium_series: Gen8IM, premium_series_memory_optimized: Gen8IH }
      format: '{instance.service_tier}{value}'
      note: GP_Gen5, GP_Gen8IM, BC_Gen8IH
    terraform:
      attribute: sku_name
      values: { standard_series: Gen5, premium_series: Gen8IM, premium_series_memory_optimized: Gen8IH }
      format: '{instance.service_tier}{value}'
    bicep_avm:
      attribute: skuName
      values: { standard_series: Gen5, premium_series: Gen8IM, premium_series_memory_optimized: Gen8IH }
      format: '{instance.service_tier}{value}'
      also:
        standard_series: "hardwareFamily: 'Gen5'"
        premium_series: "hardwareFamily: 'Gen8IM'"
        premium_series_memory_optimized: "hardwareFamily: 'Gen8IH'"
    bicep:
      attribute: sku.name
      values: { standard_series: Gen5, premium_series: Gen8IM, premium_series_memory_optimized: Gen8IH }
      format: '{instance.service_tier}{value}'
      also:
        standard_series: "sku.family: 'Gen5'"
        premium_series: "sku.family: 'Gen8IM'"
        premium_series_memory_optimized: "sku.family: 'Gen8IH'"
    import: {todo: a composed or computed literal; needs its own reading}
  instance.vcores:
    terraform_avm: { attribute: vcores, passthrough: true, note: required; the allowed list per hardware is in the question's why }
    terraform: { attribute: vcores, passthrough: true }
    bicep_avm: { attribute: vCores, passthrough: true, note: default 4; written anyway }
    bicep: { attribute: properties.vCores, passthrough: true, note: and sku.capacity }
    import: {path: properties.vCores, passthrough: true}
  instance.storage_gb:
    terraform_avm: { attribute: storage_size_in_gb, passthrough: true, note: required; a multiple of 32 }
    terraform: { attribute: storage_size_in_gb, passthrough: true }
    bicep_avm: { attribute: storageSizeInGB, passthrough: true, note: default 32; a multiple of 32; written anyway }
    bicep: { attribute: properties.storageSizeInGB, passthrough: true }
    import: {path: properties.storageSizeInGB, passthrough: true}
  instance.license_type:
    terraform_avm: { attribute: license_type, passthrough: true, note: required - no module default }
    terraform: { attribute: license_type, passthrough: true }
    bicep_avm: { attribute: licenseType, passthrough: true, note: default LicenseIncluded; written anyway }
    bicep: { attribute: properties.licenseType, passthrough: true }
    import: {path: properties.licenseType, passthrough: true}
  instance.collation:
    terraform_avm: { attribute: collation, passthrough: true, note: fixed at creation }
    terraform: { attribute: collation, passthrough: true }
    bicep_avm: { attribute: collation, passthrough: true, note: fixed at creation }
    bicep: { attribute: properties.collation, passthrough: true }
    import: {path: properties.collation, passthrough: true}
  instance.timezone:
    terraform_avm: { attribute: timezone_id, passthrough: true, note: fixed at creation }
    terraform: { attribute: timezone_id, passthrough: true }
    bicep_avm: { attribute: timezoneId, passthrough: true, note: fixed at creation }
    bicep: { attribute: properties.timezoneId, passthrough: true }
    import: {path: properties.timezoneId, passthrough: true}
  instance.maintenance_window:
    terraform_avm:
      attribute: maintenance_configuration_name
      values:
        system_managed: SQL_Default
        weekday_nights: { expr: '"SQL_<Region>_MI_1"' }
        weekend_nights: { expr: '"SQL_<Region>_MI_2"' }
      note: <Region> is the location spelt without spaces (SQL_WestEurope_MI_1); check az sql mi list-maintenance-configurations
    terraform:
      attribute: maintenance_configuration_name
      values:
        system_managed: SQL_Default
        weekday_nights: { expr: '"SQL_<Region>_MI_1"' }
        weekend_nights: { expr: '"SQL_<Region>_MI_2"' }
      note: <Region> is the location spelt without spaces
    bicep_avm:
      attribute: maintenanceWindow
      values: { system_managed: SystemManaged, weekday_nights: Custom1, weekend_nights: Custom2 }
      note: the module resolves the region's configuration id
    bicep:
      gap: the authored rendering names properties.maintenanceConfigurationId but neither the id nor how it is resolved from the answer
    import: {todo: 'bicep renders it as a gap: the authored rendering names properties.maintenanceConfigura...'}
  instance.databases:
    terraform_avm: { attribute: 'databases.<key>.name', note: the map key is arbitrary }
    terraform: { attribute: azurerm_mssql_managed_database.name, note: one resource per database }
    bicep_avm: { attribute: 'databases[].name' }
    bicep: { attribute: child databases name, note: one child per database }
    import: {todo: 'not in the Resource Graph row: child databases name'}

  # --------------------------------------------------------------- resilience
  resilience.zone_redundant:
    terraform_avm: { attribute: zone_redundant_enabled, passthrough: true, note: module default true; written anyway }
    terraform: { attribute: zone_redundant_enabled, passthrough: true }
    bicep_avm: { attribute: zoneRedundant, passthrough: true, note: module default false - always written }
    bicep: { attribute: properties.zoneRedundant, passthrough: true }
    import: {path: properties.zoneRedundant, passthrough: true}
  resilience.geo_failover_region:
    terraform_avm:
      gap: not one call - a second instance of the module with dns_zone_partner_id and failover_group on the primary
    terraform:
      gap: a second azurerm_mssql_managed_instance in that region with dns_zone_partner_id, and an azurerm_mssql_managed_instance_failover_group binding both; the two subnets need connectivity
    bicep_avm:
      gap: not one call - a second instance with dnsZonePartnerResourceId and an authored Microsoft.Sql/locations/instanceFailoverGroups
    bicep:
      gap: a second instance in that region with properties.dnsZonePartner, and a Microsoft.Sql/locations/instanceFailoverGroups naming both; shape from the ARM reference
    import: {todo: 'bicep renders it as a gap: a second instance in that region with properties.dnsZonePart...'}

  # --------------------------------------------------------------- networking
  networking.subnet:
    terraform_avm: { attribute: subnet_id, note: required; fixed at creation }
    terraform: { attribute: subnet_id }
    bicep_avm: { attribute: subnetResourceId, note: required; fixed at creation }
    bicep: { attribute: properties.subnetId }
    import: {todo: a list or a reference; needs its own reading}
  networking.public_data_endpoint:
    terraform_avm:
      attribute: public_data_endpoint_enabled
      values: { disabled: false, enabled_with_firewall: true, enabled: true }
      also: { enabled_with_firewall: 'resource "azurerm_network_security_rule" (TCP 3342 from ip_rules) on the subnet NSG' }
      note: a bool; default false; written anyway
    terraform:
      attribute: public_data_endpoint_enabled
      values: { disabled: false, enabled_with_firewall: true, enabled: true }
      also: { enabled_with_firewall: 'resource "azurerm_network_security_rule" (TCP 3342 from ip_rules) on the subnet NSG' }
    bicep_avm:
      attribute: publicDataEndpointEnabled
      values: { disabled: false, enabled_with_firewall: true, enabled: true }
      also: { enabled_with_firewall: a securityRules entry (TCP 3342 from ip_rules) on the subnet NSG }
      note: a bool; default false; written anyway
    bicep:
      attribute: properties.publicDataEndpointEnabled
      values: { disabled: false, enabled_with_firewall: true, enabled: true }
      also: { enabled_with_firewall: a securityRules entry (TCP 3342 from ip_rules) on the subnet NSG }
    import: {todo: answers share the literal True; needs cases over a second path}
  networking.ip_rules:
    terraform_avm:
      gap: not the module - azurerm_network_security_rule for TCP 3342 on the subnet's NSG; an open entry when the platform owns the NSG
    terraform:
      attribute: azurerm_network_security_rule.source_address_prefixes
      note: "one inbound rule for TCP 3342 on the subnet NSG, only when this deployment owns it (source: azurerm 5.12 schema)"
    bicep_avm:
      gap: not the module - a securityRules entry (TCP 3342) on the subnet's NSG; an open entry when the platform owns the NSG
    bicep:
      attribute: Microsoft.Network/networkSecurityGroups/securityRules properties.sourceAddressPrefixes
      note: "one inbound rule for TCP 3342 on the subnet NSG, only when this deployment owns it (source: bicep build, Microsoft.Network/networkSecurityGroups/securityRules@2024-05-01)"
    import: {todo: 'not in the Resource Graph row: Microsoft.Network/networkSecurityGroups/securityRules pr...'}
  networking.private_endpoint:
    terraform_avm:
      attribute: private_endpoints
      values:
        true: { expr: '{ mi = { name = <private endpoint name>, subnet_resource_id = {networking.private_endpoint_subnet} } }' }
        false: { expr: '{}' }
      note: the module fixes the sub-resource managedInstance
    terraform:
      attribute: azurerm_private_endpoint.private_service_connection.subresource_names
      values: { true: { expr: '["managedInstance"]' }, false: null }
      note: false renders no endpoint
    bicep_avm:
      gap: module README 0.5.1 has no privateEndpoints parameter - an authored Microsoft.Network/privateEndpoints on the instance id with groupIds ['managedInstance']
    bicep:
      attribute: Microsoft.Network/privateEndpoints properties.privateLinkServiceConnections[].properties.groupIds
      values: { true: { expr: "['managedInstance']" }, false: null }
      note: on instance.id; false renders no endpoint
    import: {todo: 'not in the Resource Graph row: Microsoft.Network/privateEndpoints properties.privateLin...'}
  networking.private_endpoint_subnet:
    terraform_avm:
      attribute: 'private_endpoints.<key>.subnet_resource_id'
      note: private_endpoints_manage_dns_zone_group = false under policy DNS
    terraform: { attribute: azurerm_private_endpoint.subnet_id, note: "(source: azurerm 5.12 schema)" }
    bicep_avm:
      gap: no module parameter - the subnet of the authored Microsoft.Network/privateEndpoints; no privateDnsZoneGroup under policy DNS
    bicep: { attribute: Microsoft.Network/privateEndpoints properties.subnet.id, note: "(source: bicep build, Microsoft.Network/privateEndpoints@2025-01-01)" }
    import: {todo: 'not in the Resource Graph row: Microsoft.Network/privateEndpoints properties.subnet.id'}
  networking.connection_type:
    terraform_avm: { attribute: proxy_override, passthrough: true, note: module default Default - always written }
    terraform: { attribute: proxy_override, passthrough: true }
    bicep_avm: { attribute: proxyOverride, passthrough: true, note: module default Proxy - always written }
    bicep: { attribute: properties.proxyOverride, passthrough: true }
    import: {path: properties.proxyOverride, passthrough: true}
  networking.minimum_tls_version:
    terraform_avm: { attribute: minimum_tls_version, passthrough: true }
    terraform: { attribute: minimum_tls_version, passthrough: true }
    bicep_avm: { attribute: minimalTlsVersion, passthrough: true }
    bicep: { attribute: properties.minimalTlsVersion, passthrough: true }
    import: {path: properties.minimalTlsVersion, passthrough: true}

  # ----------------------------------------------------------------- identity
  identity.managed_identity:
    terraform_avm:
      attribute: managed_identities
      values:
        system_assigned: { expr: '{ system_assigned = true }' }
        user_assigned: { expr: '{ user_assigned_resource_ids = {identity.user_assigned_identity_ids} }' }
      note: the module patches the identities through azapi after creation
    terraform:
      attribute: identity.type
      values: { system_assigned: SystemAssigned, user_assigned: UserAssigned }
    bicep_avm:
      attribute: managedIdentities
      values:
        system_assigned: { expr: '{ systemAssigned: true }' }
        user_assigned: { expr: '{ userAssignedResourceIds: {identity.user_assigned_identity_ids} }' }
      also: { user_assigned: 'primaryUserAssignedIdentityResourceId: <first user_assigned_identity_id>' }
      note: the primary id is required with a user-assigned identity
    bicep:
      attribute: identity.type
      values: { system_assigned: SystemAssigned, user_assigned: UserAssigned }
      also: { user_assigned: 'properties.primaryUserAssignedIdentityId: <first user_assigned_identity_id>' }
    import: {path: identity.type, values: {SystemAssigned: system_assigned, UserAssigned: user_assigned}}
  identity.user_assigned_identity_ids:
    terraform_avm: { attribute: managed_identities.user_assigned_resource_ids }
    terraform: { attribute: identity.identity_ids }
    bicep_avm: { attribute: managedIdentities.userAssignedResourceIds, note: and primaryUserAssignedIdentityResourceId }
    bicep: { attribute: identity.userAssignedIdentities, note: 'an object keyed by each id - not the list; and properties.primaryUserAssignedIdentityId' }
    import: {todo: a list or a reference; needs its own reading}
  identity.entra_admin:
    terraform_avm:
      attribute: active_directory_administrator.object_id
      note: the group's object id; login_username its name, principal_type = "Group" and tenant_id beside it
    terraform:
      attribute: azuread_administrator.object_id
      note: the group's object id; login_username its name, principal_type and tenant_id beside it
    bicep_avm:
      attribute: administrators.sid
      note: "the group's object id; login its name, principalType: 'Group' and tenantId beside it"
    bicep:
      attribute: properties.administrators.sid
      note: "the group's object id; login its name, administratorType: 'ActiveDirectory', principalType and tenantId beside it"
    import: {todo: a list or a reference; needs its own reading}
  identity.database_users:
    not_rendered: a T-SQL step after the deployment from inside the network (CREATE LOGIN FROM EXTERNAL PROVIDER, then users and roles); no module input and no ARM resource
  identity.role_assignments:
    terraform_avm: { attribute: role_assignments, note: control plane }
    terraform: { attribute: azurerm_role_assignment, note: "scope = the instance id; control plane (source: azurerm 5.12 schema)" }
    bicep_avm: { attribute: roleAssignments, note: control plane }
    bicep: { attribute: Microsoft.Authorization/roleAssignments, note: "scope the instance; control plane (source: bicep build, Microsoft.Authorization/roleAssignments@2022-04-01)" }
    import: {todo: 'not in the Resource Graph row: Microsoft.Authorization/roleAssignments'}

  # ----------------------------------------------------------------- security
  security.local_authentication_disabled:
    terraform_avm:
      attribute: active_directory_administrator.azuread_authentication_only_enabled
      passthrough: true
      note: administrator_login and password are still required by module and provider - a generated random_password, never output, never stored
    terraform:
      attribute: azuread_administrator.azuread_authentication_only_enabled
      passthrough: true
      note: administrator_login and password still required
    bicep_avm:
      attribute: administrators.azureADOnlyAuthentication
      passthrough: true
      note: no administratorLogin or password - the module makes the pair conditional on administrators being absent
    bicep: { attribute: properties.administrators.azureADOnlyAuthentication, passthrough: true, note: no administratorLogin }
    import: {path: properties.administrators.azureADOnlyAuthentication, passthrough: true}
  security.key_management:
    terraform_avm:
      attribute: transparent_data_encryption
      values:
        platform_managed: null
        customer_managed: { expr: '{ key_vault_key_id = {security.cmk_key_vault_key_id}, auto_rotation_enabled = true }' }
      note: omitted for platform_managed - the module renders the service-managed protector
    terraform:
      attribute: azurerm_mssql_managed_instance_transparent_data_encryption.key_vault_key_id
      values: { platform_managed: null, customer_managed: { expr: '{security.cmk_key_vault_key_id}' } }
      also: { customer_managed: auto_rotation_enabled = true }
    bicep_avm:
      attribute: keys
      values:
        platform_managed: null
        customer_managed: { expr: "[ { name: '<vault>_<key>_<version>', serverKeyType: 'AzureKeyVault', uri: {security.cmk_key_vault_key_id} } ]" }
      also: { customer_managed: "encryptionProtector: { serverKeyName: '<vault>_<key>_<version>', serverKeyType: 'AzureKeyVault', autoRotationEnabled: true }" }
      note: platform_managed renders neither keys nor encryptionProtector
    bicep:
      attribute: child keys uri
      values: { platform_managed: null, customer_managed: { expr: '{security.cmk_key_vault_key_id}' } }
      also: { customer_managed: child encryptionProtector/current naming the key }
      note: platform_managed renders neither child
    import: {todo: 'not in the Resource Graph row: child keys uri'}
  security.cmk_key_vault_key_id:
    terraform_avm: { attribute: transparent_data_encryption.key_vault_key_id, note: the versioned key URL }
    terraform: { attribute: azurerm_mssql_managed_instance_transparent_data_encryption.key_vault_key_id }
    bicep_avm:
      attribute: 'keys[].uri'
      note: the versioned key URI; keys[].name and encryptionProtector.serverKeyName are <vault>_<key>_<version>, built from it
    bicep: { attribute: child keys uri }
    import: {todo: 'not in the Resource Graph row: child keys uri'}
  security.threat_detection:
    terraform_avm: { attribute: advanced_threat_protection_enabled, passthrough: true, note: default false; written anyway; security_alert_policy stays unset }
    terraform:
      attribute: azapi_resource Microsoft.Sql/managedInstances/advancedThreatProtectionSettings state
      values: { true: Enabled, false: null }
      note: name Default (or azurerm_mssql_managed_instance_security_alert_policy); false renders no setting - the reference shows no off literal
    bicep_avm:
      gap: "not the module (securityAlertPolicy wants a storage account when enabled) - an authored advancedThreatProtectionSettings/Default with state: 'Enabled'"
    bicep:
      attribute: child advancedThreatProtectionSettings/Default properties.state
      values: { true: Enabled, false: null }
      note: false renders no child - the reference shows no off literal
    import: {todo: 'not in the Resource Graph row: child advancedThreatProtectionSettings/Default propertie...'}
  security.vulnerability_assessment:
    terraform_avm:
      attribute: vulnerability_assessment
      values:
        true: { expr: '{ storage_container_path = <storage container path>, recurring_scans = { enabled = true } }' }
        false: null
      note: classic form with storage_account_resource_id; the module grants the identity Storage Blob Data Contributor; both unset when off
    terraform:
      attribute: azurerm_mssql_managed_instance_vulnerability_assessment.storage_container_path
      values: { true: { expr: '<storage container path>' }, false: null }
      note: false renders no assessment resource
    bicep_avm:
      attribute: vulnerabilityAssessment
      values:
        true: { expr: "{ name: 'default', storageAccountResourceId: {security.vulnerability_assessment_storage_account}, createStorageRoleAssignment: true, recurringScans: { isEnabled: true } }" }
        false: null
      note: classic form; unset when off
    bicep:
      attribute: child vulnerabilityAssessments/default storageContainerPath
      values: { true: { expr: '<storage container path>' }, false: null }
      note: false renders no child
    import: {todo: 'not in the Resource Graph row: child vulnerabilityAssessments/default storageContainerPath'}
  security.vulnerability_assessment_storage_account:
    terraform_avm: { attribute: storage_account_resource_id }
    terraform: { gap: the authored resource takes a storage container path in that account - the table names no account id argument }
    bicep_avm: { attribute: vulnerabilityAssessment.storageAccountResourceId }
    bicep: { gap: the authored child takes storageContainerPath in that account - the table names no account id property }
    import: {todo: 'bicep renders it as a gap: the authored child takes storageContainerPath in that accoun...'}

  # ---------------------------------------------------------- data_protection
  data_protection.short_term_retention_days:
    terraform_avm: { attribute: 'databases.<key>.short_term_retention_days', passthrough: true }
    terraform: { attribute: azurerm_mssql_managed_database.short_term_retention_days, passthrough: true }
    bicep_avm: { attribute: 'databases[].backupShortTermRetentionPolicy.retentionDays', passthrough: true }
    bicep: { attribute: child databases/backupShortTermRetentionPolicies/default retentionDays, passthrough: true }
    import: {todo: 'not in the Resource Graph row: child databases/backupShortTermRetentionPolicies/default...'}
  data_protection.long_term_retention:
    terraform_avm:
      attribute: 'databases.<key>.long_term_retention_policy.weekly_retention'
      values: { none: null, three_months: P13W, one_year: P52W }
      note: ISO 8601; none renders no policy
    terraform:
      attribute: azurerm_mssql_managed_database.long_term_retention_policy.weekly_retention
      values: { none: null, three_months: P13W, one_year: P52W }
      note: none renders no policy block
    bicep_avm:
      attribute: 'databases[].backupLongTermRetentionPolicy.weeklyRetention'
      values: { none: null, three_months: P13W, one_year: P52W }
      note: none renders no policy
    bicep:
      attribute: child databases/backupLongTermRetentionPolicies/default weeklyRetention
      values: { none: null, three_months: P13W, one_year: P52W }
      note: none renders no child
    import: {todo: 'not in the Resource Graph row: child databases/backupLongTermRetentionPolicies/default...'}
  data_protection.backup_storage_redundancy:
    terraform_avm:
      attribute: storage_account_type
      values: { Local: LRS, Zone: ZRS, Geo: GRS }
      authored_when: [GeoZone]
      note: module default GRS - always written
    terraform:
      attribute: storage_account_type
      values: { Local: LRS, Zone: ZRS, Geo: GRS, GeoZone: GZRS }
      note: "provider default GRS - always written (source: azurerm 5.12 docs)"
    bicep_avm: { attribute: requestedBackupStorageRedundancy, passthrough: true, note: module default Geo - always written; all four values }
    bicep: { attribute: properties.requestedBackupStorageRedundancy, passthrough: true }
    import: {path: properties.requestedBackupStorageRedundancy, passthrough: true}

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm: { attribute: 'diagnostic_settings.<key>.workspace_resource_id' }
    terraform: { attribute: azurerm_monitor_diagnostic_setting.log_analytics_workspace_id }
    bicep_avm:
      attribute: 'diagnosticSettings[].workspaceResourceId'
      note: logs only - the authored metrics setting takes the same workspace
    bicep: { attribute: Microsoft.Insights/diagnosticSettings properties.workspaceId }
    import: {todo: 'not in the Resource Graph row: Microsoft.Insights/diagnosticSettings properties.workspa...'}
  observability.auditing_enabled:
    not_rendered: a T-SQL step after the deployment (CREATE SERVER AUDIT TO EXTERNAL_MONITOR); its log category SQLSecurityAuditEvents rides on diagnostic_categories
  observability.diagnostic_categories:
