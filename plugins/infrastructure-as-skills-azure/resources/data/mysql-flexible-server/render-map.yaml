# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
schema_version: 1
resource: Microsoft.DBforMySQL/flexibleServers

modules:
  terraform: [Azure/avm-res-dbformysql-flexibleserver/azurerm]
  bicep: [avm/res/db-for-my-sql/flexible-server]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the server
  placement.location:
    terraform_avm: { attribute: location, passthrough: true }
    terraform: { attribute: location, passthrough: true }
    bicep_avm: { attribute: location, passthrough: true }
    bicep: { attribute: location, passthrough: true }
  placement.resource_group_name:
    terraform_avm: { attribute: resource_group_name, note: azurerm-based module - the root cannot be on azurerm 5.x }
    terraform: { attribute: resource_group_name }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }

  # ------------------------------------------------------------------- server
  server.mysql_version:
    terraform_avm: { attribute: mysql_version, passthrough: true, note: 'a string ("8.4")' }
    terraform: { attribute: version, passthrough: true }
    bicep_avm: { attribute: version, passthrough: true, note: "allowed '5.7', '8.0.21', '8.4', '9.3'; module default 8.0.21 - always written" }
    bicep: { attribute: properties.version, passthrough: true }
  server.compute_tier:
    terraform_avm:
      attribute: sku_name
      values: { burstable: B_, general_purpose: GP_, memory_optimized: MO_ }
      part_of: server.sku_name
      note: the tier is the prefix of sku_name (GP_Standard_D2ds_v4) - no input of its own
    terraform:
      attribute: sku_name
      values: { burstable: B_, general_purpose: GP_, memory_optimized: MO_ }
      part_of: server.sku_name
      note: the prefix of sku_name
    bicep_avm:
      gap: "tier - 'Burstable' and 'GeneralPurpose' in the reference; it states no literal for memory_optimized. Must agree with skuName; both required"
    bicep:
      gap: "sku.tier - 'Burstable' and 'GeneralPurpose' in the reference; it states no literal for memory_optimized"
  server.sku_name:
    terraform_avm:
      attribute: sku_name
      format: '{server.compute_tier}{value}'
      note: 'behind the tier prefix: "GP_Standard_D2ds_v4"'
    terraform:
      attribute: sku_name
      format: '{server.compute_tier}{value}'
      note: behind the tier prefix
    bicep_avm: { attribute: skuName, passthrough: true, note: "the size without a tier prefix ('Standard_D2ds_v4'); must agree with tier" }
    bicep: { attribute: sku.name, passthrough: true }
  server.storage_size_gb:
    terraform_avm: { attribute: storage.size_gb, passthrough: true, note: gigabytes; module default null (the provider's); written anyway }
    terraform: { attribute: storage.size_gb, passthrough: true }
    bicep_avm: { attribute: storageSizeGB, passthrough: true, note: only the listed sizes; default 64; written anyway }
    bicep: { attribute: properties.storage.storageSizeGB, passthrough: true }
  server.storage_auto_grow:
    terraform_avm: { attribute: storage.auto_grow_enabled, passthrough: true }
    terraform: { attribute: storage.auto_grow_enabled, passthrough: true }
    bicep_avm:
      attribute: storageAutoGrow
      values: { true: Enabled, false: Disabled }
      note: module default Disabled - always written
    bicep:
      attribute: properties.storage.autoGrow
      values: { true: Enabled, false: Disabled }
  server.databases:
    terraform_avm: { attribute: 'databases.<key> = { name, charset, collation }', note: all three required }
    terraform: { gap: one azurerm_mysql_flexible_database per entry; the authored rendering names no argument }
    bicep_avm: { attribute: 'databases[] = { name, charset, collation }' }
    bicep: { gap: one child databases per entry; the authored rendering names no property }

  # --------------------------------------------------------------- resilience
  resilience.high_availability:
    terraform_avm:
      attribute: high_availability
      values:
        disabled: { expr: 'null' }
        same_zone: { expr: '{ mode = "SameZone" }' }
        zone_redundant: { expr: '{ mode = "ZoneRedundant" }' }
      note: module default ZoneRedundant - always written; null on burstable compute
    terraform:
      attribute: high_availability.mode
      values: { disabled: null, same_zone: SameZone, zone_redundant: ZoneRedundant }
      note: disabled renders no high_availability block
    bicep_avm:
      attribute: highAvailability
      values: { disabled: Disabled, same_zone: SameZone, zone_redundant: ZoneRedundant }
      note: module default ZoneRedundant; Disabled on burstable
    bicep:
      attribute: properties.highAvailability.mode
      values: { disabled: Disabled, same_zone: SameZone, zone_redundant: ZoneRedundant }
  resilience.maintenance_window:
    terraform_avm:
      gap: 'maintenance_window = { day_of_week, start_hour, start_minute }, parsed from the free-text answer ("Sunday 02:00 UTC" is day_of_week = "0", start_hour = 2, start_minute = 0 - day_of_week a string; module default day 0 only); no literal follows from the answer as it is'
    terraform:
      gap: maintenance_window { day_of_week, start_hour, start_minute }, parsed from the free-text answer; no literal follows from the answer as it is
    bicep_avm:
      gap: "maintenanceWindow = { customWindow: 'Enabled', dayOfWeek, startHour, startMinute }, parsed from the free-text answer (\"Sunday 02:00 UTC\" is dayOfWeek 0, startHour 2, startMinute 0 - ints); module default {}"
    bicep:
      gap: properties.maintenanceWindow, parsed from the free-text answer; the authored rendering names no sub-property

  # --------------------------------------------------------------- networking
  networking.private_connectivity:
    terraform_avm:
      attribute: delegated_subnet_id
      values: { private_endpoint: null, vnet_integration: { expr: '{networking.delegated_subnet}' } }
      also: { vnet_integration: 'private_dns_zone_id = {networking.private_dns_zone}' }
      note: private_endpoint renders private_endpoints with both ids unset - fixed at creation
    terraform:
      attribute: delegated_subnet_id
      values: { private_endpoint: null, vnet_integration: { expr: '{networking.delegated_subnet}' } }
      also: { vnet_integration: 'private_dns_zone_id = {networking.private_dns_zone}' }
      note: private_endpoint renders an azurerm_private_endpoint instead
    bicep_avm:
      attribute: delegatedSubnetResourceId
      values: { private_endpoint: null, vnet_integration: { expr: '{networking.delegated_subnet}' } }
      also: { vnet_integration: 'privateDnsZoneResourceId: {networking.private_dns_zone}' }
      note: private_endpoint renders privateEndpoints with both ids unset - fixed at creation
    bicep:
      attribute: properties.network.delegatedSubnetResourceId
      values: { private_endpoint: null, vnet_integration: { expr: '{networking.delegated_subnet}' } }
      also: { vnet_integration: 'properties.network.privateDnsZoneResourceId: {networking.private_dns_zone}' }
      note: private_endpoint renders a Microsoft.Network/privateEndpoints instead
  networking.public_network_access:
    terraform_avm:
      attribute: public_network_access
      values: { disabled: Disabled, enabled_with_firewall: Enabled, enabled: Enabled }
      note: a string here (a bool in the PostgreSQL module); default Disabled; written anyway
    terraform:
      attribute: public_network_access
      values: { disabled: Disabled, enabled_with_firewall: Enabled, enabled: Enabled }
    bicep_avm:
      attribute: publicNetworkAccess
      values: { disabled: Disabled, enabled_with_firewall: Enabled, enabled: Enabled }
      note: module default disabled; written anyway
    bicep:
      attribute: properties.network.publicNetworkAccess
      values: { disabled: Disabled, enabled_with_firewall: Enabled, enabled: Enabled }
  networking.private_endpoint_subnet:
    terraform_avm:
      attribute: 'private_endpoints.mysql.subnet_resource_id'
      note: with subresource_name = "mysqlServer"; private_endpoints_manage_dns_zone_group = false under policy DNS
    terraform: { gap: 'an azurerm_private_endpoint with subresource_names = ["mysqlServer"]; the authored rendering names no subnet argument' }
    bicep_avm:
      attribute: 'privateEndpoints[].subnetResourceId'
      note: "with service: 'mysqlServer'; no privateDnsZoneGroup under policy DNS"
    bicep: { gap: "a Microsoft.Network/privateEndpoints with groupIds: ['mysqlServer']; the authored rendering names no subnet property" }
  networking.delegated_subnet:
    terraform_avm: { attribute: delegated_subnet_id, note: fixed at creation }
    terraform: { attribute: delegated_subnet_id }
    bicep_avm: { attribute: delegatedSubnetResourceId, note: fixed at creation }
    bicep: { attribute: properties.network.delegatedSubnetResourceId }
  networking.private_dns_zone:
    terraform_avm: { attribute: private_dns_zone_id, note: fixed at creation }
    terraform: { attribute: private_dns_zone_id }
    bicep_avm: { attribute: privateDnsZoneResourceId, note: fixed at creation }
    bicep: { attribute: properties.network.privateDnsZoneResourceId }
  networking.ip_rules:
    terraform_avm:
      gap: "firewall_rules = { <key> = { start_ip_address, end_ip_address } }, one entry per range, merged with allow_azure_services; the answer's item shape (an address, a CIDR, a range) is not stated, so no expression maps it. Default {}; written anyway"
    terraform: { gap: one azurerm_mysql_flexible_server_firewall_rule per range; the authored rendering names no argument }
    bicep_avm:
      gap: "firewallRules: [ { name, startIpAddress, endIpAddress } ], one per range; the answer's item shape is not stated, so no expression maps it"
    bicep: { gap: one child firewallRules per range; the authored rendering names no property }
  networking.allow_azure_services:
    terraform_avm:
      attribute: firewall_rules
      values: { true: { expr: '{ <key> = { start_ip_address = "0.0.0.0", end_ip_address = "0.0.0.0" } }' }, false: null }
      note: one entry of the same map as ip_rules - merged, never a second firewall_rules; false adds no rule
    terraform:
      gap: an azurerm_mysql_flexible_server_firewall_rule from 0.0.0.0 to 0.0.0.0 for true, none for false; the authored rendering names no argument
    bicep_avm:
      attribute: 'firewallRules[]'
      values: { true: { expr: "{ name: <name>, startIpAddress: '0.0.0.0', endIpAddress: '0.0.0.0' }" }, false: null }
      note: one element of the same array as ip_rules; false adds none
    bicep:
      gap: a child firewallRules from 0.0.0.0 to 0.0.0.0 for true, none for false; the authored rendering names no property

  # ----------------------------------------------------------------- identity
  identity.user_assigned_identity_ids:
    terraform_avm: { attribute: managed_identities.user_assigned_resource_ids, note: always - Entra authentication runs through it }
    terraform: { attribute: identity.identity_ids, note: type = "UserAssigned" }
    bicep_avm: { attribute: managedIdentities.userAssignedResourceIds, note: user-assigned only; no system-assigned form }
    bicep: { attribute: identity.userAssignedIdentities, note: "type: 'UserAssigned'" }
  identity.entra_admin:
    terraform_avm:
      attribute: active_directory_administrator
      format: { expr: '{ login = <display name of {value}>, object_id = <object id of {value}>, tenant_id = var.tenant_id, identity_id = var.user_assigned_identity_id }' }
      note: an object filled from the group; identity_id defaults to the first identity
    terraform: { gap: an azurerm_mysql_flexible_server_active_directory_administrator; the authored rendering names no argument }
    bicep_avm:
      attribute: administrators
      format: { expr: '[ { identityResourceId: userAssignedIdentityId, login: <display name of {value}>, sid: <object id of {value}> } ]' }
    bicep: { gap: a child administrators; the authored rendering names no property }
  identity.database_users:
    not_rendered: a SQL step after the deployment (CREATE AADUSER and GRANT as the Entra administrator); no module input and no ARM resource
  identity.role_assignments:
    terraform_avm: { attribute: role_assignments, note: control plane }
    terraform: { gap: the authored rendering names no role assignment }
    bicep_avm: { attribute: roleAssignments, note: control plane }
    bicep: { gap: the authored rendering names no role assignment }

  # ----------------------------------------------------------------- security
  security.password_authentication_disabled:
    terraform_avm:
      gap: 'true is server_configuration.aad_auth_only = { name = "aad_auth_only", value = "ON" }; the reference states no literal for false (OFF, or the entry left out). The administrator login and a write-only password are still required at creation'
    terraform:
      gap: true is an azurerm_mysql_flexible_server_configuration aad_auth_only = ON; the reference states no literal for false
    bicep_avm:
      gap: "true is configurations[] { name: 'aad_auth_only', source: 'user-override', value: 'ON' }; the reference states no literal for false. The administrator login and a secure password are still required at creation"
    bicep:
      gap: true is a child configurations aad_auth_only = ON; the reference states no literal for false and the authored rendering names no property
  security.minimum_tls_version:
    terraform_avm:
      attribute: server_configuration.tls_version
      values:
        TLSv1.2: { expr: '{ name = "tls_version", value = "TLSv1.2,TLSv1.3" }' }
        TLSv1.3: { expr: '{ name = "tls_version", value = "TLSv1.3" }' }
      also:
        TLSv1.2: 'require_secure_transport = { name = "require_secure_transport", value = "ON" }'
        TLSv1.3: 'require_secure_transport = { name = "require_secure_transport", value = "ON" }'
      note: a list - not a minimum
    terraform:
      attribute: azurerm_mysql_flexible_server_configuration tls_version
      values: { TLSv1.2: 'TLSv1.2,TLSv1.3', TLSv1.3: TLSv1.3 }
      note: the parameter's value; the authored rendering names no argument beside it
    bicep_avm:
      attribute: 'configurations[]'
      values:
        TLSv1.2: { expr: "{ name: 'tls_version', source: 'user-override', value: 'TLSv1.2,TLSv1.3' }" }
        TLSv1.3: { expr: "{ name: 'tls_version', source: 'user-override', value: 'TLSv1.3' }" }
      also:
        TLSv1.2: "{ name: 'require_secure_transport', source: 'user-override', value: 'ON' }"
        TLSv1.3: "{ name: 'require_secure_transport', source: 'user-override', value: 'ON' }"
      note: a list - not a minimum
    bicep:
      attribute: child configurations tls_version
      values: { TLSv1.2: 'TLSv1.2,TLSv1.3', TLSv1.3: TLSv1.3 }
      note: the parameter's value; the authored rendering names no property of the child
  security.key_management:
    terraform_avm:
      attribute: customer_managed_key
      values:
        platform_managed: { expr: 'null' }
        customer_managed: { expr: '{ key_vault_key_id = {security.cmk_key_vault_key_id}, primary_user_assigned_identity_id = <user-assigned identity id> }' }
      note: versionless key id
    terraform:
      attribute: customer_managed_key
      values:
        platform_managed: null
        customer_managed: { expr: '{ key_vault_key_id = {security.cmk_key_vault_key_id}, primary_user_assigned_identity_id = <user-assigned identity id> }' }
      note: a block; absent for platform_managed
    bicep_avm:
      attribute: customerManagedKey
      values:
        platform_managed: null
        customer_managed: { expr: '{ keyVaultResourceId: <vault id of the key>, keyName: <key name>, userAssignedIdentityResourceId: <user-assigned identity id> }' }
      note: unversioned
    bicep: { gap: 'properties.dataEncryption for customer_managed, unset for platform_managed; the authored rendering names no sub-property' }
  security.cmk_key_vault_key_id:
    terraform_avm: { attribute: customer_managed_key.key_vault_key_id, note: versionless }
    terraform: { attribute: customer_managed_key.key_vault_key_id }
    bicep_avm:
      gap: the key id split into customerManagedKey.keyVaultResourceId (the vault's id) and keyName (the key's name), written in key_management's object; no single parameter takes the id
    bicep: { gap: properties.dataEncryption; the authored rendering names no sub-property }
  security.threat_protection:
    terraform_avm:
      gap: not a module input - an azapi_resource advancedThreatProtectionSettings child (name Default, body.properties.state = "Enabled" for true); the reference states no literal for false
    terraform:
      gap: azapi_resource advancedThreatProtectionSettings (name Default), body.properties.state = "Enabled" for true; the reference states no literal for false
    bicep_avm:
      gap: "advancedThreatProtection: 'Enabled' for true (the module default); the reference states no literal for false"
    bicep:
      gap: child advancedThreatProtectionSettings/Default; the reference states neither its property nor a literal for false

  # ---------------------------------------------------------- data_protection
  data_protection.backup_retention_days:
    terraform_avm: { attribute: backup_retention_days, passthrough: true }
    terraform: { attribute: backup_retention_days, passthrough: true }
    bicep_avm: { attribute: backupRetentionDays, passthrough: true, note: default 7; written anyway }
    bicep: { attribute: properties.backup.backupRetentionDays, passthrough: true }
  data_protection.geo_redundant_backup:
    terraform_avm: { attribute: geo_redundant_backup_enabled, passthrough: true, note: module default true - always written }
    terraform: { attribute: geo_redundant_backup_enabled, passthrough: true }
    bicep_avm:
      attribute: geoRedundantBackup
      values: { true: Enabled, false: Disabled }
      note: module default Enabled - always written
    bicep:
      attribute: properties.backup.geoRedundantBackup
      values: { true: Enabled, false: Disabled }

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm: { attribute: 'diagnostic_settings.<key>.workspace_resource_id' }
    terraform: { gap: an azurerm_monitor_diagnostic_setting; the authored rendering names no workspace argument }
    bicep_avm: { attribute: 'diagnosticSettings[].workspaceResourceId' }
    bicep: { gap: the authored rendering names no diagnostic setting }
  observability.audit_logging:
    terraform_avm:
      gap: 'true is server_configuration audit_log_enabled = { name = "audit_log_enabled", value = "ON" } and audit_log_events = { name = "audit_log_events", value = "CONNECTION" }, with the log category MySqlAuditLogs; the reference states no literal for false'
    terraform:
      gap: true is an azurerm_mysql_flexible_server_configuration audit_log_enabled = ON and the category MySqlAuditLogs; the reference states no literal for false
    bicep_avm:
      gap: "true is configurations[] { name: 'audit_log_enabled', source: 'user-override', value: 'ON' } and { name: 'audit_log_events', source: 'user-override', value: 'CONNECTION' }, with the category MySqlAuditLogs; the reference states no literal for false"
    bicep:
      gap: true is a child configurations audit_log_enabled = ON; the reference states no literal for false and the authored rendering names no property
  observability.diagnostic_categories:
    terraform_avm: { attribute: 'diagnostic_settings.<key>.log_categories', note: 'log_groups = [] beside it' }
    terraform: { attribute: azurerm_monitor_diagnostic_setting.enabled_log.category }
    bicep_avm: { attribute: 'diagnosticSettings[].logCategoriesAndGroups[].category' }
    bicep: { gap: the authored rendering names no diagnostic setting }
  observability.metrics_enabled:
    terraform_avm:
      attribute: 'diagnostic_settings.<key>.metric_categories'
      values: { true: { expr: '["AllMetrics"]' }, false: { expr: '[]' } }
    terraform: { gap: the authored rendering names no metric category }
    bicep_avm:
      attribute: 'diagnosticSettings[].metricCategories'
      values: { true: { expr: "[ { category: 'AllMetrics' } ]" }, false: { expr: '[]' } }
    bicep: { gap: the authored rendering names no diagnostic setting }
