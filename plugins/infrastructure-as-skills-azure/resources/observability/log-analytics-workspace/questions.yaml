schema_version: 1

resource: Microsoft.OperationalInsights/workspaces
title: Azure Log Analytics Workspace

naming:
  terraform: "Azure::Microsoft.OperationalInsights/workspaces"
  bicep: "Microsoft.OperationalInsights/workspaces"
  abbreviation: "log"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create the diagnostic settings on other resources. Each resource renders its own, pointing here."
  - "Does not create alerts, action groups or workbooks."
  - "Reached only when deployment.observability_ownership is `create`. Otherwise a workspace is referenced, not generated."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name and the retention and access defaults below.
        renders: naming parameter `environment`

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          Logs are stored in the workspace's region, which is a data-residency
          statement as much as a latency one. Cross-region ingestion works and
          carries egress cost.
        renders: location

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        ref: resource_group
        required: true
        from_context: true
        per_environment: true
        why: >
          A workspace normally outlives the workloads reporting into it, which
          argues for a platform resource group rather than the application's — and
          for the deletion lock that usually comes with one.
        renders: resource_group_name / scope

  # ------------------------------------------------------------------- cost
  - id: cost
    title: Retention and cost
    questions:
      - id: retention_days
        ask: How long should logs be retained?
        type: int
        plain:
          en: "Logs are kept for {value} days."
          de: "Logs werden {value} Tage aufbewahrt."
        from_deployment: log_retention_days
        non_production_default: 30
        why: >
          Inherited from the deployment set, per stage: a stated retention holds in
          every stage, an unstated one is 30 outside production while the savings
          are on. 30 days covers incident investigation,
          which is what most logs are for; longer is an audit or regulatory
          requirement rather than an operational one. The first 31 days are
          included in the ingestion price, so 30 is also where the retention line
          item starts.
        renders: retention_in_days / properties.retentionInDays

      - id: daily_quota_gb
        ask: Should ingestion be capped per day?
        type: int
        plain:
          en: "Daily log intake cap: {value} GB (-1: no cap)."
          de: "Tägliche Obergrenze für Logs: {value} GB (-1: keine)."
        from_deployment: daily_quota_gb
        confirm_in: [production]
        why: >
          Inherited, next to retention: both are the cost screws on this
          workspace, and a deployment that owns its logging owns the bill. Asked a
          level apart, one gets answered and the other forgotten. -1 means no cap;
          a cap drops logs for the rest of the day once hit.
        renders: daily_quota_gb / properties.workspaceCapping.dailyQuotaGb

      - id: sku
        ask: Which pricing tier?
        type: enum
        plain:
          en: "Billed {value}."
          de: "Abgerechnet {value}."
        plain_values:
          PerGB2018: { en: "per gigabyte, pay as you go", de: "pro Gigabyte, nach Verbrauch" }
          CapacityReservation: { en: "at a reserved daily volume, cheaper at high volume", de: "zu einem reservierten Tagesvolumen, günstiger bei hohem Volumen" }
        values: [PerGB2018, CapacityReservation]
        default: PerGB2018
        why: >
          PerGB2018 is pay-as-you-go and correct until the volume is predictable. A
          capacity reservation is cheaper per gigabyte above roughly 100 GB/day and
          is a commitment — it bills the reserved tier whether the data arrives or
          not, so it follows measurement rather than estimation.
        renders: sku / properties.sku.name

  # ----------------------------------------------------------------- access
  - id: access
    title: Access
    questions:
      - id: public_network_access
        ask: Should the workspace be reachable from the internet?
        type: enum
        plain:
          en: "The log workspace is {value}."
          de: "Der Log-Arbeitsbereich ist {value}."
        plain_values:
          disabled: { en: "reachable only through the platform's private link scope", de: "nur über den privaten Zugang der Plattform erreichbar" }
          enabled: { en: "reachable from the internet, with company accounts and encryption - there is no private link scope to go through", de: "aus dem Internet erreichbar, mit Firmenkonten und Verschlüsselung; einen privaten Zugang dafür gibt es nicht" }
        values: [disabled, enabled]
        default: enabled
        confirm_in: [production]
        why: >
          The one resource that does not simply inherit the private posture.
          `disabled` needs an Azure Monitor Private Link Scope (AMPLS) - not a
          private endpoint on the workspace - and an AMPLS is tenant-wide
          infrastructure with real blast radius: it changes resolution for every
          agent in the networks linked to it, which is why a landing zone platform
          owns it and a deployment never creates one. This set is reached only
          when the deployment creates its workspace (observability_ownership:
          create), which is the standalone case where no AMPLS exists; `disabled`
          there is a workspace that accepts logs nobody can read. So `enabled` is
          the default: ingestion and query stay authenticated with Entra ID and
          encrypted, and the first render's eval run flagged the inherited
          `disabled` as unworkable. `disabled` is for a stated AMPLS the workspace
          joins. Query and ingestion are two separate switches, rendered together.
        renders: >
          internet_ingestion_enabled and internet_query_enabled /
          properties.publicNetworkAccessForIngestion and ...ForQuery

      - id: local_auth
        ask: Should workspace keys be usable for ingestion?
        type: bool
        plain:
          en: "Sending logs with the workspace key is {value}."
          de: "Logs mit dem Arbeitsbereichs-Schlüssel zu senden ist {value}."
        plain_values:
          true: { en: "possible", de: "möglich" }
          false: { en: "not possible - agents use company identities", de: "nicht möglich, Agenten nutzen Firmenidentitäten" }
        from_deployment: local_auth
        why: >
          The shared key is a bearer credential with ingestion rights and no
          expiry. Disabling it forces Entra ID, which the modern agents use
          anyway; the blocker is usually a legacy collector still posting with the
          workspace key.
        renders: local_authentication_disabled / properties.features.disableLocalAuth

      - id: rbac_only_access
        ask: Should data access be governed only by Azure RBAC?
        type: bool
        plain:
          en: "Who may read logs is decided {value}."
          de: "Wer Logs lesen darf, entscheiden {value}."
        plain_values:
          true: { en: "by the workspace's own permissions", de: "die Berechtigungen des Arbeitsbereichs selbst" }
          false: { en: "also by permissions on the resources that sent them", de: "auch die Berechtigungen auf den sendenden Ressourcen" }
        default: true
        why: >
          With this on, workspace permissions decide who reads which data instead
          of permissions inherited from the resources that emitted it. Off, a
          reader on a resource can query its logs here — convenient, and the
          reason people find data in a workspace they were never granted.
        renders: >
          local_authentication_disabled is separate; this is
          properties.features.enableLogAccessUsingOnlyResourcePermissions (inverted)

  # ------------------------------------------------------------- data export
  - id: data_protection
    title: Data protection
    questions:
      - id: immediate_purge_protection
        ask: Should the workspace keep its 14-day soft delete?
        type: bool
        plain:
          en: "A deleted workspace {value} be recovered for 14 days."
          de: "Ein gelöschter Arbeitsbereich {value} 14 Tage lang wiederhergestellt werden."
        plain_values:
          true: { en: "can", de: "kann" }
          false: { en: "cannot", de: "kann nicht" }
        default: true
        why: >
          A deleted workspace is recoverable for 14 days and its name stays
          reserved for that period. Keeping it is right; the cost is that a
          destroy-then-recreate cycle with the same name inside the window either
          fails or silently recovers the old workspace with its old data.
        renders: >
          terraform: the provider's permanently_delete_on_destroy (inverted);
          bicep: the forceDelete query parameter on deletion, not a template property

      - id: archive_to_storage
        ask: Should logs also be archived to a storage account?
        type: bool
        plain:
          en: "Long-term archiving to cheap storage is {value}."
          de: "Langzeitarchivierung in günstigen Speicher ist {value}."
        plain_values:
          true: { en: "on", de: "eingeschaltet" }
          false: { en: "off", de: "ausgeschaltet" }
        default: false
        why: >
          Long retention in a workspace is expensive per gigabyte-month; archival
          storage is an order of magnitude cheaper and is not queryable with KQL.
          Archive for an audit requirement that demands years of data nobody reads
          daily — and then alongside the workspace, never instead of it.
        renders: a diagnostic setting with a storage account destination
