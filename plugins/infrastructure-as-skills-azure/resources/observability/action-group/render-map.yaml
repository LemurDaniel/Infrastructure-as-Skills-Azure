# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
schema_version: 1
resource: Microsoft.Insights/actionGroups

modules:
  terraform: [Azure/avm-res-insights-actiongroup/azurerm]
  bicep: [avm/res/insights/action-group]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment`; no attribute of the group
  placement.location:
    terraform_avm: { gap: 'the module requires the literal location = "Global" (capitalised), not the answer; not read from the deployment region' }
    terraform: { attribute: location, passthrough: true, note: '"global"; optional on the resource' }
    bicep_avm: { attribute: location, passthrough: true, note: "module default 'global'; written anyway" }
    bicep: { attribute: location, passthrough: true, note: "'global'" }
  placement.resource_group_name:
    terraform_avm:
      attribute: parent_id
      note: the group's id, not its name - AzAPI-only module
    terraform: { attribute: resource_group_name, note: required by the provider schema; the reference's authored rendering omits it }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }

  # ------------------------------------------------------------- notification
  notification.short_name:
    terraform_avm:
      attribute: short_name
      format: { expr: 'substr(coalesce("{value}", var.workload), 0, 12)' }
      note: required, 1-12 characters; empty derives it from the workload
    terraform:
      attribute: short_name
      format: { expr: 'substr(coalesce("{value}", var.workload), 0, 12)' }
    bicep_avm:
      attribute: groupShortName
      format: { expr: "take(empty('{value}') ? workload : '{value}', 12)" }
      note: required
    bicep:
      attribute: properties.groupShortName
      format: { expr: "take(empty('{value}') ? workload : '{value}', 12)" }
  notification.on_call_email:
    terraform_avm:
      attribute: email_receivers.oncall.email_address
      passthrough: true
      note: the first entry, use_common_alert_schema = true
    terraform: { attribute: email_receiver.email_address, passthrough: true, note: 'the first email_receiver block, name "oncall"' }
    bicep_avm: { attribute: 'emailReceivers[0].emailAddress', passthrough: true, note: 'useCommonAlertSchema: true' }
    bicep: { attribute: 'properties.emailReceivers[0].emailAddress', passthrough: true }
  notification.email_receivers:
    terraform_avm:
      attribute: 'email_receivers.<key> = { name, email_address, use_common_alert_schema }'
      note: a map keyed by a stable key; name is the Azure-visible name
    terraform: { attribute: 'email_receiver { name, email_address, use_common_alert_schema }', note: repeated blocks }
    bicep_avm: { attribute: 'emailReceivers[] = { name, emailAddress, useCommonAlertSchema }' }
    bicep: { attribute: 'properties.emailReceivers[]' }
  notification.sms_receivers:
    terraform_avm:
      attribute: 'sms_receivers.<key> = { country_code, phone_number }'
      note: digits only; no schema switch
    terraform: { attribute: 'sms_receiver { name, country_code, phone_number }' }
    bicep_avm: { attribute: 'smsReceivers[] = { name, countryCode, phoneNumber }' }
    bicep: { attribute: 'properties.smsReceivers[]' }
  notification.webhook_receivers:
    terraform_avm:
      attribute: 'webhook_receivers.<key>.service_uri'
      note: from a sensitive variable or a data source, never a literal; Terraform >= 1.11 (write-only sensitive_body)
    terraform:
      attribute: 'webhook_receiver { name, service_uri, use_common_alert_schema }'
      note: the authored resource stores the URL in state in plaintext
    bicep_avm: { attribute: 'webhookReceivers[].serviceUri', note: from a @secure() param or listCallbackUrl() }
    bicep: { attribute: 'properties.webhookReceivers[]' }
  notification.webhook_authentication:
    terraform_avm:
      attribute: 'webhook_receivers.<key>.use_aad_auth'
      values: { entra_id: true, url_secret: false }
      also:
        entra_id: object_id = v.object_id, identifier_uri = v.identifier_uri
    terraform:
      attribute: webhook_receiver.aad_auth
      values:
        entra_id: { expr: '{ object_id = <object_id>, identifier_uri = <identifier_uri>, tenant_id = <tenant_id> }' }
        url_secret: null
      note: a nested block inside webhook_receiver (written without =), the secure webhook; url_secret renders no aad_auth block
    bicep_avm:
      attribute: 'webhookReceivers[].useAadAuth'
      values: { entra_id: true, url_secret: false }
      also:
        entra_id: 'objectId: r.objectId, identifierUri: r.identifierUri'
    bicep:
      attribute: 'properties.webhookReceivers[].useAadAuth'
      values: { entra_id: true, url_secret: false }
      also:
        entra_id: objectId, identifierUri, tenantId
  notification.azure_function_receivers:
    terraform_avm:
      attribute: 'azure_function_receivers.<key> = { function_app_resource_id, function_name, http_trigger_url }'
      note: the URL is read from the app, never literal
    terraform: { attribute: 'azure_function_receiver { name, function_app_resource_id, function_name, http_trigger_url, use_common_alert_schema }' }
    bicep_avm: { attribute: 'azureFunctionReceivers[] = { functionAppResourceId, functionName, httpTriggerUrl }' }
    bicep: { attribute: 'properties.azureFunctionReceivers[]' }
  notification.logic_app_receivers:
    terraform_avm: { attribute: 'logic_app_receivers.<key> = { resource_id, callback_url }' }
    terraform: { attribute: 'logic_app_receiver { name, resource_id, callback_url, use_common_alert_schema }' }
    bicep_avm: { attribute: 'logicAppReceivers[] = { resourceId, callbackUrl }', note: callbackUrl is a securestring }
    bicep: { attribute: 'properties.logicAppReceivers[]' }
  notification.event_hub_receivers:
    terraform_avm:
      attribute: 'event_hub_receivers.<key> = { event_hub_namespace, event_hub_name, subscription_id }'
      note: the namespace name, not its id
    terraform: { attribute: 'event_hub_receiver { name, event_hub_namespace, event_hub_name, subscription_id, tenant_id, use_common_alert_schema }' }
    bicep_avm: { attribute: 'eventHubReceivers[] = { eventHubNameSpace, eventHubName, subscriptionId }' }
    bicep: { attribute: 'properties.eventHubReceivers[]' }
  notification.arm_role_receivers:
    terraform_avm:
      attribute: 'arm_role_receivers.<key>.role_id'
      values: { Owner: 8e3af657-a8ff-443c-a75c-2fe8c4bcb635, Contributor: b24988ac-6180-42a0-ab88-20f7382dd24c, Monitoring Contributor: 749f88d5-cbae-40b8-bcfc-e573ddc772fa, Monitoring Reader: 43d0d8ad-25c7-4714-9337-8ba259a9fe05 }
      note: one receiver per role in the list, the bare GUID of the built-in role
    terraform:
      attribute: 'arm_role_receiver.role_id'
      values: { Owner: 8e3af657-a8ff-443c-a75c-2fe8c4bcb635, Contributor: b24988ac-6180-42a0-ab88-20f7382dd24c, Monitoring Contributor: 749f88d5-cbae-40b8-bcfc-e573ddc772fa, Monitoring Reader: 43d0d8ad-25c7-4714-9337-8ba259a9fe05 }
      note: 'one arm_role_receiver { name, role_id, use_common_alert_schema } per role in the list'
    bicep_avm:
      attribute: 'armRoleReceivers[].roleId'
      values: { Owner: 8e3af657-a8ff-443c-a75c-2fe8c4bcb635, Contributor: b24988ac-6180-42a0-ab88-20f7382dd24c, Monitoring Contributor: 749f88d5-cbae-40b8-bcfc-e573ddc772fa, Monitoring Reader: 43d0d8ad-25c7-4714-9337-8ba259a9fe05 }
      note: one entry per role in the list
    bicep:
      attribute: 'properties.armRoleReceivers[].roleId'
      values: { Owner: 8e3af657-a8ff-443c-a75c-2fe8c4bcb635, Contributor: b24988ac-6180-42a0-ab88-20f7382dd24c, Monitoring Contributor: 749f88d5-cbae-40b8-bcfc-e573ddc772fa, Monitoring Reader: 43d0d8ad-25c7-4714-9337-8ba259a9fe05 }
      note: one entry per role in the list
  notification.automation_runbook_receivers:
    terraform_avm: { attribute: automation_runbook_receivers }
    terraform: { attribute: automation_runbook_receiver }
    bicep_avm: { attribute: automationRunbookReceivers }
    bicep: { attribute: 'properties.automationRunbookReceivers[]' }
  notification.itsm_receivers:
    terraform_avm: { attribute: itsm_receivers }
    terraform: { attribute: itsm_receiver }
    bicep_avm: { attribute: itsmReceivers }
    bicep: { attribute: 'properties.itsmReceivers[]' }
  notification.common_alert_schema:
    terraform_avm:
      attribute: '<receiver>.<key>.use_common_alert_schema'
      passthrough: true
      note: module default false on each receiver; written per receiver
    terraform: { attribute: '<receiver>.use_common_alert_schema', passthrough: true, note: in every receiver block that has it }
    bicep_avm:
      attribute: '<receiver>[].useCommonAlertSchema'
      passthrough: true
      note: module default false per receiver; written
    bicep: { attribute: 'properties.<receiver>[].useCommonAlertSchema', passthrough: true }
  notification.enabled:
    terraform_avm: { attribute: enabled, passthrough: true, note: default true; a per-stage variable }
    terraform: { attribute: enabled, passthrough: true }
    bicep_avm: { attribute: enabled, passthrough: true, note: default true; a stage parameter }
    bicep: { attribute: properties.enabled, passthrough: true }

  # ----------------------------------------------------------------- identity
  identity.role_assignments:
    terraform_avm: { attribute: 'role_assignments.<key> = { role_definition_id_or_name, principal_id, principal_type }' }
    terraform: { attribute: azurerm_role_assignment, note: scope = the action group's id }
    bicep_avm: { attribute: 'roleAssignments[] = { principalId, roleDefinitionIdOrName, principalType }' }
    bicep: { attribute: Microsoft.Authorization/roleAssignments, note: scope = the action group }
