schema_version: 1

resource: Microsoft.CognitiveServices/accounts
title: Azure AI Services account, single service (Speech, Vision, Language, Document Intelligence, Content Safety, Translator, Custom Vision, Face)

# The same resource provider as the Foundry set, with a narrower `kind`. A multi-service
# account (`AIServices`, `OpenAI`, the older `CognitiveServices`) is the foundry set's
# business; this set is for the account that offers one product. The abbreviation follows
# the kind: naming.default.yaml carries one per kind (`spch`, `cv`, `lang`, `di`, `cs`,
# `trsl`, `cstvt`, `face`) under `Microsoft.CognitiveServices/accounts::<kind>`; the render
# uses the kind's entry and this field is the fallback.
naming:
  terraform: "Azure::Microsoft.CognitiveServices/accounts"
  bicep: "Microsoft.CognitiveServices/accounts"
  # Bicep assembles the name from vars - this is the prefix it renders. The name doubles as
  # the custom subdomain (`<name>.cognitiveservices.azure.com`), so it is global.
  abbreviation: "ais"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create private DNS zones (`privatelink.cognitiveservices.azure.com`) - shared infrastructure, owned by a pattern or the platform."
  - "Does not create the Log Analytics workspace it routes diagnostics to."
  - "Does not cover the multi-service kinds `AIServices`, `OpenAI` and `CognitiveServices`, nor model deployments, projects or agents - the foundry set's business. A request that names several services on one account is routed there."
  - "Does not render the trained content: custom speech and custom vision models, Document Intelligence custom models, Language projects, Translator glossaries - application content that lives in the service or in a storage account the application owns."
  - "Does not create the storage account a kind needs for its training data or batch results, nor grant the account's identity its role on it - wiring between resources, owned by a pattern."
  - "Does not create a commitment tier (reserved capacity) - a purchase with its own lifecycle."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name and the strictness of several defaults below.
          Nothing sensible can be guessed.
        renders: naming parameter `environment`, and the tag of that name where the repository uses one

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          Part of the rendered name and not inferable. **Not every kind is offered in every
          region**, and a few (Face, some Speech features) need an approval per subscription;
          check the region's offer for the kind before the interview ends, not at apply. Data
          at rest stays in the region; some Speech and Translator features process in other
          regions of the geography, which is a `data_residency` consequence named in the
          notes.
        renders: location

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        ref: resource_group
        required: true
        from_context: true
        per_environment: true
        why: >
          The account is placed into an existing group. Creating one here would make this set
          own a lifecycle wider than the resource it describes.
        renders: parent_id (AVM Terraform, AzAPI) / implicit in Bicep scope

  # ------------------------------------------------------------------ account
  - id: account
    title: The account
    questions:
      - id: kind
        ask: Which AI service should the account provide?
        type: enum
        plain:
          en: "The account provides {value}."
          de: "Das Konto stellt {value} bereit."
        plain_values:
          SpeechServices: { en: "speech: transcription, text-to-speech, translation of speech", de: "Sprache: Transkription, Sprachausgabe, Sprachübersetzung" }
          ComputerVision: { en: "image analysis and OCR", de: "Bildanalyse und Texterkennung" }
          TextAnalytics: { en: "language: entities, sentiment, summarisation, conversational understanding", de: "Sprache: Entitäten, Stimmung, Zusammenfassung, Konversationsverständnis" }
          FormRecognizer: { en: "document intelligence: extraction from invoices, forms and documents", de: "Dokumentenanalyse: Extraktion aus Rechnungen, Formularen und Dokumenten" }
          ContentSafety: { en: "content safety: detection of harmful text and images", de: "Inhaltssicherheit: Erkennung schädlicher Texte und Bilder" }
          TextTranslation: { en: "text translation", de: "Textübersetzung" }
          CustomVision.Training: { en: "custom vision model training", de: "Training eigener Bildmodelle" }
          Face: { en: "face detection and recognition (gated access)", de: "Gesichtserkennung (zugangsbeschränkt)" }
        values: [SpeechServices, ComputerVision, TextAnalytics, FormRecognizer, ContentSafety, TextTranslation, CustomVision.Training, Face]
        required: true
        why: >
          The kind is the product: it decides the endpoint, the SDK, the pricing, the log
          categories, the abbreviation in the name and which features exist. It cannot be
          guessed from a request that says "AI", and a request that names two services is
          either two accounts or the foundry set's multi-service account. `TextAnalytics` is
          the resource name of the Language service, `FormRecognizer` of Document
          Intelligence - the ARM kinds kept their old names. **The kind is fixed at
          creation**; changing it is a new account with a new subdomain. `Face` and some
          Speech features need a registered use case approved per subscription before the
          account can be created.
        renders: kind / kind

      - id: sku_name
        ask: Which pricing tier?
        type: enum
        plain:
          en: "The account uses the pricing tier {value}."
          de: "Das Konto nutzt die Preisstufe {value}."
        plain_values:
          S0: { en: "S0, the standard paid tier, billed per transaction", de: "S0, die bezahlte Standardstufe, abgerechnet je Transaktion" }
          F0: { en: "F0, the free tier with a monthly cap, one per subscription and kind", de: "F0, die kostenlose Stufe mit Monatslimit, eine je Abonnement und Dienst" }
        values: [S0, F0]
        default: S0
        why: >
          S0 is the paid tier for every kind here and is billed per transaction, so an idle
          account costs nothing - which is why the free tier is not the savings default: F0
          is capped per month, allows **one account per kind per subscription**, is
          throttled, and some kinds refuse private endpoints or custom models on it. A
          development stage on F0 is a deliberate choice for a single engineer, not a stage
          default, because the second stage in the same subscription fails at apply. A
          Document Intelligence or Speech workload with steady volume buys a commitment tier
          outside this set. The modules default differently (Bicep `S0`, Terraform has no
          default), so it is written.
        renders: sku_name / sku

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask: Should this account depart from the deployment's exposure posture?
        type: enum
        plain:
          en: "The account is {value}."
          de: "Das Konto ist {value}."
        plain_values:
          disabled: { en: "not reachable from the internet at all", de: "aus dem Internet überhaupt nicht erreichbar" }
          enabled_with_firewall: { en: "reachable from the internet only from listed addresses", de: "aus dem Internet nur von gelisteten Adressen erreichbar" }
          enabled: { en: "reachable from the internet", de: "aus dem Internet erreichbar" }
        values: [disabled, enabled_with_firewall, enabled]
        from_deployment: network_exposure
        confirm_in: [production]
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces
          `enabled`, recorded as forced with `network_ownership` as forced_by: the
          deployment's own callers have no fixed outbound address, so a firewall with no
          rule locks them out of this resource. A browser or mobile client calling Speech
          directly is a named departure to `enabled` with `local_authentication_disabled`
          kept - the client gets a short-lived token from the application, never the key
        why: >
          Asked only as a departure: exposure is a property of the system. `private` is
          `disabled`, `public` is `enabled_with_firewall`. **Terraform's module defaults to
          public access on**; Bicep leaves it unset and disables it only when private
          endpoints are given. A firewall or a private endpoint needs the custom subdomain,
          which the render sets from the name. Speech and Translator also have a
          **synthesis and container path** that is reached from end-user devices; that
          traffic goes through the application, not to the account, when the account is
          closed.
        renders: >
          terraform: public_network_access_enabled (bool) and network_acls;
          bicep: publicNetworkAccess and networkAcls

      - id: private_endpoint_subnet
        ask: Which subnet should this account's private endpoint live in?
        type: ref
        resolved_by: platform
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        ref: subnet
        from_deployment: private_endpoint_subnet
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited. The
          sub-resource is `account` and the zone is `privatelink.cognitiveservices.azure.com`
          for every kind here - one zone, unlike the three a Foundry account needs. The
          endpoint needs the custom subdomain and the Speech SDK must then be given the
          private endpoint's hostname, not the region, which is an application setting named
          in the notes.
        renders: private_endpoints.<key>.subnet_resource_id / privateEndpoints[].subnetResourceId (service `account`)

      - id: ip_rules
        ask: Which public IP ranges may reach the account?
        type: list
        plain:
          en: "Public addresses allowed to reach the account: {value}."
          de: "Öffentliche Adressen, die das Konto erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist with a default action of `Deny`. A firewall needs the custom
          subdomain, which the render sets. An empty list denies every public caller, which is
          valid and deliberate.
        renders: network_acls.ip_rules / networkAcls.ipRules

      - id: restrict_outbound
        ask: Should the account's own outgoing calls be limited to named addresses?
        type: bool
        plain:
          en: "The account {value}."
          de: "Das Konto {value}."
        plain_values:
          true: { en: "may call out only to addresses that are explicitly allowed", de: "darf nur Adressen aufrufen, die ausdrücklich erlaubt sind" }
          false: { en: "may call any address", de: "darf jede Adresse aufrufen" }
        default: true
        why: >
          These services fetch what they are pointed at: Vision and Document Intelligence read
          an image or a document from a URL the caller sends, Speech reads audio from one. A
          caller who controls the URL can make the account fetch from any address - an
          internal metadata endpoint, a storage account - unless outbound is restricted to the
          names in `allowed_fqdns`. **The Bicep module defaults it to true; Terraform leaves
          it unset (off)**, so it is written. The usual blocker is a document served from a
          public CDN, which is a named entry, not a reason to leave the account open.
        renders: outbound_network_access_restricted / restrictOutboundNetworkAccess

      - id: allowed_fqdns
        ask: Which addresses may the account call when its outgoing calls are limited?
        type: list
        plain:
          en: "The account may call only: {value} (empty: nothing outside Azure)."
          de: "Das Konto darf nur aufrufen: {value} (leer: nichts außerhalb von Azure)."
        default: []
        depends_on: { question: restrict_outbound, equals: true }
        why: >
          The allowlist behind `restrict_outbound`: the storage account's blob endpoint the
          documents or training data live on, a vendor's CDN - never a wildcard, each with
          the reason it is there. An empty list is a valid, strict answer: the account reads
          only what is sent in the request body. A restricted account given a URL not on
          this list fails at the call, not at the deployment, which is how the missing entry
          is usually found.
        renders: >
          terraform: the module input `fqdns`; bicep: the module has no parameter, the
          property is properties.allowedFqdnList (rendered as a second deployment against
          the account)

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity and access
    questions:
      - id: managed_identity
        ask: Which managed identity should the account carry?
        type: enum
        plain:
          en: "The account has {value}."
          de: "Das Konto hat {value}."
        plain_values:
          none: { en: "no identity of its own", de: "keine eigene Identität" }
          system_assigned: { en: "its own identity", de: "eine eigene Identität" }
          user_assigned: { en: "a separately managed identity", de: "eine separat verwaltete Identität" }
        values: [none, system_assigned, user_assigned]
        default: none
        why: >
          The account's identity reaches what the account itself depends on: the storage
          account that holds training data, batch input and output (Document Intelligence,
          Speech batch transcription, Custom Vision) with `Storage Blob Data Contributor`, and
          a Key Vault for a customer-managed key. Callers use their own identities, not this
          one, so an account that reaches nothing outward carries none; `system_assigned` is
          for batch or training data in a storage account. A customer-managed key needs the identity to hold its role on the key before
          the key is set, which is why that case is `user_assigned`.
        forced_when: >
          `key_management: customer_managed` forces `user_assigned`, recorded as forced with
          `key_management` as forced_by
        renders: managed_identities / managedIdentities

      - id: user_assigned_identity_ids
        ask: Which user-assigned identity?
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        ref: user_assigned_identity
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: The identity must already exist; this set does not create it.
        renders: managed_identities.user_assigned_resource_ids / managedIdentities.userAssignedResourceIds

      - id: role_assignments
        ask: Who needs which role on this account?
        type: list
        plain:
          en: "Access rights on the account granted to: {value}."
          de: "Zugriffsrechte auf das Konto vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          With keys off, nothing calls the service until a role is assigned, so an empty list
          is a working account nobody can use, and not an answer: with no consumer named it
          is an `open:` entry owned by the workload owner, blocking apply. The narrow roles
          are per kind - `Cognitive Services Speech User`, `Cognitive Services Language
          Reader`, `Cognitive Services Custom Vision Trainer`, `Cognitive Services Face
          Recognizer` - and `Cognitive Services User` where a kind has none of its own; a
          role that can *list keys* has no business in a keyless account. A pattern fills
          this from the consumers it knows about.
        renders: role_assignments / roleAssignments

  # ----------------------------------------------------------------- security
  - id: security
    title: Security
    questions:
      - id: local_authentication_disabled
        ask: May clients sign in with the account keys?
        type: bool
        plain:
          en: "Signing in with account keys is {value}; access goes through company accounts."
          de: "Die Anmeldung mit Kontoschlüsseln ist {value}; der Zugriff läuft über Firmenkonten."
        plain_values:
          true: { en: "switched off", de: "abgeschaltet" }
          false: { en: "possible", de: "möglich" }
        from_deployment: local_auth
        confirm_in: [production]
        forced_when: >
          A kind or a feature that accepts no token - checked against the service's
          authentication page before a render, because the list shrinks every release - is
          named as `local_auth: allowed_where_unavoidable` for this account alone, with the
          feature in the reason
        why: >
          Inherited: `local_auth: disabled` renders as `true`. A key is a bearer credential
          for the whole account, is not attributable and pays for whatever it is used for -
          and for Speech it is the credential that ends up in a mobile app. **The modules
          disagree**: Bicep disables keys by default, Terraform's `local_auth_enabled`
          defaults on, and the Terraform input is the inverse. The client then needs a
          token for the `https://cognitiveservices.azure.com` scope and the account's custom
          subdomain, which is why the subdomain is set.
        renders: local_auth_enabled (inverse) / disableLocalAuth

      - id: key_management
        ask: Are the account's encryption keys platform-managed or customer-managed?
        type: enum
        plain:
          en: "Encryption keys are {value}."
          de: "Verschlüsselungsschlüssel sind {value}."
        plain_values:
          platform_managed: { en: "managed by Azure - encrypted, rotated, no effort on your side", de: "von Azure verwaltet: verschlüsselt, rotiert, kein Aufwand bei euch" }
          customer_managed: { en: "your own, held in your key vault, so you can revoke them", de: "eure eigenen in eurem Schlüsseltresor, damit ihr sie zurückziehen könnt" }
        values: [platform_managed, customer_managed]
        from_deployment: key_management
        confirm_in: [production]
        forced_when: >
          A kind that does not support customer-managed keys (checked per kind before a
          render; Content Safety and Translator have been among them) records
          `platform_managed` as forced with `kind` as forced_by and names the gap
        why: >
          Inherited. It applies to what the account stores - custom models, uploaded
          training data, Face templates, Speech custom voices - not to a request passing
          through. `customer_managed` pulls in a vault with purge protection, an identity
          that can wrap and unwrap and a rotation story, and some kinds need the E0 tier or
          an approval for it.
        renders: customer_managed_key / customerManagedKey

      - id: cmk_key_vault_key_id
        ask: Which Key Vault key should encrypt the account?
        type: ref
        plain:
          en: "Encrypted with your key {value}."
          de: "Verschlüsselt mit eurem Schlüssel {value}."
        ref: key_vault_key
        required: true
        depends_on: { question: key_management, equals: customer_managed }
        per_environment: true
        why: >
          The key must exist, the vault must have soft delete and purge protection, and the
          account's user-assigned identity must hold wrap and unwrap on it before the account
          is created. The reference is the unversioned key, so a rotation reaches the account
          without a change here.
        renders: customer_managed_key.key_name and key_vault_resource_id / customerManagedKey.keyName and keyVaultResourceId

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask: Which Log Analytics workspace should receive diagnostics?
        type: ref
        resolved_by: platform
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        ref: log_analytics_workspace
        from_deployment: diagnostics_destination
        per_environment: true
        why: >
          Inherited: one deployment, one destination. Without a diagnostic setting nobody can
          say who called the service, how often or why a call failed.
        renders: diagnostic_settings / diagnosticSettings

      - id: diagnostic_categories
        ask: Which log categories should be collected?
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          Audit: { en: "changes to the account and who made them", de: "Änderungen am Konto und wer sie gemacht hat" }
          RequestResponse: { en: "every request, with its caller, size and result (not the content)", de: "jede Anfrage mit Aufrufer, Größe und Ergebnis (nicht der Inhalt)" }
          Trace: { en: "internal platform traces", de: "interne Plattform-Traces" }
        values: [Audit, RequestResponse, Trace]
        default: [Audit, RequestResponse]
        why: >
          Audit and request logs are the record of who called what; they hold metadata, not
          the audio, image or text - the answer to the privacy question that comes first.
          `Trace` is for a support case and is the volume line. The category names are the
          platform's, differ per kind, and are checked against `az monitor diagnostic-settings
          categories list --resource <account id>` before a render, not remembered.
        renders: diagnostic_settings.<key>.logs[].category / diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask: Should all metrics be collected?
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: "collected", de: "erfasst" }
          false: { en: "not collected", de: "nicht erfasst" }
        default: true
        why: >
          Calls, errors, throttled calls and latency per operation, and the per-kind
          counters (characters translated, audio seconds, pages analysed) the bill is made
          of.
        renders: metrics[].category = "AllMetrics" / metricCategories[].category
