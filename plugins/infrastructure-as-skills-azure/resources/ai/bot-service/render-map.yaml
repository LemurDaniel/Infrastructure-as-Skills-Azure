# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored template and the
# tests are in terraform.md and bicep.md. Bicep has no published module: authored is the primary.
schema_version: 1
resource: Microsoft.BotService/botServices

modules:
  terraform: [Azure/avm-res-botservice-botservice/azurerm]
  bicep: []

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the bot
  placement.location:
    terraform_avm:
      attribute: location
      passthrough: true
      note: the answer defaults to the literal global (a regional bot is a named departure); the private endpoints take the deployment's region, never this answer
    terraform:
      attribute: location
      passthrough: true
      note: the answer defaults to the literal global; the private endpoints take the deployment's region
    bicep:
      attribute: location
      passthrough: true
      note: "the answer defaults to 'global'; the private endpoints take the deployment's region"
  placement.resource_group_name:
    terraform_avm: { attribute: resource_group_name, note: 'a name, not an id - AzAPI-only module without azurerm' }
    terraform: { attribute: resource_group_name }
    bicep: { gap: the deployment's resource group scope; no property }

  # ---------------------------------------------------------------------- bot
  bot.sku:
    terraform_avm: { attribute: sku, passthrough: true, note: module default F0; written anyway }
    terraform: { attribute: sku, passthrough: true }
    bicep: { attribute: sku.name, passthrough: true }
  bot.display_name:
    terraform_avm: { attribute: display_name, passthrough: true, note: null falls back to the name }
    terraform: { attribute: display_name, passthrough: true }
    bicep: { attribute: properties.displayName, passthrough: true, note: required by the API; the resource name when empty }
  bot.messaging_endpoint:
    terraform_avm: { attribute: endpoint, passthrough: true }
    terraform: { attribute: endpoint, passthrough: true }
    bicep: { attribute: properties.endpoint, passthrough: true }
  bot.app_identity_type:
    terraform_avm:
      attribute: microsoft_app_type
      values: { user_assigned_msi: UserAssignedMSI, single_tenant: SingleTenant, multi_tenant: MultiTenant }
      note: module default MultiTenant, which the platform refuses for new bots - always written
    terraform:
      attribute: microsoft_app_type
      values: { user_assigned_msi: UserAssignedMSI, single_tenant: SingleTenant, multi_tenant: MultiTenant }
    bicep:
      attribute: properties.msaAppType
      values: { user_assigned_msi: UserAssignedMSI, single_tenant: SingleTenant, multi_tenant: MultiTenant }
  bot.bot_identity:
    terraform_avm:
      attribute: microsoft_app_id, microsoft_app_msi_id, microsoft_app_tenant_id
      note: microsoft_app_id = the identity's client id, microsoft_app_msi_id = its resource id, microsoft_app_tenant_id = the tenant (var.tenant_id) - all three for UserAssignedMSI
    terraform:
      attribute: microsoft_app_id, microsoft_app_msi_id, microsoft_app_tenant_id
      note: microsoft_app_id = the identity's client id, microsoft_app_msi_id = its resource id, microsoft_app_tenant_id = the tenant
    bicep:
      attribute: properties.msaAppId, properties.msaAppMSIResourceId, properties.msaAppTenantId
      note: msaAppId = the identity's client id, msaAppMSIResourceId = its resource id, msaAppTenantId = tenant().tenantId
  bot.app_registration_client_id:
    terraform_avm:
      attribute: microsoft_app_id
      passthrough: true
      note: single and multi tenant; microsoft_app_tenant_id = var.tenant_id beside it, never this id; no MSI id
    terraform:
      attribute: microsoft_app_id
      passthrough: true
      note: microsoft_app_tenant_id = the tenant beside it, never this id; no microsoft_app_msi_id
    bicep:
      attribute: properties.msaAppId
      passthrough: true
      note: 'msaAppTenantId: tenant().tenantId beside it, never this id; no msaAppMSIResourceId'
  bot.channels:
    terraform_avm:
      attribute: 'channels.<key> = { channel_name, location = "global", properties }'
      note: properties is the channel's own object (isEnabled, sites) - content, not a decision
    terraform:
      gap: >-
        one authored resource per entry - MsTeamsChannel azurerm_bot_channel_ms_teams, DirectLineChannel
        azurerm_bot_channel_directline, WebChatChannel azurerm_bot_channel_web_chat, EmailChannel
        azurerm_bot_channel_email, SlackChannel azurerm_bot_channel_slack; the reference names none
        for M365Extensions
    bicep:
      attribute: botServices/channels properties.channelName
      note: "a child per entry named after the channel, location: 'global'; the channel's settings are content"
  bot.streaming_endpoint:
    terraform_avm: { attribute: streaming_endpoint_enabled, passthrough: true, note: module default null (on per README); written }
    terraform: { attribute: streaming_endpoint_enabled, passthrough: true }
    bicep: { attribute: properties.isStreamingSupported, passthrough: true }

  # --------------------------------------------------------------- networking
  networking.public_network_access:
    terraform_avm:
      attribute: public_network_access
      values: { disabled: Disabled, enabled_with_firewall: Enabled, enabled: Enabled }
      note: the string input; it overrides the bool public_network_access_enabled, which is left unset
    terraform:
      attribute: public_network_access_enabled
      values: { disabled: false, enabled_with_firewall: true, enabled: true }
      note: a bool; SecuredByPerimeter needs azapi
    bicep:
      attribute: properties.publicNetworkAccess
      values: { disabled: Disabled, enabled_with_firewall: Enabled, enabled: Enabled }
      note: enabled_with_firewall is Enabled - the resource has no IP rules
  networking.private_endpoint_subnet:
    terraform_avm:
      attribute: 'private_endpoints.<key>.subnet_resource_id'
      note: keys bot and token; private_endpoints_manage_dns_zone_group = false under private_dns_records policy
    terraform:
      gap: authored azurerm_private_endpoint, one per sub-resource; the reference names the resource, not its subnet argument
    bicep:
      attribute: Microsoft.Network/privateEndpoints properties.subnet.id
      note: one per sub-resource in the deployment's region; no zone group under private_dns_records policy
  networking.private_endpoint_subresources:
    terraform_avm: { attribute: 'private_endpoints.<key>.subresource_name', note: 'one entry per sub-resource (Bot, Token)' }
    terraform: { attribute: azurerm_private_endpoint.subresource_names, note: '["Bot"] and a second endpoint with ["Token"]' }
    bicep:
      attribute: 'Microsoft.Network/privateEndpoints properties.privateLinkServiceConnections[].properties.groupIds'
      note: one endpoint per sub-resource

  # ----------------------------------------------------------------- identity
  identity.role_assignments:
    terraform_avm: { attribute: 'role_assignments.<key> = { role_definition_id_or_name, principal_id, principal_type }' }
    terraform: { gap: the authored rendering names no role assignment; the renders field names only the module input }
    bicep:
      attribute: 'Microsoft.Authorization/roleAssignments properties = { principalId, roleDefinitionId, principalType }'
      note: one per entry, scoped to the bot; the role definition id, not the name - no module resolves names

  # ----------------------------------------------------------------- security
  security.local_authentication_disabled:
    terraform_avm:
      attribute: local_authentication_enabled
      values: { true: false, false: true }
      note: inverse; module default null (on) - written
    terraform:
      attribute: local_authentication_enabled
      values: { true: false, false: true }
      note: inverse
    bicep: { attribute: properties.disableLocalAuth, passthrough: true }
  security.key_management:
    terraform_avm:
      attribute: is_cmek_enabled
      values: { platform_managed: false, customer_managed: true }
    terraform:
      gap: no flag on the authored resource - customer_managed is cmk_key_vault_key_url set (security.cmk_key_vault_key_id), platform_managed leaves it out
    bicep:
      attribute: properties.isCmekEnabled
      values: { platform_managed: false, customer_managed: true }
  security.cmk_key_vault_key_id:
    terraform_avm: { attribute: cmek_key_vault_url, note: "the key's URL (versioned or unversioned - unversioned follows a rotation), never its resource id" }
    terraform: { attribute: cmk_key_vault_key_url, note: "the key's URL (versioned or unversioned - unversioned follows a rotation), never its resource id" }
    bicep: { attribute: properties.cmekKeyVaultUrl, note: "the key's URL (versioned or unversioned - unversioned follows a rotation), never its resource id" }

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm: { attribute: diagnostic_settings.workspace.workspace_resource_id }
    terraform:
      gap: authored azurerm_monitor_diagnostic_setting; the reference names the resource, not its workspace argument
    bicep: { attribute: Microsoft.Insights/diagnosticSettings properties.workspaceId, note: scoped to the bot }
  observability.diagnostic_categories:
    terraform_avm:
      attribute: diagnostic_settings.workspace.log_categories
      note: log_groups defaults to ["allLogs"] - set it [] beside the categories
    terraform: { attribute: azurerm_monitor_diagnostic_setting.enabled_log.category }
    bicep: { attribute: 'Microsoft.Insights/diagnosticSettings properties.logs[].category' }
  observability.metrics_enabled:
    terraform_avm:
      attribute: diagnostic_settings.workspace.metric_categories
      values: { true: { expr: '["AllMetrics"]' }, false: { expr: '[]' } }
    terraform:
      gap: authored azurerm_monitor_diagnostic_setting; the authored rendering names only enabled_log - no metric block is in the reference
    bicep:
      attribute: 'Microsoft.Insights/diagnosticSettings properties.metrics[].category'
      values: { true: AllMetrics, false: null }
      note: false renders no metrics entry
