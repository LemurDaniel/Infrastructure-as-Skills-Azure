schema_version: 1

resource: Microsoft.MachineLearningServices/workspaces
title: Azure Machine Learning workspace (kind Default)

# The classic workspace for training, registries of models and managed endpoints. The same
# resource type with kind `Hub` or `Project` is the old Foundry hub, which the account-based
# foundry set replaces and this set does not create.
naming:
  terraform: "Azure::Microsoft.MachineLearningServices/workspaces"
  bicep: "Microsoft.MachineLearningServices/workspaces"
  # Bicep assembles the name from vars - this is the prefix it renders.
  abbreviation: "mlw"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create the storage account, the key vault, the Application Insights component or the container registry the workspace depends on - referenced, created by their own sets, and listed in the notes with what each must look like. The workspace identity's roles on them are wiring, owned by a pattern."
  - "Does not create private DNS zones (`privatelink.api.azureml.ms`, `privatelink.notebooks.azure.net`) - shared infrastructure, owned by a pattern or the platform."
  - "Does not create compute clusters, compute instances, serverless Spark pools, online or batch endpoints, datastores, connections or jobs - compute is sized by the people who run the jobs and endpoints are deployed with the model; `computes` names them."
  - "Does not create an Azure Firewall for FQDN outbound rules - the managed network provisions one on the first FQDN rule, which is a cost named in `outbound_fqdns`."
  - "Does not create a Foundry hub or project (kinds `Hub`, `Project`) - the account-based foundry set replaces them. A registry (`Microsoft.MachineLearningServices/registries`) has no question set."
  - "Does not create the Log Analytics workspace it routes diagnostics to."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name and the strictness of several defaults below. Nothing
          sensible can be guessed.
        renders: naming parameter `environment`, and the tag of that name where the repository uses one

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          Part of the rendered name and not inferable. The dependent resources must be in the
          same region as the workspace (the storage account and key vault strictly), and the
          GPU sizes a training job needs are a per-region quota - check both before the
          interview ends.
        renders: location

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        required: true
        from_context: true
        per_environment: true
        why: >
          The workspace is placed into an existing group. Creating one here would make this
          set own a lifecycle wider than the resource it describes.
        renders: resource_group_name (AVM Terraform) / implicit in Bicep scope

  # ---------------------------------------------------------------- workspace
  - id: workspace
    title: The workspace and its dependencies
    questions:
      - id: storage_account
        ask:
          en: "Which storage account should hold the workspace's data, notebooks and artefacts?"
          de: "Welches Speicherkonto soll die Daten, Notebooks und Artefakte des Workspace halten?"
        type: string
        plain:
          en: "Data, notebooks and model files live in the storage account {value}."
          de: "Daten, Notebooks und Modelldateien liegen im Speicherkonto {value}."
        accepts: { ref: storage_account }
        required: true
        per_environment: true
        why: >
          The workspace's default datastores - blobs for data and artefacts, a file share for
          notebooks and code - live in this account, and **it is fixed at creation**. It is
          dedicated to the workspace (general-purpose v2, no hierarchical namespace, the
          same region) with private endpoints for blob and file in a private deployment;
          with `storage_datastore_auth: identity` its shared keys stay off. Referenced here,
          created by the storage set.
        renders: storage_account.resource_id / associatedStorageAccountResourceId

      - id: key_vault
        ask:
          en: "Which key vault should hold the workspace's secrets?"
          de: "Welcher Key Vault soll die Secrets des Workspace halten?"
        type: string
        plain:
          en: "The workspace's secrets live in the key vault {value}."
          de: "Die Geheimnisse des Arbeitsbereichs liegen im Schlüsseltresor {value}."
        accepts: { ref: key_vault }
        required: true
        per_environment: true
        why: >
          Datastore credentials, compute SSH keys and connection secrets are written here by
          the workspace, and **it is fixed at creation**. One vault per workspace, RBAC
          authorisation, in the same region. Referenced here, created by the Key Vault set.
        renders: key_vault.resource_id / associatedKeyVaultResourceId

      - id: application_insights
        ask:
          en: "Which Application Insights component should receive endpoint and job telemetry?"
          de: "Welche Application-Insights-Komponente soll die Telemetrie von Endpunkten und Jobs erhalten?"
        type: string
        plain:
          en: "Endpoint and job telemetry goes to {value}."
          de: "Telemetrie der Endpunkte und Jobs geht an {value}."
        accepts: { ref: application_insights }
        required: true
        per_environment: true
        why: >
          Required by the service for a workspace of kind `Default`: managed online
          endpoints write their request telemetry here and the studio reads it. Referenced
          here, created by the observability set, on the deployment's Log Analytics
          workspace.
        renders: application_insights.resource_id / associatedApplicationInsightsResourceId

      - id: container_registry
        ask:
          en: "Which container registry should hold the environment images?"
          de: "Welche Container Registry soll die Umgebungs-Images halten?"
        type: string
        plain:
          en: "Environment images are kept in the registry {value} (empty: none until the first image build)."
          de: "Umgebungs-Images liegen in der Registry {value} (leer: keine, bis zum ersten Image-Build)."
        accepts: { ref: container_registry }
        default: ""
        per_environment: true
        why: >
          Every training environment and endpoint image is built into a registry. Without
          one the service creates a Basic registry on the first build, in the workspace's
          resource group, with the admin user on and no private endpoint - which a private
          deployment cannot accept, and which no template owns. A private deployment names
          a Premium registry (private endpoints need Premium) created by the registry set;
          empty is for a sandbox. Once set it cannot be removed, only replaced.
        renders: container_registry.resource_id / associatedContainerRegistryResourceId

      - id: hbi_workspace
        ask:
          en: "Does the workspace handle data whose exposure would be a serious incident?"
          de: "Verarbeitet der Workspace Daten, deren Offenlegung ein schwerer Vorfall wäre?"
        type: bool
        resolved_by: interview
        topic: security
        plain:
          en: "The workspace is {value}."
          de: "Der Arbeitsbereich ist {value}."
        plain_values:
          true: { en: "marked as handling sensitive data: less telemetry is collected and scratch disks are encrypted", de: "als Arbeitsbereich mit sensiblen Daten markiert: weniger Telemetrie wird erfasst, temporäre Datenträger werden verschlüsselt" }
          false: { en: "not marked as handling sensitive data", de: "nicht als Arbeitsbereich mit sensiblen Daten markiert" }
        default: false
        why: >
          The high-business-impact flag reduces the diagnostic data Microsoft collects from
          the workspace, encrypts the local scratch disks of compute, and is **fixed at
          creation**. It costs nothing but limits what support can see, so it is the
          customer's answer about the data - personal, health, financial - and not a
          default. Both modules default to `false`.
        renders: hbi_workspace / hbiWorkspace

      - id: v1_legacy_mode
        ask:
          en: "Must the workspace keep the legacy v1 API behaviour?"
          de: "Muss der Workspace das alte Verhalten der v1-API beibehalten?"
        type: bool
        plain:
          en: "The legacy v1 API mode is {value}."
          de: "Der alte v1-API-Modus ist {value}."
        plain_values:
          true: { en: "on, which blocks v2 features and the managed network", de: "an, was v2-Funktionen und das verwaltete Netz blockiert" }
          false: { en: "off", de: "aus" }
        default: false
        why: >
          `true` keeps the workspace's control plane on the v1 (SDK v1) path and disables
          everything that arrived with v2 - managed endpoints, the managed network, the CLI
          v2. It exists for an organisation whose policies forbid the v2 data plane and for
          nothing else. Off by default and written, because **neither AVM module exposes
          it** (the property is `v1LegacyMode`); the render sets it through the module's
          override or records that the platform default (off) applies.
        renders: >
          properties.v1LegacyMode - not carried by either module; `_target_overrides` or the
          authored resource

      - id: image_build_compute
        ask:
          en: "Which compute should build the environment images when the registry is private?"
          de: "Welche Compute-Ressource soll die Umgebungs-Images bauen, wenn die Registry privat ist?"
        type: string
        plain:
          en: "Environment images are built on the compute {value} (empty: by the registry's build service)."
          de: "Umgebungs-Images werden auf dem Compute {value} gebaut (leer: vom Build-Dienst der Registry)."
        default: ""
        why: >
          With a private container registry the registry's own build tasks cannot reach it,
          and image builds fail with a pull error after the deployment succeeded. The fix is
          a compute cluster inside the workspace that builds the images; this names it. The
          cluster is content (`computes`), created after the workspace, so the value is set
          on a second apply or left empty for a public registry.
        renders: image_build_compute / imageBuildCompute

      - id: computes
        ask:
          en: "Which compute should the workspace have?"
          de: "Welche Compute-Ressourcen soll der Workspace haben?"
        type: list
        plain:
          en: "Compute: {value} (empty: none yet; serverless compute is always available)."
          de: "Compute: {value} (leer: noch keins; serverloses Compute ist immer verfügbar)."
        default: []
        why: >
          Each entry is a name, a type (compute instance, compute cluster, attached
          Kubernetes) and a size. The sizes and counts are the data scientists' decisions and
          GPU quota is theirs to request; the workspace is usable without any of them
          through serverless compute. Named here so the subnet, the quota request and
          `image_build_compute` have something to point at; rendered from the module's
          compute child where present, otherwise after the workspace.
        renders: >
          bicep: computes[] of the module; terraform: not carried by the module, an
          azapi_resource `workspaces/computes` next to it

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: managed_network_isolation
        ask:
          en: "How far may jobs and endpoints in the workspace reach out?"
          de: "Wie weit dürfen Jobs und Endpunkte im Workspace nach außen greifen?"
        type: enum
        plain:
          en: "Jobs and endpoints may reach {value}."
          de: "Jobs und Endpunkte erreichen {value}."
        plain_values:
          allow_only_approved_outbound: { en: "only the named Azure services and addresses; everything else is blocked", de: "nur die benannten Azure-Dienste und Adressen; alles andere ist blockiert" }
          allow_internet_outbound: { en: "the internet, from a network Azure manages", de: "das Internet, aus einem von Azure verwalteten Netz" }
          disabled: { en: "whatever your own network allows (no managed network)", de: "was euer eigenes Netz erlaubt (kein verwaltetes Netz)" }
        accepts: [allow_only_approved_outbound, allow_internet_outbound, disabled]
        default: allow_only_approved_outbound
        forced_when: >
          `network_exposure: public` with `network_ownership: none` forces
          `allow_internet_outbound` - there is no private backend to approve - recorded as
          forced with `network_exposure` as forced_by
        why: >
          The managed virtual network is the network the workspace's compute, serverless
          jobs and managed endpoints run in; this is its outbound rule. `approved` is
          data-exfiltration protection: a training job reaches the workspace's own storage,
          vault and registry over private endpoints the service creates, plus what
          `outbound_fqdns` and the private-endpoint rules name, and nothing else - so a
          notebook cannot post the training set to an address of its choosing. `internet`
          keeps the managed network but lets jobs download anything, which is what a team
          installing packages ad hoc wants and what a regulated one cannot have. `disabled`
          is the legacy bring-your-own-VNet model where every compute is injected into a
          subnet of yours. **Isolation can be turned on later but never off**, and the Bicep
          module leaves it unset while Terraform defaults to `Disabled` - written.
        renders: workspace_managed_network.isolation_mode / managedNetworkSettings.isolationMode

      - id: outbound_fqdns
        ask:
          en: "Which internet addresses may jobs reach from the approved-outbound network?"
          de: "Welche Internetadressen dürfen Jobs aus dem Netz mit freigegebenem Ausgang erreichen?"
        type: list
        plain:
          en: "Jobs may additionally reach: {value} (empty: nothing on the internet)."
          de: "Jobs erreichen zusätzlich: {value} (leer: nichts im Internet)."
        default: []
        depends_on: { question: managed_network_isolation, equals: allow_only_approved_outbound }
        why: >
          Each entry is a host name a job genuinely needs - `pypi.org` and `*.pythonhosted.org`
          for packages, a model hub, a vendor API - with the reason it is there. **The first
          FQDN rule makes the service provision an Azure Firewall in the managed network**,
          billed by the hour from then on; a team that can mirror its packages into a feed
          inside the network avoids both the rule and the firewall. Private-endpoint rules to
          other Azure resources (a second storage account, a Foundry account) cost no
          firewall and are the pattern's wiring.
        renders: >
          workspace_managed_network.outbound_rules.fqdn /
          managedNetworkSettings.outboundRules (type FQDN)

      - id: provision_network_now
        ask:
          en: "Should the managed network be built with the workspace rather than on first use?"
          de: "Soll das verwaltete Netz mit dem Workspace angelegt werden statt bei der ersten Nutzung?"
        type: bool
        plain:
          en: "The managed network is built {value}."
          de: "Das verwaltete Netz wird {value} aufgebaut."
        plain_values:
          true: { en: "together with the workspace, so the deployment proves it works", de: "zusammen mit dem Arbeitsbereich, so beweist das Ausrollen, dass es funktioniert" }
          false: { en: "on the first job or endpoint, which then waits for it", de: "beim ersten Job oder Endpunkt, der dann darauf wartet" }
        default: true
        depends_on: { question: managed_network_isolation, not_equals: disabled }
        why: >
          Without it the managed network, its private endpoints and - with FQDN rules - the
          firewall are created when the first compute is requested, which turns a
          misconfigured rule into a failing job twenty minutes into someone's day instead of
          a failing deployment. `true` adds minutes to the apply and surfaces the error
          there. Both modules default to `false`; written.
        renders: provision_network_now_enabled / provisionNetworkNow

      - id: public_network_access
        ask:
          en: "Should this workspace depart from the deployment's exposure posture?"
          de: "Soll dieser Workspace von der Erreichbarkeit des Deployments abweichen?"
        type: enum
        plain:
          en: "The workspace is {value}."
          de: "Der Arbeitsbereich ist {value}."
        plain_values:
          disabled: { en: "not reachable from the internet at all", de: "aus dem Internet überhaupt nicht erreichbar" }
          enabled_with_firewall: { en: "reachable from the internet only from listed addresses", de: "aus dem Internet nur von gelisteten Adressen erreichbar" }
          enabled: { en: "reachable from the internet", de: "aus dem Internet erreichbar" }
        accepts: [disabled, enabled_with_firewall, enabled]
        from_deployment: network_exposure
        forced_when: >
          `network_ownership: none` forces `enabled`, recorded as forced with
          `network_ownership` as forced_by
        why: >
          Asked only as a departure: exposure is a property of the system. It switches the
          studio and the API; with `disabled` data scientists open the studio from inside the
          network (a jump host, a VPN, Bastion), and the private endpoint carries the API,
          the studio and the notebooks. Both modules default to disabled - written.
        renders: public_network_access_enabled (bool) and ip_allowlist / publicNetworkAccess and ipAllowlist

      - id: ip_allowlist
        ask:
          en: "Which public IP ranges may reach the studio and the API?"
          de: "Welche öffentlichen IP-Bereiche dürfen das Studio und die API erreichen?"
        type: list
        plain:
          en: "Public addresses allowed to reach the workspace: {value}."
          de: "Öffentliche Adressen, die den Arbeitsbereich erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist beside the private endpoint; the office's egress ranges
          are the usual content. An empty list with `enabled_with_firewall` denies every
          public caller, which is valid and deliberate.
        renders: ip_allowlist / ipAllowlist

      - id: private_endpoint_subnet
        ask:
          en: "Which subnet should the workspace's private endpoint live in?"
          de: "In welchem Subnetz soll der Private Endpoint des Workspace liegen?"
        type: string
        resolved_by: derived
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        accepts: { ref: subnet }
        from_deployment: private_endpoint_subnet
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited. The
          sub-resource is `amlworkspace` and it writes records into **two** zones -
          `privatelink.api.azureml.ms` and `privatelink.notebooks.azure.net` - so the
          platform must hold both, or the studio loads and the notebooks do not.
        renders: private_endpoints.<key>.subnet_resource_id / privateEndpoints[].subnetResourceId (service `amlworkspace`)

      - id: serverless_compute_no_public_ip
        ask:
          en: "Should serverless compute nodes run without public IP addresses?"
          de: "Sollen Serverless-Compute-Knoten ohne öffentliche IP-Adressen laufen?"
        type: bool
        plain:
          en: "Serverless compute nodes {value}."
          de: "Serverlose Compute-Knoten {value}."
        plain_values:
          true: { en: "have no public address", de: "haben keine öffentliche Adresse" }
          false: { en: "get a public address", de: "bekommen eine öffentliche Adresse" }
        default: true
        why: >
          Serverless jobs run on nodes the service creates; with a managed network they need
          no inbound address, and a node with one is a public surface nobody asked for.
          `false` is needed only in the legacy `disabled` network model when the nodes are
          in a subnet of yours without a NAT gateway. Both modules default to `false`;
          written.
        renders: serverless_compute.public_ip_enabled (inverse) / serverlessComputeSettings.serverlessComputeNoPublicIP

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity and access
    questions:
      - id: managed_identity
        ask:
          en: "Which managed identity should the workspace carry?"
          de: "Welche Managed Identity soll der Workspace tragen?"
        type: enum
        plain:
          en: "The workspace has {value}."
          de: "Der Arbeitsbereich hat {value}."
        plain_values:
          system_assigned: { en: "its own identity, which the service authorises on its dependencies itself", de: "eine eigene Identität, die der Dienst auf den abhängigen Ressourcen selbst berechtigt" }
          user_assigned: { en: "a separately managed identity, authorised before the workspace exists", de: "eine separat verwaltete Identität, die vor dem Arbeitsbereich berechtigt wird" }
        accepts: [system_assigned, user_assigned]
        default: system_assigned
        why: >
          The workspace identity reads and writes the storage account, the vault, the
          registry and Application Insights on behalf of jobs and the studio. With
          `system_assigned` the service grants itself the roles it needs on creation; with
          `user_assigned` the identity must already hold them - `Storage Blob Data
          Contributor` and `Storage File Data Privileged Contributor` on the storage
          account, `Key Vault Administrator` or the equivalent on the vault, `AcrPull` and
          `AcrPush` on the registry, `Monitoring Metrics Publisher` on Application Insights,
          plus `Contributor` on the resource group for the managed resources - and a missing
          one fails the first job, not the deployment. User-assigned is for a customer-managed
          key, which needs the identity on the key before the workspace exists, and for a
          workspace whose roles are audited as one principal. `none` is not possible: the
          resource requires an identity.
        forced_when: >
          `key_management: customer_managed` forces `user_assigned`, recorded as forced with
          `key_management` as forced_by
        renders: managed_identities and primary_user_assigned_identity / managedIdentities and primaryUserAssignedIdentity

      - id: user_assigned_identity_ids
        ask:
          en: "Which user-assigned identity?"
          de: "Welche User-Assigned Identity?"
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        accepts: { ref: user_assigned_identity }
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          The identity that holds the roles listed above before the workspace is created. The
          first entry is the primary identity the workspace acts as.
        renders: >
          managed_identities.user_assigned_resource_ids and primary_user_assigned_identity /
          managedIdentities.userAssignedResourceIds and primaryUserAssignedIdentity

      - id: role_assignments
        ask:
          en: "Who needs which role on this workspace?"
          de: "Wer braucht welche Rolle auf diesem Workspace?"
        type: list
        plain:
          en: "Access rights on the workspace granted to: {value}."
          de: "Zugriffsrechte auf den Arbeitsbereich vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          `AzureML Data Scientist` for the people who run jobs and register models, `AzureML
          Compute Operator` for whoever creates and resizes compute, and the reader role for
          an auditor; `Contributor` on the group gives compute creation and the bill with it,
          and is a departure that names a person. A pattern fills this from the team it knows
          about. The workspace identity's own roles on its dependencies are wiring, not listed
          here.
        renders: role_assignments / roleAssignments

  # ----------------------------------------------------------------- security
  - id: security
    title: Security
    questions:
      - id: storage_datastore_auth
        ask:
          en: "How should the workspace reach its storage account?"
          de: "Wie soll der Workspace sein Speicherkonto erreichen?"
        type: enum
        plain:
          en: "The workspace reaches its storage account {value}."
          de: "Der Arbeitsbereich erreicht sein Speicherkonto {value}."
        plain_values:
          identity: { en: "with its identity, so the account keeps its keys switched off", de: "mit seiner Identität, so bleiben die Schlüssel des Kontos abgeschaltet" }
          access_key: { en: "with the storage account's key", de: "mit dem Schlüssel des Speicherkontos" }
        accepts: [identity, access_key]
        default: identity
        why: >
          The default datastores authenticate with the account key unless told otherwise,
          which forces shared-key access on the storage account and puts the key in the
          workspace's vault. `identity` uses the workspace identity (and the user's for the
          studio), which is what lets the storage set keep `shared_access_key_enabled` off.
          Users then need `Storage Blob Data Contributor` themselves, which `role_assignments`
          on the storage account carries - a pattern's wiring. The Terraform module defaults
          to `identity`, the Bicep module leaves it unset (key) - written.
        renders: storage_access_type / systemDatastoresAuthMode

      - id: key_management
        ask:
          en: "Are the workspace's encryption keys platform-managed or customer-managed?"
          de: "Werden die Schlüssel des Workspace von der Plattform verwaltet oder vom Kunden?"
        type: enum
        plain:
          en: "Encryption keys are {value}."
          de: "Verschlüsselungsschlüssel sind {value}."
        plain_values:
          platform_managed: { en: "managed by Azure - encrypted, rotated, no effort on your side", de: "von Azure verwaltet: verschlüsselt, rotiert, kein Aufwand bei euch" }
          customer_managed: { en: "your own, held in your key vault, so you can revoke them", de: "eure eigenen in eurem Schlüsseltresor, damit ihr sie zurückziehen könnt" }
        accepts: [platform_managed, customer_managed]
        from_deployment: key_management
        why: >
          Inherited, and **fixed at creation** for this resource. It covers the metadata the
          service stores for the workspace (run history, metrics, model registry entries); the
          data in the storage account is that account's own `key_management`. `customer_managed`
          pulls in the vault with purge protection, the user-assigned identity with wrap and
          unwrap, and `service_side_cmk` below.
        renders: customer_managed_key / customerManagedKey

      - id: cmk_key_vault_key_id
        ask:
          en: "Which Key Vault key should encrypt the workspace?"
          de: "Welcher Key-Vault-Schlüssel soll den Workspace verschlüsseln?"
        type: string
        plain:
          en: "Encrypted with your key {value}."
          de: "Verschlüsselt mit eurem Schlüssel {value}."
        accepts: { ref: key_vault_key }
        required: true
        depends_on: { question: key_management, equals: customer_managed }
        per_environment: true
        why: >
          The key must exist, the vault must have soft delete and purge protection, and the
          user-assigned identity must hold wrap and unwrap on it before the workspace is
          created. The reference is the unversioned key.
        renders: customer_managed_key.key_name and key_vault_resource_id / customerManagedKey.keyName and keyVaultResourceId

      - id: service_side_cmk
        ask:
          en: "Should the service keep the customer-key-encrypted metadata on its own side?"
          de: "Soll der Dienst die mit dem Kundenschlüssel verschlüsselten Metadaten auf seiner eigenen Seite halten?"
        type: bool
        plain:
          en: "Metadata encrypted with your key is kept {value}."
          de: "Mit eurem Schlüssel verschlüsselte Metadaten liegen {value}."
        plain_values:
          true: { en: "inside the service, encrypted with your key", de: "im Dienst, mit eurem Schlüssel verschlüsselt" }
          false: { en: "in a Cosmos DB, search service and storage account created in your subscription", de: "in einer Cosmos DB, einem Suchdienst und einem Speicherkonto in eurem Abonnement" }
        default: true
        depends_on: { question: key_management, equals: customer_managed }
        why: >
          The older customer-managed-key model creates a Cosmos DB account, a search service
          and a storage account in a managed resource group of your subscription - three
          billed resources no template owns, and the Cosmos DB alone is a noticeable line.
          Service-side encryption keeps the metadata in Microsoft's subscription, encrypted
          with your key, with nothing to pay for or patch. It is **fixed at creation**. Both
          modules default to `false`; written.
        renders: service_side_cmk_encryption_enabled / enableServiceSideCMKEncryption

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive diagnostics?"
          de: "Welcher Log Analytics Workspace soll die Diagnosedaten erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        from_deployment: diagnostics_destination
        per_environment: true
        why: >
          Inherited: one deployment, one destination. Without a diagnostic setting nobody can
          say who ran which job on which compute, or why a cluster did not scale.
        renders: diagnostic_settings / diagnosticSettings

      - id: diagnostic_categories
        ask:
          en: "Which log categories should be collected?"
          de: "Welche Log-Kategorien sollen erfasst werden?"
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          AmlComputeClusterEvent: { en: "cluster scale and node events", de: "Skalierungs- und Knotenereignisse der Cluster" }
          AmlComputeJobEvent: { en: "job submissions and their outcome per cluster", de: "Job-Einreichungen und ihr Ergebnis je Cluster" }
          AmlRunStatusChangedEvent: { en: "every change of a run's status", de: "jede Statusänderung eines Laufs" }
          AmlComputeCpuGpuUtilization: { en: "CPU and GPU utilisation of compute", de: "CPU- und GPU-Auslastung des Compute" }
          ComputeInstanceEvent: { en: "access to compute instances", de: "Zugriffe auf Compute-Instanzen" }
          ModelsChangeEvent: { en: "models registered, changed or deleted", de: "registrierte, geänderte oder gelöschte Modelle" }
          ModelsReadEvent: { en: "models read", de: "gelesene Modelle" }
          DeploymentReadEvent: { en: "endpoint deployments read", de: "gelesene Endpunkt-Bereitstellungen" }
          DataStoreChangeEvent: { en: "datastores created, changed or deleted", de: "angelegte, geänderte oder gelöschte Datastores" }
          DataSetChangeEvent: { en: "data assets created, changed or deleted", de: "angelegte, geänderte oder gelöschte Datenbestände" }
          EnvironmentChangeEvent: { en: "environments created, changed or deleted", de: "angelegte, geänderte oder gelöschte Umgebungen" }
          ManagedNetworkEvent: { en: "managed network provisioning and rule changes", de: "Aufbau des verwalteten Netzes und Regeländerungen" }
        accepts: [AmlComputeClusterEvent, AmlComputeJobEvent, AmlRunStatusChangedEvent, AmlComputeCpuGpuUtilization, ComputeInstanceEvent, ModelsChangeEvent, ModelsReadEvent, DeploymentReadEvent, DataStoreChangeEvent, DataSetChangeEvent, EnvironmentChangeEvent, ManagedNetworkEvent]
        default: [AmlComputeClusterEvent, AmlComputeJobEvent, AmlRunStatusChangedEvent, ModelsChangeEvent, DataStoreChangeEvent, ManagedNetworkEvent]
        why: >
          The cluster, job and run events are the operational record - who ran what, where,
          and why a job waited; the change events on models, datastores and environments
          are the audit trail a model governance review asks for; the managed network log
          explains a blocked outbound call. The read events and the utilisation series are
          volume lines, added for a workspace under audit or when a job's efficiency is the
          question. The names are the platform's and are checked against `az monitor
          diagnostic-settings categories list --resource <workspace id>` before a render,
          not remembered; the list is long and moves.
        renders: diagnostic_settings.<key>.log_categories / diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask:
          en: "Should all metrics be collected?"
          de: "Sollen alle Metriken erfasst werden?"
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: "collected", de: "erfasst" }
          false: { en: "not collected", de: "nicht erfasst" }
        default: true
        why: >
          Active and idle cores, quota use, queued and failed runs - the numbers behind a
          quota request and a cost review.
        renders: metrics[].category = "AllMetrics" / metricCategories[].category
