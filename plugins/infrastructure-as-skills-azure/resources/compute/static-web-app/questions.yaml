schema_version: 1

resource: Microsoft.Web/staticSites
title: Azure Static Web Apps

naming:
  terraform: "Azure::Microsoft.Web/staticSites"
  bicep: "Microsoft.Web/staticSites"
  # Bicep assembles the name from vars - this is the prefix it renders. The name is 2-60
  # characters, letters, digits and hyphens, unique within the resource group; the generated
  # hostname is random and is not derived from it.
  abbreviation: "stapp"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform. A private Static Web App needs a zone that carries the app's partition id, which only exists after the app does; the module's own zone creation is switched off."
  - "Does not create the Log Analytics workspace or the Application Insights component of a backend. The service has no diagnostic setting the AVM modules expose; see the notes."
  - "Does not link a repository, hold a repository token or deploy content. The pipeline deploys with the app's deployment token, read at deploy time and never rendered."
  - "Does not render custom domains and their certificates, the routing and authentication rules in `staticwebapp.config.json`, basic authentication for preview environments, linked backends (Functions, App Service, Container Apps), managed API functions' app settings or the enterprise-grade CDN. Each is content or a separate concern and has no question set yet."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        answer: { context: environments }
        why: >
          Drives the rendered name and the strictness of several defaults below. Nothing
          sensible can be guessed. One Static Web App is one site with its own preview
          environments; a stage is a separate app, not a preview environment.

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        answer: { context: location }
        why: >
          **Only a handful of regions are offered** (West US 2, Central US, East US 2, West
          Europe and East Asia at the time of writing; read from the module README or `az
          provider show` before a render, not recalled). The region holds the app's metadata and
          its managed functions; the static content is served from edge locations worldwide, so
          the region is not where the visitors are. It is part of the rendered name.

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        answer: { context: resource_group_name }
        per_environment: true
        why: >
          The app is placed into an existing group. Creating one here would make this set own a
          lifecycle wider than the resource it describes.

  # ----------------------------------------------------------- static web app
  - id: static_web_app
    title: The app
    questions:
      - id: sku
        ask:
          en: "Which plan?"
          de: "Welcher Plan?"
        type: enum
        plain:
          en: "The app is on the {value} plan."
          de: "Die App ist im Tarif {value}."
        plain_values:
          Free: { en: "free, for a hobby or a prototype - no uptime guarantee, no private connection, no custom login providers, small limits", de: "kostenlos, für Hobby oder Prototyp - keine Verfügbarkeitszusage, keine private Anbindung, keine eigenen Login-Anbieter, kleine Grenzen" }
          Standard: { en: "standard, with an uptime guarantee, a private connection, custom login providers and larger limits", de: "Standard, mit Verfügbarkeitszusage, privater Anbindung, eigenen Login-Anbietern und größeren Grenzen" }
        accepts: [Free, Standard]
        answer:
          question: outage_impact
          map: { tolerable: Free, disruptive: Standard, critical: Standard }
        why: >
          Derived from how bad an outage is: `Standard` carries the 99.95% SLA and is billed per
          app per month; `Free` has none and a bandwidth cap that ends in a throttled site, not a
          bill. **A private endpoint, custom authentication with the company directory, more than
          two custom domains and more preview environments are Standard-only** - a private site
          is therefore `Standard` whatever the requirement says. No `non_production_default`: a
          development app on `Free` could not take the private endpoint production needs, and
          the difference in cost is the price of one app.
        forced_when: >
          `deployment.network_exposure: private` (a private endpoint) forces `Standard`, recorded
          as forced with `network_exposure` as forced_by

      - id: preview_environments_enabled
        ask:
          en: "Should every pull request get a temporary copy of the site?"
          de: "Soll jeder Pull Request eine temporäre Kopie der Seite bekommen?"
        type: bool
        plain:
          en: "Temporary preview copies of the site for pull requests are {value}."
          de: "Temporäre Vorschau-Kopien der Seite für Pull Requests sind {value}."
        plain_values:
          true: { en: "created, each under its own address", de: "angelegt, jede unter eigener Adresse" }
          false: { en: "not created", de: "nicht angelegt" }
        default: false
        why: >
          A preview environment is a full copy of the **unreviewed** site, reachable under its own
          generated hostname - on a public app by anyone who has the URL, unless basic
          authentication or the company login is put in front. Convenient for a review, an
          unlisted publication of work in progress otherwise. A deliberate opt-in for a pipeline
          that uses them, with the gate named. **Both modules default to on**, so it is written.
          Free allows 3, Standard 10.

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask:
          en: "Should this app depart from the deployment's exposure posture?"
          de: "Soll diese App von der Erreichbarkeit des Deployments abweichen?"
        type: enum
        plain:
          en: "The app is {value}."
          de: "Die App ist {value}."
        plain_values:
          disabled: { en: "not reachable from the internet at all, only through a private connection", de: "aus dem Internet überhaupt nicht erreichbar, nur über eine private Anbindung" }
          enabled: { en: "reachable from the internet", de: "aus dem Internet erreichbar" }
        accepts: [disabled, enabled]
        answer: { deployment: network_exposure, map: { private: disabled, private_with_exceptions: disabled, public: enabled } }
        why: >
          Asked only as a departure: exposure is a property of the system. `private` is
          `disabled`, `public` is `enabled`; there is no firewall allowlist on a Static Web App,
          so no `enabled_with_firewall` (restricting a public site to an address range is a
          routing rule in `staticwebapp.config.json`, which is content). With `disabled` the site
          is reachable only through the private endpoint below, and so are the **deployments**:
          the pipeline that publishes the content must run inside the network. **The Terraform
          module defaults to public access on**; Bicep leaves it unset and disables it only when
          a private endpoint is given - written either way. Needs `Standard`.
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces `enabled`,
          recorded as forced with `network_ownership` as forced_by: the deployment's own callers
          have no fixed outbound address, so a closed resource locks them out

      - id: private_endpoint_subnet
        ask:
          en: "Which subnet should this app's private endpoint live in?"
          de: "In welchem Subnetz soll der Private Endpoint dieser App liegen?"
        type: string
        resolved_by: derived
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        accepts: { ref: subnet }
        answer: { deployment: private_endpoint_subnet }
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited. The app has
          one sub-resource, `staticSites`. **The app's hostname contains a partition id assigned
          when the app is created** (`<name>.<partition>.<n>.azurestaticapps.net`), and the DNS
          zone for the private endpoint is `privatelink.<partition>.azurestaticapps.net` - a zone
          that cannot exist before the app does. The platform zone therefore cannot be
          pre-provisioned, which is the usual snag: under `private_dns_records: policy` the policy
          has to create it, and under `deployment` it is created after the app, named from the partition id in the app's
          default hostname.

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity and access
    questions:
      - id: managed_identity
        ask:
          en: "Which managed identity should the app carry?"
          de: "Welche Managed Identity soll die App tragen?"
        type: enum
        plain:
          en: "The app has {value}."
          de: "Die App hat {value}."
        plain_values:
          none: { en: "no identity of its own", de: "keine eigene Identität" }
          system_assigned: { en: "its own identity", de: "eine eigene Identität" }
          user_assigned: { en: "a separately managed identity", de: "eine separat verwaltete Identität" }
        accepts: [none, system_assigned, user_assigned]
        default: none
        why: >
          A static site has no server code to hold an identity. The identity is for the app's
          **managed API functions and Key Vault references in its app settings**; a site that
          serves files and nothing else carries none. Where the settings read Key Vault secrets,
          the identity holds the secret-reader role on the vault before the first deployment,
          which is why that case is `user_assigned`.

      - id: user_assigned_identity_ids
        ask:
          en: "Which user-assigned identity?"
          de: "Welche User-Assigned Identity?"
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        accepts: { ref: user_assigned_identity }
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: The identity must already exist; this set does not create it or grant its roles.

      - id: role_assignments
        ask:
          en: "Who may manage the app?"
          de: "Wer darf die App verwalten?"
        type: list
        plain:
          en: "Management rights on the app granted to: {value}."
          de: "Verwaltungsrechte an der App vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Azure RBAC on the app - the control plane. `Website Contributor` or `Static Web App
          Contributor` for the deploying principal, scoped to the app. The visitors' access to
          the site is not Azure RBAC at all: it is the login and the routes in
          `staticwebapp.config.json`. Empty is a normal answer.
