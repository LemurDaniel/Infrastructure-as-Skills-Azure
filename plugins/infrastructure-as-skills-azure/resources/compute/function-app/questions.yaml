schema_version: 1

resource: Microsoft.Web/sites
title: Azure Functions (function app on Flex Consumption or Elastic Premium)

# A function app is a `Microsoft.Web/sites` of `kind: functionapp`, the same ARM type as an
# App Service web app and the same AVM module (`web/site`). What differs is the plan it runs on,
# the storage account the host needs, and how it is deployed - which is why it has a set of its
# own. The plan (Microsoft.Web/serverFarms, abbreviation `plan`) is created with it and decided
# in the `hosting` group. One function app per plan.
naming:
  terraform: "Azure::Microsoft.Web/sites"
  bicep: "Microsoft.Web/sites"
  # Bicep assembles the name from vars - this is the prefix it renders (the `function` kind).
  abbreviation: "func"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create the storage account the Functions host needs; it expects one (the storage set creates it) and refers to it in `host_storage_account`."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform."
  - "Does not create the Log Analytics workspace or the Application Insights component it refers to."
  - "Does not create the integration subnet when the network is referenced; under network_ownership: create the virtual-network set carries it, with the delegation."
  - "Does not grant the app's identity its roles on the host storage, the vault or the services it calls - wiring between resources, owned by a pattern."
  - "Does not set application settings or connection strings. They are deployment configuration, and a secret is a Key Vault reference resolved with the app's identity, never a value."
  - "Does not render triggers, bindings, function code, deployment slots, custom domains, Easy Auth or Logic Apps (Standard), which is the same module with another `kind` and different decisions."
  - "Does not render the Consumption (Y1) plan or Functions on a dedicated App Service plan shared with web apps."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        answer: { context: environments }
        why: >
          Drives the rendered name and the strictness of several defaults below.
          Nothing sensible can be guessed.

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        answer: { context: location }
        why: >
          Part of the rendered name. **Flex Consumption is not offered in every region**, and
          neither are zone redundancy and the larger instance sizes, so the region constrains
          the hosting group below - check the region before the interview ends.

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        answer: { context: resource_group_name }
        per_environment: true
        why: >
          The plan and the app are placed into an existing group. Creating one here would make
          this set own a lifecycle wider than the resources it describes.

  # ------------------------------------------------------------------ hosting
  - id: hosting
    title: Hosting plan
    questions:
      - id: plan_type
        ask:
          en: "How should the function app be hosted?"
          de: "Wie soll die Function App gehostet werden?"
        type: enum
        plain:
          en: "The function app runs on {value}."
          de: "Die Function App läuft auf {value}."
        plain_values:
          flex_consumption: { en: "capacity that scales from zero and is billed by use, with a private network and optional warm instances", de: "Kapazität, die von null aus skaliert und nach Nutzung abgerechnet wird, mit privatem Netz und optional vorgewärmten Instanzen" }
          elastic_premium: { en: "reserved warm instances that also scale out, billed for what is reserved", de: "reservierten, vorgewärmten Instanzen, die zusätzlich skalieren, abgerechnet wird die Reservierung" }
        accepts: [flex_consumption, elastic_premium]
        default: flex_consumption
        why: >
          Flex Consumption is the current serverless plan and the one that fits a private
          deployment: it integrates with a virtual network, takes private endpoints, scales to
          zero and bills per execution, and has no content share, so no storage file share to
          secure. Elastic Premium is for a function that needs Windows, a runtime or a
          feature Flex does not have, or reserved capacity at all times, and is billed for its
          warm instances whether used or not. The classic Consumption plan (Y1) is left out: it
          has no private networking worth the name. **The plan type is fixed at creation** -
          Linux for Flex, and an app does not move between plan types, it is redeployed.

      - id: runtime_stack
        ask:
          en: "Which language or runtime does the function app run?"
          de: "Welche Sprache oder Laufzeit verwendet die Function App?"
        type: enum
        resolved_by: interview
        topic: application
        plain:
          en: "The function app is written for {value}."
          de: "Die Function App ist geschrieben für {value}."
        plain_values:
          dotnet-isolated: { en: ".NET (isolated worker)", de: ".NET (isolierter Worker)" }
          node: { en: "Node.js", de: "Node.js" }
          python: { en: "Python", de: "Python" }
          java: { en: "Java", de: "Java" }
          powershell: { en: "PowerShell", de: "PowerShell" }
        accepts: [dotnet-isolated, node, python, java, powershell]
        required: true
        why: >
          The one decision here nothing can default: the plan does not care, the app does, and
          a wrong stack deploys cleanly and fails at the first trigger. The in-process .NET model
          is not offered - it is retired. Taken from deployment.app_runtime where it maps (.NET
          -> dotnet-isolated, Node.js, Python, Java), recorded `deployment`; asked only for a
          function app in another language than the application, or when app_runtime is a
          container or PHP. Nobody answering makes it an `open:` entry owned by the workload
          owner, blocking apply.

      - id: runtime_version
        ask:
          en: "Which version of the runtime?"
          de: "Welche Version der Laufzeit?"
        type: string
        plain:
          en: "Runtime version {value}."
          de: "Laufzeit-Version {value}."
        required: true
        why: >
          Pinned, never `latest`: a runtime moves under an app only when someone chooses, and
          the choice is a deployment. A version the platform still supports - it retires
          runtimes, and a retired one stops receiving security patches before it stops running.
          The spelling differs by stack and plan and is looked up in the platform's current
          list at render time, not remembered.

      - id: zone_redundant
        ask:
          en: "Should the plan survive the loss of an availability zone?"
          de: "Soll der Plan den Ausfall einer Verfügbarkeitszone überstehen?"
        type: bool
        plain:
          en: "The function app {value} survive the loss of one datacenter of the region."
          de: "Die Function App {value} den Ausfall eines Rechenzentrums der Region."
        plain_values:
          true: { en: "does", de: "übersteht" }
          false: { en: "does not", de: "übersteht nicht" }
        answer:
          question: outage_impact
          map: { tolerable: false, disruptive: true, critical: true }
        non_production_default: false
        why: >
          Derived from how bad an outage is. Zone redundancy spreads the instances over zones;
          it is set when the plan is created, needs a region with zones and, on Elastic
          Premium, at least two instances. Whether Flex Consumption offers it in the chosen
          region is checked against the platform before a render, not assumed. `critical` has
          the same value as `disruptive` because a function app is regional: a second region is
          a second deployment, a pattern. The derivation is production's; the non-production
          stages take `false` while non_production_savings is enabled.
        forced_when: >
          `true` on Elastic Premium forces at least 2 always-ready instances

      - id: max_instance_count
        ask:
          en: "How many instances may the function app scale out to?"
          de: "Auf wie viele Instanzen darf die Function App skalieren?"
        type: int
        plain:
          en: "The function app may scale out to at most {value} instances."
          de: "Die Function App darf auf höchstens {value} Instanzen skalieren."
        default: 20
        why: >
          A ceiling on cost and on the systems the function calls: a trigger that fans out
          under a flood takes the database or the API behind it with it. Twenty is a guard, not
          a measurement, and the real ceiling is the downstream system's. The platform's own
          maximum is far higher, and Flex bills per execution, so an unbounded function is an
          unbounded bill.

      - id: always_ready_instances
        ask:
          en: "How many instances should stay warm?"
          de: "Wie viele Instanzen sollen warm bleiben?"
        type: int
        plain:
          en: "{value} instance(s) are kept warm so the first call does not wait."
          de: "{value} Instanz(en) werden vorgewärmt gehalten, damit der erste Aufruf nicht wartet."
        answer:
          question: outage_impact
          map: { tolerable: 0, disruptive: 1, critical: 2 }
        non_production_default: 0
        why: >
          Derived from the same answer. Zero scales to nothing when idle: cheapest, and the
          first call after idle pays a cold start. One keeps the HTTP trigger answering at once;
          two keeps answering while an instance is replaced. Always-ready instances are billed
          for their baseline whether or not they run work. The count is for the HTTP trigger;
          other triggers are the application's.
        forced_when: >
          On Elastic Premium this is the plan's minimum instance count, and zone redundancy
          forces at least 2

      - id: instance_memory_mb
        ask:
          en: "How much memory should each instance get?"
          de: "Wie viel Arbeitsspeicher soll jede Instanz bekommen?"
        type: enum
        plain:
          en: "Each instance gets {value} MB of memory."
          de: "Jede Instanz bekommt {value} MB Arbeitsspeicher."
        accepts: [2048, 4096]
        default: 2048
        depends_on: { question: plan_type, equals: flex_consumption }
        why: >
          Flex Consumption bills memory-seconds, so the size is the cost per execution: 2 GB is
          the smaller and cheaper, and the module default. 4 GB for a function that holds data in
          memory. An instance that runs out restarts, which looks like a flaky trigger.

  # ------------------------------------------------------------------ storage
  - id: storage
    title: Host storage
    questions:
      - id: host_storage_account
        ask:
          en: "Which storage account does the Functions host use?"
          de: "Welches Speicherkonto verwendet der Functions-Host?"
        type: string
        plain:
          en: "The function app keeps its own state in the storage account {value}."
          de: "Die Function App hält ihren eigenen Zustand im Speicherkonto {value}."
        accepts: { ref: storage_account }
        required: true
        per_environment: true
        why: >
          Every plan needs one: it holds the host's function keys, timer-trigger singleton locks
          and trigger metadata (`AzureWebJobsStorage`), and, on Flex, the blob container with the
          deployment package. It is not the workload's data store and must not be - the host
          writes to it constantly and a lifecycle rule or a firewall made for data can break the
          app. A storage account of its own for the host is the usual answer; the storage set
          decides it, with shared-key access off and the account reachable from the app's network.
          The account must exist and be reachable before the app is created.

      - id: host_storage_auth
        ask:
          en: "How does the function app sign in to its storage account?"
          de: "Wie meldet sich die Function App an ihrem Speicherkonto an?"
        type: enum
        plain:
          en: "The function app signs in to its storage with {value}."
          de: "Die Function App meldet sich an ihrem Speicher an mit {value}."
        plain_values:
          identity: { en: "its managed identity, with no secret stored", de: "ihrer verwalteten Identität, ohne gespeichertes Geheimnis" }
        accepts: [identity]
        default: identity
        why: >
          The identity, always: a connection string is not offered, and neither rendering
          reference writes one - `local_auth: allowed_where_unavoidable` does not reach it. A storage key in an app
          setting is a long-lived secret with full access to the account, visible to anyone with
          read on the app, and it cannot work against an account whose shared-key access is
          off - which the storage set turns off by default. **There are two connections on
          Flex and both are set**: the host's own (`storage_uses_managed_identity`) and the one
          that reads the deployment package (`storage_authentication_type`). The identity needs
          `Storage Blob Data Owner` on the account, and `Storage Table Data Contributor` if the
          host is to write diagnostic events, before the app starts.

      - id: deployment_container
        ask:
          en: "In which container is the deployment package kept?"
          de: "In welchem Container liegt das Deployment-Paket?"
        type: string
        plain:
          en: "The deployed code is kept in the container {value}."
          de: "Der ausgerollte Code liegt im Container {value}."
        default: app-package
        depends_on: { question: plan_type, equals: flex_consumption }
        why: >
          Flex runs the code from a zip in a blob container of the host storage account, not
          from a file share. The container is created by the storage set, and the app's
          identity needs blob data rights on it. The default is the platform's naming; a second
          function app on the same account takes a different name.

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask:
          en: "Should this function app depart from the deployment's exposure posture?"
          de: "Soll diese Function App von der Erreichbarkeit des Deployments abweichen?"
        type: enum
        plain:
          en: "The function app is {value}."
          de: "Die Function App ist {value}."
        plain_values:
          disabled: { en: "not reachable from the internet at all", de: "aus dem Internet überhaupt nicht erreichbar" }
          enabled_with_firewall: { en: "reachable from the internet only from listed addresses", de: "aus dem Internet nur von gelisteten Adressen erreichbar" }
          enabled: { en: "reachable from the internet", de: "aus dem Internet erreichbar" }
        accepts: [disabled, enabled_with_firewall, enabled]
        answer: { deployment: network_exposure, map: { private: disabled, private_with_exceptions: disabled, public: enabled_with_firewall } }
        why: >
          Asked only as a departure: exposure is a property of the system. `private` is
          `disabled`, `public` is `enabled_with_firewall`. A function with an HTTP trigger is
          reachable by design only if it is meant to be; a bare `enabled` is a recorded departure
          and means no access restrictions at all. With `disabled` the app answers only through
          its private endpoint - which also closes the Kudu/SCM site - and **non-HTTP triggers
          still work**, because they pull from their sources instead of being called.
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces
          `enabled`, recorded as forced with `network_ownership` as forced_by: the
          deployment's own callers have no fixed outbound address, so a firewall with no
          rule locks them out of this resource - the first dry run (2026-10-24) hit it on
          five resources at once

      - id: private_endpoint_subnet
        ask:
          en: "Which subnet should this function app's private endpoint live in?"
          de: "In welchem Subnetz soll der Private Endpoint dieser Function App liegen?"
        type: string
        resolved_by: derived
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        accepts: { ref: subnet }
        answer: { deployment: private_endpoint_subnet }
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited. The app
          has exactly one sub-resource, `sites`.

      - id: vnet_integration
        ask:
          en: "Does the function call services that are only reachable privately?"
          de: "Ruft die Function Dienste auf, die nur privat erreichbar sind?"
        type: bool
        plain:
          en: "The function app's own outgoing traffic {value}."
          de: "Der ausgehende Verkehr der Function App {value}."
        plain_values:
          true: { en: "goes through the company network, so it can reach private services", de: "läuft durch das Firmennetz, so erreicht sie private Dienste" }
          false: { en: "goes out over the public internet", de: "geht über das öffentliche Internet raus" }
        default: true
        why: >
          The private endpoint is for traffic *into* the app; calls *out* of it - to the host
          storage, a database, a vault behind their own private endpoints - need regional VNet
          integration. **The host storage is the one that is forgotten**: with its firewall
          closed, an app without integration cannot start, and the failure is a host error and not
          a configuration one. False is for an app that calls only public services and uses no
          private storage, and `network_ownership: none` forces it.
        forced_when: >
          network_ownership: none (deployment) forces `false` - there is no subnet to integrate into

      - id: integration_subnet
        ask:
          en: "Which subnet does the function app's outgoing traffic leave through?"
          de: "Über welches Subnetz verlässt der ausgehende Verkehr der Function App das Netz?"
        type: string
        resolved_by: derived
        plain:
          en: "Outgoing traffic leaves through the subnet {value}."
          de: "Ausgehender Verkehr verlässt das Netz über das Subnetz {value}."
        accepts: { ref: subnet }
        required: true
        depends_on: { question: vnet_integration, equals: true }
        per_environment: true
        why: >
          The subnet must be delegated, and **the delegation differs by plan**: Flex Consumption
          delegates to `Microsoft.App/environments` (at least a /27, a /26 for several apps),
          Elastic Premium to `Microsoft.Web/serverFarms` (at least a /28, a /26 on Linux; both
          per Microsoft Learn, 2026-10-25). Exclusive to one plan either way, and sized with
          headroom for scale-out. The platform's subnet when the network is referenced, a subnet
          of the created network otherwise, where the virtual-network set carries it with the
          delegation.
        forced_when: >
          network_ownership: create - the created network's subnet, recorded as forced with the
          network as forced_by

      - id: vnet_route_all
        ask:
          en: "Should all outgoing traffic go through the network, or only traffic to private addresses?"
          de: "Soll der gesamte ausgehende Verkehr durch das Netz gehen oder nur der Verkehr an private Adressen?"
        type: bool
        plain:
          en: "Outgoing traffic is routed {value}."
          de: "Ausgehender Verkehr wird {value} geleitet."
        plain_values:
          true: { en: "entirely through the company network, including to the internet", de: "komplett durch das Firmennetz geleitet, auch ins Internet" }
          false: { en: "through the company network only to private addresses", de: "nur für private Adressen durch das Firmennetz geleitet" }
        default: true
        depends_on: { question: vnet_integration, equals: true }
        why: >
          Without it only traffic to private addresses enters the VNet; the rest leaves from the
          platform's shared addresses, past the firewall and route table the landing zone built
          for exactly this. It also decides whose DNS the app uses - the VNet's, which resolves
          private endpoints. True means the egress goes through whatever the subnet's route table
          says, and a function that calls a public API needs that path allowed.

      - id: ip_restrictions
        ask:
          en: "Which public IP ranges may reach the function app?"
          de: "Welche öffentlichen IP-Bereiche dürfen die Function App erreichen?"
        type: list
        plain:
          en: "Public addresses allowed to reach the function app: {value}."
          de: "Öffentliche Adressen, die die Function App erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist with a default action of Deny, applied to the Kudu/SCM site as
          well. `0.0.0.0/0` is not an allowlist and is rejected by the guardrails.

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity and access
    questions:
      - id: managed_identity
        ask:
          en: "Which managed identity should the function app carry?"
          de: "Welche Managed Identity soll die Function App tragen?"
        type: enum
        plain:
          en: "The function app has {value} for reaching other services."
          de: "Die Function App hat {value}, um andere Dienste zu erreichen."
        plain_values:
          system_assigned: { en: "its own identity", de: "eine eigene Identität" }
          user_assigned: { en: "a shared, separately managed identity", de: "eine gemeinsame, separat verwaltete Identität" }
        accepts: [system_assigned, user_assigned]
        default: user_assigned
        why: >
          **Differs from App Service's default, and for the same reason as Container Apps.** The
          host reads and writes its storage account as it starts, and the deployment package is
          read before the first instance runs, so the identity must hold its blob roles *before
          the app exists* - which a system-assigned identity, created with the app, cannot.
          Creating the app first yields a host that cannot start, and the error says storage, not
          identity. A user-assigned identity with its roles granted first is the order that works,
          and the one that gives a Key Vault reference its role. `none` is not offered: an app
          with identity-based storage has one by definition.

      - id: user_assigned_identity_ids
        ask:
          en: "Which user-assigned identity?"
          de: "Welche User-Assigned Identity?"
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        accepts: { ref: user_assigned_identity }
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          The identity must already exist and hold its roles on the host storage; this set does
          not create it or grant them.

      - id: role_assignments
        ask:
          en: "Who may manage the function app?"
          de: "Wer darf die Function App verwalten?"
        type: list
        plain:
          en: "Management rights on the function app granted to: {value}."
          de: "Verwaltungsrechte an der Function App vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Azure RBAC on the app - the control plane. Usually the deploying principal's alone, so
          empty is a normal answer.

  # ----------------------------------------------------------------- security
  - id: security
    title: Security
    questions:
      - id: https_only
        ask:
          en: "Should the function app refuse plain HTTP?"
          de: "Soll die Function App unverschlüsseltes HTTP ablehnen?"
        type: bool
        plain:
          en: "Unencrypted connections are {value}."
          de: "Unverschlüsselte Verbindungen werden {value}."
        plain_values:
          true: { en: "redirected to the encrypted address", de: "auf die verschlüsselte Adresse umgeleitet" }
          false: { en: "accepted", de: "akzeptiert" }
        default: true
        why: >
          No current reason to serve HTTP, and the redirect is free. A question only so that a
          departure is recorded rather than silently impossible. The module default is already
          true; written anyway.

      - id: min_tls_version
        ask:
          en: "What is the minimum TLS version?"
          de: "Welche TLS-Version ist mindestens erforderlich?"
        type: enum
        plain:
          en: "Connections must use at least {value} encryption."
          de: "Verbindungen müssen mindestens {value}-Verschlüsselung nutzen."
        plain_values:
          "1.2": { en: "TLS 1.2", de: "TLS 1.2" }
          "1.3": { en: "TLS 1.3", de: "TLS 1.3" }
        accepts: ["1.2", "1.3"]
        default: "1.2"
        why: >
          1.2 is the floor and non-negotiable; 1.3 is preferable where every client supports it,
          but an unsupported floor fails as an opaque connection reset, so raise it deliberately.
          The AVM Terraform module's default is 1.3, which is why it is written on the call.

      - id: basic_auth_enabled
        ask:
          en: "Should publishing with a username and password stay possible?"
          de: "Soll das Veröffentlichen mit Benutzername und Passwort möglich bleiben?"
        type: bool
        plain:
          en: "Deploying with a user name and password is {value}; deployments run through company accounts."
          de: "Das Ausrollen mit Benutzername und Passwort ist {value}; Rollouts laufen über Firmenkonten."
        plain_values:
          true: { en: "possible", de: "möglich" }
          false: { en: "not possible", de: "nicht möglich" }
        answer: { deployment: local_auth, map: { disabled: false, allowed_where_unavoidable: false } }
        why: >
          Inherited: `local_auth: disabled` renders as `false`. The publishing profile is a
          shared password for the Kudu site and FTP, does not expire and is not attributable.
          Two switches (FTP and SCM) and both are written; the AVM Terraform module's SCM default
          is true. Flex Consumption deploys through the storage container and has no
          publishing profile to switch, which the render confirms against the platform.

      - id: application_insights
        ask:
          en: "Which Application Insights component should receive the function app's telemetry?"
          de: "Welche Application-Insights-Komponente soll die Telemetrie der Function App erhalten?"
        type: string
        plain:
          en: "Its application telemetry goes to {value} (empty: none)."
          de: "Seine Anwendungstelemetrie geht an {value} (leer: keine)."
        accepts: { ref: application_insights }
        default: ""
        per_environment: true
        forced_when: >
          `application_monitoring: enabled` sets it to the deployment's application-insights
          component, recorded as forced with `application_monitoring` as forced_by
        why: >
          Application Insights is where a function's invocations, failures and dependencies are
          read; without it the host's own log is the only trace. The deployment's
          `application_monitoring` brings the component and sets this; empty only when it is
          disabled, and a function app with no component still logs to the diagnostic setting below.
          With the component's local authentication off (the default) the app also gets
          `APPLICATIONINSIGHTS_AUTHENTICATION_STRING` = `Authorization=AAD` (`;ClientId=<client id>`
          for a user-assigned identity) and its identity `Monitoring Metrics Publisher` on the
          component - infrastructure, always rendered. The
          component is workspace-based, and the connection string - not the instrumentation key -
          is the setting, because the key is being retired.

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive diagnostics?"
          de: "Welcher Log Analytics Workspace soll die Diagnosedaten erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        answer: { deployment: diagnostics_destination }
        per_environment: true
        why: >
          Inherited: one deployment, one destination. A function with no diagnostic setting
          writes its logs to a file on the instance, which is gone when the instance is
          replaced - and on Flex, instances are replaced all the time.

      - id: diagnostic_categories
        ask:
          en: "Which log categories should be collected?"
          de: "Welche Log-Kategorien sollen erfasst werden?"
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          FunctionAppLogs: { en: "what the functions write to their log", de: "was die Funktionen in ihr Log schreiben" }
          AppServiceAuditLogs: { en: "who signed in to deploy or manage the app", de: "wer sich zum Ausrollen oder Verwalten angemeldet hat" }
          AppServiceHTTPLogs: { en: "every web request", de: "jede Web-Anfrage" }
        accepts: [FunctionAppLogs, AppServiceAuditLogs, AppServiceHTTPLogs]
        default: [FunctionAppLogs, AppServiceAuditLogs]
        why: >
          The function log is the only way to see what a function did and why it failed. The
          audit log says who deployed. HTTP logs are the volume line on a busy HTTP trigger and
          are a choice, not a default. The category names are the platform's and are checked
          against `az monitor diagnostic-settings categories list --resource <app id>` before a
          render, not remembered; on Flex they can differ from Premium.

      - id: metrics_enabled
        ask:
          en: "Should all metrics be collected?"
          de: "Sollen alle Metriken erfasst werden?"
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: "collected", de: "erfasst" }
          false: { en: "not collected", de: "nicht erfasst" }
        default: true
        why: >
          Execution count, units and instance count are what the cost of a function is read from,
          and what decides whether the instance bounds above were right.
