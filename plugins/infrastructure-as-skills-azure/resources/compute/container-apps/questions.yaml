schema_version: 1

resource: Microsoft.App/containerApps
title: Azure Container Apps (environment and one container app)

# The app is the resource; the managed environment it runs in (Microsoft.App/managedEnvironments,
# abbreviation `cae`, identifier `Azure::Microsoft.App/managedEnvironments`) is created with it
# and decided in the `environment` group. One app per environment here: an environment shared
# by several apps is a pattern's wiring, not this set's.
naming:
  terraform: "Azure::Microsoft.App/containerApps"
  bicep: "Microsoft.App/containerApps"
  # Bicep assembles the name from vars - this is the prefix it renders.
  abbreviation: "ca"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create the infrastructure subnet when the network is referenced; under network_ownership: create the virtual-network set carries it, with the delegation."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform. An internal environment needs a zone for its default domain, which is the platform's."
  - "Does not create the container registry, the Log Analytics workspace or the Key Vault it refers to."
  - "Does not grant the app's identity its roles (`AcrPull` on the registry, secret access on a vault) - wiring between resources, owned by a pattern; the app's identity must hold the pull role before the first revision, which is why the identity is user-assigned."
  - "Does not render secret values. A secret is a Key Vault reference resolved with the app's identity."
  - "Does not render Dapr, KEDA scale rules, jobs, session pools (dynamic sessions, as used for sandboxed code execution), custom domains, certificates, Easy Auth or health probes. Each is a separate concern and has no question set yet."
  - "Does not render several apps per environment, sidecars or init containers."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        answer: { context: environments }
        why: >
          Drives the rendered name and the strictness of several defaults below.
          Nothing sensible can be guessed.
        renders: naming parameter `environment`, and the tag of that name where the repository uses one

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        answer: { context: location }
        why: >
          Part of the rendered name. Zone redundancy and the dedicated workload profiles
          are not available in every region, so the region constrains the environment
          group below.
        renders: location (environment and app)

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        answer: { context: resource_group_name }
        per_environment: true
        why: >
          The environment and the app are placed into an existing group. The platform also
          creates a second, managed group for the environment's infrastructure; it is not
          this one and nothing is deployed into it.
        renders: parent_id / resource_group_name / implicit in Bicep scope

  # -------------------------------------------------------------- environment
  - id: environment
    title: Environment
    questions:
      - id: workload_profile
        ask:
          en: "Which compute should the app run on?"
          de: "Auf welcher Compute-Ressource soll die App laufen?"
        type: enum
        plain:
          en: "The app runs on {value}."
          de: "Die App läuft auf {value}."
        plain_values:
          Consumption: { en: "shared capacity that is billed per use and scales to nothing", de: "geteilter Kapazität, nach Nutzung abgerechnet und bis auf null skalierbar" }
          D4: { en: "reserved capacity of 4 cores, billed by the hour whether used or not", de: "reservierter Kapazität mit 4 Kernen, stundenweise abgerechnet, genutzt oder nicht" }
          D8: { en: "reserved capacity of 8 cores", de: "reservierter Kapazität mit 8 Kernen" }
          E4: { en: "reserved capacity of 4 cores with extra memory", de: "reservierter Kapazität mit 4 Kernen und mehr Arbeitsspeicher" }
        accepts: [Consumption, D4, D8, E4]
        default: Consumption
        why: >
          The environment is the workload-profiles kind, which the Bicep module asks for
          when zone redundancy is on (its README calls profiles required to be WAF compliant);
          the legacy consumption-only kind is not offered. `Consumption` is a profile of it: pay for the
          replicas that run, nothing idle. A dedicated profile (D, E) is for a steady load
          that wants reserved cores or more than the consumption sizes allow, and is billed
          for its instances whether the app is busy or not. GPU and the larger sizes are not
          offered. The profile is fixed per app but a profile can be added or removed from the
          environment.
        renders: workload_profiles / workloadProfiles and workload_profile_name / workloadProfileName on the app

      - id: zone_redundant
        ask:
          en: "Should the environment survive the loss of an availability zone?"
          de: "Soll die Umgebung den Ausfall einer Verfügbarkeitszone überstehen?"
        type: bool
        plain:
          en: "The environment {value} survive the loss of one datacenter of the region."
          de: "Die Umgebung {value} den Ausfall eines Rechenzentrums der Region."
        plain_values:
          true: { en: "does", de: "übersteht" }
          false: { en: "does not", de: "übersteht nicht" }
        answer:
          question: outage_impact
          map: { tolerable: false, disruptive: true, critical: true }
        non_production_default: false
        why: >
          Derived from how bad an outage is. Zone redundancy spreads the environment's
          infrastructure and the replicas over three zones; it needs a virtual network
          (the infrastructure subnet below), a region with zones and - for the replicas to be
          spread - **at least two replicas**, and **it is set when the environment is created**
          (it forces a new environment). Both AVM modules default it to true, so the
          derivation for `tolerable` is written as `false`. `critical` has the same value as
          `disruptive` because an environment is regional: a second region is a second
          deployment behind a global front door, a pattern. The non-production stages take
          `false` while non_production_savings is enabled.
        forced_when: >
          `true` forces `min_replicas` to at least 2 and requires `infrastructure_subnet`
        renders: zone_redundant / zoneRedundant

      - id: internal
        ask:
          en: "Should the environment be reachable only from inside the network?"
          de: "Soll die Umgebung nur aus dem Netz heraus erreichbar sein?"
        type: bool
        plain:
          en: "The environment is {value}."
          de: "Die Umgebung ist {value}."
        plain_values:
          true: { en: "reachable only from inside the company network, through an internal load balancer", de: "nur aus dem Firmennetz erreichbar, über einen internen Lastverteiler" }
          false: { en: "given a public address of its own", de: "mit einer eigenen öffentlichen Adresse versehen" }
        answer: { deployment: network_exposure }
        why: >
          Inherited: `private` renders as `true`, `public` as `false`. An internal environment
          has no public IP at all and is reached through an address in the infrastructure
          subnet; its default domain needs a private DNS zone, which is the platform's. It
          forces public network access off. **It is fixed at creation**: an environment is not
          switched between internal and external, it is rebuilt.
        renders: vnet_configuration.internal / internal

      - id: infrastructure_subnet
        ask:
          en: "Which subnet should the environment's infrastructure live in?"
          de: "In welchem Subnetz soll die Infrastruktur der Umgebung liegen?"
        type: string
        resolved_by: derived
        plain:
          en: "The environment's infrastructure lives in subnet {value}."
          de: "Die Infrastruktur der Umgebung liegt im Subnetz {value}."
        accepts: { ref: subnet }
        required: true
        per_environment: true
        why: >
          The subnet must be **delegated to `Microsoft.App/environments`**, used by nothing
          else and at least a /27 for a workload-profiles environment (more where replicas
          scale far: each takes an address). It is the platform's subnet when the network is
          referenced and a subnet of the created network otherwise, where the virtual-network
          set carries it with the delegation and this question is answered by that wiring.
          Required, because zone redundancy, internal exposure and routing through the
          platform's firewall all need a virtual network.
        forced_when: >
          network_ownership: create - the created network's subnet, recorded as forced with
          the network as forced_by
        renders: vnet_configuration.infrastructure_subnet_id / infrastructureSubnetResourceId

      - id: public_network_access
        ask:
          en: "Should the environment depart from the deployment's exposure posture?"
          de: "Soll die Umgebung von der Erreichbarkeit des Deployments abweichen?"
        type: enum
        plain:
          en: "The environment is {value}."
          de: "Die Umgebung ist {value}."
        plain_values:
          disabled: { en: "closed to all public traffic", de: "für jeden öffentlichen Verkehr gesperrt" }
          enabled: { en: "open to public traffic", de: "für öffentlichen Verkehr geöffnet" }
        accepts: [disabled, enabled]
        answer: { deployment: network_exposure }
        why: >
          The platform switch for all public traffic to the environment, beside `internal`.
          `private` is `disabled`, `public` is `enabled`; the firewalling of a public app is
          the app's ingress, not an account-level allowlist as on a storage account, so
          there is no `enabled_with_firewall` here. The AVM Bicep module defaults to
          `Disabled`, the Terraform module leaves it unset - written either way. With
          `internal: true` it is forced off by the Terraform module regardless.
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces
          `enabled`, recorded as forced with `network_ownership` as forced_by: the
          deployment's own callers have no fixed outbound address, so a firewall with no
          rule locks them out of this resource - the first dry run (2026-10-24) hit it on
          five resources at once
        renders: public_network_access / publicNetworkAccess

      - id: peer_traffic_encryption
        ask:
          en: "Should traffic between the apps of the environment be encrypted?"
          de: "Soll der Verkehr zwischen den Apps der Umgebung verschlüsselt werden?"
        type: bool
        plain:
          en: "Traffic between the apps inside the environment is {value}."
          de: "Der Verkehr zwischen den Apps innerhalb der Umgebung wird {value}."
        plain_values:
          true: { en: "encrypted", de: "verschlüsselt" }
          false: { en: "sent in the clear", de: "unverschlüsselt gesendet" }
        default: true
        why: >
          Inside an environment apps talk to each other over the environment's network;
          peer-to-peer encryption wraps that traffic, and mutual TLS authenticates the peers
          on top. A network that is shared with other workloads is where an unencrypted hop is
          sniffed. It costs a little latency. The Bicep module defaults to on, the Terraform
          module leaves it unset, so it is written.
        renders: peer_traffic_configuration.encryption.enabled / peerTrafficEncryption

  # ---------------------------------------------------------------------- app
  - id: app
    title: The app
    questions:
      - id: container_image
        ask:
          en: "Which container image should run?"
          de: "Welches Container-Image soll laufen?"
        type: string
        plain:
          en: "The app runs the container image {value}."
          de: "Die App führt das Container-Image {value} aus."
        required: true
        why: >
          Registry, repository and a **tag or digest that is not `latest`**: the first revision
          is created with this image, and a tag that moves under an unchanged template means
          the template no longer says what runs. The registry is expected to exist - and to be
          pulled from with the app's managed identity (`AcrPull`), not an admin user, which is
          wiring this set does not own. A private registry is pulled over the network the
          environment is in, so a registry with a private endpoint needs a route and its DNS.
          With no answer the decision is an `open:` entry owned by the workload owner.
        renders: template.containers[].image / containers[].image

      - id: container_size
        ask:
          en: "How large should each replica be?"
          de: "Wie groß soll jedes Replikat sein?"
        type: enum
        plain:
          en: "Each copy of the app gets {value}."
          de: "Jede Kopie der App bekommt {value}."
        plain_values:
          "0.25-0.5Gi": { en: "a quarter core and half a gigabyte", de: "einen Viertelkern und ein halbes Gigabyte" }
          "0.5-1Gi": { en: "half a core and one gigabyte", de: "einen halben Kern und ein Gigabyte" }
          "1-2Gi": { en: "one core and two gigabytes", de: "einen Kern und zwei Gigabyte" }
          "2-4Gi": { en: "two cores and four gigabytes", de: "zwei Kerne und vier Gigabyte" }
        accepts: ["0.25-0.5Gi", "0.5-1Gi", "1-2Gi", "2-4Gi"]
        default: "0.5-1Gi"
        why: >
          CPU and memory come in fixed pairs on the consumption profile. Half a core and a
          gigabyte is a start that a measured workload moves: replicas are billed for what they
          reserve while they run, so too large is paid every second and too small is an
          out-of-memory restart. A dedicated profile takes any combination up to the instance
          size, which this set does not model.
        renders: template.containers[].resources (cpu, memory) / containers[].resources

      - id: min_replicas
        ask:
          en: "How many copies of the app must always be running?"
          de: "Wie viele Kopien der App müssen immer laufen?"
        type: int
        plain:
          en: "At least {value} copies of the app are always running."
          de: "Mindestens {value} Kopien der App laufen immer."
        answer:
          question: outage_impact
          map: { tolerable: 0, disruptive: 2, critical: 3 }
        non_production_default: 1
        why: >
          Derived from how bad an outage is. Zero scales the app to nothing when idle - the
          cheapest answer, and the first request after idle pays a cold start; two is the
          minimum that keeps answering during a revision change or the loss of an instance and
          for zone redundancy to spread; three puts one in each zone. A non-production stage
          keeps one, because an app that scales to zero in development is not rehearsing the
          cold start production does not have. Billed per replica per second.
        forced_when: >
          `zone_redundant: true` forces at least 2
        renders: template.min_replicas / scale.minReplicas

      - id: max_replicas
        ask:
          en: "How many copies may the app scale out to?"
          de: "Auf wie viele Kopien darf die App skalieren?"
        type: int
        plain:
          en: "The app may scale out to at most {value} copies."
          de: "Die App darf auf höchstens {value} Kopien skalieren."
        default: 10
        why: >
          A ceiling on cost and on the downstream systems: an app that scales out without limit
          under a flood takes the database it calls with it. Ten is a guard, not a measurement,
          and the scale rule that drives it (HTTP concurrency by default) is the workload's.
          Custom scale rules are not rendered.
        renders: template.max_replicas / scale.maxReplicas

      - id: revision_mode
        ask:
          en: "Should several versions of the app run at once?"
          de: "Sollen mehrere Versionen der App gleichzeitig laufen?"
        type: enum
        plain:
          en: "{value}."
          de: "{value}."
        plain_values:
          Single: { en: "Only the newest version of the app runs; a new one replaces it", de: "Nur die neueste Version der App läuft; eine neue ersetzt sie" }
          Multiple: { en: "Several versions run side by side and traffic is split between them by hand", de: "Mehrere Versionen laufen nebeneinander, der Verkehr wird von Hand verteilt" }
        accepts: [Single, Multiple]
        default: Single
        why: >
          `Single` is a rolling replacement and what a pipeline that deploys on every merge
          wants. `Multiple` is for blue-green and canary releases, and needs the traffic
          weights a pipeline sets; left on with no weights it keeps every old revision running
          and billed. Not an infrastructure default to turn on speculatively.
        renders: revision_mode / activeRevisionsMode

  # ------------------------------------------------------------------ ingress
  - id: ingress
    title: Ingress
    questions:
      - id: ingress
        ask:
          en: "Who may call the app over HTTP?"
          de: "Wer darf die App über HTTP aufrufen?"
        type: enum
        plain:
          en: "The app is {value}."
          de: "Die App ist {value}."
        plain_values:
          none: { en: "not callable at all - it works on its own, as a worker", de: "gar nicht aufrufbar - sie arbeitet für sich, als Worker" }
          environment: { en: "callable only by other apps in its environment", de: "nur von anderen Apps ihrer Umgebung aufrufbar" }
          external: { en: "callable from outside its environment, as far as the environment itself is reachable", de: "von außerhalb ihrer Umgebung aufrufbar, soweit die Umgebung selbst erreichbar ist" }
        accepts: [none, environment, external]
        default: environment
        why: >
          The app's own front door, separate from the environment's. `environment` is the
          answer for an internal service - a code runner, an MCP server, a back-end called by
          the web app - and is the default because an app that nothing outside has to reach
          should not be. `external` means callable from outside the environment: on a public
          environment that is the internet, on an internal one the virtual network.
          **The modules disagree and Bicep's default is the open one**: `ingressExternal` is
          true, HTTP is allowed and the port is 80, where Terraform defaults to internal,
          HTTPS-only. Every ingress decision is written. `none` is for a worker that only
          pulls from a queue.
        forced_when: >
          `deployment.network_exposure: private` forbids `external` on a public environment;
          `external` is a recorded departure, the same rule as a bare `enabled` elsewhere
        renders: ingress.external_enabled / ingressExternal and disableIngress

      - id: target_port
        ask:
          en: "Which port does the app listen on?"
          de: "Auf welchem Port lauscht die App?"
        type: int
        plain:
          en: "The app listens on port {value}."
          de: "Die App lauscht auf Port {value}."
        required: true
        depends_on: { question: ingress, not_equals: none }
        why: >
          The port the container binds, and the one thing the platform cannot find out from the
          image: a mismatch deploys cleanly and fails every health probe. With no answer it is
          an `open:` entry owned by the workload owner.
        renders: ingress.target_port / ingressTargetPort

      - id: allow_insecure
        ask:
          en: "Should the app accept plain HTTP?"
          de: "Soll die App unverschlüsseltes HTTP annehmen?"
        type: bool
        plain:
          en: "Unencrypted connections to the app are {value}."
          de: "Unverschlüsselte Verbindungen zur App werden {value}."
        plain_values:
          true: { en: "accepted", de: "akzeptiert" }
          false: { en: "redirected to the encrypted address", de: "auf die verschlüsselte Adresse umgeleitet" }
        default: false
        depends_on: { question: ingress, not_equals: none }
        why: >
          No current reason to serve HTTP, and the redirect is free. **The Bicep module's
          default is `true`**, so an unwritten value is the insecure one; Terraform's is
          `false`. Both are written. A departure - a probe from an appliance that cannot do
          TLS - is named at this app.
        renders: ingress.allow_insecure_connections / ingressAllowInsecure

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity and access
    questions:
      - id: managed_identity
        ask:
          en: "Which managed identity should the app carry?"
          de: "Welche Managed Identity soll die App tragen?"
        type: enum
        plain:
          en: "The app has {value} for reaching other services."
          de: "Die App hat {value}, um andere Dienste zu erreichen."
        plain_values:
          system_assigned: { en: "its own identity", de: "eine eigene Identität" }
          user_assigned: { en: "a shared, separately managed identity", de: "eine gemeinsame, separat verwaltete Identität" }
          none: { en: "no identity of its own", de: "keine eigene Identität" }
        accepts: [system_assigned, user_assigned, none]
        default: user_assigned
        why: >
          **Differs from App Service's default, for one concrete reason.** The first revision
          pulls its image from a private registry and reads its secrets from a vault *while it
          is being created*, so the identity must hold `AcrPull` and the secret role **before
          the app exists** - which a system-assigned identity, created with the app, cannot.
          Creating the app first fails the pull, and the failure looks like a bad image. A
          user-assigned identity with the roles granted first is the order that works. `none`
          is for an app that pulls from a public registry and calls nothing.
        renders: managed_identities / managedIdentities (identity.type on the app)

      - id: user_assigned_identity_ids
        ask:
          en: "Which user-assigned identity?"
          de: "Welche User-Assigned Identity?"
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        accepts: { ref: user_assigned_identity }
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          The identity must already exist and hold its roles; this set does not create it or
          grant them. It is the one the registry entry and the secret references name.
        renders: managed_identities.user_assigned_resource_ids / managedIdentities.userAssignedResourceIds

      - id: secret_references
        ask:
          en: "Which secrets should the app read from a key vault?"
          de: "Welche Secrets soll die App aus einem Key Vault lesen?"
        type: list
        plain:
          en: "The app reads the secrets {value} from the key vault."
          de: "Die App liest die Geheimnisse {value} aus dem Schlüsseltresor."
        default: []
        per_environment: true
        why: >
          Each entry is a name and the **URL of a Key Vault secret**, resolved with the app's
          identity, and the app takes it as an environment variable. Never a value: an app
          secret in a template is in the deployment history. The URL is versionless where the
          app should follow a rotation. The identity needs the vault's secret-reader role
          before the first revision (see `managed_identity`).
        renders: secrets[].key_vault_secret_id and identity / secrets[].keyVaultUrl and identity

      - id: role_assignments
        ask:
          en: "Who may manage the app?"
          de: "Wer darf die App verwalten?"
        type: list
        plain:
          en: "Management rights on the app granted to: {value}."
          de: "Verwaltungsrechte an der App vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Azure RBAC on the app - the control plane. Usually the deploying principal's alone,
          so empty is a normal answer.
        renders: role_assignments / roleAssignments

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive the environment's logs?"
          de: "Welcher Log Analytics Workspace soll die Logs der Umgebung erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        answer: { deployment: diagnostics_destination }
        per_environment: true
        why: >
          Inherited: one deployment, one destination. **The environment sends its logs through
          a diagnostic setting (`azure-monitor` destination), not through the workspace's
          shared key.** The other destination, `log-analytics`, stores the workspace's primary
          shared key in the environment - a long-lived secret that contradicts the keyless
          guardrail and the deployment's `local_auth`, and one the Terraform module reads by
          needing `sharedkeys/read` on the workspace. Without either, an app's console output
          is gone with the replica.
        renders: >
          app_logs_configuration.destination = azure-monitor and diagnostic_settings /
          appLogsConfiguration.destination = azure-monitor and diagnosticSettings

      - id: diagnostic_categories
        ask:
          en: "Which log categories should be collected?"
          de: "Welche Log-Kategorien sollen erfasst werden?"
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          ContainerAppConsoleLogs: { en: "what the app writes to its console", de: "was die App auf ihre Konsole schreibt" }
          ContainerAppSystemLogs: { en: "the platform's own messages about the app and its revisions", de: "die eigenen Meldungen der Plattform zur App und ihren Revisionen" }
        accepts: [ContainerAppConsoleLogs, ContainerAppSystemLogs]
        default: [ContainerAppConsoleLogs, ContainerAppSystemLogs]
        why: >
          Console output is the only way to see what an app did, and the system log is the
          only way to see why a revision did not start - an image that could not be pulled, a
          probe that failed. Console logs are the volume line on a chatty app and the reason to
          watch the workspace's daily cap. The category names are the platform's and are checked
          against `az monitor diagnostic-settings categories list --resource <environment id>`
          before a render, not remembered.
        renders: diagnostic_settings.<key>.logs[].category / diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask:
          en: "Should all metrics be collected?"
          de: "Sollen alle Metriken erfasst werden?"
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: "collected", de: "erfasst" }
          false: { en: "not collected", de: "nicht erfasst" }
        default: true
        why: >
          Replica count, CPU, memory and request counts are what decide whether the size and
          the replica bounds above were right, and they are cheap.
        renders: metrics[].category = "AllMetrics" / metricCategories[].category

      - id: application_insights
        ask: Which Application Insights component should receive the app's telemetry?
        type: ref
        plain:
          en: "Its application telemetry goes to {value} (empty: none)."
          de: "Seine Anwendungstelemetrie geht an {value} (leer: keine)."
        ref: application_insights
        default: ""
        per_environment: true
        forced_when: >
          `application_monitoring: enabled` sets it to the deployment's application-insights
          component, recorded as forced with `application_monitoring` as forced_by
        why: >
          The environment's logs carry the containers' console output; requests, exceptions
          and slow dependencies from inside the app go to Application Insights, and the app
          finds its component through the `APPLICATIONINSIGHTS_CONNECTION_STRING` environment
          variable on its container. A plain value, not a secret reference: the connection
          string only lets the app send to the component. With the component's local
          authentication off (the default) the container also gets
          `APPLICATIONINSIGHTS_AUTHENTICATION_STRING` = `Authorization=AAD;ClientId=<client id>`
          of its user-assigned identity, which holds `Monitoring Metrics Publisher` on the
          component. Variables and role are infrastructure and always rendered; only the code
          that reads them is the app's. Empty only under `application_monitoring: disabled`.
        renders: >
          template.containers[].env = [{ name = "APPLICATIONINSIGHTS_CONNECTION_STRING", value },
          { name = "APPLICATIONINSIGHTS_AUTHENTICATION_STRING", value }] / the same two in containers[].env
