# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
# Authored Terraform: azurerm_linux_virtual_machine / azurerm_windows_virtual_machine by os_type,
# with an azurerm_network_interface beside it; authored Bicep: Microsoft.Compute/virtualMachines
# with a Microsoft.Network/networkInterfaces beside it.
schema_version: 1
resource: Microsoft.Compute/virtualMachines

modules:
  terraform: [Azure/avm-res-compute-virtualmachine/azurerm]
  bicep: [avm/res/compute/virtual-machine]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the machine
  placement.location:
    terraform_avm: { attribute: location, passthrough: true }
    terraform: { attribute: location, passthrough: true }
    bicep_avm: { attribute: location, passthrough: true }
    bicep: { attribute: location, passthrough: true }
    import: {path: location, passthrough: true}
  placement.resource_group_name:
    terraform_avm:
      attribute: resource_group_name
      note: azurerm-based module (a name, not an id); requires azurerm < 5.0
    terraform: { attribute: resource_group_name }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }
    import: {todo: 'bicep renders it as a gap: the deployment''s resource group scope; no property'}

  # ------------------------------------------------------------------ machine
  machine.os_type:
    terraform_avm: { attribute: os_type, passthrough: true, note: module default Windows - always written }
    terraform:
      attribute: resource type
      values:
        Linux: { expr: azurerm_linux_virtual_machine }
        Windows: { expr: azurerm_windows_virtual_machine }
    bicep_avm: { attribute: osType, passthrough: true, note: a required parameter }
    bicep:
      attribute: properties.osProfile
      values:
        Linux: { expr: 'linuxConfiguration: { <members per the other decisions> }' }
        Windows: { expr: 'windowsConfiguration: { <members per the other decisions> }' }
      note: 'source: bicep build, Microsoft.Compute/virtualMachines@2024-11-01'
    import: {todo: an answer renders as code or as nothing; needs cases}
  machine.image:
    terraform_avm:
      attribute: source_image_reference
      values:
        ubuntu_24_04: { expr: '{ publisher = "Canonical", offer = "ubuntu-24_04-lts", sku = "server", version = "latest" }' }
        windows_server_2022: { expr: '{ publisher = "MicrosoftWindowsServer", offer = "WindowsServer", sku = "2022-datacenter-g2", version = "latest" }' }
        windows_server_2025: { expr: '{ publisher, offer, sku, version = "latest" } from az vm image list' }
        gallery_image: { expr: 'null' }
      also:
        gallery_image: source_image_resource_id = {machine.gallery_image_id}
      note: module default is Windows Server 2022; windows_server_2025 is looked up with az vm image list, never recalled
    terraform:
      attribute: source_image_reference
      values:
        ubuntu_24_04: { expr: '{ publisher = "Canonical", offer = "ubuntu-24_04-lts", sku = "server", version = "latest" }' }
        windows_server_2022: { expr: '{ publisher = "MicrosoftWindowsServer", offer = "WindowsServer", sku = "2022-datacenter-g2", version = "latest" }' }
        windows_server_2025: { expr: '{ publisher, offer, sku, version = "latest" } from az vm image list' }
        gallery_image: null
      note: windows_server_2025 is looked up live; a gallery image's argument is not in the reference's authored rendering
    bicep_avm:
      gap: >-
        imageReference; bicep.md spells no Windows image. Stated: ubuntu_24_04 is { publisher: 'Canonical',
        offer: 'ubuntu-24_04-lts', sku: 'server', version: 'latest' }, gallery_image is { id: {machine.gallery_image_id} }
    bicep:
      gap: >-
        properties.storageProfile.imageReference; bicep.md spells no Windows image. Stated (module call):
        ubuntu_24_04 is { publisher: 'Canonical', offer: 'ubuntu-24_04-lts', sku: 'server', version: 'latest' },
        gallery_image is { id: {machine.gallery_image_id} }
    import: {todo: 'bicep renders it as a gap: properties.storageProfile.imageReference; bicep.md spells no...'}
  machine.gallery_image_id:
    terraform_avm: { attribute: source_image_resource_id, note: and no source_image_reference }
    terraform: { attribute: source_image_id, note: 'instead of source_image_reference (source: azurerm 5.12 schema, azurerm 5.12 docs)' }
    bicep_avm: { attribute: imageReference.id }
    bicep: { attribute: properties.storageProfile.imageReference.id }
    import: {todo: a list or a reference; needs its own reading}
  machine.size:
    terraform_avm: { attribute: sku_size, passthrough: true, note: module default Standard_D2ds_v5; written anyway }
    terraform: { attribute: size, passthrough: true }
    bicep_avm: { attribute: vmSize, passthrough: true, note: a required parameter }
    bicep: { attribute: properties.hardwareProfile.vmSize, passthrough: true }
    import: {path: properties.hardwareProfile.vmSize, passthrough: true}
  machine.license_type:
    terraform_avm:
      attribute: license_type
      values: { included: { expr: 'null' }, azure_hybrid_benefit: Windows_Server }
    terraform:
      attribute: license_type
      values: { included: { expr: 'null' }, azure_hybrid_benefit: Windows_Server }
    bicep_avm:
      attribute: licenseType
      values: { included: null, azure_hybrid_benefit: Windows_Server }
    bicep:
      attribute: properties.licenseType
      values: { included: null, azure_hybrid_benefit: Windows_Server }
      note: 'source: bicep build, Microsoft.Compute/virtualMachines@2024-11-01 (an open string there); literal per module README 0.22.3 licenseType'
    import: {todo: an answer renders as code or as nothing; needs cases}
  machine.instance_count:
    terraform_avm:
      attribute: for_each
      format: { expr: 'toset([for i in range({value}) : tostring(i + 1)])' }
      note: on the module call; each name from the naming provider with the instance number; one machine is a for_each of one, so a second is not a state move
    terraform:
      gap: the reference's authored rendering is silent on the count; the module call's for_each over "1".."n" is the pattern
    bicep_avm:
      attribute: module loop
      format: { expr: '[for i in range(1, {value}): <instance>]' }
      note: each name with the instance number
    bicep:
      gap: the reference's authored rendering is silent on the count
    import: {todo: 'bicep renders it as a gap: the reference''s authored rendering is silent on the count'}
  machine.availability:
    terraform_avm:
      attribute: zone
      values: { zone: { expr: '{machine.zone}' }, availability_set: { expr: 'null' }, none: { expr: 'null' } }
      also:
        availability_set: availability_set_resource_id = {machine.availability_set_id}
      note: a required input - null, never left out
    terraform:
      attribute: zone
      values: { zone: { expr: '{machine.zone}' }, availability_set: null, none: null }
      also:
        availability_set: availability_set_id = {machine.availability_set_id}
    bicep_avm:
      attribute: availabilityZone
      values: { zone: { expr: '{machine.zone}' }, availability_set: { expr: '-1' }, none: { expr: '-1' } }
      also:
        availability_set: 'availabilitySetResourceId: {machine.availability_set_id}'
      note: required; -1 is no zone
    bicep:
      attribute: zones
      values: { zone: { expr: '{machine.zone}' }, availability_set: null, none: null }
      also:
        availability_set: 'properties.availabilitySet.id: {machine.availability_set_id}'
    import: {todo: an answer renders as code or as nothing; needs cases}
  machine.zone:
    terraform_avm:
      attribute: zone
      values: { '1': '1', '2': '2', '3': '3' }
      note: a string; null for a set or a region without zones
    terraform: { attribute: zone, values: { '1': '1', '2': '2', '3': '3' } }
    bicep_avm:
      attribute: availabilityZone
      values: { '1': { expr: '1' }, '2': { expr: '2' }, '3': { expr: '3' } }
      note: an integer; -1 for a set or no zone
    bicep:
      attribute: zones
      values: { '1': { expr: "[ '1' ]" }, '2': { expr: "[ '2' ]" }, '3': { expr: "[ '3' ]" } }
    import: {todo: an answer renders as code or as nothing; needs cases}
  machine.availability_set_id:
    terraform_avm: { attribute: availability_set_resource_id, note: with zone = null }
    terraform: { attribute: availability_set_id }
    bicep_avm: { attribute: availabilitySetResourceId, note: with availabilityZone -1 }
    bicep: { attribute: properties.availabilitySet.id }
    import: {todo: a list or a reference; needs its own reading}
  machine.os_disk_storage:
    terraform_avm:
      attribute: os_disk.storage_account_type
      passthrough: true
      note: with caching = "ReadWrite"; module default Premium_LRS - written
    terraform: { attribute: os_disk.storage_account_type, passthrough: true }
    bicep_avm:
      attribute: osDisk.managedDisk.storageAccountType
      passthrough: true
      note: "with createOption: 'FromImage', deleteOption: 'Delete' so a rebuild leaves no orphan disk"
    bicep: { attribute: properties.storageProfile.osDisk.managedDisk.storageAccountType, passthrough: true }
    import: {path: properties.storageProfile.osDisk.managedDisk.storageAccountType, passthrough: true}
  machine.os_disk_size_gb:
    terraform_avm: { attribute: os_disk.disk_size_gb, passthrough: true }
    terraform: { attribute: os_disk.disk_size_gb, passthrough: true }
    bicep_avm: { attribute: osDisk.diskSizeGB, passthrough: true }
    bicep: { attribute: properties.storageProfile.osDisk.diskSizeGB, passthrough: true }
    import: {path: properties.storageProfile.osDisk.diskSizeGB, passthrough: true}
  machine.data_disks:
    terraform_avm:
      attribute: 'data_disk_managed_disks.<key> = { name, lun, caching, storage_account_type, disk_size_gb, disk_encryption_set_resource_id }'
      note: same zone as the machine
    terraform:
      gap: no argument in the reference's authored rendering; standalone data disks are the managed-disk set
    bicep_avm: { attribute: dataDisks, note: same zone as the machine }
    bicep:
      gap: no property in the reference's authored rendering; standalone data disks are the managed-disk set
    import: {todo: 'bicep renders it as a gap: no property in the reference''s authored rendering; standalon...'}

  # --------------------------------------------------------------- networking
  networking.workload_subnet:
    terraform_avm:
      attribute: network_interfaces.primary.ip_configurations.primary.private_ip_subnet_resource_id
      note: the module creates the interface
    terraform: { attribute: azurerm_network_interface.ip_configuration.subnet_id, note: network_interface_ids on the machine }
    bicep_avm: { attribute: 'nicConfigurations[].ipConfigurations[].subnetResourceId' }
    bicep: { attribute: 'Microsoft.Network/networkInterfaces properties.ipConfigurations[].properties.subnet.id' }
    import: {todo: 'not in the Resource Graph row: Microsoft.Network/networkInterfaces properties.ipConfigu...'}
  networking.public_ip:
    terraform_avm:
      attribute: network_interfaces.primary.ip_configurations.primary.create_public_ip_address
      passthrough: true
      note: module default false; written anyway
    terraform:
      attribute: azurerm_network_interface.ip_configuration.public_ip_address_id
      values: { true: { expr: 'azurerm_public_ip.<name>.id' }, false: null }
      note: 'true renders an azurerm_public_ip beside the interface (source: azurerm 5.12 schema, azurerm 5.12 docs)'
    bicep_avm:
      attribute: 'nicConfigurations[].ipConfigurations[].pipConfiguration'
      values: { true: { expr: "{ name: '<name>' }" }, false: null }
      note: 'the module creates the public IP (source: module README 0.22.3)'
    bicep:
      attribute: 'Microsoft.Network/networkInterfaces properties.ipConfigurations[].properties.publicIPAddress.id'
      values: { true: { expr: '<the public IP resource id>' }, false: null }
      note: 'true renders a Microsoft.Network/publicIPAddresses beside it (source: bicep build, Microsoft.Network/networkInterfaces@2024-05-01)'
    import: {todo: 'not in the Resource Graph row: Microsoft.Network/networkInterfaces properties.ipConfigu...'}
  networking.private_ip_allocation:
    terraform_avm:
      attribute: network_interfaces.primary.ip_configurations.primary.private_ip_address_allocation
      passthrough: true
    terraform:
      attribute: azurerm_network_interface.ip_configuration.private_ip_address_allocation
      passthrough: true
      note: 'Static with private_ip_address (source: azurerm 5.12 schema, azurerm 5.12 docs)'
    bicep_avm: { attribute: 'nicConfigurations[].ipConfigurations[].privateIPAllocationMethod', passthrough: true }
    bicep:
      attribute: 'Microsoft.Network/networkInterfaces properties.ipConfigurations[].properties.privateIPAllocationMethod'
      passthrough: true
      note: 'Static with privateIPAddress (source: bicep build, Microsoft.Network/networkInterfaces@2024-05-01 - an open string there; literals per module README 0.22.3)'
    import: {todo: 'not in the Resource Graph row: Microsoft.Network/networkInterfaces properties.ipConfigu...'}
  networking.accelerated_networking:
    terraform_avm: { attribute: network_interfaces.primary.accelerated_networking_enabled, passthrough: true }
    terraform: { attribute: azurerm_network_interface.accelerated_networking_enabled, passthrough: true }
    bicep_avm: { attribute: 'nicConfigurations[].enableAcceleratedNetworking', passthrough: true }
    bicep:
      attribute: Microsoft.Network/networkInterfaces properties.enableAcceleratedNetworking
      passthrough: true
      note: 'source: bicep build, Microsoft.Network/networkInterfaces@2024-05-01'
    import: {todo: 'not in the Resource Graph row: Microsoft.Network/networkInterfaces properties.enableAcc...'}

  # ----------------------------------------------------------------- identity
  identity.system_assigned_identity:
    terraform_avm: { attribute: managed_identities.system_assigned, passthrough: true }
    terraform:
      attribute: identity.type
      values: { true: SystemAssigned, false: null }
      note: with user-assigned ids beside it the type is "SystemAssigned, UserAssigned" (true) or UserAssigned (false)
    bicep_avm: { attribute: managedIdentities.systemAssigned, passthrough: true, note: the Entra extension forces it on }
    bicep:
      attribute: identity.type
      values: { true: SystemAssigned, false: null }
      note: with user-assigned ids beside it the type is "SystemAssigned, UserAssigned" (true) or UserAssigned (false)
    import: {todo: an answer renders as code or as nothing; needs cases}
  identity.user_assigned_identity_ids:
    terraform_avm: { attribute: managed_identities.user_assigned_resource_ids }
    terraform: { attribute: identity.identity_ids }
    bicep_avm: { attribute: managedIdentities.userAssignedResourceIds }
    bicep:
      attribute: identity.userAssignedIdentities
      format: { expr: 'toObject({value}, id => id, id => {})' }
      note: 'an object keyed by each id (source: bicep build, Microsoft.Compute/virtualMachines@2024-11-01)'
    import: {todo: a composed or computed literal; needs its own reading}
  identity.entra_login:
    terraform_avm:
      attribute: extensions.entra_login
      values:
        true: { expr: '{ name, publisher = "Microsoft.Azure.ActiveDirectory", type, type_handler_version, auto_upgrade_minor_version }' }
        false: null
      note: Linux AADSSHLoginForLinux 1.0, Windows AADLoginForWindows 2.0
    terraform:
      gap: >-
        true renders azurerm_virtual_machine_extension (AADSSHLoginForLinux / AADLoginForWindows), false
        none; its arguments are not in the reference's authored rendering
    bicep_avm:
      attribute: extensionAadJoinConfig.enabled
      passthrough: true
      note: the module picks the extension by osType; settings.mdmId (Intune) left out
    bicep:
      gap: >-
        true renders a child extension (AADSSHLoginForLinux / AADLoginForWindows), false none; its
        properties are not in the reference's authored rendering
    import: {todo: 'bicep renders it as a gap: true renders a child extension (AADSSHLoginForLinux / AADLog...'}
  identity.role_assignments:
    terraform_avm:
      attribute: 'role_assignments.<key> = { role_definition_id_or_name, principal_id }'
      note: Virtual Machine Administrator Login / Virtual Machine User Login
    terraform: { attribute: azurerm_role_assignment, note: scope = the machine's id }
    bicep_avm: { attribute: roleAssignments }
    bicep: { attribute: Microsoft.Authorization/roleAssignments, note: scope = the machine }
    import: {todo: 'not in the Resource Graph row: Microsoft.Authorization/roleAssignments'}

  # ----------------------------------------------------------------- security
  security.trusted_launch:
    terraform_avm:
      attribute: secure_boot_enabled, vtpm_enabled
      passthrough: true
      note: both take the answer; module default null (off) - written
    terraform: { attribute: 'secure_boot_enabled, vtpm_enabled', passthrough: true, note: both take the answer }
    bicep_avm:
      attribute: securityType
      values: { true: TrustedLaunch, false: null }
      note: with secureBootEnabled and vTpmEnabled set to the answer; module defaults no security type, false, false - written
    bicep:
      attribute: properties.securityProfile.securityType
      values: { true: TrustedLaunch, false: null }
      note: with uefiSettings { secureBootEnabled, vTpmEnabled } set to the answer
    import: {todo: an answer renders as code or as nothing; needs cases}
  security.encryption_at_host:
    terraform_avm: { attribute: encryption_at_host_enabled, passthrough: true, note: module default true (Bicep's false); written anyway }
    terraform: { attribute: encryption_at_host_enabled, passthrough: true }
    bicep_avm: { attribute: encryptionAtHost, passthrough: true, note: module default false (Terraform's true) - always written }
    bicep: { attribute: properties.securityProfile.encryptionAtHost, passthrough: true }
    import: {path: properties.securityProfile.encryptionAtHost, passthrough: true}
  security.key_management:
    terraform_avm:
      attribute: os_disk.disk_encryption_set_id
      values: { platform_managed: null, customer_managed: { expr: '{security.disk_encryption_set_id}' } }
      note: the id from security.disk_encryption_set_id; the data disks take disk_encryption_set_resource_id
    terraform:
      attribute: os_disk.disk_encryption_set_id
      values: { platform_managed: null, customer_managed: { expr: '{security.disk_encryption_set_id}' } }
      note: the id from security.disk_encryption_set_id
    bicep_avm:
      attribute: osDisk.managedDisk.diskEncryptionSetResourceId
      values: { platform_managed: null, customer_managed: { expr: '{security.disk_encryption_set_id}' } }
      note: the id from security.disk_encryption_set_id
    bicep:
      attribute: properties.storageProfile.osDisk.managedDisk.diskEncryptionSet.id
      values: { platform_managed: null, customer_managed: { expr: '{security.disk_encryption_set_id}' } }
      note: the id from security.disk_encryption_set_id
    import: {todo: an answer renders as code or as nothing; needs cases}
  security.disk_encryption_set_id:
    terraform_avm: { attribute: os_disk.disk_encryption_set_id }
    terraform: { attribute: os_disk.disk_encryption_set_id }
    bicep_avm: { attribute: osDisk.managedDisk.diskEncryptionSetResourceId }
    bicep: { attribute: properties.storageProfile.osDisk.managedDisk.diskEncryptionSet.id }
    import: {todo: a list or a reference; needs its own reading}
  security.admin_username:
    terraform_avm: { attribute: account_credentials.admin_credentials.username, passthrough: true }
    terraform: { attribute: admin_username, passthrough: true }
    bicep_avm: { attribute: adminUsername, passthrough: true }
    bicep: { attribute: properties.osProfile.adminUsername, passthrough: true }
    import: {path: properties.osProfile.adminUsername, passthrough: true}
  security.password_authentication:
    terraform_avm:
      attribute: account_credentials.password_authentication_disabled
      values: { true: false, false: true }
      note: inverted; Linux only; generate_admin_password_or_ssh_key = false keeps a generated key out of state
    terraform:
      attribute: disable_password_authentication
      values: { true: false, false: true }
      note: inverted
    bicep_avm:
      attribute: disablePasswordAuthentication
      values: { true: false, false: true }
      note: inverted; module default false - always written
    bicep:
      attribute: properties.osProfile.linuxConfiguration.disablePasswordAuthentication
      values: { true: false, false: true }
      note: inverted
    import: {path: properties.osProfile.linuxConfiguration.disablePasswordAuthentication, values: {false: true, true: false}}
  security.ssh_public_key:
    terraform_avm:
      attribute: account_credentials.admin_credentials.ssh_keys
      format: { expr: '["{value}"]' }
      note: a list of public keys
    terraform: { attribute: admin_ssh_key.public_key, passthrough: true, note: with username }
    bicep_avm: { attribute: 'publicKeys[].keyData', passthrough: true, note: with path /home/<admin_username>/.ssh/authorized_keys }
    bicep:
      attribute: 'properties.osProfile.linuxConfiguration.ssh.publicKeys[].keyData'
      passthrough: true
      note: with path /home/<admin_username>/.ssh/authorized_keys
    import: {todo: 'not in the Resource Graph row: properties.osProfile.linuxConfiguration.ssh.publicKeys[]...'}
  security.credential_key_vault:
    terraform_avm:
      attribute: account_credentials.key_vault_configuration.resource_id
      note: the module generates the password and stores it as a secret; generate_admin_password_or_ssh_key stays true
    terraform:
      gap: admin_password from a Key Vault secret in this vault (Windows); the secret is not named by the reference
    bicep_avm:
      gap: adminPassword is getSecret(...) on this vault in the parameter file - a Key Vault reference, never a literal; the module takes it as string; the secret is not named by the reference
    bicep:
      gap: not in the reference's authored rendering; properties.osProfile.adminPassword would take a getSecret(...) reference to a secret in this vault
    import: {todo: 'bicep renders it as a gap: not in the reference''s authored rendering; properties.osProf...'}

  # ---------------------------------------------------------- data_protection
  data_protection.backup_enabled:
    terraform_avm:
      attribute: azure_backup_configurations
      values:
        true: { expr: '{ default = { recovery_vault_resource_id, backup_policy_resource_id } }' }
        false: { expr: '{}' }
    terraform:
      attribute: azurerm_backup_protected_vm
      values:
        true: { expr: '{ resource_group_name, recovery_vault_name, source_vm_id, backup_policy_id }' }
        false: null
      note: 'source_vm_id is the machine id; false renders none (source: azurerm 5.12 schema, azurerm 5.12 docs)'
    bicep_avm:
      attribute: backupVaultName
      values: { true: { expr: '<the name of backup_vault_id>' }, false: '' }
      note: an empty vault name is no backup
    bicep:
      attribute: Microsoft.RecoveryServices/vaults/backupFabrics/protectionContainers/protectedItems properties.protectedItemType
      values: { true: Microsoft.Compute/virtualMachines, false: null }
      note: 'with sourceResourceId = the machine id and policyId; false renders none; the fabric, container and item names are in no source - check them (source: bicep build, protectedItems@2025-02-01, a strict discriminator)'
    import: {todo: 'not in the Resource Graph row: Microsoft.RecoveryServices/vaults/backupFabrics/protecti...'}
  data_protection.backup_vault_id:
    terraform_avm: { attribute: azure_backup_configurations.default.recovery_vault_resource_id }
    terraform:
      attribute: azurerm_backup_protected_vm.recovery_vault_name, azurerm_backup_protected_vm.resource_group_name
      note: 'the vault id split into its name and resource group (source: azurerm 5.12 schema, azurerm 5.12 docs)'
    bicep_avm:
      attribute: backupVaultName, backupVaultResourceGroup
      note: the vault id split into its name and resource group
    bicep:
      gap: the protected item is a child of this vault by name (vaults/<vault>/backupFabrics/<fabric>/protectionContainers/<container>/protectedItems/<item>); the fabric, container and item names are in no source of record
    import: {todo: 'bicep renders it as a gap: the protected item is a child of this vault by name (vaults/...'}
  data_protection.backup_policy_id:
    terraform_avm: { attribute: azure_backup_configurations.default.backup_policy_resource_id }
    terraform: { attribute: azurerm_backup_protected_vm.backup_policy_id, note: 'source: azurerm 5.12 schema, azurerm 5.12 docs' }
    bicep_avm: { attribute: backupPolicyName, note: the policy's name and not its id; module default DefaultPolicy }
    bicep:
      attribute: Microsoft.RecoveryServices/vaults/backupFabrics/protectionContainers/protectedItems properties.policyId
      note: 'source: bicep build, protectedItems@2025-02-01'
    import: {todo: 'not in the Resource Graph row: Microsoft.RecoveryServices/vaults/backupFabrics/protecti...'}

  # -------------------------------------------------------------- maintenance
  maintenance.patch_mode:
    terraform_avm:
      attribute: patch_mode
      passthrough: true
      note: with patch_assessment_mode; module defaults null and ImageDefault - written
    terraform: { attribute: patch_mode, passthrough: true, note: with patch_assessment_mode }
