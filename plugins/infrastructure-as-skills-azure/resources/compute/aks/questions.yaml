schema_version: 1

resource: Microsoft.ContainerService/managedClusters
title: Azure Kubernetes Service (managed cluster with a system and a user node pool)

# The cluster is the resource; its node pools (Microsoft.ContainerService/managedClusters/agentPools,
# abbreviation `np`, system pool `npsystem`) are created with it and decided in the `node_pools`
# group: one system pool, one user pool. More pools, GPU or Windows pools and AKS Automatic
# (`sku.name: Automatic`, where AKS owns the pools) are not modelled.
naming:
  terraform: "Azure::Microsoft.ContainerService/managedClusters"
  bicep: "Microsoft.ContainerService/managedClusters"
  # Bicep assembles the name from vars - this is the prefix it renders. Pool names are
  # lowercase alphanumeric, 12 characters at most: `npsystem` and `npuser`.
  abbreviation: "aks"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create the node subnet when the network is referenced; under network_ownership: create the virtual-network set carries it."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform. A custom `privatelink.<region>.azmk8s.io` zone is the platform's."
  - "Does not create the Log Analytics workspace, the container registry, the Key Vault, the disk encryption set or the Entra groups it refers to."
  - "Does not grant roles other than recording them: the cluster identity's roles on the subnet and the DNS zone, and the kubelet identity's `AcrPull` on each registry, are wiring between resources, owned by a pattern; the cluster identity must hold its roles before the cluster exists, which is why it is user-assigned."
  - "Does not render what runs in the cluster: namespaces, Helm charts, GitOps (Flux), ingress controllers, service meshes, Gateway API, admission policies or the workloads. Kubernetes objects are application content, not Azure configuration."
  - "Does not render managed Prometheus and Grafana, alert rules, AKS backup, maintenance windows, the cluster autoscaler profile, KMS etcd encryption, API-server VNet integration, a proxy, Windows pools, GPU pools, spot pools or AKS Automatic. Each carries decisions of its own and has no question set yet."
  - "Does not render more than one system and one user node pool."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name and the strictness of several defaults below. Nothing
          sensible can be guessed. A cluster per stage is the rule; a namespace per stage in
          one cluster is a different isolation model and a decision for the platform team.
        renders: naming parameter `environment`, and the tag of that name where the repository uses one

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          Part of the rendered name and the home region of the control plane and the nodes.
          Zones, VM sizes and Kubernetes versions differ by region, and a cluster far from the
          data it works on pays for it on every call.
        renders: location

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        ref: resource_group
        required: true
        from_context: true
        per_environment: true
        why: >
          The cluster is placed into an existing group. Creating one here would make this set
          own a lifecycle wider than the resource it describes. AKS creates a second, managed
          group for the nodes (`MC_...`) on its own; nothing of the deployment lives there.
        renders: parent_id (AVM Terraform, AzAPI-based, the resource group's id) / implicit in Bicep scope

  # ------------------------------------------------------------------ cluster
  - id: cluster
    title: The cluster
    questions:
      - id: sku_tier
        ask: Which cluster tier?
        type: enum
        plain:
          en: "The cluster is the {value} tier."
          de: "Der Cluster hat die Stufe {value}."
        plain_values:
          Free: { en: "free, without an uptime guarantee for the control plane and limited to small clusters", de: "kostenlos, ohne Verfügbarkeitszusage für die Steuerungsebene und nur für kleine Cluster" }
          Standard: { en: "standard, with a financially backed uptime guarantee for the control plane", de: "Standard, mit finanziell abgesicherter Verfügbarkeitszusage für die Steuerungsebene" }
          Premium: { en: "premium, standard plus two years of support for each Kubernetes version", de: "Premium, Standard plus zwei Jahre Support je Kubernetes-Version" }
        values: [Free, Standard, Premium]
        derived_from:
          question: outage_impact
          map: { tolerable: Free, disruptive: Standard, critical: Standard }
        confirm_in: [production]
        non_production_default: Free
        why: >
          Derived from how bad an outage is. The tier is the control plane's uptime SLA (with
          zones, 99.95%; without, 99.9%), billed per cluster per hour; `Free` has none and caps
          the nodes. `Premium` adds long-term support for a Kubernetes version and is a
          decision about upgrade cadence, not availability, so no requirement maps to it - the
          engineer departs and records why. The non-production stages take `Free` while
          non_production_savings is enabled. **The Bicep module defaults to `Standard`**, the
          Terraform module leaves it unset (`Free`): written either way.
        renders: sku.tier / skuTier

      - id: kubernetes_version
        ask: Which Kubernetes version?
        type: string
        plain:
          en: "The cluster starts on Kubernetes {value}."
          de: "Der Cluster startet mit Kubernetes {value}."
        required: true
        why: >
          A **minor version that AKS still supports in the region**, such as `1.33`, never
          recalled: the supported list is read with `az aks get-versions --location <region>`
          before a render. A minor version names the latest patch AKS has; a full patch version
          pins it and holds back the security fixes. Each minor is supported for about a year,
          so the choice is also a date by which the next upgrade is due. With no answer the
          decision is an `open:` entry owned by the engineer.
        renders: kubernetes_version / kubernetesVersion

      - id: upgrade_channel
        ask: How should the cluster be upgraded?
        type: enum
        plain:
          en: "Upgrades: {value}."
          de: "Upgrades: {value}."
        plain_values:
          none: { en: "never automatically, someone starts every upgrade by hand", de: "nie automatisch, jemand startet jedes Upgrade von Hand" }
          patch: { en: "security fixes of the chosen Kubernetes version are applied automatically, a new version only on request", de: "Sicherheitskorrekturen der gewählten Kubernetes-Version werden automatisch eingespielt, eine neue Version nur auf Anforderung" }
          stable: { en: "the cluster follows the second newest Kubernetes version automatically", de: "der Cluster folgt automatisch der zweitneuesten Kubernetes-Version" }
          rapid: { en: "the cluster follows the newest Kubernetes version automatically", de: "der Cluster folgt automatisch der neuesten Kubernetes-Version" }
        values: [none, patch, stable, rapid]
        default: patch
        why: >
          `patch` applies the security fixes to the minor the cluster is on and never changes
          the Kubernetes API underneath the workloads - a minor upgrade removes deprecated APIs
          and is a release of its own. `stable` and `rapid` move the minor on a schedule nobody
          chose; `none` leaves security fixes to whoever remembers. **The modules disagree**:
          Bicep defaults to `stable`, Terraform to `none`; both are written. Without a
          maintenance window the upgrade runs at any time - windows are not modelled here and
          are named as a gap in the handover.
        renders: auto_upgrade_profile.upgrade_channel / autoUpgradeProfile.upgradeChannel

      - id: node_os_upgrade_channel
        ask: How should the nodes' operating system be kept up to date?
        type: enum
        plain:
          en: "Node operating systems: {value}."
          de: "Betriebssysteme der Knoten: {value}."
        plain_values:
          None: { en: "not updated by AKS", de: "nicht von AKS aktualisiert" }
          Unmanaged: { en: "updated by the operating system itself, without a reboot unless a patch needs one", de: "vom Betriebssystem selbst aktualisiert, ohne Neustart außer ein Patch verlangt ihn" }
          SecurityPatch: { en: "security patches are applied to the node image as they are released", de: "Sicherheitspatches werden am Knoten-Image eingespielt, sobald sie erscheinen" }
          NodeImage: { en: "nodes are replaced with the newest node image, weekly", de: "Knoten werden wöchentlich durch das neueste Knoten-Image ersetzt" }
        values: [None, Unmanaged, SecurityPatch, NodeImage]
        default: NodeImage
        why: >
          Nodes are cattle: a new image per week replaces the node instead of patching it, so
          every node of a pool is the same and a bad patch is a rollback of the image. `None`
          leaves nodes on the image they were created from until someone upgrades them;
          `Unmanaged` patches in place and reboots on its own schedule. `NodeImage` is the
          ARM and Terraform default; written.
        renders: auto_upgrade_profile.node_os_upgrade_channel / autoUpgradeProfile.nodeOSUpgradeChannel

      - id: zone_redundant
        ask: Should the cluster survive the loss of an availability zone?
        type: bool
        plain:
          en: "The cluster {value} survive the loss of one datacenter of the region."
          de: "Der Cluster {value} den Ausfall eines Rechenzentrums der Region."
        plain_values:
          true: { en: "does", de: "übersteht" }
          false: { en: "does not", de: "übersteht nicht" }
        derived_from:
          question: outage_impact
          map: { tolerable: false, disruptive: true, critical: true }
        confirm_in: [production]
        non_production_default: false
        why: >
          Derived from how bad an outage is. The node pools are spread over zones 1, 2 and 3 and
          the control plane follows the region. **Zones are set when a pool is created**; a pool
          cannot be moved into zones later, it is replaced. Traffic between zones is billed, and
          a stateful workload with a zonal disk is pinned to the zone of its disk, so zone
          redundancy is a design the workload must meet as well. `critical` equals `disruptive`
          because a cluster is regional: a second region is a second deployment behind a global
          front door, a pattern. The non-production stages take `false` while
          non_production_savings is enabled. Not every region or VM size has three zones.
        renders: availability_zones on both pools / availabilityZones on both pool profiles (["1","2","3"] / [1, 2, 3])

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask: Should the cluster depart from the deployment's exposure posture?
        type: enum
        plain:
          en: "The cluster's API is {value}."
          de: "Die API des Clusters ist {value}."
        plain_values:
          disabled: { en: "reachable only from inside the company network", de: "nur aus dem Firmennetz erreichbar" }
          enabled_with_firewall: { en: "reachable from the internet only from listed addresses", de: "aus dem Internet nur von gelisteten Adressen erreichbar" }
          enabled: { en: "reachable from the internet", de: "aus dem Internet erreichbar" }
        values: [disabled, enabled_with_firewall, enabled]
        from_deployment: network_exposure
        confirm_in: [production]
        why: >
          Asked only as a departure: exposure is a property of the system. It is about the
          **Kubernetes API server**, the thing `kubectl` and the pipeline talk to - the apps
          running in the cluster are exposed by their own ingress. `private` is `disabled`
          (a private cluster: the API server has a private address in the node VNet and no
          public one), `public` is `enabled_with_firewall` (authorized IP ranges). With
          `disabled` the pipeline that deploys to the cluster must run inside the network, or
          use `az aks command invoke` - the usual snag, and a decision for the pipeline.
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces `enabled`,
          recorded as forced with `network_ownership` as forced_by: the deployment's own callers
          have no fixed outbound address, so an allowlist with no rule locks them out
        renders: >
          api_server_access_profile.enable_private_cluster and public_network_access /
          apiServerAccessProfile.enablePrivateCluster and publicNetworkAccess

      - id: authorized_ip_ranges
        ask: Which public IP ranges may reach the cluster's API?
        type: list
        plain:
          en: "Public addresses allowed to reach the cluster's API: {value}."
          de: "Öffentliche Adressen, die die API des Clusters erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist in CIDR form; the API server refuses everything else. An
          empty list means no restriction, not no access - the opposite of a firewall rule list
          elsewhere - so an empty answer here is an `open:` entry owned by the workload owner,
          blocking apply, never an empty list rendered.
        renders: api_server_access_profile.authorized_ip_ranges / apiServerAccessProfile.authorizedIPRanges

      - id: private_dns_zone
        ask: Where does the private cluster's API name live?
        type: enum
        resolved_by: derived
        plain:
          en: "The name of the cluster's private API is kept in {value}."
          de: "Der Name der privaten API des Clusters liegt in {value}."
        plain_values:
          system: { en: "a zone AKS creates next to the nodes, which only this network can resolve", de: "einer Zone, die AKS neben den Knoten anlegt und die nur dieses Netz auflösen kann" }
          custom: { en: "a zone of the platform, which the whole network, including the company network, resolves", de: "einer Zone der Plattform, die das ganze Netz einschließlich Firmennetz auflöst" }
        values: [system, custom]
        default: system
        depends_on: { question: public_network_access, equals: disabled }
        why: >
          A private cluster's API name (`<cluster>.privatelink.<region>.azmk8s.io`) needs a DNS
          record. `system` lets AKS create the zone in the managed node group and link it to the
          cluster's VNet only - fine for a standalone network, and a name nobody on the other
          side of a peering resolves. `custom` is the platform's zone in the connectivity
          subscription, which makes the cluster identity a **user-assigned** one that holds
          `Private DNS Zone Contributor` on that zone before the cluster is created. An `open:` entry owned by the platform team unless the request names the zone; the default is `system`.
        forced_when: >
          `private_dns_zone: custom` forces `managed_identity: user_assigned` and requires
          `private_dns_zone_id`
        renders: api_server_access_profile.private_dns_zone / apiServerAccessProfile.privateDNSZone (`system`, or the zone's id)

      - id: private_dns_zone_id
        ask: Which private DNS zone holds the API name?
        type: ref
        resolved_by: derived
        plain:
          en: "Its API name is kept in the zone {value}."
          de: "Der Name seiner API liegt in der Zone {value}."
        ref: private_dns_zone
        required: true
        depends_on: { question: private_dns_zone, equals: custom }
        per_environment: true
        why: >
          The zone must be named `privatelink.<region>.azmk8s.io` (or a subzone) and the cluster
          identity needs `Private DNS Zone Contributor` on it. The platform owns the zone, never
          this set.
        renders: api_server_access_profile.private_dns_zone / apiServerAccessProfile.privateDNSZone

      - id: node_subnet
        ask: Which subnet should the nodes live in?
        type: ref
        resolved_by: derived
        plain:
          en: "The nodes live in subnet {value}."
          de: "Die Knoten liegen im Subnetz {value}."
        ref: subnet
        required: true
        per_environment: true
        why: >
          The nodes - and, for a private cluster on the system DNS zone, the API server's private
          endpoint - take their addresses from this subnet. With the overlay network below, only
          the nodes consume addresses, so a /24 carries a few hundred nodes; with the VNet mode
          every pod takes an address too and the subnet is sized for the pods. The subnet is not
          delegated and is used by nothing else. The cluster identity needs `Network
          Contributor` on it before the cluster exists.
        forced_when: >
          network_ownership: create - the created network's subnet, recorded as forced with the
          network as forced_by
        renders: vnet_subnet_id on both pools / vnetSubnetResourceId on both pool profiles

      - id: network_plugin_mode
        ask: How should the pods get their network addresses?
        type: enum
        plain:
          en: "Pods {value}."
          de: "Pods {value}."
        plain_values:
          overlay: { en: "get addresses from a private range of their own that exists only inside the cluster, so the company network is not used up by pods", de: "bekommen Adressen aus einem eigenen privaten Bereich, der nur im Cluster existiert, das Firmennetz wird nicht von Pods aufgebraucht" }
          vnet: { en: "get addresses from the same subnet as the nodes, so they are directly reachable from the company network", de: "bekommen Adressen aus demselben Subnetz wie die Knoten und sind direkt aus dem Firmennetz erreichbar" }
        values: [overlay, vnet]
        default: overlay
        why: >
          Azure CNI Overlay is the default for a cluster that is not required to hand pods
          addresses of the VNet: pod IPs are not routable outside the cluster, nothing runs out of
          subnet addresses, and the cluster scales to the node limit. `vnet` (flat Azure CNI) is
          for a pod that must be addressed directly from outside the cluster, and for every pod
          pays an address. **Kubenet is not offered**: it is being retired. The plugin is `azure`
          either way; **it is set when the cluster is created**, and overlay can be adopted later
          only by an in-place update that this set does not render.
        forced_when: >
          `network_requirements: corporate` with pod addresses required by the company network
          forces `vnet`, recorded as forced with `network_requirements` as forced_by
        renders: network_profile.network_plugin = azure and network_plugin_mode / networkPlugin = azure and networkPluginMode

      - id: network_dataplane
        ask: Which pod networking engine should run?
        type: enum
        plain:
          en: "The network engine is {value}."
          de: "Die Netzwerk-Engine ist {value}."
        plain_values:
          cilium: { en: "Cilium (eBPF), the current engine, which also enforces network policies", de: "Cilium (eBPF), die aktuelle Engine, die auch Netzwerkrichtlinien durchsetzt" }
          azure: { en: "the older Azure engine", de: "die ältere Azure-Engine" }
        values: [cilium, azure]
        default: cilium
        why: >
          Azure CNI powered by Cilium is the engine Microsoft builds on; Azure Network Policy
          Manager, the engine behind `azure` policies, is being retired. `azure` is for a cluster
          that must stay on the old engine. Fixed at creation.
        renders: network_profile.network_dataplane / networkDataplane

      - id: network_policy
        ask: Should network policies restrict the traffic between pods?
        type: enum
        plain:
          en: "Pod-to-pod traffic restriction: {value}."
          de: "Einschränkung des Verkehrs zwischen Pods: {value}."
        plain_values:
          cilium: { en: "enforced by Cilium", de: "von Cilium durchgesetzt" }
          calico: { en: "enforced by Calico", de: "von Calico durchgesetzt" }
          azure: { en: "enforced by the older Azure engine", de: "von der älteren Azure-Engine durchgesetzt" }
          none: { en: "not available - every pod may talk to every pod", de: "nicht verfügbar, jeder Pod darf mit jedem Pod sprechen" }
        values: [cilium, calico, azure, none]
        default: cilium
        why: >
          With no engine, a `NetworkPolicy` object is accepted and silently does nothing - the
          worst failure of the three. Installing the engine is the decision here; writing the
          policies is the workload's. `cilium` needs the `cilium` dataplane, `azure` and `calico`
          need the `azure` dataplane. Fixed at creation.
        forced_when: >
          `network_dataplane: cilium` forces `cilium` (or `none`), `network_dataplane: azure`
          removes `cilium` from `values`
        renders: network_profile.network_policy / networkPolicy

      - id: pod_cidr
        ask: Which private range should the pods use?
        type: string
        plain:
          en: "Pods use the private range {value}."
          de: "Pods nutzen den privaten Bereich {value}."
        default: "10.244.0.0/16"
        depends_on: { question: network_plugin_mode, equals: overlay }
        why: >
          An overlay range is not routed outside the cluster, so it may be the same in every
          cluster - but it must not overlap the node subnet, the VNet, a peered network or an
          on-premises range the pods have to reach, or those destinations become unreachable
          from a pod. `10.244.0.0/16` is the AKS default. A /16 holds 250 nodes at the default
          of 250 pods each. Fixed at creation.
        forced_when: >
          `network_requirements: corporate` or `assigned_ranges` means the company's ranges are
          known: the engineer checks this range against them
        renders: network_profile.pod_cidr / podCidr

      - id: service_cidr
        ask: Which private range should the cluster's services use?
        type: string
        plain:
          en: "Cluster services use the private range {value}."
          de: "Dienste im Cluster nutzen den privaten Bereich {value}."
        default: "172.20.0.0/16"
        per_environment: true
        why: >
          Service addresses exist only inside the cluster, but a pod that has to reach a network
          holding the same range reaches its own service instead. **The AKS default
          `10.0.0.0/16` collides with what most VNets and hubs use**, so the default here is a
          range corporate networks rarely hand out. It must not overlap the node subnet, the
          VNet, a peered network or the pod range. Fixed at creation. Per stage, because
          peerings differ per stage.
        renders: network_profile.service_cidr / serviceCidr

      - id: dns_service_ip
        ask: Which address should the cluster's DNS service take?
        type: string
        plain:
          en: "The cluster's DNS service has the address {value}."
          de: "Der DNS-Dienst im Cluster hat die Adresse {value}."
        default: "172.20.0.10"
        per_environment: true
        why: >
          Must lie inside `service_cidr` and not be its first address. The `.10` of the range is
          the convention. Changes together with `service_cidr`.
        renders: network_profile.dns_service_ip / dnsServiceIP

      - id: outbound_type
        ask: How should the cluster reach the internet?
        type: enum
        resolved_by: derived
        plain:
          en: "Outbound traffic {value}."
          de: "Ausgehender Verkehr {value}."
        plain_values:
          loadBalancer: { en: "leaves through public addresses of the cluster's own load balancer", de: "verlässt das Netz über öffentliche Adressen des clustereigenen Lastverteilers" }
          managedNATGateway: { en: "leaves through a NAT gateway AKS creates, with fixed addresses", de: "verlässt das Netz über ein von AKS angelegtes NAT-Gateway mit festen Adressen" }
          userDefinedRouting: { en: "is routed by the network's own route table, usually through the company firewall", de: "wird von der Routentabelle des Netzes geleitet, in der Regel über die Firmen-Firewall" }
        values: [loadBalancer, managedNATGateway, userDefinedRouting]
        default: loadBalancer
        why: >
          A node pulls images, reaches the API and fetches packages: there must be a way out.
          In a landing zone the platform's firewall is that way and the spoke's route table sends
          `0.0.0.0/0` to it - `userDefinedRouting`, which only works once the route table, the
          firewall rules and DNS exist, and otherwise the cluster never becomes healthy. The
          other two create public addresses owned by the cluster. Named in the request or an `open:` entry owned by the platform team; the default is `loadBalancer`. **Fixed at creation.**
        forced_when: >
          `landing_zone: corp` expects `userDefinedRouting` where the request names a
          route table
        renders: network_profile.outbound_type / outboundType

  # -------------------------------------------------------------- node pools
  - id: node_pools
    title: Node pools
    questions:
      - id: system_pool_vm_size
        ask: Which VM size should the system pool use?
        type: string
        plain:
          en: "The system nodes are of the size {value}."
          de: "Die System-Knoten haben die Größe {value}."
        default: "Standard_D4ds_v5"
        why: >
          The system pool runs the cluster's own components (CoreDNS, the metrics server, the
          Cilium agents) and must be at least 2 vCPU and 4 GiB; 4 vCPU leaves room once the
          add-ons below run. A size with a local cache disk large enough for the OS disk allows
          an ephemeral disk. Availability and quota differ by region and subscription - checked
          with `az vm list-skus --location <region> --zone` before a render, and a size that
          has no zones breaks `zone_redundant`. The size of a pool is fixed; changing it replaces
          the pool.
        renders: default_agent_pool.vm_size / primaryAgentPoolProfiles[].vmSize

      - id: system_pool_min_count
        ask: How many system nodes must always be running?
        type: int
        plain:
          en: "At least {value} system nodes are always running."
          de: "Mindestens {value} System-Knoten laufen immer."
        derived_from:
          question: outage_impact
          map: { tolerable: 1, disruptive: 3, critical: 3 }
        non_production_default: 1
        confirm_in: [production]
        why: >
          Derived from how bad an outage is. One node is a single point of failure for DNS and
          every add-on; three keeps one in each zone through the loss of a node or a zone and
          through an upgrade, which drains one node at a time. The pool autoscales between this
          and the maximum. The non-production stages take 1 while non_production_savings is
          enabled.
        forced_when: >
          `zone_redundant: true` forces at least 3 - fewer leaves a zone with no system node
        renders: default_agent_pool.min_count and count_of / primaryAgentPoolProfiles[].minCount and count

      - id: system_pool_max_count
        ask: How many system nodes may the pool scale out to?
        type: int
        plain:
          en: "The system pool may grow to at most {value} nodes."
          de: "Der System-Pool darf auf höchstens {value} Knoten wachsen."
        default: 5
        why: >
          The system pool grows with the cluster's add-ons and its node count, not with the
          workload; five is a guard against runaway scale-out of a pool that should be boring.
        renders: default_agent_pool.max_count / primaryAgentPoolProfiles[].maxCount

      - id: system_pool_dedicated
        ask: Should the system pool run only the cluster's own components?
        type: bool
        plain:
          en: "The system pool {value} workloads."
          de: "Der System-Pool {value} Workloads."
        plain_values:
          true: { en: "does not take", de: "nimmt keine" }
          false: { en: "also takes", de: "nimmt auch" }
        default: true
        why: >
          A `CriticalAddonsOnly=true:NoSchedule` taint keeps application pods off the system
          nodes, so a runaway workload cannot starve CoreDNS. It requires the user pool below to
          exist - without it nothing but system components schedules. Turn it off only on a
          single small pool.
        renders: default_agent_pool.node_taints / primaryAgentPoolProfiles[].nodeTaints

      - id: user_pool_vm_size
        ask: Which VM size should the workload nodes use?
        type: string
        plain:
          en: "The workload nodes are of the size {value}."
          de: "Die Workload-Knoten haben die Größe {value}."
        default: "Standard_D4ds_v5"
        depends_on: { question: system_pool_dedicated, equals: true }
        why: >
          The user pool runs the workloads and is where size follows measurement: requests and
          limits of the pods, not guesses. General-purpose 4 vCPU is a start; memory- or
          compute-optimised families are a departure for a measured reason. Same availability
          and quota check as the system pool. The size of a pool is fixed; changing it replaces
          the pool.
        renders: agent_pools.user.vm_size / agentPools[].vmSize

      - id: user_pool_min_count
        ask: How many workload nodes must always be running?
        type: int
        plain:
          en: "At least {value} workload nodes are always running."
          de: "Mindestens {value} Workload-Knoten laufen immer."
        derived_from:
          question: outage_impact
          map: { tolerable: 1, disruptive: 3, critical: 3 }
        non_production_default: 1
        confirm_in: [production]
        depends_on: { question: system_pool_dedicated, equals: true }
        why: >
          Derived from how bad an outage is, like the system pool: one node per zone keeps the
          workloads answering through the loss of a zone, and the pod disruption budgets of the
          workloads decide whether an upgrade drain is invisible. Billed per node per hour. The
          non-production stages take 1 while non_production_savings is enabled.
        forced_when: >
          `zone_redundant: true` forces at least 3
        renders: agent_pools.user.min_count and count_of / agentPools[].minCount and count

      - id: user_pool_max_count
        ask: How many workload nodes may the pool scale out to?
        type: int
        plain:
          en: "The workload pool may grow to at most {value} nodes."
          de: "Der Workload-Pool darf auf höchstens {value} Knoten wachsen."
        default: 10
        depends_on: { question: system_pool_dedicated, equals: true }
        why: >
          A ceiling on cost and on the systems the workloads call. Ten is a guard, not a
          measurement. The subscription's vCPU quota for the family is the hard stop beneath it
          and is checked before a render.
        renders: agent_pools.user.max_count / agentPools[].maxCount

      - id: os_sku
        ask: Which operating system should the nodes run?
        type: enum
        plain:
          en: "The nodes run {value}."
          de: "Die Knoten laufen mit {value}."
        plain_values:
          AzureLinux: { en: "Azure Linux, Microsoft's slim container host", de: "Azure Linux, Microsofts schlankem Container-Host" }
          Ubuntu: { en: "Ubuntu", de: "Ubuntu" }
        values: [AzureLinux, Ubuntu]
        default: AzureLinux
        why: >
          Azure Linux is a minimal image with a smaller attack surface and the fewer packages to
          patch, maintained and supported by Microsoft for AKS. Ubuntu is for a workload that
          needs its packages or a kernel module the other lacks. Names the generic family; the
          release (`AzureLinux3`, `Ubuntu2204`, `Ubuntu2404`) is the platform's current mapping
          and is read from the module README of the pinned version.
        renders: default_agent_pool.os_sku and agent_pools.user.os_sku / primaryAgentPoolProfiles[].osSKU and agentPools[].osSKU

      - id: os_disk_type
        ask: Where should the nodes' operating system disks live?
        type: enum
        plain:
          en: "Node system disks are {value}."
          de: "Die Systemplatten der Knoten sind {value}."
        plain_values:
          Ephemeral: { en: "on the node's local storage, fast, free and gone with the node", de: "auf dem lokalen Speicher des Knotens, schnell, kostenlos und mit dem Knoten weg" }
          Managed: { en: "network disks, billed and surviving the node", de: "Netzwerkplatten, kostenpflichtig und den Knoten überlebend" }
        values: [Ephemeral, Managed]
        default: Ephemeral
        why: >
          Nodes are replaced, never repaired, so nothing on the OS disk is worth keeping;
          ephemeral disks start nodes faster and cost nothing. They need a VM size whose cache or
          temp disk holds the OS disk (a size without one fails at creation). `Managed` is for a
          size that has no such disk.
        renders: default_agent_pool.os_disk_type and agent_pools.user.os_disk_type / primaryAgentPoolProfiles[].osDiskType and agentPools[].osDiskType

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity and access
    questions:
      - id: managed_identity
        ask: Which managed identity should the cluster carry?
        type: enum
        plain:
          en: "The cluster uses {value} to manage Azure resources for itself."
          de: "Der Cluster nutzt {value}, um Azure-Ressourcen für sich zu verwalten."
        plain_values:
          system_assigned: { en: "its own identity", de: "eine eigene Identität" }
          user_assigned: { en: "a separately managed identity", de: "eine separat verwaltete Identität" }
        values: [system_assigned, user_assigned]
        default: user_assigned
        why: >
          The cluster identity creates the load balancer, the disks and - in a node subnet it
          does not own - needs `Network Contributor` on that subnet, and `Private DNS Zone
          Contributor` on a custom zone, **before the cluster is created**. A system-assigned
          identity exists only with the cluster and cannot hold either role in time, so a
          cluster in a referenced network is `user_assigned`. System-assigned works for a
          cluster in a subnet its own deployment created and on the system DNS zone. Only one of
          the two exists per cluster.
        forced_when: >
          `private_dns_zone: custom` and a referenced node subnet (`network_ownership: reference`)
          force `user_assigned`, recorded as forced with the question as forced_by
        renders: managed_identities / managedIdentities (identity.type on the cluster)

      - id: user_assigned_identity_ids
        ask: Which user-assigned identity?
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        ref: user_assigned_identity
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          The identity must already exist and hold its roles on the subnet and the DNS zone; this
          set does not create it or grant them.
        renders: managed_identities.user_assigned_resource_ids / managedIdentities.userAssignedResourceIds

      - id: entra_integration
        ask: Should people sign in to the cluster with their company accounts?
        type: bool
        plain:
          en: "Signing in to the cluster with company accounts is {value}."
          de: "Die Anmeldung am Cluster mit Firmenkonten ist {value}."
        plain_values:
          true: { en: "on, and decides who may do what in Kubernetes", de: "an und entscheidet, wer in Kubernetes was darf" }
          false: { en: "off, only the cluster's own certificates work", de: "aus, nur die eigenen Zertifikate des Clusters funktionieren" }
        default: true
        why: >
          Managed Entra ID integration puts every `kubectl` call behind a named, conditional-access
          protected account instead of a shared certificate in a kubeconfig. It is the precondition
          for switching local accounts off below. Without it the only way in is a certificate
          admin.
        renders: aad_profile.managed / aadProfile.managed

      - id: azure_rbac_enabled
        ask: Should Azure role assignments decide what people may do inside Kubernetes?
        type: bool
        plain:
          en: "What people may do inside the cluster is decided by {value}."
          de: "Was Personen im Cluster dürfen, entscheidet {value}."
        plain_values:
          true: { en: "Azure role assignments, the same place as everything else", de: "Azure-Rollenzuweisungen, am gleichen Ort wie alles andere" }
          false: { en: "Kubernetes' own role bindings, kept in the cluster", de: "die eigenen Rollenbindungen von Kubernetes im Cluster" }
        default: true
        depends_on: { question: entra_integration, equals: true }
        why: >
          Azure RBAC for Kubernetes authorisation means `Azure Kubernetes Service RBAC Reader`,
          `Writer` and `Admin` roles at cluster or namespace scope, audited and removed with the
          rest of the access reviews; Kubernetes `RoleBinding`s are a second system nobody
          reviews. The roles themselves are `role_assignments` below. Kubernetes RBAC stays
          enabled either way.
        renders: aad_profile.enable_azure_rbac / aadProfile.enableAzureRBAC

      - id: admin_group_object_ids
        ask: Which Entra group administers the cluster?
        type: list
        plain:
          en: "The cluster is administered by the group {value}."
          de: "Der Cluster wird von der Gruppe {value} verwaltet."
        ref: entra_group
        required: true
        depends_on: { question: entra_integration, equals: true }
        per_environment: true
        why: >
          Members get `cluster-admin`, which bypasses Azure RBAC - the break-glass access that
          still works when role assignments are wrong. A small group, ideally eligible through
          privileged identity management, never a team. With local accounts off, the lock-out
          without it is complete.
        renders: aad_profile.admin_group_object_ids / aadProfile.adminGroupObjectIDs

      - id: local_accounts_disabled
        ask: May anyone use the cluster's built-in administrator certificate?
        type: bool
        plain:
          en: "The built-in administrator certificate is {value}."
          de: "Das eingebaute Administrator-Zertifikat ist {value}."
        plain_values:
          true: { en: "switched off", de: "abgeschaltet" }
          false: { en: "available to anyone who can list the cluster's credentials", de: "für jeden verfügbar, der die Zugangsdaten des Clusters auflisten darf" }
        from_deployment: local_auth
        confirm_in: [production]
        why: >
          Inherited, inverted: `local_auth: disabled` renders as `true`. A static admin
          kubeconfig is a long-lived, unattributable credential with `cluster-admin`; with it off,
          `az aks get-credentials --admin` stops working and every call is a signed-in person or
          workload. Requires `entra_integration`. **The Bicep module defaults to `true`**, the
          Terraform module to `false`: written.
        renders: disable_local_accounts / disableLocalAccounts

      - id: oidc_issuer_enabled
        ask: Should the cluster publish an identity issuer for its workloads?
        type: bool
        plain:
          en: "The cluster {value} an identity issuer that Azure can trust."
          de: "Der Cluster {value} einen Identitätsaussteller, dem Azure vertraut."
        plain_values:
          true: { en: "publishes", de: "veröffentlicht" }
          false: { en: "does not publish", de: "veröffentlicht keinen" }
        default: true
        why: >
          The OIDC issuer is the signing authority behind the service-account tokens that
          workload identity federates with Entra ID: without it a pod has no way to prove who it
          is except a secret. It exposes only public keys. **Bicep defaults to `false`**, the
          Terraform module leaves it unset: written. Forced by workload identity.
        forced_when: >
          `workload_identity_enabled: true` forces `true`, recorded as forced with
          `workload_identity_enabled` as forced_by
        renders: oidc_issuer_profile.enabled / enableOidcIssuerProfile

      - id: workload_identity_enabled
        ask: Should pods reach Azure services with their own identity instead of a secret?
        type: bool
        plain:
          en: "Pods reaching Azure services {value}."
          de: "Pods, die Azure-Dienste nutzen, {value}."
        plain_values:
          true: { en: "sign in as an Entra identity bound to their service account - no secret stored", de: "melden sich als Entra-Identität an, die an ihr Service-Konto gebunden ist - kein Geheimnis gespeichert" }
          false: { en: "must bring a secret or a node-wide identity", de: "müssen ein Geheimnis oder eine knotenweite Identität mitbringen" }
        default: true
        why: >
          Identity over keys, for pods: a federated credential ties one service account to one
          user-assigned identity with exactly the roles that workload needs, replacing
          connection strings in secrets and the node-wide identity every pod on a node would
          share. The identities and federated credentials are the workload's and are wiring, not
          this set. Replaces the retired pod-managed identity.
        renders: security_profile.workload_identity.enabled / securityProfile.workloadIdentity.enabled

      - id: acr_pull_registry_ids
        ask: Which container registries does the cluster pull images from?
        type: list
        plain:
          en: "The cluster may pull images from: {value}."
          de: "Der Cluster darf Images beziehen aus: {value}."
        ref: container_registry
        default: []
        per_environment: true
        why: >
          Each entry gets `AcrPull` for the cluster's **kubelet identity** at the registry's
          scope - nothing broader, never the admin account. The kubelet identity is created with
          the cluster, so the role is granted after it, as wiring in the root (not a module
          input); a pull before the role has propagated ends in `ImagePullBackOff` that looks like
          a bad image. An empty list is a cluster that can run only public images: with no
          registry named it is an `open:` entry owned by the workload owner.
        renders: role assignment (`AcrPull`, principal = the kubelet identity) on each registry, rendered in the root

      - id: role_assignments
        ask: Who may manage the cluster, and who may use it?
        type: list
        plain:
          en: "Access rights on the cluster granted to: {value}."
          de: "Zugriffsrechte auf den Cluster vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Azure RBAC on the cluster: `Azure Kubernetes Service Cluster User Role` so a person can
          fetch a kubeconfig at all, and with `azure_rbac_enabled` the `Azure Kubernetes Service
          RBAC Reader` / `Writer` / `Admin` roles, at cluster scope or narrower (a namespace is
          `<cluster id>/namespaces/<name>`). Scope as tightly as the consumer allows; an empty
          list is a cluster only the admin group can use.
        renders: role_assignments / roleAssignments

  # ----------------------------------------------------------------- security
  - id: security
    title: Security
    questions:
      - id: defender_enabled
        ask: Should Microsoft Defender watch the cluster for threats?
        type: bool
        plain:
          en: "Threat detection on the cluster is {value}."
          de: "Die Bedrohungserkennung am Cluster ist {value}."
        plain_values:
          true: { en: "on, with alerts for suspicious activity in the cluster and on the nodes", de: "an, mit Warnungen bei verdächtigen Vorgängen im Cluster und auf den Knoten" }
          false: { en: "off", de: "aus" }
        default: true
        confirm_in: [production]
        why: >
          Defender for Containers scans images and watches the runtime and the audit log; it is
          billed per vCPU of the cluster and **may already be switched on for the whole
          subscription by the platform**, in which case this is only the cluster-level sensor.
          Needs a workspace, the diagnostics destination below. No `non_production_default`: a
          development cluster that nobody watches is where an exposed dashboard is found by
          someone else.
        renders: security_profile.defender / securityProfile.defender

      - id: azure_policy_enabled
        ask: Should Azure Policy be able to check and enforce rules inside the cluster?
        type: bool
        plain:
          en: "Azure Policy rules inside the cluster are {value}."
          de: "Azure-Policy-Regeln im Cluster sind {value}."
        plain_values:
          true: { en: "checked and enforced", de: "geprüft und durchgesetzt" }
          false: { en: "not applied", de: "nicht angewendet" }
        default: true
        why: >
          The add-on carries the platform's pod security policies (no privileged containers, no
          host namespaces, allowed registries) into the cluster as admission control - without it
          a landing-zone policy initiative reports "not applicable" instead of enforcing. Cheap.
          Both modules default it to on; written.
        renders: addon_profile_azure_policy.enabled / azurePolicyEnabled

      - id: keyvault_secrets_provider_enabled
        ask: Should pods be able to mount secrets straight from a key vault?
        type: bool
        plain:
          en: "Mounting key vault secrets into pods is {value}."
          de: "Das Einbinden von Key-Vault-Geheimnissen in Pods ist {value}."
        plain_values:
          true: { en: "available, with automatic rotation", de: "verfügbar, mit automatischer Rotation" }
          false: { en: "not available", de: "nicht verfügbar" }
        default: true
        why: >
          The Secrets Store CSI driver reads a vault secret with the pod's workload identity and
          mounts it as a file, so the secret is never a Kubernetes `Secret` stored in etcd. It
          adds one add-on identity. Rotation is on so a rotated secret reaches the pod without a
          redeploy. The vault, its role assignments and the `SecretProviderClass` are the
          workload's. Bicep defaults to `false`: written.
        renders: addon_profile_key_vault_secrets_provider / enableKeyvaultSecretsProvider and enableSecretRotation

      - id: image_cleaner_enabled
        ask: Should unused container images be removed from the nodes?
        type: bool
        plain:
          en: "Old, unused images on the nodes are {value}."
          de: "Alte, unbenutzte Images auf den Knoten werden {value}."
        plain_values:
          true: { en: "removed every week", de: "wöchentlich entfernt" }
          false: { en: "kept", de: "behalten" }
        default: true
        why: >
          Images with known vulnerabilities that no pod uses any more still sit on the node disk
          and can be started by anyone with node access. The cleaner removes them every 7 days
          (168 hours) and frees disk. Cheap.
        renders: security_profile.image_cleaner / securityProfile.imageCleaner (enabled, intervalHours = 168)

      - id: encryption_at_host
        ask: Should data on the nodes be encrypted on the host as well?
        type: bool
        plain:
          en: "Encryption of node disks and caches on the host itself is {value}."
          de: "Die Verschlüsselung von Knoten-Platten und Caches auf dem Host selbst ist {value}."
        plain_values:
          true: { en: "on, including temporary disks and caches", de: "an, einschließlich temporärer Platten und Caches" }
          false: { en: "off, temporary disks and caches stay unencrypted", de: "aus, temporäre Platten und Caches bleiben unverschlüsselt" }
        default: true
        why: >
          Server-side encryption covers the managed disks; encryption at host also covers the
          temporary disk, the ephemeral OS disk and the cache, and encrypts the data before it
          leaves the host. Needs the `EncryptionAtHost` feature registered on the subscription
          and a VM size that supports it - a missing registration fails the pool at creation.
          **Set when the pool is created.**
        renders: default_agent_pool.enable_encryption_at_host and agent_pools.user.enable_encryption_at_host / primaryAgentPoolProfiles[].enableEncryptionAtHost and agentPools[].enableEncryptionAtHost

      - id: key_management
        ask: Are the nodes' disk encryption keys platform-managed or customer-managed?
        type: enum
        plain:
          en: "Encryption keys for node disks are {value}."
          de: "Verschlüsselungsschlüssel für Knoten-Platten sind {value}."
        plain_values:
          platform_managed: { en: "managed by Azure - encrypted, rotated, no effort on your side", de: "von Azure verwaltet: verschlüsselt, rotiert, kein Aufwand bei euch" }
          customer_managed: { en: "your own, held in your key vault, so you can revoke them", de: "eure eigenen in eurem Schlüsseltresor, damit ihr sie zurückziehen könnt" }
        values: [platform_managed, customer_managed]
        from_deployment: key_management
        confirm_in: [production]
        why: >
          Inherited. Disks are encrypted at rest with a platform key either way; `customer_managed`
          means a **disk encryption set** over the customer's Key Vault key, with purge protection
          and a rotation story. Only the node and persistent-volume disks are covered; encrypting
          Kubernetes secrets in etcd with a vault key (KMS) is a separate feature and not rendered.
          **Set at creation.**
        renders: disk_encryption_set_id / diskEncryptionSetResourceId

      - id: disk_encryption_set_id
        ask: Which disk encryption set should encrypt the node disks?
        type: ref
        plain:
          en: "Node disks are encrypted with your key set {value}."
          de: "Knoten-Platten werden mit eurem Schlüsselsatz {value} verschlüsselt."
        ref: disk_encryption_set
        required: true
        depends_on: { question: key_management, equals: customer_managed }
        per_environment: true
        why: >
          The set must exist, point at a Key Vault key with purge protection, and the cluster
          identity needs `Reader` on it. A cluster whose key is revoked loses every disk. This set
          does not create the set or the key.
        renders: disk_encryption_set_id / diskEncryptionSetResourceId

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask: Which Log Analytics workspace should receive diagnostics?
        type: ref
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        ref: log_analytics_workspace
        from_deployment: diagnostics_destination
        per_environment: true
        why: >
          Inherited: one deployment, one destination. The cluster's control-plane logs, the
          container insights data and Defender all go to it; the control plane's audit log is the
          record of who did what in Kubernetes.
        renders: diagnostic_settings / diagnosticSettings

      - id: diagnostic_categories
        ask: Which control-plane log categories should be collected?
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          kube-audit-admin: { en: "every change made to the cluster by a person or a program", de: "jede Änderung am Cluster durch eine Person oder ein Programm" }
          kube-audit: { en: "every request to the cluster's API, reads included - a very large volume", de: "jede Anfrage an die API des Clusters, auch lesende - ein sehr großes Volumen" }
          guard: { en: "sign-ins through the company directory", de: "Anmeldungen über das Firmenverzeichnis" }
          kube-apiserver: { en: "the API server's own log", de: "das eigene Log des API-Servers" }
          kube-controller-manager: { en: "the controllers that keep the cluster in its desired state", de: "die Controller, die den Cluster im Sollzustand halten" }
          kube-scheduler: { en: "the decisions about which node a pod lands on", de: "die Entscheidungen, auf welchem Knoten ein Pod landet" }
          cluster-autoscaler: { en: "why nodes were added or removed", de: "warum Knoten hinzugefügt oder entfernt wurden" }
          cloud-controller-manager: { en: "the cluster's calls to Azure for load balancers and routes", de: "die Aufrufe des Clusters an Azure für Lastverteiler und Routen" }
        values: [kube-audit-admin, kube-audit, guard, kube-apiserver, kube-controller-manager, kube-scheduler, cluster-autoscaler, cloud-controller-manager]
        default: [kube-audit-admin, guard, cluster-autoscaler]
        why: >
          `kube-audit-admin` is the audit: it records changes and leaves out the reads that make
          `kube-audit` the most expensive log in Azure; `guard` is the Entra sign-in trail and
          cheap. `cluster-autoscaler` explains the bill. The rest is for diagnosing a failing
          control plane and is added for a reason. The names are the platform's and are checked
          against `az monitor diagnostic-settings categories list --resource <cluster id>` before
          a render, not remembered.
        renders: diagnostic_settings.<key>.log_categories / diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask: Should all metrics be collected?
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: "collected", de: "erfasst" }
          false: { en: "not collected", de: "nicht erfasst" }
        default: true
        why: >
          API-server request and latency metrics and node-count figures are what decide whether
          the tier and the pool bounds were right, and they are cheap.
        renders: diagnostic_settings.<key>.metric_categories = ["AllMetrics"] / metricCategories[].category

      - id: container_insights_enabled
        ask: Should the cluster report how its nodes and containers perform?
        type: bool
        plain:
          en: "Performance and log data from nodes and containers is {value}."
          de: "Leistungs- und Logdaten von Knoten und Containern werden {value}."
        plain_values:
          true: { en: "collected in the workspace", de: "im Workspace gesammelt" }
          false: { en: "not collected", de: "nicht gesammelt" }
        default: true
        confirm_in: [production]
        why: >
          Container insights is the agent that ships the containers' console output, the node and
          pod metrics and the Kubernetes events to the workspace - the only place a crashed pod's
          last line survives. It signs in with the cluster's managed identity (`use_aad_auth`),
          not the workspace key. Ingestion volume is the cost line on a chatty cluster and the
          reason to watch the workspace's daily cap; no `non_production_default` here, because the
          volume is set by what the containers write, not by a switch. Managed Prometheus is a
          separate, not rendered feature.
        renders: addon_profile_oms_agent and onboard_monitoring / omsAgentEnabled, monitoringWorkspaceResourceId and omsAgentUseAADAuth
