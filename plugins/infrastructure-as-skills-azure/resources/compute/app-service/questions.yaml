schema_version: 1

resource: Microsoft.Web/sites
title: Azure App Service (web app on an App Service plan)

# The site is the resource; the plan it runs on (Microsoft.Web/serverFarms, abbreviation
# `plan`, identifier `Azure::Microsoft.Web/serverFarms`) is created with it and decided in
# the `hosting` group, or - with `plan: shared` - belongs to another instance of this set
# whose plan this site runs on.
naming:
  terraform: "Azure::Microsoft.Web/sites"
  bicep: "Microsoft.Web/sites"
  # Bicep assembles the name from vars - this is the prefix it renders.
  abbreviation: "app"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform."
  - "Does not create the Log Analytics workspace it routes diagnostics to."
  - "Does not create the integration subnet when the network is referenced; under network_ownership: create the virtual-network set carries it."
  - "Does not create the Application Insights component - its own set (observability/application-insights), brought in by the deployment's application_monitoring; `application_insights` below wires the app to it."
  - "Does not create custom domains, certificates, Easy Auth or backups. Each is a separate concern and has no question set yet."
  - "Does not deploy code into a slot or swap it. Deploying and swapping are the application's release, not the infrastructure's; the `slots` group decides only what the slots are."
  - "Does not create the user-assigned identity app and slots share. The user-assigned-identity set does, routed in addition when `deployment_slots` is not empty."
  - "Does not create function apps, Container Apps or an App Service Environment. They have sets of their own (`function-app`, `container-apps`) or none (App Service Environment)."
  - "Does not grant the app's identity roles on the services it calls - that is wiring between resources, owned by a pattern."
  - "Does not set application settings or connection strings. They are deployment configuration, and a secret never goes into a template (use a Key Vault reference)."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name and the strictness of several defaults below.
          Nothing sensible can be guessed.
        renders: naming parameter `environment`, and the tag of that name where the repository uses one

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          Part of the rendered name and not inferable. Zone redundancy and the
          Premium v3 SKUs are not available in every region, so the region
          constrains the hosting group below.
        renders: location (plan and site)

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        ref: resource_group
        required: true
        from_context: true
        per_environment: true
        why: >
          The plan and the app are placed into an existing group. Creating one here
          would make this set own a lifecycle wider than the resources it describes.
        renders: parent_id (AVM Terraform) / resource_group_name / implicit in Bicep scope

  # ------------------------------------------------------------------ hosting
  - id: hosting
    title: Hosting plan
    questions:
      - id: plan
        ask: Should the app run on a hosting plan of its own, or on another app's plan?
        type: enum
        plain:
          en: "The app runs on {value}."
          de: "Die App läuft auf {value}."
        plain_values:
          own: { en: "a hosting plan of its own", de: "einem eigenen Hosting-Plan" }
          shared: { en: "the hosting plan of another app, sharing its capacity", de: "dem Hosting-Plan einer anderen App und teilt sich dessen Kapazität" }
        values: [own, shared]
        default: own
        why: >
          A plan is the machine the apps run on and is what is billed: two apps on one plan
          pay once and compete for the same cores and memory; two plans pay twice and cannot
          starve each other. Own is the default because a noisy neighbour is the harder fault
          to find. Shared is right for small, related apps of one workload (a dashboard and its
          admin API) that together fit the plan's size, and it is the only way to a second app
          for the price of the first. A shared plan has **one** operating system, one size, one
          zone setting, one instance count and one VNet integration subnet - the owner's - so
          the questions about them are not asked of the second app. Deployment slots and scale-out
          also draw on the shared capacity. The private endpoint stays per app.
        forced_when: >
          `shared` removes `os_type`, `sku`, `zone_redundant` and `instance_count` from this
          instance (they are the plan owner's), and forces `vnet_integration` and
          `integration_subnet` to the owner's values - a plan has one integration subnet -
          recorded as forced with `plan` as forced_by
        renders: >
          own: the plan resource (azurerm_service_plan / Microsoft.Web/serverFarms) is created
          with this site; shared: no plan resource, the site's service_plan_id /
          serverFarmResourceId is the owner's plan id

      - id: shared_plan_with
        ask: Whose hosting plan does the app run on?
        type: ref
        plain:
          en: "It shares the plan of {value}."
          de: "Es teilt sich den Plan von {value}."
        ref: app_service
        required: true
        depends_on: { question: plan, equals: shared }
        why: >
          The instance of this set (`app-service__<name>`) that owns the plan. It is created
          first; the second site takes its plan id, so the order is owner, plan, then this site.
          An owner that is itself shared is refused: the plan is created exactly once.
        renders: >
          service_plan_id (module input `service_plan_resource_id`) / serverFarmResourceId of
          the owner's plan

      - id: os_type
        ask: Linux or Windows hosting?
        type: enum
        plain:
          en: "The app runs on {value}."
          de: "Die App läuft auf {value}."
        plain_values:
          Linux: { en: "Linux", de: "Linux" }
          Windows: { en: "Windows", de: "Windows" }
        values: [Linux, Windows]
        default: Linux
        depends_on: { question: plan, equals: own }
        why: >
          Linux is cheaper at the same SKU, supports every current stack and is where
          custom containers run. Windows is for what needs it - .NET Framework, not
          .NET - and the choice is fixed per plan: an app cannot move between a
          Linux and a Windows plan, it is redeployed.
        renders: os_type / kind and reserved on the plan

      - id: sku
        ask: Which plan size?
        type: enum
        plain:
          en: "The hosting plan is size {value}."
          de: "Der Hosting-Plan hat die Größe {value}."
        plain_values:
          B1: { en: "B1, small and cheap, no zone redundancy - for stages nobody depends on", de: "B1, klein und günstig, ohne Zonenredundanz, für Stufen von denen niemand abhängt" }
          B2: { en: "B2, basic, two cores", de: "B2, Basic, zwei Kerne" }
          B3: { en: "B3, basic, four cores", de: "B3, Basic, vier Kerne" }
          P0v3: { en: "P0v3, the smallest premium size, zone redundancy possible", de: "P0v3, die kleinste Premium-Größe, Zonenredundanz möglich" }
          P1v3: { en: "P1v3, premium, the normal production size", de: "P1v3, Premium, die übliche Produktionsgröße" }
          P2v3: { en: "P2v3, premium, twice P1v3", de: "P2v3, Premium, doppelt so groß wie P1v3" }
          P3v3: { en: "P3v3, premium, four times P1v3", de: "P3v3, Premium, viermal so groß wie P1v3" }
          P1mv3: { en: "P1mv3, premium with extra memory", de: "P1mv3, Premium mit mehr Arbeitsspeicher" }
          P2mv3: { en: "P2mv3, premium with extra memory, twice P1mv3", de: "P2mv3, Premium mit mehr Arbeitsspeicher, doppelt so groß wie P1mv3" }
          P3mv3: { en: "P3mv3, premium with extra memory, four times P1mv3", de: "P3mv3, Premium mit mehr Arbeitsspeicher, viermal so groß wie P1mv3" }
        values: [B1, B2, B3, P0v3, P1v3, P2v3, P3v3, P1mv3, P2mv3, P3mv3]
        derived_from:
          question: expected_load
          map: { small: P1v3, medium: P2v3, large: P3v3 }
        depends_on: { question: plan, equals: own }
        non_production_default: B1
        confirm_in: [production]
        why: >
          Premium v3 is the floor for production: it is the family that supports
          zone redundancy, VNet integration with private endpoints at full speed, and
          deployment slots, and it is the only one a reserved-instance discount applies
          to. Free, Shared and Standard are left out on purpose - Free and Shared have
          no Always On, no VNet integration and no private endpoint, and Standard is
          priced like Premium v3 for older hardware. Basic is allowed for stages where
          cost is the point, and `non_production_default` takes it while
          non_production_savings is enabled. The size is a cost knob, not a security
          one, which is the only reason a stage may differ here; it can be changed
          in place within a family, while changing family (B to P) restarts the app.
          Isolated v2 is an App Service Environment and has its own question set.
        forced_when: >
          `deployment_slots` not empty removes B1, B2 and B3 in every stage - a Basic plan has
          no deployment slots - and with them `non_production_default`; the smallest size is
          then P0v3, recorded as forced with `deployment_slots` as forced_by
        renders: sku_name / sku.name on the plan

      - id: zone_redundant
        ask: Should the plan survive the loss of an availability zone?
        type: bool
        plain:
          en: "The app {value} survive the loss of one datacenter of the region."
          de: "Die App {value} den Ausfall eines Rechenzentrums der Region."
        plain_values:
          true: { en: "does", de: "übersteht" }
          false: { en: "does not", de: "übersteht nicht" }
        derived_from:
          question: outage_impact
          map: { tolerable: false, disruptive: true, critical: true }
        depends_on: { question: plan, equals: own }
        confirm_in: [production]
        non_production_default: false
        why: >
          Derived from how bad an outage is, answered once for the whole system.
          Zone redundancy spreads the plan's instances over three zones; it needs a
          Premium v3 size, a region with zones and **at least two instances**, and it
          can only be set when the plan is created - turning it on later is a new
          plan and a redeploy. `tolerable` is the one answer without it. `critical`
          has the same value here as `disruptive` because App Service has no
          cross-region mode: a second region is a second deployment behind a global
          front door, a pattern, and this set says so when `critical` is chosen. The
          derivation is production's; the non-production stages take `false` while
          non_production_savings is enabled, which is also what lets them run on a
          Basic plan.
        forced_when: >
          A Basic `sku` forces `false` - the size cannot be zone redundant - recorded
          as forced with `sku` as forced_by. `true` forces `instance_count` to at least 2
        renders: zone_redundant / zoneRedundant / zone_balancing_enabled on the plan

      - id: instance_count
        ask: How many instances should run?
        type: int
        plain:
          en: "Copies of the app running at the same time: {value}."
          de: "Gleichzeitig laufende Kopien der App: {value}."
        derived_from:
          question: outage_impact
          map: { tolerable: 1, disruptive: 2, critical: 3 }
        depends_on: { question: plan, equals: own }
        non_production_default: 1
        why: >
          Derived from the same answer. One instance is a single point of failure that
          is also restarted on every platform update; two is the minimum for zone
          redundancy and for an app that keeps answering during one; three puts one in
          each zone. Instances are billed one by one, so this is the cost of the
          answer, and autoscale is a separate decision with no question set yet. The
          count is a fixed number here, not a minimum.
        renders: worker_count (terraform) / skuCapacity (bicep) on the plan

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask: Should this app depart from the deployment's exposure posture?
        type: enum
        plain:
          en: "The app is {value}."
          de: "Die App ist {value}."
        plain_values:
          disabled: { en: "not reachable from the internet at all", de: "aus dem Internet überhaupt nicht erreichbar" }
          enabled_with_firewall: { en: "reachable from the internet only from listed addresses", de: "aus dem Internet nur von gelisteten Adressen erreichbar" }
          enabled: { en: "reachable from the internet", de: "aus dem Internet erreichbar" }
        values: [disabled, enabled_with_firewall, enabled]
        from_deployment: network_exposure
        confirm_in: [production]
        why: >
          Asked only as a departure, because exposure is a property of the system and
          not of one app - the deployment set already answered it. The mapping is
          `private` to `disabled`, `public` to `enabled_with_firewall`: a public web
          app is reachable by design, but the unrestricted form is a departure
          recorded as `overridden`, and a bare `enabled` here means no access
          restrictions at all. Web apps are the resource where `public` is most often
          the honest answer, so the allowlist (`ip_restrictions`) is what makes it a
          posture rather than an absence of one. With `disabled` the app answers only
          through its private endpoint, which also closes the Kudu/SCM site.
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces
          `enabled`, recorded as forced with `network_ownership` as forced_by: the
          deployment's own callers have no fixed outbound address, so a firewall with no
          rule locks them out of this resource - the first dry run (2026-10-24) hit it on
          five resources at once
        renders: >
          terraform: public_network_access_enabled and site_config.ip_restriction_default_action;
          bicep: publicNetworkAccess and siteConfig.ipSecurityRestrictionsDefaultAction

      - id: private_endpoint_subnet
        ask: Which subnet should this app's private endpoint live in?
        type: ref
        resolved_by: derived
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        ref: subnet
        from_deployment: private_endpoint_subnet
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited
          rather than asked. The app has exactly one sub-resource, `sites`, so there is
          no list of services to choose from; the endpoint exists when
          `public_network_access` is `disabled`, and is the thing that makes it so.
        renders: private_endpoints.<key>.subnet_resource_id / privateEndpoints[].subnetResourceId

      - id: vnet_integration
        ask: Does the app call services that are only reachable privately?
        type: bool
        plain:
          en: "The app's own outgoing traffic {value}."
          de: "Der ausgehende Verkehr der App {value}."
        plain_values:
          true: { en: "goes through the company network, so it can reach private services", de: "läuft durch das Firmennetz, so erreicht sie private Dienste" }
          false: { en: "goes out over the public internet", de: "geht über das öffentliche Internet raus" }
        default: true
        why: >
          The private endpoint is for traffic *into* the app; calls *out* of it -
          to a database, a storage account, a vault behind their own private
          endpoints - need regional VNet integration, a separate feature people
          routinely mistake for the first. Without it the app cannot reach a private
          backend, and the failure looks like a timeout in the app, not a
          configuration error. True is the default because the posture is private;
          it is false for a deployment without a network (`network_ownership: none`),
          which forces it, and for an app that calls only public APIs.
        forced_when: >
          network_ownership: none (deployment) forces `false` - there is no subnet
          to integrate into
        renders: >
          terraform: virtual_network_subnet_id; bicep: virtualNetworkSubnetResourceId

      - id: integration_subnet
        ask: Which subnet does the app's outgoing traffic leave through?
        type: ref
        resolved_by: derived
        plain:
          en: "Outgoing traffic leaves through the subnet {value}."
          de: "Ausgehender Verkehr verlässt das Netz über das Subnetz {value}."
        ref: subnet
        required: true
        depends_on: { question: vnet_integration, equals: true }
        per_environment: true
        why: >
          The subnet must be **delegated to `Microsoft.Web/serverFarms`** and used by
          nothing else, and by one plan only: a delegated subnet is exclusive. A /26
          is the size to give it - the platform takes an address per instance, and
          scale-out and platform updates need headroom a /28 does not have. It is
          the platform's subnet when the network is referenced and a subnet of the
          created network otherwise, where the virtual-network set carries it with
          the delegation and this question is answered by that wiring, not asked.
        forced_when: >
          network_ownership: create - the created network's subnet, recorded as
          forced with the network as forced_by
        renders: >
          terraform: virtual_network_subnet_id; bicep: virtualNetworkSubnetResourceId

      - id: vnet_route_all
        ask: Should all outgoing traffic go through the network, or only traffic to private addresses?
        type: bool
        plain:
          en: "Outgoing traffic is routed {value}."
          de: "Ausgehender Verkehr wird {value} geleitet."
        plain_values:
          true: { en: "entirely through the company network, including to the internet", de: "komplett durch das Firmennetz geleitet, auch ins Internet" }
          false: { en: "through the company network only to private addresses", de: "nur für private Adressen durch das Firmennetz geleitet" }
        default: true
        depends_on: { question: vnet_integration, equals: true }
        why: >
          Without it only traffic to private (RFC 1918) addresses enters the VNet; the
          rest leaves from the platform's shared addresses, past the firewall and the
          route table the landing zone built for exactly this. It also decides whose
          DNS the app uses - the VNet's, which is what resolves private endpoints -
          so `false` is the form that breaks private name resolution for public
          names it should have blocked. True means the egress goes through whatever
          the subnet's route table says, and an app that needs to reach a public API
          needs that path allowed.
        renders: >
          terraform: vnet_route_all_traffic (the site_config.vnet_route_all_enabled
          form is the older spelling); bicep: outboundVnetRouting.allTraffic

      - id: ip_restrictions
        ask: Which public IP ranges may reach the app?
        type: list
        plain:
          en: "Public addresses allowed to reach the app: {value}."
          de: "Öffentliche Adressen, die die App erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist, with a default action of Deny. An empty list with
          the firewall enabled denies everything public, which is valid and
          deliberate - and, for a web app that is meant to be public, a blocker. A
          public app behind a CDN or front door lists that service's tag or address
          ranges here, not `0.0.0.0/0`, which is not an allowlist and which the
          guardrails reject. The same list guards the Kudu/SCM site.
        renders: >
          site_config.ip_restriction / siteConfig.ipSecurityRestrictions and
          scm_ip_restriction / scmIpSecurityRestrictions, default action Deny on both

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity and access
    questions:
      - id: managed_identity
        ask: Which managed identity should the app carry?
        type: enum
        plain:
          en: "The app has {value} for reaching other services."
          de: "Die App hat {value}, um andere Dienste zu erreichen."
        plain_values:
          system_assigned: { en: "its own identity", de: "eine eigene Identität" }
          user_assigned: { en: "a shared, separately managed identity", de: "eine gemeinsame, separat verwaltete Identität" }
          none: { en: "no identity of its own", de: "keine eigene Identität" }
        values: [system_assigned, user_assigned, none]
        default: system_assigned
        why: >
          A web app almost always reaches out - to a database, a vault, a storage
          account - and with `local_auth: disabled` a managed identity is the only way
          it can. System-assigned is the cheaper default and is deleted with the app;
          user-assigned is for an identity that must outlive the app, be shared by
          several, or hold its roles before the app exists (a Key Vault reference in
          the app settings needs the role at the first start, which a system-assigned
          identity cannot have). `none` is for an app that calls nothing.
        forced_when: >
          `deployment_slots` not empty forces `user_assigned`, one identity carried by the app
          and every slot, recorded as forced with `deployment_slots` as forced_by. A managed
          identity belongs to the slot, not to the code, and is not swapped: with an identity
          per slot every role is granted twice, and the code swapped into production runs as
          the identity that was warmed up as the other slot. One shared identity holds its roles
          before the first start and keeps them through every swap. `none` stays possible for an
          app that calls nothing.
        renders: managed_identities / managedIdentities (identity.type on the site)

      - id: user_assigned_identity_ids
        ask: Which user-assigned identities?
        type: list
        plain:
          en: "It uses the identities {value}."
          de: "Sie nutzt die Identitäten {value}."
        ref: user_assigned_identity
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          The identities must already exist; this set does not create them. Forced to the
          identity of the user-assigned-identity set when `deployment_slots` forces
          `user_assigned` - the design creates it, so it is wiring, never an open item.
        renders: managed_identities.user_assigned_resource_ids / managedIdentities.userAssignedResourceIds

  # ----------------------------------------------------------------- security
  - id: security
    title: Security
    questions:
      - id: https_only
        ask: Should the app refuse plain HTTP?
        type: bool
        plain:
          en: "Unencrypted connections are {value}."
          de: "Unverschlüsselte Verbindungen werden {value}."
        plain_values:
          true: { en: "redirected to the encrypted address", de: "auf die verschlüsselte Adresse umgeleitet" }
          false: { en: "accepted", de: "akzeptiert" }
        default: true
        why: >
          No current reason to serve HTTP from an app, and the redirect is free. Kept
          as a question only so a departure - a health probe from an appliance that
          cannot do TLS - is recorded rather than silently impossible. The module
          default is already true; it is written anyway.
        renders: https_only / httpsOnly

      - id: min_tls_version
        ask: What is the minimum TLS version?
        type: enum
        plain:
          en: "Connections must use at least {value} encryption."
          de: "Verbindungen müssen mindestens {value}-Verschlüsselung nutzen."
        plain_values:
          "1.2": { en: "TLS 1.2", de: "TLS 1.2" }
          "1.3": { en: "TLS 1.3", de: "TLS 1.3" }
        values: ["1.2", "1.3"]
        default: "1.2"
        why: >
          1.2 is the floor and non-negotiable. 1.3 is preferable where every client
          supports it, but an unsupported floor fails as an opaque connection reset, so
          raise it deliberately. Note the AVM Terraform module's own default is
          **1.3**, one step stricter than this set, which is why it is written on the
          call. The same version is applied to the Kudu/SCM site.
        renders: site_config.minimum_tls_version and scm_minimum_tls_version / siteConfig.minTlsVersion and scmMinTlsVersion

      - id: ftps_state
        ask: How may files be uploaded by FTP?
        type: enum
        plain:
          en: "File upload by FTP is {value}."
          de: "Dateiupload per FTP ist {value}."
        plain_values:
          Disabled: { en: "switched off", de: "abgeschaltet" }
          FtpsOnly: { en: "possible only encrypted (FTPS)", de: "nur verschlüsselt (FTPS) möglich" }
          AllAllowed: { en: "possible, also unencrypted", de: "möglich, auch unverschlüsselt" }
        values: [Disabled, FtpsOnly, AllAllowed]
        default: Disabled
        why: >
          Deployments go through the Kudu zip/OneDeploy endpoint, a pipeline or a
          container image; FTP is a leftover of file-copy deployment and a credential
          path next to Entra ID. Disabled is the default and the module's own is
          `FtpsOnly`, so it is written. `AllAllowed` is never a default and needs a
          recorded reason.
        renders: site_config.ftps_state / siteConfig.ftpsState

      - id: basic_auth_enabled
        ask: Should publishing with a username and password stay possible?
        type: bool
        plain:
          en: "Deploying with a user name and password is {value}; deployments run through company accounts."
          de: "Das Ausrollen mit Benutzername und Passwort ist {value}; Rollouts laufen über Firmenkonten."
        plain_values:
          true: { en: "possible", de: "möglich" }
          false: { en: "not possible", de: "nicht möglich" }
        from_deployment: local_auth
        confirm_in: [production]
        why: >
          Inherited: `local_auth: disabled` renders as `false` here. The publishing
          profile is a shared username and password for the Kudu site and for FTP, it
          does not expire, and its use is not attributable. Two separate switches carry
          it (FTP and SCM) and both are written - the AVM Terraform module's SCM
          default is **true**. The usual blocker is a pipeline still deploying with
          the publish profile: that is a migration to a service principal or federated
          credential with a deploy role, the kind of case `allowed_where_unavoidable`
          exists for, named at this app.
        renders: >
          terraform: ftp_publish_basic_authentication_enabled and
          scm_publish_basic_authentication_enabled; bicep:
          basicPublishingCredentialsPolicies (ftp and scm) allow

  # ------------------------------------------------------------------ runtime
  - id: runtime
    title: Runtime
    questions:
      - id: runtime_stack
        ask: In which technology is the application written - .NET, Node.js, Python, Java, PHP, or delivered as a container?
        type: enum
        plain:
          en: "The app is written for {value}."
          de: "Die App ist geschrieben für {value}."
        plain_values:
          dotnet: { en: ".NET", de: ".NET" }
          node: { en: "Node.js", de: "Node.js" }
          python: { en: "Python", de: "Python" }
          java: { en: "Java", de: "Java" }
          php: { en: "PHP", de: "PHP" }
          container: { en: "a container image that carries its own runtime", de: "ein Container-Image, das seine Laufzeit selbst mitbringt" }
        values: [dotnet, node, python, java, php, container]
        from_deployment: app_runtime
        why: >
          Inherited: the deployment set asks it once (app_runtime), before App Service is
          chosen, because the stack decides the service. A second app in another stack departs
          per instance (`overridden`). `container` is the stack for anything with a Dockerfile;
          it turns the version question into an image.
        renders: >
          site_config.application_stack / siteConfig.linuxFxVersion (or windowsFxVersion
          for the .NET and Java families on a Windows plan)

      - id: runtime_version
        ask: Which version of the runtime?
        type: string
        plain:
          en: "Runtime version {value}."
          de: "Laufzeit-Version {value}."
        required: true
        depends_on: { question: runtime_stack, not_equals: container }
        why: >
          Pinned, never `latest`: a runtime moves under an app only when someone
          chooses, and the choice is a deployment. Use a version the platform still
          supports - the platform retires runtimes, and a retired one stops receiving
          security patches before it stops running. The spelling differs by stack
          (`3.13`, `22-lts`, `9.0`, `21`) and is looked up in the platform's current
          list at render time, not remembered.
        renders: >
          site_config.application_stack.<stack>.<stack>_version /
          siteConfig.linuxFxVersion (`PYTHON|3.13`, `NODE|22-lts`, `DOTNETCORE|9.0`)

      - id: container_image
        ask: Which container image?
        type: string
        plain:
          en: "The app runs the container image {value}."
          de: "Die App führt das Container-Image {value} aus."
        required: true
        depends_on: { question: runtime_stack, equals: container }
        why: >
          Registry, repository and a **tag or digest that is not `latest`**, for the
          same reason as the runtime version. The registry is expected to exist - and
          to be pulled from with the app's managed identity (`AcrPull`), not an
          admin user, which is wiring this set does not own. A registry that is
          private needs the image pull to go over the VNet integration too.
        renders: >
          site_config.application_stack.docker / siteConfig.linuxFxVersion
          (`DOCKER|<image>`) with acrUseManagedIdentityCreds

      - id: always_on
        ask: Should the app stay loaded when nobody is calling it?
        type: bool
        plain:
          en: "The app {value} when there is no traffic."
          de: "Die App {value}, wenn kein Verkehr anliegt."
        plain_values:
          true: { en: "stays loaded and answers the first request at once", de: "bleibt geladen und antwortet sofort auf die erste Anfrage" }
          false: { en: "is unloaded after 20 idle minutes and starts slowly on the next request", de: "wird nach 20 Minuten Leerlauf entladen und startet bei der nächsten Anfrage langsam" }
        default: true
        why: >
          Without it the app is unloaded after 20 idle minutes and the next request pays
          the cold start - the "it is slow in the morning" report. It costs nothing
          extra on Basic and above, which is every size this set allows. It is also
          what keeps background threads and WebJobs running. The module default is
          true; it is written anyway.
        renders: site_config.always_on / siteConfig.alwaysOn

      - id: health_check_path
        ask: Which path reports whether the app is healthy?
        type: string
        plain:
          en: "The platform checks the app's health at the path {value} (empty: not checked)."
          de: "Die Plattform prüft die Gesundheit der App unter dem Pfad {value} (leer: keine Prüfung)."
        default: ""
        why: >
          With two instances or more, a failing health check takes the instance out of
          the load balancer, and after an hour replaces it - which is the difference
          between one bad instance and an outage. It needs an endpoint that exists and
          answers 2xx fast and without a dependency check that fails the whole fleet
          at once, and the plugin cannot invent one: `/health` that returns 404 marks
          every instance unhealthy. So the default is empty, and a path is the
          engineer's answer once the app has it. Zone-redundant plans want one.
        renders: site_config.health_check_path / siteConfig.healthCheckPath

      - id: http2_enabled
        ask: Should HTTP/2 be enabled?
        type: bool
        plain:
          en: "HTTP/2 is {value}."
          de: "HTTP/2 ist {value}."
        plain_values:
          true: { en: "on", de: "eingeschaltet" }
          false: { en: "off", de: "ausgeschaltet" }
        default: true
        why: >
          Free multiplexing for the browser clients, and every current client speaks
          it. The module default is `false`, which is why it is written. Off only for
          a backend behind a proxy that mishandles it.
        renders: site_config.http2_enabled / siteConfig.http20Enabled

  # -------------------------------------------------------------------- slots
  - id: slots
    title: Deployment slots
    questions:
      - id: deployment_slots
        ask: Should the app have deployment slots - a second running copy to deploy into and swap with?
        type: list
        plain:
          en: "Deployment slots beside the app: {value}."
          de: "Deployment-Slots neben der App: {value}."
        default: []
        why: >
          Taken from the request ("mit einem Slot als Testing", "a staging slot"), never
          proposed: a slot is a second live copy of the app on the **same plan**, with its own
          host name, into which a release is deployed, warmed up and swapped with production
          without a cold start. Each entry is a short lowercase name (`staging`, `test`). A slot
          is not a stage: it shares the plan's cores, the network, the identity and every
          backend the app calls, so a slot named as the test stage tests against production
          data with production rights - Phase 4 says so in one line, and a separate test stage
          is the answer where that is not acceptable. Slots need Premium v3 (Basic has none;
          twenty per plan), and every decision of the site is written on each slot again: the
          Terraform module gives a slot its own defaults rather than the site's (public access,
          TLS 1.3, FTPS, no identity), and neither module carries the site's diagnostic
          setting over.
        renders: >
          deployment_slots = { <name> = { ... } } (AVM Terraform) / slots: [ { name, ... } ]
          (AVM Bicep), each slot carrying the site's networking, identity, security, runtime and
          observability decisions

      - id: slot_access
        ask: Who should reach the deployment slots - the same way as the app, only from the system's private network, or only from certain addresses?
        type: enum
        resolved_by: interview
        topic: network
        plain:
          en: "The deployment slots are {value}."
          de: "Die Deployment-Slots sind {value}."
        plain_values:
          same_as_app: { en: "reachable the same way as the app, each under its own address", de: "genauso erreichbar wie die App, jeder unter einer eigenen Adresse" }
          private: { en: "reachable only from the system's private network", de: "nur aus dem privaten Netz des Systems erreichbar" }
          known_addresses: { en: "reachable only from certain address ranges, such as your team's", de: "nur aus bestimmten Adressbereichen erreichbar, etwa denen eures Teams" }
        values: [same_as_app, private, known_addresses]
        default: same_as_app
        depends_on: { question: deployment_slots, not_equals: [] }
        why: >
          Asked, because the slot runs code nobody has accepted yet, and who may open it is the
          customer's call rather than the app's posture copied. `same_as_app` gives each slot
          what the app has: behind the deployment's entry (public_audience `waf`) a route and
          host name of its own on the same entry, reaching the slot over its own private
          endpoint; with the app's allowlist the same list. `private` leaves only the private
          endpoint - in a network with no connection to the company network nobody reaches it,
          which is the same contradiction as a private system with users and asked the same way.
          `known_addresses` opens the slot's own address to an allowlist and nothing else, the
          ranges an `open:` entry. Under `network_exposure: private` there is no public way to
          offer, and `private` is forced.
        forced_when: >
          network_exposure `private` (deployment) forces `private`, recorded as forced with
          `deployment.network_exposure` as forced_by, and the question is not asked
        renders: >
          same_as_app: the slot's private endpoint (subresource `sites-<slot>`) and an origin
          group and route of the slot on the entry's endpoint, or the app's ip_restrictions on
          the slot; private: the private endpoint only, public access disabled; known_addresses:
          public access enabled with slot_ip_restrictions, default action Deny

      - id: slot_ip_restrictions
        ask: Which public IP ranges may reach the deployment slots?
        type: list
        plain:
          en: "Public addresses allowed to reach the slots: {value}."
          de: "Öffentliche Adressen, die die Slots erreichen dürfen: {value}."
        required: true
        depends_on: { question: slot_access, equals: known_addresses }
        per_environment: true
        why: >
          The allowlist of `known_addresses`, with a default action of Deny on the slot and its
          SCM site. Only the customer knows the ranges, so an unanswered list is an `open:`
          entry owned by the workload owner, never `0.0.0.0/0`.
        renders: >
          deployment_slots.<name>.site_config.ip_restriction and scm_use_main_ip_restriction /
          slots[].siteConfig.ipSecurityRestrictions and scmIpSecurityRestrictionsUseMain

      - id: auto_swap
        ask: Should a deployment into the slot swap into production automatically?
        type: bool
        plain:
          en: "A release in the slot {value}."
          de: "Ein Release im Slot {value}."
        plain_values:
          true: { en: "swaps into production on its own once it has started", de: "tauscht nach dem Start von selbst in die Produktion" }
          false: { en: "stays in the slot until someone swaps it", de: "bleibt im Slot, bis jemand tauscht" }
        default: false
        depends_on: { question: deployment_slots, not_equals: [] }
        why: >
          Off, because a slot that swaps by itself is a deployment straight to production with
          a warm-up in front: nothing is looked at before the users get it, which is the reason
          a slot exists. The swap is the release's deliberate step - an approval in the
          pipeline, or `az webapp deployment slot swap` by hand. On only for a slot that exists
          purely for zero-downtime warm-up, and never on a slot used for testing.
        renders: >
          deployment_slots.<name>.site_config.auto_swap_slot_name / slots[].siteConfig.autoSwapSlotName
          set to `production` only when true; omitted otherwise

      - id: sticky_settings
        ask: Which app settings stay with the slot when it is swapped?
        type: list
        plain:
          en: "Settings that stay with their slot on a swap: {value}."
          de: "Einstellungen, die beim Tausch bei ihrem Slot bleiben: {value}."
        default: []
        depends_on: { question: deployment_slots, not_equals: [] }
        why: >
          By name only - the settings themselves are deployment configuration this set does
          not render. A swap moves every app setting with the code, except the ones named here:
          a stage marker, a feature flag that must stay off in the slot, a connection to a test
          backend. An empty list means production's settings travel back into the slot on every
          swap, which is correct when slot and production are meant to be identical.
        renders: >
          sticky_settings = { app_setting_names = [...] } / configs: [ { name: 'slotConfigNames',
          properties: { appSettingNames: [...] } } ]

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask: Which Log Analytics workspace should receive diagnostics?
        type: ref
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        ref: log_analytics_workspace
        from_deployment: diagnostics_destination
        per_environment: true
        why: >
          Inherited: one deployment, one destination, or correlating an incident across
          its resources means querying two workspaces. An app with no diagnostic
          setting writes its logs to a file on the instance, which is gone when the
          instance is replaced.
        renders: diagnostic_settings / diagnosticSettings (site and plan)

      - id: diagnostic_categories
        ask: Which log categories should be collected?
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          AppServiceHTTPLogs: { en: "every web request", de: "jede Web-Anfrage" }
          AppServiceConsoleLogs: { en: "what the app writes to its console", de: "was die App auf ihre Konsole schreibt" }
          AppServiceAppLogs: { en: "the app's own log messages", de: "die eigenen Log-Meldungen der App" }
          AppServiceAuditLogs: { en: "who signed in to deploy or manage the app", de: "wer sich zum Ausrollen oder Verwalten angemeldet hat" }
          AppServiceIPSecAuditLogs: { en: "changes to the access restrictions", de: "Änderungen an den Zugriffsbeschränkungen" }
          AppServicePlatformLogs: { en: "the platform's own messages about the app", de: "die eigenen Meldungen der Plattform zur App" }
        values: [AppServiceHTTPLogs, AppServiceConsoleLogs, AppServiceAppLogs, AppServiceAuditLogs, AppServiceIPSecAuditLogs, AppServicePlatformLogs]
        default: [AppServiceHTTPLogs, AppServiceAppLogs, AppServiceAuditLogs, AppServiceIPSecAuditLogs, AppServicePlatformLogs]
        why: >
          Departs from "audit categories only" on purpose: for a web app the audit logs
          say who deployed, but the HTTP and app logs are the only way to see what
          the app did, and an app without them is a black box exactly when it fails.
          Console logs are left out because they mostly duplicate the app logs and are
          the bulk of the ingestion bill; add them when the app writes to stdout and not
          through a logger. HTTP logs are the volume line on a busy site, so in
          production they are a choice to confirm, not a thing to forget. The category
          names are the platform's and are checked against the resource's supported
          categories before a render, not remembered.
        renders: diagnostic_settings.<key>.logs[].category / diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask: Should all metrics be collected?
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: "collected", de: "erfasst" }
          false: { en: "not collected", de: "nicht erfasst" }
        default: true
        why: >
          Metric ingestion is cheap and the baseline for any capacity question - CPU and
          memory of the plan are what decides whether the plan size above was right.
          Applies to the plan and the site, which each have their own metrics.
        renders: metrics[].category = "AllMetrics" / metricCategories[].category

      - id: application_insights
        ask: Which Application Insights component should receive the app's telemetry?
        type: ref
        plain:
          en: "Its application telemetry goes to {value} (empty: none)."
          de: "Seine Anwendungstelemetrie geht an {value} (leer: keine)."
        ref: application_insights
        default: ""
        per_environment: true
        forced_when: >
          `application_monitoring: enabled` sets it to the deployment's application-insights
          component, recorded as forced with `application_monitoring` as forced_by
        why: >
          The diagnostic setting above carries what the platform sees of the app; requests,
          exceptions and slow dependencies from inside the app go to Application Insights, and
          the app finds its component through the `APPLICATIONINSIGHTS_CONNECTION_STRING`
          setting. The connection string, not the instrumentation key, which is being retired.
          Every slot gets the same setting: a slot inherits nothing from the site. Empty only
          under `application_monitoring: disabled`.
        renders: >
          application_insights_connection_string (and on every slot) /
          the APPLICATIONINSIGHTS_CONNECTION_STRING setting in configs appsettings
