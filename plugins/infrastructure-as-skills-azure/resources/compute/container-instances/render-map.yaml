# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
schema_version: 1
resource: Microsoft.ContainerInstance/containerGroups

modules:
  terraform: [Azure/avm-res-containerinstance-containergroup/azurerm]
  bicep: [avm/res/container-instance/container-group]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the group
  placement.location:
    terraform_avm: { attribute: location, passthrough: true }
    terraform: { attribute: location, passthrough: true }
    bicep_avm: { attribute: location, passthrough: true }
    bicep: { attribute: location, passthrough: true }
  placement.resource_group_name:
    terraform_avm:
      attribute: resource_group_name
      note: azurerm-based module (a name, not an id); requires azurerm ~> 4.0, a root on 5.x cannot call it
    terraform: { attribute: resource_group_name }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }

  # ---------------------------------------------------------- container group
  container_group.container_image:
    terraform_avm:
      attribute: containers.main.image
      passthrough: true
      note: ports and volumes = {} are required members of the container beside it
    terraform: { attribute: container.image, passthrough: true }
    bicep_avm: { attribute: 'containers[].properties.image', passthrough: true }
    bicep: { attribute: 'properties.containers[].properties.image', passthrough: true }
  container_group.cpu:
    terraform_avm: { attribute: containers.main.cpu, passthrough: true, note: a number }
    terraform: { attribute: container.cpu, passthrough: true }
    bicep_avm: { attribute: 'containers[].properties.resources.requests.cpu', passthrough: true, note: an integer }
    bicep: { attribute: 'properties.containers[].properties.resources.requests.cpu', passthrough: true }
  container_group.memory_in_gb:
    terraform_avm: { attribute: containers.main.memory, passthrough: true, note: a number in GB }
    terraform: { attribute: container.memory, passthrough: true }
    bicep_avm:
      attribute: 'containers[].properties.resources.requests.memoryInGB'
      format: '{value}'
      note: a string, not a number
    bicep: { attribute: 'properties.containers[].properties.resources.requests.memoryInGB', passthrough: true }
  container_group.restart_policy:
    terraform_avm: { attribute: restart_policy, passthrough: true, note: a required input }
    terraform: { attribute: restart_policy, passthrough: true }
    bicep_avm: { attribute: restartPolicy, passthrough: true, note: module default Always - always written }
    bicep: { attribute: properties.restartPolicy, passthrough: true }
  container_group.availability_zone:
    terraform_avm:
      attribute: zones
      values: { none: { expr: '[]' }, '1': { expr: '["1"]' }, '2': { expr: '["2"]' }, '3': { expr: '["3"]' } }
      note: a list of strings
    terraform:
      attribute: zones
      values: { none: { expr: '[]' }, '1': { expr: '["1"]' }, '2': { expr: '["2"]' }, '3': { expr: '["3"]' } }
    bicep_avm:
      attribute: availabilityZone
      values: { none: { expr: '-1' }, '1': { expr: '1' }, '2': { expr: '2' }, '3': { expr: '3' } }
      note: a required parameter; -1 is none
    bicep:
      attribute: zones
      values: { none: null, '1': { expr: "[ '1' ]" }, '2': { expr: "[ '2' ]" }, '3': { expr: "[ '3' ]" } }
      note: none leaves zones unset

  # --------------------------------------------------------------- networking
  networking.ip_address_type:
    terraform_avm:
      attribute: subnet_ids
      values: { private: { expr: '[{networking.subnet_id}]' }, public: { expr: '[]' } }
      note: no type input - the module derives Private from a non-empty list, Public otherwise
    terraform:
      attribute: ip_address_type
      values: { private: Private, public: Public }
    bicep_avm:
      attribute: ipAddress.type
      values: { private: Private, public: Public }
      note: unset, the module sends Public whenever ipAddress is given - always written; public omits subnets
    bicep:
      attribute: properties.ipAddress.type
      values: { private: Private, public: Public }
  networking.subnet_id:
    terraform_avm: { attribute: subnet_ids, format: { expr: '[{value}]' }, note: a list of one id }
    terraform: { attribute: subnet_ids, format: { expr: '[{value}]' }, note: a list of one id; set at creation }
    bicep_avm: { attribute: 'subnets[].subnetResourceId' }
    bicep: { gap: properties.subnetIds is a list of objects; the reference names no member for the id }
  networking.exposed_ports:
    terraform_avm:
      attribute: 'exposed_ports = [{ port, protocol }], containers.main.ports'
      note: both lists must agree
    terraform:
      attribute: 'exposed_port { port, protocol }, container.ports { port, protocol }'
      note: both must agree
    bicep_avm:
      attribute: 'ipAddress.ports[] = { port, protocol }, containers[].properties.ports'
      note: both lists must agree
    bicep: { attribute: 'properties.ipAddress.ports, properties.containers[].properties.ports' }

  # ----------------------------------------------------------------- identity
  identity.managed_identity:
    terraform_avm:
      attribute: managed_identities
      values:
        system_assigned: { expr: '{ system_assigned = true }' }
        user_assigned: { expr: '{ system_assigned = false, user_assigned_resource_ids = {identity.user_assigned_identity_ids} }' }
        none: { expr: '{}' }
      note: only a user-assigned identity can sign in to the registry
    terraform:
      attribute: identity.type
      values: { system_assigned: SystemAssigned, user_assigned: UserAssigned, none: null }
      note: none renders no identity block
    bicep_avm:
      gap: >-
        managedIdentities: { userAssignedResourceIds: {identity.user_assigned_identity_ids} } for user_assigned;
        system_assigned and none are not spelled in the reference
    bicep:
      attribute: identity.type
      values: { system_assigned: SystemAssigned, user_assigned: UserAssigned, none: None }
  identity.user_assigned_identity_ids:
    terraform_avm: { attribute: managed_identities.user_assigned_resource_ids }
    terraform: { attribute: identity.identity_ids }
    bicep_avm: { attribute: managedIdentities.userAssignedResourceIds }
    bicep: { gap: identity.userAssignedIdentities is an object keyed by id; the reference shows no shape }
  identity.registry_login_server:
    terraform_avm:
      attribute: 'image_registry_credential.<k>.server'
      passthrough: true
      note: with user_assigned_identity_id beside it, never username / password; empty renders no credential
    terraform:
      attribute: image_registry_credential.server
      passthrough: true
      note: with user_assigned_identity_id; empty renders no block
    bicep_avm:
      attribute: 'imageRegistryCredentials[].server'
      passthrough: true
      note: with identity, the identity's resource id - never username / password; empty omits the parameter
    bicep: { attribute: 'properties.imageRegistryCredentials[].server', passthrough: true, note: with identity; empty renders no credential }
  identity.role_assignments:
    terraform_avm: { attribute: 'role_assignments.<key> = { role_definition_id_or_name, principal_id }' }
    terraform: { attribute: azurerm_role_assignment, note: scope = the group's id }
    bicep_avm:
      gap: no parameter; a Microsoft.Authorization/roleAssignments resource beside the module, scoped to the group, by role definition id
    bicep: { attribute: Microsoft.Authorization/roleAssignments, note: scope = the group }

  # ----------------------------------------------------------------- security
  security.key_management:
    terraform_avm:
      attribute: key_vault_key_id
      values: { platform_managed: null, customer_managed: { expr: '{security.cmk_key_vault_key_id}' } }
      also:
        customer_managed: key_vault_user_assigned_identity_id = <user_assigned_identity_id>
      note: both omitted for platform_managed; the identity is the group's
    terraform:
      attribute: key_vault_key_id
      values: { platform_managed: null, customer_managed: { expr: '{security.cmk_key_vault_key_id}' } }
      also:
        customer_managed: key_vault_user_assigned_identity_id = <user_assigned_identity_id>
      note: both omitted for platform_managed
    bicep_avm:
      attribute: customerManagedKey
      values:
        platform_managed: null
        customer_managed: { expr: '{ keyVaultResourceId: <keyVaultResourceId>, keyName: <keyName>, userAssignedIdentityResourceId: <userAssignedIdentityResourceId> }' }
    bicep:
      attribute: properties.encryptionProperties
      values:
        platform_managed: null
        customer_managed: { expr: '{ vaultBaseUrl: <vaultBaseUrl>, keyName: <keyName>, keyVersion: <keyVersion>, identity: <identity> }' }
  security.cmk_key_vault_key_id:
    terraform_avm:
      attribute: key_vault_key_id
      note: the versioned key id; ACI does not follow a rotation
    terraform: { attribute: key_vault_key_id }
    bicep_avm:
      attribute: customerManagedKey.keyVaultResourceId, customerManagedKey.keyName
      note: the key id split into the vault's id and the key's name; the module resolves the current version at deployment
    bicep: { attribute: 'properties.encryptionProperties.vaultBaseUrl, keyName, keyVersion' }

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm:
      attribute: diagnostics_log_analytics.workspace_id
      note: the workspace's customer id (GUID), not its resource id; workspace_key beside it is sensitive and in state
    terraform:
      attribute: diagnostics.log_analytics.workspace_id
      note: the workspace's customer id (GUID), not its resource id; workspace_key beside it is sensitive and in state; no diagnostic setting carries container logs
    bicep_avm:
      attribute: logAnalytics.workspaceResourceId
      note: the module reads the shared key itself
    bicep: { attribute: properties.diagnostics.logAnalytics.workspaceId, note: "the workspace's customer id (GUID) as on the Terraform side, not its resource id; with workspaceKey" }
  observability.log_type:
    terraform_avm: { gap: not carried by the module; left to the provider and named in the handover }
    terraform: { attribute: diagnostics.log_analytics.log_type, passthrough: true }
    bicep_avm: { attribute: logAnalytics.logType, passthrough: true }
    bicep: { attribute: properties.diagnostics.logAnalytics.logType, passthrough: true }
