schema_version: 1

resource: Microsoft.EventGrid/namespaces
title: Azure Event Grid namespace

naming:
  terraform: "Azure::Microsoft.EventGrid/namespaces"
  bicep: "Microsoft.EventGrid/namespaces"
  # Bicep assembles the name from vars - this is the prefix it renders. The name is regional, 3-50 characters.
  abbreviation: "evgns"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform (`privatelink.eventgrid.azure.net`)."
  - "Does not create the Log Analytics workspace it routes diagnostics to, nor the storage account that receives undeliverable events, nor the custom topic MQTT messages are routed to."
  - "Does not create custom topics, system topics or domains - those are separate resource types with sets of their own. A namespace is for pull delivery and the MQTT broker."
  - "Does not grant the publishers, the MQTT clients' operators and the delivery targets their roles - that is wiring between resources, owned by a pattern. It records the namespace's own role assignments in `role_assignments`."
  - "Does not render access keys. Namespace topics carry keys the service creates by itself and the type has no switch to turn them off; none is read or written here, and a publisher that cannot use Entra ID is a named departure and an `open:` entry."
  - "Does not encrypt with a customer-managed key: the type exposes no key property. `key_management: customer_managed` is recorded as not applicable on this resource."
  - "The MQTT content - topic spaces, clients, client groups, permission bindings, CA certificates - is recorded as lists of names and rendered from the module README. Per-client certificate thumbprints and attributes change at the pace of the device fleet and belong to its registry, not here."
  - "The resource lock follows `deployment.resource_lock`, which lists messaging namespaces; it is not asked again here."

groups:

  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name and the strictness of several defaults below. Nothing
          sensible can be guessed.
        renders: >
          naming parameter `environment`, and the tag of that name where the repository uses
          one

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          Part of the rendered name and not inferable. A namespace is regional and so are the
          events it holds; a topic it routes MQTT messages to must be in the same region.
        renders: location

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        ref: resource_group
        required: true
        from_context: true
        per_environment: true
        why: >
          The namespace is placed into an existing group. Creating one here would make this
          set own a lifecycle wider than the resource it describes.
        renders: parent_id (AVM Terraform, the group's id) / implicit in Bicep scope

  - id: namespace
    title: The namespace
    questions:
      - id: capacity
        ask: How many throughput units does the namespace reserve?
        type: int
        plain:
          en: "The namespace reserves {value} throughput unit(s)."
          de: "Der Namensraum reserviert {value} Durchsatzeinheit(en)."
        default: 1
        confirm_in: [production]
        non_production_default: 1
        why: >
          The namespace has one tier (Standard) and is sized in throughput units: one unit is
          1 MB/s in and 2 MB/s out, billed around the clock, 1 to 20 per namespace. There is
          no automatic growth - a namespace that runs out of units throttles publishers until
          someone raises the number, which can be done later without a new namespace. One is
          enough to start; more follow from a measured load. The Terraform module writes
          `sku` and `capacity`; **the Bicep module has no input for either** and deploys the
          platform's one unit, so a larger namespace in Bicep is an authored render.
        renders: >
          capacity (Terraform, with sku = "Standard") / not carried by the Bicep module -
          sku.capacity authored

      - id: minimum_tls_version
        ask: Which TLS version is the lowest a publisher may use?
        type: enum
        plain:
          en: "Publishers must use at least TLS {value}."
          de: "Absender müssen mindestens TLS {value} verwenden."
        values: ["1.0", "1.1", "1.2"]
        default: "1.2"
        why: >
          1.2 is the guardrails' floor and the only value the namespace accepts today: the
          type lists the older versions and refuses them. Neither module carries the input;
          the decision stays in the spec and is written through the escape hatch or an
          authored render, so a later module release that exposes it does not move it.
        renders: >
          properties.minimumTlsVersionAllowed - not carried by either module; `_target_overrides`
          or authored

      - id: local_auth
        ask: Should access keys and shared access signatures work?
        type: enum
        plain:
          en: "Access keys are {value}."
          de: "Zugriffsschlüssel sind {value}."
        plain_values:
          disabled: { en: switched off, de: abgeschaltet }
          allowed_where_unavoidable: { en: allowed on this namespace, de: auf diesem Namensraum erlaubt }
        values: [disabled, allowed_where_unavoidable]
        from_deployment: local_auth
        forced_when: >
          The type has no switch: every namespace topic carries two keys the service creates
          and rotates on request, and nothing in the API turns them off. `disabled` is
          therefore recorded as `forced` to `allowed_where_unavoidable` with the resource
          type as forced_by, and what the posture still buys is kept: no key is read, output
          or placed in a setting, publishers and receivers hold `EventGrid Data Sender` and
          `EventGrid Data Receiver`, and the right to list keys stays with the deploying
          principal.
        why: >
          Inherited: `local_auth: disabled` means every publish and every receive is signed
          in with Entra ID and attributable. On this type it is a convention the render
          keeps rather than a property it sets, which is why it is recorded as forced and
          not as done.
        renders: >
          no attribute - no `listKeys` output, no key in any setting; data-plane access
          through `role_assignments` only

      - id: zone_redundant
        ask: Should the namespace survive the loss of one datacenter of its region?
        type: bool
        plain:
          en: "The namespace {value} the loss of a datacenter."
          de: "Der Namensraum {value} den Ausfall eines Rechenzentrums."
        plain_values:
          true: { en: survives, de: übersteht }
          false: { en: does not survive, de: übersteht nicht }
        derived_from:
          question: outage_impact
          map: { tolerable: false, disruptive: true, critical: true }
        why: >
          Derived from how bad an outage is. Zone redundancy spreads the namespace over the
          region's zones at no extra charge and is **fixed at creation**; the platform picks
          `true` by itself in a region with zones when nothing is written. The Bicep module
          writes it (`isZoneRedundant`); **the Terraform module has no input**, so a
          Terraform render takes the platform's regional default and a `false` in a zonal
          region is an authored render or an accepted `forced` value - there is no cost
          reason to want it.
        renders: >
          isZoneRedundant (Bicep) / not carried by the Terraform module - the platform's
          regional default, authored to depart

      - id: managed_identity
        ask: Which managed identity should the namespace carry?
        type: enum
        plain:
          en: "The namespace has {value}."
          de: "Der Namensraum hat {value}."
        plain_values:
          none: { en: no identity of its own, de: keine eigene Identität }
          system_assigned: { en: its own identity, de: eine eigene Identität }
          user_assigned: { en: a separately managed identity, de: eine separat verwaltete Identität }
        values: [none, system_assigned, user_assigned]
        default: system_assigned
        forced_when: >
          `mqtt_routing: event_grid_topic` and any push subscription force at least
          `system_assigned`, recorded as forced with that question as forced_by: routing and
          push delivery to a target that requires Entra ID carry the namespace's identity.
        why: >
          The identity delivers push subscriptions to a queue, an event hub or a webhook
          with Entra ID, writes undeliverable events to storage without a key and routes
          MQTT messages to a custom topic. A namespace that only serves pull delivery needs
          none, but the identity is free and granting it later re-creates every subscription
          that names it, so it is on by default. Targets are granted the identity's role in
          the pattern, not here. `user_assigned` is for an identity that must hold its roles
          before the namespace exists.
        renders: managed_identities / managedIdentities

      - id: user_assigned_identity_ids
        ask: Which user-assigned identity?
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        ref: user_assigned_identity
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          The identity that holds the data-plane role on each delivery target, on the
          dead-letter container and on the routing topic. It is created before the
          namespace, by the identity set.
        renders: >
          managed_identities.user_assigned_resource_ids /
          managedIdentities.userAssignedResourceIds

  - id: topics
    title: Namespace topics and pull delivery
    questions:
      - id: namespace_topics
        ask: Which topics should the namespace hold?
        type: list
        plain:
          en: "Topics: {value} (empty: none)."
          de: "Themen: {value} (leer: keine)."
        default: []
        why: >
          A namespace topic is where applications publish CloudEvents and from where
          subscribers pull them - the namespace's reason to exist unless it is an MQTT
          broker only. The names are the workload's own and part of its contract with the
          publishers, so they are asked, not invented. Namespace topics accept the
          CloudEvents 1.0 schema only; there is no schema decision here.
        renders: namespace_topics / topics[]

      - id: event_retention_days
        ask: How long does a topic keep an event that nobody has pulled yet?
        type: int
        resolved_by: interview
        plain:
          en: "An event waits for its receivers for up to {value} days."
          de: "Ein Ereignis wartet bis zu {value} Tage auf seine Empfänger."
        default: 7
        why: >
          The window in which a pull subscriber can be down and still catch up. 7 days is
          the maximum and the floor for anything where a weekend outage of the receiver
          must not lose events; 1 is right for a signal that is worthless after a day. The
          same value is written as the subscriptions' time-to-live, because a subscription
          cannot keep an event longer than its topic.
        renders: >
          namespace_topics.<k>.event_retention_days and topic_event_subscriptions.<k>.event_time_to_live
          (ISO 8601 `P7D`) / topics[].eventRetentionInDays and
          eventSubscriptions[].deliveryConfiguration.queue.eventTimeToLive

      - id: topic_subscriptions
        ask: Who receives the events of each topic, and how?
        type: list
        plain:
          en: "Subscribers: {value} (empty: none yet)."
          de: "Abonnenten: {value} (leer: noch keine)."
        default: []
        why: >
          Each entry is a subscription on one topic: its name, the topic, whether the
          receiver pulls or the namespace pushes, the push target where there is one, and
          the filter that decides which events it receives. A topic with no subscription
          drops every event silently, which is the usual first fault. Push targets are other
          resources of the deployment, named here and wired by the pattern; a webhook target
          is an `open:` entry owned by its operator because it must answer the validation
          handshake.
        renders: topic_event_subscriptions / topics[].eventSubscriptions[]

      - id: delivery_mode
        ask: Do receivers fetch events themselves, or does the namespace deliver them?
        type: enum
        plain:
          en: "Receivers {value}."
          de: "Empfänger {value}."
        plain_values:
          queue: { en: "fetch events themselves, at their own pace, and confirm each one", de: "holen Ereignisse selbst in ihrem Tempo ab und bestätigen jedes einzeln" }
          push: { en: "have events delivered to them by the namespace", de: "bekommen Ereignisse vom Namensraum zugestellt" }
        values: [queue, push]
        default: queue
        why: >
          The default for every subscription; a single one departs in its entry. Pull
          delivery (`queue`) is what a namespace adds over a custom topic: the receiver
          takes a batch, acknowledges, releases or rejects each event, and a receiver behind
          a firewall needs no inbound path. Push is the custom-topic model, kept for a
          target that cannot pull (a function, an event hub, a webhook) and needs the
          namespace's identity.
        renders: >
          topic_event_subscriptions.<k>.delivery_mode (`Queue` / `Push`) /
          eventSubscriptions[].deliveryConfiguration.deliveryMode

      - id: max_delivery_count
        ask: After how many failed deliveries is an event set aside?
        type: int
        plain:
          en: "An event is set aside after {value} failed deliveries."
          de: "Ein Ereignis wird nach {value} fehlgeschlagenen Zustellungen beiseitegelegt."
        default: 10
        why: >
          An event a receiver keeps rejecting or whose lock keeps expiring would otherwise
          circle until its time-to-live ends. After this many deliveries it is dead-lettered
          or dropped. 10 is the service's own default; the Terraform module's is 30, so the
          value is written. Lower for a receiver that retries by itself, higher for a flaky
          downstream.
        renders: >
          topic_event_subscriptions.<k>.max_delivery_count /
          eventSubscriptions[].deliveryConfiguration.queue.maxDeliveryCount

      - id: receive_lock_duration_seconds
        ask: How long may a receiver work on a pulled event before it is offered again?
        type: int
        plain:
          en: "A receiver has {value} seconds per event."
          de: "Ein Empfänger hat {value} Sekunden pro Ereignis."
        default: 60
        why: >
          A pulled event is hidden for this long; the receiver acknowledges it or it becomes
          visible again and counts as one failed delivery. Too short and a slow handler sees
          the same event twice; too long and a crashed receiver blocks it. 60 seconds is the
          service default; 300 is the ceiling, and longer work renews the lock.
        renders: >
          topic_event_subscriptions.<k>.receive_lock_duration_in_seconds /
          eventSubscriptions[].deliveryConfiguration.queue.receiveLockDurationInSeconds

      - id: keep_undeliverable_events
        ask: Should an event that could not be delivered be kept for inspection?
        type: bool
        resolved_by: interview
        plain:
          en: "An event that cannot be delivered is {value}."
          de: "Ein Ereignis, das nicht zugestellt werden kann, wird {value}."
        plain_values:
          true: { en: kept in storage for inspection, de: zur Prüfung im Speicher aufbewahrt }
          false: { en: discarded, de: verworfen }
        default: true
        why: >
          Without a dead-letter destination an event whose deliveries ran out or whose
          retention ended is gone and nobody learns that a receiver was down. With one it
          is written as a file to a storage container where it can be read, repaired and
          resent. The price is the storage and someone reading it; the reason to alert on
          the dead-lettered count.
        renders: >
          topic_event_subscriptions.<k>.dead_letter_destination /
          eventSubscriptions[].deliveryConfiguration.<mode>.deadLetterDestinationWithResourceIdentity

      - id: dead_letter_storage_account
        ask: Which storage account receives the undeliverable events?
        type: ref
        plain:
          en: "Undeliverable events go to the storage account {value}."
          de: "Nicht zustellbare Ereignisse gehen in das Speicherkonto {value}."
        ref: storage_account
        required: true
        depends_on: { question: keep_undeliverable_events, equals: true }
        per_environment: true
        why: >
          A storage account of the deployment, written by the namespace's identity with
          `Storage Blob Data Contributor` on the container (no key). A firewalled account
          must let Event Grid in through the trusted-service path or a private endpoint.
        renders: >
          dead_letter_destination.storage_account_id /
          deadLetterDestinationWithResourceIdentity.deadLetterDestination.properties.resourceId

      - id: dead_letter_container
        ask: In which container are they written?
        type: string
        plain:
          en: "The files go to the container {value}."
          de: "Die Dateien gehen in den Container {value}."
        default: eventgrid-deadletter
        depends_on: { question: keep_undeliverable_events, equals: true }
        why: >
          The container is created by the storage set (blob container); this names it.
        renders: >
          dead_letter_destination.blob_container_name /
          deadLetterDestinationWithResourceIdentity.deadLetterDestination.properties.blobContainerName

  - id: mqtt
    title: MQTT broker
    questions:
      - id: mqtt_broker
        ask: Do devices or machines connect to it directly as MQTT clients?
        type: bool
        resolved_by: interview
        plain:
          en: "Devices {value} directly over MQTT."
          de: "Geräte {value} direkt über MQTT."
        plain_values:
          true: { en: connect, de: verbinden sich }
          false: { en: do not connect, de: verbinden sich nicht }
        default: false
        why: >
          The MQTT broker is the namespace's second face: devices authenticate with
          certificates, publish and subscribe on topic spaces, and the namespace can route
          their messages on to a custom topic. It is a separate decision because it brings
          a client registry, certificate authorities and a permission model, and because
          **once enabled it cannot be switched off** again on that namespace. Off unless the
          system has MQTT clients; applications that publish HTTP CloudEvents do not need it.
        renders: >
          topicSpacesConfiguration.state = Enabled - topicSpacesState (Bicep) / not carried by
          the Terraform module (its configuration object has no state); `_target_overrides` or
          authored

      - id: topic_spaces
        ask: Which groups of MQTT topics should exist?
        type: list
        plain:
          en: "MQTT topic spaces: {value}."
          de: "MQTT-Themenbereiche: {value}."
        default: []
        depends_on: { question: mqtt_broker, equals: true }
        why: >
          A topic space is a named set of topic templates (`devices/+/telemetry`) that
          permissions are granted on. Clients cannot publish or subscribe anywhere a topic
          space does not cover, so a broker with none is silent. Each entry is a name and
          its templates; templates may carry client attribute variables.
        renders: topic_spaces / topicSpaces[]

      - id: clients
        ask: Which MQTT clients are registered up front?
        type: list
        plain:
          en: "Registered MQTT clients: {value}."
          de: "Registrierte MQTT-Clients: {value}."
        default: []
        depends_on: { question: mqtt_broker, equals: true }
        why: >
          Every MQTT client is a registered identity with an authentication name, a
          certificate validation scheme and attributes the client groups select on. The few
          clients that exist at deployment time - a simulator, a gateway - are listed here;
          a device fleet is registered by its own process against the namespace, not by the
          template, because it changes at a pace no deployment should.
        renders: clients / clients[]

      - id: client_groups
        ask: How are clients grouped for permissions?
        type: list
        plain:
          en: "Client groups: {value}."
          de: "Client-Gruppen: {value}."
        default: []
        depends_on: { question: mqtt_broker, equals: true }
        why: >
          A client group is a query over client attributes (`attributes.type = 'sensor'`),
          and permissions are granted to groups, never to single clients. The built-in
          group `$all` matches every client; a group per role (sensors publish, dashboards
          subscribe) is the usual shape. Each entry is a name and its query.
        renders: client_groups / clientGroups[]

      - id: permission_bindings
        ask: Which group may publish or subscribe on which topic space?
        type: list
        plain:
          en: "MQTT permissions: {value}."
          de: "MQTT-Berechtigungen: {value}."
        default: []
        depends_on: { question: mqtt_broker, equals: true }
        why: >
          A binding grants one client group `Publisher` or `Subscriber` on one topic space.
          Without a binding a connected client is refused on every topic; without a
          `Subscriber` binding nobody hears the publishers. Each entry names the group, the
          topic space and the permission. The Terraform module takes the map keys of the
          group and the space, the Bicep module their names.
        renders: permission_bindings / permissionBindings[]

      - id: mqtt_routing
        ask: Should the MQTT messages also reach applications as events?
        type: enum
        resolved_by: interview
        plain:
          en: "MQTT messages are {value}."
          de: "MQTT-Nachrichten werden {value}."
        plain_values:
          none: { en: exchanged between the devices only, de: nur zwischen den Geräten ausgetauscht }
          event_grid_topic: { en: also handed to applications as events, de: zusätzlich als Ereignisse an Anwendungen weitergereicht }
        values: [none, event_grid_topic]
        default: none
        depends_on: { question: mqtt_broker, equals: true }
        why: >
          Routing copies every MQTT message into a custom Event Grid topic, from where the
          usual subscriptions (functions, queues, storage) pick it up. It is how telemetry
          leaves the broker; without it the broker is a device-to-device bus. The topic must
          exist first, in the same region, and the namespace's identity needs `EventGrid
          Data Sender` on it - a two-step deployment when the topic is created in the same
          run.
        renders: >
          topic_spaces_configuration.route_topic_resource_id / routeTopicResourceId and
          routingIdentityInfo

      - id: mqtt_routing_topic
        ask: Which custom topic receives the routed messages?
        type: ref
        plain:
          en: "Routed to the topic {value}."
          de: "Weitergeleitet an das Thema {value}."
        ref: event_grid_topic
        required: true
        depends_on: { question: mqtt_routing, equals: event_grid_topic }
        per_environment: true
        why: >
          A custom topic of the deployment (the `event-grid-topic` set), created before the
          namespace. It is where the subscriptions on the routed messages live.
        renders: >
          topic_spaces_configuration.route_topic_resource_id / routeTopicResourceId

  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask: Should this namespace depart from the deployment's exposure posture?
        type: enum
        plain:
          en: "The namespace is {value}."
          de: "Der Dienst (namespace) ist {value}."
        plain_values:
          disabled: { en: not reachable from the internet at all, de: aus dem Internet überhaupt nicht erreichbar }
          enabled_with_firewall: { en: reachable from the internet only from listed addresses, de: aus dem Internet nur von gelisteten Adressen erreichbar }
          enabled: { en: reachable from the internet, de: aus dem Internet erreichbar }
        values: [disabled, enabled_with_firewall, enabled]
        from_deployment: network_exposure
        confirm_in: [production]
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces
          `enabled`, recorded as forced with `network_ownership` as forced_by: the
          deployment's callers have no fixed outbound address, so a firewall with no rule
          locks them out. `mqtt_broker: true` with devices in the field is the usual reason
          for a departure to `enabled_with_firewall` or `enabled`: devices do not sit in
          the virtual network.
        why: >
          Asked only as a departure: exposure is a property of the system, the deployment
          set already answered it. `private` is `disabled`, `public` is
          `enabled_with_firewall`. The namespace supports a private endpoint for the HTTP
          and the MQTT path alike. **Both modules default to `Enabled`**, so the value is
          written on every call.
        renders: >
          public_network_access (`Enabled`/`Disabled`, a string) and inbound_ip_rules /
          publicNetworkAccess and inboundIpRules

      - id: private_endpoint_subnet
        ask: Which subnet should the namespace's private endpoint live in?
        type: ref
        resolved_by: platform
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        ref: subnet
        from_deployment: private_endpoint_subnet
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited. The
          sub-resource is `topic`, for the HTTP and the MQTT endpoint alike; there is no
          list to choose from.
        renders: >
          private_endpoints.<key>.subnet_resource_id / privateEndpoints[].subnetResourceId

      - id: ip_rules
        ask: Which public IP ranges may reach the namespace?
        type: list
        plain:
          en: "Public addresses allowed to reach the namespace: {value}."
          de: "Öffentliche Adressen, die den Dienst erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist. An empty list denies every public caller, which is valid
          and deliberate. `0.0.0.0/0` is not an allowlist and is rejected by the guardrails;
          a single address takes `/32`.
        renders: inbound_ip_rules = [{ ip_mask, action = "Allow" }] / inboundIpRules

  - id: identity
    title: Identity and access
    questions:
      - id: role_assignments
        ask: Who needs which role on this namespace?
        type: list
        plain:
          en: "Access rights on the namespace granted to: {value}."
          de: "Zugriffsrechte vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Data-plane access is granted by role, never by key. A publisher holds `EventGrid
          Data Sender`, a pull receiver `EventGrid Data Receiver`, both scoped to the topic
          they use, never the subscription; `EventGrid Data Contributor` and `EventGrid
          Contributor` are for the deploying principal. MQTT clients are not Entra
          principals: their access is `permission_bindings`. A pattern normally fills this
          from the consumers it knows about and grants a consumer's role in the pattern.
        renders: role_assignments / roleAssignments

  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask: Which Log Analytics workspace should receive diagnostics?
        type: ref
        resolved_by: platform
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        ref: log_analytics_workspace
        from_deployment: diagnostics_destination
        per_environment: true
        why: >
          Inherited: one deployment, one destination. Without a diagnostic setting the
          resource keeps no record anyone can query.
        renders: diagnostic_settings / diagnosticSettings

      - id: diagnostic_categories
        ask: Which log categories should be collected?
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          FailedHttpDataPlaneOperations: { en: publish and receive requests that failed, and why, de: fehlgeschlagene Sende- und Empfangsanfragen und der Grund }
          SuccessfulHttpDataPlaneOperations: { en: "every successful publish and receive, for audit", de: "jede erfolgreiche Sende- und Empfangsanfrage, für die Nachvollziehbarkeit" }
          FailedMqttConnections: { en: devices that could not connect, and why, de: Geräte, die sich nicht verbinden konnten, und der Grund }
          SuccessfulMqttConnections: { en: "every device connection, for audit", de: "jede Geräteverbindung, für die Nachvollziehbarkeit" }
          MqttDisconnections: { en: devices that dropped off, and why, de: Geräte, deren Verbindung abbrach, und der Grund }
          FailedMqttPublishedMessages: { en: device messages that were refused, de: abgewiesene Gerätenachrichten }
          FailedMqttSubscriptionOperations: { en: device subscriptions that were refused, de: abgewiesene Geräte-Abonnements }
          AutoscaleLogs: { en: the service's own scaling events, de: die Skalierungsereignisse des Dienstes }
        values: [FailedHttpDataPlaneOperations, SuccessfulHttpDataPlaneOperations, FailedMqttConnections, SuccessfulMqttConnections, MqttDisconnections, FailedMqttPublishedMessages, FailedMqttSubscriptionOperations, AutoscaleLogs]
        default: [FailedHttpDataPlaneOperations, FailedMqttConnections, FailedMqttPublishedMessages, MqttDisconnections]
        why: >
          The failures are what anyone debugging a namespace needs and are cheap - they log
          only what went wrong; the MQTT categories are empty while the broker is off and
          cost nothing. The `Successful*` categories record every request and connection,
          are as large as the traffic, and are raised for a mandate that asks for an audit
          trail. The names are the platform's and are checked against `az monitor
          diagnostic-settings categories list` for the resource before a render, not
          remembered.
        renders: >
          diagnostic_settings.<key>.log_categories /
          diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask: Should all metrics be collected?
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: collected, de: erfasst }
          false: { en: not collected, de: nicht erfasst }
        default: true
        why: >
          Published, delivered, acknowledged and dead-lettered event counts, throttled
          requests, connected MQTT clients - a throttled count is how a namespace short of
          throughput units shows up, and the one to alert on next to the dead-lettered count.
        renders: metrics[].category = "AllMetrics" / metricCategories[].category
