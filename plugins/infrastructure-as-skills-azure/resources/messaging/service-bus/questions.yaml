schema_version: 1

resource: Microsoft.ServiceBus/namespaces
title: Azure Service Bus namespace

naming:
  terraform: "Azure::Microsoft.ServiceBus/namespaces"
  bicep: "Microsoft.ServiceBus/namespaces"
  # Bicep assembles the name from vars - this is the prefix it renders. The name is global and limited to 50 characters.
  abbreviation: "sbns"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform (`privatelink.servicebus.windows.net`)."
  - "Does not create the Log Analytics workspace it routes diagnostics to."
  - "Does not grant the consumers their roles - that is wiring between resources, owned by a pattern. It records the namespace's own role assignments in `role_assignments`."
  - "Does not render SAS authorization rules or connection strings. With `local_auth: disabled` there are none; a consumer that cannot use Entra ID is a named departure and an `open:` entry, never a key in a template."
  - "Per-entity tuning beyond the namespace-wide defaults below (a single queue with its own lock duration, forwarding chains, SQL filters on subscriptions) is not a question set decision. It is recorded in `queues` / `topics` as free text and rendered from the module README."

groups:

  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name and the strictness of several defaults below. Nothing
          sensible can be guessed.
        renders: >
          naming parameter `environment`, and the tag of that name where the repository uses
          one

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          Part of the rendered name and not inferable. A namespace is regional, and so is
          the data it holds; a second region is a geo-recovery pairing (`geo_recovery`), not
          a property of this one.
        renders: location

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        ref: resource_group
        required: true
        from_context: true
        per_environment: true
        why: >
          The namespace is placed into an existing group. Creating one here would make this
          set own a lifecycle wider than the resource it describes.
        renders: resource_group_name (AVM Terraform) / implicit in Bicep scope

  - id: namespace
    title: The namespace
    questions:
      - id: sku
        ask: Which tier does the namespace need?
        type: enum
        plain:
          en: "The namespace is the {value} tier."
          de: "Der Namensraum ist die Stufe {value}."
        plain_values:
          Basic: { en: "basic, queues only", de: "Basic, nur Warteschlangen" }
          Standard: { en: "standard, queues and topics on shared capacity", de: "Standard, Warteschlangen und Themen auf geteilter Kapazität" }
          Premium: { en: "premium, dedicated capacity with private connections", de: "Premium, dedizierte Kapazität mit privaten Anbindungen" }
        values: [Basic, Standard, Premium]
        default: Standard
        confirm_in: [production]
        forced_when: >
          `network_exposure: private` (`public_network_access: disabled`), `key_management:
          customer_managed`, `zone_redundant: true` and `geo_recovery: paired_namespace`
          each force `Premium`, recorded as forced with that question as forced_by. A topic
          request forces at least `Standard`.
        why: >
          Basic has queues only. Standard adds topics and subscriptions on shared capacity,
          billed per operation. Premium is dedicated capacity in messaging units, and it is
          the only tier with **private endpoints, virtual-network rules, zone redundancy,
          customer-managed keys and geo-recovery** - so a private deployment is a Premium
          deployment, whatever the load. Both AVM modules default to Premium, so the default
          here is written, not inherited. The tier cannot be lowered later without a new
          namespace.
        renders: >
          sku.name / skuObject.name (`Basic`, `Standard`, `Premium`)

      - id: capacity
        ask: How many messaging units does a Premium namespace reserve?
        type: enum
        plain:
          en: "The namespace reserves {value} messaging unit(s)."
          de: "Der Namensraum reserviert {value} Messaging-Einheit(en)."
        values: [1, 2, 4, 8, 16]
        default: 1
        depends_on: { question: sku, equals: Premium }
        non_production_default: 1
        why: >
          A messaging unit is the Premium tier's unit of dedicated CPU and memory and the
          unit it is billed in around the clock, whether used or not. One is enough to start
          and is the floor; 2, 4, 8 and 16 follow from measured load, and the count can be
          changed later without a new namespace. Basic and Standard have no units and take
          `0`.
        renders: capacity / skuObject.capacity

      - id: zone_redundant
        ask: Should the namespace survive the loss of one datacenter of its region?
        type: bool
        plain:
          en: "The messaging survives the loss of a datacenter: {value}."
          de: "Die Nachrichtenverarbeitung übersteht den Ausfall eines Rechenzentrums: {value}."
        plain_values:
          true: { en: do, de: überstehen }
          false: { en: do not, de: überstehen nicht }
        derived_from:
          question: outage_impact
          map: { tolerable: false, disruptive: true, critical: true }
        depends_on: { question: sku, equals: Premium }
        non_production_default: false
        why: >
          Derived from how bad an outage is. Zone redundancy replicates the namespace's
          metadata and messages across the region's zones for no extra charge on Premium, so
          the answer is `true` unless the outage is tolerable. Only Premium offers it. The
          Bicep module defaults to `true` (and therefore to Premium), the Terraform module
          has no input for it: it is set by the platform for Premium in a region with zones.
        renders: >
          zoneRedundant (Bicep); no Terraform input - the platform enables it on Premium in
          a zonal region

      - id: premium_messaging_partitions
        ask: Over how many partitions should a Premium namespace spread its entities?
        type: enum
        plain:
          en: "Entities are spread over {value} partition(s)."
          de: "Entitäten werden auf {value} Partition(en) verteilt."
        values: [1, 2, 4]
        default: 1
        depends_on: { question: sku, equals: Premium }
        why: >
          Partitions spread a namespace's entities over several message brokers for
          throughput. **Fixed at creation** - a different count is a new namespace. One is
          the default and enough until a measured throughput says otherwise; it also keeps
          ordering and duplicate detection simple, which partitioned entities restrict.
        renders: premium_messaging_partitions / premiumMessagingPartitions

      - id: minimum_tls_version
        ask: Which TLS version is the lowest a client may use?
        type: enum
        plain:
          en: "Clients must use at least TLS {value}."
          de: "Clients müssen mindestens TLS {value} verwenden."
        values: ["1.0", "1.1", "1.2"]
        default: "1.2"
        why: >
          1.2 is the guardrails' floor, and both modules default to it. Written anyway: a
          module release can move it. Azure retired TLS below 1.2 for its services in 2025,
          so `1.0` and `1.1` are values the platform may refuse; an older client that needs
          one is a named departure on this namespace, not a relaxation.
        renders: minimum_tls_version / minimumTlsVersion

      - id: local_auth
        ask: Should shared access signatures (keys and connection strings) work?
        type: enum
        plain:
          en: "Access keys and connection strings are {value}."
          de: "Zugriffsschlüssel und Verbindungszeichenfolgen sind {value}."
        plain_values:
          disabled: { en: switched off, de: abgeschaltet }
          allowed_where_unavoidable: { en: allowed on this namespace, de: auf diesem Namensraum erlaubt }
        values: [disabled, allowed_where_unavoidable]
        from_deployment: local_auth
        why: >
          Inherited: `local_auth: disabled` renders as local authentication off, so every
          sender and receiver signs in with Entra ID and every action is attributable. The
          modules disagree on the default - **Terraform leaves SAS on, Bicep turns it off**
          - so the value is written on every call. Terraform expresses it positively
          (`local_auth_enabled`), Bicep negatively (`disableLocalAuth`).
        renders: local_auth_enabled (inverse) / disableLocalAuth

      - id: managed_identity
        ask: Which managed identity should the namespace carry?
        type: enum
        plain:
          en: "The namespace has {value}."
          de: "Der Namensraum hat {value}."
        plain_values:
          none: { en: no identity of its own, de: keine eigene Identität }
          system_assigned: { en: its own identity, de: eine eigene Identität }
          user_assigned: { en: a separately managed identity, de: eine separat verwaltete Identität }
        values: [none, system_assigned, user_assigned]
        default: none
        forced_when: >
          `key_management: customer_managed` forces `user_assigned`, recorded as forced with
          `key_management` as forced_by
        why: >
          A namespace needs an identity of its own for exactly one thing: reading a
          customer-managed key, and for forwarding to entities in another namespace. Senders
          and receivers use their own identities. A customer-managed key needs the identity
          to hold its role on the key before the key is set, which is why that case is
          `user_assigned`.
        renders: managed_identities / managedIdentities

      - id: user_assigned_identity_ids
        ask: Which user-assigned identity?
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        ref: user_assigned_identity
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          The identity that holds `Key Vault Crypto Service Encryption User` on the key. It
          is created before the namespace, by the identity set.
        renders: >
          managed_identities.user_assigned_resource_ids /
          managedIdentities.userAssignedResourceIds

  - id: entities
    title: Queues and topics
    questions:
      - id: queues
        ask: Which queues should the namespace hold?
        type: list
        plain:
          en: "Queues: {value} (empty: none)."
          de: "Warteschlangen: {value} (leer: keine)."
        default: []
        why: >
          A queue is point-to-point: one message goes to one receiver. The names are the
          workload's own and part of its contract with the senders, so they are asked, not
          invented. Every queue takes the namespace-wide settings below; one that needs its
          own is recorded here as free text and rendered from the module README. Names are
          unique across queues and topics of a namespace.
        renders: queues / queues[]

      - id: topics
        ask: Which topics should the namespace hold, and who subscribes?
        type: list
        plain:
          en: "Topics and their subscribers: {value} (empty: none)."
          de: "Themen und ihre Abonnenten: {value} (leer: keine)."
        default: []
        why: >
          A topic is publish-subscribe: one message goes to every subscription, each with
          its own copy and its own queue. Each entry is a topic with the subscription names
          under it. A subscription with a filter (SQL or correlation) is recorded with it as
          free text; the rule is rendered from the module README. Needs Standard or Premium.
        renders: topics.<key>.subscriptions / topics[].subscriptions

      - id: message_ordering
        ask: Must messages of one kind be handled in the order they were sent?
        type: bool
        resolved_by: interview
        plain:
          en: "Related messages {value} be handled in order."
          de: "Zusammengehörige Nachrichten {value} der Reihenfolge nach bearbeitet werden."
        plain_values:
          true: { en: must, de: müssen }
          false: { en: need not, de: müssen nicht }
        default: false
        why: >
          The customer's way of asking for **sessions**. A session groups related messages
          by a key and delivers them in order to one receiver at a time - at the price that
          one slow message holds the rest of its session and that the receiver must speak
          sessions. Fixed at creation of the queue or subscription. Off unless the system
          genuinely cannot cope with out-of-order messages: most can, and a receiver that is
          idempotent is more robust than one that relies on order.
        renders: >
          queues.<key>.requires_session / queues[].requiresSession, and subscriptions

      - id: duplicate_protection
        ask: Can the same message be sent twice by accident, and must the second be dropped?
        type: bool
        resolved_by: interview
        plain:
          en: "Duplicate sends {value}."
          de: "Doppelt gesendete Nachrichten {value}."
        plain_values:
          true: { en: are dropped by the broker, de: werden vom Broker verworfen }
          false: { en: are passed on, de: werden weitergereicht }
        default: false
        why: >
          The customer's way of asking for **duplicate detection**: the broker remembers
          message ids for a window and drops a repeat. It is for senders that retry after a
          timeout and cannot tell whether the first send arrived. **Fixed at creation** and
          unavailable on Basic. It costs a little throughput, and it does not replace an
          idempotent receiver, because a repeat after the window passes through.
        renders: requires_duplicate_detection / requiresDuplicateDetection

      - id: message_retention_days
        ask: How long may a message wait unprocessed before it is stale?
        type: int
        resolved_by: interview
        plain:
          en: "A message that is not handled within {value} days expires."
          de: "Eine Nachricht, die nicht innerhalb von {value} Tagen bearbeitet wird, verfällt."
        default: 14
        why: >
          The time-to-live for messages that carry none of their own. Without one a message
          waits forever, which hides a receiver that stopped and fills the entity to its
          size limit. The service's own default is effectively forever; 14 days is long
          enough to survive a weekend and a failed release and short enough to notice a
          receiver that stopped; a system where a message older than an hour is worthless
          sets it short, because a stale message processed late is often worse than none.
        renders: >
          default_message_ttl / defaultMessageTimeToLive (ISO 8601 `P14D`)

      - id: dead_letter_on_expiry
        ask: Should an expired message be kept for inspection instead of vanishing?
        type: bool
        plain:
          en: "An expired message is {value}."
          de: "Eine abgelaufene Nachricht wird {value}."
        plain_values:
          true: { en: kept in a holding queue for inspection, de: in einer Ablage zur Prüfung aufbewahrt }
          false: { en: discarded, de: verworfen }
        default: true
        why: >
          Without it, a message that expires is gone and nobody learns that the receiver was
          behind. With it the message moves to the entity's dead-letter queue, where it can
          be read, repaired and resent. The dead-letter queue is storage inside the
          namespace and counts against its size, so someone has to empty it - that is the
          price, and the reason to alert on its length.
        renders: >
          dead_lettering_on_message_expiration / deadLetteringOnMessageExpiration

      - id: max_delivery_count
        ask: After how many failed attempts is a message set aside?
        type: int
        plain:
          en: "A message is set aside after {value} failed attempts."
          de: "Eine Nachricht wird nach {value} fehlgeschlagenen Versuchen beiseitegelegt."
        default: 10
        why: >
          A message that a receiver keeps failing on would otherwise loop forever (a poison
          message). After this many deliveries it moves to the dead-letter queue. 10 is the
          service default and a sound middle: enough for a transient fault to clear, few
          enough that a broken message does not hold a session for an hour. Lower for a
          receiver that retries by itself, higher for a flaky downstream.
        renders: max_delivery_count / maxDeliveryCount

      - id: lock_duration_seconds
        ask: How long may a receiver work on one message before it is offered to another?
        type: int
        plain:
          en: "A receiver has {value} seconds per message."
          de: "Ein Empfänger hat {value} Sekunden pro Nachricht."
        default: 60
        why: >
          The peek-lock: a receiver takes a message, the broker hides it for this long, and
          the receiver completes it or the message becomes visible again. Too short and a
          slow handler processes the same message twice; too long and a crashed receiver
          blocks it. 60 seconds is the floor and default, 300 the ceiling - longer work
          renews the lock.
        renders: >
          lock_duration / lockDuration (ISO 8601 `PT1M`)

      - id: max_size_megabytes
        ask: How much may one queue or topic hold?
        type: enum
        plain:
          en: "One queue or topic holds at most {value} MB."
          de: "Eine Warteschlange oder ein Thema fasst höchstens {value} MB."
        values: [1024, 2048, 3072, 4096, 5120, 10240, 20480, 40960, 81920]
        default: 1024
        why: >
          The cap on an entity's backlog. It is a safety valve: when a receiver stops the
          entity fills and senders start failing, which is a loud signal, where an unlimited
          one would grow silently until the bill. 1 GB is the default; 5 GB is the Standard
          maximum, and Premium goes to 80 GB. Fixed at creation for partitioned entities.
        renders: max_size_in_megabytes / maxSizeInMegabytes

  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask: Should this namespace depart from the deployment's exposure posture?
        type: enum
        plain:
          en: "The namespace is {value}."
          de: "Der Dienst (namespace) ist {value}."
        plain_values:
          disabled: { en: not reachable from the internet at all, de: aus dem Internet überhaupt nicht erreichbar }
          enabled_with_firewall: { en: reachable from the internet only from listed addresses, de: aus dem Internet nur von gelisteten Adressen erreichbar }
          enabled: { en: reachable from the internet, de: aus dem Internet erreichbar }
        values: [disabled, enabled_with_firewall, enabled]
        from_deployment: network_exposure
        confirm_in: [production]
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces
          `enabled`, recorded as forced with `network_ownership` as forced_by: the
          deployment's callers have no fixed outbound address, so a firewall with no rule
          locks them out.
        why: >
          Asked only as a departure: exposure is a property of the system, the deployment
          set already answered it. `private` is `disabled`, `public` is
          `enabled_with_firewall`. A bare `enabled` is a deliberate choice for a consumer
          that cannot be given an address in advance. Only Premium has a private endpoint,
          so a closed namespace is a Premium one.
        renders: >
          terraform: the public network access input (a bool in the AVM modules) and the
          module's network rules; bicep: publicNetworkAccess and the network rule set

      - id: private_endpoint_subnet
        ask: Which subnet should the namespace's private endpoint live in?
        type: ref
        resolved_by: platform
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        ref: subnet
        from_deployment: private_endpoint_subnet
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited. The
          sub-resource is `namespace`; there is no list to choose from.
        renders: >
          private_endpoints.<key>.subnet_resource_id / privateEndpoints[].subnetResourceId

      - id: ip_rules
        ask: Which public IP ranges may reach the namespace?
        type: list
        plain:
          en: "Public addresses allowed to reach the namespace: {value}."
          de: "Öffentliche Adressen, die den Dienst erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist with a default action of `Deny`. An empty list denies
          every public caller, which is valid and deliberate. `0.0.0.0/0` is not an
          allowlist and is rejected by the guardrails; a single address takes `/32`.
        renders: network_rule_config.cidr_or_ip_rules / networkRuleSets.ipRules

      - id: trusted_service_bypass
        ask: May trusted Azure services reach the namespace past its firewall?
        type: bool
        plain:
          en: "Trusted Azure services {value} past the firewall."
          de: "Vertrauenswürdige Azure-Dienste {value} an der Firewall vorbei."
        plain_values:
          true: { en: may pass, de: dürfen }
          false: { en: may not pass, de: dürfen nicht }
        default: false
        depends_on: { question: public_network_access, not_equals: disabled }
        why: >
          Lets a short list of Microsoft's own services (Event Grid delivering to a queue,
          Azure Monitor, Stream Analytics with managed identity) reach a firewalled
          namespace without a private endpoint of their own. The modules disagree -
          **Terraform defaults to off, Bicep to on** - so it is written. Off unless a named
          service needs it; it has no effect with `public_network_access: disabled`.
        renders: >
          network_rule_config.trusted_services_allowed /
          networkRuleSets.trustedServiceAccessEnabled

  - id: encryption
    title: Encryption
    questions:
      - id: key_management
        ask: Platform-managed or customer-managed encryption keys?
        type: enum
        plain:
          en: "Encryption keys are {value}."
          de: "Verschlüsselungsschlüssel sind {value}."
        plain_values:
          platform_managed: { en: "managed by Azure - encrypted, rotated, no effort on your side", de: "von Azure verwaltet: verschlüsselt, rotiert, kein Aufwand bei euch" }
          customer_managed: { en: "your own, held in your key vault, so you can revoke them", de: "eure eigenen in eurem Schlüsseltresor, damit ihr sie zurückziehen könnt" }
        values: [platform_managed, customer_managed]
        from_deployment: key_management
        why: >
          Inherited: one answer per system. Service Bus encrypts at rest with a platform key
          either way; `customer_managed` points the namespace at a key in the customer's
          vault, needs Premium and a user-assigned identity, and makes the vault a
          dependency.
        renders: >
          whether `customer_managed_key` is rendered at all

      - id: cmk_key_vault_key_id
        ask: Which Key Vault key should encrypt the namespace?
        type: ref
        plain:
          en: "Encrypted with your key {value}."
          de: "Verschlüsselt mit eurem Schlüssel {value}."
        ref: key_vault_key
        required: true
        depends_on: { question: key_management, equals: customer_managed }
        per_environment: true
        why: >
          The key must exist and the namespace's identity must hold wrap and unwrap on it
          before the namespace is created or the key is set. The key is referenced without a
          version so a rotation is followed.
        renders: >
          customer_managed_key.key_vault_resource_id + key_name /
          customerManagedKey.keyVaultResourceId + keyName

      - id: infrastructure_encryption
        ask: Should the data be encrypted twice?
        type: bool
        plain:
          en: "Double encryption is {value}."
          de: "Doppelte Verschlüsselung ist {value}."
        plain_values:
          true: { en: "on", de: eingeschaltet }
          false: { en: "off", de: ausgeschaltet }
        default: false
        depends_on: { question: key_management, equals: customer_managed }
        why: >
          A second layer of encryption with a separate platform key, for a mandate that
          names it. It needs a customer-managed key and is **fixed at creation**. **Both
          modules default to `true`** and the Terraform module then fails without a key, so
          it is written explicitly and is `false` unless a mandate asks.
        renders: infrastructure_encryption_enabled / requireInfrastructureEncryption

  - id: recovery
    title: Recovery
    questions:
      - id: geo_recovery
        ask: Is a second region on standby for a regional outage?
        type: enum
        plain:
          en: "For a regional outage there is {value}."
          de: "Für den Ausfall einer ganzen Region gibt es {value}."
        plain_values:
          none: { en: no standby region, de: keine Ausweichregion }
          paired_namespace: { en: "a paired namespace in a second region, with the same queues and topics", de: ein gekoppelter Namensraum in einer zweiten Region mit denselben Warteschlangen und Themen }
        values: [none, paired_namespace]
        derived_from:
          question: outage_impact
          map: { tolerable: none, disruptive: none, critical: paired_namespace }
        confirm_in: [production]
        non_production_default: none
        why: >
          Derived from how bad an outage is. Geo-disaster recovery pairs the namespace with
          one in another region and copies its **metadata** - entities, not messages - so a
          failover has the queues and topics ready and the messages that were in flight are
          lost. It is Premium only, costs a second namespace and needs a failover plan
          someone has practised, and the partner must lie where `data_residency` allows.
          Zone redundancy already survives a datacenter; this is for the region.
        renders: disaster_recovery_config / disasterRecoveryConfig

      - id: partner_namespace
        ask: Which namespace is the partner?
        type: ref
        plain:
          en: "The partner namespace is {value}."
          de: "Der Partner-Namensraum ist {value}."
        ref: service_bus_namespace
        required: true
        depends_on: { question: geo_recovery, equals: paired_namespace }
        per_environment: true
        why: >
          The second namespace, created by this run or already existing, in a region that
          satisfies `data_residency`. It must be Premium and empty of entities when paired.
          It is an `open:` entry owned by the workload owner when nobody named one.
        renders: >
          disaster_recovery_config.partner_namespace_id /
          disasterRecoveryConfig.partnerNamespace

  - id: identity
    title: Identity and access
    questions:
      - id: role_assignments
        ask: Who needs which role on this namespace?
        type: list
        plain:
          en: "Access rights on the namespace granted to: {value}."
          de: "Zugriffsrechte vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Data-plane access is granted by role, never by key. The narrow roles are `Azure
          Service Bus Data Sender` and `Azure Service Bus Data Receiver`; `Azure Service Bus
          Data Owner` is for the deploying principal and a person, never for a workload.
          Scope to the narrowest resource the consumer needs, never the subscription. A
          pattern normally fills this from the consumers it knows about and grants a
          consumer's role in the pattern, not here. A sender needs only Sender, a receiver
          only Receiver - a workload that does both is two role assignments, not Owner.
        renders: role_assignments / roleAssignments

  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask: Which Log Analytics workspace should receive diagnostics?
        type: ref
        resolved_by: platform
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        ref: log_analytics_workspace
        from_deployment: diagnostics_destination
        per_environment: true
        why: >
          Inherited: one deployment, one destination. Without a diagnostic setting the
          resource keeps no record anyone can query.
        renders: diagnostic_settings / diagnosticSettings

      - id: diagnostic_categories
        ask: Which log categories should be collected?
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          OperationalLogs: { en: management operations on the namespace, de: Verwaltungsvorgänge am Namensraum }
          RuntimeAuditLogs: { en: "every send and receive, for audit", de: "jedes Senden und Empfangen, für die Nachvollziehbarkeit" }
          ApplicationMetricsLogs: { en: message counts and sizes per entity, de: Anzahl und Größe der Nachrichten je Entität }
          VNetAndIPFilteringLogs: { en: connections blocked or allowed by the firewall, de: durch die Firewall blockierte oder erlaubte Verbindungen }
          DiagnosticErrorLogs: { en: errors the service reports, de: vom Dienst gemeldete Fehler }
        values: [OperationalLogs, RuntimeAuditLogs, ApplicationMetricsLogs, VNetAndIPFilteringLogs, DiagnosticErrorLogs]
        default: [OperationalLogs, VNetAndIPFilteringLogs]
        why: >
          Management operations and firewall decisions are the baseline and cheap.
          `DiagnosticErrorLogs` (service errors) is valid on the platform but **rejected by
          the Terraform module's own validation**, which accepts only the four categories
          `OperationalLogs`, `VNetAndIPFilteringLogs`, `RuntimeAuditLogs` and
          `ApplicationMetricsLogs`; it is collected in Bicep or an authored render.
          `RuntimeAuditLogs` records every send and receive: it is the audit trail of who
          touched which entity, Premium only, and as large as the traffic, so it is raised
          for a mandate that asks for it and not by default. `ApplicationMetricsLogs`
          duplicates the metrics. The names are the platform's and are checked against `az
          monitor diagnostic-settings categories list` for the resource before a render, not
          remembered.
        renders: >
          diagnostic_settings.<key>.logs[].category /
          diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask: Should all metrics be collected?
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: collected, de: erfasst }
          false: { en: not collected, de: nicht erfasst }
        default: true
        why: >
          Active messages, dead-lettered messages, throttled requests and server errors -
          the dead-letter count is how a stuck receiver shows up, and the one to alert on.
        renders: metrics[].category = "AllMetrics" / metricCategories[].category

