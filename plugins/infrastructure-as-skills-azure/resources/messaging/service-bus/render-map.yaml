# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
schema_version: 1
resource: Microsoft.ServiceBus/namespaces

modules:
  terraform: [Azure/avm-res-servicebus-namespace/azurerm]
  bicep: [avm/res/service-bus/namespace]

# The Azure resources besides `resource` the render creates for this set; an import adopts
# them by id (adopt.parts). Format: core/iac-rendering/references/render-map.md.
import_parts: [Microsoft.Network/privateEndpoints]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the namespace
  placement.location:
    terraform_avm: { attribute: location, passthrough: true }
    terraform: { attribute: location, passthrough: true }
    bicep_avm: { attribute: location, passthrough: true }
    bicep: { attribute: location, passthrough: true }
  placement.resource_group_name:
    terraform_avm: { attribute: resource_group_name, note: a name - azurerm-based module }
    terraform: { attribute: resource_group_name }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }

  # ---------------------------------------------------------------- namespace
  namespace.sku:
    terraform_avm:
      attribute: sku
      passthrough: true
      also: { Basic: capacity = 0, Standard: capacity = 0 }
      note: module default Premium - written; capacity is asked for Premium only, and the module takes 0 below it
    terraform: { attribute: azurerm_servicebus_namespace.sku, passthrough: true }
    bicep_avm: { attribute: skuObject.name, passthrough: true, note: module default Premium - written }
    bicep: { attribute: sku.name, passthrough: true, note: 'sku: { name, tier, capacity } beside properties' }
  namespace.capacity:
    terraform_avm: { attribute: capacity, passthrough: true, note: 'Premium only, 1/2/4/8/16; Standard and Basic take 0' }
    terraform: { attribute: azurerm_servicebus_namespace.capacity, passthrough: true }
    bicep_avm: { attribute: skuObject.capacity, passthrough: true, note: module default 1 - written; Standard and Basic take no capacity }
    bicep: { attribute: sku.capacity, passthrough: true }
  namespace.zone_redundant:
    terraform_avm:
      gap: module README 0.4.0 has no zone input - the platform's on Premium in a zonal region; not-testable
    terraform: { gap: 'azurerm 5.12 schema has no zone argument on azurerm_servicebus_namespace - the platform default applies' }
    bicep_avm: { attribute: zoneRedundant, passthrough: true, note: 'module default true requires Premium - written, false below Premium' }
    bicep: { attribute: properties.zoneRedundant, passthrough: true }
  namespace.premium_messaging_partitions:
    terraform_avm: { attribute: premium_messaging_partitions, passthrough: true, note: Premium only; 0 for Standard and Basic }
    terraform: { attribute: azurerm_servicebus_namespace.premium_messaging_partitions, passthrough: true }
    bicep_avm: { attribute: premiumMessagingPartitions, passthrough: true, note: default 1 - written }
    bicep: { attribute: properties.premiumMessagingPartitions, passthrough: true }
  namespace.minimum_tls_version:
    terraform_avm: { attribute: minimum_tls_version, passthrough: true, note: default 1.2 - written }
    terraform: { attribute: azurerm_servicebus_namespace.minimum_tls_version, passthrough: true }
    bicep_avm: { attribute: minimumTlsVersion, passthrough: true, note: default 1.2 - written }
    bicep: { attribute: properties.minimumTlsVersion, passthrough: true }
  namespace.local_auth:
    terraform_avm:
      attribute: local_auth_enabled
      values: { disabled: false, allowed_where_unavoidable: true }
      note: inverse; module default true - the opposite of the Bicep module
    terraform:
      attribute: azurerm_servicebus_namespace.local_auth_enabled
      values: { disabled: false, allowed_where_unavoidable: true }
    bicep_avm:
      attribute: disableLocalAuth
      values: { disabled: true, allowed_where_unavoidable: false }
      note: module default true; Terraform's default is the opposite
    bicep:
      attribute: properties.disableLocalAuth
      values: { disabled: true, allowed_where_unavoidable: false }
  namespace.managed_identity:
    terraform_avm:
      attribute: managed_identities
      values:
        system_assigned: { expr: '{ system_assigned = true }' }
        user_assigned: { expr: '{ user_assigned_resource_ids = {namespace.user_assigned_identity_ids} }' }
        none: { expr: '{}' }
    terraform:
      attribute: azurerm_servicebus_namespace.identity.type
      values: { system_assigned: SystemAssigned, user_assigned: UserAssigned, none: null }
      note: none renders no identity block
    bicep_avm:
      attribute: managedIdentities
      values:
        system_assigned: { expr: '{ systemAssigned: true }' }
        user_assigned: { expr: '{ userAssignedResourceIds: {namespace.user_assigned_identity_ids} }' }
        none: { expr: '{}' }
    bicep:
      attribute: identity.type
      values: { system_assigned: SystemAssigned, user_assigned: UserAssigned, none: null }
      note: none renders no identity block
  namespace.user_assigned_identity_ids:
    terraform_avm: { attribute: managed_identities.user_assigned_resource_ids }
    terraform: { attribute: azurerm_servicebus_namespace.identity.identity_ids }
    bicep_avm: { attribute: managedIdentities.userAssignedResourceIds }
    bicep:
      attribute: identity.userAssignedIdentities
      format: { expr: 'toObject({value}, id => id, id => {})' }
      note: "an object keyed by each id - type: 'UserAssigned'; bicep.md names no API version, the module's (source: bicep build, Microsoft.ServiceBus/namespaces@2024-01-01)"

  # ----------------------------------------------------------------- entities
  entities.queues:
    terraform_avm: { attribute: 'queues.<name> = { ... }', note: the namespace-wide entity settings on each }
    terraform: { attribute: azurerm_servicebus_queue, note: one per name with namespace_id }
    bicep_avm: { attribute: 'queues[] = { name, ... }', note: the namespace-wide entity settings on each }
    bicep: { attribute: Microsoft.ServiceBus/namespaces/queues }
  entities.topics:
    terraform_avm:
      attribute: 'topics.<name> = { subscriptions = { <name> = { ... } } }'
      note: Standard or Premium; Basic ignores it
    terraform: { attribute: azurerm_servicebus_topic and azurerm_servicebus_subscription }
    bicep_avm: { attribute: 'topics[] = { name, subscriptions: [ { name, ... } ] }', note: Standard or Premium }
    bicep: { attribute: Microsoft.ServiceBus/namespaces/topics and topics/subscriptions }
  entities.message_ordering:
    terraform_avm:
      attribute: 'queues.<k>.requires_session, topics.<k>.subscriptions.<s>.requires_session'
      passthrough: true
      note: fixed at creation
    terraform: { attribute: azurerm_servicebus_queue.requires_session, passthrough: true, note: and on the subscription; fixed at creation }
    bicep_avm:
      attribute: 'queues[].requiresSession, topics[].subscriptions[].requiresSession'
      passthrough: true
      note: fixed at creation
    bicep: { attribute: queues child properties.requiresSession, passthrough: true, note: and on the subscription; fixed at creation }
  entities.duplicate_protection:
    terraform_avm:
      attribute: 'queues.<k>.requires_duplicate_detection, topics.<k>.requires_duplicate_detection'
      passthrough: true
      note: fixed at creation; not on Basic
    terraform: { attribute: azurerm_servicebus_queue.requires_duplicate_detection, passthrough: true, note: and on the topic; fixed at creation }
    bicep_avm:
      attribute: 'queues[].requiresDuplicateDetection, topics[].requiresDuplicateDetection'
      passthrough: true
      note: fixed at creation
    bicep: { attribute: queues child properties.requiresDuplicateDetection, passthrough: true, note: and on the topic; fixed at creation }
  entities.message_retention_days:
    terraform_avm: { attribute: 'queues.<k>.default_message_ttl', format: 'P{value}D', note: ISO 8601 }
    terraform: { attribute: azurerm_servicebus_queue.default_message_ttl, format: 'P{value}D' }
    bicep_avm:
      attribute: 'queues[].defaultMessageTimeToLive'
      format: 'P{value}D'
      note: ISO 8601; queue, topic and subscription
    bicep: { attribute: queues child properties.defaultMessageTimeToLive, format: 'P{value}D' }
  entities.dead_letter_on_expiry:
    terraform_avm: { attribute: 'queues.<k>.dead_lettering_on_message_expiration', passthrough: true, note: queue and subscription; module default false }
    terraform: { attribute: azurerm_servicebus_queue.dead_lettering_on_message_expiration, passthrough: true }
    bicep_avm: { attribute: 'queues[].deadLetteringOnMessageExpiration', passthrough: true, note: queue and subscription }
    bicep: { attribute: queues child properties.deadLetteringOnMessageExpiration, passthrough: true }
  entities.max_delivery_count:
    terraform_avm: { attribute: 'queues.<k>.max_delivery_count', passthrough: true, note: queue and subscription; default 10 }
    terraform: { attribute: azurerm_servicebus_queue.max_delivery_count, passthrough: true }
    bicep_avm: { attribute: 'queues[].maxDeliveryCount', passthrough: true, note: queue and subscription }
    bicep: { attribute: queues child properties.maxDeliveryCount, passthrough: true }
  entities.lock_duration_seconds:
    terraform_avm: { attribute: 'queues.<k>.lock_duration', format: 'PT{value}S', note: ISO 8601 duration (PT60S is PT1M); queue and subscription }
    terraform: { attribute: azurerm_servicebus_queue.lock_duration, format: 'PT{value}S', note: ISO 8601 duration (PT60S is PT1M) }
    bicep_avm: { attribute: 'queues[].lockDuration', format: 'PT{value}S', note: ISO 8601 duration (PT60S is PT1M); queue and subscription }
    bicep: { attribute: queues child properties.lockDuration, format: 'PT{value}S', note: ISO 8601 duration }
  entities.max_size_megabytes:
    terraform_avm: { attribute: 'queues.<k>.max_size_in_megabytes', passthrough: true, note: queue and topic }
    terraform: { attribute: azurerm_servicebus_queue.max_size_in_megabytes, passthrough: true }
    bicep_avm: { attribute: 'queues[].maxSizeInMegabytes', passthrough: true, note: queue and topic }
    bicep: { attribute: queues child properties.maxSizeInMegabytes, passthrough: true }

  # --------------------------------------------------------------- networking
  networking.public_network_access:
    terraform_avm:
      attribute: public_network_access_enabled
      values: { disabled: false, enabled_with_firewall: true, enabled: true }
      also:
        disabled: 'network_rule_config = { default_action = "Deny" }'
        enabled_with_firewall: 'network_rule_config = { default_action = "Deny" }'
      note: a bool, module default true; network_rule_config defaults to Allow - Deny for every posture except enabled
    terraform:
      attribute: azurerm_servicebus_namespace.public_network_access_enabled
      values: { disabled: false, enabled_with_firewall: true, enabled: true }
      note: a bool, unchanged in 5.x
    bicep_avm:
      attribute: publicNetworkAccess
      values: { disabled: Disabled, enabled_with_firewall: Enabled, enabled: Enabled }
      note: unset, disabled only with private endpoints; networkRuleSets.publicNetworkAccess repeats it on purpose
    bicep:
      attribute: properties.publicNetworkAccess
      values: { disabled: Disabled, enabled_with_firewall: Enabled, enabled: Enabled }
  networking.private_endpoint_subnet:
    terraform_avm:
      attribute: private_endpoints.namespace.subnet_resource_id
      note: subresource_name = "namespace" defaults to null - written; Premium only
    terraform: { attribute: azurerm_private_endpoint.subnet_id }
    bicep_avm: { attribute: 'privateEndpoints[].subnetResourceId', note: "service: 'namespace'; Premium only" }
    bicep: { attribute: Microsoft.Network/privateEndpoints properties.subnet.id }
  networking.ip_rules:
    terraform_avm: { attribute: network_rule_config.cidr_or_ip_rules, note: 'Premium only in Azure, whatever the README says for Basic/Standard' }
    terraform: { attribute: azurerm_servicebus_namespace.network_rule_set.ip_rules, note: an inline block in 5.x }
    bicep_avm: { attribute: 'networkRuleSets.ipRules[].ipMask', note: "action: 'Allow'; Premium only" }
    bicep: { attribute: 'networkRuleSets/default properties.ipRules[].ipMask', note: "action: 'Allow'" }
  networking.trusted_service_bypass:
    terraform_avm: { attribute: network_rule_config.trusted_services_allowed, passthrough: true }
    terraform: { attribute: azurerm_servicebus_namespace.network_rule_set.trusted_services_allowed, passthrough: true }
    bicep_avm: { attribute: networkRuleSets.trustedServiceAccessEnabled, passthrough: true, note: module default true - written }
    bicep: { attribute: networkRuleSets/default properties.trustedServiceAccessEnabled, passthrough: true }

  # --------------------------------------------------------------- encryption
  encryption.key_management:
    terraform_avm:
      attribute: customer_managed_key
      values:
        platform_managed: null
        customer_managed: { expr: '{ key_vault_resource_id, key_name, user_assigned_identity = { resource_id } }' }
      note: Premium; read the exact member names from the README
    terraform:
      attribute: azurerm_servicebus_namespace.customer_managed_key
      values:
        platform_managed: null
        customer_managed: { expr: '{ key_vault_key_id = {encryption.cmk_key_vault_key_id}, identity_id = <identity_id>, infrastructure_encryption_enabled = {encryption.infrastructure_encryption} }' }
      note: an inline block; platform_managed renders none
    bicep_avm:
      attribute: customerManagedKey
      values:
        platform_managed: null
        customer_managed: { expr: '{ keyName: <keyName>, keyVaultResourceId: <keyVaultResourceId>, userAssignedIdentityResourceId: <userAssignedIdentityResourceId> }' }
      note: key version unset follows rotation; Premium
    bicep:
      attribute: properties.encryption.keySource
      values: { platform_managed: null, customer_managed: Microsoft.KeyVault }
      note: platform_managed renders no encryption block
  encryption.cmk_key_vault_key_id:
    terraform_avm:
      attribute: customer_managed_key.key_vault_resource_id, customer_managed_key.key_name
      note: the key id split into the vault's id and the key's name
    terraform: { attribute: customer_managed_key.key_vault_key_id }
    bicep_avm:
      attribute: customerManagedKey.keyVaultResourceId, customerManagedKey.keyName
      note: the key id split into the vault's id and the key's name
    bicep:
      attribute: 'properties.encryption.keyVaultProperties[].keyName, properties.encryption.keyVaultProperties[].keyVaultUri'
      note: the key id split into the key's name and the vault's uri; identity beside them
  encryption.infrastructure_encryption:
    terraform_avm: { attribute: infrastructure_encryption_enabled, passthrough: true, note: module default true and then requires the key - written }
    terraform: { attribute: customer_managed_key.infrastructure_encryption_enabled, passthrough: true }
    bicep_avm: { attribute: requireInfrastructureEncryption, passthrough: true, note: module default true and then requires the key - written }
    bicep: { attribute: properties.encryption.requireInfrastructureEncryption, passthrough: true }

  # ----------------------------------------------------------------- recovery
  recovery.geo_recovery:
    terraform_avm:
      gap: module README 0.4.0 has no input - azurerm_servicebus_namespace_disaster_recovery_config outside the module; the partner is a second module call with no entities
    terraform:
      attribute: azurerm_servicebus_namespace_disaster_recovery_config.partner_namespace_id
      values: { none: null, paired_namespace: { expr: '{recovery.partner_namespace}' } }
      note: 'one resource, primary_namespace_id = the primary id, name = the alias; none renders none (source: azurerm 5.12 schema, azurerm 5.12 docs)'
    bicep_avm:
      attribute: disasterRecoveryConfig
      values:
        none: null
        paired_namespace: { expr: '{ partnerNamespace: {recovery.partner_namespace}, alternateName: <alternateName> }' }
      note: on the primary only; the partner is a second module call with no entities
    bicep:
      attribute: Microsoft.ServiceBus/namespaces/disasterRecoveryConfigs properties.partnerNamespace
      values: { none: null, paired_namespace: { expr: '{recovery.partner_namespace}' } }
      note: 'a child of the primary; none renders none (source: bicep build, Microsoft.ServiceBus/namespaces/disasterRecoveryConfigs@2024-01-01)'
  recovery.partner_namespace:
    terraform_avm:
      gap: module README 0.4.0 has no input - partner_namespace_id on the azurerm_servicebus_namespace_disaster_recovery_config outside the module
    terraform: { attribute: azurerm_servicebus_namespace_disaster_recovery_config.partner_namespace_id }
    bicep_avm: { attribute: disasterRecoveryConfig.partnerNamespace }
    bicep: { attribute: disasterRecoveryConfigs child properties.partnerNamespace }

  # ----------------------------------------------------------------- identity
  identity.role_assignments:
    terraform_avm:
      attribute: 'role_assignments.<k> = { role_definition_id_or_name, principal_id, principal_type }'
      note: also per queue and topic
    terraform: { attribute: azurerm_role_assignment, note: scope = the namespace's id }
    bicep_avm:
      attribute: 'roleAssignments[] = { principalId, roleDefinitionIdOrName, principalType }'
      note: also per queue and topic
    bicep: { attribute: Microsoft.Authorization/roleAssignments, note: scope = the namespace }

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm: { attribute: 'diagnostic_settings.<key>.workspace_resource_id' }
    terraform: { attribute: azurerm_monitor_diagnostic_setting.log_analytics_workspace_id }
    bicep_avm: { attribute: 'diagnosticSettings[].workspaceResourceId' }
    bicep: { attribute: Microsoft.Insights/diagnosticSettings properties.workspaceId }
  observability.diagnostic_categories:
    terraform_avm:
      attribute: 'diagnostic_settings.<key>.log_categories'
      note: log_groups defaults to allLogs - set to []; the module validates log_categories against OperationalLogs, VNetAndIPFilteringLogs, RuntimeAuditLogs, ApplicationMetricsLogs - DiagnosticErrorLogs is refused
    terraform: { attribute: azurerm_monitor_diagnostic_setting.enabled_log.category }
    bicep_avm: { attribute: 'diagnosticSettings[].logCategoriesAndGroups[].category' }
    bicep: { attribute: 'Microsoft.Insights/diagnosticSettings properties.logs[].category' }
  observability.metrics_enabled:
    terraform_avm:
      attribute: 'diagnostic_settings.<key>.metric_categories'
      values: { true: { expr: '["AllMetrics"]' }, false: { expr: '[]' } }
    terraform:
      attribute: azurerm_monitor_diagnostic_setting.enabled_metric
      values: { true: { expr: '{ category = "AllMetrics" }' }, false: null }
      note: a block (azurerm 5.x); false renders none. The reference's diagnostics row names enabled_log only
    bicep_avm:
      attribute: 'diagnosticSettings[].metricCategories'
      values: { true: { expr: "[ { category: 'AllMetrics' } ]" }, false: { expr: '[]' } }
    bicep:
      attribute: 'Microsoft.Insights/diagnosticSettings properties.metrics[].category'
      values: { true: AllMetrics, false: null }
      note: false renders no metrics entry
