schema_version: 1

resource: Microsoft.EventGrid/topics
title: Azure Event Grid custom topic

naming:
  terraform: "Azure::Microsoft.EventGrid/topics"
  bicep: "Microsoft.EventGrid/topics"
  # Bicep assembles the name from vars - this is the prefix it renders. The name is regional and limited to 50 characters.
  abbreviation: "evt"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform (`privatelink.eventgrid.azure.net`)."
  - "Does not create the Log Analytics workspace it routes diagnostics to, nor the storage account that receives undeliverable events."
  - "Does not create system topics (one per Azure source resource, owned by it), domains or namespaces (MQTT, pull delivery). Those are separate resource types."
  - "Does not grant the publishers and the delivery targets their roles - that is wiring between resources, owned by a pattern. It records the topic's own role assignments in `role_assignments`."
  - "Does not render access keys. With `local_auth: disabled` there are none; a publisher that cannot use Entra ID is a named departure and an `open:` entry."
  - "Subscription filters (subject prefixes, advanced filters), webhook validation and per-subscription delivery tuning are recorded in `event_subscriptions` as free text and rendered from the module README."

groups:

  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name and the strictness of several defaults below. Nothing
          sensible can be guessed.
        renders: >
          naming parameter `environment`, and the tag of that name where the repository uses
          one

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        required: true
        from_context: true
        why: >
          Part of the rendered name and not inferable. A topic is regional; where its events
          may be handled is the residency boundary below.
        renders: location

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        required: true
        from_context: true
        per_environment: true
        why: >
          The topic is placed into an existing group. Creating one here would make this set
          own a lifecycle wider than the resource it describes.
        renders: resource_group_name (AVM Terraform) / implicit in Bicep scope

  - id: topic
    title: The topic
    questions:
      - id: input_schema
        ask:
          en: "Which event format do the publishers send?"
          de: "Welches Ereignisformat senden die Publisher?"
        type: enum
        plain:
          en: "Publishers send events in the {value} format."
          de: "Absender senden Ereignisse im Format {value}."
        plain_values:
          CloudEventSchemaV1_0: { en: the open CloudEvents standard, de: dem offenen CloudEvents-Standard }
          EventGridSchema: { en: "Azure's own Event Grid format", de: dem Event-Grid-Format von Azure }
        accepts: [CloudEventSchemaV1_0, EventGridSchema]
        default: CloudEventSchemaV1_0
        why: >
          The envelope of every event. **CloudEvents 1.0** is the open standard and the
          right choice for anything new: the same event reads in other systems and in non-
          Azure tooling. The Event Grid schema is Azure's own and what existing publishers
          and many Azure sources already send. The topic accepts one schema and it is
          **fixed at creation**. Both modules default to the Event Grid schema; the default
          here is written, not inherited.
        renders: >
          schema / inputSchema (`EventGridSchema`, `CloudEventSchemaV1_0`)

      - id: minimum_tls_version
        ask:
          en: "Which TLS version is the lowest a publisher may use?"
          de: "Welche ist die niedrigste TLS-Version, die ein Publisher verwenden darf?"
        type: enum
        plain:
          en: "Publishers must use at least TLS {value}."
          de: "Absender müssen mindestens TLS {value} verwenden."
        accepts: ["1.0", "1.1", "1.2"]
        default: "1.2"
        why: >
          1.2 is the guardrails' floor, and both modules default to it. Written anyway: a
          module release can move it.
        renders: minimum_tls_version_allowed / minimumTlsVersionAllowed

      - id: local_auth
        ask:
          en: "Should access keys and shared access signatures work?"
          de: "Sollen Zugriffsschlüssel und Shared Access Signatures funktionieren?"
        type: enum
        plain:
          en: "Access keys are {value}."
          de: "Zugriffsschlüssel sind {value}."
        plain_values:
          disabled: { en: switched off, de: abgeschaltet }
          allowed_where_unavoidable: { en: allowed on this topic, de: auf diesem Thema erlaubt }
        accepts: [disabled, allowed_where_unavoidable]
        from_deployment: local_auth
        why: >
          Inherited: `local_auth: disabled` renders as local authentication off, so every
          publisher signs in with Entra ID and every publish is attributable. Both modules
          default to off; written anyway. Terraform and Bicep both express it negatively
          (`disable_local_auth`, `disableLocalAuth`).
        renders: disable_local_auth / disableLocalAuth

      - id: data_residency_boundary
        ask:
          en: "Within which area may the topic move events?"
          de: "Innerhalb welches Gebiets darf das Topic Ereignisse bewegen?"
        type: enum
        plain:
          en: "Events stay {value}."
          de: "Ereignisse bleiben {value}."
        plain_values:
          WithinRegion: { en: "inside the topic's own region", de: innerhalb der eigenen Region des Themas }
          WithinGeopair: { en: inside the region and its paired region, de: innerhalb der Region und ihrer Partnerregion }
        accepts: [WithinRegion, WithinGeopair]
        derived_from:
          question: data_residency
          map: { country: WithinRegion, data_zone: WithinGeopair, unrestricted: WithinGeopair }
        why: >
          Derived from where the data may live. `WithinRegion` keeps events in the topic's
          region; `WithinGeopair` allows the paired region, which is what Event Grid's
          built-in resilience uses. A `country` constraint therefore picks `WithinRegion`
          where the paired region is in another country. Fixed at creation.
        renders: data_residency_boundary / dataResidencyBoundary

      - id: managed_identity
        ask:
          en: "Which managed identity should the topic carry?"
          de: "Welche Managed Identity soll das Topic tragen?"
        type: enum
        plain:
          en: "The topic has {value}."
          de: "Das Thema hat {value}."
        plain_values:
          none: { en: no identity of its own, de: keine eigene Identität }
          system_assigned: { en: its own identity, de: eine eigene Identität }
          user_assigned: { en: a separately managed identity, de: eine separat verwaltete Identität }
        accepts: [none, system_assigned, user_assigned]
        default: none
        why: >
          A topic needs an identity of its own to deliver to a target that requires Entra ID
          (a queue, an event hub) or to write undeliverable events to storage without a key.
          A topic that delivers to a webhook only carries none. Targets are granted the
          identity's role in the pattern, not here.
        renders: managed_identities / managedIdentities

      - id: user_assigned_identity_ids
        ask:
          en: "Which user-assigned identity?"
          de: "Welche User-Assigned Identity?"
        type: list
        plain:
          en: "It uses the identity {value}."
          de: "Es nutzt die Identität {value}."
        accepts: { ref: user_assigned_identity }
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          The identity that holds the data-plane role on each delivery target and on the
          dead-letter container. It is created before the topic, by the identity set.
        renders: >
          managed_identities.user_assigned_resource_ids /
          managedIdentities.userAssignedResourceIds

  - id: delivery
    title: Subscriptions and delivery
    questions:
      - id: event_subscriptions
        ask:
          en: "Who receives the events, and where are they delivered to?"
          de: "Wer empfängt die Ereignisse, und wohin werden sie zugestellt?"
        type: list
        plain:
          en: "Subscribers: {value} (empty: none yet)."
          de: "Abonnenten: {value} (leer: noch keine)."
        default: []
        why: >
          Each entry is a subscription: its name, its target (a queue, an event hub, a
          function, a webhook) and the filter that decides which events it receives. A topic
          with no subscription drops every event silently, which is the usual first fault.
          The targets are other resources of the deployment, named here and wired by the
          pattern; a webhook target is an `open:` entry owned by its operator because it
          must answer the validation handshake.
        renders: event_subscriptions / eventSubscriptions

      - id: max_delivery_attempts
        ask:
          en: "How often is a failed delivery retried?"
          de: "Wie oft wird eine fehlgeschlagene Zustellung wiederholt?"
        type: int
        plain:
          en: "A failed delivery is retried up to {value} times."
          de: "Eine fehlgeschlagene Zustellung wird bis zu {value} Mal wiederholt."
        default: 30
        why: >
          Event Grid retries with growing intervals until the event expires or the attempts
          run out, then the event is dead-lettered or dropped. 30 is the service default and
          covers a target that is down for a day; fewer is right for a target where a late
          event is worse than none. Applies to every subscription, a single one can depart.
        renders: >
          event_subscriptions.<k>.retry_policy.max_delivery_attempts /
          retryPolicy.maxDeliveryAttempts

      - id: event_ttl_minutes
        ask:
          en: "How long may an event wait for delivery before it is stale?"
          de: "Wie lange darf ein Ereignis auf die Zustellung warten, bevor es veraltet ist?"
        type: int
        resolved_by: interview
        topic: data
        plain:
          en: "An undelivered event expires after {value} minutes."
          de: "Ein nicht zugestelltes Ereignis verfällt nach {value} Minuten."
        default: 1440
        why: >
          The window in which Event Grid keeps retrying. 1440 minutes (one day) is the
          service default and the maximum; a notification that is useless after an hour sets
          it to 60. It works with the attempts: whichever runs out first ends the retry.
        renders: >
          event_subscriptions.<k>.retry_policy.event_time_to_live_in_minutes /
          retryPolicy.eventTimeToLiveInMinutes

      - id: keep_undeliverable_events
        ask:
          en: "Should an event that could not be delivered be kept for inspection?"
          de: "Soll ein Ereignis, das nicht zugestellt werden konnte, zur Prüfung aufbewahrt werden?"
        type: bool
        resolved_by: interview
        topic: resilience
        plain:
          en: "An event that cannot be delivered is {value}."
          de: "Ein Ereignis, das nicht zugestellt werden kann, wird {value}."
        plain_values:
          true: { en: kept in storage for inspection, de: zur Prüfung im Speicher aufbewahrt }
          false: { en: discarded, de: verworfen }
        default: true
        why: >
          Without a dead-letter destination an event whose retries ran out is gone and
          nobody learns that a subscriber was down. With one it is written as a file to a
          storage container where it can be read, repaired and resent. The price is the
          storage and someone reading it; the reason to alert on `DeliveryFailures`.
        renders: >
          event_subscriptions.<k>.dead_letter_destination / deadLetterDestination

      - id: dead_letter_storage_account
        ask:
          en: "Which storage account receives the undeliverable events?"
          de: "Welches Speicherkonto erhält die nicht zustellbaren Ereignisse?"
        type: string
        plain:
          en: "Undeliverable events go to the storage account {value}."
          de: "Nicht zustellbare Ereignisse gehen in das Speicherkonto {value}."
        accepts: { ref: storage_account }
        required: true
        depends_on: { question: keep_undeliverable_events, equals: true }
        per_environment: true
        why: >
          A storage account of the deployment, written by the topic's identity with `Storage
          Blob Data Contributor` on the container (no key). A firewalled account must let
          Event Grid in through the trusted-service path or a private endpoint.
        renders: >
          dead_letter_destination.storage_blob.resource_id /
          deadLetterDestination.properties.resourceId

      - id: dead_letter_container
        ask:
          en: "In which container are they written?"
          de: "In welchen Container werden sie geschrieben?"
        type: string
        plain:
          en: "The files go to the container {value}."
          de: "Die Dateien gehen in den Container {value}."
        default: eventgrid-deadletter
        depends_on: { question: keep_undeliverable_events, equals: true }
        why: >
          The container is created by the storage set (blob container); this names it.
        renders: >
          dead_letter_destination.storage_blob.blob_container_name /
          deadLetterDestination.properties.blobContainerName

  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask:
          en: "Should this topic depart from the deployment's exposure posture?"
          de: "Soll dieses Topic von der Erreichbarkeit des Deployments abweichen?"
        type: enum
        plain:
          en: "The topic is {value}."
          de: "Der Dienst (topic) ist {value}."
        plain_values:
          disabled: { en: not reachable from the internet at all, de: aus dem Internet überhaupt nicht erreichbar }
          enabled_with_firewall: { en: reachable from the internet only from listed addresses, de: aus dem Internet nur von gelisteten Adressen erreichbar }
          enabled: { en: reachable from the internet, de: aus dem Internet erreichbar }
        accepts: [disabled, enabled_with_firewall, enabled]
        from_deployment: network_exposure
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces
          `enabled`, recorded as forced with `network_ownership` as forced_by: the
          deployment's callers have no fixed outbound address, so a firewall with no rule
          locks them out.
        why: >
          Asked only as a departure: exposure is a property of the system, the deployment
          set already answered it. `private` is `disabled`, `public` is
          `enabled_with_firewall`. A bare `enabled` is a deliberate choice for a consumer
          that cannot be given an address in advance. Event Grid topics support private
          endpoints on every tier. **The modules disagree on the default** - Terraform
          disables public access, Bicep leaves it to the platform - so it is written.
        renders: >
          terraform: public_network_access (`Enabled`/`Disabled`, a string) and
          inbound_ip_rules; bicep: publicNetworkAccess and inboundIpRules

      - id: private_endpoint_subnet
        ask:
          en: "Which subnet should the topic's private endpoint live in?"
          de: "In welchem Subnetz soll der Private Endpoint des Topics liegen?"
        type: string
        resolved_by: derived
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        accepts: { ref: subnet }
        from_deployment: private_endpoint_subnet
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited. The
          sub-resource is `topic`; there is no list to choose from.
        renders: >
          private_endpoints.<key>.subnet_resource_id / privateEndpoints[].subnetResourceId

      - id: ip_rules
        ask:
          en: "Which public IP ranges may reach the topic?"
          de: "Welche öffentlichen IP-Bereiche dürfen das Topic erreichen?"
        type: list
        plain:
          en: "Public addresses allowed to reach the topic: {value}."
          de: "Öffentliche Adressen, die den Dienst erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist with a default action of `Deny`. An empty list denies
          every public caller, which is valid and deliberate. `0.0.0.0/0` is not an
          allowlist and is rejected by the guardrails; a single address takes `/32`.
        renders: inbound_ip_rules = [{ ip_mask, action = "Allow" }] / inboundIpRules

  - id: identity
    title: Identity and access
    questions:
      - id: role_assignments
        ask:
          en: "Who needs which role on this topic?"
          de: "Wer braucht welche Rolle auf diesem Topic?"
        type: list
        plain:
          en: "Access rights on the topic granted to: {value}."
          de: "Zugriffsrechte vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Data-plane access is granted by role, never by key. The publisher role is
          `EventGrid Data Sender`; `EventGrid Contributor` manages topics and subscriptions
          and is for the deploying principal, never for a workload. Scope to the narrowest
          resource the consumer needs, never the subscription. A pattern normally fills this
          from the consumers it knows about and grants a consumer's role in the pattern, not
          here. A delivery target is granted its role on the *target*, in the pattern; this
          list is who may publish.
        renders: role_assignments / roleAssignments

  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive diagnostics?"
          de: "Welcher Log Analytics Workspace soll die Diagnosedaten erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        from_deployment: diagnostics_destination
        per_environment: true
        why: >
          Inherited: one deployment, one destination. Without a diagnostic setting the
          resource keeps no record anyone can query.
        renders: diagnostic_settings / diagnosticSettings

      - id: diagnostic_categories
        ask:
          en: "Which log categories should be collected?"
          de: "Welche Log-Kategorien sollen erfasst werden?"
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          DeliveryFailures: { en: "events that could not be delivered, and why", de: "Ereignisse, die nicht zugestellt werden konnten, und warum" }
          PublishFailures: { en: events a publisher sent that were rejected, de: abgewiesene Ereignisse von Absendern }
          DataPlaneRequests: { en: "every request to publish, for audit", de: "jede Veröffentlichungsanfrage, für die Nachvollziehbarkeit" }
        accepts: [DeliveryFailures, PublishFailures, DataPlaneRequests]
        default: [DeliveryFailures, PublishFailures]
        why: >
          Delivery and publish failures are the two things anyone debugging a topic needs
          and are cheap - they log only the events that went wrong. `DataPlaneRequests`
          records every publish and is as large as the traffic, so it is raised for a
          mandate that asks for it. The names are the platform's and are checked against `az
          monitor diagnostic-settings categories list` for the resource before a render, not
          remembered.
        renders: >
          diagnostic_settings.<key>.logs[].category /
          diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask:
          en: "Should all metrics be collected?"
          de: "Sollen alle Metriken erfasst werden?"
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: collected, de: erfasst }
          false: { en: not collected, de: nicht erfasst }
        default: true
        why: >
          Published, matched, delivered and dropped event counts and the dead-lettered count
          - a delivered count that stops rising is how a dead subscriber shows up, and the
          one to alert on.
        renders: metrics[].category = "AllMetrics" / metricCategories[].category

