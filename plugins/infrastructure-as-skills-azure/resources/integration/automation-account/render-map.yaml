# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
# The Terraform module requires azurerm ~> 4.0: a root calling it cannot be on azurerm 5.x, and
# the authored fallback in that root follows the 4.x spelling (the account's arguments are the
# same in 5.x).
schema_version: 1
resource: Microsoft.Automation/automationAccounts

modules:
  terraform: [Azure/avm-res-automation-automationaccount/azurerm]
  bicep: [avm/res/automation/automation-account]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the account
  placement.location:
    terraform_avm: { attribute: location, passthrough: true }
    terraform: { attribute: location, passthrough: true }
    bicep_avm: { attribute: location, passthrough: true }
    bicep: { attribute: location, passthrough: true }
  placement.resource_group_name:
    terraform_avm: { attribute: resource_group_name, note: 'a name, not an id - the account is an azurerm_automation_account' }
    terraform: { attribute: resource_group_name, note: 'a name, not an id (source: azurerm 5.12 schema)' }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }

  # ------------------------------------------------------------------ account
  account.sku:
    terraform_avm: { attribute: sku, passthrough: true, note: required; the module passes it to sku_name }
    terraform: { attribute: sku_name, passthrough: true, note: 'required (source: azurerm 5.12 schema)' }
    bicep_avm: { attribute: skuName, passthrough: true, note: module default Basic; written anyway }
    bicep: { attribute: properties.sku.name, passthrough: true }

  # --------------------------------------------------------------- networking
  networking.public_network_access:
    terraform_avm:
      attribute: public_network_access_enabled
      values: { disabled: false, enabled: true }
      note: a bool, module default false - always written
    terraform:
      attribute: public_network_access_enabled
      values: { disabled: false, enabled: true }
      note: 'a bool in 5.x too (source: azurerm 5.12 schema)'
    bicep_avm:
      attribute: publicNetworkAccess
      values: { disabled: Disabled, enabled: Enabled }
      note: unset, the module disables it only with private endpoints - always write it
    bicep:
      attribute: properties.publicNetworkAccess
      values: { disabled: false, enabled: true }
      note: 'a bool on the resource, unlike the module''s string (source: bicep build, Microsoft.Automation/automationAccounts@2023-11-01)'
  networking.private_endpoint_subnet:
    terraform_avm:
      attribute: private_endpoints.<key>.subnet_resource_id
      note: one entry per subresource, the same subnet; zone privatelink.azure-automation.net; private_endpoints_manage_dns_zone_group = false under policy
    terraform:
      attribute: azurerm_private_endpoint.subnet_id
      note: 'one authored endpoint per subresource (source: azurerm 5.12 schema)'
    bicep_avm:
      attribute: 'privateEndpoints[].subnetResourceId'
      note: one entry per subresource; no privateDnsZoneGroup under private_dns_records policy
    bicep:
      attribute: Microsoft.Network/privateEndpoints properties.subnet.id
      note: one per subresource; privateLinkServiceConnections[].properties.groupIds = [ the subresource ]
  networking.private_endpoint_subresources:
    terraform_avm:
      attribute: private_endpoints.<key>.subresource_name
      note: one entry per value, the key the subresource in lower case; the module requires it for this resource
    terraform:
      attribute: azurerm_private_endpoint.private_service_connection.subresource_names
      note: one endpoint per value, subresource_names = [ the value ]
    bicep_avm:
      attribute: 'privateEndpoints[].service'
      note: one entry per value
    bicep:
      attribute: Microsoft.Network/privateEndpoints properties.privateLinkServiceConnections[].properties.groupIds
      note: one endpoint per value

  # ----------------------------------------------------------------- identity
  identity.managed_identity:
    terraform_avm:
      attribute: managed_identities
      values:
        system_assigned: { expr: '{ system_assigned = true }' }
        user_assigned: { expr: '{ user_assigned_resource_ids = {identity.user_assigned_identity_ids} }' }
    terraform:
      attribute: identity.type
      values: { system_assigned: SystemAssigned, user_assigned: UserAssigned }
      note: '(source: azurerm 5.12 schema)'
    bicep_avm:
      attribute: managedIdentities
      values:
        system_assigned: { expr: '{ systemAssigned: true }' }
        user_assigned: { expr: '{ userAssignedResourceIds: {identity.user_assigned_identity_ids} }' }
    bicep:
      attribute: identity.type
      values: { system_assigned: SystemAssigned, user_assigned: UserAssigned }
      note: '(source: bicep build, Microsoft.Automation/automationAccounts@2023-11-01)'
  identity.user_assigned_identity_ids:
    terraform_avm: { attribute: managed_identities.user_assigned_resource_ids }
    terraform: { attribute: identity.identity_ids }
    bicep_avm: { attribute: managedIdentities.userAssignedResourceIds }
    bicep:
      attribute: identity.userAssignedIdentities
      format: { expr: 'toObject({value}, id => id, id => {})' }
      note: 'an object keyed by identity id, each value empty (source: bicep build, Microsoft.Automation/automationAccounts@2023-11-01)'
  identity.role_assignments:
    terraform_avm:
      attribute: 'role_assignments.<key> = { role_definition_id_or_name, principal_id }'
      note: the Automation roles by name
    terraform:
      attribute: 'azurerm_role_assignment = { scope, role_definition_name, principal_id }'
      note: 'one per entry, scope = the account id (source: azurerm 5.12 schema)'
    bicep_avm: { attribute: roleAssignments, note: the Automation roles by name }
    bicep:
      attribute: 'Microsoft.Authorization/roleAssignments properties = { principalId, roleDefinitionId, principalType }'
      note: 'one per entry, scoped to the account; roleDefinitionId takes the definition id, the render resolves the role name (source: bicep build, Microsoft.Authorization/roleAssignments@2022-04-01)'

  # ----------------------------------------------------------------- security
  security.local_authentication_disabled:
    terraform_avm:
      attribute: local_authentication_enabled
      values: { true: false, false: true }
      note: inverse; module default true (on) - written
    terraform:
      attribute: local_authentication_enabled
      values: { true: false, false: true }
      note: 'inverse (source: azurerm 5.12 schema)'
    bicep_avm: { attribute: disableLocalAuth, passthrough: true, note: module default true; written anyway }
    bicep: { attribute: properties.disableLocalAuth, passthrough: true }
  security.key_management:
    terraform_avm:
      attribute: encryption
      values:
        platform_managed: null
        customer_managed: { expr: '[{ key_vault_key_id = {security.cmk_key_vault_key_id}, user_assigned_identity_id = <encryption identity> }]' }
      note: a list of one object; the identity is one of identity.user_assigned_identity_ids
    terraform:
      attribute: encryption
      values:
        platform_managed: null
        customer_managed: { expr: '{ key_vault_key_id = {security.cmk_key_vault_key_id}, user_assigned_identity_id = <encryption identity> }' }
      note: 'a block; none written for platform_managed (source: azurerm 5.12 schema)'
    bicep_avm:
      attribute: customerManagedKey
      values:
        platform_managed: null
        customer_managed: { expr: '{ keyVaultResourceId: <the key''s vault id>, keyName: <the key''s name>, userAssignedIdentityResourceId: <encryption identity> }' }
      note: no keyVersion - the latest version, so a rotation is picked up
    bicep:
      attribute: properties.encryption
      values:
        platform_managed: null
        customer_managed: { expr: "{ keySource: 'Microsoft.Keyvault', keyVaultProperties: { keyvaultUri: <vault uri>, keyName: <key name> }, identity: { userAssignedIdentity: <encryption identity> } }" }
      note: '(source: bicep build, Microsoft.Automation/automationAccounts@2023-11-01)'
  security.cmk_key_vault_key_id:
    terraform_avm: { attribute: 'encryption[0].key_vault_key_id', note: the unversioned key id }
    terraform: { attribute: encryption.key_vault_key_id, note: the unversioned key id }
    bicep_avm:
      attribute: customerManagedKey.keyVaultResourceId, customerManagedKey.keyName
      note: the key id split - keyVaultResourceId = the key's vault id, keyName = the key's name; never the key id into either
    bicep:
      attribute: properties.encryption.keyVaultProperties.keyvaultUri, properties.encryption.keyVaultProperties.keyName
      note: 'the key id split - keyvaultUri = the vault URI, keyName = the key name (source: bicep build, Microsoft.Automation/automationAccounts@2023-11-01)'

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm: { attribute: diagnostic_settings.workspace.workspace_resource_id }
    terraform:
      attribute: azurerm_monitor_diagnostic_setting.log_analytics_workspace_id
      note: '(source: azurerm 5.12 schema)'
    bicep_avm: { attribute: 'diagnosticSettings[].workspaceResourceId' }
    bicep:
      attribute: Microsoft.Insights/diagnosticSettings properties.workspaceId
      note: 'scoped to the account (source: bicep build, Microsoft.Insights/diagnosticSettings@2021-05-01-preview)'
  observability.diagnostic_categories:
    terraform_avm:
      attribute: diagnostic_settings.workspace.log_categories
      note: log_groups defaults to ["allLogs"] - set it [] beside the categories
    terraform: { attribute: azurerm_monitor_diagnostic_setting.enabled_log.category }
    bicep_avm: { attribute: 'diagnosticSettings[].logCategoriesAndGroups[].category' }
    bicep:
      attribute: 'Microsoft.Insights/diagnosticSettings properties.logs[].category'
      note: 'one { category, enabled: true } per entry, scoped to the account (source: bicep build, Microsoft.Insights/diagnosticSettings@2021-05-01-preview)'
  observability.metrics_enabled:
    terraform_avm:
      attribute: diagnostic_settings.workspace.metric_categories
      values: { true: { expr: '["AllMetrics"]' }, false: { expr: '[]' } }
    terraform:
      attribute: azurerm_monitor_diagnostic_setting.enabled_metric.category
      values: { true: AllMetrics, false: null }
      note: 'false renders no enabled_metric block (source: azurerm 5.12 schema)'
    bicep_avm:
      attribute: 'diagnosticSettings[].metricCategories'
      values: { true: { expr: "[ { category: 'AllMetrics' } ]" }, false: { expr: '[]' } }
    bicep:
      gap: "Microsoft.Insights/diagnosticSettings properties.metrics[] { category, enabled } scoped to the account is proven (bicep build, Microsoft.Insights/diagnosticSettings@2021-05-01-preview); the category is a free string in the type, so AllMetrics has no source for authored Bicep"
