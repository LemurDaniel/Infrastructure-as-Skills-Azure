# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
schema_version: 1
resource: Microsoft.ApiManagement/service

modules:
  terraform: [Azure/avm-res-apimanagement-service/azurerm]
  bicep: [avm/res/api-management/service]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the instance
  placement.location:
    terraform_avm: { attribute: location, passthrough: true }
    terraform: { attribute: location, passthrough: true }
    bicep_avm: { attribute: location, passthrough: true }
    bicep: { attribute: location, passthrough: true }
  placement.resource_group_name:
    terraform_avm:
      attribute: resource_group_name
      note: a name, not an id - AzAPI-based, but it pins azurerm >= 4.0, < 5.0, so the root cannot be on 5.x
    terraform: { attribute: resource_group_name }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }

  # ------------------------------------------------------------------ service
  service.publisher_name:
    terraform_avm: { attribute: publisher_name, passthrough: true, note: 'module default is the placeholder "Apim Example Publisher"; always written' }
    terraform: { attribute: publisher_name, passthrough: true }
    bicep_avm: { attribute: publisherName, passthrough: true }
    bicep: { attribute: properties.publisherName, passthrough: true }
  service.publisher_email:
    terraform_avm: { attribute: publisher_email, passthrough: true }
    terraform: { attribute: publisher_email, passthrough: true }
    bicep_avm: { attribute: publisherEmail, passthrough: true }
    bicep: { attribute: properties.publisherEmail, passthrough: true }
  service.sku:
    terraform_avm:
      attribute: sku_name
      format: '{value}_{service.capacity}'
      note: one string with the capacity (StandardV2_1, Consumption_0); module default Developer_1 - written
    terraform: { attribute: sku_name, format: '{value}_{service.capacity}' }
    bicep_avm: { attribute: sku, passthrough: true, note: module default Premium - written }
    bicep: { attribute: sku.name, passthrough: true }
  service.capacity:
    terraform_avm: { attribute: sku_name, part_of: service.sku, note: 'the suffix of "<Tier>_<capacity>"' }
    terraform: { attribute: sku_name, part_of: service.sku, note: 'the suffix of "<Tier>_<capacity>"' }
    bicep_avm: { attribute: skuCapacity, passthrough: true, note: module default 3 - written }
    bicep: { attribute: sku.capacity, passthrough: true }
  service.zone_redundant:
    terraform_avm:
      attribute: zones
      values: { true: { expr: '["1", "2", "3"]' }, false: { expr: 'null' } }
      note: Premium/PremiumV2 only; capacity a multiple of the zones
    terraform:
      attribute: zones
      values: { true: { expr: '["1", "2", "3"]' }, false: null }
      note: the literals the module row states for the same list; Premium/PremiumV2 only
    bicep_avm:
      attribute: availabilityZones
      values: { true: { expr: '[1, 2, 3]' }, false: { expr: '[]' } }
      note: Premium/PremiumV2 only
    bicep:
      gap: zones (top level, beside properties) - the reference states no literal for the authored property
  service.additional_regions:
    terraform_avm: { attribute: additional_location, note: '[{ location, capacity, zones, ... }]; Premium only' }
    terraform:
      gap: the authored table names no argument; additional_location is only the renders field's spelling
    bicep_avm: { attribute: additionalLocations, note: Premium only }
    bicep: { gap: the authored table names no property; the renders field names only the module parameter }
  service.managed_identity:
    terraform_avm:
      attribute: managed_identities
      values:
        system_assigned: { expr: '{ system_assigned = true }' }
        user_assigned: { expr: '{ user_assigned_resource_ids = {service.user_assigned_identity_ids} }' }
        none: { expr: '{}' }
    terraform:
      gap: .identity { type, identity_ids } - the reference states no type literal; none renders no identity block
    bicep_avm:
      attribute: managedIdentities
      values:
        system_assigned: { expr: '{ systemAssigned: true }' }
        user_assigned: { expr: '{ userAssignedResourceIds: {service.user_assigned_identity_ids} }' }
        none: { expr: '{}' }
    bicep:
      gap: identity (top level) - the reference names it without its members or type literals; none renders no identity
  service.user_assigned_identity_ids:
    terraform_avm: { attribute: managed_identities.user_assigned_resource_ids }
    terraform: { attribute: identity.identity_ids }
    bicep_avm: { attribute: managedIdentities.userAssignedResourceIds }
    bicep:
      gap: identity.userAssignedIdentities is an object keyed by id; the reference names identity without its members

  # ------------------------------------------------------------------- access
  access.caller_authentication:
    terraform_avm:
      gap: >-
        policy.xml_content (local.apim_global_policy) - entra_id renders the validate-jwt element of
        terraform.md (openid-config of the tenant, the audience an open entry); subscription_key,
        entra_id_and_key and open are not spelled in the reference
    terraform:
      gap: the same global policy XML on the authored azurerm_api_management_policy; the reference names the resource, not its argument, and spells only entra_id
    bicep_avm:
      gap: >-
        "policies[] = { name: 'policy', format: 'rawxml', value }" - the same XML as the Terraform
        reference (loadTextContent, tenant and audience substituted); only entra_id is spelled
    bicep:
      gap: the same XML on the child policies/policy; the reference names the child, not its property, and spells only entra_id
  access.rate_limit_calls_per_minute:
    terraform_avm:
      attribute: policy.xml_content
      format: '<rate-limit-by-key calls="{value}" renewal-period="60" counter-key="@(context.Request.IpAddress)" />'
      note: one element inside <inbound> of the global policy (local.apim_global_policy), never the whole value
    terraform:
      gap: the rate-limit-by-key element in the global policy XML of the authored azurerm_api_management_policy; the reference names the resource, not its argument
    bicep_avm:
      attribute: "policies[].value (name: 'policy', format: 'rawxml')"
      format: '<rate-limit-by-key calls="{value}" renewal-period="60" counter-key="@(context.Request.IpAddress)" />'
      note: one element inside <inbound> of the same XML as the Terraform reference, never the whole value
    bicep:
      gap: the rate-limit-by-key element in the XML of the child policies/policy; the reference names the child, not its property
  access.developer_portal:
    terraform_avm:
      gap: no module input switches the portal - sign_in, sign_up and delegation configure it; not-testable
    terraform:
      gap: the authored table names no portal argument; sign_in, sign_up, delegation are only the renders field's spelling
    bicep_avm: { attribute: enableDeveloperPortal, passthrough: true, note: module default false; written }
    bicep: { gap: the authored table names no property; the renders field names only the module's enableDeveloperPortal }
  access.apis:
    terraform_avm: { attribute: apis, note: 'with api_version_sets, backends, named_values; the names and the backend only' }
    terraform:
      gap: one authored azurerm_api_management_api per entry; the reference names the resource, not its arguments
    bicep_avm: { attribute: apis, note: 'with apiVersionSets, backends, namedValues; the names and the backend only' }
    bicep:
      gap: a child apis per entry; the reference names the child, not its properties
  access.products:
    terraform_avm: { attribute: products, note: with subscriptions; the names only }
    terraform:
      gap: one authored azurerm_api_management_product per entry; the reference names the resource, not its arguments
    bicep_avm: { attribute: products, note: with subscriptions; the names only }
    bicep:
      gap: a child products per entry; the reference names the child, not its properties

  # --------------------------------------------------------------- networking
  networking.network_integration:
    terraform_avm:
      attribute: virtual_network_type
      values: { none: None, external: External, internal: Internal }
      note: module default None; written
    terraform:
      attribute: virtual_network_type
      values: { none: None, external: External, internal: Internal }
    bicep_avm:
      attribute: virtualNetworkType
      values: { none: None, external: External, internal: Internal }
      note: module default None; written
    bicep:
      attribute: properties.virtualNetworkType
      values: { none: None, external: External, internal: Internal }
  networking.apim_subnet:
    terraform_avm: { attribute: virtual_network_subnet_id, note: injection (classic tiers) }
    terraform: { attribute: virtual_network_configuration.subnet_id }
    bicep_avm: { attribute: subnetResourceId }
    bicep: { attribute: properties.virtualNetworkConfiguration.subnetResourceId }
  networking.public_ip_address:
    terraform_avm: { attribute: public_ip_address_id, note: Standard static IPv4; Developer and Premium in a network }
    terraform: { attribute: public_ip_address_id }
    bicep_avm: { attribute: publicIpAddressResourceId, note: Standard static IPv4; classic tiers in a network }
    bicep: { attribute: properties.publicIpAddressId }
  networking.public_network_access:
    terraform_avm:
      gap: public_network_access_enabled (a bool, management plane only; module default true - written) - disabled false, enabled true; the reference maps no enabled_with_firewall
    terraform:
      gap: .public_network_access_enabled - disabled false, enabled true; the reference maps no enabled_with_firewall
    bicep_avm:
      gap: publicNetworkAccess (unset by default; written) - disabled 'Disabled', enabled 'Enabled'; the reference maps no enabled_with_firewall
    bicep:
      gap: properties.publicNetworkAccess - disabled 'Disabled', enabled 'Enabled'; the reference maps no enabled_with_firewall
  networking.private_endpoint_subnet:
    terraform_avm:
      attribute: private_endpoints.gateway.subnet_resource_id
      note: subresource_name = "Gateway"; tiers with private endpoint support only
    terraform: { gap: the authored table names no private endpoint; the renders field names only the module input }
    bicep_avm:
      attribute: 'privateEndpoints[].subnetResourceId'
      note: "service: 'Gateway'; tiers with private endpoint support only"
    bicep: { gap: the authored table names no private endpoint; the renders field names only the module parameter }

  # ----------------------------------------------------------------- identity
  identity.role_assignments:
    terraform_avm: { attribute: 'role_assignments.<key> = { role_definition_id_or_name, principal_id, principal_type }' }
    terraform: { gap: the authored table names no role assignment; the renders field names only the module input }
    bicep_avm: { attribute: 'roleAssignments[] = { principalId, roleDefinitionIdOrName, principalType }' }
    bicep: { gap: the authored table names no role assignment; the renders field names only the module parameter }

  # ----------------------------------------------------------------- security
  security.legacy_protocols_disabled:
    terraform_avm:
      gap: >-
        security - true is { enable_frontend_ssl30 = false, enable_frontend_tls10 = false,
        enable_frontend_tls11 = false, enable_backend_ssl30 = false, enable_backend_tls10 = false,
        enable_backend_tls11 = false, tls_*_ciphers_enabled = false } (every member written, the cipher
        toggles from the README); the reference states nothing for false
    terraform:
      gap: >-
        .security { frontend_ssl30_enabled, frontend_tls10_enabled, frontend_tls11_enabled,
        backend_ssl30_enabled, backend_tls10_enabled, backend_tls11_enabled, triple_des_ciphers_enabled,
        tls_*_ciphers_enabled } - the reference names the members without their values for either answer
    bicep_avm:
      gap: >-
        customProperties - true is { 'Microsoft.WindowsAzure.ApiManagement.Gateway.Security.Protocols.Tls10':
        'False', ... } with every key written (the list is in the README); the reference states nothing for false
    bicep:
      gap: properties.customProperties - the reference names the object without its keys or values
  security.client_certificate_required:
    terraform_avm: { attribute: client_certificate_enabled, passthrough: true, note: default false; written }
    terraform: { attribute: client_certificate_enabled, passthrough: true }
    bicep_avm: { attribute: enableClientCertificate, passthrough: true, note: default false; written }
    bicep: { attribute: properties.enableClientCertificate, passthrough: true }

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm: { attribute: diagnostic_settings.workspace.workspace_resource_id }
    terraform:
      gap: authored azurerm_monitor_diagnostic_setting; the reference names the resource, not its workspace argument
    bicep_avm: { attribute: 'diagnosticSettings[].workspaceResourceId' }
    bicep: { gap: the authored table names no diagnostic setting; the renders field names only the module parameter }
  observability.diagnostic_categories:
    terraform_avm: { attribute: diagnostic_settings.workspace.log_categories, note: 'log_groups = [] beside it' }
    terraform: { attribute: azurerm_monitor_diagnostic_setting.enabled_log.category }
    bicep_avm: { attribute: 'diagnosticSettings[].logCategoriesAndGroups[].category' }
    bicep: { gap: the authored table names no diagnostic setting; the renders field names only the module parameter }
  observability.metrics_enabled:
    terraform_avm:
      attribute: diagnostic_settings.workspace.metric_categories
      values: { true: { expr: '["AllMetrics"]' }, false: { expr: '[]' } }
    terraform:
      gap: authored azurerm_monitor_diagnostic_setting; the authored table names only enabled_log - no metric block is in the reference
    bicep_avm:
      attribute: 'diagnosticSettings[].metricCategories'
      values: { true: { expr: "[ { category: 'AllMetrics' } ]" }, false: { expr: '[]' } }
    bicep: { gap: the authored table names no diagnostic setting; the renders field names only the module parameter }
