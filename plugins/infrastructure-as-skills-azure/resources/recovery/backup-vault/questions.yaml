schema_version: 1

resource: Microsoft.DataProtection/backupVaults
title: Azure Backup vault

naming:
  terraform: "Azure::Microsoft.DataProtection/backupVaults"
  bicep: "Microsoft.DataProtection/backupVaults"
  # Bicep assembles the name from vars - this is the prefix it renders. The name is 5-50 characters.
  abbreviation: "bvault"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create the Log Analytics workspace it routes diagnostics to."
  - "Does not create the resources it protects or grant the vault's identity its roles on them (`Storage Account Backup Contributor`, `Disk Backup Reader`, ...). That is wiring between resources, owned by a pattern."
  - "Does not create the Resource Guard. A guard lives in a different subscription (and ideally tenant) owned by a security team so the vault's administrators cannot approve their own deletes; the set takes its id, an `open:` entry when nobody supplied one."
  - "Does not protect virtual machines, Azure Files shares or SQL in a VM - those use the Recovery Services vault (`recovery-services-vault`). The Backup vault protects blobs, data lake storage, managed disks, PostgreSQL flexible server and AKS."
  - "Has no network surface to close: backup data moves over the Azure backbone and the vault takes no private endpoint in this set."

groups:

  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        answer: { context: environments }
        why: >
          Drives the rendered name and the strictness of several defaults below. Nothing
          sensible can be guessed.

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        answer: { context: location }
        why: >
          Part of the rendered name and not inferable. A vault is regional, and a backup
          copy is stored in the vault's region and, with geo-redundant storage, in its
          paired region - which `data_residency` constrains.

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        answer: { context: resource_group_name }
        per_environment: true
        why: >
          The vault is placed into an existing group. For `isolated` and `immutable` backups
          it is usually a group of its own with its own access, so that whoever administers
          the workload's group cannot delete the vault. The `security` group of a split
          (`deployment.resource_group_layout: split`) is the place.

  - id: vault
    title: The vault
    questions:
      - id: storage_redundancy
        ask:
          en: "How many copies of the backups are kept, and where?"
          de: "Wie viele Kopien der Sicherungen werden aufbewahrt, und wo?"
        type: enum
        plain:
          en: "The backups are kept {value}."
          de: "Die Sicherungen werden {value} aufbewahrt."
        plain_values:
          LocallyRedundant: { en: "in one datacenter, three times", de: dreifach in einem Rechenzentrum }
          ZoneRedundant: { en: in three datacenters of the region, de: in drei Rechenzentren der Region }
          GeoRedundant: { en: also in a second region, de: zusätzlich in einer zweiten Region }
        accepts: [LocallyRedundant, ZoneRedundant, GeoRedundant]
        answer:
          question: outage_impact
          map: { tolerable: LocallyRedundant, disruptive: ZoneRedundant, critical: GeoRedundant }
        non_production_default: LocallyRedundant
        forced_when: >
          `data_residency: country` forbids `GeoRedundant` where the paired region lies in
          another country, recorded as forced with `data_residency` as forced_by.
        why: >
          Derived from how bad an outage is. `LocallyRedundant` is three copies in one
          datacenter; `ZoneRedundant` survives the loss of a datacenter; `GeoRedundant` also
          copies to the paired region, which `data_residency` can forbid. **Fixed at
          creation** and per vault, not per item. Both modules default to geo-redundant,
          which is the most expensive choice and the one that moves data across a border, so
          the value is written.

      - id: cross_region_restore
        ask:
          en: "May a backup be restored in the second region if the first is lost?"
          de: "Darf eine Sicherung in der zweiten Region wiederhergestellt werden, wenn die erste verloren geht?"
        type: bool
        plain:
          en: "Restoring in the paired region is {value}."
          de: "Wiederherstellung in der Partnerregion ist {value}."
        plain_values:
          true: { en: possible, de: möglich }
          false: { en: not possible, de: nicht möglich }
        default: false
        depends_on: { question: storage_redundancy, equals: GeoRedundant }
        why: >
          Only with geo-redundant storage. It lets a restore run in the paired region while
          the primary is down - without it the geo copy exists but cannot be used until
          Microsoft declares the primary failed. Costs nothing beyond the geo-redundant
          storage, so it follows that choice.

      - id: immutability
        ask:
          en: "Can a backup be changed or deleted before it expires?"
          de: "Kann eine Sicherung vor ihrem Ablauf geändert oder gelöscht werden?"
        type: enum
        plain:
          en: "Backups are {value}."
          de: "Sicherungen sind {value}."
        plain_values:
          Disabled: { en: ordinary - an administrator can delete them, de: "gewöhnlich: ein Administrator kann sie löschen" }
          Unlocked: { en: "protected from change, but the protection can still be turned off", de: "vor Änderung geschützt, der Schutz lässt sich aber noch abschalten" }
          Locked: { en: "protected until they expire, for everyone, for good", de: bis zum Ablauf für alle endgültig geschützt }
        accepts: [Disabled, Unlocked, Locked]
        answer:
          question: backup_isolation
          map: { operational: Disabled, isolated: Unlocked, immutable: Locked }
        non_production_default: Unlocked
        why: >
          Derived from who must not be able to destroy the copies. `Disabled` leaves the
          vault ordinary. `Unlocked` makes backups immutable but the setting itself can
          still be turned off - the state to test in. `Locked` is **irreversible**: no one,
          not the vault owner, not Microsoft support, can shorten a retention or delete a
          backup before it expires, and a retention set too long is paid for until the last
          day. Locked is what a ransomware mandate asks for and is raised in production
          only, after the policy is tested.

      - id: soft_delete_retention_days
        ask:
          en: "How long can a deleted backup still be recovered?"
          de: "Wie lange kann eine gelöschte Sicherung noch wiederhergestellt werden?"
        type: int
        plain:
          en: "A deleted backup can be recovered for {value} days."
          de: "Eine gelöschte Sicherung lässt sich {value} Tage lang wiederherstellen."
        answer:
          question: data_loss_tolerance
          map: { reproducible: 14, one_week: 14, one_month: 30, three_months: 90 }
        why: >
          Soft delete of the vault's items is always on in current API versions and cannot
          be switched off; what is chosen is the window, 14 to 180 days. It protects against
          the deletion of a backup, which `data_loss_tolerance` (how far back a restore
          reaches) does not: a vault whose backups were deleted by mistake restores nothing.
          The window is paid for in storage.

      - id: multi_user_authorization
        ask:
          en: "Must a second person from another team approve deleting backups?"
          de: "Muss eine zweite Person aus einem anderen Team dem Löschen von Sicherungen zustimmen?"
        type: bool
        plain:
          en: "Deleting backups {value}."
          de: "Das Löschen von Sicherungen {value}."
        plain_values:
          true: { en: needs approval from a second team, de: braucht die Freigabe eines zweiten Teams }
          false: { en: needs no second approval, de: braucht keine zweite Freigabe }
        answer:
          question: backup_isolation
          map: { operational: false, isolated: true, immutable: true }
        non_production_default: false
        why: >
          A Resource Guard in a different subscription owned by a security team: a critical
          operation (delete a backup, shorten a retention, disable soft delete) needs an
          approval from whoever holds the guard, so a compromised administrator of the
          workload cannot erase the copies. It is what turns `isolated` from a separate
          vault into a separate *authority*. Derived from the isolation answer.

      - id: resource_guard
        ask:
          en: "Which Resource Guard protects the vault?"
          de: "Welcher Resource Guard schützt den Vault?"
        type: string
        plain:
          en: "The approving guard is {value}."
          de: "Die freigebende Schutzinstanz ist {value}."
        accepts: { ref: resource_guard }
        required: true
        depends_on: { question: multi_user_authorization, equals: true }
        per_environment: true
        why: >
          The id of the guard in the security team's subscription. The vault's identity
          needs `Reader` on it. Nobody on the workload team can create it, so it is an
          `open:` entry owned by the security team when the request did not name one.

      - id: infrastructure_encryption
        ask:
          en: "Should the backups be encrypted twice?"
          de: "Sollen die Sicherungen doppelt verschlüsselt werden?"
        type: bool
        plain:
          en: "Double encryption is {value}."
          de: "Doppelte Verschlüsselung ist {value}."
        plain_values:
          true: { en: "on", de: eingeschaltet }
          false: { en: "off", de: ausgeschaltet }
        default: true
        why: >
          A second layer of encryption with a separate platform key. The Bicep module
          defaults to on and it costs nothing visible; the guardrails want it for a store
          whose job is to outlive an attack. **Fixed at creation.** The Terraform module has
          no input and takes the platform's default.

      - id: job_failure_alerts
        ask:
          en: "Should a failed backup raise an alert?"
          de: "Soll eine fehlgeschlagene Sicherung einen Alert auslösen?"
        type: bool
        plain:
          en: "A failed backup {value}."
          de: "Eine fehlgeschlagene Sicherung {value}."
        plain_values:
          true: { en: raises an alert, de: löst eine Warnung aus }
          false: { en: is not reported, de: wird nicht gemeldet }
        default: true
        why: >
          A backup nobody knows failed is not a backup. The built-in alert fires on each job
          failure and costs nothing; turning it off is only for a vault that is not yet
          protecting anything.

  - id: protection
    title: What is protected
    questions:
      - id: protected_resources
        ask:
          en: "Which resources should the vault back up?"
          de: "Welche Ressourcen soll der Vault sichern?"
        type: list
        plain:
          en: "Backed up: {value} (empty: nothing yet)."
          de: "Gesichert werden: {value} (leer: noch nichts)."
        default: []
        why: >
          Each entry names a resource of the deployment and its kind (a storage account with
          its containers, a managed disk, a PostgreSQL flexible server, an AKS cluster). A
          vault with no instance protects nothing, which is a valid first state; the pattern
          adds each resource with its policy.

      - id: backup_schedule
        ask:
          en: "How often should a backup be taken?"
          de: "Wie oft soll eine Sicherung erstellt werden?"
        type: enum
        plain:
          en: "A backup is taken {value}."
          de: "Eine Sicherung wird {value} erstellt."
        plain_values:
          daily: { en: every day, de: täglich }
          weekly: { en: every week, de: wöchentlich }
        accepts: [daily, weekly]
        default: daily
        why: >
          The recovery point objective in the vault's terms. Daily is the default and what
          most workloads accept; weekly suits slow-changing data and halves the storage;
          blob backup is continuous underneath and this sets only the vaulted copy. A
          shorter interval is a different product (continuous backup on the resource
          itself).

      - id: retention_days
        ask:
          en: "How long must a backup be kept?"
          de: "Wie lange muss eine Sicherung aufbewahrt werden?"
        type: int
        plain:
          en: "A backup is kept for {value} days."
          de: "Eine Sicherung wird {value} Tage aufbewahrt."
        answer:
          question: data_loss_tolerance
          map: { reproducible: 7, one_week: 30, one_month: 60, three_months: 120 }
        non_production_default: 7
        why: >
          Derived from how far back a restore must reach. This is the retention of the
          backup itself, not the soft-delete window of the vault: a mistake noticed after
          the retention has passed is not recoverable from the vault. Longer retention costs
          storage per day kept, and with `Locked` immutability it cannot be shortened.

  - id: encryption
    title: Encryption
    questions:
      - id: key_management
        ask:
          en: "Platform-managed or customer-managed encryption keys?"
          de: "Schlüssel von der Plattform oder vom Kunden verwaltet?"
        type: enum
        plain:
          en: "Encryption keys are {value}."
          de: "Verschlüsselungsschlüssel sind {value}."
        plain_values:
          platform_managed: { en: "managed by Azure - encrypted, rotated, no effort on your side", de: "von Azure verwaltet: verschlüsselt, rotiert, kein Aufwand bei euch" }
          customer_managed: { en: "your own, held in your key vault, so you can revoke them", de: "eure eigenen in eurem Schlüsseltresor, damit ihr sie zurückziehen könnt" }
        accepts: [platform_managed, customer_managed]
        answer: { deployment: key_management }
        why: >
          Inherited: one answer per system. `customer_managed` points the vault at a key in
          the customer's vault and needs a user-assigned identity with wrap and unwrap on
          it. Revoking the key makes every backup in the vault unreadable, which is the
          point and the risk.

      - id: cmk_key_vault_key_id
        ask:
          en: "Which Key Vault key should encrypt the vault?"
          de: "Welcher Key-Vault-Schlüssel soll den Vault verschlüsseln?"
        type: string
        plain:
          en: "Encrypted with your key {value}."
          de: "Verschlüsselt mit eurem Schlüssel {value}."
        accepts: { ref: key_vault_key }
        required: true
        depends_on: { question: key_management, equals: customer_managed }
        per_environment: true
        why: >
          The key must exist and the vault's user-assigned identity must hold wrap and
          unwrap on it before the key is set; the key vault must have soft delete and purge
          protection.

      - id: managed_identity
        ask:
          en: "Which managed identity should the vault carry?"
          de: "Welche Managed Identity soll der Vault tragen?"
        type: enum
        plain:
          en: "The vault has {value}."
          de: "Der Tresor hat {value}."
        plain_values:
          system_assigned: { en: its own identity, de: eine eigene Identität }
          user_assigned: { en: a separately managed identity, de: eine separat verwaltete Identität }
        accepts: [system_assigned, user_assigned]
        default: system_assigned
        forced_when: >
          `key_management: customer_managed` forces `user_assigned`, recorded as forced with
          `key_management` as forced_by
        why: >
          A system-assigned identity is the vault's own and is what the protected resources
          grant their backup roles to; it exists with the vault. A customer-managed key
          needs the key role before the key is set, which is why that case is
          `user_assigned`. Without an identity the vault cannot back anything up, so `none`
          is not offered.

      - id: user_assigned_identity_id
        ask:
          en: "Which user-assigned identity does the vault carry?"
          de: "Welche separat verwaltete Identität trägt der Tresor?"
        type: string
        plain:
          en: "It uses the identity {value}."
          de: "Er nutzt die Identität {value}."
        accepts: { ref: user_assigned_identity }
        required: true
        depends_on: { question: managed_identity, equals: user_assigned }
        per_environment: true
        why: >
          `managed_identity: user_assigned` names an identity that is a resource of its own and
          must exist first - a customer-managed key forces it, because the key role is granted
          to that identity before the key is set. Without its id the vault has nothing to take.

  - id: identity
    title: Identity and access
    questions:
      - id: role_assignments
        ask:
          en: "Who needs which role on this vault?"
          de: "Wer braucht welche Rolle auf diesem Vault?"
        type: list
        plain:
          en: "Access rights on the vault granted to: {value}."
          de: "Zugriffsrechte vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Data-plane access is granted by role, never by key. The narrow roles are `Backup
          Reader` to see jobs and items, `Backup Operator` to run and restore, and `Backup
          Contributor` to manage policies; `Owner` and `Contributor` can also delete the
          vault and are not for a workload. Scope to the narrowest resource the consumer
          needs, never the subscription. A pattern normally fills this from the consumers it
          knows about and grants a consumer's role in the pattern, not here. The vault's own
          identity needs a role on each protected resource - that is wiring, owned by the
          pattern, not listed here.

  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive diagnostics?"
          de: "Welcher Log Analytics Workspace soll die Diagnosedaten erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        answer: { deployment: diagnostics_destination }
        per_environment: true
        why: >
          Inherited: one deployment, one destination. Without a diagnostic setting the
          resource keeps no record anyone can query.

      - id: diagnostic_categories
        ask:
          en: "Which log categories should be collected?"
          de: "Welche Log-Kategorien sollen erfasst werden?"
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          CoreAzureBackup: { en: "backup items, jobs and policies as a reporting table", de: "Sicherungselemente, Aufträge und Richtlinien als Berichtstabelle" }
          AddonAzureBackupJobs: { en: every backup and restore job and its result, de: jeder Sicherungs- und Wiederherstellungsauftrag und sein Ergebnis }
          AddonAzureBackupPolicy: { en: the backup policies in force, de: die geltenden Sicherungsrichtlinien }
          AddonAzureBackupProtectedInstance: { en: which resources are protected and in which state, de: welche Ressourcen geschützt sind und in welchem Zustand }
        accepts: [CoreAzureBackup, AddonAzureBackupJobs, AddonAzureBackupPolicy, AddonAzureBackupProtectedInstance]
        default: [CoreAzureBackup, AddonAzureBackupJobs, AddonAzureBackupProtectedInstance]
        why: >
          Job results are the record that a backup ran - the one thing nobody checks until a
          restore is needed - and are small. The reporting tables (`CoreAzureBackup`,
          `AddonAzureBackupProtectedInstance`) feed the Backup Center and the compliance
          view. The category names are the same across both vault types. The names are the
          platform's and are checked against `az monitor diagnostic-settings categories
          list` for the resource before a render, not remembered.

      - id: metrics_enabled
        ask:
          en: "Should all metrics be collected?"
          de: "Sollen alle Metriken erfasst werden?"
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: collected, de: erfasst }
          false: { en: not collected, de: nicht erfasst }
        default: true
        why: >
          Backup health and restore health - the failed-backup count is the number to alert
          on, because a vault that quietly stopped backing up looks the same as a healthy
          one.

