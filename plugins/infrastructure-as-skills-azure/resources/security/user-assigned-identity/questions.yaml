schema_version: 1

resource: Microsoft.ManagedIdentity/userAssignedIdentities
title: Azure user-assigned managed identity

naming:
  terraform: "Azure::Microsoft.ManagedIdentity/userAssignedIdentities"
  bicep: "Microsoft.ManagedIdentity/userAssignedIdentities"
  # Bicep assembles the name from vars - this is the prefix it renders.
  abbreviation: "id"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not assign the identity to a resource - the consumer's set takes it (`managed_identity: user_assigned`, `user_assigned_identity_ids`)."
  - "Does not grant the identity roles on the resources it will call. That is wiring between resources, owned by a pattern; `role_assignments` here is for roles granted *on the identity itself*, for example who may assign it."
  - "Does not create Entra app registrations or service principals - directory objects, not ARM resources (`azuread`, Graph). An identity that must be an application is an `open:` entry owned by the identity team."
  - "Has no diagnostic settings: the resource type emits no logs of its own."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name. One identity per stage: a shared identity across
          stages would give development the roles of production.
        renders: naming parameter `environment`, and the tag of that name where the repository uses one

      - id: location
        ask: Which Azure region?
        type: string
        plain:
          en: "Created in the Azure region {value}."
          de: "Wird in der Azure-Region {value} angelegt."
        required: true
        from_context: true
        why: >
          Part of the rendered name. The identity itself is global in effect, but it is
          a regional resource and can only be assigned to resources in the same
          subscription's tenant; the region follows the workload.
        renders: location

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        ref: resource_group
        required: true
        from_context: true
        per_environment: true
        why: >
          The identity is placed into an existing group. Its lifecycle is the point of
          using one: it must outlive the consumers, so it is usually in the workload's
          group and never in a group that is torn down with a single consumer.
        renders: resource_group_name (AVM Terraform, azurerm-based) / implicit in Bicep scope

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity
    questions:
      - id: purpose
        ask: What does this identity exist for?
        type: string
        plain:
          en: "This identity exists for {value}."
          de: "Diese Identität gibt es für {value}."
        required: true
        why: >
          A user-assigned identity is chosen over the default system-assigned one for a
          reason the guardrails name: it must outlive a resource, be shared by several,
          or hold its roles before the consumer exists. Recording which one makes the
          identity reviewable, and an identity with no stated reason is a system-assigned
          one in disguise. The text goes into the identity's tags and the decision
          document, and picks the name.
        renders: tag `purpose`, and the workload part of the rendered name

      - id: federated_credentials
        ask: Which external systems may sign in as this identity without a secret?
        type: list
        plain:
          en: "External systems trusted to act as this identity: {value} (empty: none)."
          de: "Externe Systeme, die als diese Identität handeln dürfen: {value} (leer: keine)."
        default: []
        why: >
          A federated credential trusts a token from an outside issuer - a GitHub or Azure
          DevOps pipeline, a Kubernetes cluster - for exactly one subject, so the system
          signs in with no stored secret. Each entry is issuer, **subject** and audience,
          and the subject is the security boundary: `repo:org/repo:environment:production`
          trusts one environment of one repository, `repo:org/*` trusts every one. Subjects
          are exact and never wildcards. Up to 20 per identity. The pipeline's own
          identity (`deployment.pipeline_auth: workload_identity`) is the usual entry, and
          the platform owns it when it is the platform's, not this deployment's.
        renders: federated_identity_credentials / federatedIdentityCredentials

      - id: isolation_scope
        ask: Should the identity be restricted to its own region?
        type: enum
        plain:
          en: "The identity can be used {value}."
          de: "Die Identität kann {value} genutzt werden."
        plain_values:
          None: { en: "from resources in any region", de: "von Ressourcen in jeder Region aus" }
          Regional: { en: "only from resources in its own region", de: "nur von Ressourcen in der eigenen Region aus" }
        values: [None, Regional]
        default: None
        why: >
          `Regional` restricts where the identity's data is held and where it can be
          assigned, for a mandate on data residency. Without one it only gets in the way
          of a failover to a second region, where the same identity must be assignable.
          The Terraform module accepts only `Regional` or null, so `None` renders as unset.
        renders: isolation_scope / isolationScope

      - id: role_assignments
        ask: Who may manage or assign this identity?
        type: list
        plain:
          en: "Rights on the identity itself granted to: {value}."
          de: "Rechte an der Identität selbst vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Roles granted *on* the identity - `Managed Identity Operator` is the one that lets
          a principal assign it to a resource it creates, which a pipeline deploying the
          consumer needs. Empty is a valid answer when the deploying principal owns the
          resource group. The identity's roles *on other resources* are the pattern's.
        renders: role_assignments / roleAssignments
