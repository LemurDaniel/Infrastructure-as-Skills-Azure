schema_version: 1

resource: Microsoft.KeyVault/vaults
title: Azure Key Vault

naming:
  terraform: "Azure::Microsoft.KeyVault/vaults"
  bicep: "Microsoft.KeyVault/vaults"
  # Bicep assembles the name from vars - this is the prefix it renders. The name is
  # global and limited to 24 characters, so the convention's length matters here.
  abbreviation: "kv"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create private DNS zones - shared infrastructure, owned by a pattern or the platform."
  - "Does not create the Log Analytics workspace it routes diagnostics to."
  - "Does not render a secret's value. A secret is created as a **placeholder** (`secret_placeholders`) whose real value is filled in later, outside the template; the value never goes into a template, and a deployment-time secure parameter is the only other route. Certificate issuance has its own decisions."
  - "Does not grant the vault's consumers their roles - that is wiring between resources, owned by a pattern. It records the vault's own role assignments in `role_assignments`."
  - "Does not create a Managed HSM. `key_protection: hsm` selects the Premium vault; a single-tenant HSM is a separate resource."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        answer: { context: environments }
        why: >
          Drives the rendered name and the strictness of several defaults below.
          Nothing sensible can be guessed.
        renders: naming parameter `environment`, and the tag of that name where the repository uses one

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        answer: { context: location }
        why: >
          Part of the rendered name and not inferable. A vault is regional and its
          soft-deleted state stays in the region.
        renders: location

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        answer: { context: resource_group_name }
        per_environment: true
        why: >
          The vault is placed into an existing group. Creating one here would make this
          set own a lifecycle wider than the resource it describes.
        renders: resource_group_name (AVM Terraform, azurerm-based) / implicit in Bicep scope

  # -------------------------------------------------------------------- vault
  - id: vault
    title: The vault
    questions:
      - id: sku
        ask:
          en: "Which vault tier?"
          de: "Welcher Vault-Tarif?"
        type: enum
        plain:
          en: "The vault is the {value} tier."
          de: "Der Tresor ist die Stufe {value}."
        plain_values:
          standard: { en: "standard, keys protected in software", de: "Standard, Schlüssel in Software geschützt" }
          premium: { en: "premium, which also offers hardware-protected keys", de: "Premium, die zusätzlich hardwaregeschützte Schlüssel bietet" }
        accepts: [standard, premium]
        default: standard
        why: >
          Premium exists for exactly one thing: HSM-backed keys. Without a mandate that
          names them the extra cost buys nothing, and both AVM modules default to
          **premium**, so the default here is written, not inherited. The tier can be
          raised later but a software key cannot be turned into an HSM key in place, which
          is why `key_protection` is a deployment decision taken before the first vault.
        forced_when: >
          deployment.key_protection: hsm forces `premium`, recorded as forced with
          `key_protection` as forced_by
        renders: sku_name / sku.name (`standard`, `premium`)

      - id: purge_protection
        ask:
          en: "Should deleted items be impossible to purge during their retention?"
          de: "Soll das endgültige Löschen gelöschter Elemente während ihrer Aufbewahrung unmöglich sein?"
        type: bool
        plain:
          en: "A deleted vault or secret {value} before its retention ends."
          de: "Ein gelöschter Tresor oder ein gelöschtes Geheimnis {value}, bevor die Aufbewahrungszeit endet."
        plain_values:
          true: { en: "cannot be wiped, not even by an administrator", de: "lässt sich nicht endgültig löschen, auch nicht von einem Administrator" }
          false: { en: "can be wiped for good by anyone with the right", de: "lässt sich von jedem mit dem Recht endgültig löschen" }
        default: true
        why: >
          The protection against a deletion nobody can undo - by mistake, by a compromised
          account or by a destroy run. **It cannot be switched off once on**, and
          customer-managed keys require it: a storage account whose key vault is purged is
          unreadable. The price is that a vault name stays reserved for the retention
          period after deletion, so a tear-down and re-create under the same name fails.
          Both modules default to true; written anyway.
        forced_when: >
          deployment.key_management: customer_managed forces `true`, because a key
          that can be purged takes the data it protects with it
        renders: purge_protection_enabled / enablePurgeProtection

      - id: soft_delete_retention_days
        ask:
          en: "How many days stay deleted items recoverable?"
          de: "Wie viele Tage bleiben gelöschte Elemente wiederherstellbar?"
        type: int
        plain:
          en: "Deleted vault contents can be restored for {value} days."
          de: "Gelöschte Inhalte des Tresors lassen sich {value} Tage lang wiederherstellen."
        default: 90
        why: >
          Soft delete is always on and cannot be disabled; what is chosen is how long it
          holds, 7 to 90 days, and **the value is fixed at creation**. With purge
          protection on, this is also how long the name is reserved - 90 days is the
          safest window and the cost is a name that cannot be reused for a quarter after
          a tear-down. A throwaway stage that is torn down often lowers it deliberately,
          which is a recorded departure and not a savings default: it protects against a
          mistake, it does not cost anything.
        renders: soft_delete_retention_days / softDeleteRetentionInDays

      - id: rbac_authorization
        ask:
          en: "Should access be granted by role assignments instead of access policies?"
          de: "Soll der Zugriff über Rollenzuweisungen statt über Zugriffsrichtlinien vergeben werden?"
        type: bool
        plain:
          en: "Access to the vault's contents is controlled by {value}."
          de: "Der Zugriff auf den Inhalt des Tresors wird über {value} gesteuert."
        plain_values:
          true: { en: "role assignments, like everything else in Azure", de: "Rollenzuweisungen, wie alles andere in Azure" }
          false: { en: "the vault's own access list, which sits outside the normal access model", de: "die eigene Zugriffsliste des Tresors, die außerhalb des üblichen Zugriffsmodells liegt" }
        answer: { deployment: local_auth }
        why: >
          Inherited: `local_auth: disabled` renders as `true`. Access policies are a second
          permission system per vault that cannot be scoped to one secret, is not visible
          in the role-assignment audit and grants whole permission sets. RBAC scopes down
          to a single secret or key. Both modules default to RBAC; the Terraform module
          expresses it inversely (`legacy_access_policies_enabled = false`). Departing is
          for a consumer that only speaks access policies and is named at this vault.
        renders: >
          legacy_access_policies_enabled (inverse; AVM module input) or rbac_authorization_enabled
          (azurerm) / enableRbacAuthorization

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: public_network_access
        ask:
          en: "Should this vault depart from the deployment's exposure posture?"
          de: "Soll dieser Vault von der Erreichbarkeit des Deployments abweichen?"
        type: enum
        plain:
          en: "The vault is {value}."
          de: "Der Tresor ist {value}."
        plain_values:
          disabled: { en: "not reachable from the internet at all", de: "aus dem Internet überhaupt nicht erreichbar" }
          enabled_with_firewall: { en: "reachable from the internet only from listed addresses", de: "aus dem Internet nur von gelisteten Adressen erreichbar" }
          enabled: { en: "reachable from the internet", de: "aus dem Internet erreichbar" }
        accepts: [disabled, enabled_with_firewall, enabled]
        answer: { deployment: network_exposure }
        why: >
          Asked only as a departure: exposure is a property of the system, the deployment
          set already answered it. `private` is `disabled`, `public` is
          `enabled_with_firewall`. A vault is the resource where a bare `enabled` is worst:
          it holds the secrets of everything else, and its firewall is the last control
          between the internet and them. With `disabled` it answers only through its
          private endpoint, so the deploying agent has to run inside the network - or the
          vault is created before it is closed.
        forced_when: >
          `network_ownership: none` (a public deployment without a network) forces
          `enabled`, recorded as forced with `network_ownership` as forced_by: the
          deployment's own callers have no fixed outbound address, so a firewall with no
          rule locks them out of this resource - the first dry run (2026-10-24) hit it on
          five resources at once
        renders: >
          terraform: public_network_access_enabled (bool) and network_acls (null only for
          `enabled`); bicep: publicNetworkAccess and networkAcls.defaultAction

      - id: private_endpoint_subnet
        ask:
          en: "Which subnet should this vault's private endpoint live in?"
          de: "In welchem Subnetz soll der Private Endpoint dieses Vault liegen?"
        type: string
        resolved_by: derived
        plain:
          en: "Its private connection lands in subnet {value}."
          de: "Seine private Anbindung landet im Subnetz {value}."
        accepts: { ref: subnet }
        answer: { deployment: private_endpoint_subnet }
        per_environment: true
        why: >
          One subnet carries the deployment's private endpoints, so this is inherited. The
          vault has exactly one sub-resource, `vault`, so there is no list to choose from.
        renders: private_endpoints.<key>.subnet_resource_id / privateEndpoints[].subnetResourceId

      - id: network_acl_bypass
        ask:
          en: "May trusted Azure services reach the vault past its firewall?"
          de: "Dürfen vertrauenswürdige Azure-Dienste den Vault an seiner Firewall vorbei erreichen?"
        type: enum
        plain:
          en: "Trusted Azure services {value} past the vault's firewall."
          de: "Vertrauenswürdige Azure-Dienste {value} an der Firewall des Tresors vorbei."
        plain_values:
          None: { en: "may not pass", de: "dürfen nicht" }
          AzureServices: { en: "may pass", de: "dürfen" }
        accepts: [None, AzureServices]
        default: None
        why: >
          `AzureServices` lets a short list of Microsoft's own services (storage with a
          customer-managed key, backup, disk encryption, Azure Resource Manager) reach a
          firewalled vault without a private endpoint of their own. It is the answer for a
          vault that serves a storage account's customer-managed key, and a hole nobody
          asked for otherwise - so the default is closed and `key_management:
          customer_managed` raises it, recorded as forced. It has no effect with a vault
          that is reachable only privately and only matters while a firewall is on.
        forced_when: >
          deployment.key_management: customer_managed forces `AzureServices` where a
          storage account reaches its key over the trusted-service path
        renders: network_acls.bypass / networkAcls.bypass

      - id: ip_rules
        ask:
          en: "Which public IP ranges may reach the vault?"
          de: "Welche öffentlichen IP-Bereiche dürfen den Vault erreichen?"
        type: list
        plain:
          en: "Public addresses allowed to reach the vault: {value}."
          de: "Öffentliche Adressen, die den Tresor erreichen dürfen: {value}."
        default: []
        depends_on: { question: public_network_access, equals: enabled_with_firewall }
        per_environment: true
        why: >
          An enumerated allowlist with a default action of `Deny`. An empty list denies
          every public caller, which is valid and deliberate. `0.0.0.0/0` is not an
          allowlist and is rejected by the guardrails; a single address takes `/32`.
        renders: network_acls.ip_rules / networkAcls.ipRules

  # ----------------------------------------------------------------- identity
  - id: identity
    title: Identity and access
    questions:
      - id: role_assignments
        ask:
          en: "Who needs which role on this vault?"
          de: "Wer braucht welche Rolle auf diesem Vault?"
        type: list
        plain:
          en: "Access rights on the vault granted to: {value}."
          de: "Zugriffsrechte auf den Tresor vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          With RBAC authorization nothing can read or write the vault until a role is
          assigned - not even the identity that created it - so an empty list is a working
          vault nobody can use, and not an answer: when no consumer is named, the list stays
          empty and the decision is an `open:` entry owned by the workload owner, blocking
          apply. Scope to the secret or the key where the consumer allows it, never to the
          subscription. The roles are the narrow ones - `Key Vault Secrets User`, `Key Vault
          Crypto Service Encryption User`, `Key Vault Secrets Officer` for a writer - and
          `Key Vault Administrator` is a departure that names a person. A pattern normally
          fills this from the consumers it knows about, and grants a consumer's role in the
          pattern, not here.
        renders: role_assignments / roleAssignments

  # ----------------------------------------------------------------- security
  - id: security
    title: Security
    questions:
      - id: enabled_for_services
        ask:
          en: "Which Azure services may fetch secrets or certificates from this vault on their own?"
          de: "Welche Azure-Dienste dürfen Secrets oder Zertifikate selbstständig aus diesem Vault abrufen?"
        type: list
        plain:
          en: "Platform services allowed to read from the vault: {value} (empty: none)."
          de: "Plattformdienste, die aus dem Tresor lesen dürfen: {value} (leer: keine)."
        plain_values:
          vm_deployment: { en: "virtual machines at deployment", de: "virtuelle Maschinen beim Ausrollen" }
          disk_encryption: { en: "disk encryption", de: "Festplattenverschlüsselung" }
          template_deployment: { en: "template deployments", de: "Template-Deployments" }
        accepts: [vm_deployment, disk_encryption, template_deployment]
        default: []
        why: >
          Three legacy switches that let a platform service read the vault without an
          identity of its own. Each is an access path outside RBAC and none is needed by a
          workload that uses managed identity. **The Bicep module defaults
          `enableVaultForDeployment` to true**, the Terraform module to false - one of the
          clearest cases of a module default that is not the guardrail's, which is why
          all three are written explicitly. Raised only for a consumer that genuinely needs
          one, named at this vault.
        renders: >
          enabled_for_deployment, enabled_for_disk_encryption, enabled_for_template_deployment /
          enableVaultForDeployment, enableVaultForDiskEncryption, enableVaultForTemplateDeployment

      - id: secret_placeholders
        ask:
          en: "Which secrets should exist in the vault, to be filled in later?"
          de: "Welche Secrets soll es im Vault geben, um sie später zu befüllen?"
        type: list
        plain:
          en: "Empty slots are created for the secrets {value}; their values are entered afterwards by hand or by the workload."
          de: "Für die Geheimnisse {value} werden leere Plätze angelegt; die Werte werden danach von Hand oder von der Anwendung eingetragen."
        default: []
        why: >
          A consumer that reads `@Microsoft.KeyVault(...)` needs the secret to exist before
          its first start, and nobody wants the value in code. So the secret is created with
          a dummy value and the real one is written afterwards. **The placeholder must not
          overwrite the real value on the next deployment**, and neither AVM module
          prevents it: the Terraform module has no `ignore_changes` on the value, and a
          Bicep redeploy writes a new version holding the placeholder. The render therefore
          creates placeholders outside the module in Terraform (`azurerm_key_vault_secret`
          with `lifecycle { ignore_changes = [value] }`) and, in Bicep, only when the secret
          does not exist yet (a `secretExists`-style parameter, set by the pipeline).
          Names only, never values. The writer needs `Key Vault Secrets Officer`, which
          belongs in `role_assignments`.
        renders: >
          terraform: azurerm_key_vault_secret.value placeholder + ignore_changes;
          bicep: Microsoft.KeyVault/vaults/secrets, conditional on the secret not existing

  # --------------------------------------------------------------------- keys
  - id: keys
    title: Customer-managed keys
    questions:
      - id: key_management
        ask:
          en: "Does this vault hold keys that encrypt other resources?"
          de: "Hält dieser Vault Schlüssel, die andere Ressourcen verschlüsseln?"
        type: enum
        plain:
          en: "Encryption keys are {value}."
          de: "Verschlüsselungsschlüssel sind {value}."
        plain_values:
          platform_managed: { en: "managed by Azure - the vault holds none for encryption", de: "von Azure verwaltet - der Tresor hält dafür keine" }
          customer_managed: { en: "your own, held in this vault, so you can revoke them", de: "eure eigenen in diesem Tresor, damit ihr sie zurückziehen könnt" }
        accepts: [platform_managed, customer_managed]
        answer: { deployment: key_management }
        why: >
          Inherited: one answer per system. `customer_managed` is what makes the vault a
          dependency of the others, and pulls in purge protection, the trusted-service
          bypass and the key questions below.
        renders: whether the keys below are rendered at all

      - id: customer_managed_keys
        ask:
          en: "Which keys should the vault hold for customer-managed encryption?"
          de: "Welche Schlüssel soll der Vault für die kundenseitig verwaltete Verschlüsselung halten?"
        type: list
        plain:
          en: "The vault holds the encryption keys {value}."
          de: "Der Tresor hält die Verschlüsselungsschlüssel {value}."
        required: true
        depends_on: { question: key_management, equals: customer_managed }
        why: >
          One key per consumer, named after it - sharing a key makes revoking one consumer
          revoke the others. The consumer's identity needs wrap and unwrap on the key
          before the consumer exists, which is why the identity is user-assigned and its
          role is granted first. Not asked when the deployment uses platform-managed keys.
        renders: keys / keys[]

      - id: key_type
        ask:
          en: "Which key type?"
          de: "Welcher Schlüsseltyp?"
        type: enum
        plain:
          en: "The keys are {value}."
          de: "Die Schlüssel sind {value}."
        plain_values:
          RSA: { en: "software-protected RSA keys", de: "softwaregeschützte RSA-Schlüssel" }
          RSA-HSM: { en: "RSA keys protected by hardware security modules", de: "RSA-Schlüssel, geschützt durch Hardware-Sicherheitsmodule" }
        accepts: [RSA, RSA-HSM]
        default: RSA
        depends_on: { question: key_management, equals: customer_managed }
        why: >
          RSA is what storage and most encryption-at-rest integrations wrap with.
          `RSA-HSM` needs a Premium vault, which `deployment.key_protection: hsm` forces,
          so the type follows from that answer and is not an independent choice.
        forced_when: >
          deployment.key_protection: hsm forces `RSA-HSM` and, through `sku`, `premium`
        renders: keys.<key>.key_type / keys[].kty

      - id: key_size
        ask:
          en: "How large should the keys be?"
          de: "Wie groß sollen die Schlüssel sein?"
        type: enum
        plain:
          en: "The keys are {value} bits long."
          de: "Die Schlüssel sind {value} Bit lang."
        accepts: [2048, 3072, 4096]
        default: 3072
        depends_on: { question: key_management, equals: customer_managed }
        why: >
          2048 is the minimum Azure accepts for wrapping; 3072 is the current floor
          recommended for keys that live for years and costs nothing noticeable; 4096
          slows every wrap operation for no gain a consumer asks for. Fixed at creation -
          a larger key is a rotation to a new key, not an edit.
        renders: keys.<key>.key_size / keys[].keySize

      - id: key_rotation_days
        ask:
          en: "After how many days should a key rotate itself?"
          de: "Nach wie vielen Tagen soll sich ein Schlüssel selbst rotieren?"
        type: int
        plain:
          en: "Keys are replaced automatically every {value} days."
          de: "Schlüssel werden automatisch alle {value} Tage erneuert."
        default: 90
        depends_on: { question: key_management, equals: customer_managed }
        why: >
          Customer-managed keys come with a rotation story, or the answer is incomplete
          (guardrails, section 4). A rotation policy that creates a new version after the
          interval means no key lives past it, and consumers that follow the key's latest
          version pick the new one up without a change. A consumer pinned to a version
          needs a note, because that is the one that breaks.
        renders: keys.<key>.rotation_policy.automatic.time_after_creation / keys[].rotationPolicy.lifetimeActions

      - id: key_expiry_days
        ask:
          en: "After how many days does a key expire?"
          de: "Nach wie vielen Tagen läuft ein Schlüssel ab?"
        type: int
        plain:
          en: "A key version expires after {value} days."
          de: "Eine Schlüsselversion läuft nach {value} Tagen ab."
        default: 365
        depends_on: { question: key_management, equals: customer_managed }
        why: >
          The backstop for a rotation that silently stopped: a key version that never
          expires is one nobody notices. Longer than the rotation interval by a wide margin
          so a rotation has time to fail and be noticed before the old version dies.
        renders: keys.<key>.rotation_policy.expire_after / keys[].rotationPolicy.attributes.expiryTime

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive diagnostics?"
          de: "Welcher Log Analytics Workspace soll die Diagnosedaten erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        answer: { deployment: diagnostics_destination }
        per_environment: true
        why: >
          Inherited: one deployment, one destination. For a vault the audit log is the
          record of who read which secret, which is the reason to have a vault at all;
          without a diagnostic setting there is none.
        renders: diagnostic_settings / diagnosticSettings

      - id: diagnostic_categories
        ask:
          en: "Which log categories should be collected?"
          de: "Welche Log-Kategorien sollen erfasst werden?"
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          AuditEvent: { en: "every read, write and failed access to the vault", de: "jeder Lese-, Schreib- und fehlgeschlagene Zugriff auf den Tresor" }
          AzurePolicyEvaluationDetails: { en: "how policies judged the vault", de: "wie Richtlinien den Tresor bewertet haben" }
        accepts: [AuditEvent, AzurePolicyEvaluationDetails]
        default: [AuditEvent, AzurePolicyEvaluationDetails]
        why: >
          Audit logs are the guardrail's baseline and for a vault they are the whole point.
          Both categories are cheap: the volume is the vault's request count, and a vault
          is read at startup and on rotation, not per user request. The names are the
          platform's and are checked against the resource's supported categories before a
          render, not remembered.
        renders: diagnostic_settings.<key>.logs[].category / diagnosticSettings[].logCategoriesAndGroups[].category

      - id: metrics_enabled
        ask:
          en: "Should all metrics be collected?"
          de: "Sollen alle Metriken erfasst werden?"
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: "collected", de: "erfasst" }
          false: { en: "not collected", de: "nicht erfasst" }
        default: true
        why: >
          Request count, latency and the throttling counter - the last is how a hot loop
          against a vault shows up, because a vault throttles at a fixed request rate.
        renders: metrics[].category = "AllMetrics" / metricCategories[].category
