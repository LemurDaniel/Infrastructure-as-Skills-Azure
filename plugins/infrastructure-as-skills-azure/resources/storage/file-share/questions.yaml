schema_version: 1

resource: Microsoft.Storage/storageAccounts/fileServices/shares
title: Azure Files share

naming:
  terraform: "Azure::Microsoft.Storage/storageAccounts/fileServices/shares"
  bicep: "Microsoft.Storage/storageAccounts/fileServices/shares"
  # Bicep assembles the name from vars - this is the prefix it renders. Share names are 3-63 characters, lowercase letters, digits and single hyphens.
  abbreviation: "share"

boundaries:
  - "Does not create the storage account. It is a child of one (`storage-account`), which must be of a kind that offers Azure Files (a general-purpose v2 account, or a FileStorage account for Premium shares)."
  - "Does not configure identity-based SMB authentication on the account (Entra Kerberos, AD DS). Whether a client can mount the share at all with shared keys off is an account decision; see the notes."
  - "Does not decide soft delete or backup of the share: share soft delete is a property of the account's file service and share backup is the Recovery Services vault's (`recovery-services-vault`)."
  - "Does not render the mount on a machine or a container app. Mounting is the consumer's wiring."
  - "Does not render stored access policies or SAS."

groups:

  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        answer: { context: environments }
        why: >
          Drives the strictness of several defaults below. Nothing sensible can be guessed.
        renders: tag of the environment where the repository uses one

      - id: storage_account
        ask:
          en: "In which storage account should it live?"
          de: "In welchem Speicherkonto soll es liegen?"
        type: string
        plain:
          en: "It is created in the storage account {value}."
          de: "Es wird im Speicherkonto {value} angelegt."
        accepts: { ref: storage_account }
        required: true
        per_environment: true
        why: >
          A child cannot soften what its account decided: network posture, shared-key
          authentication and public access are the account's. The account is resolved first,
          in `storage-account`, and this set only names the objects inside it. Looked up
          from the deployment when the account is created in the same run.
        renders: storage account id / parent of the child resource

  - id: shares
    title: The shares
    questions:
      - id: share_names
        ask:
          en: "Which file shares should the account hold?"
          de: "Welche Dateifreigaben soll das Konto enthalten?"
        type: list
        resolved_by: interview
        topic: data
        plain:
          en: "File shares: {value}."
          de: "Dateifreigaben: {value}."
        required: true
        why: >
          A share is the unit that carries a size limit, a tier, a protocol and role
          assignments, so a share per audience or per workload keeps the quotas honest. The
          names are the workload's own and part of its contract with the machines that mount
          them. At least one.
        renders: shares / fileServices.shares

      - id: protocol
        ask:
          en: "Which protocol do the machines that use the share speak?"
          de: "Welches Protokoll sprechen die Maschinen, die die Freigabe nutzen?"
        type: enum
        plain:
          en: "The share is reached over {value}."
          de: "Auf die Freigabe wird über {value} zugegriffen."
        plain_values:
          SMB: { en: "SMB, the usual file-share protocol", de: "SMB, dem üblichen Protokoll für Dateifreigaben" }
          NFS: { en: "NFS, for Linux machines that need file permissions", de: "NFS, für Linux-Rechner mit Dateiberechtigungen" }
        accepts: [SMB, NFS]
        default: SMB
        forced_when: >
          `NFS` forces a Premium FileStorage account and `public_network_access: disabled`
          on the account, recorded as forced with `protocol` as forced_by
        why: >
          `SMB` is the Windows protocol and works from Linux too; it is what almost
          everything uses. `NFS` is for Linux workloads that need POSIX permissions, needs a
          Premium FileStorage account, a virtual network (no public endpoint, no identity-
          based authentication) and cannot be changed afterwards. **Fixed at creation.**
        renders: shares.<k>.enabled_protocol / fileServices.shares[].enabledProtocols

      - id: quota_gb
        ask:
          en: "How large may the share grow?"
          de: "Wie groß darf die Freigabe werden?"
        type: int
        plain:
          en: "The share holds at most {value} GB."
          de: "Die Freigabe fasst höchstens {value} GB."
        default: 100
        why: >
          A cap on the share, 1 to 5,120 GB (100 TiB with large file shares enabled on the
          account). On a Standard share it is a limit and the bill follows use; on a Premium
          share it is the **provisioned** size and is billed whether filled or not. 100 GB
          is a start for a small team share; the cap is a safety valve against a runaway
          writer, not a plan.
        renders: shares.<k>.quota / fileServices.shares[].shareQuota

      - id: access_tier
        ask:
          en: "How is the share used?"
          de: "Wie wird die Freigabe genutzt?"
        type: enum
        plain:
          en: "The share is tuned for {value}."
          de: "Die Freigabe ist ausgelegt für {value}."
        plain_values:
          TransactionOptimized: { en: a busy share with many small operations, de: eine stark genutzte Freigabe mit vielen kleinen Vorgängen }
          Hot: { en: everyday file sharing, de: alltägliches Teilen von Dateien }
          Cool: { en: data that is read now and then, de: "Daten, die nur gelegentlich gelesen werden" }
          Premium: { en: fast SSD storage billed for its full size, de: "schneller SSD-Speicher, der für die volle Größe berechnet wird" }
        accepts: [TransactionOptimized, Hot, Cool, Premium]
        answer:
          question: data_access_pattern
          map: { active: TransactionOptimized, occasional: Cool, archive: Cool }
        forced_when: >
          a `FileStorage` account kind forces `Premium`, recorded as forced with the
          account's `kind` as forced_by
        why: >
          Derived from how the data is used. `TransactionOptimized` suits busy shares with
          many small operations and is the Standard default; `Hot` suits general file
          sharing; `Cool` suits data read now and then, with cheaper storage and dearer
          operations. `Premium` is SSD on a FileStorage account and is **forced** by that
          account kind, not chosen. The tier can be changed later; the moves cost
          operations.
        renders: shares.<k>.access_tier / fileServices.shares[].accessTier

      - id: root_squash
        ask:
          en: "Should the root user of a client be mapped to an unprivileged user?"
          de: "Soll der Root-Benutzer eines Clients auf einen Benutzer ohne Rechte abgebildet werden?"
        type: enum
        plain:
          en: "On an NFS share, root is {value}."
          de: "Auf einer NFS-Freigabe wird Root {value}."
        plain_values:
          RootSquash: { en: mapped to an unprivileged user, de: auf einen unprivilegierten Benutzer abgebildet }
          AllSquash: { en: every user mapped to an unprivileged one, de: jeder Benutzer auf einen unprivilegierten abgebildet }
          NoRootSquash: { en: trusted as on the client, de: wie auf dem Client vertraut }
        accepts: [RootSquash, AllSquash, NoRootSquash]
        default: RootSquash
        depends_on: { question: protocol, equals: NFS }
        why: >
          NFS only. `RootSquash` maps the client's root to an anonymous user, so a
          compromised client cannot act as root on the share; `AllSquash` maps every user;
          `NoRootSquash` trusts the client. RootSquash is the answer unless an application
          needs to chown files as root, named at this share.
        renders: shares.<k>.root_squash / fileServices.shares[].rootSquash

  - id: identity
    title: Identity and access
    questions:
      - id: role_assignments
        ask:
          en: "Who needs which role on this share?"
          de: "Wer braucht welche Rolle auf dieser Freigabe?"
        type: list
        plain:
          en: "Access rights on the share granted to: {value}."
          de: "Zugriffsrechte vergeben an: {value}."
        default: []
        per_environment: true
        why: >
          Data-plane access is granted by role, never by key. The narrow roles are `Storage
          File Data SMB Share Reader` to read, `Storage File Data SMB Share Contributor` to
          read and write, `Storage File Data SMB Share Elevated Contributor` to also change
          permissions. They apply to SMB with identity-based authentication; an NFS share
          has no role-based access. Scope to the narrowest resource the consumer needs,
          never the subscription. A pattern normally fills this from the consumers it knows
          about and grants a consumer's role in the pattern, not here. A role on the
          *container*, share or queue is scoped narrower than one on the account; the
          account-level roles belong to the storage set.
        renders: role_assignments / roleAssignments

