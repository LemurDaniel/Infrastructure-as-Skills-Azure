schema_version: 1

resource: Microsoft.Network/privateDnsZones
title: Azure Private DNS Zone

naming:
  terraform: "Azure::Microsoft.Network/privateDnsZones"
  bicep: "Microsoft.Network/privateDnsZones"
  # The zone's name IS the zone (privatelink.blob.core.windows.net, corp.example.internal), so
  # no generated name is used for it. The abbreviation prefixes the names of its network links.
  abbreviation: "pdnsz"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Is reached for `deployment.private_dns_ownership: deployment` (a standalone deployment that owns its zones) and for an internal domain of the customer's own. Under `platform` the privatelink zones are the hub's: they are referenced by the endpoints, never created here, because two deployments each creating `privatelink.blob.core.windows.net` is a conflict that surfaces at apply time."
  - "Does not decide which zones exist. Which zone belongs to which private endpoint is fixed by Azure and listed in `private-dns-zones.md`; every resource with an endpoint adds its row to `wiring.private_dns_zones`, and this set renders that list once."
  - "Does not write the records of private endpoints. Those belong to the endpoint's DNS zone group or to the platform's policy (`deployment.private_dns_records`); a record written here as well is a second owner and a plan that never stops drifting."
  - "Record sets are a boundary, not a feature: only static records of an `internal_domain` zone are rendered (`static_records`), and only the common types. A zone used as a real corporate namespace - split-horizon, forwarding rules, many records - is the DNS owner's, with a DNS Private Resolver this plugin does not model."
  - "Does not create the virtual network it links to, nor peerings. A link names a network by reference; a network in another subscription needs the identity to hold `Private DNS Zone Contributor` on the zone and `Network Contributor`-level join rights on the network."
  - "Does not create a DNS Private Resolver, forwarding rulesets or conditional forwarders. Resolving a zone from on-premises needs one; it is the platform's."
  - "Does not carry diagnostics or a resource lock: a zone has metrics only and the modules expose no diagnostic setting for it; `deployment.resource_lock` does not list it."
  - "Does not carry role assignments. The identity that writes records (the policy's managed identity, a pipeline) holds `Private DNS Zone Contributor` from the platform."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask: Which stages is this deployed to?
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        values: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          A zone is created once per stage that owns its resolution. Two stages sharing a
          zone share its records, so a development endpoint overwrites the production
          name - which is why each stage's network links its own zone.
        renders: the stage the zone is rendered in; naming parameter `environment` for the link names

      - id: resource_group_name
        ask: Which resource group?
        type: ref
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        ref: resource_group
        required: true
        from_context: true
        per_environment: true
        why: >
          A zone is a global resource and has no region; it still sits in a group. Usually
          the network's, so the people who own the network own what resolves in it - or a
          dedicated DNS group when several workloads share the zones.
        renders: parent_id (AVM Terraform, AzAPI) / implicit in Bicep scope; location is always `global`

  # --------------------------------------------------------------------- zone
  - id: zone
    title: Zone
    questions:
      - id: ownership
        ask: Who owns the private DNS zones?
        type: enum
        resolved_by: platform
        plain:
          en: "Name resolution for private connections is handled by {value}."
          de: "Die Namensauflösung für private Anbindungen übernimmt {value}."
        plain_values:
          platform: { en: "the company platform", de: "die Firmenplattform" }
          deployment: { en: "this deployment itself", de: "dieses Ausrollen selbst" }
        values: [platform, deployment]
        from_deployment: private_dns_ownership
        why: >
          Inherited: one answer per deployment. `platform` renders nothing for the privatelink
          zones - they are referenced - and only an `internal_domain` zone of this deployment
          is created. `deployment` creates every zone in the spec's list.
        renders: whether the privatelink zones are created here or only referenced

      - id: zone_kind
        ask: Is this a privatelink zone for endpoints, or a domain of its own?
        type: enum
        plain:
          en: "The zone is {value}."
          de: "Die Zone ist {value}."
        plain_values:
          privatelink: { en: "one of Azure's fixed names for private connections", de: "einer von Azures festen Namen für private Anbindungen" }
          internal_domain: { en: "an internal domain of the company, resolvable only inside its networks", de: "eine interne Domäne des Unternehmens, nur in seinen Netzen auflösbar" }
        values: [privatelink, internal_domain]
        default: privatelink
        why: >
          The two behave differently. A privatelink zone is filled by endpoints and never
          edited, may not auto-register machines and wants the NXDOMAIN fallback below; an
          internal domain is the customer's own namespace, holds static records or registered
          machines and has no fallback. Mixing them in one zone is how a machine record
          ends up beside an endpoint record.
        renders: which of the questions below are reached

      - id: zone_names
        ask: Which zones should be created?
        type: list
        plain:
          en: "Zones: {value}."
          de: "Zonen: {value}."
        required: true
        why: >
          For `privatelink` the names come from `wiring.private_dns_zones` - the rows of
          `private-dns-zones.md` for the resources in the spec, nothing the customer types and
          nothing remembered, because the public cloud's names differ from the sovereign
          clouds' and a few carry a region (`privatelink.<region>.azurecontainerapps.io`). For
          `internal_domain` it is the customer's domain, which cannot be guessed. A zone is
          named after its domain: it cannot be renamed, only recreated.
        renders: domain_name / name (one module call per zone)

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: vnet_links
        ask: Which networks should resolve names in the zone?
        type: list
        plain:
          en: "The zone can be resolved from the networks {value}."
          de: "Die Zone lässt sich aus den Netzen {value} auflösen."
        required: true
        per_environment: true
        why: >
          A zone resolves nothing until a link ties it to a network, and a link is per
          network: the network that holds the endpoints, and every spoke or hub that has to
          reach them by name. A network not listed gets the public address of a resource
          that has an endpoint - the traffic works and leaves the private path unnoticed,
          the worst way for this to fail. In a hub-and-spoke platform the DNS resolver in the
          hub is linked and the spokes forward to it; then only the hub is listed.
        renders: virtual_network_links / virtualNetworkLinks

      - id: auto_registration
        ask: Should machines register their names in the zone by themselves?
        type: bool
        plain:
          en: "Machines register their own names in the zone: {value}."
          de: "Maschinen tragen ihre Namen selbst in die Zone ein: {value}."
        plain_values:
          true: { en: "yes", de: "ja" }
          false: { en: "no", de: "nein" }
        default: false
        depends_on: { question: zone_kind, equals: internal_domain }
        why: >
          Off. Auto-registration writes an A record for every VM in the linked network and
          deletes it with the VM; it is allowed for one zone per network, which then cannot be
          used for anything else, and only for virtual machines - not for endpoints, App
          Service or containers. Where it is wanted, exactly one link per network carries it.
          A privatelink zone never registers: the question is not reached.
        renders: virtual_network_links.<k>.registration_enabled / virtualNetworkLinks[].registrationEnabled

      - id: resolution_policy
        ask: What should happen when the zone has no record for a name?
        type: enum
        plain:
          en: "A name the zone does not know is {value}."
          de: "Ein Name, den die Zone nicht kennt, wird {value}."
        plain_values:
          Default: { en: "reported as not existing", de: "als nicht vorhanden gemeldet" }
          NxDomainRedirect: { en: "looked up in public DNS instead", de: "stattdessen im öffentlichen DNS gesucht" }
        values: [Default, NxDomainRedirect]
        default: Default
        depends_on: { question: zone_kind, equals: privatelink }
        why: >
          With a privatelink zone linked, every name of that service in the network is looked
          up in the zone only: a resource of the same type that has no endpoint - another
          team's, a SaaS account - stops resolving (NXDOMAIN). `NxDomainRedirect` falls back
          to public DNS for exactly those names, which fixes the symptom and is the right
          answer in a network that also uses services without endpoints. It is `Default`
          because a fallback to the public internet is a decision somebody makes, not a
          setting that should appear unnoticed on every zone.
        renders: virtual_network_links.<k>.resolution_policy / virtualNetworkLinks[].resolutionPolicy

  # ------------------------------------------------------------------ records
  - id: records
    title: Records
    questions:
      - id: static_records
        ask: Which fixed names should the zone contain?
        type: list
        plain:
          en: "Fixed names in the zone: {value}."
          de: "Feste Namen in der Zone: {value}."
        default: []
        depends_on: { question: zone_kind, equals: internal_domain }
        per_environment: true
        why: >
          Each entry is a name, a type (A, AAAA, CNAME, TXT), a TTL and its values. Empty is
          the right default: records of private endpoints are the zone group's or the
          platform's, machine records are auto-registration's, and a hand-listed address
          is a line nobody updates when the host moves. Use it for the few names that are
          genuinely fixed - an appliance, an on-premises service reached over the network.
          Addresses are per stage.
        renders: a_records, cname_records, ... / a, cname, ...
