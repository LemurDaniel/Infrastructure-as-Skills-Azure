schema_version: 1

resource: Microsoft.Network/networkSecurityGroups
title: Azure Network Security Group

naming:
  terraform: "Azure::Microsoft.Network/networkSecurityGroups"
  bicep: "Microsoft.Network/networkSecurityGroups"
  # Bicep assembles the name from vars - this is the prefix it renders.
  abbreviation: "nsg"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not render the association itself. `subnets` references the subnets this group guards; the association is a property of the subnet, so the virtual-network module renders it (`on_part` in render-map.yaml). An NSG no subnet takes filters nothing."
  - "Does not create the Log Analytics workspace it routes diagnostics to."
  - "Does not create flow logs. They belong to Network Watcher and a storage account or workspace, are a separate resource with their own decisions, and have no question set yet."
  - "Does not create application security groups, route tables or a firewall. Egress control for `deny_internet` is the platform's firewall, referenced and not built."
  - "Does not model rules by service. `rules` is a list of explicit allow rules; what a given Azure service needs from its subnet (Container Apps, API Management, Bastion) is the service's documentation, and the service's own set names it."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        answer: { context: environments }
        why: >
          Drives the rendered name. One NSG per subnet role per stage: rules that differ
          between stages by accident are the finding a review looks for, and the parity rule
          says they do not differ.

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Created in the Azure region {value}."
          de: "Wird in der Azure-Region {value} angelegt."
        answer: { context: location }
        why: >
          An NSG is regional and can only be associated with subnets of its own region, which
          is the one constraint on where it goes.

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        answer: { context: resource_group_name }
        per_environment: true
        why: >
          The NSG is placed into an existing group, usually the network's, so the people who
          own the subnets own the rules that guard them.

  # --------------------------------------------------------------- networking
  - id: networking
    title: Networking
    questions:
      - id: subnets
        ask:
          en: "Which subnets does this group guard?"
          de: "Welche Subnetze schützt diese Gruppe?"
        type: list
        plain:
          en: "Subnets this group guards: {value}."
          de: "Subnetze, die diese Gruppe schützt: {value}."
        accepts: { ref: subnet }
        exclusive: true
        required: true
        why: >
          Recorded here and rendered where the subnet is: the group filters nothing until a
          subnet takes its id. A reference to a subnet of the network, the same in every stage.
          The subnets of one purpose share one group; a subnet takes one group at most.
          `GatewaySubnet` and `AzureFirewallSubnet` take none, and a private endpoint subnet
          only honours one with its network policies enabled (`notes.md`).

  # -------------------------------------------------------------------- rules
  - id: rules
    title: Rules
    questions:
      - id: subnet_purpose
        ask:
          en: "What does the subnet this group guards carry?"
          de: "Was trägt das Subnetz, das diese Gruppe schützt?"
        type: enum
        plain:
          en: "The group guards a subnet for {value}."
          de: "Die Gruppe schützt ein Subnetz für {value}."
        plain_values:
          private_endpoints: { en: "private connections to Azure services, reachable from the network on port 443", de: "private Anbindungen an Azure-Dienste, aus dem Netz über Port 443 erreichbar" }
          app_integration: { en: "the outgoing traffic of web and function apps", de: "den ausgehenden Verkehr von Web- und Function-Apps" }
          container_apps: { en: "the infrastructure of a container environment", de: "die Infrastruktur einer Container-Umgebung" }
          workload: { en: "workload machines or services", de: "Workload-Maschinen oder -Dienste" }
        accepts: [private_endpoints, app_integration, container_apps, workload]
        required: true
        why: >
          The rules follow from what is in the subnet: a subnet for private endpoints is
          entered only by traffic to port 443 of the services behind it, a subnet delegated to
          an app platform has outbound needs of its own, and a workload subnet has whatever its
          workload listens on. Every subnet the spec creates gets an NSG (guardrails, network
          exposure), so the purpose is read from what the spec puts in the subnet, never asked.
          It names the NSG (`nsg-<purpose>`), picks the baseline in `notes.md` and says which
          service's documentation to read for the platform rules. A subnet nothing in the spec
          explains is an `open:` entry owned by the engineer, because an NSG with the wrong
          role's rules either blocks the service or guards nothing.
        forced_when: >
          What references the subnet decides it, recorded as forced with that reference as
          forced_by: the network's private endpoint subnet (`private_endpoint_subnet_prefix`)
          takes `private_endpoints`; a subnet an App Service, Function App or Logic App names as
          `integration_subnet` takes `app_integration`; a Container Apps `infrastructure_subnet`
          takes `container_apps`; a subnet API Management, Application Gateway or a machine is
          placed in takes `workload`. One NSG per purpose, naming all of its subnets

      - id: default_inbound
        ask:
          en: "What should happen to inbound traffic that no rule allows?"
          de: "Was soll mit eingehendem Verkehr passieren, den keine Regel zulässt?"
        type: enum
        plain:
          en: "Inbound traffic that no rule allows is {value}."
          de: "Eingehender Verkehr, den keine Regel erlaubt, wird {value}."
        plain_values:
          deny_all: { en: "refused, including traffic from other machines in the same network", de: "abgelehnt, auch von anderen Maschinen im selben Netz" }
          azure_default: { en: "left to Azure's built-in rules, which let every machine in the network and the load balancer in", de: "den eingebauten Azure-Regeln überlassen, die alle Maschinen im Netz und den Lastverteiler hereinlassen" }
        accepts: [deny_all, azure_default]
        default: deny_all
        why: >
          Azure's built-in inbound rules at priority 65000-65500 **allow everything from the
          virtual network and from the load balancer**, so an NSG with no rules of its own is
          open to every machine that is in the network - which is lateral movement, the thing
          an NSG is for stopping. An explicit deny at the bottom of the custom range (priority
          4096) overrides them, and every legitimate flow becomes a rule someone wrote and a
          reviewer can read. Written as a rule, not left implicit, so it shows in the plan.
          `azure_default` is a departure for a subnet where that is intended and says so.

      - id: default_outbound
        ask:
          en: "What should happen to outbound traffic to the internet that no rule allows?"
          de: "Was soll mit ausgehendem Verkehr ins Internet passieren, den keine Regel zulässt?"
        type: enum
        plain:
          en: "Outbound traffic to the internet that no rule allows is {value}."
          de: "Ausgehender Verkehr ins Internet, den keine Regel erlaubt, wird {value}."
        plain_values:
          azure_default: { en: "left to Azure's built-in rules, which let it out", de: "den eingebauten Azure-Regeln überlassen, die ihn hinauslassen" }
          deny_internet: { en: "refused - nothing in the subnet reaches the internet directly", de: "abgelehnt - aus dem Subnetz geht nichts direkt ins Internet" }
        accepts: [azure_default, deny_internet]
        default: azure_default
        why: >
          Azure's built-in outbound rule allows the internet. Denying it is the right posture
          only where the traffic is *meant* to leave through a route the platform controls - a
          route table to a firewall - and the subnet's services have been told what they may
          reach: a denial before that moves the failure to the first call a service makes
          to its own control plane. So the default leaves it open and `deny_internet` is raised
          per subnet purpose, once the egress path exists; for `private_endpoints` it costs
          nothing, because nothing goes out of that subnet.
        forced_when: >
          `subnet_purpose: private_endpoints` takes `deny_internet`, recorded as forced with
          `subnet_purpose` as forced_by

      - id: rules
        ask:
          en: "Which traffic should be allowed explicitly?"
          de: "Welcher Verkehr soll ausdrücklich erlaubt werden?"
        type: list
        plain:
          en: "Traffic allowed explicitly, beyond what the subnet's purpose brings: {value}."
          de: "Ausdrücklich erlaubter Verkehr über das hinaus, was der Zweck des Subnetzes mitbringt: {value}."
        default: []
        per_environment: true
        why: >
          Each entry is a name, a **unique priority between 100 and 4096**, direction, protocol,
          source, destination and port - and **always `Allow`**: denials are the two defaults
          above, so a rule that blocks something is a reason to look at the baseline. Sources and
          destinations are prefixes, service tags (`VirtualNetwork`, `Storage`, `AzureMonitor`)
          or application security groups, never `*` with `Internet` as the source on an inbound
          rule, which the guardrails reject. An empty list is valid for a subnet that only
          answers what it started; for the service in the subnet it is usually not enough, and
          the rule set follows the baseline for `subnet_purpose`. Address ranges are per stage.

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive diagnostics?"
          de: "Welcher Log Analytics Workspace soll die Diagnosedaten erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Its logs go to {value}."
          de: "Seine Logs gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        answer: { deployment: diagnostics_destination }
        per_environment: true
        why: >
          Inherited: one deployment, one destination. The NSG's own log records rule *changes*
          and per-rule match counts, not traffic - the traffic is a flow log (a separate
          resource, not rendered here).

      - id: diagnostic_categories
        ask:
          en: "Which log categories should be collected?"
          de: "Welche Log-Kategorien sollen erfasst werden?"
        type: list
        plain:
          en: "Logged: {value}."
          de: "Geloggt wird: {value}."
        plain_values:
          NetworkSecurityGroupEvent: { en: "which rule was applied to which machine", de: "welche Regel auf welche Maschine angewendet wurde" }
          NetworkSecurityGroupRuleCounter: { en: "how often each rule matched", de: "wie oft jede Regel gegriffen hat" }
        accepts: [NetworkSecurityGroupEvent, NetworkSecurityGroupRuleCounter]
        default: [NetworkSecurityGroupEvent, NetworkSecurityGroupRuleCounter]
        why: >
          The rule counter tells which rules are dead - a rule that never matches is either
          unnecessary or wrong - and the event log says what an NSG decided about a machine.
          Both are small. The names are the platform's and are checked against `az monitor
          diagnostic-settings categories list --resource <nsg id>` before a render, not
          remembered. Changes to the rules themselves are in the Azure activity log, not here.
