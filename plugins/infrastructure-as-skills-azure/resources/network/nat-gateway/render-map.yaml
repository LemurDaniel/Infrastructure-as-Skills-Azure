# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
schema_version: 1
resource: Microsoft.Network/natGateways

modules:
  terraform: [Azure/avm-res-network-natgateway/azurerm]
  bicep: [avm/res/network/nat-gateway]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the gateway
  placement.location:
    terraform_avm: { attribute: location, passthrough: true }
    terraform: { attribute: location, passthrough: true }
    bicep_avm: { attribute: location, passthrough: true }
    bicep: { attribute: location, passthrough: true }
  placement.resource_group_name:
    terraform_avm:
      attribute: parent_id
      note: the group's id (data.azurerm_resource_group), not its name - AzAPI-only module
    terraform: { attribute: resource_group_name }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }

  # ------------------------------------------------------------------ gateway
  gateway.subnets:
    terraform_avm:
      on_part: 'subnets.{part}.nat_gateway = { id = {self} }'
      note: an input of the virtual-network module, not of this one
    terraform:
      attribute: azurerm_subnet_nat_gateway_association.subnet_id
      note: one association per subnet (for_each), nat_gateway_id the gateway's; the subnet has no argument for it - the one form
    bicep_avm:
      on_part: 'subnets[name={part}].natGatewayResourceId: {self}'
      note: a parameter of the virtual-network module, not of this one
    bicep:
      on_part: "properties.subnets[name={part}].properties.natGateway.id: {self}"
      note: the subnet takes the gateway's id
  gateway.sku:
    terraform_avm:
      attribute: sku_name
      values: { Standard: Standard, StandardV2: StandardV2 }
      note: module default StandardV2, the Bicep module's Standard - written on every call
    terraform:
      attribute: sku_name
      values: { Standard: Standard, StandardV2: StandardV2 }
    bicep_avm:
      attribute: natGatewaySku
      values: { Standard: Standard, StandardV2: StandardV2 }
      note: module default Standard, the Terraform module's StandardV2 - written on every call
    bicep:
      attribute: sku.name
      values: { Standard: Standard, StandardV2: StandardV2 }
  gateway.zone:
    terraform_avm:
      attribute: zones
      values: { none: { expr: 'null' }, '1': { expr: '["1"]' }, '2': { expr: '["2"]' }, '3': { expr: '["3"]' } }
      note: Standard only; ignored for StandardV2, which is always ["1", "2", "3"]
    terraform:
      attribute: zones
      values: { none: { expr: 'null' }, '1': { expr: '["1"]' }, '2': { expr: '["2"]' }, '3': { expr: '["3"]' } }
    bicep_avm:
      attribute: availabilityZone
      values: { none: { expr: '-1' }, '1': { expr: '1' }, '2': { expr: '2' }, '3': { expr: '3' } }
      note: required parameter; -1 for none and for StandardV2, which ignores it
    bicep:
      attribute: zones
      values: { none: { expr: '[]' }, '1': { expr: "[ '1' ]" }, '2': { expr: "[ '2' ]" }, '3': { expr: "[ '3' ]" } }
      note: strings, for Standard only
  gateway.public_ip_source:
    terraform_avm:
      attribute: public_ips
      values:
        with_gateway: { expr: '{ for i, n in data.naming_name.nat_public_ip.at_index : "ip_${i + 1}" => { name = n } }' }
        separate: null
      also:
        with_gateway: 'public_ip_configuration = { for i, n in data.naming_name.nat_public_ip.at_index : "ip_${i + 1}" => { sku = {gateway.sku}, allocation_method = "Static", zones = ["1", "2", "3"] } }'
        separate: 'public_ip_resource_ids = <ids from the public-ip-address set>'
      note: with_gateway sets both inputs with the same keys; sku equal to sku_name (module default StandardV2 for both); zones are strings here, unlike the public IP module's numbers; separate sets public_ip_resource_ids instead
    terraform:
      gap: >-
        with_gateway renders the azurerm_public_ip addresses (as in the public-ip-address set) and an
        azurerm_nat_gateway_public_ip_association each; separate renders only the associations, to
        the ids of the public-ip-address set
    bicep_avm:
      attribute: publicIPAddresses
      values:
        with_gateway: { expr: "[ for ipName in publicIpNames: { name: ipName, skuName: {gateway.sku}, publicIPAllocationMethod: 'Static', availabilityZones: [1, 2, 3] } ]" }
        separate: null
      also:
        separate: 'publicIpResourceIds: <ids from the public-ip-address set>'
      note: skuName equal to natGatewaySku; separate sets publicIpResourceIds instead
    bicep:
      gap: >-
        with_gateway renders Microsoft.Network/publicIPAddresses (as in the public-ip-address set)
        and points properties.publicIpAddresses[].id at them; separate points them at the ids of
        that set
  gateway.public_ip_count:
    terraform_avm:
      attribute: data.naming_name.nat_public_ip.index.count
      passthrough: true
      note: one name per address; public_ips and public_ip_configuration get one entry each (1 to 16), keyed ip_1, ip_2, ...
    terraform: { gap: 'the number of azurerm_public_ip and azurerm_nat_gateway_public_ip_association resources, one each per address (1 to 16)' }
    bicep_avm: { gap: 'the length of publicIpNames, the loop over publicIPAddresses - one entry per address (1 to 16)' }
    bicep: { gap: 'the number of Microsoft.Network/publicIPAddresses and properties.publicIpAddresses[] entries, one each per address' }
  gateway.public_ip_prefix_ids:
    terraform_avm: { attribute: public_ip_prefix_resource_ids, note: IPv4 only }
    terraform: { attribute: azurerm_nat_gateway_public_ip_prefix_association.public_ip_prefix_id, note: one association per prefix (for_each) }
    bicep_avm: { attribute: publicIPPrefixResourceIds, note: IPv4; the IPv6 variants are not used }
    bicep: { attribute: 'properties.publicIpPrefixes[].id' }
  gateway.idle_timeout_minutes:
    terraform_avm: { attribute: idle_timeout_in_minutes, passthrough: true, note: the gateway's; the addresses' own timeout (default 30) is not used for NAT traffic }
    terraform: { attribute: idle_timeout_in_minutes, passthrough: true }
    bicep_avm: { attribute: idleTimeoutInMinutes, passthrough: true }
    bicep: { attribute: properties.idleTimeoutInMinutes, passthrough: true }

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm:
      attribute: 'diagnostic_settings.<key>.workspace_resource_id'
      note: the object form (logs, metrics); no logs for a NAT gateway
    terraform: { attribute: azurerm_monitor_diagnostic_setting.log_analytics_workspace_id }
    bicep_avm: { gap: 'module README 2.1.1 has no diagnosticSettings parameter for the gateway; an authored Microsoft.Insights/diagnosticSettings with scope: natGateway' }
    bicep: { attribute: Microsoft.Insights/diagnosticSettings properties.workspaceId, note: 'extension resource with scope: natGateway' }
  observability.metrics_enabled:
    terraform_avm:
      attribute: 'diagnostic_settings.<key>.metrics'
      values: { true: { expr: '[{ category = "AllMetrics" }]' }, false: { expr: '[]' } }
    terraform:
      attribute: azurerm_monitor_diagnostic_setting.enabled_metric
      values: { true: { expr: '{ category = "AllMetrics" }' }, false: null }
      note: a block (azurerm 5.x); false renders no enabled_metric block
    bicep_avm: { gap: 'module README 2.1.1 has no diagnosticSettings parameter for the gateway; the authored diagnostic setting carries metrics' }
    bicep:
      attribute: Microsoft.Insights/diagnosticSettings properties.metrics
      values: { true: { expr: "[ { category: 'AllMetrics', enabled: true } ]" }, false: null }
      note: false renders no metrics entry
