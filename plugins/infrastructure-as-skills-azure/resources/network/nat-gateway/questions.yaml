schema_version: 1

resource: Microsoft.Network/natGateways
title: Azure NAT Gateway

naming:
  terraform: "Azure::Microsoft.Network/natGateways"
  bicep: "Microsoft.Network/natGateways"
  # Bicep assembles the name from vars - this is the prefix it renders.
  abbreviation: "ng"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not associate itself with a subnet. The association is a property of the subnet, which the virtual-network set carries (`nat_gateway` on a subnet); a NAT gateway nobody associates changes nothing. `subnets` records which subnets expect it."
  - "Does not make a subnet reachable from the internet. A NAT gateway is outbound only: it carries replies to what a machine started and never accepts a connection from outside, so it is compatible with `network_exposure: private`."
  - "Does not work together with a default route to a firewall. A route table with `0.0.0.0/0` to a virtual appliance (`route-table.default_route: firewall`) overrides the NAT gateway for that subnet; the NAT gateway then belongs on the firewall's own subnet, which the platform owns."
  - "Does not switch off the implicit default outbound access of a subnet (`defaultOutboundAccess` on the subnet, which Azure is retiring for new networks). A subnet that needs a stable, owned outbound address uses this resource; that property is the virtual network's and is not a decision in its set yet."
  - "Does not create public IP prefixes. A prefix the customer holds is referenced by id (`public_ip_prefix_ids`); for a single address that stays on its own, the `public-ip-address` set (`purpose: nat_gateway`) applies."
  - "Does not decide the address allowlist at the partner. The addresses are an output the handover lists; adding them to a third party's firewall is a step outside the deployment."
  - "Does not carry log categories: a NAT gateway emits metrics only. Diagnostics are metrics, and the Bicep module has no diagnostic setting for the gateway itself."
  - "Does not carry a resource lock: `deployment.resource_lock` does not list network resources."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        required: true
        from_context: true
        why: >
          Drives the rendered name. One NAT gateway per network and stage: a gateway shared
          across stages shares its addresses, and a partner's allowlist then trusts the
          development stage as much as production.
        renders: naming parameter `environment`, and the tag of that name where the repository uses one

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Created in the Azure region {value}."
          de: "Wird in der Azure-Region {value} angelegt."
        required: true
        from_context: true
        why: >
          A NAT gateway is regional and serves subnets of virtual networks in its own region
          only; another region means another gateway.
        renders: location

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        required: true
        from_context: true
        per_environment: true
        why: >
          Placed into an existing group, usually the network's, together with the addresses it
          creates.
        renders: parent_id (AVM Terraform, AzAPI) / implicit in Bicep scope

  # ------------------------------------------------------------------ gateway
  - id: gateway
    title: Gateway
    questions:
      - id: subnets
        ask:
          en: "Which subnets should send their outbound traffic through the gateway?"
          de: "Welche Subnetze sollen ihren ausgehenden Verkehr über das Gateway schicken?"
        type: list
        plain:
          en: "Subnets that go out through the gateway: {value}."
          de: "Subnetze, die über das Gateway nach außen gehen: {value}."
        required: true
        per_environment: true
        why: >
          Recorded and rendered where the subnet is: the gateway is only effective once a
          subnet takes its id. A subnet has at most one NAT gateway; one gateway serves many
          subnets of the same network. Not `GatewaySubnet`, `AzureFirewallSubnet` and
          `AzureBastionSubnet`, which do not take one, and not a subnet whose route table
          sends `0.0.0.0/0` to an appliance.
        renders: virtual-network subnets.<k>.nat_gateway.id / natGatewayResourceId

      - id: sku
        ask:
          en: "Which generation of NAT gateway should it be?"
          de: "Welche Generation von NAT Gateway soll es sein?"
        type: enum
        plain:
          en: "The NAT gateway is of the type {value}."
          de: "Das NAT-Gateway hat den Typ {value}."
        plain_values:
          Standard: { en: "Standard (held in one zone or none)", de: "Standard (in einer Zone oder keiner gehalten)" }
          StandardV2: { en: "Standard V2 (zone-redundant by design)", de: "Standard V2 (von Haus aus zonenredundant)" }
        accepts: [Standard, StandardV2]
        derived_from:
          question: outage_impact
          map: { tolerable: Standard, disruptive: StandardV2, critical: StandardV2 }
        why: >
          Standard is zonal: it sits in one zone or in none, and the loss of that zone ends
          the outbound connectivity of every subnet behind it. StandardV2 spans the zones of
          the region at the same ease of use, which is the right floor for anything whose
          outage is more than tolerable. It needs `StandardV2` addresses, is not available in
          every region, and the SKU cannot be changed in place - a gateway is recreated, and
          its addresses with it, which changes what partners have allowlisted. The
          regional availability is looked up before a render, not assumed.
        renders: sku_name / natGatewaySku

      - id: zone
        ask:
          en: "In which zone should the gateway be held?"
          de: "In welcher Zone soll das Gateway gehalten werden?"
        type: enum
        plain:
          en: "The gateway is held in zone {value}."
          de: "Das Gateway liegt in Zone {value}."
        plain_values:
          none: { en: "no fixed zone - Azure places it", de: "keine feste Zone - Azure platziert es" }
        accepts: [none, "1", "2", "3"]
        default: none
        depends_on: { question: sku, equals: Standard }
        why: >
          Only a `Standard` gateway has a zone. A fixed zone ties the outbound path to the
          machines in the same zone and to nothing else - a machine in another zone then crosses
          a zone boundary, and a failure of that zone ends the path for all of them. `none`
          is the neutral value when the subnet's machines spread across zones; a single zone
          is right only for a subnet that is itself pinned there, and then `public-ip-address.zones`
          takes the same one. A `StandardV2` gateway ignores the question.
        renders: zones / availabilityZone (-1 for none)

      - id: public_ip_source
        ask:
          en: "Should the gateway create its own public addresses?"
          de: "Soll das Gateway seine eigenen öffentlichen Adressen anlegen?"
        type: enum
        plain:
          en: "The outbound addresses are {value}."
          de: "Die Ausgangsadressen werden {value}."
        plain_values:
          with_gateway: { en: "created together with the gateway", de: "zusammen mit dem Gateway angelegt" }
          separate: { en: "taken from addresses managed on their own", de: "aus eigens verwalteten Adressen genommen" }
        accepts: [with_gateway, separate]
        default: with_gateway
        why: >
          The gateway's modules create the addresses they need - Static, in the SKU that
          matches the gateway, zone-redundant for V2, no DNS label, DDoS inherited from the
          network - which is the fewest parts and the default. `separate` takes ids from
          addresses of the `public-ip-address` set (`purpose: nat_gateway`) and is for
          addresses that must outlive the gateway: a partner has allowlisted them, and a
          recreated gateway keeps them.
        renders: public_ips + public_ip_configuration / publicIPAddresses (with_gateway), public_ip_resource_ids / publicIpResourceIds (separate)

      - id: public_ip_count
        ask:
          en: "How many outbound addresses should the gateway have?"
          de: "Wie viele ausgehende Adressen soll das Gateway haben?"
        type: int
        plain:
          en: "The gateway has {value} outbound address(es)."
          de: "Das Gateway hat {value} Ausgangsadresse(n)."
        default: 1
        depends_on: { question: public_ip_source, equals: with_gateway }
        why: >
          Each address provides about 64,000 simultaneous connections to one destination
          (SNAT ports) and the gateway holds up to 16. One is right until a SNAT-exhaustion
          metric says otherwise; adding addresses later is possible, so this is not sized
          for peak. More than one also multiplies what a partner must allowlist, which is a
          reason to ask for a prefix instead.
        renders: public_ips (one map entry per address) / publicIPAddresses (one array entry per address)

      - id: public_ip_prefix_ids
        ask:
          en: "Which public IP prefixes should the gateway use?"
          de: "Welche öffentlichen IP-Präfixe soll das Gateway verwenden?"
        type: list
        plain:
          en: "Outbound address ranges the customer holds: {value}."
          de: "Ausgangs-Adressbereiche des Kunden: {value}."
        accepts: { ref: public_ip_prefix }
        default: []
        per_environment: true
        why: >
          Empty. A prefix is one contiguous range a partner can allowlist as a single line;
          it is needed when more addresses than one must be listed, and the customer owns
          or has reserved it. Referenced, never created here.
        renders: public_ip_prefix_resource_ids / publicIPPrefixResourceIds

      - id: idle_timeout_minutes
        ask:
          en: "After how many minutes of silence should an idle connection be dropped?"
          de: "Nach wie vielen Minuten Stille soll eine Verbindung im Leerlauf getrennt werden?"
        type: int
        plain:
          en: "Connections that stay silent for {value} minutes are dropped."
          de: "Verbindungen, die {value} Minuten schweigen, werden getrennt."
        default: 4
        why: >
          Azure's floor (4 to 120 minutes are allowed). A short timeout frees SNAT ports
          quickly, which is what keeps a busy subnet from running out of them. Raise it for a
          client with a long-lived idle connection that cannot send keep-alives, knowing each
          held port is lost to every other machine behind the gateway.
        renders: idle_timeout_in_minutes / idleTimeoutInMinutes

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive diagnostics?"
          de: "Welcher Log Analytics Workspace soll die Diagnosedaten erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Its metrics go to {value}."
          de: "Seine Messwerte gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        from_deployment: diagnostics_destination
        per_environment: true
        why: >
          Inherited: one deployment, one destination. A NAT gateway has no logs, but its
          metrics are what show SNAT exhaustion and dropped packets, and that question comes
          during an incident rather than before one.
        renders: diagnostic_settings (Terraform) / a diagnostic setting on the gateway (authored; the Bicep module has none)

      - id: metrics_enabled
        ask:
          en: "Should all metrics be collected?"
          de: "Sollen alle Metriken erfasst werden?"
        type: bool
        plain:
          en: "Usage and performance figures are {value}."
          de: "Nutzungs- und Leistungswerte werden {value}."
        plain_values:
          true: { en: collected, de: erfasst }
          false: { en: not collected, de: nicht erfasst }
        default: true
        why: >
          `SNAT Connection Count` (failed attempts mean exhaustion), `Dropped Packets`, byte
          and packet counts. `AllMetrics` is cheap, and it is the only thing a NAT gateway
          emits - there is no log to fall back on.
        renders: diagnostic_settings.<key>.metrics[].category = "AllMetrics" / metricCategories[].category
