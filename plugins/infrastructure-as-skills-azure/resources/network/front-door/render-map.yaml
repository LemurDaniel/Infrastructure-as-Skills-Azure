# What each decision of questions.yaml renders to, per target and implementation.
# Format: core/iac-rendering/references/render-map.md. The call, the authored blocks and the
# tests are in terraform.md and bicep.md.
schema_version: 1
resource: Microsoft.Cdn/profiles

# The CDN profile module carries Front Door Standard and Premium; the Bicep network/front-door
# module is the deprecated classic one. Terraform keeps the WAF policy inside the profile module,
# Bicep calls it first as a module of its own.
modules:
  terraform: [Azure/avm-res-cdn-profile/azurerm]
  bicep: [avm/res/network/front-door-web-application-firewall-policy, avm/res/cdn/profile]

# The Azure resources besides `resource` the render creates for this set; an import adopts
# them by id (adopt.parts). Format: core/iac-rendering/references/render-map.md.
import_parts: [Microsoft.Network/FrontDoorWebApplicationFirewallPolicies]

decisions:

  # ---------------------------------------------------------------- placement
  placement.environments:
    not_rendered: naming parameter `environment` and the tag of that name; no attribute of the profile
  placement.location:
    terraform_avm: { gap: 'location = "global" on the profile, a constant whatever the answer - the module requires the argument' }
    terraform: { gap: 'azurerm_cdn_frontdoor_profile has no location argument - the profile is global (source: azurerm 5.12 schema)' }
    bicep_avm: { gap: "location: 'global' on the profile module, a constant whatever the answer" }
    bicep: { gap: "location: 'global' on Microsoft.Cdn/profiles, a constant whatever the answer" }
  placement.resource_group_name:
    terraform_avm:
      attribute: resource_group_name
      note: a name, not an id; front_door_firewall_policies.<k>.resource_group_name is a required member too
    terraform: { attribute: resource_group_name }
    bicep_avm: { gap: the deployment's resource group scope; no parameter }
    bicep: { gap: the deployment's resource group scope; no property }

  # ------------------------------------------------------------------ profile
  profile.sku:
    terraform_avm:
      attribute: sku
      passthrough: true
      note: module default Standard_AzureFrontDoor - written; the firewall policy's sku_name must match
    terraform: { attribute: azurerm_cdn_frontdoor_profile.sku_name, passthrough: true }
    bicep_avm:
      attribute: sku
      module: avm/res/cdn/profile
      passthrough: true
      note: required, no module default; the WAF policy module's sku must match
    bicep: { attribute: sku.name, passthrough: true }
  profile.response_timeout_seconds:
    terraform_avm: { attribute: response_timeout_seconds, passthrough: true, note: module default 120 (Bicep 60) - written }
    terraform: { attribute: azurerm_cdn_frontdoor_profile.response_timeout_seconds, passthrough: true }
    bicep_avm: { attribute: originResponseTimeoutSeconds, module: avm/res/cdn/profile, passthrough: true, note: module default 60 (Terraform 120) - written }
    bicep: { attribute: properties.originResponseTimeoutSeconds, passthrough: true }
  profile.managed_identity:
    terraform_avm:
      attribute: managed_identities
      values:
        none: null
        system_assigned: { expr: '{ system_assigned = true }' }
        user_assigned: { expr: '{ user_assigned_resource_ids = {profile.user_assigned_identity_ids} }' }
      note: none leaves the input out
    terraform:
      attribute: azurerm_cdn_frontdoor_profile.identity.type
      values: { none: null, system_assigned: SystemAssigned, user_assigned: UserAssigned }
      note: 'none renders no identity block (source: azurerm 5.12 docs)'
    bicep_avm:
      attribute: managedIdentities
      module: avm/res/cdn/profile
      values:
        none: null
        system_assigned: { expr: '{ systemAssigned: true }' }
        user_assigned: { expr: '{ userAssignedResourceIds: {profile.user_assigned_identity_ids} }' }
      note: none leaves the parameter out
    bicep:
      attribute: identity.type
      values: { none: null, system_assigned: SystemAssigned, user_assigned: UserAssigned }
      note: 'none renders no identity (source: bicep build, Microsoft.Cdn/profiles@2025-06-01; literals from module main.bicep 0.20.0)'
  profile.user_assigned_identity_ids:
    terraform_avm: { attribute: managed_identities.user_assigned_resource_ids }
    terraform: { attribute: azurerm_cdn_frontdoor_profile.identity.identity_ids, note: '(source: azurerm 5.12 schema)' }
    bicep_avm: { attribute: managedIdentities.userAssignedResourceIds, module: avm/res/cdn/profile }
    bicep: { attribute: identity.userAssignedIdentities, note: 'an object keyed by each id, { <id>: {} } - not the list (source: bicep build, Microsoft.Cdn/profiles@2025-06-01)' }

  # ----------------------------------------------------------------- delivery
  delivery.origins:
    terraform_avm:
      attribute: front_door_origin_groups, front_door_origins
      note: with front_door_endpoints and front_door_routes - the pattern's wiring
    terraform: { attribute: azurerm_cdn_frontdoor_origin_group, note: plus azurerm_cdn_frontdoor_origin }
    bicep_avm:
      attribute: 'originGroups[] = { name, origins: [ { name, hostName, sharedPrivateLinkResource } ] }'
      module: avm/res/cdn/profile
      note: member names from the README of the pinned version
    bicep: { attribute: child originGroups and originGroups/origins }
  delivery.origin_host_names:
    terraform_avm: { attribute: 'front_door_origins.<k>.host_name', note: 'one origin per host name, in the pattern''s origin group' }
    terraform: { attribute: azurerm_cdn_frontdoor_origin.host_name }
    bicep_avm: { attribute: 'originGroups[].origins[].hostName', module: avm/res/cdn/profile }
    bicep: { attribute: originGroups/origins properties.hostName }
  delivery.origin_connection:
    terraform_avm:
      attribute: 'front_door_origins.<k>.private_link'
      values:
        public: null
        private_link: { expr: '{ <key> = { request_message = "<message>", target_type = "<target_type>", location = "<origin location>", private_link_target_id = <origin resource id> } }' }
      note: 'a map of objects; the connection arrives pending on the origin''s resource - the handover names its approver (source: module README v0.1.9)'
    terraform:
      attribute: azurerm_cdn_frontdoor_origin.private_link
      values:
        public: null
        private_link: { expr: '{ request_message = "<message>", target_type = "<target_type>", location = "<origin location>", private_link_target_id = <origin resource id> }' }
      note: 'a block, public renders none; the connection arrives pending (source: azurerm 5.12 schema and docs)'
    bicep_avm:
      gap: >-
        private_link sets originGroups[].origins[].sharedPrivateLinkResource, public leaves it out;
        module README 0.20.0 types it as a bare object and names no member of it
    bicep:
      attribute: originGroups/origins properties.sharedPrivateLinkResource
      values:
        public: null
        private_link: { expr: "{ privateLink: { id: <origin resource id> }, privateLinkLocation: '<origin location>', groupId: '<group id>', requestMessage: '<message>' }" }
      note: 'the connection arrives pending on the origin''s resource (source: bicep build, Microsoft.Cdn/profiles/originGroups/origins@2025-06-01)'
  delivery.forwarding_protocol:
    terraform_avm: { attribute: 'front_door_routes.<k>.forwarding_protocol', passthrough: true, note: 'module default HttpsOnly (the README description says MatchRequest, the variable type HttpsOnly) - written' }
    terraform: { attribute: azurerm_cdn_frontdoor_route.forwarding_protocol, passthrough: true, note: 'default MatchRequest - written (source: azurerm 5.12 docs)' }
    bicep_avm: { attribute: 'afdEndpoints[].routes[].forwardingProtocol', module: avm/res/cdn/profile, passthrough: true, note: 'written, whatever the module default' }
    bicep: { attribute: afdEndpoints/routes properties.forwardingProtocol, passthrough: true, note: '(source: bicep build, Microsoft.Cdn/profiles/afdEndpoints/routes@2025-06-01; literals from module README 0.20.0)' }
  delivery.https_redirect:
    terraform_avm: { attribute: 'front_door_routes.<k>.https_redirect_enabled', passthrough: true }
    terraform: { attribute: azurerm_cdn_frontdoor_route.https_redirect_enabled, passthrough: true, note: 'true needs both Http and Https in supported_protocols (source: azurerm 5.12 docs)' }
    bicep_avm:
      attribute: 'afdEndpoints[].routes[].httpsRedirect'
      module: avm/res/cdn/profile
      values: { true: Enabled, false: Disabled }
      note: 'a string, not a bool (source: module README 0.20.0)'
    bicep:
      attribute: afdEndpoints/routes properties.httpsRedirect
      values: { true: Enabled, false: Disabled }
      note: '(source: bicep build, Microsoft.Cdn/profiles/afdEndpoints/routes@2025-06-01; literals from module README 0.20.0)'
  delivery.caching:
    terraform_avm:
      attribute: 'front_door_routes.<k>.cache'
      values:
        true: { expr: '{ <key> = { query_string_caching_behavior = "<query string behaviour of the route>" } }' }
        false: null
      note: 'a map of objects; left out (module default {}) caches nothing (source: module README v0.1.9)'
    terraform:
      attribute: azurerm_cdn_frontdoor_route.cache
      values:
        true: { expr: '{ query_string_caching_behavior = "<query string behaviour of the route>" }' }
        false: null
      note: 'a block; no block disables caching (source: azurerm 5.12 docs)'
    bicep_avm:
      attribute: 'afdEndpoints[].routes[].cacheConfiguration'
      module: avm/res/cdn/profile
      values:
        true: { expr: "{ queryStringCachingBehavior: '<query string behaviour of the route>' }" }
        false: null
      note: 'no object disables caching (source: module README 0.20.0)'
    bicep:
      attribute: afdEndpoints/routes properties.cacheConfiguration
      values:
        true: { expr: "{ queryStringCachingBehavior: '<query string behaviour of the route>' }" }
        false: null
      note: '(source: bicep build, Microsoft.Cdn/profiles/afdEndpoints/routes@2025-06-01)'
  delivery.custom_domains:
    terraform_avm: { attribute: 'front_door_custom_domains.<k> = { host_name, tls = { certificate_type, minimum_tls_version } }' }
    terraform: { attribute: azurerm_cdn_frontdoor_custom_domain }
    bicep_avm: { attribute: 'customDomains[] = { name, hostName, certificateType, minimumTlsVersion }', module: avm/res/cdn/profile }
    bicep: { attribute: child customDomains }
  delivery.certificate_source:
    terraform_avm:
      attribute: 'front_door_custom_domains.<k>.tls.certificate_type'
      values: { managed: ManagedCertificate, customer: CustomerCertificate }
    terraform:
      attribute: azurerm_cdn_frontdoor_custom_domain.tls.certificate_type
      values: { managed: ManagedCertificate, customer: CustomerCertificate }
    bicep_avm:
      attribute: 'customDomains[].certificateType'
      module: avm/res/cdn/profile
      values: { managed: ManagedCertificate, customer: CustomerCertificate }
    bicep:
      attribute: customDomains properties.tlsSettings.certificateType
      values: { managed: ManagedCertificate, customer: CustomerCertificate }
      note: '(source: bicep build, Microsoft.Cdn/profiles/customDomains@2025-06-01; literals from module README 0.20.0)'
  delivery.minimum_tls_version:
    terraform_avm: { attribute: 'front_door_custom_domains.<k>.tls.minimum_tls_version', passthrough: true }
    terraform: { attribute: azurerm_cdn_frontdoor_custom_domain.tls.minimum_tls_version, passthrough: true }
    bicep_avm: { attribute: 'customDomains[].minimumTlsVersion', module: avm/res/cdn/profile, passthrough: true }
    bicep: { attribute: customDomains properties.tlsSettings.minimumTlsVersion, passthrough: true, note: '(source: bicep build, Microsoft.Cdn/profiles/customDomains@2025-06-01)' }

  # ----------------------------------------------------------------- security
  security.waf_enabled:
    terraform_avm:
      attribute: front_door_firewall_policies
      values:
        true: { expr: '{ waf = { name, resource_group_name, sku_name, mode, custom_block_response_status_code = 403, custom_rules, managed_rules } }' }
        false: null
      also:
        true: front_door_security_policies = var.front_door_security_policies
      note: false renders neither input; the security policy binds the firewall policy to the endpoint and domains
    terraform:
      attribute: azurerm_cdn_frontdoor_security_policy.security_policies.firewall.cdn_frontdoor_firewall_policy_id
      values: { true: { expr: azurerm_cdn_frontdoor_firewall_policy.<name>.id }, false: null }
      note: 'true renders the firewall policy and the security policy (association.domain, patterns_to_match ["/*"]), false neither (source: azurerm 5.12 docs)'
    bicep_avm:
      attribute: securityPolicies
      module: avm/res/cdn/profile
      values:
        true: { expr: "[ { name: 'waf', wafPolicyResourceId: wafPolicy.outputs.resourceId, associations: securityPolicyAssociations } ]" }
        false: null
      note: true also calls the WAF policy module, bound by its id; false calls neither
    bicep:
      attribute: securityPolicies properties.parameters.wafPolicy.id
      values: { true: { expr: wafPolicy.id }, false: null }
      note: "true renders Microsoft.Network/FrontDoorWebApplicationFirewallPolicies and the child securityPolicies (type: 'WebApplicationFirewall', associations), false neither (source: bicep build, Microsoft.Cdn/profiles/securityPolicies@2025-06-01)"
  security.waf_mode:
    terraform_avm:
      attribute: 'front_door_firewall_policies.<k>.mode'
      passthrough: true
      note: resource_group_name, sku_name and mode are required members; sku_name equal to the profile's
    terraform: { attribute: azurerm_cdn_frontdoor_firewall_policy.mode, passthrough: true, note: '(source: azurerm 5.12 docs)' }
    bicep_avm: { attribute: policySettings.mode, module: avm/res/network/front-door-web-application-firewall-policy, passthrough: true }
    bicep: { attribute: policy properties.policySettings.mode, passthrough: true }
  security.waf_managed_rules:
    terraform_avm:
      attribute: 'front_door_firewall_policies.<k>.managed_rules'
      values:
        true: { expr: '{ default = { type = "Microsoft_DefaultRuleSet", version = "2.1", action = "Block" }, bots = { type = "Microsoft_BotManagerRuleSet", version = "1.1", action = "Block" } }' }
        false: null
      note: Premium only; false leaves the member out
    terraform:
      attribute: azurerm_cdn_frontdoor_firewall_policy.managed_rule
      values:
        true: { expr: '[{ type = "Microsoft_DefaultRuleSet", version = "2.1", action = "Block" }, { type = "Microsoft_BotManagerRuleSet", version = "1.1", action = "Block" }]' }
        false: null
      note: 'two managed_rule blocks, Premium only; false renders none (source: azurerm 5.12 docs)'
    bicep_avm:
      gap: >-
        true sets the policy module's managedRules.managedRuleSets (ruleSetType, ruleSetVersion,
        ruleSetAction) with Microsoft_DefaultRuleSet 2.1 and Microsoft_BotManagerRuleSet 1.1
        (Premium only); false is managedRules: { managedRuleSets: [] } - left out, the module
        default applies both sets (bot manager 1.0). Module README 0.3.3 shows no version 1.1
    bicep: { gap: "true sets the policy's properties.managedRules.managedRuleSets, false leaves it out; no Bicep source proves the bot manager version 1.1" }
  security.waf_rate_limit_per_minute:
    terraform_avm:
      attribute: 'front_door_firewall_policies.<k>.custom_rules.<r>.rate_limit_threshold'
      passthrough: true
      note: 'a custom rule: type = "RateLimitRule", action = "Block", rate_limit_duration_in_minutes = 1; custom_block_response_status_code = 403 on the policy'
    terraform:
      attribute: azurerm_cdn_frontdoor_firewall_policy.custom_rule.rate_limit_threshold
      passthrough: true
      note: 'a custom_rule with type = "RateLimitRule", action = "Block", rate_limit_duration_in_minutes = 1; 0 renders no rule (source: azurerm 5.12 docs)'
    bicep_avm:
      attribute: 'customRules.rules[].rateLimitThreshold'
      module: avm/res/network/front-door-web-application-firewall-policy
      passthrough: true
      note: "ruleType 'RateLimitRule', action 'Block', enabledState 'Enabled', rateLimitDurationInMinutes 1, matchConditions required; left out, the module default is a geo-filter rule; 0 renders no rule (source: module README 0.3.3)"
    bicep:
      attribute: 'properties.customRules.rules[].rateLimitThreshold'
      passthrough: true
      note: "on the policy, ruleType 'RateLimitRule', action 'Block'; 0 renders no rule (source: bicep build, Microsoft.Network/FrontDoorWebApplicationFirewallPolicies@2024-02-01; literals from module README 0.3.3)"

  # ------------------------------------------------------------ observability
  observability.diagnostic_workspace:
    terraform_avm: { attribute: 'diagnostic_settings.<key>.workspace_resource_id' }
    terraform: { attribute: azurerm_monitor_diagnostic_setting.log_analytics_workspace_id }
    bicep_avm: { attribute: 'diagnosticSettings[].workspaceResourceId', module: avm/res/cdn/profile }
    bicep: { attribute: Microsoft.Insights/diagnosticSettings properties.workspaceId, note: 'an extension resource with scope: the profile (source: bicep build, Microsoft.Insights/diagnosticSettings@2021-05-01-preview)' }
  observability.diagnostic_categories:
    terraform_avm:
      attribute: 'diagnostic_settings.<key>.log_categories'
      note: log_groups = [] beside the categories
    terraform: { attribute: azurerm_monitor_diagnostic_setting.enabled_log.category }
    bicep_avm: { attribute: 'diagnosticSettings[].logCategoriesAndGroups[].category', module: avm/res/cdn/profile }
    bicep: { attribute: 'Microsoft.Insights/diagnosticSettings properties.logs[].category', note: 'with enabled: true (source: bicep build, Microsoft.Insights/diagnosticSettings@2021-05-01-preview)' }
  observability.metrics_enabled:
    terraform_avm:
      attribute: 'diagnostic_settings.<key>.metric_categories'
      values: { true: { expr: '["AllMetrics"]' }, false: { expr: '[]' } }
    terraform:
      attribute: azurerm_monitor_diagnostic_setting.enabled_metric
      values: { true: { expr: '{ category = "AllMetrics" }' }, false: null }
      note: a block (azurerm 5.x); false renders no enabled_metric block
    bicep_avm:
      attribute: 'diagnosticSettings[].metricCategories'
      module: avm/res/cdn/profile
      values: { true: { expr: "[ { category: 'AllMetrics' } ]" }, false: { expr: '[]' } }
    bicep:
      attribute: 'Microsoft.Insights/diagnosticSettings properties.metrics[].category'
      values: { true: AllMetrics, false: null }
      note: 'with enabled: true; false renders no metrics entry (source: bicep build, Microsoft.Insights/diagnosticSettings@2021-05-01-preview)'
