schema_version: 1

resource: Microsoft.Network/virtualNetworks
title: Azure Virtual Network

naming:
  terraform: "Azure::Microsoft.Network/virtualNetworks"
  bicep: "Microsoft.Network/virtualNetworks"
  abbreviation: "vnet"

boundaries:
  - "Does not create the resource group. Expects one from the spec's context."
  - "Does not create peerings — both sides are involved, so a pattern or the platform owns them."
  - "Does not create network security groups or route tables. It records which subnets expect one."
  - "Does not resolve the address space. That is deployment.address_space, settled before this set runs."

groups:

  # ---------------------------------------------------------------- placement
  - id: placement
    title: Placement
    questions:
      - id: environments
        ask:
          en: "Which stages is this deployed to?"
          de: "In welche Stufen wird das ausgerollt?"
        type: list
        plain:
          en: "Deployed in the stages {value}."
          de: "Wird in den Stufen {value} ausgerollt."
        accepts: [development, test, qa, uat, integration, staging, preproduction, production, sandbox, demo, hotfix]
        answer: { context: environments }
        why: >
          Drives the rendered name and the strictness of several defaults below.

      - id: location
        ask:
          en: "Which Azure region?"
          de: "Welche Azure-Region?"
        type: string
        plain:
          en: "Runs in the Azure region {value}."
          de: "Läuft in der Azure-Region {value}."
        answer: { context: location }
        why: >
          A virtual network is regional. Resources in another region reach it only
          through peering or a gateway, which is a topology decision rather than a
          property of this network.

      - id: resource_group_name
        ask:
          en: "Which resource group?"
          de: "Welche Ressourcengruppe?"
        type: string
        plain:
          en: "Placed in the resource group {value}."
          de: "Liegt in der Ressourcengruppe {value}."
        accepts: { ref: resource_group }
        answer: { context: resource_group_name }
        per_environment: true
        why: >
          Not created here. A network usually outlives the workloads in it, which
          is an argument for a platform resource group rather than the
          application's.

  # ----------------------------------------------------------- address space
  - id: addressing
    title: Addressing
    questions:
      - id: address_space
        ask:
          en: "Which address range does the network use?"
          de: "Welchen Adressbereich verwendet das Netz?"
        type: string
        resolved_by: derived
        plain:
          en: "The network uses the address range {value}."
          de: "Das Netz nutzt den Adressbereich {value}."
        answer: { deployment: address_space }
        per_environment: true
        why: >
          Inherited, because it is a deployment-wide fact and the question that
          most often has an owner outside the room. It cannot be changed in place
          once subnets exist: every subnet carved out of the range has to be
          emptied and rebuilt, and an overlap is invisible until the first peering
          attempt refuses.

      - id: subnets
        ask:
          en: "Which subnets does the network need, and with which prefixes?"
          de: "Welche Subnetze braucht das Netz, und mit welchen Präfixen?"
        type: list
        plain:
          en: "Subnets: {value}."
          de: "Subnetze: {value}."
        required: true
        per_environment: true
        why: >
          No sensible default exists: the split depends on what is being deployed.
          Size against the number of addresses actually used — Azure reserves five
          per subnet, so a /29 holds three usable addresses, and a /27 is the
          smallest range that comfortably carries private endpoints. Growing a
          subnet later is only possible into free space adjacent to it, which is
          why leaving gaps is worth more than packing them tightly.

      - id: private_endpoint_subnet_prefix
        ask:
          en: "Which prefix carries the private endpoints?"
          de: "Welches Präfix trägt die Private Endpoints?"
        type: string
        resolved_by: derived
        plain:
          en: "Private connections get the subnet {value}."
          de: "Private Anbindungen bekommen das Subnetz {value}."
        answer: { deployment: private_endpoint_subnet_prefix }
        per_environment: true
        why: >
          One subnet holds the deployment's private endpoints, decided before this
          set runs so that no resource has to ask. One address per endpoint, so the
          prefix size is the endpoint budget.

      - id: dns_servers
        ask:
          en: "Which DNS servers should the network use?"
          de: "Welche DNS-Server soll das Netz verwenden?"
        type: list
        resolved_by: derived
        plain:
          en: "Custom name servers: {value} (none: Azure's own)."
          de: "Eigene Namensserver: {value} (keine: Azures eigene)."
        default: []
        per_environment: true
        why: >
          Empty means Azure-provided DNS, which is what resolves privatelink zones
          without further setup. Custom servers are for a hybrid network that has
          to resolve on-premises names — and then the privatelink zones must be
          forwarded to Azure DNS, or private endpoints resolve to their public
          addresses and the traffic leaves the network while looking fine.

  # ------------------------------------------------------------- subnet policy
  - id: subnet_policy
    title: Subnet policy
    questions:
      - id: private_endpoint_network_policies
        ask:
          en: "Should network policies apply to private endpoints in their subnet?"
          de: "Sollen Network Policies für Private Endpoints in ihrem Subnetz gelten?"
        type: enum
        plain:
          en: "Network rules {value} to private connections in their subnet."
          de: "Netzwerkregeln {value} für private Anbindungen in ihrem Subnetz."
        plain_values:
          Enabled: { en: "apply", de: "gelten" }
          Disabled: { en: "do not apply", de: "gelten nicht" }
          NetworkSecurityGroupEnabled: { en: "apply for security groups only", de: "gelten nur für Sicherheitsgruppen" }
          RouteTableEnabled: { en: "apply for routes only", de: "gelten nur für Routen" }
        accepts: [Disabled, Enabled, NetworkSecurityGroupEnabled, RouteTableEnabled]
        default: Enabled
        why: >
          Historically this had to be `Disabled` for an endpoint to work at all,
          and plenty of templates still carry that. It is no longer true: with
          `Enabled` the subnet's NSG and routes apply to endpoint traffic, which is
          what anyone would assume they do. Leaving it disabled means an NSG that
          looks like it protects the subnet and does not.

      - id: service_endpoints
        ask:
          en: "Which service endpoints should the subnets carry?"
          de: "Welche Service Endpoints sollen die Subnetze tragen?"
        type: list
        plain:
          en: "Shortcuts to Azure services from the subnets: {value}."
          de: "Abkürzungen zu Azure-Diensten aus den Subnetzen: {value}."
        accepts: [Microsoft.Storage, Microsoft.KeyVault, Microsoft.Sql, Microsoft.ServiceBus, Microsoft.EventHub, Microsoft.Web]
        default: []
        why: >
          Empty by default, because a service endpoint is the weaker posture: the
          resource stays publicly addressable and an ACL refuses the traffic. Use
          them where a private endpoint is not available for the service or not
          worth its cost, not as a cheaper equivalent.

      - id: subnet_delegations
        ask:
          en: "Which subnets are delegated to a service?"
          de: "Welche Subnetze sind an einen Dienst delegiert?"
        type: list
        plain:
          en: "Subnets handed to a service: {value}."
          de: "An einen Dienst übergebene Subnetze: {value}."
        default: []
        why: >
          A delegated subnet is handed to a service — App Service integration,
          Container Apps, managed databases — and the service then places its own
          resources in it. A delegation is effectively permanent: it cannot be
          removed while anything the service created is still there, and nothing
          else may use the subnet.

  # ----------------------------------------------------------------- security
  - id: security
    title: Security
    questions:
      - id: ddos_protection
        ask:
          en: "Should the network use a DDoS protection plan?"
          de: "Soll das Netz einen DDoS-Schutzplan verwenden?"
        type: bool
        resolved_by: derived
        plain:
          en: "A paid DDoS protection plan is {value}; Azure's basic protection applies either way."
          de: "Ein kostenpflichtiger DDoS-Schutzplan wird {value}; Azures Basisschutz gilt ohnehin."
        plain_values:
          true: { en: "used", de: "genutzt" }
          false: { en: "not used", de: "nicht genutzt" }
        default: false
        why: >
          Azure protects its infrastructure at the platform layer for free. A
          protection plan adds per-network mitigation tuning and attack reporting,
          and it is expensive enough that it belongs to a platform decision rather
          than a workload one — the plan is usually shared across a subscription.

      - id: ddos_protection_plan
        ask:
          en: "Which DDoS protection plan does the network use?"
          de: "Welchen DDoS-Schutzplan nutzt das Netz?"
        type: string
        resolved_by: derived
        plain:
          en: "The network is protected by the plan {value}."
          de: "Das Netz ist durch den Plan {value} geschützt."
        accepts: { ref: ddos_protection_plan }
        required: true
        depends_on: { question: ddos_protection, equals: true }
        per_environment: true
        why: >
          `ddos_protection: true` attaches the network to a plan, and the network takes the
          plan's id - the bool alone renders nothing. The plan is the ddos-protection-plan
          set's, usually the platform's and shared across a subscription; an id nobody can
          give is an `open:` entry, never a guess.

      - id: subnets_expecting_nsg
        ask:
          en: "Which subnets will have a network security group attached?"
          de: "An welche Subnetze wird eine Network Security Group angehängt?"
        type: list
        plain:
          en: "Subnets that will get a security group: {value}."
          de: "Subnetze, die eine Sicherheitsgruppe bekommen: {value}."
        default: []
        per_environment: true
        why: >
          Recorded rather than created: the NSG is a separate resource this set
          does not own, but a subnet expected to have one and silently without it
          is the gap worth naming. A delegated subnet is the usual legitimate
          exception.

  # ------------------------------------------------------------ observability
  - id: observability
    title: Observability
    questions:
      - id: diagnostic_workspace
        ask:
          en: "Which Log Analytics workspace should receive diagnostics?"
          de: "Welcher Log Analytics Workspace soll die Diagnosedaten erhalten?"
        type: string
        resolved_by: derived
        plain:
          en: "Network logs go to {value}."
          de: "Netzwerk-Logs gehen in {value}."
        accepts: { ref: log_analytics_workspace }
        answer: { deployment: diagnostics_destination }
        per_environment: true
        why: >
          Inherited: one deployment, one destination. Network diagnostics are what
          answers "was it ever reachable", and that question arrives during an
          incident rather than before one.

      - id: flow_logs_enabled
        ask:
          en: "Should NSG flow logs be collected?"
          de: "Sollen NSG-Flow-Logs erfasst werden?"
        type: bool
        plain:
          en: "A record of allowed and denied traffic is {value}."
          de: "Eine Aufzeichnung erlaubten und abgewiesenen Verkehrs wird {value}."
        plain_values:
          true: { en: "kept", de: "geführt" }
          false: { en: "not kept", de: "nicht geführt" }
        answer:
          question: priority
          map: { cost: false, balanced: false, protection: true }
        why: >
          Flow logs are the only record of which traffic was actually allowed or
          denied, so they are what a security investigation needs. They are also
          billed per gigabyte of flow data plus storage, and they require a
          Network Watcher and a storage account in the same region — enough moving
          parts that enabling them silently is the wrong default; they are on only when the
          customer put protection first.
