# The chatbot example with four resource groups (examples/chatbot-multi-rg/request.md). Everything
# below that is not a resource-group decision is the chatbot spec unchanged. The interview's
# output for the original request, run headless. One stage (the request
# said "nur Produktion"), a corp landing zone with a spoke network of its own, the platform's DNS
# and the workload's own workspace. Twelve kinds of resource, two of them twice: a `<set>__<instance>`
# key (spec.md, "Several of a kind") is a second resource of one kind. Every role between the
# resources is its identity.role_assignments entry: a principal is a user-assigned identity's
# resource key, or the key of a resource with a system-assigned identity.

