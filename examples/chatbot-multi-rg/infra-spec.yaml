open:
- key: deployment.deploy_mechanism
  question: Where does the code live, and which system deploys it? The request names none, so no pipeline is rendered.
  owner: workload owner
  blocks: apply
- key: context.tags
  question: Which tag set does the organisation apply? Nothing in the request, no repository to read it from.
  owner: workload owner
  blocks: apply
- key: wiring.entra_app_registration
  question: The Entra app registration and its client secret. A directory object, not an Azure resource - the identity team
    creates it; the secret goes into the key vault placeholder `entra-client-secret`.
  owner: identity team
  blocks: apply
- key: wiring.search_shared_private_link
  question: 'The search service indexes the uploads over a shared private link, approved on the storage account. Not rendered:
    wiring between two resources that no question set owns.'
  owner: workload owner
  blocks: apply
- key: resources.foundry.models.deployment_capacity
  question: Is there quota for gpt-4.1 and text-embedding-3-large as DataZoneStandard in West Europe, for 10,000 tokens per
    minute each? Not checked; a deployment beyond the quota fails at apply.
  owner: workload owner
  blocks: apply
- key: wiring.code_runner_image
  question: Is code-runner:1.0.0 pushed to the registry? The first revision pulls it while it is created, so the registry
    has to hold it before the app does.
  owner: workload owner
  blocks: apply
