schema_version: 1

spec:
  id: invoicing-prod
  target: terraform
  generated_by: infrastructure-as-skills-azure
  skill: azure-resources
  skill_version: 0.1.0
  at: 2026-10-18T14:00:00Z   # extension run: deployment.deploy_mechanism added

# Values every resource inherits. Resolved once, not per resource. The request named
# production; the stack development, test, production is the default, so "Produktion"
# is its production stage, and what the request stated is production's value - the
# other stages' subscriptions, groups and platform parts are open: entries, never guessed.
context:
  environments: [development, test, production]
  location: westeurope
  workload: invoicing
  subscription_id:
    production: 11111111-2222-3333-4444-555555555555
  resource_group_name:
    production: rg-invoicing-prod-we
  # Not stated, repository has none, nobody to ask (headless run) - see open:.
  tags: {}

# The deployment set's answers. Resolved once; every resource inherits them.
deployment:
  naming_convention:
    value: default
    source: default
  module_source:
    value: avm
    source: default         # Azure/avm-res-storage-storageaccount (terraform),
                            # br/public:avm/res/storage/storage-account (bicep);
                            # the versions are pinned in the renders, never here
  module_telemetry:
    value: enabled
    source: default
  deploy_mechanism:
    # The second request (request.pipeline.md): "Der Code liegt in GitHub."
    value: github
    source: stated
  pipeline_auth:
    value: workload_identity
    source: default
  pipeline_approvals:
    value: production
    source: default         # the production stage waits for a person; nothing else does
  stage_isolation:
    value: subscription
    source: default
  non_production_savings:
    value: enabled
    source: default
  # The requirements group - nothing in the request answered them, so each default
  # applies and derives the guardrail value below (storage-account.data_protection).
  outage_impact:
    value: disruptive
    source: default         # confirm_in production - applied, nobody to confirm
  data_loss_tolerance:
    value: one_week
    source: default
  data_access_pattern:
    value: active
    source: default
  backup_isolation:
    value: operational
    source: default
  data_residency:
    value: data_zone
    source: default
  landing_zone:
    # A referenced hub and central workspace say a platform exists, so standalone is
    # out; private exposure makes it corp. Forced by the references, not inferred.
    value: corp
    source: forced
    forced_by: deployment.network_ownership   # reference - vnet-hub-prod-we
  network_exposure:
    value: private
    source: stated          # "Zugriff nur aus dem Firmennetz"
  local_auth:
    value: disabled
    source: default         # confirm_in production - applied, nobody to confirm
  mandates:
    value: [BSI C5]
    source: stated
  key_protection:
    value: software
    source: default         # BSI C5 names no HSM requirement; not inferred
  key_management:
    value: platform_managed
    source: default         # confirm_in production
  network_ownership:
    value: reference
    source: stated
  existing_vnet:
    # Per stage: the platform's hub for each stage. Only production's was stated.
    value:
      production:
        name: vnet-hub-prod-we
        resource_group_name: rg-network-prod-we
    source: stated
  private_endpoint_subnet:
    value:
      production: snet-privatelink
    source: stated
  private_dns_ownership:
    value: platform
    source: default
  private_dns_records:
    value: policy
    source: default
  observability_ownership:
    value: reference
    source: stated
  diagnostics_destination:
    value:
      production:
        name: log-platform-prod-we
        resource_group_name: rg-observability-prod-we
    source: stated

# One resource, no modules/ in the repository -> one root.
composition:
  granularity: single
  source: default

resources:
  storage-account:
    networking:
      public_network_access:
        value: disabled
        source: deployment        # network_exposure: private
      private_endpoint_subnet:
        value:
          production: snet-privatelink
        source: deployment
      private_endpoint_subresources:
        value: [blob]
        source: default
      allow_azure_services_bypass:
        value: true
        source: default
    identity:
      managed_identity:
        value: system_assigned
        source: default
      role_assignments:
        # Consumer not named in the request. With shared keys off the account is
        # unreadable until one is assigned - see open:.
        value: []
        source: default
    security:
      shared_access_key_enabled:
        value: false
        source: deployment        # local_auth: disabled
      min_tls_version:
        value: TLS1_2
        source: default
      https_traffic_only:
        value: true
        source: default
      allow_blob_public_access:
        value: false
        source: default
      infrastructure_encryption_enabled:
        value: true
        source: default
      key_management:
        value: platform_managed
        source: deployment
      sftp_enabled:
        value: false
        source: default
    data_protection:
      replication:
        # Derived for production; development and test take the question's
        # non_production_default while non_production_savings is enabled.
        value: { development: LRS, test: LRS, production: ZRS }
        source: requirement       # confirm_in production
        derived_from: deployment.outage_impact
        non_production: default
      access_tier:
        value: Hot
        source: requirement
        derived_from: deployment.data_access_pattern
      blob_soft_delete_days:
        value: 7
        source: requirement
        derived_from: deployment.data_loss_tolerance
      container_soft_delete_days:
        value: 7
        source: requirement
        derived_from: deployment.data_loss_tolerance
      versioning_enabled:
        value: true
        source: requirement
        derived_from: deployment.data_loss_tolerance
      change_feed_enabled:
        value: false
        source: default
      point_in_time_restore_days:
        value: 0
        source: default
      immutability:
        value: none
        source: default
    observability:
      diagnostic_workspace:
        value:
          production:
            name: log-platform-prod-we
            resource_group_name: rg-observability-prod-we
        source: deployment
      diagnostic_categories:
        value: [audit]
        source: default
      metrics_enabled:
        value: true
        source: default

open:
  - key: context.subscription_id
    environments: [development, test]
    question: Which subscriptions do the development and test stages deploy into? The request named production's; the stack is one subscription per stage.
    owner: platform team
    blocks: apply
  - key: context.resource_group_name
    environments: [development, test]
    question: Which resource group does each of the other stages deploy into?
    owner: platform team
    blocks: apply
  - key: deployment.existing_vnet
    environments: [development, test]
    question: Which hub network do the development and test stages attach to?
    owner: platform team
    blocks: apply
  - key: deployment.private_endpoint_subnet
    environments: [development, test]
    question: Which subnet carries the private endpoints in the development and test hubs?
    owner: platform team
    blocks: apply
  - key: deployment.diagnostics_destination
    environments: [development, test]
    question: Which workspace receives the development and test stages' diagnostics?
    owner: platform team
    blocks: apply
  - key: resources.storage-account.networking.private_endpoint_subnet
    environments: [development, test]
    question: Follows deployment.private_endpoint_subnet per stage.
    owner: platform team
    blocks: apply
  - key: resources.storage-account.observability.diagnostic_workspace
    environments: [development, test]
    question: Follows deployment.diagnostics_destination per stage.
    owner: platform team
    blocks: apply
  - key: context.tags
    question: Which tag set does the organisation apply? Nothing in the request, no repository to read it from.
    owner: workload owner
    blocks: apply
  - key: resources.storage-account.identity.role_assignments
    question: Which principal reads and writes the invoices, and which data-plane role does it need? Shared-key auth is off, so an account with no assignment is working as specified and unusable.
    owner: workload owner
    blocks: apply
