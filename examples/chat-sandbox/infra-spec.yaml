schema_version: 1

spec:
  id: chat-sandbox
  target: terraform
  generated_by: infrastructure-as-skills-azure
  skill: azure-resources
  skill_version: 0.1
  at: '2026-10-24T15:00:00Z'

# One throwaway stage. location, subscription and resource group are parameters of the
# template that nobody named: open entries, placeholders in the stage file.
context:
  environments: [sandbox]
  language: en
  workload: chat
  tags: {}

deployment:
  # --- context ---
  non_production_savings:
    value: enabled
    source:  # a [sandbox] stack takes every non_production_default
      forced_by: deployment.environments
  naming_convention:
    value: default
    source: default

  # --- delivery ---
  deploy_mechanism:
    value: local
    source: asked  # "Von Hand" - a script, no pipeline
  deployer_roles:
    value:
    - role: Role Based Access Control Administrator
      scope: resource_group
      for:
      - resources.foundry.identity.role_assignments
      - resources.search-service.identity.role_assignments
      - resources.storage-account.identity.role_assignments
      - resources.key-vault.identity.role_assignments
    - role: Key Vault Secrets Officer
      scope: key-vault
      for: [resources.key-vault.security.secret_placeholders]
    source:
      forced_by:
      - resources.foundry.identity.role_assignments
      - resources.search-service.identity.role_assignments
      - resources.storage-account.identity.role_assignments
      - resources.key-vault.identity.role_assignments
      - resources.key-vault.security.secret_placeholders

  # --- requirements ---
  outage_impact:
    value: tolerable
    source: asked
  data_loss_tolerance:
    value: one_week
    source: asked
  data_access_pattern:
    value: active
    source: asked
  backup_isolation:
    value: operational
    source: asked
  data_residency:
    value: data_zone
    source: asked  # "Nur in der EU"

  # --- modules ---
  module_source:
    value: authored
    source: asked  # "Einzelne Ressourcen"
  naming_source:
    value: provider
    source: asked  # "Naming-Werkzeug des Plugins"

  # --- posture ---
  landing_zone:
    value: standalone
    source: default  # no landing zone, nothing referenced
  network_exposure:
    value: public
    source: asked
  local_auth:
    value: disabled
    source: default

  # --- compliance ---
  mandates:
    value: []
    source: asked
  key_protection:
    value: software
    source: default
  key_management:
    value: platform_managed
    source: default

  # --- network ---
  network_ownership:
    value: none
    source:  # public: nothing needs a subnet
      forced_by: deployment.network_exposure

  # --- dns ---
  private_dns_ownership:
    value: deployment
    source:  # standalone; no private endpoints, so no zones
      forced_by: deployment.landing_zone

  # --- observability ---
  observability_ownership:
    value: create
    source:  # standalone: no central workspace to reference
      forced_by: deployment.landing_zone
  diagnostics_destination:
    value:
      resource: log-analytics-workspace
    source:
      forced_by: deployment.observability_ownership
  log_retention_days:
    value: 30
    source: asked
  daily_quota_gb:
    value: -1
    source: default

composition:
  granularity: single
  source: default
  modules:
  - id: root
    contains: [app-service, foundry, search-service, storage-account, key-vault, log-analytics-workspace]
    implementation: authored

resources:
  app-service:
    meta:
      purpose:
        value: Chat application (Docker container)
        source: stated
    hosting:
      os_type:
        value: Linux
        source: default
      sku:
        value: B1
        source:  # non_production_default; no production stage in a [sandbox] stack
          forced_by: deployment.environments
      zone_redundant:
        value: false
        source:
          derived_from: deployment.outage_impact
      instance_count:
        value: 1
        source:
          derived_from: deployment.outage_impact
    networking:
      public_network_access:
        value: enabled
        source:
          overridden: departs from the deployment mapping public -> enabled_with_firewall; network_ownership is none, so the
            app's outbound addresses are public and change, and a firewall with no rules would lock the app out of its own
            backends
      vnet_integration:
        value: false
        source:
          forced_by: deployment.network_ownership
    identity:
      managed_identity:
        value: system_assigned
        source: default
    security:
      https_only:
        value: true
        source: default
      min_tls_version:
        value: '1.2'
        source: default
      ftps_state:
        value: Disabled
        source: default
      basic_auth_enabled:
        value: false
        source: deployment
    runtime:
      runtime_stack:
        value: container
        source: stated  # "ein docker container mit einer kleinen Anwendung"
      always_on:
        value: true
        source: default
      health_check_path:
        value: ''
        source: default
      http2_enabled:
        value: true
        source: default
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value:
        - AppServiceHTTPLogs
        - AppServiceAppLogs
        - AppServiceAuditLogs
        - AppServiceIPSecAuditLogs
        - AppServicePlatformLogs
        source: default
      metrics_enabled:
        value: true
        source: default

  foundry:
    meta:
      purpose:
        value: Chat and embedding models
        source: stated
    account:
      kind:
        value: AIServices
        source: default
      sku_name:
        value: S0
        source: default
      project_management:
        value: true
        source: default
      projects:
        value: [chat]
        source: stated  # "eine kleine Chatumgebung mit Foundry"
    models:
      deployment_sku:
        value: DataZoneStandard
        source:
          derived_from: deployment.data_residency
      deployment_capacity:
        value: 10
        source: default
      version_upgrade_option:
        value: OnceCurrentVersionExpired
        source: default
      content_filter:
        value: Microsoft.DefaultV2
        source: default
    networking:
      public_network_access:
        value: enabled
        source:
          overridden: departs from the deployment mapping public -> enabled_with_firewall; network_ownership is none, so the
            app's outbound addresses are public and change, and a firewall with no rules would lock the app out of its own
            backends
      restrict_outbound:
        value: true
        source: default
    identity:
      managed_identity:
        value: system_assigned
        source: default
      role_assignments:
        value:
          sandbox:
          - principal: app-service
            role: Cognitive Services OpenAI User
          - principal: search-service
            role: Cognitive Services OpenAI User
        source:  # the app calls the models, the search service embeds with them
          forced_by: wiring.access
    security:
      local_authentication_disabled:
        value: true
        source: deployment
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [Audit, RequestResponse, AzureOpenAIRequestUsage]
        source: default
      metrics_enabled:
        value: true
        source: default

  search-service:
    meta:
      purpose:
        value: Search index over the documents (RAG)
        source: stated
    service:
      sku:
        value: basic
        source:  # non_production_default
          forced_by: deployment.environments
      replica_count:
        value: 1
        source:
          derived_from: deployment.outage_impact
      partition_count:
        value: 1
        source: default
      semantic_ranker:
        value: free
        source: default
    networking:
      public_network_access:
        value: enabled
        source:
          overridden: departs from the deployment mapping public -> enabled_with_firewall; network_ownership is none, so the
            app's outbound addresses are public and change, and a firewall with no rules would lock the app out of its own
            backends
      network_rule_bypass:
        value: None
        source: default
    identity:
      managed_identity:
        value: system_assigned
        source: default
      role_assignments:
        value:
          sandbox:
          - principal: app-service
            role: Search Index Data Reader
        source:  # the app queries the index
          forced_by: wiring.access
    security:
      local_authentication_disabled:
        value: true
        source: deployment
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [OperationLogs]
        source: default
      metrics_enabled:
        value: true
        source: default

  storage-account:
    meta:
      purpose:
        value: Persistent data of the chat application
        source: stated
    networking:
      public_network_access:
        value: enabled
        source:
          overridden: departs from the deployment mapping public -> enabled_with_firewall; network_ownership is none, so the
            app's outbound addresses are public and change, and a firewall with no rules would lock the app out of its own
            backends
      private_endpoint_subresources:
        value: [blob]
        source: default
      allow_azure_services_bypass:
        value: true
        source: default
    identity:
      managed_identity:
        value: system_assigned
        source: default
      role_assignments:
        value:
          sandbox:
          - principal: app-service
            role: Storage Blob Data Contributor
          - principal: search-service
            role: Storage Blob Data Reader
        source:  # the app keeps its data here, the search service indexes it
          forced_by: wiring.access
    security:
      shared_access_key_enabled:
        value: false
        source: deployment
      min_tls_version:
        value: TLS1_2
        source: default
      https_traffic_only:
        value: true
        source: default
      allow_blob_public_access:
        value: false
        source: default
      infrastructure_encryption_enabled:
        value: true
        source: default
      key_management:
        value: platform_managed
        source: deployment
      sftp_enabled:
        value: false
        source: default
    data_protection:
      replication:
        value: LRS
        source:
          derived_from: deployment.outage_impact
      access_tier:
        value: Hot
        source:
          derived_from: deployment.data_access_pattern
      blob_soft_delete_days:
        value: 7
        source:
          derived_from: deployment.data_loss_tolerance
      container_soft_delete_days:
        value: 7
        source:
          derived_from: deployment.data_loss_tolerance
      versioning_enabled:
        value: true
        source:
          derived_from: deployment.data_loss_tolerance
      change_feed_enabled:
        value: false
        source: default
      point_in_time_restore_days:
        value: 0
        source: default
      immutability:
        value: none
        source: default
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [audit]
        source: default
      metrics_enabled:
        value: true
        source: default

  key-vault:
    meta:
      purpose:
        value: Client secret of the Entra app
        source: stated
    vault:
      sku:
        value: standard
        source: default
      purge_protection:
        value: false
        source:
          overridden: a throwaway sandbox is torn down and rebuilt; purge protection would reserve the vault name for the
            soft-delete window after every tear-down and cannot be switched off once on
      soft_delete_retention_days:
        value: 7
        source:
          overridden: the shortest window Azure allows, for the same reason - the name comes back after a week instead of
            a quarter; nothing in this vault is irreplaceable (one placeholder secret)
      rbac_authorization:
        value: true
        source: deployment
    networking:
      public_network_access:
        value: enabled
        source:
          overridden: departs from the deployment mapping public -> enabled_with_firewall; network_ownership is none, so the
            app's outbound addresses are public and change, and a firewall with no rules would lock the app out of its own
            backends
      network_acl_bypass:
        value: None
        source: default
    identity:
      role_assignments:
        value:
          sandbox:
          - principal: app-service
            role: Key Vault Secrets User
        source:  # the app reads the client secret at start
          forced_by: wiring.access
    security:
      enabled_for_services:
        value: []
        source: default
      secret_placeholders:
        value: [entra-client-secret]
        source: stated  # "Der Login soll mit client secret über eine Entra ID App laufen"
    keys:
      key_management:
        value: platform_managed
        source: deployment
    observability:
      diagnostic_workspace:
        value:
          resource: log-analytics-workspace
        source: deployment
      diagnostic_categories:
        value: [AuditEvent, AzurePolicyEvaluationDetails]
        source: default
      metrics_enabled:
        value: true
        source: default

  log-analytics-workspace:
    meta:
      purpose:
        value: Logs of all resources
        source: stated
    cost:
      retention_days:
        value: 30
        source: deployment
      daily_quota_gb:
        value: -1
        source: deployment
      sku:
        value: PerGB2018
        source: default
    access:
      public_network_access:
        value: enabled
        source: default
      local_auth:
        value: false
        source: deployment
      rbac_only_access:
        value: true
        source: default
    data_protection:
      immediate_purge_protection:
        value: true
        source: default
      archive_to_storage:
        value: false
        source: default

wiring:
  private_dns_zones:
    value: []
    source:  # no private endpoints, no zones
      forced_by: deployment.network_ownership
  access:
    value:
    - from: users
      to: app-service
      label: HTTPS 443
    - from: app-service
      to: external:entra-id
      label: Sign-in (client secret)
    - from: app-service
      to: foundry
    - from: app-service
      to: search-service
      label: Search
    - from: app-service
      to: storage-account
    - from: search-service
      to: storage-account
      label: indexes the documents
    - from: search-service
      to: foundry
      label: Embeddings
    - from: app-service
      to: key-vault
      label: reads the client secret
    source: stated

open:
- key: context.location
  environments: [sandbox]
  question: Which Azure region does the system run in? It also sets the region abbreviation in every name and must be in the
    EU (data_residency).
  owner: Workload-Team
  blocks: apply
- key: context.subscription_id
  environments: [sandbox]
  question: Which subscription is the sandbox deployed into?
  owner: Workload-Team
  blocks: apply
- key: context.resource_group_name
  environments: [sandbox]
  question: Which existing resource group is the sandbox deployed into?
  owner: Workload-Team
  blocks: apply
- key: resources.app-service.runtime.container_image
  environments: [sandbox]
  question: Which container image does the app run - registry, repository and a tag that is not "latest"? And which registry
    may the app pull it from with its identity?
  owner: Workload-Team
  blocks: apply
- key: resources.foundry.models.model_deployments
  environments: [sandbox]
  question: Which chat model and which embedding model, in which exact versions, with what quota? Looked up at render time
    against the region's catalogue as DataZoneStandard, never from memory.
  owner: Workload-Team
  blocks: apply
- key: wiring.entra_app_registration
  environments: [sandbox]
  question: The Entra app registration and its client secret. A directory object, not an Azure resource - the Identity-Team
    creates it; the secret goes into the Key Vault placeholder "entra-client-secret".
  owner: Identity-Team
  blocks: apply
