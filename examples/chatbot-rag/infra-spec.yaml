open:
- key: context.subscription_id
  environments: [development, test, production]
  question: 'Which subscription does each stage deploy into? One per stage (stage_isolation: subscription).'
  owner: workload owner
  blocks: apply
- key: context.resource_group_name
  environments: [development, test, production]
  question: Which resource group does each stage deploy into?
  owner: workload owner
  blocks: apply
- key: context.tags
  question: Which tag set does the organisation apply? Nothing stated, no repository to read it from.
  owner: workload owner
  blocks: apply
- key: deployment.address_space
  environments: [development, test, production]
  question: Which address range does each stage's new virtual network get?
  owner: network / IPAM owner
  blocks: apply
- key: deployment.private_endpoint_subnet_prefix
  environments: [development, test, production]
  question: Which prefix inside that range is the private endpoint subnet (snet-endpoints)?
  owner: network / IPAM owner
  blocks: apply
- key: resources.virtual-network.addressing.subnets
  environments: [development, test, production]
  question: Prefixes of the subnets snet-endpoints (private endpoints) and snet-web (App Service integration, delegated to
    Microsoft.Web/serverFarms), per stage.
  owner: network / IPAM owner
  blocks: apply
- key: resources.foundry.models.model_deployments
  question: Which chat model and which embedding model (name and version)? Regional, with quota - looked up at render time,
    never recalled.
  owner: workload owner
  blocks: apply
- key: resources.foundry.models.deployment_capacity
  question: Is there quota for the chosen models as DataZoneStandard in West Europe at 10,000 tokens per minute each? Not
    checked; a deployment beyond the quota fails at apply.
  owner: workload owner
  blocks: apply
- key: resources.app-service.runtime.runtime_stack
  question: Which runtime stack and version does the web app run (runtime_stack and runtime_version)?
  owner: workload owner
  blocks: apply
- key: resources.application-insights.networking.private_link_scope
  question: 'Which Azure Monitor Private Link Scope should the component belong to? Standalone: none exists, so it is built
    or the component stays open.'
  owner: workload owner
  blocks: apply
- key: resources.key-vault.identity.role_assignments
  question: Which principal reads which secrets? Nothing stated; with RBAC-only access a vault without assignment is working
    as specified and unusable.
  owner: workload owner
  blocks: apply
- key: resources.storage-account.identity.role_assignments
  question: Who uploads the documents, and which data-plane role does that principal need? Only the search service (reader)
    is assigned.
  owner: workload owner
  blocks: apply
- key: wiring.search_shared_private_link
  question: 'The search indexer reaches the storage account over a shared private link, approved on the account. Not rendered:
    wiring between two resources that no question set owns.'
  owner: workload owner
  blocks: apply
