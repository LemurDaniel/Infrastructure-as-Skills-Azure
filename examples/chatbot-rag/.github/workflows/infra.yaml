# Rendered from infra-spec.yaml (chatbot-rag). Platform prerequisites: see pipelines.github.md.
#
# Location: this example lives in examples/chatbot-rag; GitHub only reads <git-root>/.github/workflows,
# so copy both files there (the ./.github/workflows/infra-stage.yaml reference is repo-root relative).
# Working directory of every run step: examples/chatbot-rag. A repo whose root is the Terraform root
# drops the defaults.run block and the examples/chatbot-rag prefix in path filters and artifact paths.
#
# Platform prerequisites (created once by the platform team; the pipeline cannot run before):
#   Identity per stage (stage_isolation: subscription -> three identities, one subscription each):
#     id-chatrag-development, id-chatrag-test, id-chatrag-production (app registration or user-assigned
#     managed identity). Roles: the stage's subscription only (Contributor plus a role that may
#     create role assignments, e.g. Role Based Access Control Administrator, for res.roles.tf),
#     and Storage Blob Data Contributor on the state account/container.
#   Federated credential per identity: issuer https://token.actions.githubusercontent.com,
#     subject repo:<owner>/<repo>:environment:<stage>, audience api://AzureADTokenExchange.
#   GitHub environments:
#     development, test, production   variables below; deployment branches: master only
#     production-approval             required reviewers (pipeline_approvals: production -> only this stage)
#     (development-approval and test-approval are never used: gated is false there)
#   Variables per stage environment (plain variables, not secrets):
#     AZURE_CLIENT_ID, AZURE_TENANT_ID                          the stage's identity
#     TF_STATE_SUBSCRIPTION_ID, TF_STATE_RESOURCE_GROUP,
#     TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER              state backend; key chatrag/<stage>.tfstate
#   State account: exists beforehand, container exists, identities hold Storage Blob Data Contributor.
#   Subscription and resource group are not variables: the code reads them from
#     environments/<stage>.tfvars.
#
# Stages that still hold placeholders: development, test, production (open: subscription, resource
# group, address ranges, models, runtime - see infra-spec.yaml open:). Their plan job stops at
# "Refuse placeholder values"; the stage chain holds everything behind it.
name: Infrastructure

on:
  pull_request:
    paths: ["examples/chatbot-rag/**", ".github/workflows/infra*.yaml"]
  push:
    branches: [master]
    paths: ["examples/chatbot-rag/**", ".github/workflows/infra*.yaml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: examples/chatbot-rag

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Action majors and Terraform minor looked up 2026-10-24 (git ls-remote --tags).
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.17.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  development:
    needs: validate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/infra-stage.yaml
    permissions:
      contents: read
      id-token: write
    with:
      stage: development
      gated: false

  test:
    needs: development
    uses: ./.github/workflows/infra-stage.yaml
    permissions: { contents: read, id-token: write }
    with: { stage: test, gated: false }

  production:
    needs: test
    uses: ./.github/workflows/infra-stage.yaml
    permissions: { contents: read, id-token: write }
    with: { stage: production, gated: true }   # pipeline_approvals: production
