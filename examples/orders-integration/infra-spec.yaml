# The interview's output for examples/orders-integration/request.md, run headless. Three stages
# (the default stack), a standalone landing zone (own network, own private DNS zones, own workspace),
# private with named exceptions: Front Door and the gateway in front of it are internet-facing by
# design, the function app admits the Event Grid service tag, and the Standard tier of the Service Bus
# keeps a firewalled endpoint in development and test (Standard has no private endpoint). Fourteen kinds
# of resource, four of them more than once. Every role between them is a role_assignments entry on the
# resource it is held on. What the request leaves open is in open:, nothing is assumed.
