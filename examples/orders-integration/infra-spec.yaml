wiring:
  private_dns_zones:
    value:
    - privatelink.blob.core.windows.net
    - privatelink.dfs.core.windows.net
    - privatelink.queue.core.windows.net
    - privatelink.vaultcore.azure.net
    - privatelink.azurewebsites.net
    - scm.privatelink.azurewebsites.net
    - privatelink.servicebus.windows.net
    - privatelink.eventgrid.azure.net
    - privatelink.gwc.backup.windowsazure.com
    - azure-api.net
    source: forced
    forced_by: deployment.private_dns_ownership
  access:
    value:
    - from: users
      to: front-door
      label: HTTPS 443
    - from: front-door
      to: application-gateway
      label: AzureFrontDoor.Backend, X-Azure-FDID
    - from: application-gateway
      to: api-management
      label: HTTPS 443
    - from: api-management
      to: external:entra-id
      label: validate-jwt
    - from: api-management
      to: function-app
      label: backend
    - from: api-management
      to: key-vault
    - from: application-gateway
      to: key-vault
      label: TLS certificates
    - from: function-app
      to: storage-account__host
    - from: storage-account__orders
      to: event-grid-topic
      label: blob events
    - from: event-grid-topic
      to: function-app
      label: delivery as managed identity
    - from: event-grid-topic
      to: storage-account__orders
      label: dead letters
    - from: event-hubs
      to: storage-account__lake
      label: capture
    - from: backup-vault
      to: storage-account__orders
      label: blob backup
    source: stated
  purposes:
    value:
      front-door: Entry point with web application firewall
      application-gateway: Second firewall stage; reachable from Front Door only
      api-management: 'API gateway: JWT validation, rate limit per subscription, routing'
      function-app: Order API backend; receives the blob events
      service-bus: 'Order messaging: topic orders, queue payments'
      event-hubs: Telemetry stream, captured to the data lake
      event-grid-topic: Delivers blob events to the function app
      storage-account__orders: Order blobs; backed up. Kept apart from the data lake - blob backup does not take a hierarchical
        namespace
      storage-account__lake: Data lake (Data Lake Gen2) for the telemetry capture
      storage-account__host: State of the function app
      backup-vault: Blob backup of the orders account
      recovery-services-vault: Backup of virtual machines
      key-vault: Secrets and TLS certificates
      log-analytics-workspace: Central workspace for every diagnostic setting
      user-assigned-identity__func: Function app
      user-assigned-identity__gateway: Application gateway
      network-security-group__endpoints: Private endpoints subnet
      network-security-group__func: Function integration subnet
      network-security-group__gateway: Gateway subnet; Front Door in, API Management out
      network-security-group__apim: API Management subnet
    source: stated
  optional:
    value: []
    source: default
open:
- key: deployment.deploy_mechanism
  question: Where does the code live, and which system deploys it? The request names none, so no pipeline is rendered.
  owner: workload owner
  blocks: apply
- key: context.tags
  question: Which tag set does the organisation apply? Nothing in the request, no repository to read it from.
  owner: workload owner
  blocks: apply
- key: resources.function-app.hosting.runtime_stack
  question: Which runtime stack and version does the order function run (runtime_stack and runtime_version)?
  owner: workload owner
  blocks: apply
- key: resources.api-management.service.publisher_name
  question: 'Publisher name and e-mail of the API Management instance (publisher_name, publisher_email): the organisation,
    not the project.'
  owner: workload owner
  blocks: apply
- key: wiring.apim_jwt_validation
  question: Entra tenant and the app registration (audience) that validate-jwt checks the token against. A directory object,
    not an Azure resource - the identity team creates it.
  owner: identity team
  blocks: apply
- key: resources.application-gateway.networking.listeners
  question: Host name and TLS certificate of the listener, and the API Management gateway host name it forwards to. The certificate
    is a key vault secret the gateway identity reads.
  owner: workload owner
  blocks: apply
- key: resources.service-bus.entities.topics
  question: Which order types do the subscriptions billing, shipping and audit filter on? The filter rule is rendered from
    the values.
  owner: workload owner
  blocks: apply
- key: resources.service-bus.networking.ip_rules
  environments:
  - development
  - test
  question: Which addresses may reach the firewalled namespaces of development and test? Empty denies every public caller.
  owner: workload owner
  blocks: apply
- key: wiring.messaging_roles
  question: Which identities send to and receive from the topic orders, the queue payments and the event hub telemetry? Data
    Sender / Data Receiver per party; Owner is never granted.
  owner: workload owner
  blocks: apply
- key: wiring.blob_events_to_topic
  question: Blob events are emitted by a system topic on the storage account, which has no question set; the custom topic
    requested receives them only from a forwarding publisher. Which path is meant? Not rendered.
  owner: workload owner
  blocks: apply
- key: wiring.function_event_delivery_auth
  question: Delivery of events to the function with a managed identity needs the Entra application settings on the function
    app (audience of the event subscription). Not rendered.
  owner: identity team
  blocks: apply
- key: resources.storage-account__lake.data_protection.hierarchical_namespace
  question: Storage account with hierarchical namespace (Data Lake Gen2) - not a question in the storage account set, and
    not convertible after creation. Decided with the render.
  owner: engineer
  blocks: apply
- key: resources.blob-container__orders.containers.container_names
  question: Which containers hold the order blobs? Only the dead-letter container is known.
  owner: workload owner
  blocks: apply
- key: resources.backup-vault.vault.resource_guard
  environments:
  - production
  question: 'Resource Guard for the production backup vault (multi-user authorization): the id of a guard in another subscription,
    held by the security team.'
  owner: security team
  blocks: apply
- key: resources.recovery-services-vault.vault.resource_guard
  environments:
  - production
  question: Resource Guard for the production recovery services vault.
  owner: security team
  blocks: apply
- key: resources.recovery-services-vault.protection.protected_resources
  question: Which virtual machines does the vault protect? The request names no machine and the deployment has none.
  owner: workload owner
  blocks: apply
- key: resources.front-door.delivery.data_residency
  question: Front Door is a global service and cannot keep requests in the data zone. Does the data owner accept the edge
    locations?
  owner: data owner
  blocks: apply
