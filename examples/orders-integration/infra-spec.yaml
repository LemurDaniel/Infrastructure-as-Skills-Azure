schema_version: 1

spec:
  id: order-platform
  target: terraform
  generated_by: infrastructure-as-skills-azure
  skill: iac-authoring
  skill_version: 0.1.0
  at: 2026-10-25T00:00:00Z

context:
  environments: [development, test, production]
  language: de
  location: germanywestcentral
  workload: orders

deployment:
  # --- resource_groups ---
  resource_group_split: {value: [network, data, observability], source: asked}
  resource_group_mode_main: {value: create, source: asked}
  resource_group_mode_network: {value: create, source: asked}
  resource_group_mode_data: {value: create, source: asked}
  resource_group_mode_observability: {value: create, source: asked}
  resource_lock: {value: production, source: asked}

  # --- delivery ---
  deploy_mechanism: {value: github, source: asked}
  pipeline_auth: {value: workload_identity, source: default}
  pipeline_approvals: {value: production, source: default}
  deployer_roles:
    value:
    - role: Contributor
      scope: subscription
      for:
      - deployment.resource_group_mode_main
      - deployment.resource_group_mode_network
      - deployment.resource_group_mode_data
      - deployment.resource_group_mode_observability
    source: forced
    forced_by:
    - deployment.resource_group_mode_main
    - deployment.resource_group_mode_network
    - deployment.resource_group_mode_data
    - deployment.resource_group_mode_observability

  # --- requirements ---
  network_requirements: {value: free, source: asked}
  outage_impact: {value: tolerable, source: asked}
  data_loss_tolerance: {value: one_month, source: asked}
  data_access_pattern: {value: active, source: asked}
  backup_isolation:
    value: {development: isolated, test: isolated, production: immutable}
    source: overridden
    reason: Customer named the stage split explicitly - immutable in production, isolated in development and test.
  data_residency: {value: data_zone, source: asked}

  # --- modules ---
  module_source: {value: avm, source: asked}
  naming_source: {value: provider, source: asked}

  # --- posture ---
  network_exposure: {value: private_with_exceptions, source: stated}
  local_auth: {value: disabled, source: stated}

  # --- compliance ---
  mandates: {value: [], source: asked}

  # --- observability ---
  log_retention_days: {value: {development: 30, test: 30, production: 90}, source: stated}

composition:
  granularity: per-family
  source: default
  modules:
  - id: network
    contains: [virtual-network, front-door, application-gateway]
  - id: integration
    contains: [api-management, function-app]
    needs: [network]
  - id: messaging
    contains: [service-bus, event-hubs, event-grid-topic]
    needs: [network, storage]
  - id: storage
    contains: [storage-account]
    needs: [network]
  - id: recovery
    contains: [backup-vault, recovery-services-vault]
    needs: [storage]
  - id: observability
    contains: [log-analytics-workspace]
  - id: security
    contains: [key-vault]
    needs: [network]

resources:
  front-door:
    profile:
      sku: {value: Premium_AzureFrontDoor, source: stated}
    delivery:
      origins: {value: [application-gateway], source: stated}
      origin_connection:
        value: public
        source: overridden
        reason: Application Gateway has no Private Link origin; it is locked to the AzureFrontDoor.Backend tag and the X-Azure-FDID
          header.
    security:
      waf_managed_rules: {value: true, source: stated}

  application-gateway:
    gateway:
      waf_enabled: {value: true, source: stated}
    networking:
      frontend_exposure:
        value: public
        source: overridden
        reason: Reached by Front Door over its public IP, restricted to the AzureFrontDoor.Backend service tag and the X-Azure-FDID
          header.

  api-management:
    service:
      sku: {value: {development: Developer, test: Developer, production: Premium}, source: stated}
      managed_identity: {value: system_assigned, source: stated}
    access:
      caller_authentication: {value: entra_id, source: stated}
      apis:
        value:
        - {name: orders, backend: function-app}
        source: stated
    networking:
      network_integration: {value: internal, source: stated}

  function-app:
    networking:
      public_network_access: {value: disabled, source: deployment}

  service-bus:
    namespace:
      sku:
        value: {development: Standard, test: Standard, production: Premium}
        source: overridden
        reason: Customer named the stage split explicitly - Premium in production, Standard otherwise.
      local_auth: {value: disabled, source: stated}
    entities:
      queues:
        value:
        - {name: payments, dead_lettering: true, duplicate_detection: true}
        source: stated
      topics:
        value:
        - name: orders
          subscriptions: [billing, shipping, audit]
          filter: order-type
        source: stated
    networking:
      public_network_access:
        value: {development: enabled_with_firewall, test: enabled_with_firewall, production: disabled}
        source: overridden
        reason: Standard has no private endpoint; the customer chose a firewalled public endpoint in development and test.

  event-hubs:
    entities:
      partition_count: {value: 4, source: stated}
      message_retention_days: {value: 7, source: stated}
      event_archive: {value: true, source: stated}
      archive_storage_account: {value: storage-account, source: stated}
    networking:
      public_network_access: {value: disabled, source: deployment}

  event-grid-topic:
    topic:
      managed_identity: {value: system_assigned, source: stated}
    delivery:
      event_subscriptions:
        value:
        - {name: blob-events, source: storage-account, target: function-app}
        source: stated

  storage-account:
    networking:
      public_network_access: {value: disabled, source: deployment}
    security:
      shared_access_key_enabled: {value: false, source: deployment}
    data_protection:
      hierarchical_namespace: {value: true, source: stated}

  backup-vault:
    vault:
      storage_redundancy:
        value: {development: LocallyRedundant, test: LocallyRedundant, production: GeoRedundant}
        source: stated
      cross_region_restore:
        value: {development: false, test: false, production: true}
        source: overridden
        reason: Customer asked for cross-region restore in production only.
    protection:
      protected_resources:
        value:
        - {name: storage-account, kind: blob}
        source: stated

  recovery-services-vault:
    vault:
      storage_redundancy:
        value: {development: LocallyRedundant, test: LocallyRedundant, production: GeoRedundant}
        source: stated
      cross_region_restore:
        value: {development: false, test: false, production: true}
        source: overridden
        reason: Customer asked for cross-region restore in production only.
      soft_delete: {value: Enabled, source: stated}

  log-analytics-workspace:
    cost:
      retention_days: {value: {development: 30, test: 30, production: 90}, source: stated}

  key-vault:
    vault:
      rbac_authorization: {value: true, source: deployment}

  virtual-network:
    addressing:
      address_space:
        value: {development: 10.100.0.0/22, test: 10.100.4.0/22, production: 10.100.8.0/22}
        source: asked

wiring:
  access:
    value:
    - {from: internet, to: front-door, label: HTTPS 443}
    - {from: front-door, to: application-gateway, label: 'HTTPS, nur Front Door'}
    - {from: application-gateway, to: api-management, label: HTTPS intern}
    - {from: api-management, to: function-app, label: Backend-Routing}
    - {from: function-app, to: service-bus, label: Entra-Login}
    - {from: event-hubs, to: storage-account, label: Capture}
    - {from: event-grid-topic, to: function-app, label: Blob-Events}
    - {from: storage-account, to: event-grid-topic, label: Blob-Events}
    - {from: backup-vault, to: storage-account, label: Blob-Backup}
    source: stated
  purposes:
    value:
      front-door: Öffentlicher Eingang mit WAF
      application-gateway: WAF vor APIM
      api-management: API-Schicht
      function-app: Bestell-Backend
      service-bus: Bestellnachrichten
      event-hubs: Telemetrie
      event-grid-topic: Blob-Events
      storage-account: Telemetrie-Ablage
      backup-vault: Blob-Backup
      recovery-services-vault: VM-Backup
      log-analytics-workspace: Zentrale Logs
      key-vault: Secrets
    source: stated

open:
- key: context.subscription_id
  environments: [development, test, production]
  question: In welche Subscription wird jede Stufe ausgerollt?
  owner: Workload-Owner
  blocks: apply
- key: deployment.private_dns_ownership
  question: Wem gehören die privaten DNS-Zonen, und gibt es zentrale?
  owner: Plattform-Team
  blocks: apply
