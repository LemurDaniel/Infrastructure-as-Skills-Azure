schema_version: 1

spec:
  id: order-platform
  target: terraform
  generated_by: infrastructure-as-skills-azure
  plugin_version: 0.1.0
  at: 2026-10-26T12:00:00Z

context:
  environments: [development, test, production]
  language: de
  location: germanywestcentral  # parameterized: variable location, supplied by the stage file
  workload: orders  # parameterized
  subscription_id: parameterized  # per stage, supplied by environments/<stage>.tfvars
  resource_group_name: parameterized

deployment:
  # --- context ---
  stage_isolation: {value: subscription, source: default}
  non_production_savings: {value: enabled, source: default}

  # --- resource_groups ---
  resource_group_split: {value: [network, data, application, observability], source: asked}
  resource_group_mode_main: {value: create, source: asked}
  resource_group_mode_network: {value: create, source: asked}
  resource_group_mode_data: {value: create, source: asked}
  resource_group_mode_application: {value: create, source: asked}
  resource_group_mode_observability: {value: create, source: asked}
  resource_group_lock: {value: production, source: default}
  resource_lock: {value: production, source: default}

  # --- delivery ---
  deploy_mechanism: {value: github, source: asked}
  pipeline_auth: {value: workload_identity, source: default}
  pipeline_approvals: {value: production, source: default}

  # --- requirements ---
  network_requirements: {value: free, source: asked}
  outage_impact: {value: tolerable, source: asked}
  data_loss_tolerance: {value: reproducible, source: asked}
  data_access_pattern: {value: active, source: asked}
  backup_isolation: {value: operational, source: asked}
  data_residency: {value: data_zone, source: asked}
  priority: {value: balanced, source: asked}

  # --- modules ---
  module_source: {value: avm, source: asked}
  naming_source: {value: module, source: asked}  # Azure/naming/azurerm
  module_telemetry: {value: disabled, source: default}

  # --- posture ---
  landing_zone: {value: standalone, source: requirement, derived_from: deployment.network_requirements}
  network_exposure:
    value: private_with_exceptions
    source: asked
    exceptions: [front-door]  # the only public surface; everything behind it is private
  local_auth:
    value: disabled
    source: default
    exceptions: [api-management]  # caller_authentication: subscription_key was chosen, see resources.api-management

  # --- compliance ---
  mandates: {value: [DSGVO], source: asked}
  key_protection: {value: software, source: default}
  key_management: {value: platform_managed, source: default}

  # --- network ---
  network_ownership: {value: create, source: forced, forced_by: deployment.network_exposure}
  address_space: {value: {development: 10.100.0.0/23, test: 10.101.0.0/23, production: 10.102.0.0/23}, source: asked}

  # --- dns ---
  private_dns_ownership: {value: deployment, source: forced, forced_by: deployment.landing_zone}

  # --- observability ---
  observability_ownership: {value: create, source: forced, forced_by: deployment.landing_zone}
  log_retention_days: {value: 30, source: default}
  daily_quota_gb: {value: -1, source: default}

composition:
  granularity: per-family
  source: default
  modules:
  - id: network
    contains:
    - virtual-network
    - network-security-group__appgw
    - network-security-group__apim
    - network-security-group__workload
    - network-security-group__pe
    - public-ip-address__appgw
    - private-dns-zone
    - application-gateway
    - front-door
    inputs: [environment, location, workload]
    outputs: [vnet_id, subnet_ids, appgw_backend_fqdn, front_door_id]
  - id: security
    contains: [user-assigned-identity__function, user-assigned-identity__appgw]
    outputs: [identity_ids]
  - id: observability
    contains: [log-analytics-workspace]
    outputs: [workspace_id]
  - id: data
    contains: [storage-account__datalake, storage-account__host, blob-container]
    needs: [network, observability]
    outputs: [datalake_id, host_storage_id]
  - id: messaging
    contains: [service-bus, event-hubs, event-grid-system-topic]
    needs: [network, observability, data, app]
    outputs: [service_bus_id, event_hubs_id]
  - id: app
    contains: [api-management, function-app, virtual-machine]
    needs: [network, security, observability, data]
    outputs: [apim_gateway_url, function_app_id, vm_ids]
  - id: recovery
    contains: [backup-vault, recovery-services-vault]
    needs: [network, data, app]
    outputs: [backup_vault_id, recovery_vault_id]

resources:
  virtual-network:
    addressing:
      subnets: {value: [appgw, apim, function-integration, workload, private-endpoints], source: default}
      private_endpoint_subnet_prefix: {value: first /27 of each stage's range, source: default}
    security:
      subnets_expecting_nsg: {value: [appgw, apim, function-integration, workload, private-endpoints], source: default}

  network-security-group__appgw:
    rules:
      subnet_purpose: {value: workload, source: default}

  network-security-group__apim:
    rules:
      subnet_purpose: {value: workload, source: default}

  network-security-group__workload:
    rules:
      subnet_purpose: {value: workload, source: default}

  network-security-group__pe:
    rules:
      subnet_purpose: {value: private_endpoints, source: default}

  public-ip-address__appgw:
    address:
      purpose: {value: application_gateway, source: default}

  private-dns-zone:
    zones:
      value:
      - privatelink.blob.core.windows.net
      - privatelink.dfs.core.windows.net
      - privatelink.queue.core.windows.net
      - privatelink.azurewebsites.net
      - privatelink.servicebus.windows.net
      - privatelink.azure-api.net
      source: forced
      forced_by: deployment.private_dns_ownership

  application-gateway:
    gateway:
      waf_enabled: {value: true, source: default}
      waf_mode: {value: Prevention, source: default}
      capacity_min: {value: 1, source: requirement, derived_from: deployment.outage_impact}
      zone_redundant: {value: false, source: requirement, derived_from: deployment.outage_impact}
    networking:
      frontend_exposure:
        value: public
        source: overridden
        reason: Front Door (Premium) cannot reach an Application Gateway through Private Link; the gateway keeps a public
          IP that only admits the AzureFrontDoor.Backend service tag and the Front Door id header. Default is private.
      listeners: {value: [], source: default}

  front-door:
    profile:
      sku: {value: Premium_AzureFrontDoor, source: default}
    delivery:
      origin_connection:
        value: public
        source: overridden
        reason: Origin is the Application Gateway, which Front Door cannot reach over Private Link. Default is private_link.
      caching: {value: true, source: asked}
    security:
      waf_enabled: {value: true, source: default}
      waf_mode: {value: Prevention, source: default}

  user-assigned-identity__function: {}

  user-assigned-identity__appgw: {}

  log-analytics-workspace:
    cost:
      retention_days: {value: 30, source: deployment}

  api-management:
    service:
      sku: {value: Developer, source: requirement, derived_from: deployment.outage_impact}
    access:
      caller_authentication: {value: subscription_key, source: asked}
      rate_limit_calls_per_minute: {value: 600, source: default}
      developer_portal: {value: false, source: default}
    networking:
      network_integration: {value: internal, source: default}

  function-app:
    hosting:
      plan_type: {value: flex_consumption, source: default}
      zone_redundant: {value: false, source: requirement, derived_from: deployment.outage_impact}
      always_ready_instances: {value: 0, source: requirement, derived_from: deployment.outage_impact}
    networking:
      public_network_access:
        value: enabled_with_firewall
        source: overridden
        reason: Event Grid delivers blob events to the function over its public endpoint; access is restricted to the AzureEventGrid
          and ApiManagement service tags (the app is otherwise private). Deployment default is disabled.

  storage-account__datalake:
    networking:
      private_endpoint_subresources: {value: [blob, dfs], source: forced, forced_by: deployment.network_exposure}
    data_protection:
      replication: {value: LRS, source: requirement, derived_from: deployment.outage_impact}
      access_tier: {value: Hot, source: requirement, derived_from: deployment.data_access_pattern}
      blob_soft_delete_days: {value: 0, source: requirement, derived_from: deployment.data_loss_tolerance}
      container_soft_delete_days: {value: 0, source: requirement, derived_from: deployment.data_loss_tolerance}
      versioning_enabled: {value: false, source: requirement, derived_from: deployment.data_loss_tolerance}
    storage_kind: {value: data_lake, source: stated}

  storage-account__host:
    networking:
      private_endpoint_subresources: {value: [blob, queue], source: forced, forced_by: deployment.network_exposure}
    data_protection:
      replication: {value: LRS, source: requirement, derived_from: deployment.outage_impact}

  blob-container:
    containers:
      container_names: {value: [telemetry], source: assumed}

  service-bus:
    namespace:
      sku:
        value: Premium
        source: forced
        forced_by: deployment.network_exposure  # private endpoints need Premium
      zone_redundant: {value: false, source: requirement, derived_from: deployment.outage_impact}
    entities:
      queues: {value: [payments], source: stated}
      topics:
        value:
        - name: orders
          subscriptions: [billing, shipping, audit]
        source: stated
      message_ordering: {value: false, source: asked}
      duplicate_protection: {value: true, source: asked}

  event-hubs:
    namespace:
      sku: {value: Standard, source: default}
    entities:
      event_hubs: {value: [telemetry], source: stated}
      event_archive: {value: true, source: stated}
      archive_storage_account: {value: storage-account__datalake, source: stated}
    recovery:
      zone_redundant: {value: false, source: requirement, derived_from: deployment.outage_impact}

  event-grid-system-topic:
    source:
      source_resource: {value: storage-account__datalake, source: stated}
      topic_type: {value: Microsoft.Storage.StorageAccounts, source: stated}
    delivery:
      destination_kind: {value: azure_function, source: stated}
      included_event_types: {value: [Microsoft.Storage.BlobCreated], source: assumed}

  virtual-machine:
    machine:
      os_type: {value: Linux, source: asked}
    data_protection:
      backup_enabled:
        value: true
        source: overridden
        reason: The customer asked for VM backup; the derived value from data_loss_tolerance "reproducible" would be false.
    instances: {value: 3, source: assumed}  # "a few VMs"

  backup-vault:
    vault:
      immutability: {value: Disabled, source: requirement, derived_from: deployment.backup_isolation}
      multi_user_authorization: {value: false, source: requirement, derived_from: deployment.backup_isolation}
    protection:
      protected_resources: {value: [storage-account__datalake], source: stated}

  recovery-services-vault:
    vault:
      soft_delete: {value: Enabled, source: requirement, derived_from: deployment.backup_isolation}
    protection:
      protected_resources: {value: [virtual-machine], source: stated}

wiring:
  access:
    value:
    - {from: internet, to: front-door, label: HTTPS 443}
    - {from: front-door, to: application-gateway, label: HTTPS}
    - {from: application-gateway, to: api-management, label: HTTPS}
    - {from: api-management, to: function-app, label: HTTPS}
    - {from: function-app, to: service-bus, label: Bestellungen und Zahlungen senden}
    - {from: service-bus, to: function-app, label: 'Billing, Shipping, Audit verarbeiten'}
    - {from: 'external:Telemetrie-Quellen', to: event-hubs, label: Telemetrie senden}
    - {from: event-hubs, to: storage-account__datalake, label: Archiv (Capture)}
    - {from: storage-account__datalake, to: event-grid-system-topic, label: Blob-Ereignisse}
    - {from: event-grid-system-topic, to: function-app, label: Ereignisse zustellen}
    - {from: backup-vault, to: storage-account__datalake, label: sichert}
    - {from: recovery-services-vault, to: virtual-machine, label: sichert}
    source: stated
  purposes:
    value:
      front-door: Öffentlicher Eingang mit WAF
      application-gateway: Zweite WAF, nimmt nur Front Door an
      api-management: Bestell-API
      function-app: Backend der API
      service-bus: Bestellungen und Zahlungen
      event-hubs: Telemetrie
      storage-account__datalake: Telemetrie-Archiv
      event-grid-system-topic: Blob-Ereignisse
      virtual-machine: Virtuelle Maschinen
      backup-vault: Sicherung Speicher
      recovery-services-vault: Sicherung VMs
    source: stated

open:
- key: resources.api-management.service.publisher_name
  question: Welcher Organisationsname soll in API Management erscheinen?
  owner: Workload-Verantwortliche
  blocks: apply
- key: resources.api-management.service.publisher_email
  question: Welche Kontaktadresse erhält die Benachrichtigungen von API Management?
  owner: Workload-Verantwortliche
  blocks: apply
- key: resources.function-app.hosting.runtime_stack
  question: Welche Laufzeit und Version nutzt die Function App (z. B. Node 20, .NET isolated)?
  owner: Entwicklung
  blocks: apply
- key: resources.application-gateway.networking.listeners
  question: Welche Domänen und TLS-Zertifikate gelten für das Application Gateway, und wer erneuert sie?
  owner: Workload-Verantwortliche
  blocks: apply
- key: resources.virtual-machine.machine.size
  question: 'Wofür laufen die VMs, und welche Größe und Anzahl brauchen sie? (Annahme: 3 × Standard_D2ds_v5)'
  owner: Workload-Verantwortliche
  blocks: apply
- key: resources.virtual-machine.security.ssh_public_key
  question: Welcher öffentliche SSH-Schlüssel gilt für die VMs?
  owner: Workload-Verantwortliche
  blocks: apply
