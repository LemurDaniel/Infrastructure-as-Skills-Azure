# Gerendert aus infra/infra-spec.yaml (workload: orders). Pipeline-Referenz: pipelines.github.md.
# Versionen (Snapshot 2026-10-18): checkout v7, setup-terraform v4, upload-artifact v7,
# download-artifact v8, azure/login v3, Terraform ~> 1.16.0.
#
# Deployable Root: infra/ (alle Schritte laufen mit working-directory infra). Workflows liegen im Repo-Root.
#
# PLATTFORM-VORAUSSETZUNGEN (einmalig, nicht Teil des Renders):
#  1. Identitaet je Stage (stage_isolation: subscription -> je eine Identitaet + Subscription pro Stage,
#     App Registration oder user-assigned Managed Identity) mit Rollen NUR auf der Subscription der Stage
#     (Contributor, ggf. RBAC-Admin fuer Rollenzuweisungen im Code) und 'Storage Blob Data Contributor'
#     auf dem State Storage Account.
#  2. Federated Credential je Identitaet: issuer https://token.actions.githubusercontent.com,
#     subject repo:<owner>/<repo>:environment:<stage>   (development | test | production).
#     Subject-Form pruefen: gh api repos/<owner>/<repo>/actions/oidc/customization/sub
#     (bei immutable subjects: repo:<owner>@<id>/<repo>@<id>:environment:<stage>). Hier: Name-only-Form angenommen.
#  3. GitHub Environments: development, test, production (Deployment branches: nur Default-Branch main)
#     und production-approval (Required reviewers = Approval-Check; nur production, pipeline_approvals: production).
#     Fuer development/test wird kein -approval-Environment gebraucht (ungated, Job wird uebersprungen).
#  4. Variablen (plain Variables, keine Secrets) je Environment development/test/production:
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, TF_STATE_SUBSCRIPTION_ID, TF_STATE_RESOURCE_GROUP,
#     TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER. (Die Deployment-Subscription kommt aus environments/<stage>.tfvars.)
#  5. State Storage Account mit Container (Key: orders/<stage>.tfstate), Zugriff per Entra ID (use_oidc).
#  6. Stages mit Platzhaltern: environments/*.tfvars enthalten noch OPEN-Werte und/oder die Null-GUID. Der erste Schritt
#     "Refuse placeholder values" laesst die Stage scheitern, Folge-Stages laufen nicht. Erst die open:-Punkte der Spec beantworten.
name: Infrastructure

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra*.yaml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra*.yaml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: infra

jobs:
  validate:
    runs-on: ubuntu-latest   # kein Azure-Credential, kein id-token
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.16.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test
      - name: Module tests
        run: |
          for m in network security observability data messaging app recovery; do
            echo "::group::modules/$m"
            terraform -chdir="modules/$m" init -backend=false -input=false
            terraform -chdir="modules/$m" test
            echo "::endgroup::"
          done

  development:
    needs: validate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/infra-stage.yaml
    permissions: { contents: read, id-token: write }
    with: { stage: development, gated: false }

  test:
    needs: development
    uses: ./.github/workflows/infra-stage.yaml
    permissions: { contents: read, id-token: write }
    with: { stage: test, gated: false }

  production:
    needs: test
    uses: ./.github/workflows/infra-stage.yaml
    permissions: { contents: read, id-token: write }
    with: { stage: production, gated: true }   # pipeline_approvals: production
